<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Wreck It King - 冰龙觉醒</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #090712;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; }
        .nipple .back { opacity: 0.22 !important; }
        .nipple .front { opacity: 0.58 !important; }
        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
        }
        #player-hud {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: 14px;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 12px 7px 7px;
            color: white;
            background: rgba(8, 7, 18, 0.72);
            border: 1px solid rgba(115, 210, 255, 0.55);
            border-radius: 34px 12px 12px 34px;
            backdrop-filter: blur(5px);
        }
        #portrait {
            position: relative;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 3px solid #63d7ff;
            background: radial-gradient(circle at 50% 35%, #65c9ff 0 20%, #152e72 22% 52%, #07122f 54%);
            box-shadow: 0 0 14px rgba(64, 201, 255, 0.7);
        }
        #portrait::after {
            content: "";
            position: absolute;
            left: 11px;
            right: 11px;
            bottom: 5px;
            height: 19px;
            border-radius: 50% 50% 35% 35%;
            background: #1e6fa0;
        }
        #hud-info { min-width: 92px; }
        #power {
            font-size: 23px;
            line-height: 25px;
            font-weight: 900;
            text-shadow: 0 0 10px #7bdfff;
        }
        #power-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #98cbe1;
        }
        #hp-track {
            width: 96px;
            height: 6px;
            margin-top: 4px;
            border-radius: 5px;
            overflow: hidden;
            background: rgba(255,255,255,0.18);
        }
        #hp-fill {
            width: 100%;
            height: 100%;
            background: #58e486;
            transition: width 0.2s;
        }
        #coin-hud {
            position: fixed;
            top: max(19px, env(safe-area-inset-top));
            right: 14px;
            width: 112px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 0 14px;
            color: white;
            font-size: 25px;
            font-weight: 900;
            background: rgba(8, 7, 18, 0.78);
            border: 1px solid rgba(255, 197, 50, 0.4);
            border-radius: 22px 8px 8px 22px;
        }
        .coin-icon {
            width: 27px;
            height: 27px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #a35d00;
            font-size: 17px;
            background: #ffd339;
            border: 3px solid #ffed8a;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 196, 0, 0.7);
        }
        #objective {
            position: absolute;
            top: max(84px, calc(env(safe-area-inset-top) + 84px));
            left: 50%;
            transform: translateX(-50%);
            max-width: min(86vw, 460px);
            padding: 9px 18px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 2px 4px black;
            background: rgba(13, 8, 28, 0.68);
            border: 1px solid rgba(163, 111, 255, 0.55);
            border-radius: 22px;
            transition: transform 0.25s, opacity 0.25s;
        }
        #boss-hud {
            position: absolute;
            top: max(132px, calc(env(safe-area-inset-top) + 132px));
            left: 50%;
            width: min(82vw, 520px);
            transform: translateX(-50%);
            display: none;
            text-align: center;
            color: white;
            text-shadow: 0 2px 4px black;
        }
        #boss-name { font-family: Georgia, serif; font-size: 24px; font-weight: 900; }
        #boss-title { margin: 2px 0 5px; font-size: 11px; color: #d6c9e4; }
        #boss-level { position: absolute; left: 0; bottom: 10px; font-weight: 900; }
        #boss-bar {
            position: relative;
            height: 17px;
            margin-left: 52px;
            overflow: hidden;
            background: #1a111c;
            border: 2px solid rgba(255,255,255,0.65);
            border-radius: 10px;
        }
        #boss-fill {
            width: 100%;
            height: 100%;
            background: #d91d35;
            transition: width 0.15s;
        }
        #boss-hp-text {
            position: absolute;
            inset: -1px 0 0 52px;
            font-size: 11px;
            line-height: 17px;
            font-weight: 900;
        }
        #tutorial {
            position: absolute;
            left: 50%;
            bottom: max(28px, calc(env(safe-area-inset-bottom) + 28px));
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: white;
            font-weight: 800;
            text-shadow: 0 2px 6px black;
            transition: opacity 0.35s;
        }
        #tutorial-ring {
            position: relative;
            width: 104px;
            height: 104px;
            border: 2px dashed rgba(255,255,255,0.7);
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
        }
        #tutorial-hand {
            position: absolute;
            left: 38px;
            top: 32px;
            width: 28px;
            height: 38px;
            border-radius: 15px 15px 8px 8px;
            background: white;
            transform-origin: center bottom;
            animation: drag 1.7s ease-in-out infinite;
        }
        #tutorial-hand::before {
            content: "";
            position: absolute;
            left: 9px;
            top: -19px;
            width: 11px;
            height: 27px;
            border-radius: 8px;
            background: white;
        }
        @keyframes drag {
            0%,100% { transform: translate(0, 8px) rotate(-8deg); }
            35% { transform: translate(25px, -14px) rotate(6deg); }
            70% { transform: translate(-22px, -8px) rotate(-5deg); }
        }
        #restart {
            position: absolute;
            right: 14px;
            bottom: max(14px, calc(env(safe-area-inset-bottom) + 14px));
            pointer-events: auto;
            padding: 8px 11px;
            color: rgba(255,255,255,0.82);
            background: rgba(8,7,18,0.62);
            border: 1px solid rgba(255,255,255,0.24);
            border-radius: 8px;
            cursor: pointer;
        }
        #toast {
            position: absolute;
            left: 50%;
            top: 24%;
            transform: translate(-50%, -50%) scale(0.85);
            padding: 11px 20px;
            color: white;
            font-size: 21px;
            font-weight: 900;
            text-align: center;
            text-shadow: 0 2px 5px #000;
            background: rgba(16, 9, 35, 0.82);
            border: 2px solid #9a69ff;
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }
        #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        #labels {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }
        #guide-arrow {
            position: absolute;
            width: 42px;
            height: 42px;
            display: none;
            align-items: center;
            justify-content: center;
            color: #ffe36c;
            font-size: 31px;
            font-weight: 900;
            text-shadow: 0 0 9px #ff9d00, 0 2px 4px #000;
            transform: translate(-50%, -50%);
            transition: left 0.1s linear, top 0.1s linear;
        }
        .world-label {
            position: absolute;
            transform: translate(-50%, -100%);
            min-width: 116px;
            padding: 7px 10px;
            color: white;
            font-weight: 900;
            text-align: center;
            text-shadow: 0 2px 3px #000;
            background: rgba(9, 8, 20, 0.82);
            border: 2px solid #ffd749;
            border-radius: 10px;
            transition: border-color 0.2s, background 0.2s;
        }
        .world-label.ready {
            background: rgba(24, 104, 50, 0.88);
            border-color: #65ff91;
            box-shadow: 0 0 16px rgba(82,255,125,0.55);
        }
        .world-label .zone-name { font-size: 13px; }
        .world-label .zone-cost { margin-top: 3px; color: #ffe56e; font-size: 19px; }
        #damage-layer {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }
        .damage {
            position: absolute;
            color: white;
            font-size: 23px;
            font-weight: 900;
            text-shadow: -2px -2px 0 #221526, 2px -2px 0 #221526, -2px 2px 0 #221526, 2px 2px 0 #221526;
            animation: floatDamage 0.8s ease-out forwards;
        }
        .damage.big { color: #86eaff; font-size: 29px; }
        @keyframes floatDamage {
            from { opacity: 1; transform: translate(-50%, -50%) scale(0.75); }
            25% { transform: translate(-50%, -80%) scale(1.16); }
            to { opacity: 0; transform: translate(-50%, -165%) scale(0.92); }
        }
        #end-screen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px;
            color: white;
            text-align: center;
            background: rgba(9, 5, 20, 0.94);
        }
        #end-screen.show { display: flex; animation: fadeIn 0.45s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #brand {
            color: #ffd56a;
            font-family: Georgia, serif;
            font-size: clamp(38px, 10vw, 64px);
            line-height: 0.95;
            font-weight: 900;
            text-shadow: 0 0 22px rgba(255, 166, 36, 0.65);
        }
        #end-title { margin: 22px 0 8px; font-size: 27px; font-weight: 900; }
        #end-copy { max-width: 420px; margin: 0 0 24px; color: #d8cced; line-height: 1.6; }
        .end-button {
            width: min(82vw, 330px);
            margin: 6px;
            padding: 15px;
            color: #211400;
            font-size: 19px;
            font-weight: 900;
            background: #ffd351;
            border: 0;
            border-radius: 9px;
            cursor: pointer;
            pointer-events: auto;
        }
        .end-button.secondary {
            color: white;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.4);
        }
        @media (max-width: 440px) {
            #player-hud { transform: scale(0.88); transform-origin: left top; }
            #coin-hud { width: 100px; }
            #objective { top: 76px; font-size: 14px; }
            #boss-hud { top: 118px; }
            #boss-name { font-size: 20px; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
</head>
<body>
    <div id="ui">
        <div id="player-hud">
            <div id="portrait"></div>
            <div id="hud-info">
                <div id="power">1,241</div>
                <div id="power-label">POWER</div>
                <div id="hp-track"><div id="hp-fill"></div></div>
            </div>
        </div>
        <div id="coin-hud"><span class="coin-icon">$</span><span id="coin-count">0</span></div>
        <div id="objective">击碎晶体，收集金币</div>
        <div id="boss-hud">
            <div id="boss-name">Cyclopean Beast</div>
            <div id="boss-title">Imprisoned Lord of Fire</div>
            <div id="boss-level">Lvl 30</div>
            <div id="boss-bar"><div id="boss-fill"></div></div>
            <div id="boss-hp-text">300,300 / 300,300</div>
        </div>
        <div id="tutorial">
            <div id="tutorial-ring"><div id="tutorial-hand"></div></div>
            <div>按住屏幕拖动移动</div>
        </div>
        <div id="toast"></div>
        <div id="labels"></div>
        <div id="guide-arrow">▲</div>
        <div id="damage-layer"></div>
        <button id="restart">重新开始</button>
    </div>
    <div id="end-screen">
        <div id="brand">CALL OF<br>DRAGONS</div>
        <div id="end-title">冰龙已经觉醒</div>
        <p id="end-copy">统领魔幻生物，建设你的领地，征服更强大的敌人。</p>
        <button id="download" class="end-button">立即下载</button>
        <button id="replay" class="end-button secondary">再玩一次</button>
    </div>

    <script>
        (() => {
            "use strict";

            const CONFIG = {
                playerSpeed: 8.8,
                playerAcceleration: 10.5,
                playerDeceleration: 15,
                playerRadius: 0.62,
                playerClearance: 3.15,
                attackRange: 4.2,
                mineRange: 1.35,
                attackCooldown: 0.62,
                upgradedCooldown: 0.5,
                campCost: 10,
                weaponCost: 10,
                expandCost: 10,
                dragonCost: 25,
                bossDisplayHp: 300300,
                bossInternalHp: 12000,
                worldMinX: -12,
                worldMaxX: 12,
                worldMinZ: -31,
                worldMaxZ: 20
            };

            const PHASE = {
                WAITING: "waiting",
                START_COINS: "start_coins",
                BUILD_CAMP: "build_camp",
                MINE_GOLEM: "mine_golem",
                FIRST_GOLEM: "first_golem",
                WEAPON: "weapon",
                MINE_STRONG: "mine_strong",
                STRONG_GOLEM: "strong_golem",
                EXPAND: "expand",
                MINE_BOSS: "mine_boss",
                BOSS_PRESSURE: "boss_pressure",
                HATCH: "hatch",
                BOSS_FINAL: "boss_final",
                REWARD: "reward",
                COMPLETE: "complete"
            };

            let scene, camera, renderer, clock;
            let player, playerVisual, playerWeapon, playerRing, playerCape, dragon, boss;
            let playerLeftLeg, playerRightLeg, playerLeftArm, playerRightArm;
            let phase = PHASE.WAITING;
            let coins = 0;
            let playerHp = 100;
            let power = 1241;
            let weaponLevel = 1;
            let attackTimer = 0;
            let dragonAttackTimer = 0;
            let bossAttackTimer = 1.8;
            let bossThresholdTriggered = false;
            let firstInput = false;
            let endScheduled = false;
            let futureZonesShown = false;
            let cameraShake = 0;
            let cameraMinePunch = 0;
            let audioCtx = null;
            let attackSequence = 0;
            let attackLunge = 0;
            const moveVelocity = new THREE.Vector3();
            const cameraFocus = new THREE.Vector3();

            const keys = { w: false, a: false, s: false, d: false };
            const stick = { x: 0, z: 0, magnitude: 0 };
            const enemies = [];
            const targets = [];
            const coinDrops = [];
            const lockedCoins = [];
            const projectiles = [];
            const hazards = [];
            const effects = [];
            const zones = [];
            const campColliders = [];
            const mineColliders = [];
            const mineGates = {};
            const camp = { stage: 0, group: null, egg: null, platform: null };

            const ui = {
                coin: document.getElementById("coin-count"),
                power: document.getElementById("power"),
                hp: document.getElementById("hp-fill"),
                objective: document.getElementById("objective"),
                boss: document.getElementById("boss-hud"),
                bossFill: document.getElementById("boss-fill"),
                bossText: document.getElementById("boss-hp-text"),
                tutorial: document.getElementById("tutorial"),
                toast: document.getElementById("toast"),
                labels: document.getElementById("labels"),
                guide: document.getElementById("guide-arrow"),
                end: document.getElementById("end-screen")
            };

            const shared = {};

            function init() {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0d0918);
                scene.fog = new THREE.FogExp2(0x0d0918, 0.021);

                camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 300);
                camera.position.set(0, 25.5, 34.5);

                renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
                renderer.setSize(innerWidth, innerHeight);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.outputEncoding = THREE.sRGBEncoding;
                document.body.insertBefore(renderer.domElement, document.body.firstChild);

                clock = new THREE.Clock();
                createSharedAssets();
                createLights();
                createDungeon();
                createPlayer();
                createCampGhost();
                createLinearMineGates();
                setupInput();
                updateUI();
                animate();
            }

            function createSharedAssets() {
                shared.box = new THREE.BoxGeometry(1, 1, 1);
                shared.sphere = new THREE.SphereGeometry(1, 10, 8);
                shared.rock = new THREE.DodecahedronGeometry(1, 0);
                shared.coin = new THREE.CylinderGeometry(0.34, 0.34, 0.1, 16);
                shared.coinProjection = new THREE.CircleGeometry(0.34, 18);
                shared.coinMat = new THREE.MeshStandardMaterial({
                    color: 0xffc928, metalness: 0.72, roughness: 0.24, emissive: 0x5c2a00
                });
                shared.lockedCoinMat = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    map: createCoinProjectionTexture(),
                    transparent: true,
                    opacity: 0.96,
                    depthTest: false,
                    depthWrite: false
                });
                shared.mineDustTexture = createMineDustTexture();
                shared.stoneMat = new THREE.MeshStandardMaterial({ color: 0x39343e, roughness: 0.92 });
                shared.wallMat = new THREE.MeshStandardMaterial({ color: 0x625b68, roughness: 0.9 });
                shared.crystalMat = new THREE.MeshStandardMaterial({
                    color: 0x672694, emissive: 0x24053e, roughness: 0.28, metalness: 0.08
                });
                shared.crystalGlowMat = new THREE.MeshStandardMaterial({
                    color: 0xbd54e8, emissive: 0x5c0b83, roughness: 0.2
                });
                shared.mineMassMat = new THREE.MeshPhysicalMaterial({
                    color: 0x61268b,
                    emissive: 0x200532,
                    emissiveIntensity: 0.85,
                    roughness: 0.24,
                    metalness: 0.05,
                    clearcoat: 0.82,
                    clearcoatRoughness: 0.2,
                    transparent: true,
                    opacity: 0.96,
                    depthWrite: true,
                    side: THREE.DoubleSide
                });
                shared.mineSilhouetteMat = new THREE.MeshBasicMaterial({
                    color: 0x211326,
                    transparent: true,
                    opacity: 0.46,
                    depthTest: false,
                    depthWrite: false
                });
                shared.redMat = new THREE.MeshBasicMaterial({
                    color: 0xff2b30, transparent: true, opacity: 0.33, side: THREE.DoubleSide
                });
            }

            function createCoinProjectionTexture() {
                const canvas = document.createElement("canvas");
                canvas.width = 128;
                canvas.height = 128;
                const context = canvas.getContext("2d");
                context.clearRect(0, 0, 128, 128);
                context.shadowColor = "#ff7b18";
                context.shadowBlur = 14;
                context.fillStyle = "#ffad31";
                context.beginPath();
                context.arc(64, 64, 49, 0, Math.PI * 2);
                context.fill();
                context.shadowBlur = 0;
                context.strokeStyle = "#ffd878";
                context.lineWidth = 7;
                context.beginPath();
                context.arc(64, 64, 43, 0, Math.PI * 2);
                context.stroke();
                context.strokeStyle = "#b85b22";
                context.lineWidth = 5;
                context.beginPath();
                context.arc(64, 64, 29, 0, Math.PI * 2);
                context.stroke();
                context.lineCap = "round";
                context.lineJoin = "round";
                context.beginPath();
                context.moveTo(43, 68);
                context.quadraticCurveTo(48, 46, 64, 49);
                context.quadraticCurveTo(82, 50, 84, 65);
                context.quadraticCurveTo(81, 82, 65, 80);
                context.lineTo(65, 60);
                context.moveTo(52, 67);
                context.lineTo(65, 78);
                context.lineTo(77, 66);
                context.stroke();
                const texture = new THREE.CanvasTexture(canvas);
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                return texture;
            }

            function createMineDustTexture() {
                const canvas = document.createElement("canvas");
                canvas.width = 128;
                canvas.height = 128;
                const context = canvas.getContext("2d");
                const gradient = context.createRadialGradient(64, 64, 4, 64, 64, 62);
                gradient.addColorStop(0, "rgba(225,128,239,0.78)");
                gradient.addColorStop(0.22, "rgba(176,67,213,0.58)");
                gradient.addColorStop(0.58, "rgba(87,25,128,0.3)");
                gradient.addColorStop(1, "rgba(55,13,82,0)");
                context.fillStyle = gradient;
                context.fillRect(0, 0, 128, 128);
                const texture = new THREE.CanvasTexture(canvas);
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                return texture;
            }

            function createLights() {
                scene.add(new THREE.HemisphereLight(0x5a55a0, 0x17101d, 1.25));
                const moon = new THREE.DirectionalLight(0x9ac7ff, 1.35);
                moon.position.set(-20, 35, 18);
                moon.castShadow = true;
                moon.shadow.mapSize.set(1024, 1024);
                moon.shadow.camera.left = -35;
                moon.shadow.camera.right = 35;
                moon.shadow.camera.top = 35;
                moon.shadow.camera.bottom = -35;
                scene.add(moon);
                const purple = new THREE.PointLight(0xb22cff, 2.4, 38);
                purple.position.set(-17, 5, -5);
                scene.add(purple);
            }

            function createDungeon() {
                const ground = new THREE.Mesh(
                    new THREE.PlaneGeometry(54, 82),
                    new THREE.MeshStandardMaterial({ color: 0x27242b, roughness: 0.96 })
                );
                ground.rotation.x = -Math.PI / 2;
                ground.position.z = -7;
                ground.receiveShadow = true;
                scene.add(ground);

                const grid = new THREE.GridHelper(82, 41, 0x443c50, 0x302b35);
                grid.position.y = 0.015;
                grid.position.z = -7;
                grid.material.transparent = true;
                grid.material.opacity = 0.16;
                scene.add(grid);

                const rand = seededRandom(9347);
                for (let i = 0; i < 28; i++) {
                    const z = -29 + rand() * 47;
                    const halfWidth = corridorHalfWidth(z);
                    const pebble = new THREE.Mesh(shared.rock, shared.stoneMat);
                    pebble.scale.setScalar(0.16 + rand() * 0.35);
                    pebble.position.set(
                        (rand() * 2 - 1) * Math.max(1.2, halfWidth - 1.1),
                        0.18,
                        z
                    );
                    pebble.rotation.set(rand() * 3, rand() * 3, rand() * 3);
                    pebble.castShadow = true;
                    scene.add(pebble);
                }
            }

            function corridorHalfWidth(z) {
                if (z > 10) return 4.1;
                if (z > 0) return 6.8;
                if (z > -8) return 5.25;
                if (z > -17) return 5.7;
                return 7.1;
            }

            function seededRandom(seed) {
                return () => {
                    seed = (seed * 9301 + 49297) % 233280;
                    return seed / 233280;
                };
            }

            function createMineBlobMesh(scale, material, seed) {
                const geometry = new THREE.SphereGeometry(1, 24, 16);
                const positions = geometry.attributes.position;
                for (let i = 0; i < positions.count; i++) {
                    const x = positions.getX(i);
                    const y = positions.getY(i);
                    const z = positions.getZ(i);
                    const phase = seed * 0.017;
                    const broad = Math.sin(x * 2.7 + phase) * Math.cos(y * 2.1 - phase * 0.7);
                    const detail = Math.sin((x + z) * 5.2 + phase * 1.3) * 0.35;
                    const variation = 1 + (broad + detail) * 0.045;
                    positions.setXYZ(i, x * variation, y * variation, z * variation);
                }
                positions.needsUpdate = true;
                geometry.computeVertexNormals();
                const mesh = new THREE.Mesh(geometry, material);
                mesh.scale.copy(scale);
                mesh.castShadow = false;
                mesh.receiveShadow = true;
                return mesh;
            }

            function createRoundedRectShape(width, height, radius) {
                const x = -width / 2;
                const y = -height / 2;
                const r = Math.min(radius, width * 0.24, height * 0.24);
                const shape = new THREE.Shape();
                shape.moveTo(x + r, y);
                shape.lineTo(x + width - r, y);
                shape.quadraticCurveTo(x + width, y, x + width, y + r);
                shape.lineTo(x + width, y + height - r);
                shape.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
                shape.lineTo(x + r, y + height);
                shape.quadraticCurveTo(x, y + height, x, y + height - r);
                shape.lineTo(x, y + r);
                shape.quadraticCurveTo(x, y, x + r, y);
                return shape;
            }

            function createBeveledSlabMesh(width, height, depth, radius, material) {
                const geometry = new THREE.ExtrudeGeometry(
                    createRoundedRectShape(width, height, radius),
                    {
                        depth,
                        steps: 1,
                        bevelEnabled: true,
                        bevelSegments: 3,
                        bevelSize: Math.min(0.28, radius * 0.38),
                        bevelThickness: Math.min(0.24, depth * 0.16),
                        curveSegments: 5
                    }
                );
                geometry.center();
                geometry.computeVertexNormals();
                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            function createOreMassMesh(width, height, depth, radius, material, seed, detail = 1) {
                const geometry = new THREE.BoxGeometry(
                    width,
                    height,
                    depth,
                    detail > 1 ? 10 : 3,
                    detail > 1 ? 7 : 2,
                    detail > 1 ? 5 : 2
                );
                const positions = geometry.attributes.position;
                const halfX = width * 0.5;
                const halfY = height * 0.5;
                const halfZ = depth * 0.5;
                const r = Math.min(radius, halfX * 0.45, halfY * 0.45, halfZ * 0.45);
                const phase = seed * 0.071;
                for (let i = 0; i < positions.count; i++) {
                    const x = positions.getX(i);
                    const y = positions.getY(i);
                    const z = positions.getZ(i);
                    const innerX = THREE.MathUtils.clamp(x, -halfX + r, halfX - r);
                    const innerY = THREE.MathUtils.clamp(y, -halfY + r, halfY - r);
                    const innerZ = THREE.MathUtils.clamp(z, -halfZ + r, halfZ - r);
                    const delta = new THREE.Vector3(x - innerX, y - innerY, z - innerZ);
                    if (delta.lengthSq() > 0.00001) delta.normalize().multiplyScalar(r);
                    let px = innerX + delta.x;
                    let py = innerY + delta.y;
                    let pz = innerZ + delta.z;
                    const broad = Math.sin(px * 0.72 + phase) * Math.cos(py * 0.86 - phase * 0.6);
                    const shoulder = Math.sin((px + py) * 1.18 + phase * 1.4);
                    const amount = detail > 1 ? 0.055 : 0.035;
                    px += broad * width * amount * 0.28;
                    py += shoulder * height * amount * 0.22;
                    pz += (broad + shoulder * 0.35) * depth * amount;
                    positions.setXYZ(i, px, py, pz);
                }
                positions.needsUpdate = true;
                geometry.computeVertexNormals();
                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            function createOreCurtainSurface(width, height, depth, material, seed) {
                const geometry = new THREE.PlaneGeometry(width, height, 18, 12);
                const positions = geometry.attributes.position;
                const phase = seed * 0.031;
                for (let i = 0; i < positions.count; i++) {
                    const x = positions.getX(i);
                    const y = positions.getY(i);
                    const nx = x / width;
                    const ny = y / height;
                    const broad = Math.sin(nx * 10.5 + phase) * 0.5 +
                        Math.cos(ny * 9.2 - phase * 0.7) * 0.28;
                    const ridge = Math.sin((nx + ny * 0.42) * 18 + phase * 1.8) * 0.16;
                    const edgeSoftening = Math.max(0.22, 1 - Math.pow(Math.abs(nx) * 1.7, 4));
                    positions.setZ(i, depth * (0.5 + (broad + ridge) * 0.11 * edgeSoftening));
                }
                positions.needsUpdate = true;
                geometry.computeVertexNormals();
                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            function createMineFragmentMesh(width, height, depth, material, seed) {
                const geometry = new THREE.DodecahedronGeometry(0.72, 0);
                const positions = geometry.attributes.position;
                const rand = seededRandom(seed);
                for (let i = 0; i < positions.count; i++) {
                    const variation = 0.82 + rand() * 0.34;
                    positions.setXYZ(
                        i,
                        positions.getX(i) * variation,
                        positions.getY(i) * (0.86 + rand() * 0.28),
                        positions.getZ(i) * (0.78 + rand() * 0.38)
                    );
                }
                positions.needsUpdate = true;
                geometry.computeVertexNormals();
                const mesh = new THREE.Mesh(geometry, material);
                mesh.scale.set(width * 0.63, height * 0.63, depth * 0.63);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            function paintMineSilhouette(context, canvas, seed) {
                const rand = seededRandom(seed + 193);
                context.fillStyle = "#000000";
                context.fillRect(0, 0, canvas.width, canvas.height);
                const top = [];
                const bottom = [];
                const samples = 12;
                for (let i = 0; i <= samples; i++) {
                    const x = i / samples * canvas.width;
                    const edge = Math.min(i, samples - i);
                    top.push({
                        x,
                        y: 16 + rand() * 24 + Math.sin(i * 1.71 + seed) * 9 + (edge < 2 ? 27 - edge * 12 : 0)
                    });
                    bottom.push({
                        x,
                        y: canvas.height - 10 - rand() * 13 - Math.sin(i * 1.19 + seed * 0.7) * 5 +
                            (edge < 2 ? -18 + edge * 8 : 0)
                    });
                }
                context.fillStyle = "#ffffff";
                context.beginPath();
                context.moveTo(top[0].x, top[0].y);
                for (let i = 1; i < top.length; i++) context.lineTo(top[i].x, top[i].y);
                for (let i = bottom.length - 1; i >= 0; i--) context.lineTo(bottom[i].x, bottom[i].y);
                context.closePath();
                context.fill();
            }

            function createMineGate(id, z, drop, active, onDeath) {
                const group = new THREE.Group();
                const isFirstMine = id === "mine-start";
                const width = isFirstMine ? corridorHalfWidth(z) * 2 + 1.0 : 20;
                const height = isFirstMine ? 6.2 : 11.5;
                const depth = isFirstMine
                    ? 3.6
                    : id === "mine-golem"
                        ? 8
                        : id === "mine-strong"
                            ? 10
                            : 10.5;
                const centerZ = isFirstMine
                    ? z
                    : id === "mine-golem"
                        ? -4.8
                        : id === "mine-strong"
                            ? -13.8
                            : -24.05;
                const gateMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0x582078,
                    emissive: 0x21052f,
                    emissiveIntensity: 0.78,
                    roughness: 0.3,
                    metalness: 0.04,
                    clearcoat: 0.72,
                    clearcoatRoughness: 0.24,
                    transparent: false,
                    opacity: 1,
                    depthWrite: true,
                    side: THREE.FrontSide
                });
                const seed = Math.floor((z + 40) * 173);
                const gateGlow = new THREE.PointLight(0x9d3bc4, active ? 0.68 : 0, 10);
                gateGlow.position.set(0, height * 0.56, depth * 1.15);
                group.add(gateGlow);

                const chunkMaterial = gateMaterial.clone();
                const shellParts = [];
                const columns = isFirstMine ? 8 : 10;
                const rows = isFirstMine ? 5 : 6;
                const layers = isFirstMine ? 3 : 4;
                const cellWidth = width / columns;
                const cellHeight = height / rows;
                const cellDepth = depth / layers;
                for (let layer = 0; layer < layers; layer++) {
                    for (let row = 0; row < rows; row++) {
                        for (let column = 0; column < columns; column++) {
                            const part = new THREE.Mesh(shared.box, gateMaterial);
                            part.scale.set(cellWidth * 1.003, cellHeight * 1.003, cellDepth * 1.003);
                            part.position.set(
                                -width * 0.5 + (column + 0.5) * cellWidth,
                                (row + 0.5) * cellHeight,
                                depth * 0.5 - (layer + 0.5) * cellDepth
                            );
                            part.castShadow = layer === 0;
                            part.receiveShadow = true;
                            part.userData.column = column;
                            part.userData.row = row;
                            part.userData.layer = layer;
                            part.userData.removed = false;
                            part.userData.seed = seed + layer * 101 + row * 31 + column * 13;
                            group.add(part);
                            shellParts.push(part);
                        }
                    }
                }
                group.position.set(0, 0, centerZ);
                group.visible = true;
                group.userData = {
                    id,
                    type: "mine",
                    alive: true,
                    stationary: true,
                    attackable: active,
                    drop,
                    gateMaterial,
                    chunkMaterial,
                    gateGlow,
                    slabWidth: width,
                    slabHeight: height,
                    slabDepth: depth,
                    impactY: Math.min(height * 0.32, 1.8),
                    columns,
                    rows,
                    layers,
                    cellWidth,
                    cellHeight,
                    cellDepth,
                    shellParts,
                    totalCells: shellParts.length,
                    remainingCells: shellParts.length,
                    mineHits: 0,
                    activeLayer: 0,
                    collapsing: false,
                    onDeath
                };
                const collider = {
                    id,
                    minX: -width / 2,
                    maxX: width / 2,
                    minZ: centerZ - depth * 0.5,
                    maxZ: centerZ + depth * 0.5
                };
                collider.gate = group;
                group.userData.collider = collider;
                mineColliders.push(collider);
                mineGates[id] = group;
                targets.push(group);
                scene.add(group);
                return group;
            }

            function addLockedCoinsToGate(gate, count, rewardBundles) {
                const rand = seededRandom(4100 + count * 37);
                const bundleCount = Math.max(1, rewardBundles);
                const hostCandidates = gate.userData.shellParts.filter(part => {
                    const worldZ = gate.position.z + part.position.z;
                    const safeHalfWidth = corridorHalfWidth(worldZ) - 0.85;
                    return (
                    part.userData.column > 0 &&
                    part.userData.column < gate.userData.columns - 1 &&
                    part.userData.row > 0 &&
                    part.userData.row < gate.userData.rows - 1 &&
                    Math.abs(gate.position.x + part.position.x) <= safeHalfWidth
                    );
                });
                const candidatesByLayer = Array.from({ length: gate.userData.layers }, (_, layer) =>
                    hostCandidates.filter(part => part.userData.layer === layer)
                );
                for (const candidates of candidatesByLayer) {
                    for (let i = candidates.length - 1; i > 0; i--) {
                        const swapIndex = Math.floor(rand() * (i + 1));
                        [candidates[i], candidates[swapIndex]] = [candidates[swapIndex], candidates[i]];
                    }
                }
                gate.userData.payloadCoins = [];
                for (let i = 0; i < bundleCount; i++) {
                    const layer = i % gate.userData.layers;
                    const layerCandidates = candidatesByLayer[layer];
                    const hostCell =
                        layerCandidates[Math.floor(i / gate.userData.layers) % layerCandidates.length] ||
                        hostCandidates[i % hostCandidates.length] ||
                        gate.userData.shellParts[i % gate.userData.shellParts.length];
                    const mesh = createCoinBundleMesh(2 + (i % 3 === 0 ? 1 : 0));
                    mesh.scale.setScalar(0.86 + rand() * 0.12);
                    mesh.position.set(
                        gate.position.x + hostCell.position.x + (rand() - 0.5) * gate.userData.cellWidth * 0.28,
                        hostCell.position.y + (rand() - 0.5) * gate.userData.cellHeight * 0.24,
                        gate.position.z + hostCell.position.z + gate.userData.cellDepth * 0.5 + 0.08
                    );
                    mesh.visible = hostCell.userData.layer === 0;
                    const locked = {
                        mesh,
                        gate,
                        hostCell,
                        value: 1,
                        released: false,
                        baseY: mesh.position.y,
                        baseRotation: (rand() - 0.5) * 0.32,
                        bob: rand() * 10,
                        jolt: 0,
                        joltSpeed: 0
                    };
                    mesh.rotation.z = locked.baseRotation;
                    scene.add(mesh);
                    gate.userData.payloadCoins.push(locked);
                    lockedCoins.push(locked);
                }
            }

            function updateLockedCoinExposure(gate) {
                if (!gate.userData.payloadCoins) return;
                for (const locked of gate.userData.payloadCoins) {
                    if (locked.released || locked.mesh.visible) continue;
                    const host = locked.hostCell;
                    const covered = gate.userData.shellParts.some(part =>
                        !part.userData.removed &&
                        part.userData.column === host.userData.column &&
                        part.userData.row === host.userData.row &&
                        part.userData.layer < host.userData.layer
                    );
                    if (!covered) locked.mesh.visible = true;
                }
            }

            function launchLockedCoin(locked) {
                if (!locked || locked.released) return;
                locked.released = true;
                const index = lockedCoins.indexOf(locked);
                if (index >= 0) lockedCoins.splice(index, 1);
                locked.mesh.visible = true;
                const inwardX = THREE.MathUtils.clamp(
                    player.position.x - locked.mesh.position.x,
                    -2.8,
                    2.8
                );
                coinDrops.push({
                    mesh: locked.mesh,
                    value: locked.value,
                    velocity: new THREE.Vector3(
                        inwardX * 0.72 + (Math.random() - 0.5) * 1.1,
                        3.2 + Math.random() * 2.3,
                        1.4 + Math.random() * 2.6
                    ),
                    grounded: false,
                    bob: Math.random() * 10
                });
            }

            function releaseCoinsForRemovedParts(gate, removedParts) {
                if (!gate.userData.payloadCoins || !removedParts.length) return;
                const removed = new Set(removedParts);
                for (const locked of gate.userData.payloadCoins) {
                    if (!locked.released && removed.has(locked.hostCell)) launchLockedCoin(locked);
                }
            }

            function releaseLockedCoins(gate) {
                if (!gate.userData.payloadCoins) return;
                for (const locked of gate.userData.payloadCoins) launchLockedCoin(locked);
            }

            function joltLockedCoins(gate) {
                if (!gate.userData.payloadCoins) return;
                for (const locked of gate.userData.payloadCoins) {
                    if (locked.released) continue;
                    locked.jolt = 0.12 + Math.random() * 0.14;
                    locked.joltSpeed = 2.2 + Math.random() * 1.4;
                }
            }

            function updateLockedCoins(dt, elapsed) {
                for (const locked of lockedCoins) {
                    if (locked.jolt > 0) {
                        locked.joltSpeed -= 8 * dt;
                        locked.jolt = Math.max(0, locked.jolt + locked.joltSpeed * dt);
                    }
                    locked.mesh.rotation.z = locked.baseRotation + Math.sin(elapsed * 1.7 + locked.bob) * 0.035;
                    locked.mesh.position.y = locked.baseY + locked.jolt;
                }
            }

            function buildCamp(stage) {
                if (camp.group) scene.remove(camp.group);
                campColliders.length = 0;
                camp.group = new THREE.Group();
                camp.stage = stage;
                const width = stage === 1 ? 8.5 : 12;
                const depth = stage === 1 ? 8 : 10;
                const centerX = 0;
                const centerZ = 4;

                const floor = new THREE.Mesh(
                    new THREE.PlaneGeometry(width, depth),
                    new THREE.MeshStandardMaterial({ color: 0x716d72, roughness: 0.9 })
                );
                floor.rotation.x = -Math.PI / 2;
                floor.position.set(centerX, 0.045, centerZ);
                floor.receiveShadow = true;
                camp.group.add(floor);

                const wallHeight = 1.65;
                const wallSize = 1.05;
                const left = centerX - width / 2;
                const right = centerX + width / 2;
                const top = centerZ - depth / 2;
                const bottom = centerZ + depth / 2;
                const addWall = (x, z) => {
                    const wall = new THREE.Mesh(shared.box, shared.wallMat);
                    wall.scale.set(wallSize, wallHeight, wallSize);
                    wall.position.set(x, wallHeight / 2, z);
                    wall.castShadow = true;
                    wall.receiveShadow = true;
                    camp.group.add(wall);
                    campColliders.push({
                        minX: x - wallSize * 0.52,
                        maxX: x + wallSize * 0.52,
                        minZ: z - wallSize * 0.52,
                        maxZ: z + wallSize * 0.52
                    });
                };
                for (let x = left; x <= right + 0.1; x += wallSize) {
                    if (!(x > -1.35 && x < 1.35)) {
                        addWall(x, top);
                        addWall(x, bottom);
                    }
                }
                for (let z = top + wallSize; z < bottom; z += wallSize) {
                    addWall(left, z);
                    addWall(right, z);
                }

                createWorkbench(camp.group, new THREE.Vector3(2.7, 0, 6.1));
                createTorch(camp.group, new THREE.Vector3(-3.1, 1.5, 6.6));
                if (stage >= 2) {
                    createFireplace(camp.group, new THREE.Vector3(-3.6, 0, 1.1));
                    createTorch(camp.group, new THREE.Vector3(4.7, 1.5, 7.5));
                    createHatchPlatform(camp.group, new THREE.Vector3(3.3, 0, 3.1));
                }
                scene.add(camp.group);
                buildPopEffect(new THREE.Vector3(centerX, 0, centerZ), stage === 1 ? 18 : 28, 0xffd15a);
            }

            function createZone(id, name, cost, position, active, onComplete) {
                const group = new THREE.Group();
                const disc = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.45, 1.45, 0.12, 32),
                    new THREE.MeshStandardMaterial({
                        color: 0x25202c, emissive: 0x100d15, roughness: 0.45, metalness: 0.35
                    })
                );
                disc.position.y = 0.08;
                group.add(disc);
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(1.23, 0.11, 8, 32),
                    new THREE.MeshBasicMaterial({ color: 0xffd84d })
                );
                ring.rotation.x = Math.PI / 2;
                ring.position.y = 0.16;
                group.add(ring);
                group.position.copy(position);
                scene.add(group);

                const label = document.createElement("div");
                label.className = "world-label";
                label.innerHTML = `<div class="zone-name">${name}</div><div class="zone-cost">0 / ${cost}</div>`;
                ui.labels.appendChild(label);

                const zone = {
                    id, name, cost, paid: 0, active, complete: false, group, disc, ring, label,
                    position: position.clone(), paymentTimer: 0, onComplete
                };
                group.visible = active;
                label.style.display = active ? "block" : "none";
                zones.push(zone);
                return zone;
            }

            function activateZone(id) {
                const zone = zones.find(z => z.id === id);
                if (!zone || zone.complete) return;
                zone.active = true;
                zone.group.visible = true;
                zone.label.style.display = "block";
            }

            function updateZones(dt) {
                for (const zone of zones) {
                    if (!zone.active || zone.complete) continue;
                    zone.group.rotation.y += dt * 0.55;
                    if (zone.displayOnly) {
                        zone.label.querySelector(".zone-cost").textContent = `0 / ${zone.cost}`;
                        updateWorldLabel(zone);
                        continue;
                    }
                    const ready = coins > 0;
                    zone.label.classList.toggle("ready", ready);
                    zone.disc.material.color.setHex(ready ? 0x26764a : 0x25202c);
                    zone.ring.material.color.setHex(ready ? 0x62ff91 : 0xffd84d);

                    const distance = flatDistance(player.position, zone.position);
                    if (distance < 2.35 && coins > 0) {
                        zone.paymentTimer -= dt;
                        if (zone.paymentTimer <= 0) {
                            zone.paymentTimer = 0.085;
                            coins -= 1;
                            zone.paid += 1;
                            updateUI();
                            playSound("coin");
                            flyCoinTo(zone.position);
                            if (zone.paid >= zone.cost) {
                                zone.complete = true;
                                zone.active = false;
                                zone.group.visible = false;
                                zone.label.style.display = "none";
                                buildPopEffect(zone.position, 22, 0xffda4c);
                                zone.onComplete();
                            }
                        }
                    }
                    zone.label.querySelector(".zone-cost").textContent = `${zone.paid} / ${zone.cost}`;
                    updateWorldLabel(zone);
                }
            }

            function updateWorldLabel(zone) {
                const p = zone.position.clone();
                p.y = 2.6;
                p.project(camera);
                const x = (p.x * 0.5 + 0.5) * innerWidth;
                const y = (-p.y * 0.5 + 0.5) * innerHeight;
                zone.label.style.left = `${x}px`;
                zone.label.style.top = `${y}px`;
                zone.label.style.opacity = p.z > 1 || Math.abs(p.x) > 1.15 || Math.abs(p.y) > 1.15 ? "0" : "1";
            }

            function getGuidePosition() {
                if (phase === PHASE.START_COINS) {
                    const mine = targets.find(t => t.userData.type === "mine" && t.userData.alive && t.userData.attackable);
                    return mine ? mine.position : null;
                }
                if (phase === PHASE.BUILD_CAMP) {
                    const zone = zones.find(z => z.id === "camp" && !z.complete);
                    return zone ? zone.position : null;
                }
                if (phase === PHASE.MINE_GOLEM || phase === PHASE.MINE_STRONG || phase === PHASE.MINE_BOSS) {
                    const mine = targets.find(t => t.userData.type === "mine" && t.userData.alive && t.userData.attackable);
                    return mine ? mine.position : null;
                }
                if (phase === PHASE.FIRST_GOLEM || phase === PHASE.STRONG_GOLEM) {
                    const golem = enemies.find(e => e.userData.type === "golem" && e.userData.alive);
                    return golem ? golem.position : null;
                }
                if (phase === PHASE.WEAPON || phase === PHASE.EXPAND) {
                    const zone = zones.find(z => z.active && !z.complete);
                    return zone ? zone.position : null;
                }
                if (phase === PHASE.HATCH) {
                    if (coins >= CONFIG.dragonCost) return new THREE.Vector3(3.3, 0, 3.1);
                    return boss && boss.userData.alive ? boss.position : null;
                }
                if (phase === PHASE.BOSS_PRESSURE || phase === PHASE.BOSS_FINAL) {
                    return boss && boss.userData.alive ? boss.position : null;
                }
                if (phase === PHASE.COMPLETE) return new THREE.Vector3(0, 0, 4);
                return null;
            }

            function updateGuideArrow() {
                const target = getGuidePosition();
                if (!target || phase === PHASE.WAITING) {
                    ui.guide.style.display = "none";
                    return;
                }
                const p = target.clone().add(new THREE.Vector3(0, 1.2, 0)).project(camera);
                const onScreen = p.z < 1 && Math.abs(p.x) < 0.78 && Math.abs(p.y) < 0.72;
                if (onScreen) {
                    ui.guide.style.display = "none";
                    return;
                }
                let x = p.x;
                let y = -p.y;
                if (p.z > 1) {
                    x = -x;
                    y = -y;
                }
                const angle = Math.atan2(y, x);
                const radiusX = Math.max(60, innerWidth / 2 - 50);
                const radiusY = Math.max(100, innerHeight / 2 - 125);
                const screenX = innerWidth / 2 + Math.cos(angle) * radiusX;
                const screenY = innerHeight / 2 + Math.sin(angle) * radiusY;
                ui.guide.style.display = "flex";
                ui.guide.style.left = `${THREE.MathUtils.clamp(screenX, 48, innerWidth - 48)}px`;
                ui.guide.style.top = `${THREE.MathUtils.clamp(screenY, 115, innerHeight - 72)}px`;
                ui.guide.style.transform = `translate(-50%, -50%) rotate(${angle + Math.PI / 2}rad)`;
            }

            function createGolem(position, strong, onDeath, emerge = false, dormant = false) {
                const group = new THREE.Group();
                const rockMaterial = new THREE.MeshStandardMaterial({
                    color: strong ? 0x5e646d : 0x74747a, roughness: 0.9
                });
                const coreMaterial = new THREE.MeshStandardMaterial({
                    color: 0xdc4cff, emissive: 0x64137b, roughness: 0.25
                });
                const torso = new THREE.Mesh(shared.rock, rockMaterial);
                torso.scale.set(strong ? 1.4 : 1.15, strong ? 1.65 : 1.35, strong ? 1.1 : 0.95);
                torso.position.y = strong ? 1.7 : 1.45;
                torso.castShadow = true;
                group.add(torso);
                const head = new THREE.Mesh(shared.rock, rockMaterial);
                head.scale.setScalar(strong ? 0.72 : 0.58);
                head.position.y = strong ? 3.05 : 2.55;
                head.castShadow = true;
                group.add(head);
                const core = new THREE.Mesh(new THREE.SphereGeometry(0.24, 10, 8), coreMaterial);
                core.position.set(0, strong ? 1.8 : 1.5, 0.95);
                group.add(core);
                for (const side of [-1, 1]) {
                    const arm = new THREE.Mesh(shared.rock, rockMaterial);
                    arm.scale.set(strong ? 0.55 : 0.44, strong ? 1.05 : 0.86, strong ? 0.55 : 0.44);
                    arm.position.set(side * (strong ? 1.35 : 1.05), strong ? 1.65 : 1.4, 0);
                    arm.rotation.z = side * 0.25;
                    arm.castShadow = true;
                    group.add(arm);
                }
                group.position.copy(position);
                if (emerge) group.position.y = -2.8;
                group.userData = {
                    type: "golem",
                    hp: strong ? 3200 : 1650,
                    maxHp: strong ? 3200 : 1650,
                    speed: strong ? 2.1 : 1.8,
                    attackRange: 2.15,
                    attackCooldown: 0,
                    damage: strong ? 7 : 4,
                    alive: true,
                    drop: 10,
                    attackable: !dormant,
                    dormant,
                    emerging: emerge ? 1.05 : 0,
                    emergeDuration: 1.05,
                    emergeDepth: 2.8,
                    stagger: 0,
                    onDeath
                };
                if (dormant) {
                    group.traverse(child => {
                        if (!child.isMesh) return;
                        child.userData.liveMaterial = child.material;
                        const silhouette = shared.mineSilhouetteMat.clone();
                        if (child === core) {
                            silhouette.color.setHex(0x75447d);
                            silhouette.opacity = 0.5;
                        }
                        child.material = silhouette;
                    });
                }
                scene.add(group);
                createWorldHealthBar(group, strong ? 3.2 : 2.7);
                group.traverse(child => {
                    if (child.isMesh) child.renderOrder = dormant ? 4 : 0;
                });
                if (dormant) {
                    group.position.y = -0.55;
                    group.userData.healthBg.visible = false;
                    group.userData.healthFill.visible = false;
                } else {
                    enemies.push(group);
                    targets.push(group);
                }
                if (emerge) {
                    cameraShake = 0.7;
                    buildPopEffect(position.clone().add(new THREE.Vector3(0, 0.4, 0)), 26, 0x8c5b9e);
                    playSound("break");
                }
                return group;
            }

            function activateDormantGolem(group, emergeDuration = 0.18) {
                if (!group || !group.userData.dormant) return;
                group.visible = true;
                group.userData.dormant = false;
                group.userData.attackable = true;
                group.userData.emerging = emergeDuration;
                group.userData.emergeDuration = emergeDuration;
                group.userData.emergeDepth = 1.2;
                group.position.y = -1.2;
                group.userData.healthBg.visible = true;
                group.userData.healthFill.visible = true;
                group.traverse(child => {
                    if (!child.isMesh) return;
                    if (child.userData.liveMaterial) {
                        child.material = child.userData.liveMaterial;
                        delete child.userData.liveMaterial;
                    }
                    child.renderOrder = 0;
                });
                enemies.push(group);
                targets.push(group);
                cameraShake = 0.72;
                buildPopEffect(group.position.clone().setY(0.45), 28, 0x9b5eac);
                playSound("break");
            }

                }));
                anvil.scale.set(0.9, 0.5, 0.5);
                anvil.position.set(-1.7, 0.35, 0.9);
                anvil.castShadow = true;
                group.add(anvil);

                group.userData.parts = [hut, roof, anvil];
                return group;
            }

            function createNest() {
                const slot = BUILDING_SLOTS.nest;
                const group = new THREE.Group();
                group.position.set(slot.x, 0, slot.z);
                group.visible = false;
                city.group.add(group);

                const platform = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.85, 0.5, 14), shared.cityStoneMat);
                platform.position.y = 0.25;
                platform.receiveShadow = true;
                group.add(platform);

                const bowl = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.32, 8, 18), shared.cityTrimMat);
                bowl.rotation.x = Math.PI / 2;
                bowl.position.y = 0.62;
                bowl.castShadow = true;
                group.add(bowl);

                const glow = new THREE.Mesh(
                    new THREE.CircleGeometry(1.05, 20),
                    new THREE.MeshBasicMaterial({ color: 0xc08bff, transparent: true, opacity: 0.28 })
                );
                glow.rotation.x = -Math.PI / 2;
                glow.position.y = 0.53;
                group.add(glow);

                group.userData.parts = [platform, bowl];
                group.userData.glow = glow;
                city.nestPos.set(slot.x, 0.9, slot.z);
                return group;
            }

            function createAltar() {
                const slot = BUILDING_SLOTS.altar;
                const group = new THREE.Group();
                group.position.set(slot.x, 0, slot.z);
                group.visible = false;
                city.group.add(group);

                const base = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.95, 0.6, 16), shared.cityStoneMat);
                base.position.y = 0.3;
                base.receiveShadow = true;
                group.add(base);

                const pillars = [];
                for (let i = 0; i < 4; i++) {
                    const angle = (i / 4) * Math.PI * 2 + 0.4;
                    const pillar = new THREE.Mesh(shared.box, shared.cityStoneMat);
                    pillar.scale.set(0.3, 2.1, 0.3);
                    pillar.position.set(Math.cos(angle) * 1.35, 1.35, Math.sin(angle) * 1.35);
                    pillar.castShadow = true;
                    group.add(pillar);
                    group.userData[`pillar${i}`] = pillar;
                    pillars.push(pillar);
                }

                const core = new THREE.Mesh(
                    new THREE.OctahedronGeometry(0.62),
                    new THREE.MeshStandardMaterial({ color: 0x66f0d0, emissive: 0x0f7f6a, emissiveIntensity: 1.1 })
                );
                core.position.y = 1.85;
                group.add(core);
                group.userData.core = core;
                group.userData.parts = [base, ...pillars, core];
                city.altarPos.set(slot.x, 1.2, slot.z);
                return group;
            }

            function buildCityStage(level) {
                const stage = city.stages[level - 1];
                if (!stage || stage.built) return;
                stage.built = true;

                stage.floor.visible = true;
                animateFloorReveal(stage.floor);

                if (level > 1) {
                    const previous = city.stages[level - 2];
                    if (previous && previous.wallGroup.visible) {
                        previous.walls.forEach((wall, index) => animateChunkSink(wall, index * 0.012));
                        setTimeout(() => { previous.wallGroup.visible = false; }, 420);
                    }
                }

                stage.wallGroup.visible = true;
                stage.walls.forEach((wall, index) => animateChunkRise(wall, index * CONFIG.citySideStagger * 0.35));
                stage.props.forEach((prop, index) => {
                    prop.visible = true;
                    animateChunkRise(prop, 0.12 + index * 0.06);
                });
                for (const slot of stage.houses) addSolidCollider(slot.x, slot.z, 1.35);

                if (level === 1) {
                    city.buildings.keep.visible = true;
                    city.buildings.keep.userData.parts.forEach((part, index) => animateChunkRise(part, 0.1 + index * 0.09));
                    addSolidCollider(BUILDING_SLOTS.keep.x, BUILDING_SLOTS.keep.z, BUILDING_SLOTS.keep.radius);
                }
                if (level === 2) {
                    city.buildings.workshop.visible = true;
                    city.buildings.workshop.userData.parts.forEach((part, index) => animateChunkRise(part, 0.14 + index * 0.08));
                    addSolidCollider(BUILDING_SLOTS.workshop.x, BUILDING_SLOTS.workshop.z, BUILDING_SLOTS.workshop.radius);
                }
                if (level === 3) {
                    city.buildings.nest.visible = true;
                    city.buildings.nest.userData.parts.forEach((part, index) => animateChunkRise(part, 0.14 + index * 0.08));
                    addSolidCollider(BUILDING_SLOTS.nest.x, BUILDING_SLOTS.nest.z, BUILDING_SLOTS.nest.radius);
                }
                if (level === 4) {
                    city.buildings.altar.visible = true;
                    city.buildings.altar.userData.parts.forEach((part, index) => animateChunkRise(part, 0.14 + index * 0.08));
                    city.buildings.keep.userData.banner.visible = true;
                    addSolidCollider(BUILDING_SLOTS.altar.x, BUILDING_SLOTS.altar.z, BUILDING_SLOTS.altar.radius);
                }

                shared.cityLight.intensity = 0.6 + level * 0.42;
                shared.cityLight.distance = 16 + level * 5;
                nudgePlayerOutOfCollision();
            }

            function nudgePlayerOutOfCollision() {
                const safe = resolveCirclePosition(player.position, player.position.clone(), CONFIG.playerRadius);
                if (flatDistance(safe, player.position) > 0.001) {
                    player.position.copy(safe);
                    moveVelocity.set(0, 0, 0);
                }
            }

            function animateFloorReveal(floor) {
                floor.scale.set(0.2, 0.2, 0.2);
                effects.push({ type: "floorReveal", mesh: floor, life: 0.5, maxLife: 0.5 });
            }

            function animateChunkRise(object, delay = 0) {
                object.userData.riseBaseY = object.userData.riseBaseY ?? object.position.y;
                object.position.y = object.userData.riseBaseY - CONFIG.cityRiseDepth;
                effects.push({
                    type: "rise",
                    mesh: object,
                    delay,
                    life: CONFIG.cityRiseDuration,
                    maxLife: CONFIG.cityRiseDuration,
                    baseY: object.userData.riseBaseY
                });
            }

            function animateChunkSink(object, delay = 0) {
                effects.push({
                    type: "sink",
                    mesh: object,
                    delay,
                    life: 0.28,
                    maxLife: 0.28,
                    baseY: object.position.y
                });
            }

            function createTileTexture() {
                const canvas = document.createElement("canvas");
                canvas.width = canvas.height = 192;
                const texture = new THREE.CanvasTexture(canvas);
                texture.anisotropy = 4;
                return { canvas, context: canvas.getContext("2d"), texture };
            }

            function drawTile(zone, ready) {
                const context = zone.tileContext;
                const size = 192;
                context.clearRect(0, 0, size, size);
                const definition = TILE_DEFS[zone.id];
                const accent = ready ? "#7bf0a8" : "#ffffff";

                context.fillStyle = "rgba(10, 8, 20, 0.62)";
                roundRectPath(context, 10, 10, size - 20, size - 20, 18);
                context.fill();

                context.strokeStyle = accent;
                context.lineWidth = 5;
                context.setLineDash([16, 11]);
                roundRectPath(context, 10, 10, size - 20, size - 20, 18);
                context.stroke();
                context.setLineDash([]);

                drawTileIcon(context, definition.icon, `#${definition.color.toString(16).padStart(6, "0")}`);

                context.fillStyle = "#ffd23c";
                context.beginPath();
                context.arc(66, 148, 13, 0, Math.PI * 2);
                context.fill();
                context.fillStyle = "#8a5b00";
                context.font = "bold 16px Arial";
                context.textAlign = "center";
                context.textBaseline = "middle";
                context.fillText("$", 66, 149);

                context.fillStyle = "#ffffff";
                context.font = "bold 30px Arial";
                context.textAlign = "left";
                context.fillText(`${zone.paid}/${zone.cost}`, 86, 149);

                zone.tileTexture.needsUpdate = true;
            }

            function roundRectPath(context, x, y, width, height, radius) {
                context.beginPath();
                context.moveTo(x + radius, y);
                context.lineTo(x + width - radius, y);
                context.quadraticCurveTo(x + width, y, x + width, y + radius);
                context.lineTo(x + width, y + height - radius);
                context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                context.lineTo(x + radius, y + height);
                context.quadraticCurveTo(x, y + height, x, y + height - radius);
                context.lineTo(x, y + radius);
                context.quadraticCurveTo(x, y, x + radius, y);
                context.closePath();
            }

            function drawTileIcon(context, icon, color) {
                context.save();
                context.translate(96, 78);
                context.strokeStyle = color;
                context.fillStyle = color;
                context.lineWidth = 7;
                context.lineJoin = "round";
                context.lineCap = "round";

                if (icon === "city") {
                    context.beginPath();
                    context.moveTo(-34, 18);
                    context.lineTo(-34, -6);
                    context.lineTo(-14, -6);
                    context.lineTo(-14, -22);
                    context.lineTo(14, -22);
                    context.lineTo(14, -6);
                    context.lineTo(34, -6);
                    context.lineTo(34, 18);
                    context.closePath();
                    context.stroke();
                    context.fillRect(-6, 0, 12, 18);
                } else if (icon === "pickaxe") {
                    context.beginPath();
                    context.moveTo(-30, -18);
                    context.quadraticCurveTo(0, -34, 30, -18);
                    context.stroke();
                    context.beginPath();
                    context.moveTo(-14, -10);
                    context.lineTo(16, 22);
                    context.stroke();
                } else if (icon === "egg") {
                    context.beginPath();
                    context.ellipse(0, -2, 19, 25, 0, 0, Math.PI * 2);
                    context.stroke();
                    context.beginPath();
                    context.moveTo(-26, 22);
                    context.quadraticCurveTo(0, 34, 26, 22);
                    context.stroke();
                } else if (icon === "evolve") {
                    context.beginPath();
                    context.moveTo(0, -30);
                    context.lineTo(20, 4);
                    context.lineTo(8, 4);
                    context.lineTo(8, 26);
                    context.lineTo(-8, 26);
                    context.lineTo(-8, 4);
                    context.lineTo(-20, 4);
                    context.closePath();
                    context.stroke();
                }
                context.restore();
            }

            function createZone(id, cost, onComplete) {
                const slot = TILE_SLOTS[id];
                const { canvas, context, texture } = createTileTexture();
                const group = new THREE.Group();
                group.position.set(slot.x, 0, slot.z);
                scene.add(group);

                const base = new THREE.Mesh(
                    new THREE.PlaneGeometry(CONFIG.zoneTileSize * 1.06, CONFIG.zoneTileSize * 1.06),
                    new THREE.MeshBasicMaterial({
                        color: 0x0a0814,
                        transparent: true,
                        opacity: 0.55,
                        depthWrite: false
                    })
                );
                base.rotation.x = -Math.PI / 2;
                base.position.y = 0.06;
                group.add(base);

                const tile = new THREE.Mesh(
                    new THREE.PlaneGeometry(CONFIG.zoneTileSize, CONFIG.zoneTileSize),
                    new THREE.MeshBasicMaterial({
                        map: texture,
                        transparent: true,
                        depthWrite: false
                    })
                );
                tile.rotation.x = -Math.PI / 2;
                tile.position.y = 0.08;
                group.add(tile);

                const zone = {
                    id,
                    cost,
                    paid: 0,
                    group,
                    base,
                    tile,
                    tileCanvas: canvas,
                    tileContext: context,
                    tileTexture: texture,
                    position: group.position.clone(),
                    paymentTimer: 0,
                    pulse: 0,
                    requiresReentry: isPlayerInsideZonePosition(group.position),
                    locked: false,
                    complete: false,
                    onComplete
                };
                drawTile(zone, false);
                zones.push(zone);
                return zone;
            }

            function showTile(id) {
                let zone = zones.find(item => item.id === id);
                if (zone) {
                    zone.group.visible = true;
                    return zone;
                }
                zone = createZone(id, resolveTileCost(id), () => completeTile(id));
                return zone;
            }

            function resolveTileCost(id) {
                if (id === "city-build") return CITY_STAGES[0].cost;
                if (id === "city-upgrade") {
                    const next = CITY_STAGES[cityLevel];
                    return next ? next.cost : 0;
                }
                if (id === "pickaxe") {
                    const next = PICKAXE_LEVELS[pickaxeLevel - 1];
                    return next && next.cost ? next.cost : 0;
                }
                if (id === "hatchery") return HATCHERY_COST;
                if (id === "evolve") return EVOLVE_COST;
                return 0;
            }

            function removeZone(zone) {
                scene.remove(zone.group);
                const index = zones.indexOf(zone);
                if (index >= 0) zones.splice(index, 1);
            }

            function resetZone(zone, cost) {
                zone.paid = 0;
                zone.cost = cost;
                zone.complete = false;
                zone.paymentTimer = 0;
                zone.requiresReentry = true;
                drawTile(zone, false);
            }

            function completeTile(id) {
                markRun(id === "city-upgrade" ? `city-${cityLevel + 1}` : id);
                if (id === "city-build") {
                    completeCityBuild();
                } else if (id === "city-upgrade") {
                    completeCityUpgrade();
                } else if (id === "pickaxe") {
                    completePickaxe();
                } else if (id === "hatchery") {
                    completeHatchery();
                } else if (id === "evolve") {
                    completeEvolve();
                }
            }

            function completeCityBuild() {
                cityLevel = 1;
                if (city.ghost) city.ghost.visible = false;
                buildCityStage(1);
                playSound("upgrade");
                const zone = zones.find(item => item.id === "city-build");
                if (zone) removeZone(zone);
                showTile("city-upgrade");
                updateUI();
                toast("主城建成，去矿区赚取金币");
                setTutorial(false);
                tutorialDone = true;
                revealTierRing("low");
            }

            function completeCityUpgrade() {
                const stage = CITY_STAGES[cityLevel];
                cityLevel += 1;
                buildCityStage(cityLevel);
                playSound("upgrade");
                if (stage && stage.unlock) {
                    showTile(stage.unlock);
                    toast(unlockCopy(stage.unlock));
                    if (stage.unlock === "hatchery") ensureEggAvailability();
                } else {
                    toast(`主城升级到 Lv.${cityLevel}`);
                }
                const zone = zones.find(item => item.id === "city-upgrade");
                if (zone) {
                    if (cityLevel >= CITY_STAGES.length) removeZone(zone);
                    else resetZone(zone, resolveTileCost("city-upgrade"));
                }
                updateUI();
            }

            function unlockCopy(id) {
                if (id === "pickaxe") return "主城扩张，解锁升级锄头";
                if (id === "hatchery") return "主城扩张，解锁孵化台";
                if (id === "evolve") return "主城扩张，解锁宠物进化";
                return "主城扩张";
            }

            function completePickaxe() {
                pickaxeLevel = Math.min(PICKAXE_LEVELS.length, pickaxeLevel + 1);
                const level = PICKAXE_LEVELS[pickaxeLevel - 1];
                power = level.power_score;
                const head = playerWeapon.userData.head;
                head.scale.set(0.72 + pickaxeLevel * 0.13, 0.2 + pickaxeLevel * 0.04, 0.24 + pickaxeLevel * 0.05);
                head.material = new THREE.MeshStandardMaterial({
                    color: pickaxeLevel >= 3 ? 0xffd76b : 0x8ce6ff,
                    emissive: pickaxeLevel >= 3 ? 0x9a6300 : 0x18708f,
                    emissiveIntensity: 0.85,
                    metalness: 0.7,
                    roughness: 0.28
                });
                buildPopEffect(player.position.clone().add(new THREE.Vector3(0.7, 1.4, 0)), 22, 0x9beeff);
                playSound("upgrade");
                const zone = zones.find(item => item.id === "pickaxe");
                if (zone) {
                    const nextCost = resolveTileCost("pickaxe");
                    if (!nextCost) removeZone(zone);
                    else resetZone(zone, nextCost);
                }
                updateUI();
                toast(pickaxeLevel >= 3 ? "锄头已满级，高级矿也能快速开采" : "锄头升级，挖矿更快了");
            }

            function completeHatchery() {
                const zone = zones.find(item => item.id === "hatchery");
                if (zone) removeZone(zone);
                startEggPlace();
            }

            function completeEvolve() {
                const zone = zones.find(item => item.id === "evolve");
                if (zone) removeZone(zone);
                evolvePet();
            }

            function isPlayerInsideZonePosition(position) {
                if (!player) return false;
                const half = CONFIG.zoneTileSize * 0.5;
                return Math.abs(player.position.x - position.x) < half &&
                    Math.abs(player.position.z - position.z) < half;
            }

            function isZonePayable(zone) {
                if (zone.complete) return false;
                if (zone.id === "hatchery") return carryingEgg;
                if (zone.id === "evolve") return Boolean(pet) && !petEvolved;
                return true;
            }

            function updateZones(dt) {
                for (const zone of zones) {
                    if (!zone.group.visible) continue;
                    const inside = isPlayerInsideZonePosition(zone.position);
                    if (zone.requiresReentry) {
                        if (!inside) zone.requiresReentry = false;
                        else continue;
                    }
                    if (zone.complete) continue;

                    const payable = isZonePayable(zone);
                    const remaining = Math.max(0, zone.cost - zone.paid);
                    const ready = payable && coins > 0;
                    zone.pulse += dt;
                    const pulse = ready ? 0.9 + Math.sin(zone.pulse * CONFIG.zonePulseSpeed) * 0.1 : 0.72;
                    zone.tile.material.opacity = pulse;
                    zone.base.material.opacity = ready ? 0.62 : 0.45;
                    if (zone.lastReady !== ready) {
                        zone.lastReady = ready;
                        drawTile(zone, ready);
                    }

                    if (!inside || !payable || coins <= 0 || ctaOpen || cinematic.active) {
                        zone.paymentTimer = 0;
                        if (inside && !payable && !zone.hintShown) {
                            zone.hintShown = true;
                            toast(zoneBlockedCopy(zone.id));
                        }
                        continue;
                    }
                    zone.hintShown = false;

                    zone.paymentTimer -= dt;
                    if (zone.paymentTimer > 0) continue;
                    zone.paymentTimer = CONFIG.zonePaymentInterval;
                    // 每次扣的枚数跟着剩余金额走，贵的地贴也能在一秒多付完，不然后期光付款就要等七八秒。
                    const step = Math.max(1, Math.ceil(remaining / CONFIG.zonePaymentTicks));
                    const amount = Math.min(step, coins, remaining);
                    coins -= amount;
                    zone.paid += amount;
                    syncBackCoins();
                    flyCoinTo(zone.position);
                    updateUI();
                    zone.paymentTick = (zone.paymentTick || 0) + 1;
                    if (zone.paymentTick % 2 === 0) playSound("coin");
                    drawTile(zone, coins > 0);

                    if (zone.paid >= zone.cost) {
                        zone.complete = true;
                        buildPopEffect(zone.position.clone().add(new THREE.Vector3(0, 0.5, 0)), 22, 0xffda4c);
                        const callback = zone.onComplete;
                        defer(0.14, callback);
                    }
                }
            }

            function zoneBlockedCopy(id) {
                if (id === "hatchery") return "先去野外找到龙蛋，抱回来孵化";
                if (id === "evolve") return "先孵化出宠物才能进化";
                return "";
            }

            function createOreField() {
                shared.oreMaterials = {};
                shared.chunkMaterials = {};
                for (const tierId of TIER_ORDER) {
                    const tier = ORE_TIERS[tierId];
                    // 半透明矿体：能直接看见冻在里面的金币和野怪。
                    // depthWrite 保留，否则几十个体素会互相叠加成一团发光的糊状物。
                    shared.oreMaterials[tierId] = new THREE.MeshStandardMaterial({
                        color: tier.color,
                        emissive: tier.emissive,
                        emissiveIntensity: 0.55,
                        roughness: 0.42,
                        metalness: 0.12,
                        transparent: true,
                        opacity: 0.52
                    });
                    shared.chunkMaterials[tierId] = new THREE.MeshStandardMaterial({
                        color: tier.chunkColor,
                        emissive: tier.emissive,
                        emissiveIntensity: 0.35,
                        roughness: 0.6
                    });
                }

                for (const tierId of TIER_ORDER) {
                    const tier = ORE_TIERS[tierId];
                    for (let i = 0; i < tier.nodeCount; i++) {
                        const angle = (i / tier.nodeCount) * Math.PI * 2 + tier.angleOffset;
                        createOreNode(tierId, i, angle);
                    }
                }
            }

            function createOreNode(tierId, index, angle) {
                const tier = ORE_TIERS[tierId];
                const rand = seededRandom(1013 + index * 137 + TIER_ORDER.indexOf(tierId) * 911);
                const radius = tier.ringRadius + (rand() - 0.5) * 1.8;
                const position = new THREE.Vector3(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);

                const group = new THREE.Group();
                group.position.copy(position);
                group.rotation.y = -angle + Math.PI / 2;
                scene.add(group);

                const { columns, rows, layers } = tier.grid;
                const cellWidth = tier.size.width / columns;
                const cellHeight = tier.size.height / rows;
                const cellDepth = tier.size.depth / layers;

                const cells = [];
                for (let cx = 0; cx < columns; cx++) {
                    for (let cy = 0; cy < rows; cy++) {
                        for (let cz = 0; cz < layers; cz++) {
                            const nx = (cx + 0.5) / columns * 2 - 1;
                            const ny = (cy + 0.5) / rows;
                            const nz = (cz + 0.5) / layers * 2 - 1;
                            const radial = Math.hypot(nx, nz);
                            const taper = 0.62 + (1 - ny) * 0.55 + rand() * 0.16;
                            if (radial > taper) continue;
                            cells.push({
                                x: nx * tier.size.width * 0.5,
                                y: cellHeight * (cy + 0.5),
                                z: nz * tier.size.depth * 0.5,
                                removed: false
                            });
                        }
                    }
                }

                const instanced = new THREE.InstancedMesh(shared.box, shared.oreMaterials[tierId], cells.length);
                instanced.castShadow = true;
                instanced.receiveShadow = true;
                // 矿体和内部野怪都是透明材质，原点又几乎重合，排序会逐帧抖动。
                // 显式指定绘制顺序，保证矿体永远叠在内容物之上。
                instanced.renderOrder = 2;
                instanced.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                const matrix = new THREE.Matrix4();
                const quaternion = new THREE.Quaternion();
                const scaleVector = new THREE.Vector3(cellWidth * 1.02, cellHeight * 1.02, cellDepth * 1.02);
                cells.forEach((cell, cellIndex) => {
                    quaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), (rand() - 0.5) * 0.22);
                    matrix.compose(new THREE.Vector3(cell.x, cell.y, cell.z), quaternion, scaleVector);
                    instanced.setMatrixAt(cellIndex, matrix);
                });
                instanced.instanceMatrix.needsUpdate = true;
                group.add(instanced);

                const node = {
                    id: `${tierId}-${index}`,
                    tierId,
                    tier,
                    group,
                    instanced,
                    cells,
                    total: cells.length,
                    remaining: cells.length,
                    baseRadius: tier.blockRadius,
                    currentRadius: tier.blockRadius,
                    position: position.clone(),
                    cellSize: new THREE.Vector3(cellWidth, cellHeight, cellDepth),
                    coinsTotal: tier.coins,
                    coinsReleased: 0,
                    cleared: false,
                    monsterRevealed: false,
                    surfaceCoins: [],
                    zeroMatrix: new THREE.Matrix4().makeScale(0, 0, 0)
                };
                group.userData = { type: "ore", node, alive: true };

                // 金币埋进矿体内部，靠半透明矿石透出来，形成「这里有货」的直观信号。
                // 挂在 group 下随矿体一起转，位置直接取真实体素，保证一定嵌在石头里而不是浮在空中。
                const coinCount = tierId === "low" ? 4 : tierId === "mid" ? 5 : 6;
                for (let i = 0; i < coinCount; i++) {
                    const cell = cells[Math.floor(rand() * cells.length)];
                    if (!cell) break;
                    const coin = new THREE.Mesh(shared.coin, shared.oreCoinMat);
                    coin.scale.setScalar(1.25);
                    coin.position.set(cell.x, Math.max(cellHeight * 0.6, cell.y), cell.z);
                    coin.rotation.set(Math.PI / 2, 0, rand() * Math.PI);
                    coin.renderOrder = 1;
                    group.add(coin);
                    node.surfaceCoins.push(coin);
                }

                node.monster = createOreMonster(tierId, position.clone(), node);
                node.monster.traverse(child => { if (child.isMesh) child.renderOrder = 1; });
                setMonsterSilhouette(node.monster, 0);
                oreNodes.push(node);
                return node;
            }

            function oreProgress(node) {
                return 1 - node.remaining / node.total;
            }

            function getOreImpactPoint(node) {
                const direction = player.position.clone().sub(node.position).setY(0);
                if (direction.lengthSq() < 0.0001) direction.set(0, 0, 1);
                direction.normalize();
                return node.position.clone()
                    .addScaledVector(direction, node.currentRadius * 0.85)
                    .setY(node.tier.size.height * 0.45);
            }

            function updateOreRecoil(dt) {
                for (const node of oreNodes) {
                    if (!node.rejectShake) continue;
                    node.rejectShake = Math.max(0, node.rejectShake - dt);
                    const amount = 1 + Math.sin(node.rejectShake * 58) * node.rejectShake * 0.22;
                    node.instanced.scale.setScalar(amount);
                }
            }

            function canMine(node) {
                return pickaxeLevel >= node.tier.requiredPickaxe;
            }

            // 锄头等级不够时凿不动：给一次弹开反馈并提示回城，不掉任何体素。
            function rejectMine(node) {
                const impact = getOreImpactPoint(node);
                buildPopEffect(impact, 7, 0xffe27a);
                cameraShake = Math.max(cameraShake, 0.16);
                playSound("clang");
                node.rejectShake = 0.32;
                if (blockedMineHint > 0) return;
                blockedMineHint = 3.2;
                toast(`锄头等级不足，凿不动${node.tier.name}，回主城升级锄头`);
            }

            function mineOre(node) {
                if (node.cleared) return;
                if (!canMine(node)) {
                    rejectMine(node);
                    return;
                }
                const minePower = PICKAXE_LEVELS[pickaxeLevel - 1].power;
                const perHit = Math.max(1, Math.round(minePower / node.tier.hardness));
                const impact = getOreImpactPoint(node);
                const localImpact = node.group.worldToLocal(impact.clone());

                const candidates = [];
                for (let i = 0; i < node.cells.length; i++) {
                    const cell = node.cells[i];
                    if (cell.removed) continue;
                    const dx = cell.x - localImpact.x;
                    const dy = cell.y - localImpact.y;
                    const dz = cell.z - localImpact.z;
                    candidates.push({ index: i, distance: dx * dx + dy * dy * 0.6 + dz * dz });
                }
                candidates.sort((a, b) => a.distance - b.distance);

                const removeCount = Math.min(perHit, candidates.length);
                for (let i = 0; i < removeCount; i++) {
                    const cellIndex = candidates[i].index;
                    const cell = node.cells[cellIndex];
                    cell.removed = true;
                    node.remaining -= 1;
                    node.instanced.setMatrixAt(cellIndex, node.zeroMatrix);
                    if (i < 4) launchOreChunk(node, cell);
                }
                node.instanced.instanceMatrix.needsUpdate = true;
                node.currentRadius = node.baseRadius * Math.sqrt(Math.max(0, node.remaining / node.total));

                const progress = oreProgress(node);
                buildDust(impact, 5, 0.7, node.tier.chunkColor);
                buildPopEffect(impact, 5, node.tier.glow);
                cameraShake = Math.max(cameraShake, 0.1);
                playSound("crack");

                const targetCoins = Math.floor(node.coinsTotal * progress);
                if (targetCoins > node.coinsReleased) {
                    const amount = targetCoins - node.coinsReleased;
                    node.coinsReleased = targetCoins;
                    dropCoins(impact, amount);
                }

                const visibleSurfaceCoins = Math.max(0, Math.ceil((1 - progress) * node.surfaceCoins.length) - 1);
                node.surfaceCoins.forEach((coin, index) => {
                    if (index > visibleSurfaceCoins && coin.visible) {
                        coin.visible = false;
                        // 金币现在挂在矿体节点下，position 是局部坐标，掉落要换算成世界坐标。
                        dropCoins(coin.getWorldPosition(new THREE.Vector3()), 1);
                    }
                });

                if (!node.monsterRevealed) {
                    setMonsterSilhouette(node.monster, THREE.MathUtils.clamp(progress / 0.38, 0, 1));
                    if (progress >= 0.42) revealOreMonster(node);
                }

                if (node.remaining <= 0) clearOreNode(node);
            }

            function launchOreChunk(node, cell) {
                const mesh = new THREE.Mesh(shared.box, shared.chunkMaterials[node.tierId]);
                mesh.scale.copy(node.cellSize).multiplyScalar(0.72);
                mesh.position.copy(node.group.localToWorld(new THREE.Vector3(cell.x, cell.y, cell.z)));
                mesh.castShadow = true;
                scene.add(mesh);
                const away = mesh.position.clone().sub(node.position).setY(0);
                if (away.lengthSq() < 0.01) away.set(0, 0, 1);
                away.normalize();
                effects.push({
                    type: "chunk",
                    mesh,
                    velocity: away.multiplyScalar(2.6 + Math.random() * 3.4)
                        .add(new THREE.Vector3((Math.random() - 0.5) * 2, 4.2 + Math.random() * 2.6, (Math.random() - 0.5) * 2)),
                    spin: new THREE.Vector3(
                        (Math.random() - 0.5) * 6,
                        (Math.random() - 0.5) * 5,
                        (Math.random() - 0.5) * 6
                    ),
                    life: 1 + Math.random() * 0.4,
                    groundY: node.cellSize.y * 0.36
                });
            }

            function clearOreNode(node) {
                node.cleared = true;
                node.currentRadius = 0;
                node.instanced.visible = false;
                node.group.userData.alive = false;
                node.surfaceCoins.forEach(coin => { coin.visible = false; });

                const remainingCoins = node.coinsTotal - node.coinsReleased;
                if (remainingCoins > 0) {
                    dropCoins(node.position.clone().setY(1), remainingCoins);
                    node.coinsReleased = node.coinsTotal;
                }

                const pit = new THREE.Mesh(
                    new THREE.CircleGeometry(node.baseRadius * 1.05, 24),
                    new THREE.MeshBasicMaterial({
                        color: node.tier.emissive,
                        transparent: true,
                        opacity: 0.55,
                        depthWrite: false
                    })
                );
                pit.rotation.x = -Math.PI / 2;
                pit.position.copy(node.position).setY(0.05);
                scene.add(pit);

                buildDust(node.position.clone().setY(1.2), 16, 2.2, node.tier.chunkColor);
                buildPopEffect(node.position.clone().setY(1.4), 20, node.tier.glow);
                cameraShake = Math.max(cameraShake, 0.5);
                playSound("break");

                if (!node.monsterRevealed) revealOreMonster(node);

                clearedByTier[node.tierId] += 1;
                onTierProgress(node.tierId);
                checkFinaleTrigger();
            }

            function onTierProgress(tierId) {
                if (tierId === "low" && clearedByTier.low === 1) {
                    revealTierRing("mid");
                }
                if (tierId === "mid" && clearedByTier.mid === 1) {
                    revealTierRing("high");
                }
            }

            function revealTierRing(tierId) {
                if (shared[`revealed_${tierId}`]) return;
                shared[`revealed_${tierId}`] = true;
                if (tierId === "low") {
                    toast("金币在矿床里，靠近自动开采");
                    return;
                }
                const tier = ORE_TIERS[tierId];
                toast(`发现${tier.name}，收益更高但野怪更强`);
            }

            function tierRemaining(tierId) {
                return oreNodes.filter(node => node.tierId === tierId && !node.cleared).length;
            }

            function getNearestOre(preferredTier = null) {
                let best = null;
                let bestDistance = Infinity;
                for (const node of oreNodes) {
                    if (node.cleared) continue;
                    if (preferredTier && node.tierId !== preferredTier) continue;
                    const distance = flatDistance(node.position, player.position);
                    if (distance < bestDistance) {
                        bestDistance = distance;
                        best = node;
                    }
                }
                return best;
            }

            // 矿圈跟着锄头等级走：每级锄头对应一圈矿，保证三圈内容都被走到。
            // 绝不指向锄头等级凿不动的矿圈，否则玩家会被引到一块砸不开的石头前面。
            function minableRemaining(tierId) {
                return pickaxeLevel >= ORE_TIERS[tierId].requiredPickaxe && tierRemaining(tierId) > 0;
            }

            function getGuideOreTarget() {
                if (minableRemaining("high") && (petEvolved || tierRemaining("mid") <= 2)) return getNearestOre("high");
                if (minableRemaining("mid")) return getNearestOre("mid");
                if (minableRemaining("low")) return getNearestOre("low");
                if (minableRemaining("high")) return getNearestOre("high");
                return null;
            }

            function createOreMonster(tierId, position, node) {
                const tier = ORE_TIERS[tierId];
                const config = tier.monster;
                const group = new THREE.Group();
                group.position.copy(position).setY(0);
                group.scale.setScalar(config.scale);
                scene.add(group);

                const bodyMat = new THREE.MeshStandardMaterial({ color: config.color, roughness: 0.82 });
                const rockMat = new THREE.MeshStandardMaterial({ color: tier.emissive, roughness: 0.9 });
                const meshes = [];

                const torso = new THREE.Mesh(shared.box, bodyMat);
                torso.scale.set(1.9, 2.1, 1.5);
                torso.position.y = 1.9;
                torso.castShadow = true;
                group.add(torso);
                meshes.push(torso);

                const head = new THREE.Mesh(shared.box, rockMat);
                head.scale.set(1.15, 0.95, 1.05);
                head.position.y = 3.35;
                head.castShadow = true;
                group.add(head);
                meshes.push(head);

                const arms = [];
                for (const side of [-1, 1]) {
                    const arm = new THREE.Mesh(shared.box, bodyMat);
                    arm.scale.set(0.62, 1.85, 0.66);
                    arm.position.set(side * 1.42, 1.95, 0);
                    arm.castShadow = true;
                    group.add(arm);
                    meshes.push(arm);
                    arms.push(arm);
                }
                for (const side of [-1, 1]) {
                    const leg = new THREE.Mesh(shared.box, rockMat);
                    leg.scale.set(0.68, 1.05, 0.72);
                    leg.position.set(side * 0.6, 0.52, 0);
                    leg.castShadow = true;
                    group.add(leg);
                    meshes.push(leg);
                }
                for (let i = 0; i < 3; i++) {
                    const shard = new THREE.Mesh(shared.box, rockMat);
                    const scale = 0.34 + i * 0.14;
                    shard.scale.set(scale, scale * 1.7, scale);
                    shard.position.set((i - 1) * 0.66, 3, -0.72);
                    shard.rotation.z = (i - 1) * 0.35;
                    group.add(shard);
                    meshes.push(shard);
                }

                const eyeMat = new THREE.MeshBasicMaterial({ color: tier.glow });
                const eyes = [];
                for (const side of [-1, 1]) {
                    const eye = new THREE.Mesh(shared.sphere, eyeMat);
                    eye.scale.setScalar(0.28);
                    eye.position.set(side * 0.32, 3.4, 0.56);
                    group.add(eye);
                    eyes.push(eye);
                }

                const silhouetteMaterial = shared.silhouetteMat.clone();
                group.userData = {
                    type: "monster",
                    tierId,
                    config,
                    tier,
                    node,
                    hp: config.hp,
                    maxHp: config.hp,
                    alive: false,
                    attackable: false,
                    meshes,
                    arms,
                    eyes,
                    realMaterials: meshes.map(mesh => mesh.material),
                    silhouetteMaterial,
                    eyeMaterial: eyeMat,
                    attackState: "chasing",
                    attackTimer: 0,
                    stagger: 0,
                    knockback: null,
                    leashState: "active",
                    emerging: 0
                };
                group.visible = false;
                return group;
            }

            // 矿体半透明后野怪一开始就该看得见，amount 只控制清晰度，不再控制显隐。
            function setMonsterSilhouette(monster, amount) {
                const data = monster.userData;
                monster.visible = true;
                data.silhouetteMaterial.opacity = 0.82 + amount * 0.16;
                for (const mesh of data.meshes) mesh.material = data.silhouetteMaterial;
                data.eyeMaterial.color.setHex(data.tier.glow);
                // 发光的眼睛是「石头里有东西」最快被读懂的信号。
                for (const eye of data.eyes) eye.scale.setScalar(0.34 + amount * 0.12);
            }

            function revealOreMonster(node) {
                if (node.monsterRevealed) return;
                node.monsterRevealed = true;
                const monster = node.monster;
                const data = monster.userData;
                monster.visible = true;
                data.meshes.forEach((mesh, index) => { mesh.material = data.realMaterials[index]; });
                data.alive = true;
                data.attackable = true;
                data.homePosition = monster.position.clone().setY(0);
                data.emerging = 0.36;
                data.emergeDepth = 1.4;
                monster.position.y = -data.emergeDepth;
                createHealthBar(monster);
                enemies.push(monster);
                buildDust(monster.position.clone().setY(1.5), 14, 2, node.tier.chunkColor);
                cameraShake = Math.max(cameraShake, 0.45);
                playSound("warn");
                if (!shared[`monsterSeen_${node.tierId}`]) {
                    shared[`monsterSeen_${node.tierId}`] = true;
                    if (node.tierId === "low") toast("矿里冻着野怪，打倒它继续挖");
                    else toast(`${node.tier.name}的野怪更强，小心红圈`);
                }
            }

            function createHealthBar(entity) {
                const group = new THREE.Group();
                const background = new THREE.Mesh(
                    new THREE.PlaneGeometry(2.4, 0.28),
                    new THREE.MeshBasicMaterial({ color: 0x160f18, transparent: true, opacity: 0.85, depthTest: false })
                );
                group.add(background);
                const fill = new THREE.Mesh(
                    new THREE.PlaneGeometry(2.3, 0.2),
                    new THREE.MeshBasicMaterial({ color: 0xe0322f, depthTest: false })
                );
                fill.position.z = 0.01;
                group.add(fill);
                group.position.y = 4.4;
                group.renderOrder = 20;
                entity.add(group);
                entity.userData.healthBar = group;
                entity.userData.healthFill = fill;
                return group;
            }

            function updateEnemies(dt) {
                for (const enemy of enemies) {
                    const data = enemy.userData;
                    if (!data.alive) continue;

                    if (data.emerging > 0) {
                        data.emerging = Math.max(0, data.emerging - dt);
                        enemy.position.y = -data.emergeDepth * (data.emerging / 0.36);
                        continue;
                    }
                    enemy.position.y = 0;

                    if (data.stagger > 0) {
                        data.stagger = Math.max(0, data.stagger - dt);
                        if (data.knockback) {
                            enemy.position.addScaledVector(data.knockback, dt);
                            data.knockback.multiplyScalar(Math.exp(-10 * dt));
                            constrainEnemy(enemy);
                        }
                        continue;
                    }

                    if (updateEnemyLeash(enemy, dt)) continue;
                    updateMonsterCombat(enemy, dt);
                }
            }

            function constrainEnemy(enemy) {
                const limit = CONFIG.arenaRadius - 2;
                const distance = Math.hypot(enemy.position.x, enemy.position.z);
                if (distance > limit) {
                    const scale = limit / distance;
                    enemy.position.x *= scale;
                    enemy.position.z *= scale;
                }
            }

            function updateEnemyLeash(enemy, dt) {
                const data = enemy.userData;
                const config = data.config;
                const home = data.homePosition;
                if (!home) return false;

                if (data.leashState === "returning") {
                    const direction = home.clone().sub(enemy.position).setY(0);
                    if (direction.length() < 0.25) {
                        enemy.position.set(home.x, 0, home.z);
                        data.leashState = "leashed";
                        return true;
                    }
                    direction.normalize();
                    enemy.position.addScaledVector(direction, config.returnSpeed * dt);
                    enemy.rotation.y = lerpAngle(enemy.rotation.y, Math.atan2(direction.x, direction.z), 0.2);
                    return true;
                }

                if (data.leashState === "leashed") {
                    if (flatDistance(player.position, home) <= config.reengageRadius) {
                        data.leashState = "active";
                        return false;
                    }
                    return true;
                }

                const playerOutside = flatDistance(player.position, home) > config.chaseRadius;
                const selfOutside = flatDistance(enemy.position, home) > config.chaseRadius;
                if (playerOutside || selfOutside) {
                    data.leashState = "returning";
                    data.attackState = "chasing";
                    data.attackTimer = 0;
                    cancelHazardsFrom(enemy);
                    resetMonsterPose(enemy);
                    return true;
                }
                return false;
            }

            function resetMonsterPose(enemy) {
                for (const arm of enemy.userData.arms) arm.rotation.x = 0;
            }

            function setMonsterPose(enemy, amount) {
                for (const arm of enemy.userData.arms) arm.rotation.x = -amount * 1.35;
            }

            function updateMonsterCombat(enemy, dt) {
                const data = enemy.userData;
                const config = data.config;

                if (data.attackState === "windup") {
                    data.attackTimer -= dt;
                    const progress = 1 - Math.max(0, data.attackTimer) / config.windup;
                    setMonsterPose(enemy, progress * progress);
                    if (data.attackTimer <= 0) {
                        data.attackState = "recovery";
                        data.attackTimer = config.recovery;
                    }
                    return;
                }
                if (data.attackState === "recovery") {
                    data.attackTimer -= dt;
                    setMonsterPose(enemy, Math.max(0, data.attackTimer / config.recovery));
                    if (data.attackTimer <= 0) data.attackState = "chasing";
                    return;
                }

                setMonsterPose(enemy, 0);
                const distance = flatDistance(enemy.position, player.position);
                const range = config.attackRange !== undefined ? config.attackRange : 3.2;
                if (distance > range) {
                    const direction = player.position.clone().sub(enemy.position).setY(0);
                    if (direction.lengthSq() > 0.01) {
                        direction.normalize();
                        enemy.position.addScaledVector(direction, config.speed * dt);
                        constrainEnemy(enemy);
                        enemy.rotation.y = lerpAngle(enemy.rotation.y, Math.atan2(direction.x, direction.z), 1 - Math.exp(-8 * dt));
                    }
                    return;
                }

                const facing = player.position.clone().sub(enemy.position).setY(0);
                if (facing.lengthSq() > 0.01) {
                    enemy.rotation.y = lerpAngle(enemy.rotation.y, Math.atan2(facing.x, facing.z), 0.4);
                }
                data.attackState = "windup";
                data.attackTimer = config.windup;
                createMonsterHazard(enemy);
                playSound("warn");
            }

            function createMonsterHazard(enemy) {
                const data = enemy.userData;
                const config = data.config;
                const kind = config.kind;

                if (kind === "fan") {
                    const angle = THREE.MathUtils.degToRad(config.sectorAngle);
                    const geometry = new THREE.CircleGeometry(config.sectorRadius, 26, -angle / 2, angle);
                    const mesh = new THREE.Mesh(geometry, shared.warningMat.clone());
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.position.copy(enemy.position).setY(0.08);
                    mesh.rotation.z = -enemy.rotation.y + Math.PI / 2;
                    scene.add(mesh);
                    hazards.push({
                        mesh,
                        source: enemy,
                        kind,
                        life: config.windup,
                        maxLife: config.windup,
                        trackDuration: config.trackDuration || 0,
                        radius: config.sectorRadius,
                        angle,
                        damage: config.damage,
                        knockback: config.knockback || 0
                    });
                    return;
                }

                const radius = config.warningRadius;
                const mesh = new THREE.Mesh(new THREE.CircleGeometry(radius, 28), shared.warningMat.clone());
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.copy(player.position).setY(0.08);
                scene.add(mesh);
                hazards.push({
                    mesh,
                    source: enemy,
                    kind,
                    life: config.windup,
                    maxLife: config.windup,
                    trackDuration: config.trackDuration !== undefined ? config.trackDuration : config.windup * 0.55,
                    radius,
                    damage: config.damage,
                    knockback: config.knockback || 0
                });
            }

            function cancelHazardsFrom(enemy) {
                for (let i = hazards.length - 1; i >= 0; i--) {
                    if (hazards[i].source !== enemy) continue;
                    scene.remove(hazards[i].mesh);
                    hazards.splice(i, 1);
                }
            }

            function updateHazards(dt) {
                for (let i = hazards.length - 1; i >= 0; i--) {
                    const hazard = hazards[i];
                    hazard.life -= dt;
                    const elapsed = hazard.maxLife - hazard.life;

                    if (hazard.kind === "fan") {
                        hazard.mesh.position.copy(hazard.source.position).setY(0.08);
                        if (elapsed < hazard.trackDuration) {
                            hazard.mesh.rotation.z = -hazard.source.rotation.y + Math.PI / 2;
                        }
                    } else if (elapsed < hazard.trackDuration) {
                        hazard.mesh.position.copy(player.position).setY(0.08);
                    }

                    const ratio = 1 - hazard.life / hazard.maxLife;
                    hazard.mesh.material.opacity = 0.2 + ratio * 0.42;

                    if (hazard.life > 0) continue;

                    scene.remove(hazard.mesh);
                    hazards.splice(i, 1);
                    if (!hazard.source.userData.alive) continue;

                    let hit = false;
                    if (hazard.kind === "fan") {
                        const toPlayer = player.position.clone().sub(hazard.source.position).setY(0);
                        if (toPlayer.length() <= hazard.radius) {
                            const facing = new THREE.Vector3(
                                Math.sin(hazard.source.rotation.y),
                                0,
                                Math.cos(hazard.source.rotation.y)
                            );
                            const cosLimit = Math.cos(hazard.angle / 2);
                            hit = toPlayer.normalize().dot(facing) >= cosLimit;
                        }
                    } else {
                        hit = flatDistance(player.position, hazard.mesh.position) <= hazard.radius;
                    }

                    buildPopEffect(hazard.mesh.position.clone().setY(0.5), 14, 0xff7b52);
                    cameraShake = Math.max(cameraShake, 0.3);
                    playSound("hit");
                    if (hit) damagePlayer(hazard.damage, hazard.source.position, hazard.knockback);
                }
            }

            function damageEnemy(target, amount, shown, big) {
                const data = target.userData;
                if (!data.alive) return;
                data.hp -= amount;
                showDamage(target.position, `-${Math.round(shown)}`, big);
                flashEnemy(target);
                if (data.healthFill) {
                    const ratio = Math.max(0, data.hp / data.maxHp);
                    data.healthFill.scale.x = ratio;
                    data.healthFill.position.x = -(1 - ratio) * 1.15;
                }
                if (data.type === "dragon") {
                    updateBossUI();
                }
                if (data.hp <= 0) killEnemy(target);
            }

            function flashEnemy(target) {
                for (const mesh of target.userData.meshes || []) {
                    const material = mesh.material;
                    if (!material || !material.emissive || material.userData.flashTimer) continue;
                    const emissive = material.emissive.getHex();
                    const intensity = material.emissiveIntensity;
                    material.emissive.setHex(0xffb9a4);
                    material.emissiveIntensity = 0.6;
                    material.userData.flashTimer = setTimeout(() => {
                        material.emissive.setHex(emissive);
                        material.emissiveIntensity = intensity;
                        material.userData.flashTimer = null;
                    }, 70);
                }
            }

            function killEnemy(target) {
                const data = target.userData;
                data.alive = false;
                data.attackable = false;
                cancelHazardsFrom(target);
                buildDeathDebris(target);
                scene.remove(target);

                const enemyIndex = enemies.indexOf(target);
                if (enemyIndex >= 0) enemies.splice(enemyIndex, 1);

                if (data.type === "monster") {
                    dropCoins(target.position.clone().setY(1.4), data.config.drop);
                    playSound("break");
                    maybeDropEgg(data, target.position.clone());
                }
            }

            function buildDeathDebris(target) {
                const color = target.userData.tier ? target.userData.tier.chunkColor : 0x8a7f92;
                for (let i = 0; i < 14; i++) {
                    const mesh = new THREE.Mesh(shared.box, new THREE.MeshStandardMaterial({ color, roughness: 0.85 }));
                    const scale = 0.22 + Math.random() * 0.24;
                    mesh.scale.setScalar(scale);
                    mesh.position.copy(target.position).add(new THREE.Vector3(
                        (Math.random() - 0.5) * 2,
                        0.8 + Math.random() * 2.4,
                        (Math.random() - 0.5) * 2
                    ));
                    scene.add(mesh);
                    effects.push({
                        type: "chunk",
                        mesh,
                        velocity: new THREE.Vector3(
                            (Math.random() - 0.5) * 6,
                            4 + Math.random() * 4,
                            (Math.random() - 0.5) * 6
                        ),
                        spin: new THREE.Vector3(Math.random() * 5, Math.random() * 5, Math.random() * 5),
                        life: 1.1 + Math.random() * 0.5,
                        groundY: scale * 0.5
                    });
                }
            }

            function updateBillboards() {
                for (const enemy of enemies) {
                    if (enemy.userData.healthBar) enemy.userData.healthBar.quaternion.copy(camera.quaternion);
                }
            }

            function createEggMesh() {
                const group = new THREE.Group();
                const shell = new THREE.Mesh(
                    new THREE.SphereGeometry(0.52, 14, 12),
                    new THREE.MeshStandardMaterial({
                        color: 0xf1e2ff,
                        emissive: 0x6b3bb8,
                        emissiveIntensity: 0.55,
                        roughness: 0.42
                    })
                );
                shell.scale.set(1, 1.32, 1);
                shell.castShadow = true;
                group.add(shell);
                for (let i = 0; i < 4; i++) {
                    const spot = new THREE.Mesh(
                        shared.sphere,
                        new THREE.MeshStandardMaterial({ color: 0x8b5cf6, emissive: 0x3b1d7a, emissiveIntensity: 0.7 })
                    );
                    const angle = (i / 4) * Math.PI * 2;
                    spot.scale.setScalar(0.22);
                    spot.position.set(Math.cos(angle) * 0.4, 0.12 + (i % 2) * 0.3, Math.sin(angle) * 0.4);
                    group.add(spot);
                }
                return group;
            }

            function maybeDropEgg(data, position) {
                if (pet || carryingEgg || eggPickup || eggSpawned) return;
                if (cityLevel < 3) return;
                if (data.tierId === "low") return;
                spawnEggAt(position);
            }

            function ensureEggAvailability() {
                if (pet || carryingEgg || eggPickup || eggSpawned || eggPlace) return;
                // 冻在矿里的怪 alive 为 false，不能只看 alive，否则一进 3 级城就会凭空掉蛋。
                const hasSource = oreNodes.some(node =>
                    node.tierId !== "low" && node.monster && (!node.monsterRevealed || node.monster.userData.alive)
                );
                if (hasSource) return;
                const fallback = getNearestOre() || { position: player.position.clone().add(new THREE.Vector3(0, 0, 6)) };
                spawnEggAt(fallback.position.clone());
            }

            function updateProgressWatchdog(dt) {
                watchdogTimer += dt;
                if (watchdogTimer < 1.5) return;
                watchdogTimer = 0;
                if (cityLevel >= 3) ensureEggAvailability();
                if (petEvolved && !finaleStarted && tierRemaining("high") === 0) {
                    clearedByTier.high = Math.max(1, clearedByTier.high);
                    checkFinaleTrigger();
                }
                if (tutorialVisible && cityLevel > 0) setTutorial(false);
                ensureProgressAffordable();
            }

            // 没有任何收入来源却买不起下一步时兜底，避免流程走到死路。
            function ensureProgressAffordable() {
                if (finaleStarted) return;
                // 只算挖得动的矿：锄头门槛会让玩家守着一地凿不开的矿，却没钱升级锄头。
                if (oreNodes.some(node => !node.cleared && canMine(node))) return;
                if (enemies.some(enemy => enemy.userData.alive)) return;

                const unpaid = zone => zone && zone.group.visible && !zone.complete && zone.cost - zone.paid > coins;
                // 优先补锄头：补别的地贴解不开「挖不动」这个死结。
                const pickaxeZone = zones.find(zone => zone.id === "pickaxe");
                const blocking = unpaid(pickaxeZone)
                    ? pickaxeZone
                    : zones.find(zone => unpaid(zone) && isZonePayable(zone));
                if (!blocking) return;

                // 先把散落在地上的金币收回来——那是玩家已经赚到的钱。
                // 不能因为远处还躺着几枚捡不到的金币就让兜底永远不触发。
                if (coinDrops.length > 0) {
                    for (const coin of coinDrops) scene.remove(coin.mesh);
                    coins += coinDrops.length;
                    coinDrops.length = 0;
                }
                if (coins < blocking.cost - blocking.paid) coins = blocking.cost - blocking.paid;
                syncBackCoins();
                updateUI();
            }

            function findClearSpot(position, clearance = 1.5) {
                const spot = position.clone().setY(0);
                const push = (cx, cz, radius) => {
                    const dx = spot.x - cx;
                    const dz = spot.z - cz;
                    const minDistance = radius + clearance;
                    const distance = Math.hypot(dx, dz);
                    if (distance >= minDistance) return false;
                    if (distance < 0.0001) {
                        spot.x = cx + minDistance;
                        return true;
                    }
                    const scale = minDistance / distance;
                    spot.x = cx + dx * scale;
                    spot.z = cz + dz * scale;
                    return true;
                };
                for (let pass = 0; pass < 8; pass++) {
                    let moved = false;
                    for (const collider of solidColliders) {
                        if (collider.radius > 0 && push(collider.x, collider.z, collider.radius)) moved = true;
                    }
                    for (const node of oreNodes) {
                        if (node.cleared || node.currentRadius <= 0) continue;
                        if (push(node.position.x, node.position.z, node.currentRadius)) moved = true;
                    }
                    const limit = CONFIG.arenaRadius - 3;
                    const distance = Math.hypot(spot.x, spot.z);
                    if (distance > limit) {
                        spot.x *= limit / distance;
                        spot.z *= limit / distance;
                        moved = true;
                    }
                    if (!moved) break;
                }
                return spot;
            }

            function spawnEggAt(position) {
                eggSpawned = true;
                const mesh = createEggMesh();
                mesh.position.copy(findClearSpot(position)).setY(0.95);
                scene.add(mesh);
                eggPickup = { mesh, bob: Math.random() * 6, progress: 0 };
                setEggLockProgress(0);
                ui.eggLock.classList.add("show");
                toast("发现龙蛋，靠近拾取后带回孵化台");
                buildPopEffect(mesh.position.clone(), 20, 0xc08bff);
                playSound("upgrade");
            }

            function setEggLockProgress(progress) {
                if (!ui.eggLockBar) return;
                ui.eggLockBar.style.strokeDashoffset = `${175.93 * (1 - progress)}`;
            }

            function hideEggLock() {
                ui.eggLock.classList.remove("show", "charging");
                setEggLockProgress(0);
            }

            function updateEggLockPosition() {
                if (!eggPickup) return;
                const point = eggPickup.mesh.position.clone();
                point.y += 1.1;
                point.project(camera);
                if (point.z > 1 || Math.abs(point.x) > 1.2 || Math.abs(point.y) > 1.2) {
                    ui.eggLock.style.opacity = "0";
                    return;
                }
                ui.eggLock.style.opacity = "1";
                ui.eggLock.style.left = `${(point.x * 0.5 + 0.5) * innerWidth}px`;
                ui.eggLock.style.top = `${(-point.y * 0.5 + 0.5) * innerHeight}px`;
            }

            function updateEgg(dt, elapsed) {
                if (eggPlace) {
                    updateEggPlace(dt);
                    hideEggLock();
                    return;
                }
                if (carryingEgg && heldEgg) {
                    heldEgg.rotation.y += dt * 0.9;
                    heldEgg.position.y = 1.5 + Math.sin(elapsed * 4) * 0.04;
                    hideEggLock();
                    return;
                }
                if (!eggPickup) {
                    hideEggLock();
                    return;
                }
                eggPickup.mesh.rotation.y += dt * 1.4;
                eggPickup.mesh.position.y = 0.95 + Math.sin(elapsed * 3.2 + eggPickup.bob) * 0.1;
                const inRange = flatDistance(eggPickup.mesh.position, player.position) < CONFIG.eggPickupRange;
                if (inRange) {
                    eggPickup.progress = Math.min(1, eggPickup.progress + dt / CONFIG.eggPickupDuration);
                    ui.eggLock.classList.add("charging");
                    if (eggPickup.progress >= 1) {
                        pickUpEgg();
                        return;
                    }
                } else {
                    eggPickup.progress = 0;
                    ui.eggLock.classList.remove("charging");
                }
                setEggLockProgress(eggPickup.progress);
                updateEggLockPosition();
            }

            function pickUpEgg() {
                if (!eggPickup || carryingEgg) return;
                carryingEgg = true;
                heldEgg = eggPickup.mesh;
                playerVisual.add(heldEgg);
                heldEgg.position.set(-0.62, 1.5, 0.42);
                heldEgg.scale.setScalar(0.68);
                eggPickup = null;
                hideEggLock();
                toast(cityLevel >= 3 ? "带龙蛋回主城孵化台" : "先升级主城解锁孵化台");
                playSound("coin");
            }

            function startEggPlace() {
                if (!heldEgg) return;
                const start = new THREE.Vector3();
                heldEgg.getWorldPosition(start);
                playerVisual.remove(heldEgg);
                scene.add(heldEgg);
                heldEgg.position.copy(start);
                eggPlace = {
                    mesh: heldEgg,
                    start,
                    end: city.nestPos.clone(),
                    t: 0
                };
                heldEgg = null;
                carryingEgg = false;
                toast("安放龙蛋");
                playSound("upgrade");
            }

            function updateEggPlace(dt) {
                eggPlace.t = Math.min(1, eggPlace.t + dt / CONFIG.eggPlaceDuration);
                const t = eggPlace.t * eggPlace.t * (3 - 2 * eggPlace.t);
                eggPlace.mesh.position.lerpVectors(eggPlace.start, eggPlace.end, t);
                eggPlace.mesh.position.y += Math.sin(Math.PI * t) * 2.2;
                eggPlace.mesh.rotation.y += dt * 3.2;
                const scale = 0.68 + t * 0.42;
                eggPlace.mesh.scale.setScalar(scale);
                if (eggPlace.t >= 1) finishEggPlace();
            }

            function updatePet(dt, elapsed) {
                if (!pet) return;
                const data = pet.userData;
                const behind = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
                const side = new THREE.Vector3(-behind.z, 0, behind.x);
                const desired = player.position.clone()
                    .addScaledVector(behind, -1.9)
                    .addScaledVector(side, 1.7);
                desired.y = 2.75 + Math.sin(elapsed * 2.4) * 0.24;
                pet.position.lerp(desired, 1 - Math.exp(-4.2 * dt));

                const flap = Math.sin(elapsed * (petEvolved ? 13 : 9));
                data.wings[0].rotation.z = 0.3 + flap * 0.5;
                data.wings[1].rotation.z = -0.3 - flap * 0.5;

                let aim = null;
                let aimDistance = Infinity;
                for (const enemy of enemies) {
                    if (!enemy.userData.alive || !enemy.userData.attackable) continue;
                    const distance = flatDistance(enemy.position, player.position);
                    if (distance < aimDistance) {
                        aimDistance = distance;
                        aim = enemy;
                    }
                }

                if (aim && aimDistance <= data.range) {
                    const facing = aim.position.clone().sub(pet.position).setY(0);
                    if (facing.lengthSq() > 0.01) {
                        pet.rotation.y = lerpAngle(pet.rotation.y, Math.atan2(facing.x, facing.z), 1 - Math.exp(-9 * dt));
                    }
                    data.fireTimer -= dt;
                    if (data.fireTimer <= 0) {
                        data.fireTimer = data.fireInterval;
                        petShoot(aim);
                    }
                } else {
                    pet.rotation.y = lerpAngle(pet.rotation.y, player.rotation.y, 1 - Math.exp(-5 * dt));
                }
            }

            function petShoot(target) {
                const origin = pet.position.clone().add(new THREE.Vector3(0, 0, 0));
                createProjectile(origin, target, pet.userData.beamColor, 26, hit => {
                    if (!hit.userData.alive) return;
                    buildPopEffect(hit.position.clone().add(new THREE.Vector3(0, 1.5, 0)), 8, pet.userData.beamColor);
                    damageEnemy(hit, pet.userData.damage, pet.userData.damage, false);
                });
                playSound("ice");
            }

                if (finaleStarted || !petEvolved || clearedByTier.high < 1) return;
                finaleStarted = true;
                defer(0.45, startFlameDragonIntro);
            }

            function framingDistance(width, height) {
                const vFov = THREE.MathUtils.degToRad(camera.fov);
                const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
                return Math.max(
                    (height / 2) / Math.tan(vFov / 2),
                    (width / 2) / Math.tan(hFov / 2)
                );
            }

            function cinematicShot(center, offset, distance, lookHeight) {
                const direction = offset.clone().normalize();
                cinematic.cameraTarget = center.clone().addScaledVector(direction, distance);
                cinematic.lookTarget = center.clone().add(new THREE.Vector3(0, lookHeight, 0));
            }

            function startFlameDragonIntro() {
                const outward = player.position.clone().setY(0);
                if (outward.lengthSq() < 1) outward.set(0, 0, 1);
                outward.normalize();
                const landingRadius = THREE.MathUtils.clamp(
                    Math.hypot(player.position.x, player.position.z) + 17,
                    26,
                    CONFIG.arenaRadius - 7
                );
                finale.landing = outward.multiplyScalar(landingRadius).setY(0);

                const approach = finale.landing.clone().sub(player.position).setY(0).normalize();
                const lateral = new THREE.Vector3(-approach.z, 0, approach.x);
                finale.approach = approach;
                finale.dragon = createFlameDragon();
                finale.diveStart = finale.landing.clone()
                    .addScaledVector(approach, 30)
                    .setY(38);
                finale.dragon.position.copy(finale.diveStart);
                finale.dive = 0;

                moveVelocity.set(0, 0, 0);
                stick.x = stick.z = stick.magnitude = 0;

                startCinematic([
                    {
                        at: 0,
                        run: () => {
                            cinematic.response = 2;
                            cinematicShot(
                                finale.landing,
                                approach.clone().multiplyScalar(-1).add(new THREE.Vector3(0, 0.42, 0)),
                                framingDistance(34, 22),
                                16
                            );
                        }
                    },
                    {
                        at: 1.55,
                        run: () => {
                            landFlameDragon();
                            cinematic.response = 3.2;
                            cinematicShot(
                                finale.landing,
                                approach.clone().multiplyScalar(-0.86)
                                    .addScaledVector(lateral, 0.38)
                                    .add(new THREE.Vector3(0, 0.34, 0)),
                                framingDistance(34, 18),
                                5
                            );
                        }
                    },
                    {
                        at: 2.5,
                        run: () => {
                            roarFlameDragon();
                            cinematic.response = 2.4;
                            cinematicShot(
                                finale.landing,
                                approach.clone().multiplyScalar(-0.78)
                                    .addScaledVector(lateral, 0.55)
                                    .add(new THREE.Vector3(0, 0.26, 0)),
                                framingDistance(24, 13),
                                6.2
                            );
                            ui.cineTitle.classList.add("show");
                            ui.cineSub.classList.add("show");
                        }
                    },
                    {
                        at: 3.6,
                        run: () => breatheFlameDragon()
                    },
                    {
                        at: 4.9,
                        run: () => {
                            cinematic.response = 2.2;
                            const mid = player.position.clone().lerp(finale.landing, 0.55);
                            const span = flatDistance(player.position, finale.landing) + 26;
                            cinematicShot(
                                mid,
                                lateral.clone().multiplyScalar(0.82)
                                    .addScaledVector(approach, -0.34)
                                    .add(new THREE.Vector3(0, 0.36, 0)),
                                framingDistance(span, 20),
                                5.5
                            );
                            ui.cineTitle.classList.remove("show");
                            ui.cineSub.classList.remove("show");
                            showBossUI();
                            braceForBattle();
                        }
                    },
                    {
                        at: 8.2,
                        run: () => {
                            ui.bars.classList.remove("show");
                            showCta();
                        }
                    }
                ]);
            }

            function startCinematic(steps) {
                markRun("finale");
                if (tutorialVisible) setTutorial(false);
                ui.guide.style.display = "none";
                cinematic.active = true;
                cinematic.time = 0;
                cinematic.steps = steps;
                cinematic.index = 0;
                cinematic.response = 2.6;
                cinematic.cameraTarget = camera.position.clone();
                cinematic.lookTarget = cameraFocus.clone();
                ui.bars.classList.add("show");
            }

            function updateCinematic(dt) {
                if (!cinematic.active) return;
                cinematic.time += dt;
                while (cinematic.index < cinematic.steps.length &&
                    cinematic.time >= cinematic.steps[cinematic.index].at) {
                    cinematic.steps[cinematic.index].run();
                    cinematic.index += 1;
                }
            }

            function endCinematic() {
                cinematic.active = false;
                cinematic.steps = [];
                ui.bars.classList.remove("show");
                ui.cineTitle.classList.remove("show");
                ui.cineSub.classList.remove("show");
            }

                    addBone(1.2, 0.2, 2.2, -4, 0.22);

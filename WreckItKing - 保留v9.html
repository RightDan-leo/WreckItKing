<!DOCTYPE html>
<html lang="zh-CN">

        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #090712;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; }
        .nipple .back { opacity: 0.22 !important; }
        .nipple .front { opacity: 0.58 !important; }
        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 12000;
        }
        #player-hud {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: 14px;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 12px 7px 7px;
            color: white;
            background: rgba(8, 7, 18, 0.72);
            border: 1px solid rgba(115, 210, 255, 0.55);
            border-radius: 34px 12px 12px 34px;
            backdrop-filter: blur(5px);
        }
        #portrait {
            position: relative;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 3px solid #63d7ff;
            background: radial-gradient(circle at 50% 35%, #65c9ff 0 20%, #152e72 22% 52%, #07122f 54%);
            box-shadow: 0 0 14px rgba(64, 201, 255, 0.7);
        }
        #portrait::after {
            content: "";
            position: absolute;
            left: 11px;
            right: 11px;
            bottom: 5px;
            height: 19px;
            border-radius: 50% 50% 35% 35%;
            background: #1e6fa0;
        }
        #hud-info { min-width: 92px; }
        #power {
            font-size: 23px;
            line-height: 25px;
            font-weight: 900;
            text-shadow: 0 0 10px #7bdfff;
        }
        #power-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #98cbe1;
        }
        #hp-track {
            width: 96px;
            height: 6px;
            margin-top: 4px;
            border-radius: 5px;
            overflow: hidden;
            background: rgba(255,255,255,0.18);
        }
        #hp-fill {
            width: 100%;
            height: 100%;
            background: #58e486;
            transition: width 0.2s;
        }
        #coin-hud {
            position: fixed;
            top: max(19px, env(safe-area-inset-top));
            right: 14px;
            min-width: 112px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 0 14px;
            color: white;
            font-size: 25px;
            font-weight: 900;
            background: rgba(8, 7, 18, 0.78);
            border: 1px solid rgba(255, 197, 50, 0.4);
            border-radius: 22px 8px 8px 22px;
        }
        .coin-icon {
            width: 27px;
            height: 27px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #a35d00;
            font-size: 17px;
            background: #ffd339;
            border: 3px solid #ffed8a;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 196, 0, 0.7);
        }
        #city-hud {
            position: fixed;
            top: max(68px, calc(env(safe-area-inset-top) + 54px));
            right: 14px;
            padding: 5px 13px;
            color: #ffd9a8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            background: rgba(8, 7, 18, 0.6);
            border: 1px solid rgba(255, 170, 80, 0.35);
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.25s;
        }
        #city-hud.show { opacity: 1; }
        #boss-hud {
            position: absolute;
            top: max(calc(11vh + 18px), calc(env(safe-area-inset-top) + 92px));
            left: 50%;
            width: min(82vw, 520px);
            transform: translateX(-50%);
            display: none;
            text-align: center;
            color: white;
            text-shadow: 0 2px 4px black;

        #boss-name { font-family: Georgia, serif; font-size: 24px; font-weight: 900; }

        #boss-level { position: absolute; left: 0; bottom: 10px; font-weight: 900; }
        #boss-bar {
            position: relative;
            height: 17px;
            margin-left: 52px;
            overflow: hidden;
            background: #1a111c;
            border: 2px solid rgba(255,255,255,0.65);
            border-radius: 10px;

        #boss-fill {
            width: 100%;
            height: 100%;
            background: #d91d35;
            transition: width 0.15s;
        }
        #boss-hp-text {
            position: absolute;
            inset: 0;
            font-size: 12px;
            font-weight: 700;
            line-height: 17px;
        }
        #tutorial {
            position: fixed;
            left: 50%;
            bottom: 17vh;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.35s;
        }
        #tutorial-ring {
            position: relative;
            width: 86px;
            height: 86px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.55);
        }
        #tutorial-hand {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 26px;
            height: 26px;
            margin: -13px 0 0 -13px;
            border-radius: 50% 50% 50% 12%;
            background: rgba(255,255,255,0.92);
            box-shadow: 0 0 14px rgba(255,255,255,0.6);
            animation: handHint 1.7s ease-in-out infinite;
        }
        @keyframes handHint {
            0% { transform: translate(0, 22px) scale(0.92); opacity: 0.35; }
            45% { transform: translate(0, -20px) scale(1); opacity: 1; }
            100% { transform: translate(0, 22px) scale(0.92); opacity: 0.35; }
        }
        #tutorial-copy {
            padding: 7px 16px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            background: rgba(8, 7, 18, 0.72);
            border-radius: 18px;
        }
        #toast {
            position: fixed;
            left: 50%;
            top: max(28vh, 190px);
            padding: 9px 20px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            background: rgba(8, 7, 18, 0.8);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 20px;
            transform: translate(-50%, -8px);
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
        }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }
        #guide-arrow {
            position: fixed;
            left: 50%;
            top: 50%;
            display: none;
            color: #ffd54a;
            font-size: 30px;
            text-shadow: 0 0 12px rgba(255, 190, 40, 0.9);
            transform: translate(-50%, -50%);

        #labels, #damage-layer {

            overflow: hidden;
            pointer-events: none;
        }

            color: white;
            font-size: 19px;
            font-weight: 900;
            text-shadow: 0 2px 5px rgba(0,0,0,0.85);
            transform: translate(-50%, -50%);
            animation: floatUp 0.75s ease-out forwards;

        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.7); }
            30% { transform: translate(-50%, -95%) scale(1.15); }
            100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
        }
        #egg-lock {
            position: fixed;
            left: 0;
            top: 0;
            width: 72px;
            height: 72px;
            margin: -36px 0 0 -36px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #egg-lock.show { opacity: 1; }
        #egg-lock svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .egg-lock-track { fill: rgba(8,7,18,0.55); stroke: rgba(255,255,255,0.28); stroke-width: 5; }
        .egg-lock-bar {
            fill: none;
            stroke: #ffd54a;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 175.93;
            stroke-dashoffset: 175.93;
            transition: stroke-dashoffset 0.08s linear;
        }
        .egg-lock-core { fill: rgba(255, 213, 74, 0.16); }
        #egg-lock.charging .egg-lock-core { fill: rgba(255, 213, 74, 0.3); }

            right: 12px;
            bottom: 12px;
            padding: 8px 14px;
            color: white;
            font-size: 12px;
            background: rgba(78, 42, 120, 0.85);
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 10px;
            pointer-events: auto;
            cursor: pointer;
        }
        #cinematic-bars {
            position: fixed;
            inset: 0;
            opacity: 0;
            transition: opacity 0.5s;
        }
        #cinematic-bars.show { opacity: 1; }
        #cinematic-bars::before, #cinematic-bars::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 11vh;
            background: #000;
        }
        #cinematic-bars::before { top: 0; }
        #cinematic-bars::after { bottom: 0; }
        #cinematic-title {
            position: fixed;
            left: 50%;
            top: 24%;
            color: #ffb347;
            font-family: Georgia, serif;
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 6px;
            white-space: nowrap;

        #cinematic-sub {

            font-size: 14px;
            letter-spacing: 3px;
            white-space: nowrap;
            text-shadow: 0 2px 8px #000;

            opacity: 0;

            font-size: 17px;
            font-weight: 900;
            color: #35180a;
            background: linear-gradient(180deg, #ffd06a, #ff9a2e);

            color: white;
            background: rgba(255,255,255,0.12);

            #brand { font-size: 33px; }

            function init() {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0b0914);
                scene.fog = new THREE.FogExp2(0x0b0914, 0.0125);

                camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, 0.1, 400);
                camera.position.set(0, 27, 34);

                renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
                renderer.setSize(innerWidth, innerHeight);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.outputEncoding = THREE.sRGBEncoding;
                document.body.insertBefore(renderer.domElement, document.body.firstChild);

                clock = new THREE.Clock();
                cacheUi();
                createSharedAssets();
                createLights();
                createArena();
                createPlayer();
                createCity();
                createOreField();
                setupInput();

                coins = CONFIG.startCoins;
                syncBackCoins();
                updateUI();
                showTile("city-build");
                animate();

                window.__wik = {
                    hold: false,
                    freezeAt: ms => setTimeout(() => { window.__wik.hold = true; }, ms),
                    tp: (x, z) => { player.position.set(x, 0, z); moveVelocity.set(0, 0, 0); },
                    give: n => { coins += n; syncBackCoins(); updateUI(); },
                    hit: () => { const t = nearestTarget(); if (t) playerAttack(t); return Boolean(t); },
                    mineAll: tier => {
                        const saved = pickaxeLevel;
                        pickaxeLevel = PICKAXE_LEVELS.length;
                        oreNodes.filter(n => n.tierId === tier && !n.cleared)
                            .forEach(n => { for (let i = 0; i < 500 && !n.cleared; i++) mineOre(n); });
                        pickaxeLevel = saved;
                    },
                    killAll: () => [...enemies].forEach(e => killEnemy(e)),
                    finale: () => {
                        if (!pet) createPet();
                        petEvolved = true;
                        clearedByTier.high = Math.max(1, clearedByTier.high);
                        checkFinaleTrigger();
                    },
                    marks: () => runMarks,
                    auto: (on = true) => { autoRun = on; return autoRun; },
                    // 手动步进模拟：标签页失焦时 rAF 会被节流，实测节奏必须脱离墙钟。
                    // 先接管 rAF（hold），否则渲染循环会和步进叠加成双倍速。
                    sim: (seconds, dt = 1 / 60) => {
                        window.__wik.hold = true;
                        simElapsed = Math.max(simElapsed, clock.elapsedTime);
                        const steps = Math.round(seconds / dt);
                        for (let i = 0; i < steps; i++) {
                            simElapsed += dt;
                            update(dt, simElapsed);
                        }
                        renderer.render(scene, camera);
                        return Number(runClock.toFixed(1));
                    },
                    pick: (px, py) => {
                        const ray = new THREE.Raycaster();
                        ray.setFromCamera(
                            new THREE.Vector2((px / innerWidth) * 2 - 1, -(py / innerHeight) * 2 + 1),
                            camera
                        );
                        return ray.intersectObjects(scene.children, true).slice(0, 6).map(h => {
                            const chain = [];
                            for (let o = h.object; o && o !== scene; o = o.parent) {
                                chain.push(o.name || o.userData.type || o.type);
                            }
                            return {
                                geo: h.object.geometry && h.object.geometry.type,
                                params: h.object.geometry && h.object.geometry.parameters,
                                dist: Math.round(h.distance * 10) / 10,
                                chain
                            };
                        });
                    },
                    toEgg: () => {
                        if (!eggPickup) return null;
                        const p = eggPickup.mesh.position;
                        player.position.set(p.x, 0, p.z);
                        moveVelocity.set(0, 0, 0);
                        return [Math.round(p.x), Math.round(p.z)];
                    },
                    zoneAt: id => {
                        const zone = zones.find(z => z.id === id);
                        if (!zone) return null;
                        player.position.set(zone.position.x, 0, zone.position.z);
                        moveVelocity.set(0, 0, 0);
                        return zone.id;
                    },
                    overlaps: () => {
                        const bad = [];
                        for (let i = 0; i < oreNodes.length; i++) {
                            for (let j = i + 1; j < oreNodes.length; j++) {
                                const a = oreNodes[i];
                                const b = oreNodes[j];
                                const gap = flatDistance(a.position, b.position) - a.baseRadius - b.baseRadius;
                                if (gap < 0.5) bad.push(`${a.id}~${b.id}:${gap.toFixed(2)}`);
                            }
                        }
                        return bad;
                    },
                    nodes: () => oreNodes
                        .map(n => ({
                            id: n.id,
                            cleared: n.cleared,
                            left: `${n.remaining}/${n.total}`,
                            revealed: n.monsterRevealed,
                            dist: Math.round(flatDistance(n.position, player.position))
                        }))
                        .sort((a, b) => a.dist - b.dist)
                        .slice(0, 6),
                    state: () => ({
                        coins, cityLevel, pickaxeLevel, petEvolved,
                        pet: Boolean(pet), carryingEgg, eggSpawned,
                        cleared: { ...clearedByTier },
                        enemies: enemies.length,
                        drops: coinDrops.length,
                        zones: zones.map(z => `${z.id}:${z.paid}/${z.cost}`),
                        pos: [Math.round(player.position.x), Math.round(player.position.z)],
                        finaleStarted, ctaOpen
                    })
                };
            }

                if (value <= 0) value += 2147483646;
                return () => (value = (value * 16807) % 2147483647) / 2147483647;
            }

            function createDustTexture() {
                const canvas = document.createElement("canvas");
                canvas.width = canvas.height = 64;
                const context = canvas.getContext("2d");
                const gradient = context.createRadialGradient(32, 32, 2, 32, 32, 31);
                gradient.addColorStop(0, "rgba(255,255,255,0.9)");
                gradient.addColorStop(0.5, "rgba(255,255,255,0.32)");
                gradient.addColorStop(1, "rgba(255,255,255,0)");
                context.fillStyle = gradient;
                context.fillRect(0, 0, 64, 64);
                return new THREE.CanvasTexture(canvas);
            }

            function syncBackCoins() {
                if (!backCoinStack) return;
                const visible = Math.min(CONFIG.backCoinMaxVisible, Math.max(0, coins));
                while (backCoinStack.children.length > visible) {
                    backCoinStack.remove(backCoinStack.children[backCoinStack.children.length - 1]);
                }
                while (backCoinStack.children.length < visible) {
                    const index = backCoinStack.children.length;
                    const coin = new THREE.Mesh(shared.coin, shared.coinMat);
                    coin.scale.setScalar(1.08);
                    // 圆柱轴本来就是 Y 轴，保持默认即为平放；绕 X 轴转 90° 会把金币立起来。
                    coin.rotation.y = index * 0.55;
                    coin.rotation.z = Math.sin(index * 1.7) * 0.05;
                    coin.rotation.x = Math.cos(index * 2.3) * 0.04;
                    coin.position.set(
                        Math.sin(index * 0.7) * 0.035,
                        index * CONFIG.backCoinStep,
                        Math.cos(index * 0.9) * 0.035
                    );
                    // 高塔上每枚都投影会明显掉帧，隔几枚投一次已经够看出体积。
                    coin.castShadow = index % 6 === 0;
                    backCoinStack.add(coin);
                }
            }

            function getBackCoinTop(offsetX = 0, offsetZ = 0) {
                if (!backCoinStack) return player.position.clone().add(new THREE.Vector3(0, 1.4, 0));
                const visible = Math.min(CONFIG.backCoinMaxVisible, Math.max(0, coins));
                return backCoinStack.localToWorld(new THREE.Vector3(
                    offsetX,
                    visible * CONFIG.backCoinStep + 0.12,
                    offsetZ
                ));
            }

            function updatePlayer(dt, elapsed) {
                const input = new THREE.Vector3();
                if (stick.magnitude > 0.05) {
                    input.set(stick.x, 0, stick.z).multiplyScalar(stick.magnitude);
                } else {
                    if (keys.w) input.z -= 1;
                    if (keys.s) input.z += 1;
                    if (keys.a) input.x -= 1;
                    if (keys.d) input.x += 1;
                    if (input.lengthSq() > 1) input.normalize();
                }

                const desired = input.multiplyScalar(CONFIG.playerSpeed * (carryingEgg ? 0.88 : 1));
                const response = desired.lengthSq() > 0.01 ? CONFIG.playerAcceleration : CONFIG.playerDeceleration;
                moveVelocity.lerp(desired, 1 - Math.exp(-response * dt));
                if (moveVelocity.lengthSq() < 0.0004) moveVelocity.set(0, 0, 0);

                resolvePlayerMove(dt);

                const speedRatio = Math.min(1, moveVelocity.length() / CONFIG.playerSpeed);
                if (speedRatio > 0.03) {
                    const moveAngle = Math.atan2(moveVelocity.x, moveVelocity.z);
                    player.rotation.y = lerpAngle(player.rotation.y, moveAngle, 1 - Math.exp(-14 * dt));
                }

                const walk = Math.sin(elapsed * 11) * speedRatio;
                playerVisual.position.y = Math.abs(Math.sin(elapsed * 11)) * 0.075 * speedRatio;
                playerVisual.rotation.z = -moveVelocity.x / CONFIG.playerSpeed * 0.055;
                playerLeftLeg.rotation.x = walk * 0.65;
                playerRightLeg.rotation.x = -walk * 0.65;
                if (carryingEgg) {
                    playerLeftArm.rotation.x = -0.85;
                    playerLeftArm.rotation.z = 0.3;
                } else {
                    playerLeftArm.rotation.x = -walk * 0.35;
                    playerLeftArm.rotation.z = -0.15;
                }
                playerRightArm.rotation.x = walk * 0.35;
                playerRightArm.rotation.z = 0.15;
                playerWeapon.visible = true;
                playerCape.rotation.x = -0.16 - speedRatio * 0.22 + Math.sin(elapsed * 7) * 0.025;

                if (playerWeapon.userData.swing > 0) {
                    playerWeapon.userData.swing = Math.max(0, playerWeapon.userData.swing - dt * 4.8);
                    const swing = Math.sin((1 - playerWeapon.userData.swing) * Math.PI);
                    playerWeapon.rotation.z = playerWeapon.userData.baseRotationZ - swing * 1.15;
                    playerRightArm.rotation.x -= swing * 0.85;
                } else {
                    playerWeapon.rotation.z = playerWeapon.userData.baseRotationZ;
                }
                if (attackLunge > 0) {
                    attackLunge = Math.max(0, attackLunge - dt * 5.5);
                    playerVisual.position.z = Math.sin((1 - attackLunge) * Math.PI) * 0.26;
                } else {
                    playerVisual.position.z = 0;
                }
                playerRing.material.opacity = 0.68 + Math.sin(elapsed * 5) * 0.16;

                if (backCoinStack) {
                    // 越高越晃，让金币塔看起来是背上去的而不是贴上去的。
                    const stackHeight = backCoinStack.children.length * CONFIG.backCoinStep;
                    const wobble = (0.02 + Math.min(0.075, stackHeight * 0.022)) * (0.3 + speedRatio);
                    backCoinStack.rotation.z = Math.sin(elapsed * 8) * wobble;
                    backCoinStack.rotation.x = Math.cos(elapsed * 6.2) * wobble * 0.55;
                }

                attackTimer -= dt;
                const target = nearestTarget();
                if (target && attackTimer <= 0) {
                    const mining = target.userData.type === "ore";
                    // 凿不动的矿放慢挥击间隔，否则每 0.3 秒一次弹开音效会变成噪音。
                    const blocked = mining && !canMine(target.userData.node);
                    attackTimer = blocked ? 0.75 : (mining ? CONFIG.mineCooldown : CONFIG.attackCooldown);
                    const facing = target.position.clone().sub(player.position).setY(0);
                    if (facing.lengthSq() > 0.01) {
                        player.rotation.y = lerpAngle(player.rotation.y, Math.atan2(facing.x, facing.z), 0.55);
                    }
                    playerAttack(target);
                }
            }

            function resolvePlayerMove(dt) {
                const next = player.position.clone().addScaledVector(moveVelocity, dt);
                const resolved = resolveCirclePosition(player.position, next, CONFIG.playerRadius);
                player.position.copy(resolved);

                const limit = CONFIG.arenaRadius - 2.4;
                const distance = Math.hypot(player.position.x, player.position.z);
                if (distance > limit) {
                    const scale = limit / distance;
                    player.position.x *= scale;
                    player.position.z *= scale;
                }
            }

            function resolveCirclePosition(from, to, radius) {
                const result = to.clone();
                for (const collider of solidColliders) {
                    if (collider.radius <= 0) continue;
                    const dx = result.x - collider.x;
                    const dz = result.z - collider.z;
                    const minDistance = collider.radius + radius;
                    const distance = Math.hypot(dx, dz);
                    if (distance >= minDistance || distance < 0.0001) continue;
                    const scale = minDistance / distance;
                    result.x = collider.x + dx * scale;
                    result.z = collider.z + dz * scale;
                }
                for (const node of oreNodes) {
                    if (node.cleared || node.currentRadius <= 0) continue;
                    const dx = result.x - node.position.x;
                    const dz = result.z - node.position.z;
                    const minDistance = node.currentRadius + radius;
                    const distance = Math.hypot(dx, dz);
                    if (distance >= minDistance || distance < 0.0001) continue;
                    const scale = minDistance / distance;
                    result.x = node.position.x + dx * scale;
                    result.z = node.position.z + dz * scale;
                }
                result.y = from.y;
                return result;
            }

            function nearestTarget() {
                let bestEnemy = null;
                let bestEnemyDistance = Infinity;
                for (const enemy of enemies) {
                    if (!enemy.userData.alive || !enemy.userData.attackable) continue;
                    const distance = flatDistance(enemy.position, player.position);
                    if (distance < bestEnemyDistance) {
                        bestEnemyDistance = distance;
                        bestEnemy = enemy;
                    }
                }
                if (bestEnemy && bestEnemyDistance <= CONFIG.attackRange + 1.4) return bestEnemy;

                // 挖得动的矿优先；范围内只有凿不动的矿时仍然瞄准它，好让玩家收到「等级不足」的反馈。
                let bestOre = null;
                let bestOreDistance = Infinity;
                let blockedOre = null;
                let blockedDistance = Infinity;
                for (const node of oreNodes) {
                    if (node.cleared) continue;
                    const distance = flatDistance(node.position, player.position) - node.currentRadius;
                    if (canMine(node)) {
                        if (distance < bestOreDistance) {
                            bestOreDistance = distance;
                            bestOre = node;
                        }
                    } else if (distance < blockedDistance) {
                        blockedDistance = distance;
                        blockedOre = node;
                    }
                }
                if (bestOre && bestOreDistance <= CONFIG.mineRange) return bestOre.group;
                if (blockedOre && blockedDistance <= CONFIG.mineRange) return blockedOre.group;
                return null;
            }

            function playerAttack(target) {
                const mining = target.userData.type === "ore";
                attackSequence = mining ? 3 : (attackSequence % 3) + 1;
                playerWeapon.userData.swing = 1;
                attackLunge = 1;
                const color = mining ? target.userData.node.tier.glow : 0x8fd6ff;
                createAttackArc(color, attackSequence);
                playSound("attack");

                defer(attackSequence === 3 ? 0.14 : 0.1, () => {
                    if (mining) {
                        if (target.userData.node.cleared) return;
                        mineOre(target.userData.node);
                        return;
                    }
                    if (!target.userData.alive) return;
                    const damage = 235 + (pickaxeLevel - 1) * 190 + (petEvolved ? 220 : 0);
                    const shown = attackSequence === 3 ? Math.round(damage * 3.35) : damage;
                    const knockback = target.position.clone().sub(player.position).setY(0).normalize();
                    target.userData.knockback = knockback.multiplyScalar(attackSequence === 3 ? 2.2 : 0.9);
                    target.userData.stagger = attackSequence === 3 ? 0.18 : 0.08;
                    cameraShake = Math.max(cameraShake, attackSequence === 3 ? 0.18 : 0.07);
                    buildPopEffect(
                        target.position.clone().add(new THREE.Vector3(0, 1.4, 0)),
                        attackSequence === 3 ? 12 : 6,
                        color
                    );
                    damageEnemy(target, attackSequence === 3 ? Math.round(damage * 3.35) : damage, shown, attackSequence === 3);
                    playSound(attackSequence === 3 ? "hit" : "attack");
                });
            }

            function createAttackArc(color, sequence) {
                const radius = sequence === 3 ? 1.65 : 1.25;
                const arc = new THREE.Mesh(
                    new THREE.TorusGeometry(radius, sequence === 3 ? 0.13 : 0.08, 6, 26, Math.PI * 1.35),
                    new THREE.MeshBasicMaterial({
                        color,
                        transparent: true,
                        opacity: sequence === 3 ? 0.95 : 0.7,
                        side: THREE.DoubleSide
                    })
                );
                const forward = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
                arc.position.copy(player.position).add(forward.multiplyScalar(1.05));
                arc.position.y = 1.35;
                arc.rotation.y = player.rotation.y;
                arc.rotation.z = sequence === 2 ? 0.45 : -0.65;
                scene.add(arc);
                effects.push({ type: "slash", mesh: arc, life: 0.24, maxLife: 0.24 });
            }

            function damagePlayer(amount, sourcePosition, knockback = 0) {
                if (ctaOpen || cinematic.active) return;
                playerHp = Math.max(CONFIG.playerMinHp, playerHp - amount);
                updateUI();
                showDamage(player.position, `-${amount}`, false);
                cameraShake = Math.max(cameraShake, 0.35);
                playSound("hurt");
                if (knockback > 0 && sourcePosition) {
                    const direction = player.position.clone().sub(sourcePosition).setY(0);
                    if (direction.lengthSq() < 0.01) direction.set(0, 0, 1);
                    direction.normalize();
                    const target = player.position.clone().addScaledVector(direction, knockback);
                    player.position.copy(resolveCirclePosition(player.position, target, CONFIG.playerRadius));
                }
            }

            function updateCamera(dt) {
                if (cinematic.active) {
                    camera.position.lerp(cinematic.cameraTarget, 1 - Math.exp(-cinematic.response * dt));
                    cameraFocus.lerp(cinematic.lookTarget, 1 - Math.exp(-cinematic.response * dt));
                    applyCameraShake(dt);
                    camera.lookAt(cameraFocus);
                    return;
                }
                const lead = moveVelocity.clone().multiplyScalar(0.15);
                const desiredFocus = player.position.clone().add(lead).add(new THREE.Vector3(0, 0.85, -2.6));
                cameraFocus.lerp(desiredFocus, 1 - Math.exp(-6.5 * dt));
                const desired = cameraFocus.clone().add(new THREE.Vector3(0, 26, 19.5));
                camera.position.lerp(desired, 1 - Math.exp(-7.5 * dt));
                applyCameraShake(dt);
                camera.lookAt(cameraFocus);
            }

            function applyCameraShake(dt) {
                if (cameraShake <= 0) return;
                cameraShake = Math.max(0, cameraShake - dt * 1.7);
                camera.position.x += (Math.random() - 0.5) * cameraShake;
                camera.position.y += (Math.random() - 0.5) * cameraShake * 0.5;
            }

            function createCity() {
                city.group = new THREE.Group();
                scene.add(city.group);

                const ghost = new THREE.Mesh(
                    new THREE.CircleGeometry(CITY_STAGES[0].radius, 48),
                    new THREE.MeshBasicMaterial({
                        color: 0x77d4ff,
                        transparent: true,
                        opacity: 0.09,
                        side: THREE.DoubleSide
                    })
                );
                ghost.rotation.x = -Math.PI / 2;
                ghost.position.y = 0.03;
                city.group.add(ghost);
                city.ghost = ghost;

                let previousRadius = 0;
                for (const definition of CITY_STAGES) {
                    city.stages.push(createCityStage(definition, previousRadius));
                    previousRadius = definition.radius;
                }

                city.buildings.keep = createKeep();
                city.buildings.workshop = createWorkshop();
                city.buildings.nest = createNest();
                city.buildings.altar = createAltar();
            }

            function createCityStage(definition, innerRadius) {
                const stage = { definition, props: [], walls: [], houses: [] };

                const floor = new THREE.Mesh(
                    innerRadius > 0
                        ? new THREE.RingGeometry(innerRadius - 0.05, definition.radius, 64)
                        : new THREE.CircleGeometry(definition.radius, 64),
                    shared.cityFloorMat
                );
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = 0.04;
                floor.receiveShadow = true;
                floor.visible = false;
                city.group.add(floor);
                stage.floor = floor;

                const wallGroup = new THREE.Group();
                wallGroup.visible = false;
                city.group.add(wallGroup);
                const blockWidth = 1.45;
                const segments = Math.ceil((Math.PI * 2 * definition.radius) / blockWidth);
                for (let i = 0; i < segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;
                    if (Math.abs(Math.sin(angle * 2)) < 0.3) continue;
                    const merlon = i % 2 === 0;
                    const height = merlon ? 1.72 : 1.24;
                    const block = new THREE.Mesh(shared.box, shared.cityStoneMat);
                    block.scale.set(blockWidth * 1.08, height, 0.78);
                    block.position.set(
                        Math.cos(angle) * definition.radius,
                        height * 0.5,
                        Math.sin(angle) * definition.radius
                    );
                    block.rotation.y = -angle - Math.PI / 2;
                    block.castShadow = true;
                    block.receiveShadow = true;
                    wallGroup.add(block);
                    stage.walls.push(block);
                }
                stage.wallGroup = wallGroup;

                for (const angle of [Math.PI / 4, Math.PI * 0.75, Math.PI * 1.25, Math.PI * 1.75]) {
                    const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.86, 1, 2.5, 8), shared.cityStoneMat);
                    tower.position.set(
                        Math.cos(angle) * definition.radius,
                        1.25,
                        Math.sin(angle) * definition.radius
                    );
                    tower.castShadow = true;
                    wallGroup.add(tower);
                    stage.walls.push(tower);
                    const cap = new THREE.Mesh(new THREE.ConeGeometry(1.1, 1, 8), shared.cityRoofMat);
                    cap.position.copy(tower.position).setY(3);
                    cap.castShadow = true;
                    wallGroup.add(cap);
                    stage.walls.push(cap);
                }

                const torchCount = definition.level === 1 ? 4 : 3;
                for (let i = 0; i < torchCount; i++) {
                    const angle = (i / torchCount) * Math.PI * 2 + definition.level * 0.5;
                    const torch = createTorch();
                    torch.position.set(
                        Math.cos(angle) * (definition.radius - 1.5),
                        0,
                        Math.sin(angle) * (definition.radius - 1.5)
                    );
                    torch.visible = false;
                    city.group.add(torch);
                    stage.props.push(torch);
                }

                for (const slot of HOUSE_SLOTS[definition.level] || []) {
                    const house = createHouse(slot.seed);
                    house.position.set(slot.x, 0, slot.z);
                    house.rotation.y = slot.rotation;
                    house.visible = false;
                    city.group.add(house);
                    stage.props.push(house);
                    stage.houses.push(slot);
                }

                return stage;
            }

            function createHouse(seed) {
                const rand = seededRandom(seed);
                const group = new THREE.Group();
                const width = 2 + rand() * 0.9;
                const depth = 1.9 + rand() * 0.8;
                const height = 1.5 + rand() * 0.6;

                const walls = new THREE.Mesh(shared.box, shared.cityTrimMat);
                walls.scale.set(width, height, depth);
                walls.position.y = height * 0.5;
                walls.castShadow = true;
                walls.receiveShadow = true;
                group.add(walls);

                const roof = new THREE.Mesh(new THREE.ConeGeometry(width * 0.82, height * 0.86, 4), shared.cityRoofMat);
                roof.position.y = height + height * 0.4;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                group.add(roof);

                const door = new THREE.Mesh(shared.box, shared.cityStoneMat);
                door.scale.set(width * 0.28, height * 0.6, 0.12);
                door.position.set(0, height * 0.3, depth * 0.52);
                group.add(door);

                const window = new THREE.Mesh(shared.box, new THREE.MeshStandardMaterial({
                    color: 0xffd08a,
                    emissive: 0xd9821f,
                    emissiveIntensity: 0.9
                }));
                window.scale.set(width * 0.2, height * 0.24, 0.1);
                window.position.set(width * 0.28, height * 0.62, depth * 0.52);
                group.add(window);

                return group;
            }

            function createTorch() {
                const group = new THREE.Group();

                post.scale.set(0.18, 1.5, 0.18);
                post.position.y = 0.75;
                post.castShadow = true;
                group.add(post);
                const flame = new THREE.Mesh(
                    new THREE.ConeGeometry(0.24, 0.62, 8),

                );
                flame.position.y = 1.75;
                group.add(flame);

            }

            function createKeep() {

                city.group.add(group);

                const base = new THREE.Mesh(shared.box, shared.cityStoneMat);
                base.scale.set(3.6, 2.4, 3.6);
                base.position.y = 1.2;
                base.castShadow = true;
                group.add(base);

                const tower = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.35, 3.2, 10), shared.cityStoneMat);
                tower.position.y = 3.7;
                tower.castShadow = true;
                group.add(tower);

                const roof = new THREE.Mesh(new THREE.ConeGeometry(1.7, 1.7, 10), shared.cityRoofMat);
                roof.position.y = 6.1;

                const banner = new THREE.Mesh(

            function createWorkshop() {
                const slot = BUILDING_SLOTS.workshop;
                const group = new THREE.Group();
                group.position.set(slot.x, 0, slot.z);
                group.visible = false;
                city.group.add(group);

                const hut = new THREE.Mesh(shared.box, shared.cityTrimMat);
                hut.scale.set(2.4, 1.7, 2.2);
                hut.position.y = 0.85;
                hut.castShadow = true;
                group.add(hut);

                const roof = new THREE.Mesh(new THREE.ConeGeometry(1.9, 1.2, 4), shared.cityRoofMat);

                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                group.add(roof);

                const anvil = new THREE.Mesh(shared.box, new THREE.MeshStandardMaterial({
                    color: 0x3a3a46,

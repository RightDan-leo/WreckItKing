<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Wreck It King - 火焰巨龙</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #090712;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; }
        .nipple .back { opacity: 0.22 !important; }
        .nipple .front { opacity: 0.58 !important; }
        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 12000;
        }
        #player-hud {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: 14px;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 12px 7px 7px;
            color: white;
            background: rgba(8, 7, 18, 0.72);
            border: 1px solid rgba(115, 210, 255, 0.55);
            border-radius: 34px 12px 12px 34px;
            backdrop-filter: blur(5px);
        }
        #portrait {
            position: relative;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 3px solid #63d7ff;
            background: radial-gradient(circle at 50% 35%, #65c9ff 0 20%, #152e72 22% 52%, #07122f 54%);
            box-shadow: 0 0 14px rgba(64, 201, 255, 0.7);
        }
        #portrait::after {
            content: "";
            position: absolute;
            left: 11px;
            right: 11px;
            bottom: 5px;
            height: 19px;
            border-radius: 50% 50% 35% 35%;
            background: #1e6fa0;
        }
        #hud-info { min-width: 92px; }
        #power {
            font-size: 23px;
            line-height: 25px;
            font-weight: 900;
            text-shadow: 0 0 10px #7bdfff;
        }
        #power-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #98cbe1;
        }
        #hp-track {
            width: 96px;
            height: 6px;
            margin-top: 4px;
            border-radius: 5px;
            overflow: hidden;
            background: rgba(255,255,255,0.18);
        }
        #hp-fill {
            width: 100%;
            height: 100%;
            background: #58e486;
            transition: width 0.2s;
        }
        #coin-hud {
            position: fixed;
            top: max(19px, env(safe-area-inset-top));
            right: 14px;
            min-width: 112px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 0 14px;
            color: white;
            font-size: 25px;
            font-weight: 900;
            background: rgba(8, 7, 18, 0.78);
            border: 1px solid rgba(255, 197, 50, 0.4);
            border-radius: 22px 8px 8px 22px;
        }
        .coin-icon {
            width: 27px;
            height: 27px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #a35d00;
            font-size: 17px;
            background: #ffd339;
            border: 3px solid #ffed8a;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 196, 0, 0.7);
        }
        #city-hud {
            position: fixed;
            top: max(68px, calc(env(safe-area-inset-top) + 54px));
            right: 14px;
            padding: 5px 13px;
            color: #ffd9a8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            background: rgba(8, 7, 18, 0.6);
            border: 1px solid rgba(255, 170, 80, 0.35);
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.25s;
        }
        #city-hud.show { opacity: 1; }
        #boss-hud {
            position: absolute;
            top: max(calc(11vh + 18px), calc(env(safe-area-inset-top) + 92px));
            left: 50%;
            width: min(82vw, 520px);
            transform: translateX(-50%);
            display: none;
            text-align: center;
            color: white;
            text-shadow: 0 2px 4px black;
        }
        #boss-name { font-family: Georgia, serif; font-size: 24px; font-weight: 900; }
        #boss-title { margin: 2px 0 5px; font-size: 11px; color: #f0c9b4; }
        #boss-level { position: absolute; left: 0; bottom: 10px; font-weight: 900; }
        #boss-bar {
            position: relative;
            height: 17px;
            margin-left: 52px;
            overflow: hidden;
            background: #1a111c;
            border: 2px solid rgba(255,255,255,0.65);
            border-radius: 10px;
        }
        #boss-fill {
            width: 100%;
            height: 100%;
            background: #d91d35;
            transition: width 0.15s;
        }
        #boss-hp-text {
            position: absolute;
            inset: 0;
            font-size: 12px;
            font-weight: 700;
            line-height: 17px;
        }
        #tutorial {
            position: fixed;
            left: 50%;
            bottom: 17vh;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.35s;
        }
        #tutorial-ring {
            position: relative;
            width: 86px;
            height: 86px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.55);
        }
        #tutorial-hand {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 26px;
            height: 26px;
            margin: -13px 0 0 -13px;
            border-radius: 50% 50% 50% 12%;
            background: rgba(255,255,255,0.92);
            box-shadow: 0 0 14px rgba(255,255,255,0.6);
            animation: handHint 1.7s ease-in-out infinite;
        }
        @keyframes handHint {
            0% { transform: translate(0, 22px) scale(0.92); opacity: 0.35; }
            45% { transform: translate(0, -20px) scale(1); opacity: 1; }
            100% { transform: translate(0, 22px) scale(0.92); opacity: 0.35; }
        }
        #tutorial-copy {
            padding: 7px 16px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            background: rgba(8, 7, 18, 0.72);
            border-radius: 18px;
        }
        #toast {
            position: fixed;
            left: 50%;
            top: max(28vh, 190px);
            padding: 9px 20px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            background: rgba(8, 7, 18, 0.8);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 20px;
            transform: translate(-50%, -8px);
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
        }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }
        #guide-arrow {
            position: fixed;
            left: 50%;
            top: 50%;
            display: none;
            color: #ffd54a;
            font-size: 30px;
            text-shadow: 0 0 12px rgba(255, 190, 40, 0.9);
            transform: translate(-50%, -50%);
        }
        #labels, #damage-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .damage {
            position: absolute;
            color: white;
            font-size: 19px;
            font-weight: 900;
            text-shadow: 0 2px 5px rgba(0,0,0,0.85);
            transform: translate(-50%, -50%);
            animation: floatUp 0.75s ease-out forwards;
        }
        .damage.big { font-size: 29px; color: #ffe14d; }
        .damage.gold {
            font-size: 34px;
            color: #ffd23c;
            text-shadow: 0 0 14px rgba(255, 176, 40, 0.9), 0 3px 6px rgba(0,0,0,0.9);
            animation: goldPop 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.7); }
            30% { transform: translate(-50%, -95%) scale(1.15); }
            100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
        }
        /* 金币总额比伤害数字停得久、弹得狠：它是一次横扫的结算，不是一次挥锄的反馈。 */
        @keyframes goldPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            18% { opacity: 1; transform: translate(-50%, -80%) scale(1.45); }
            34% { transform: translate(-50%, -92%) scale(1.1); }
            72% { opacity: 1; transform: translate(-50%, -128%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -190%) scale(0.95); }
        }
        /* 数字每跳一次就顶一下。连着进账时这一下会不停被打断重放，读起来就是「还在涨」。 */
        #coin-hud.pop { animation: coinPop 0.22s ease-out; }
        @keyframes coinPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.16); border-color: rgba(255, 226, 130, 0.95); }
            100% { transform: scale(1); }
        }
        #gem-hud {
            position: fixed;
            top: max(68px, calc(env(safe-area-inset-top) + 49px));
            right: 14px;
            min-width: 112px;
            height: 36px;
            display: none;
            align-items: center;
            justify-content: flex-end;
            gap: 9px;
            padding: 0 14px;
            color: white;
            font-size: 21px;
            font-weight: 900;
            background: rgba(8, 7, 18, 0.78);
            border: 1px solid rgba(95, 230, 255, 0.45);
            border-radius: 22px 8px 8px 22px;
        }
        /* 纯金币版整条不存在，主城行也收回原位，免得留一块空白 */
        body.econ-gem #gem-hud { display: flex; }
        body.econ-gem #city-hud { top: max(156px, calc(env(safe-area-inset-top) + 147px)); }
        /* 宝石。只显示当前锄头要收的那一档，颜色跟着品质走（内联样式，见 updateUI），
           所以这里不写死颜色；锄头满级后整条隐藏（.spent）。 */
        #shard-hud {
            position: fixed;
            top: max(112px, calc(env(safe-area-inset-top) + 98px));
            right: 14px;
            min-width: 112px;
            height: 36px;
            display: none;
            align-items: center;
            justify-content: flex-end;
            gap: 9px;
            padding: 0 14px;
            color: white;
            font-size: 21px;
            font-weight: 900;
            background: rgba(8, 7, 18, 0.78);
            border: 1px solid rgba(120, 220, 180, 0.45);
            border-radius: 22px 8px 8px 22px;
        }
        body.econ-gem #shard-hud { display: flex; }
        body.econ-gem #shard-hud.spent { display: none; }
        /* 满级后这条收起来，主城行跟着回到钻石行下面，免得中间空一格。 */
        body.econ-gem #shard-hud.spent ~ #city-hud { top: max(112px, calc(env(safe-area-inset-top) + 98px)); }
        .shard-icon {
            width: 19px;
            height: 19px;
            /* 菱形。金币是圆的、钻石是转 45 度的方块（带圆角），宝石这颗用尖角切出来的
               细长菱形——三种货币的剪影必须在俯视小图标下也分得开，颜色只是第二道保险。 */
            clip-path: polygon(50% 0%, 100% 38%, 50% 100%, 0% 38%);
            background: #4ff0bb;
        }
        #shard-hud.pop { animation: gemPop 0.26s ease-out; }
        .gem-icon {
            width: 21px;
            height: 21px;
            /* 转 45 度的方块。金币是圆的，两者的剪影得一眼分得开，不能只靠颜色 */
            transform: rotate(45deg);
            background: #5fe6ff;
            border: 3px solid #b6f4ff;
            border-radius: 5px;
            box-shadow: 0 0 11px rgba(95, 230, 255, 0.75);
        }
        #gem-hud.pop { animation: gemPop 0.26s ease-out; }
        @keyframes gemPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.2); border-color: rgba(180, 245, 255, 0.98); }
            100% { transform: scale(1); }
        }
        /* 开局前的版本切换，上线时随调试钩子一起摘掉 */
        #econ-switch {
            position: fixed;
            left: 50%;
            bottom: max(26px, env(safe-area-inset-bottom));
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            padding: 9px 20px;
            color: #eaf6ff;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.5px;
            background: rgba(8, 7, 18, 0.82);
            border: 1px solid rgba(150, 210, 255, 0.45);
            border-radius: 14px;
            cursor: pointer;
            z-index: 30;
            /* #ui 整层是 pointer-events: none 的 HUD 罩子，不显式收回来的话点击会穿透到
               canvas 上——那一下正好被当成「开始游戏」，版本永远切不了。 */
            pointer-events: auto;
        }
        #econ-switch .econ-hint {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1px;
            color: rgba(190, 215, 240, 0.7);
        }
        #econ-switch.hidden { display: none; }
        #egg-lock {
            position: fixed;
            left: 0;
            top: 0;
            width: 72px;
            height: 72px;
            margin: -36px 0 0 -36px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #egg-lock.show { opacity: 1; }
        #egg-lock svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .egg-lock-track { fill: rgba(8,7,18,0.55); stroke: rgba(255,255,255,0.28); stroke-width: 5; }
        .egg-lock-bar {
            fill: none;
            stroke: #ffd54a;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 175.93;
            stroke-dashoffset: 175.93;
            transition: stroke-dashoffset 0.08s linear;
        }
        .egg-lock-core { fill: rgba(255, 213, 74, 0.16); }
        #egg-lock.charging .egg-lock-core { fill: rgba(255, 213, 74, 0.3); }
        #restart {
            position: fixed;
            right: 12px;
            bottom: 12px;
            padding: 8px 14px;
            color: white;
            font-size: 12px;
            background: rgba(78, 42, 120, 0.85);
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 10px;
            pointer-events: auto;
            cursor: pointer;
        }
        /* 调参面板，上线时随调试钩子一起摘掉 */
        #tuner-toggle {
            position: fixed;
            left: 12px;
            bottom: max(12px, env(safe-area-inset-bottom));
            padding: 8px 14px;
            color: #cfeaff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            background: rgba(8, 7, 18, 0.82);
            border: 1px solid rgba(115, 210, 255, 0.5);
            border-radius: 10px;
            pointer-events: auto;
            cursor: pointer;
            z-index: 30;
        }
        #tuner {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: min(360px, 94vw);
            display: flex;
            flex-direction: column;
            color: #eaf6ff;
            font-size: 12px;
            background: rgba(8, 7, 18, 0.94);
            border-left: 1px solid rgba(115, 210, 255, 0.4);
            backdrop-filter: blur(6px);
            pointer-events: auto;
            z-index: 12000;
        }
        #tuner.hidden, #tuner-reload.hidden, #tuner-out.hidden { display: none; }
        #tuner-top {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(115, 210, 255, 0.25);
        }
        #tuner-title { font-size: 14px; font-weight: 900; letter-spacing: 1px; }
        #tuner-count {
            margin-left: auto;
            font-size: 11px;
            font-weight: 700;
            color: #ffd339;
        }
        #tuner-count.dim { color: rgba(190, 215, 240, 0.5); font-weight: 600; }
        #tuner-close {
            padding: 2px 8px;
            color: #cfeaff;
            font-size: 13px;
            background: transparent;
            border: 1px solid rgba(150, 210, 255, 0.35);
            border-radius: 8px;
            cursor: pointer;
        }
        #tuner-reload {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            font-size: 11px;
            color: #2a1a05;
            background: linear-gradient(180deg, #ffd06a, #ffb347);
        }
        #tuner-reload button {
            margin-left: auto;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 900;
            color: #2a1a05;
            background: rgba(255, 255, 255, 0.55);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #tuner-body { flex: 1; overflow-y: auto; padding: 6px 0 10px; }
        .tune-group { border-bottom: 1px solid rgba(115, 210, 255, 0.14); }
        .tune-group > summary {
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #9ddcff;
            cursor: pointer;
        }
        .tune-note {
            padding: 0 14px 8px;
            font-size: 10px;
            line-height: 1.6;
            color: rgba(190, 215, 240, 0.6);
        }
        .tune-row { padding: 5px 14px 9px; }
        .tune-row.changed { background: rgba(255, 211, 57, 0.08); }
        .tune-head { display: flex; align-items: center; gap: 8px; }
        .tune-label { flex: 1; font-size: 11px; color: rgba(226, 240, 255, 0.92); }
        .tune-row.changed .tune-label { color: #ffd339; }
        .tune-reload-flag {
            margin-left: 6px;
            padding: 1px 5px;
            font-size: 9px;
            font-style: normal;
            color: #ffb347;
            border: 1px solid rgba(255, 179, 71, 0.5);
            border-radius: 5px;
        }
        .tune-num {
            width: 74px;
            padding: 3px 6px;
            color: #eaf6ff;
            font-size: 11px;
            text-align: right;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(150, 210, 255, 0.3);
            border-radius: 6px;
        }
        .tune-slider { width: 100%; margin-top: 5px; accent-color: #63d7ff; cursor: pointer; }
        .tune-row.changed .tune-slider { accent-color: #ffd339; }
        #tuner-foot {
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            border-top: 1px solid rgba(115, 210, 255, 0.25);
        }
        #tuner-foot button {
            flex: 1;
            padding: 8px 4px;
            color: #cfeaff;
            font-size: 11px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(150, 210, 255, 0.35);
            border-radius: 9px;
            cursor: pointer;
        }
        #tuner-foot button.primary {
            color: #2a1a05;
            background: linear-gradient(180deg, #ffd06a, #ffb347);
            border-color: transparent;
        }
        #tuner-foot button:disabled { opacity: 0.5; cursor: default; }
        #tuner-out {
            margin: 0 14px 14px;
            padding: 8px;
            color: #cfeaff;
            font-size: 11px;
            font-family: Consolas, monospace;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(150, 210, 255, 0.3);
            border-radius: 8px;
            resize: vertical;
        }
        #cinematic-bars {
            position: fixed;
            inset: 0;
            opacity: 0;
            transition: opacity 0.5s;
        }
        #cinematic-bars.show { opacity: 1; }
        #cinematic-bars::before, #cinematic-bars::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 11vh;
            background: #000;
        }
        #cinematic-bars::before { top: 0; }
        #cinematic-bars::after { bottom: 0; }
        #cinematic-title {
            position: fixed;
            left: 50%;
            top: 24%;
            color: #ffb347;
            font-family: Georgia, serif;
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 6px;
            white-space: nowrap;
            text-shadow: 0 0 26px rgba(255, 110, 30, 0.95), 0 4px 10px #000;
            transform: translate(-50%, 12px);
            opacity: 0;
            transition: opacity 0.45s, transform 0.45s;
        }
        #cinematic-title.show { opacity: 1; transform: translate(-50%, 0); }
        #cinematic-sub {
            position: fixed;
            left: 50%;
            top: calc(24% + 52px);
            color: #ffe3c2;
            font-size: 14px;
            letter-spacing: 3px;
            white-space: nowrap;
            text-shadow: 0 2px 8px #000;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.45s;
        }
        #cinematic-sub.show { opacity: 1; }
        #end-screen {
            position: fixed;
            inset: 0;
            z-index: 13000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            padding: 26px 26px 12vh;
            text-align: center;
            color: white;
            background: linear-gradient(180deg, rgba(9, 6, 14, 0) 0%, rgba(9, 6, 14, 0.12) 34%, rgba(28, 8, 6, 0.78) 62%, rgba(9, 6, 14, 0.94) 100%);
        }
        #end-screen.show { display: flex; }
        #brand {
            font-family: Georgia, serif;
            font-size: 40px;
            font-weight: 900;
            line-height: 0.98;
            letter-spacing: 3px;
            color: #ffc46b;
            text-shadow: 0 0 24px rgba(255, 130, 40, 0.75);
        }
        #end-title { margin-top: 6px; font-size: 21px; font-weight: 800; }
        #end-copy { max-width: 330px; margin: 0; font-size: 13px; line-height: 1.6; color: #e3cfc2; }
        .end-button {
            width: min(78vw, 300px);
            padding: 14px;
            font-size: 17px;
            font-weight: 900;
            color: #35180a;
            background: linear-gradient(180deg, #ffd06a, #ff9a2e);
            border: none;
            border-radius: 13px;
            cursor: pointer;
        }
        .end-button.secondary {
            color: white;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.3);
        }
        @media (max-width: 520px) {

    <script>
        (() => {
            "use strict";

            const CONFIG = {
                playerSpeed: 9.4,
                playerAcceleration: 11,
                playerDeceleration: 16,
                playerRadius: 0.62,
                attackRange: 4.4,
                mineRange: 3.4,
                attackCooldown: 0.5,
                mineCooldown: 0.3,
                playerMaxHp: 100,
                playerMinHp: 15,
                startCoins: 10,
                coinDwell: 0.16,
                coinFlyStagger: 0.035,
                coinFlyToBackDuration: 0.3,
                coinFlyToZoneDuration: 0.38,
                backCoinMaxVisible: 70,
                maxCoinDrops: 110,
                backCoinStep: 0.075,
                zoneTileSize: 3.4,
                zonePulseSpeed: 3.4,
                zonePaymentInterval: 0.03,
                zonePaymentTicks: 50,
                arenaRadius: 48,
                guardXrayRange: 16,
                eggPickupDuration: 0.85,
                eggPickupRange: 2,
                eggPlaceDuration: 1.2,
                guideIdleDelay: 2.4,
                cityRiseDuration: 0.5,
                citySideStagger: 0.05,
                cityRiseDepth: 1.2,
                bossDisplayHp: 300300
            };

            // 三级矿是三道扇形矿墙，只朝一个方向铺开，玩家必须凿穿一层才能走到下一层。
            // 相机是固定俯视、不随玩家转的，所以「屏幕上方」就是世界 -Z，扇形中心方位角固定。
            // 角度一律用 atan2(z, x) 这套（0 = +X），-π/2 正对屏幕上方；扇形跨 [-3π/4, -π/4]，
            // 不跨越 ±π 的接缝，所以角度比较不用处理环绕。
            const SECTOR = {
                center: -Math.PI / 2,
                half: Math.PI / 4,
                // 主城那圈自由圆：玩家在里面不受角度限制，正好取到低级矿的内边。
                // 这圈半径同时是唯一一条环城道的外边——Lv4 主城内部被房子塞满，
                // 从矿区（屏幕上方）走到城前地贴（屏幕下方）穿不过建筑群，只能贴着围墙绕。
                // 建筑最外缘 14.7，收窄到 15.6 时那条道只剩 0.9 宽，人（直径 1.24）过不去。
                freeRadius: 16.3
            };
            SECTOR.start = SECTOR.center - SECTOR.half;
            SECTOR.end = SECTOR.center + SECTOR.half;
            SECTOR.span = SECTOR.half * 2;

            // 第四层的 id 拎出来做常量：规则层（凿不开）、生成层（不埋金币、不冻守卫）和
            // 终局演出（破封点在哪、只崩哪一层）三处都要点名它，散落的字符串对不上就是静默出错。
            const SEALED_TIER = "sealed";

            // ringThickness 决定隧道要挖多深，segmentCount 决定扇形切成几段（每段一只守卫野怪）。
            // 段数是按弧长定的，不是按角度：扇形只有整圈的四分之一，段数照原样给会让守卫密到
            // 每挖一格旁边都站着一只。现在每段弧长 14~20 米，和整环时期基本一致。
            // cellArc 是切向目标格宽：格数由扇形弧长自动算出并对齐段边界，保证段与段严丝合缝。
            const ORE_TIERS = {
                low: {
                    id: "low",
                    name: "低级矿",
                    ringRadius: 18.5,
                    ringThickness: 4.4,
                    ringHeight: 3.4,
                    segmentCount: 2,
                    grid: { radial: 4, rows: 3 },
                    cellArc: 1.25,
                    hardness: 2.4,
                    requiredPickaxe: 1,
                    cellsPerCoin: 4.1,
                    // 埋进这一环的宝石颗数。它不等于锄头价格：玩家凿的是隧道不是清场，
                    // 到手的只是「挖掉的格数占比」那一份。定价见 ECONOMY_PRESETS.gem.pickaxeCost。
                    shardYield: 6,
                    color: 0x2fb98a,
                    emissive: 0x0c4a3a,
                    chunkColor: 0x37d7a1,
                    glow: 0x4ff0bb,
                    monster: {
                        kind: "swipe",
                        hp: 850,
                        speed: 2.4,
                        damage: 3,
                        drop: 6,
                        scale: 0.72,
                        color: 0x2c9f79,
                        attackRange: 2.4,
                        windup: 0.55,
                        warningRadius: 2.1,
                        recovery: 0.7,
                        chaseRadius: 9,
                        reengageRadius: 8.2,
                        returnSpeed: 2.4
                    }
                },
                mid: {
                    id: "mid",
                    name: "中级矿",
                    ringRadius: 27.5,
                    ringThickness: 5.2,
                    ringHeight: 4.3,
                    segmentCount: 2,
                    grid: { radial: 4, rows: 3 },
                    cellArc: 1.3,
                    hardness: 3.6,
                    requiredPickaxe: 2,
                    cellsPerCoin: 2.9,
                    shardYield: 9,
                    color: 0x6a3bd0,
                    emissive: 0x2a0d63,
                    chunkColor: 0x8a54ee,
                    glow: 0xb478ff,
                    monster: {
                        kind: "slam",
                        hp: 3600,
                        speed: 2.6,
                        damage: 7,
                        drop: 12,
                        scale: 0.95,
                        color: 0x7443c9,
                        attackRange: 3,
                        windup: 0.7,
                        trackDuration: 0.35,
                        warningRadius: 3.1,
                        recovery: 0.85,
                        knockback: 2.2,
                        chaseRadius: 10,
                        reengageRadius: 9.2,
                        returnSpeed: 2.4
                    }
                },
                high: {
                    id: "high",
                    name: "高级矿",
                    // 从 39/6（36~42）内移到 37.5/5.4（34.8~40.2），给外面的封印矿腾地方。
                    // 让位的量是被终局构图定死的：对峙时玩家站在破封点内侧四米、侧向七米处，
                    // 那个落点的半径是 41.8，必须落在高级矿外缘和封印矿内缘之间的空走廊里，
                    // 否则他会被塞进实心矿墙、下一帧被碰撞推出画框。现在两侧各留 1.6 米。
                    // 径向格数不动，所以挖穿一条隧道要凿的格子数没变，只是每格薄了一点。
                    ringRadius: 37.5,
                    ringThickness: 5.4,
                    ringHeight: 5.4,
                    segmentCount: 3,
                    grid: { radial: 5, rows: 4 },
                    cellArc: 1.4,
                    hardness: 5,
                    requiredPickaxe: 3,
                    cellsPerCoin: 2.85,
                    shardYield: 16,
                    color: 0xd0522a,
                    emissive: 0x6b1405,
                    chunkColor: 0xff7a3c,
                    glow: 0xffa04f,
                    monster: {
                        kind: "fan",
                        hp: 9000,
                        speed: 2.8,
                        damage: 11,
                        drop: 22,
                        scale: 1.18,
                        color: 0xc2542c,
                        attackRange: 3.7,
                        windup: 0.8,
                        trackDuration: 0.35,
                        sectorRadius: 5,
                        sectorAngle: 100,
                        recovery: 1.1,
                        knockback: 3.4,
                        chaseRadius: 11,
                        reengageRadius: 10,
                        returnSpeed: 2.2
                    }
                },

                // 封印矿：走廊尽头那道凿不开的墙，火焰巨龙就封在里面。
                //
                // 它不是给玩家挖的，是给玩家看的。前三层一层比一层难，玩家会默认第四层
                // 只是「更难」，于是把三级锄头砸上去——弹回来。那道墙从这一下起不再是背景，
                // 而是一件他打不开的东西，里面透出来的剪影则说明了为什么打不开。
                // 终局演出接的就是这个疑问：龙自己从里面挣出来。
                //
                // requiredPickaxe 严格高于锄头上限，所以「凿不开」是数值上闭死的，不靠特判。
                // canMine、minableRemaining、pendingSweepTiers、ensureProgressAffordable
                // 走的都是同一个等级比较，这一层自动从「可挖」「该去」「能横扫」「算不算死路」
                // 四个判断里退出去。
                //
                // 这个数原来是 4，靠「锄头封顶三级」成立。宝石版加了第四级锄头之后那个前提没了，
                // 走廊尽头这堵墙会突然变得能凿——终局演出的全部前提「他打不开这堵墙」当场崩掉。
                // 抬到 5 只是把同一条闭死规则重新拉开一格；改锄头上限时必须一起抬。
                [SEALED_TIER]: {
                    id: SEALED_TIER,
                    name: "封印矿",
                    // 43.4~47.0。外缘离场地边缘那圈岩石还有一米，内缘离高级矿外缘 3.2 米——
                    // 那条走廊必须能站人：玩家得走到墙根底下才凿得到它，也才会知道自己凿不动。
                    ringRadius: 45.2,
                    ringThickness: 3.6,
                    // 比高级矿高出 0.8 米。走廊尽头这道墙要一眼比身后那道更压人，
                    // 但抬太多会顶穿封印剪影的构图——巨龙横躺在墙里，身体到头顶正好跨五米半。
                    ringHeight: 6.2,
                    // 切四段而不是两段。段数在这一层不再表示「几只守卫」（它没有守卫），
                    // 而是终局那段烧红演出的分辨率：烧红是按整段换材质做的，切两段时一段就有
                    // 三十五米宽，比破封镜头的画宽还大，整个画面会烧成一片，看不到两侧
                    // 还青着的墙作对照——「这一段要裂了」就退化成「这里本来就是红的」。
                    // 切到四段每段十七米半，刚好占画面中间一截。总格数不变（arcCells 由弧长和
                    // cellArc 定），代价只是多两个 draw call。
                    segmentCount: 4,
                    grid: { radial: 3, rows: 4 },
                    cellArc: 1.6,
                    hardness: 99,
                    requiredPickaxe: 5,
                    cellsPerCoin: 0,
                    shardYield: 0,
                    sealed: true,
                    // 深青。这个色是试出来的，不是挑出来的：矿石最终的颜色由自发光的色相说了算
                    // （albedo 会被场景光和 sRGB 编码一起提亮到中间调，压不住），所以第一版的
                    // 黑底金光渲染出来是一片土黄，像沙坡；换成熔岩红又和身后那道高级矿糊成一片，
                    // 走廊里两道墙是前后叠着看的，都取暖色就分不出人站在哪道墙前面。
                    // 冷色是这里唯一还空着的位置——前三层占了绿、紫、橙。
                    // 顺带它也是衬火最好的背景：巨龙在里面越烧越亮的那一段，红光压在青底上最跳，
                    // 崩出来的冰蓝碎块混在火里也一眼分得清哪些是墙、哪些是火。
                    color: 0x050b12,
                    emissive: 0x0e3a5a,
                    chunkColor: 0x4a93bd,
                    glow: 0x62c8ff
                    // 没有 monster：这一层封的是巨龙，不是又一只守卫。createOreNode 会跳过。
                }
            };
            const TIER_ORDER = ["low", "mid", "high", SEALED_TIER];

            // 献祭点的半径：封印矿内壁再往里 1.6 米。高级矿外缘 40.2、封印矿内缘 43.4，
            // 中间那条 3.2 米宽的走廊是唯一站得住人的地方，这个数落在它的中线上。
            // 用到的地方有两处（TILE_SLOTS.seal 和 breakSeal 的破封点），所以拎出来算一次。
            const SEAL_OFFER_RADIUS =
                ORE_TIERS[SEALED_TIER].ringRadius - ORE_TIERS[SEALED_TIER].ringThickness / 2 - 1.6;

            // 封印矿之外的深层矿脉：只给看，不给挖。玩家凿到走廊尽头才发现前面还有四层，
            // 一层比一层大、比一层稀有——「我玩到的只是开头」这句话由它们来说。
            //
            // 这批矿刻意不进 ORE_TIERS / TIER_ORDER / oreRings / oreNodes 任何一个数组。
            // 那几张表各自被十来处逻辑遍历（引导找最近的矿、横扫挑可清的层、终局数破封数、
            // 玩家边界找封印层、宝石品质按锄头等级索引 TIER_ORDER），多塞一层就要逐处加判断。
            // 单独一张表 + 单独一个建场函数，产物只挂 scene，是唯一不会牵动玩法的做法。
            //
            // ── 层数和高度是被相机夹出来的，不是随手定的 ──────────────────────
            // 俯视相机的画面顶边是一个斜向下的平面，越远越低，低于地面之后那段地面就不在
            // 画面里了——物体长得高只会更早被切掉，帮不上忙。常规跟随（26 米高、俯角 53°）
            // 够到玩家前方约 26 米，玩家最远走到 43，所以游戏中半径 69 以外一律看不见。
            // 终局对峙那一拍机位退到 22 米高、俯角 34°，够到半径 120 左右，CTA 的遮罩又是个
            // 底部渐变、上半截全透明——四层全露在那一拍里，压在巨龙背后。
            //
            // 高度必须逐层递增：俯视角下前一道墙会在身后投出一大片盲区，后墙只有高过
            // 「相机→前墙顶」这条射线的部分才露得出来。但又不能高过画面顶边。两条线从
            // 相反方向夹过来，按终局机位算到第五层时缝只剩半米——四层是这台相机的上限。
            const DEEP_VEINS = [
                {
                    id: "molten",
                    // 2.7~5.5 露在终局机位里，0.5~5.5 露在常规跟随里——这一层是唯一
                    // 两套机位都看得清整段的，所以它承担「原来后面还有」的第一次告知。
                    ringRadius: 53,
                    ringThickness: 3.4,
                    ringHeight: 5.5,
                    cellArc: 3.4,
                    rows: 3,
                    // 张角：每层比扇形本身多张开这么多（弧度，单边）。越深越宽，
                    // 读成「这条谷往深处越走越开」，同时跟着两侧岩壁一起退出画框中心。
                    flare: 0.05,
                    // 不能取冷色。封印矿是深青，这两道墙在画面里前后叠着看，
                    // 同色系分不出「这是第几道」。
                    //
                    // 但这一层必须是四层里最暗的：终局对峙那一拍，橙色的巨龙正好压在
                    // 它前面，亮红底会把龙的轮廓吃掉，两个暖色糊成一团。压暗之后龙才跳
                    // 得出来。顺带这也定了整条梯子的方向——越深越亮，读成「好东西在更里面」。
                    color: 0x150403,
                    emissive: 0x8f1d0a,
                    emissiveIntensity: 0.4,
                    glow: 0xff6a3a,
                    guards: 1,
                    guardScale: 1.7
                },
                {
                    id: "toxic",
                    ringRadius: 61,
                    ringThickness: 3.8,
                    ringHeight: 6.5,
                    cellArc: 3.8,
                    rows: 3,
                    flare: 0.12,
                    color: 0x08210f,
                    emissive: 0x1d8a38,
                    emissiveIntensity: 0.5,
                    glow: 0x66ff8a,
                    guards: 1,
                    guardScale: 2.1
                },
                {
                    id: "royal",
                    ringRadius: 70,
                    ringThickness: 4.4,
                    ringHeight: 8,
                    cellArc: 4.3,
                    rows: 3,
                    flare: 0.2,
                    color: 0x2e2008,
                    emissive: 0xb08420,
                    emissiveIntensity: 0.56,
                    glow: 0xffd257,
                    guards: 2,
                    guardScale: 2.5
                },
                {
                    id: "void",
                    // 顶被画面顶边切掉一截是故意的：一道墙高到出画，
                    // 读起来正是「它比前面几道都大」，比老老实实压进画框更唬人。
                    ringRadius: 80,
                    ringThickness: 5,
                    ringHeight: 10,
                    cellArc: 4.8,
                    rows: 3,
                    flare: 0.28,
                    color: 0x1b0a2e,
                    emissive: 0x7a2ecc,
                    emissiveIntensity: 0.64,
                    glow: 0xc07bff,
                    guards: 2,
                    guardScale: 3.2
                }
            ];
            // 场地边缘、地面圆盘、两侧岩壁都要让到最深那层之外，否则远景会被自己家的
            // 场地边缘挡没。留 12 的余量给雾去收边。
            const DEEP_FIELD_RADIUS = DEEP_VEINS[DEEP_VEINS.length - 1].ringRadius +
                DEEP_VEINS[DEEP_VEINS.length - 1].ringThickness / 2 + 12;

            // 走廊里的游荡怪。矿墙之间那三条空走廊原先是纯过道：玩家凿穿一层、穿过去、
            // 再对着下一堵墙开凿，中间那段路上什么都不发生，整个矿区看起来像一组静物。
            // 放几只来回踱步的杂兵之后，隔着半透明的矿墙就能看见远处有东西在动，
            // 「外面还有一层」这件事不用箭头也读得出来。
            //
            // 它们和冻在矿里的守卫是两种东西，代码上也必须分开（`type: "rover"`）：
            // 守卫是承重结构，钻石版的锄头钱全靠它们，`nearestLivingGuard()` 按 type 取人。
            // 游荡怪要是也算「守卫」，钻石不够时箭头就会指向一只根本不掉钻石的怪。
            //
            // 强度按「几下就能打死的杂兵」给，大约是同层守卫的三分之一血：它们是让世界动起来的，
            // 不是拦路的。掉落只有金币，理由同上。
            const ROVER_LANES = [
                // scale 是按「站在走廊里能看出是只怪」定的，不是按强度。0.5 那一版本体只有 1.3 米高，
                // 比玩家矮一头，混在碎石堆里像块会动的石头。0.62 起玩家一眼能认出轮廓，
                // 同时还明显小于同层守卫（守卫是 0.72 / 0.95 / 1.18，本体高出一米多）。
                //
                // drop 压到守卫的三分之一上下（守卫 6 / 12 / 22）。第一版给的 4 / 8 / 14 合计 52 金币，
                // 相当于把守卫那 102 的击杀收入加厚一半，实测钻石版从 142.5 秒掉到 102.8 秒——
                // 这些怪是氛围，不该动经济。压到合计 20 之后它只剩「打死了有响」这一份作用，
                // 不足以让玩家改主意专门去刷。
                { id: "lane-low", inner: "low", outer: "mid", hp: 300, damage: 2, drop: 2, speed: 2.2, scale: 0.62 },
                { id: "lane-mid", inner: "mid", outer: "high", hp: 900, damage: 4, drop: 3, speed: 2.5, scale: 0.72 },
                { id: "lane-high", inner: "high", outer: SEALED_TIER, hp: 2200, damage: 7, drop: 5, speed: 2.8, scale: 0.85 }
            ];

            // 每条走廊放两只，各占扇区的左右半边。巡逻区间要离扇区边界留出余量——
            // 贴着边走会半个身子插进侧面岩壁里。
            const ROVER_PATROLS = [
                { offset: -0.35, span: 0.22 },
                { offset: 0.35, span: 0.22 }
            ];

            // 玩家走到多近才扑上来。给得小是故意的：游荡怪的本职是「在那儿动」，
            // 贴脸了才还手。给到守卫那种九到十一米，玩家一进走廊就会被两只怪同时黏上，
            // 过路变成清场，而这条走廊本来只是去下一堵墙的路。
            const ROVER_AGGRO = 5;
            const ROVER_LEASH = 9;

            // 出土后的眼睛尺寸；冻在矿里时会放大，间距按 EYE_SPREAD_RATIO 同步拉开。
            const EYE_BASE_SCALE = 0.28;
            const EYE_BASE_OFFSET = 0.32;
            const EYE_SPREAD_RATIO = 1.45;

            // Lv1 半径从 7.4 收到 6.6：广场要占掉城北那一大块，原来那个圈扣掉广场和主堡
            // 之后放不下房子，开局会比改之前更空。收到 6.0 更紧凑，但那样连两栋房子都塞不进
            // 「避开中轴、又不和城墙角楼穿模」的夹缝里，6.6 是还能站住房子的下限。
            // 地贴不用跟着外移——除了「升级主城」那张，其余三张都是 Lv2 之后才解锁的。
            const CITY_STAGES = [
                { level: 1, radius: 6.6, cost: 10, unlock: null, label: "主城" },
                // 30 降到 20。实测第一次扩建要等到 19.0 秒——建成主城在 0.7 秒（起始金币
                // 正好够，不用挖），然后是全场第二长的一段空窗，而它偏偏排在最前面。
                // 广告的前十五秒是留存生死线，这段里玩家只是在挖第一片矿、走回城。
                // 30 枚要凿 123 格低级矿，20 枚 82 格，加上两趟各 1.3 秒的路，
                // 第二个进度点从 19 秒挪到 13 秒上下，落回中位间隔那一档。
                { level: 2, radius: 9.8, cost: 20, unlock: "pickaxe", label: "主城" },
                { level: 3, radius: 12.2, cost: 65, unlock: "hatchery", label: "主城" },
                { level: 4, radius: 14.6, cost: 100, unlock: "evolve", label: "主城" }
            ];

            const PICKAXE_LEVELS = [
                // power 是每次挥镐凿掉的格子数（配 ORE_TIERS.hardness 用），power_score 只进 HUD 战力。
                // 升级价格不在这儿，它按版本分别列在 ECONOMY_PRESETS.*.pickaxeCost。
                //
                // 表里有四级，但**能买到第几级由预设的 pickaxeCost 有几项决定**：A 版只列两项，
                // 买完 Lv3 时 resolveTileCost 返回 0，completePickaxe 顺手把地贴撤掉，于是 A 版
                // 照旧封顶三级。第四级是宝石版专用的——它是高级宝石唯一的出口。
                { level: 1, power: 6, power_score: 1241 },
                { level: 2, power: 12, power_score: 2056 },
                { level: 3, power: 20, power_score: 3480 },
                // 第四级不解锁新矿层（封印矿凿不开），它买的是速度：高级矿硬度 5，
                // 三级锄头一下凿四格、四级一下凿六格，剩下那大半环高级矿会明显开始融化。
                { level: 4, power: 30, power_score: 5240 }
            ];

            // 宝石的品质档位。id 直接复用矿层 id——「哪一层矿产哪一档宝石」是一一对应的，
            // 再单开一套映射只会多一处能对不上的地方。
            //
            // 需要哪一档由锄头当前等级决定：Lv1 升 Lv2 收 TIER_ORDER[0]（低级矿那档），
            // 也就是「上一级矿层产的宝石正好够买下一级锄头」。升完一级，要收的档位跟着进一格，
            // 手上那些低档宝石当场作废——想再升级只能往更深的矿里走。
            // ── 配色是按「压过宿主矿的颜色」定的，不是按矿层色抄的 ──────────────
            //
            // 第一版让宝石跟着矿层走（绿矿绿宝石、紫矿紫宝石），在实机上两个毛病一起犯：
            // 同色宝石埋进同色矿里等于隐身；而外面那层加色光晕把三档一起顶到过曝，
            // 三种颜色在屏幕上全是白的，品质根本读不出来。
            //
            // 所以改成每一档取宿主矿的对比色，再避开已经被占掉的两个色位——金币是金的、
            // 钻石是青的，宝石不能碰这两个，否则同一堆掉落物里分不清哪个进哪个账：
            //   初级 埋在青绿矿里 → 冰白，绿底上最跳的是不带绿的高亮
            //   中级 埋在紫矿里   → 青柠，紫的补色
            //   高级 埋在橙矿里   → 品红，橙底上唯一还留着的强对比位
            // 白→青柠→品红本身不构成「越来越贵」的直觉，所以品质阶梯另外由 scale 承担：
            // 一档比一档大一圈，颜色只管认得出、看得见。
            //
            // halo 是加色光晕专用的深色版本。加色是往画面上「加」，直接用本体那个亮色会把
            // 三个通道一起顶到 1.0，结果就是第一版那样——全白。压深之后加上去才保得住色相。
            const SHARD_GRADES = {
                low: { id: "low", name: "初级宝石", color: 0xdcefff, emissive: 0x6f9fd8, halo: 0x2f6fc8, css: "#dcefff", scale: 1 },
                // 中级这档偏绿而不是偏黄：黄绿在紫矿上和同时埋着的金币是同一个暖色区，
                // 远看两种掉落物混成一片，而它们进的是完全不同的账。
                mid: { id: "mid", name: "中级宝石", color: 0x7cff46, emissive: 0x2f9e0c, halo: 0x2f8c00, css: "#7cff46", scale: 1.18 },
                high: { id: "high", name: "高级宝石", color: 0xff4ab8, emissive: 0xb00060, halo: 0xa8005c, css: "#ff4ab8", scale: 1.4 }
            };

            // 两版经济并存，用来对比手感。差异全部收在这张表里，代码读的是 ECON 的字段而不是
            // 散落各处的 if (mode === 'gem')——复制一份 HTML 的话六千行要修两遍，两版必然漂移，
            // 对照本身就失去意义了。
            //
            // ── 命名坑，读到这儿必须先看清 ──────────────────────────────────
            // 代码里的 gem 一直指**钻石**（它比宝石早存在），宝石是 shard。中文文案以中文为准，
            // 不要按英文名对号入座。没有做重命名，是因为 ?econ=gem 这条链接已经分享出去了，
            // 而改名对玩家零收益、对这个六千行单文件却有实打实的破坏风险。
            //
            // B 版有三种货币，各走各的路，互不流通：
            //   coin  金币  挖矿按格连续产出        → 主城 Lv1–4（共 205）
            //   shard 宝石  预埋在矿体里，分三档品质 → 锄头 Lv2/3/4，每级收的品质进一档
            //   gem   钻石  守卫掉落                → 孵化台、宠物进化
            // 三条线互不流通，所以推进顺序由收入来源天然决定，orderInterlock 那把人工锁不需要。
            const ECONOMY_PRESETS = {
                coin: {
                    id: "coin",
                    label: "纯金币",
                    gems: false,
                    shards: false,
                    // 只有两项，所以 A 版封顶三级锄头，高级矿也就永远进不了横扫的名单。
                    // PICKAXE_LEVELS 里那条第四级对 A 版不存在。
                    pickaxeCost: [25, 85],
                    hatcheryCost: 45,
                    evolveCost: 140,
                    pickaxeCurrency: "coin",
                    hatcheryCurrency: "coin",
                    evolveCurrency: "coin",
                    guardGems: null,
                    guardKeepsCoins: true,
                    guardBlocksSegment: false,
                    // 金币版维持原触发链（进化 + 高级矿破封）。献祭点是宝石版专用的，
                    // 它要吃掉的那笔后段余币在这一版里不存在——A 版四项消费抢一个池子，
                    // 金币到最后是紧的，再插一笔 150 会把流程压死。
                    sealOffering: null,
                    orderInterlock: true
                },
                gem: {
                    id: "gem",
                    label: "金币+宝石+钻石",
                    gems: true,
                    shards: true,
                    // 三级升级，收的分别是初级/中级/高级宝石（品质由锄头当前等级推出，
                    // 见 requiredShardGrade）。数字压在个位数：宝石要读起来「贵重」，
                    // 一做到几百就和金币没区别了。
                    //
                    // Lv4 从 6 降到 4：它是全场最长的一段投入（实测 36.7 秒没有任何进度事件，
                    // 中位间隔才 10.9）。决定这段有多长的不是颗数，是「要凿掉这一层的百分之几」——
                    // 高级矿整环埋 16 颗，收 6 颗得挖 37%，收 4 颗只要 25%。剩下的由 Lv4 自带的
                    // 横扫一次性给完，玩家不会觉得少拿了什么；而且锄头满级后宝石 HUD 整个隐藏
                    // （见 updateShardHud 的 spent 分支），那笔余量他根本看不见。
                    pickaxeCost: [4, 5, 4],
                    pickaxeCurrency: "shard",
                    // 钻石接手宠物线。守卫数按每层的段数来：低 2、中 2、高 3，一共七只。
                    // 供给 2×3 + 2×4 + 3×4 = 26，花 8 + 14 = 22，余 4。
                    // 只打低中两档拿 14 颗，付完孵化台剩 6，够不着 14 的进化——
                    // 高级守卫因此是承重结构，而不是顺路。
                    hatcheryCost: 8,
                    evolveCost: 14,
                    hatcheryCurrency: "gem",
                    evolveCurrency: "gem",
                    // 高级档从 6 降到 4。原先按「高级只有两只守卫」算供给，实际是三只，
                    // 于是整局多发了 6 颗——实测通关时手上还剩 10 颗，而钻石 HUD 不像宝石
                    // 那样会在没处花时隐藏，那一串数字会一直挂在屏幕上。
                    guardGems: { low: 3, mid: 4, high: 4 },
                    // 有钻石可掉的守卫就不掉金币了。翻成 true 是「金币钻石双掉」，调节奏时的杠杆。
                    guardKeepsCoins: false,
                    // 关掉。这条规则（守卫活着那段矿就凿不动）本来是「把钻石供给从刚好够变成
                    // 必然够」的结构性保证，但它在手上读成一堵没道理的墙：玩家想挖矿，游戏拦住他，
                    // 理由是十几米外站着一只他还没注意到的怪。强制是达到了，动机没有——
                    // 他不是「想去打怪」，是「被拦下来只好去打怪」。
                    //
                    // 换成软引导：钻石门槛本身（锄头只收钻石）已经是硬约束，玩家不打怪就升不了锄头、
                    // 升不了锄头就凿不开下一层。缺的只是「钻石从哪来」这个信息，那是提示和箭头的活儿——
                    // 站上锄头地贴时告诉他还差几颗、去哪拿，箭头同时改指守卫。
                    // 供给的确定性改由引导保证（见 getGuideGoal 里钻石不足的分支）。
                    guardBlocksSegment: false,
                    // 封印献祭：金币在这一版的终点站，也是锄头 Lv4 唯一的解锁物。
                    // 主城 Lv4 在 82.6 秒买完之后金币就没有出口了，之后五十多秒挖出来的
                    // 一百六十多枚全是废的——而挖矿是这个游戏的核心动词，金币是它唯一的
                    // 即时反馈。150 这个数是按「几乎清空」定的：走到墙前时手上大约 160~165
                    // （Lv4 那一刻 118 + 横扫赏金 46，进化只花钻石），留个零头比刚好归零可信。
                    // 详见 specs/tasks/sealed-vein-offering.spec.md。
                    sealOffering: { cost: 120 },
                    // 四项消费抢一个池子时，得靠人工锁强行交替城和锄头，否则路过漏进地贴的金币
                    // 会先把远期扩建喂饱。货币一拆，推进顺序由收入来源天然决定，锁就不需要了。
                    orderInterlock: false
                }
            };
            let ECON = ECONOMY_PRESETS.coin;

            // 手感与战斗数值。原先这些是散在函数体里的字面量，改一个数要先翻出它藏在哪一行；
            // 集中到这里是为了能在控制台上直接调（`__wik.tune()` 返回的就是这些表的引用，
            // 改完立刻生效，不用改文件重载）。
            //
            // 经济数值不在这儿，它们各有各的表：
            //   ECONOMY_PRESETS  两版的价格、货币归属、守卫钻石掉落
            //   CITY_STAGES      主城四级的价格与解锁
            //   ORE_TIERS        每层矿的硬度、cellsPerCoin、守卫血量与金币掉落、环半径
            //   CONFIG           移动、攻击间隔、金币飞行等基础参数
            const BALANCE = {
                // 玩家伤害 = base + (锄头等级-1) × perPickaxe + (已进化 ? evolvedBonus : 0)，
                // 三连击的第三下再乘 comboMultiplier。
                playerDamage: { base: 235, perPickaxe: 190, evolvedBonus: 220, comboMultiplier: 3.35 },
                pet: {
                    hatched: { damage: 180, fireInterval: 0.85, range: 10 },
                    evolved: { damage: 620, fireInterval: 0.42, range: 14, powerGain: 3200 }
                },
                // 固定赏金，不按剩余格数结算。按格算的话低级矿值 94、中级矿值 187 金币，
                // 而整局全部开销才 315——两次横扫白送 89% 的经济，Lv3 到手游戏就结束了。
                // 按残矿比例折算同样不行：挖得越勤给得越少，最优解会变成故意少挖等白嫖。
                // high 只在宝石版用得上：那一档要四级锄头才进得了横扫的名单，而 A 版封顶三级。
                sweepBounty: { low: 18, mid: 30, high: 46 },
                // 金币抛射手感。ghostRatio 加的是只有视觉、不进账的金币，用来在不动经济数值的
                // 前提下把爆炸的密度撑起来。
                coinToss: {
                    sweep: { burst: 1.1, spread: 1.3, dwell: 0.02, stagger: 0.05, ghostRatio: 2.5 },
                    // 横扫收尾补的尾数不铺开也不错峰：它是在玩家脚下一次性补齐的，
                    // 错峰会让最后几枚拖在爆炸结束之后飞回来。
                    sweepTail: { burst: 1.1, dwell: 0.02, ghostRatio: 2.5 },
                    guardGem: { burst: 1.3, spread: 1.6, stagger: 0.06 }
                }
            };

            // ── 调参面板的字段表 ──────────────────────────────────────────────
            //
            // 上面那几张表是「数值住在哪儿」，这张是「哪些数值值得在游戏里拖」。两者不是一回事：
            // 矿石的颜色、守卫的攻击前摇也在表里，但调它们要看着画面反复试，滑块帮不上忙；
            // 真正需要边玩边拖的是节奏和数值曲线，所以这里只挑了这些。
            //
            // reload: true 的字段是建场时烘进几何或对象里的，改完必须重载页面。面板会把改动
            // 存进 localStorage 并在建场之前重新注入，所以重载不会丢——这也是为什么覆盖值的
            // 注入点必须在 createArena() 之前。
            const TUNING_SCHEMA = [
                {
                    label: "挖矿产出（调通关时长首选）",
                    open: true,
                    note: "cellsPerCoin 是「挖几格出一枚金币」，越小越快。hardness 配锄头 power 决定一镐凿几格。",
                    fields: [
                        { path: "ORE_TIERS.low.cellsPerCoin", label: "低级矿 每金币格数", min: 0.5, max: 12, step: 0.05 },
                        { path: "ORE_TIERS.mid.cellsPerCoin", label: "中级矿 每金币格数", min: 0.5, max: 12, step: 0.05 },
                        { path: "ORE_TIERS.high.cellsPerCoin", label: "高级矿 每金币格数", min: 0.5, max: 12, step: 0.05 },
                        { path: "ORE_TIERS.low.hardness", label: "低级矿 硬度", min: 1, max: 12, step: 0.1 },
                        { path: "ORE_TIERS.mid.hardness", label: "中级矿 硬度", min: 1, max: 12, step: 0.1 },
                        { path: "ORE_TIERS.high.hardness", label: "高级矿 硬度", min: 1, max: 12, step: 0.1 },
                        { path: "PICKAXE_LEVELS.0.power", label: "锄头 Lv1 威力", min: 1, max: 60, step: 1 },
                        { path: "PICKAXE_LEVELS.1.power", label: "锄头 Lv2 威力", min: 1, max: 60, step: 1 },
                        { path: "PICKAXE_LEVELS.2.power", label: "锄头 Lv3 威力", min: 1, max: 60, step: 1 },
                        { path: "CONFIG.mineCooldown", label: "挥镐间隔（秒）", min: 0.05, max: 1.2, step: 0.01 }
                    ]
                },

            const CITY_CLEAR = {

            };

            // 广场里的火炬和旗杆。都不进碰撞表，位置避开四张地贴的方块范围，
            // 也避开玩家真正走的那两条线（中轴，以及广场到左右两张地贴的斜线），

            const PLAZA_TORCHES = {

            // 地贴和行走路线留出两米以上——否则玩家站着收钱时，头顶正好压着一面旗子。
            const PLAZA_FLAGS = {

            const BUILDING_SLOTS = {

                keep: { x: 0, z: 4.5, radius: 2.4 },

                nest: { x: -9.8, z: -4.0, radius: 1.5 },

                altar: { x: 0, z: 11.8, radius: 1.5 }

            // 四项开销的价格都在 ECONOMY_PRESETS 里按版本列着；主城四级的价格在 CITY_STAGES。

            let scene, camera, renderer, clock;
            let player, playerVisual, playerWeapon, playerRing, playerCape;
            let playerLeftLeg, playerRightLeg, playerLeftArm, playerRightArm;
            let backCoinStack = null;
            let pet = null;

            let gems = 0;

            let sealArmed = false;

            // 所以进度计数记的是每层环被贯通的通道数，而不是清空的矿体数。
            const breachedByTier = { low: 0, mid: 0, high: 0, [SEALED_TIER]: 0 };

            const oreRings = [];
            const oreNodes = [];
            // 远景矿脉里那几只剪影的眼睛。刻意不叫 enemies/oreNodes 里的任何名字：

            const deepGuards = [];

            const coinDrops = [];
            const effects = [];
            const hazards = [];
            const projectiles = [];
            const zones = [];
            const solidColliders = [];

            const city = {
                group: null,

                buildings: {},

                altarPos: new THREE.Vector3(),

            const shared = {};
            const ui = {};
            const keys = { w: false, a: false, s: false, d: false };
            const stick = { x: 0, z: 0, magnitude: 0 };
            const moveVelocity = new THREE.Vector3();
            const cameraFocus = new THREE.Vector3();
            const cinematic = { active: false, timer: 0, duration: 0, steps: [], index: 0 };

            let joystick = null;
            let audioCtx = null;
            let cameraShake = 0;
            let attackTimer = 0;
            let attackSequence = 0;
            let attackLunge = 0;
            let toastTimer = null;
            let guideIdle = 0;
            let groundGuide = null;
            let guideFlow = 0;
            let guideLean = 1;
            let guideLeanAnchor = null;
            let watchdogTimer = 0;
            const deferredCalls = [];
            let runStart = 0;
            let runClock = 0;
            let simElapsed = 0;
            let autoRun = false;
            let blockedMineHint = 0;
            const runMarks = [];
            let tutorialVisible = false;
            let tutorialDone = false;

            // 版本由 URL 决定，缺省纯金币。分享给同事时一条链接就锁一版，不用教人怎么点；
            // 开局那个切换只是本地来回对比用的快捷方式，它改的也是 URL。
            function setupEconomy() {
                const wanted = new URLSearchParams(location.search).get("econ");
                ECON = ECONOMY_PRESETS[wanted] || ECONOMY_PRESETS.coin;
                document.body.classList.toggle("econ-gem", ECON.gems);

                const other = ECON.id === "gem" ? "coin" : "gem";
                const button = document.getElementById("econ-switch");
                document.getElementById("econ-label").textContent = `经济：${ECON.label}`;
                button.querySelector(".econ-hint").textContent = `点这里换成「${ECONOMY_PRESETS[other].label}」`;
                // 经济预设在 init 里就被读进地贴价格和矿体了，热切换要重建半个世界，
                // 直接重载最干净，也保证两版各自从头开始。
                button.addEventListener("pointerdown", event => {
                    event.stopPropagation();
                    location.search = `?econ=${other}`;
                });
                ui.econSwitch = button;
            }

            function init() {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0b0914);
                scene.fog = new THREE.FogExp2(0x0b0914, 0.0125);

                camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, 0.1, 400);
                camera.position.set(0, 27, 34);

                renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
                renderer.setSize(innerWidth, innerHeight);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.outputEncoding = THREE.sRGBEncoding;
                document.body.insertBefore(renderer.domElement, document.body.firstChild);

                clock = new THREE.Clock();
                cacheUi();
                setupEconomy();
                // 必须在建场之前：环半径、格数、守卫血量都会在下面几行里烘进几何和对象，
                // 之后再改就只能等下一次重载。
                setupTuning();
                createSharedAssets();
                createLights();
                createArena();
                createPlayer();
                createCity();
                createOreField();
                createGroundGuide();
                setupInput();
                buildTuner();
                // ?tune 直接把面板摊开，省得每次进来先去点左下角那个按钮。
                if (new URLSearchParams(location.search).has("tune")) toggleTuner(true);

                coins = CONFIG.startCoins;
                syncBackCoins();
                updateUI();
                showTile("city-build");
                animate();

                window.__wik = {
                    hold: false,
                    freezeAt: ms => setTimeout(() => { window.__wik.hold = true; }, ms),
                    tp: (x, z) => { player.position.set(x, 0, z); moveVelocity.set(0, 0, 0); },
                    // give(10) 金币 / give(5, "gem") 钻石 / give(4, "shard") 当前需要的那档宝石
                    // / give(4, "shard", "mid") 指定品质。
                    give: (n, kind, grade) => {
                        if (kind === "gem") gems += n;
                        else if (kind === "shard") shards[grade || requiredShardGrade() || "low"] += n;
                        else { coins += n; syncBackCoins(); }
                        updateUI();
                    },
                    clear: () => cityClearViolations(),
                    hit: () => { const t = nearestTarget(); if (t) playerAttack(t); return Boolean(t); },
                    mineAll: tier => {
                        const saved = pickaxeLevel;
                        pickaxeLevel = PICKAXE_LEVELS.length;
                        oreNodes.filter(n => n.tierId === tier && !n.cleared)
                            .forEach(n => { for (let i = 0; i < 500 && !n.cleared; i++) mineOre(n); });
                        pickaxeLevel = saved;
                    },
                    killAll: () => [...enemies].forEach(e => killEnemy(e)),
                    finale: () => {
                        if (!pet) createPet();
                        petEvolved = true;
                        breachedByTier.high = Math.max(1, breachedByTier.high);
                        checkFinaleTrigger();
                    },
                    tiles: () => zones.filter(zone => zone.group.visible).map(zone => ({
                        id: zone.id,
                        currency: tileCurrency(zone.id),
                        paid: zone.paid,
                        cost: zone.cost,
                        payable: isZonePayable(zone),
                        inside: isPlayerInsideZonePosition(zone.position),
                        complete: zone.complete,
                        requiresReentry: zone.requiresReentry,
                        hintShown: zone.hintShown,
                        x: +zone.position.x.toFixed(2),
                        z: +zone.position.z.toFixed(2)
                    })),
                    band: () => {
                        const p = player.position;
                        const distance = Math.hypot(p.x, p.z);
                        const angle = Math.atan2(p.z, p.x);
                        return oreRings.map(ring => {
                            const ai = Math.floor((angle - SECTOR.start) / ring.cellAngle);
                            const ri = Math.floor((distance - ring.innerRadius) / ring.cellDepth);
                            const column = columnAt(ring, ai, ri);
                            return {
                                tier: ring.tierId,
                                remaining: ring.remaining,
                                band: `${ring.innerRadius.toFixed(2)}~${ring.outerRadius.toFixed(2)}`,
                                inside: distance > ring.innerRadius && distance < ring.outerRadius,
                                ai,
                                arcCells: ring.arcCells,
                                ri,
                                radialCells: ring.radialCells,
                                blockCount: column ? column.blockCount : null
                            };
                        });
                    },
                    cfg: () => CONFIG,
                    // 所有可调表的引用，不是拷贝——在控制台上直接改字段就生效。
                    // 注意生效时机：hardness / cellsPerCoin / sweepBounty / 伤害 / coinToss
                    // 是每次用到时才读的，改完立刻算数；ORE_TIERS 的几何（ringRadius、grid）
                    // 和守卫血量在建场时就烘进去了，要重载页面；地贴价格在下一块地贴亮起时才取。
                    tune: () => ({
                        CONFIG, BALANCE, ORE_TIERS, CITY_STAGES,
                        PICKAXE_LEVELS, ECONOMY_PRESETS, ROVER_LANES, DEEP_VEINS, ECON
                    }),
                    marks: () => runMarks,
                    auto: (on = true) => { autoRun = on; return autoRun; },
                    sweep: (on = true) => { sweepEnabled = on; return sweepEnabled; },
                    charge: () => sweepCharge && {
                        x: +sweepCharge.home.x.toFixed(1),
                        z: +sweepCharge.home.z.toFixed(1),
                        lit: sweepCharge.lit,
                        tiers: sweepCharge.tierIds.join("+")
                    },
                    // 手动步进模拟：标签页失焦时 rAF 会被节流，实测节奏必须脱离墙钟。
                    // 先接管 rAF（hold），否则渲染循环会和步进叠加成双倍速。
                    sim: (seconds, dt = 1 / 60) => {
                        window.__wik.hold = true;
                        simElapsed = Math.max(simElapsed, clock.elapsedTime);
                        const steps = Math.round(seconds / dt);
                        for (let i = 0; i < steps; i++) {
                            simElapsed += dt;
                            update(dt, simElapsed);
                        }
                        renderer.render(scene, camera);
                        return Number(runClock.toFixed(1));
                    },
                    pick: (px, py) => {
                        const ray = new THREE.Raycaster();
                        ray.setFromCamera(
                            new THREE.Vector2((px / innerWidth) * 2 - 1, -(py / innerHeight) * 2 + 1),
                            camera
                        );
                        return ray.intersectObjects(scene.children, true).slice(0, 6).map(h => {
                            const chain = [];
                            for (let o = h.object; o && o !== scene; o = o.parent) {
                                chain.push(o.name || o.userData.type || o.type);
                            }
                            return {
                                geo: h.object.geometry && h.object.geometry.type,
                                params: h.object.geometry && h.object.geometry.parameters,
                                dist: Math.round(h.distance * 10) / 10,
                                chain
                            };
                        });
                    },
                    toEgg: () => {
                        if (!eggPickup) return null;
                        const p = eggPickup.mesh.position;
                        player.position.set(p.x, 0, p.z);
                        moveVelocity.set(0, 0, 0);
                        return [Math.round(p.x), Math.round(p.z)];
                    },
                    zoneAt: id => {
                        const zone = zones.find(z => z.id === id);
                        if (!zone) return null;
                        player.position.set(zone.position.x, 0, zone.position.z);
                        moveVelocity.set(0, 0, 0);
                        return zone.id;
                    },
                    // 自动走位一停就无从判断是「没目标」还是「走不过去」，把这两件事分开看。
                    guide: () => {
                        const target = getGuideTarget();
                        return {
                            target: target ? target.toArray().map(v => Number(v.toFixed(2))) : null,
                            gap: target ? Number(flatDistance(target, player.position).toFixed(2)) : null,
                            stick: [Number(stick.x.toFixed(2)), Number(stick.z.toFixed(2)), stick.magnitude],
                            speed: Number(moveVelocity.length().toFixed(2))
                        };
                    },
                    // 段与段本来就严丝合缝，扇形布局要看的是层与层之间还剩多宽的走廊。
                    layout: () => oreRings.map((ring, index) => {
                        const inner = index === 0
                            ? CITY_STAGES[CITY_STAGES.length - 1].radius
                            : oreRings[index - 1].outerRadius;
                        // 最外层（封印矿）本来就该顶到场地边缘那圈岩石里，那是「这道墙是山体
                        // 的一部分」的来源。所以外边界按 arenaRadius 算，留 -2.4 的余量会让
                        // 这一项永远是负数，看着像布局错了。
                        const outer = index === oreRings.length - 1
                            ? CONFIG.arenaRadius
                            : oreRings[index + 1].innerRadius;
                        return {
                            tier: ring.tierId,
                            wall: `${ring.innerRadius.toFixed(1)}~${ring.outerRadius.toFixed(1)}`,
                            grid: `${ring.arcCells}x${ring.radialCells}x${ring.rows}`,
                            cells: ring.total,
                            gapIn: Number((ring.innerRadius - inner).toFixed(2)),
                            gapOut: Number((outer - ring.outerRadius).toFixed(2))
                        };
                    }),
                    // 矿体材质，用来在运行时直接调色。改一个数就 reload 一次的话，光是把人
                    // 挪回矿区、等画面重绘就要三四条命令，根本没法比较相邻两个值的差别——
                    // 而矿石最终的颜色是 albedo 被场景光乘、再叠自发光、最后过一遍 sRGB 编码
                    // 得来的，光看十六进制值猜不出来，只能一边改一边看。
                    mat: tierId => shared.oreMaterials[tierId],
                    // 按指定方向持续推摇杆走一段时间，用来验证矿墙是不是真的走不过去。
                    walk: (dx, dz, seconds = 2) => {
                        const length = Math.hypot(dx, dz) || 1;
                        stick.x = dx / length;
                        stick.z = dz / length;
                        stick.magnitude = 1;
                        __wik.sim(seconds);
                        stick.x = 0;
                        stick.z = 0;
                        stick.magnitude = 0;
                        return __wik.state().radius;
                    },
                    // 每层扇形是否真的封住：一条切向列上没有挡人的柱，就是能直接走过去的缺口。
                    sealed: () => oreRings.map(ring => {
                        const holes = [];
                        for (let ai = 0; ai < ring.arcCells; ai++) {
                            let blocked = false;
                            for (let ri = 0; ri < ring.radialCells; ri++) {
                                const column = columnAt(ring, ai, ri);
                                if (column && column.blockCount > 0) {
                                    blocked = true;
                                    break;
                                }
                            }
                            if (!blocked) holes.push(ai);
                        }
                        return { tier: ring.tierId, holes: holes.length, at: holes.slice(0, 8) };
                    }),
                    // 演出镜头总把巨龙的翼尖切掉，截图上不好判断到底差多少，直接投影包围盒。
                    // 返回的 x / y 是 NDC，超出 ±1 就是出框了。
                    framed: () => {
                        if (!finale.dragon) return null;
                        const box = new THREE.Box3().setFromObject(finale.dragon);
                        const span = { x: [Infinity, -Infinity], y: [Infinity, -Infinity] };
                        for (const x of [box.min.x, box.max.x]) {
                            for (const y of [box.min.y, box.max.y]) {
                                for (const z of [box.min.z, box.max.z]) {
                                    const p = new THREE.Vector3(x, y, z).project(camera);
                                    span.x = [Math.min(span.x[0], p.x), Math.max(span.x[1], p.x)];
                                    span.y = [Math.min(span.y[0], p.y), Math.max(span.y[1], p.y)];
                                }
                            }
                        }
                        const round = v => Number(v.toFixed(2));
                        return {
                            size: box.getSize(new THREE.Vector3()).toArray().map(round),
                            x: span.x.map(round),
                            y: span.y.map(round),
                            aspect: round(camera.aspect)
                        };
                    },
                    // 直接在最近那段墙上凿穿一条通道，用来验证贯通之后的推进和守卫现身。
                    breach: tier => {
                        const node = getNearestOre(tier || null);
                        if (!node) return null;
                        const ring = node.ring;
                        const half = (node.angleEnd - node.angleStart) / 2;
                        const delta = signedAngleDelta(
                            Math.atan2(player.position.z, player.position.x),
                            node.angleCenter
                        );
                        const target = node.angleCenter + THREE.MathUtils.clamp(delta, -half, half);
                        const ai = Math.floor((target - SECTOR.start) / ring.cellAngle);
                        for (let d = -1; d <= 1; d++) {
                            for (let ri = 0; ri < ring.radialCells; ri++) {
                                const column = columnAt(ring, ai + d, ri);
                                if (column && column.node === node) pulverizeColumn(column);
                            }
                        }
                        node.instanced.instanceMatrix.needsUpdate = true;
                        node.penetration = 1;
                        breachOreSegment(node);
                        if (node.remaining <= 0) clearOreNode(node);
                        return node.id;
                    },
                    // 封印/破封那几镜的构图诊断。framed 的包围盒会把隐藏的翅膀尾巴一起算进去，
                    // 读不出实际看得见的那块剪影落在画面哪里，所以单列一个只算可见网格的。
                    shot: () => {
                        const round = v => Number(v.toFixed(2));
                        const ndc = p => {
                            const q = p.clone().project(camera);
                            return [round(q.x), round(q.y)];
                        };
                        const out = {
                            cam: camera.position.toArray().map(round),
                            camR: round(Math.hypot(camera.position.x, camera.position.z)),
                            target: cinematic.cameraTarget ? cinematic.cameraTarget.toArray().map(round) : null,
                            aspect: round(camera.aspect)
                        };
                        if (finale.landing) out.landing = ndc(finale.landing);
                        if (finale.dragon) {
                            const box = new THREE.Box3();
                            // 整条父链都要查：翅膀网格挂在一个可见的 plane 上，
                            // 而收翅是把它上一级的 pivot 藏起来，只看一层会把翼展算进来。
                            const shown = obj => {
                                for (let o = obj; o; o = o.parent) if (!o.visible) return false;
                                return true;
                            };
                            finale.dragon.traverse(child => {
                                if (child.isMesh && shown(child)) box.expandByObject(child);
                            });
                            if (!box.isEmpty()) {
                                const span = { x: [Infinity, -Infinity], y: [Infinity, -Infinity] };
                                for (const x of [box.min.x, box.max.x]) {
                                    for (const y of [box.min.y, box.max.y]) {
                                        for (const z of [box.min.z, box.max.z]) {
                                            const p = ndc(new THREE.Vector3(x, y, z));
                                            span.x = [Math.min(span.x[0], p[0]), Math.max(span.x[1], p[0])];
                                            span.y = [Math.min(span.y[0], p[1]), Math.max(span.y[1], p[1])];
                                        }
                                    }
                                }
                                out.visible = { x: span.x.map(round), y: span.y.map(round) };
                                out.visibleSize = box.getSize(new THREE.Vector3()).toArray().map(round);
                            }
                            out.head = ndc(finale.dragon.userData.head.getWorldPosition(new THREE.Vector3()));
                        }
                        return out;
                    },
                    nodes: () => oreNodes
                        .map(n => ({
                            id: n.id,
                            cleared: n.cleared,
                            breached: n.breached,
                            pen: Number(n.penetration.toFixed(2)),
                            left: `${n.remaining}/${n.total}`,
                            revealed: n.monsterRevealed,
                            dist: Math.round(segmentDistance(n, player.position))
                        }))
                        .sort((a, b) => a.dist - b.dist)
                        .slice(0, 6),
                    // 钻石供给完全由「玩家自然流程里会打死几只守卫」决定，而这个数无法靠读代码
                    // 推出来——它取决于引导把人带到哪一段、横扫替玩家杀掉几只。必须实测。
                    // 冻在矿里的守卫 alive 本来就是假（revealOreMonster 才置真），所以「死了」
                    // 必须是「出过土、且现在不活着」，不能只看 alive。
                    guards: () => oreNodes.map(n => ({
                        tier: n.tierId,
                        id: n.id,
                        dead: n.monsterRevealed && Boolean(n.monster) && !n.monster.userData.alive,
                        revealed: n.monsterRevealed,
                        // 血量是建场时烘进去的，调参面板改完必须重载才生效——这里读的是烘完的
                        // 结果，用来确认覆盖值真的落到了对象上，而不是只改了表。
                        hp: n.monster ? `${Math.max(0, Math.round(n.monster.userData.hp))}/${n.monster.userData.maxHp}` : null
                    })),
                    // 走廊里的游荡怪。要看的主要是 radius 有没有落在 lane 的内外边界之间——
                    // 矿层半径改过好几轮，越界就意味着有怪站在矿墙里面。
                    rovers: () => enemies.filter(e => e.userData.type === "rover").map(e => {
                        const d = e.userData;
                        const lane = ROVER_LANES.find(l => l.inner === d.tierId);
                        const geo = laneGeometry(lane);
                        const radius = Math.hypot(e.position.x, e.position.z);
                        return {
                            lane: lane.id,
                            radius: Number(radius.toFixed(2)),
                            band: [Number(geo.innerEdge.toFixed(2)), Number(geo.outerEdge.toFixed(2))],
                            inBand: radius > geo.innerEdge && radius < geo.outerEdge,
                            deg: Number(THREE.MathUtils.radToDeg(Math.atan2(e.position.z, e.position.x)).toFixed(1)),
                            inSector: Math.abs(Math.atan2(e.position.z, e.position.x) - SECTOR.center) < SECTOR.half,
                            engaged: Boolean(d.engaged),
                            hp: `${Math.max(0, Math.round(d.hp))}/${d.maxHp}`,
                            dist: Number(flatDistance(e.position, player.position).toFixed(1)),
                            // 屏幕坐标（NDC，±1 是画框）。「隔着半透明矿墙看见远处有东西在动」
                            // 是这批怪存在的全部理由，而截图上一只 1.2 米高的小东西挤在
                            // 两道矿墙之间几乎数不出来，只能靠投影确认它到底在不在画里。
                            ndc: e.position.clone().setY(1.6).project(camera).toArray().slice(0, 2).map(v => Number(v.toFixed(2)))
                        };
                    }),
                    state: () => ({
                        econ: ECON.id,
                        coins, gems,
                        shards: { ...shards },
                        need: requiredShardGrade(),
                        // 场上还埋着没被凿到的宝石，按品质分。校准 shardYield 时看的就是这个数：
                        // 它和 shards 加起来必须恒等于 ORE_TIERS.*.shardYield，对不上就是哪条路径漏结算了。
                        buried: TIER_ORDER.reduce((acc, id) => {
                            const left = oreNodes.filter(n => n.tierId === id)
                                .reduce((sum, n) => sum + n.shards.filter(s => !s.taken).length, 0);
                            if (left) acc[id] = left;
                            return acc;
                        }, {}),
                        cityLevel, pickaxeLevel, petEvolved,
                        pet: Boolean(pet), carryingEgg, eggSpawned,
                        breached: { ...breachedByTier },
                        enemies: enemies.length,
                        drops: coinDrops.length,
                        zones: zones.map(z => `${z.id}:${z.paid}/${z.cost}`),
                        pos: [Number(player.position.x.toFixed(2)), Number(player.position.z.toFixed(2))],
                        radius: Number(Math.hypot(player.position.x, player.position.z).toFixed(2)),
                        finaleStarted, ctaOpen
                    })
                };
            }

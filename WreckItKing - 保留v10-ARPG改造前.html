                const level = PICKAXE_LEVELS[pickaxeLevel - 1];
                power = level.power_score;
                const tier = applyPickaxeAppearance();
                buildPopEffect(player.position.clone().add(new THREE.Vector3(0.7, 1.4, 0)), 22, tier.glow);
                playSound("upgrade");
                const zone = zones.find(item => item.id === "pickaxe");
                if (zone) {
                    const nextCost = resolveTileCost("pickaxe");
                    if (!nextCost) removeZone(zone);
                    else resetZone(zone, nextCost);
                }
                updateUI();
                // 满级按预设能买到第几级判，不能写死 3：A 版封顶三级、宝石版四级，
                // 写死的话宝石版买到 Lv3 就会报「已满级」，而地贴上明明还挂着下一档。
                const maxed = pickaxeLevel > (ECON.pickaxeCost ? ECON.pickaxeCost.length : 0);
                toast(maxed ? `锄头已满级，${tier.name}也能快速开采` : `锄头升级，现在能凿开${tier.name}了`);
                defer(1.5, spawnSweepCharge);
                maybeShowSealOffering();
            }

            function completeHatchery() {
                const zone = zones.find(item => item.id === "hatchery");
                if (zone) removeZone(zone);
                startEggPlace();
            }

            function completeEvolve() {
                const zone = zones.find(item => item.id === "evolve");
                if (zone) removeZone(zone);
                evolvePet();
                maybeShowSealOffering();
            }

            // 献祭点的两个前置：锄头满级、宠物已进化。谁后到听谁的，所以
            // completePickaxe、completeEvolve 和看门狗三处都调一次，幂等。
            //
            // 要锄头满级，是因为这整条改动的立论就是给 Lv4 一个解锁物——它从「只提速」
            // 变成「唯一硬到能碰封印矿的锄头」，那 35 秒才买到了东西。
            // 要宠物进化，是因为对峙的构图里站着玩家和他的龙，CTA 文案也写死了
            // 「你的巨龙已经进化完成」；不卡这条，两边会一起对不上。
            function maybeShowSealOffering() {
                if (!ECON.sealOffering || finaleStarted) return;
                if (!petEvolved) return;
                if (pickaxeLevel <= (ECON.pickaxeCost ? ECON.pickaxeCost.length : 0)) return;
                if (sealOffered) return;
                sealOffered = true;
                showTile("seal");
                toast("锄头已经硬到能碰封印矿，把金币砸进封印");
                playSound("warn");
            }

            function completeSeal() {
                sealArmed = true;
                const zone = zones.find(item => item.id === "seal");
                if (zone) removeZone(zone);
                cameraShake = Math.max(cameraShake, 0.5);
                playSound("crack");
                toast("封印松动了，凿开它");
            }

            // 玩家自己抡的那一下。走到这儿时他已经站在墙根底下砸了好几秒
            // （献祭点在 mineRange 之内，自动索敌一直咬着封印墙），所以这一下
            // 不需要任何额外输入——付满之后的下一次挥镐就是它。
            function breakSeal(node) {
                if (finaleStarted) return;
                finaleStarted = true;
                sealArmed = false;
                markRun("seal-break");
                // 破封点钉在玩家砸的这一段上。sealedDragonSite() 挑的是「离玩家最远」的
                // 那一段，那条规则的前提是终局可能在玩家还在城里时触发；现在触发点就是
                // 他脚下，照那条挑会让龙从他背后的另一头钻出来，因果链当场断掉。
                const radius = ORE_TIERS[SEALED_TIER].ringRadius;
                const angle = Math.atan2(node.position.z, node.position.x);
                finale.forcedSite = new THREE.Vector3(
                    Math.cos(angle) * radius, 0, Math.sin(angle) * radius
                );
                buildPopEffect(getOreImpactPoint(node), 34, 0xff8a3c);
                cameraShake = Math.max(cameraShake, 0.9);
                playSound("crack");
                defer(0.5, startFlameDragonIntro);
            }

            function isPlayerInsideZonePosition(position) {
                if (!player) return false;
                const half = CONFIG.zoneTileSize * 0.5;
                return Math.abs(player.position.x - position.x) < half &&
                    Math.abs(player.position.z - position.z) < half;
            }

            function isZonePayable(zone) {
                if (zone.complete) return false;
                if (zone.id === "hatchery") return carryingEgg;
                if (zone.id === "evolve") return Boolean(pet) && !petEvolved;
                // 献祭点的两个前置在 maybeShowSealOffering 里已经判过了——它只在条件齐了
                // 之后才摆出来，摆出来就一定收钱。这里不重复判，免得两处规则各写一份。
                if (zone.id === "seal") return true;
                // 主城和锄头必须交替推进：扩建解锁下一级锄头，锄头凿开下一层矿再供养下一次扩建。
                // 不互锁的话，路过时漏进地贴的金币会先把远期的扩建喂饱，玩家会带着二级锄头站在高级矿墙前面。
                //
                // 钻石版不需要这把锁：锄头只收钻石、扩建只收金币，两条收入互不流通，顺序自己就成立了。
                if (!ECON.orderInterlock) return true;
                if (zone.id === "pickaxe") return cityLevel >= pickaxeLevel + 1;
                if (zone.id === "city-upgrade") return pickaxeLevel >= cityLevel;
                return true;
            }

            function updateZones(dt) {
                for (const zone of zones) {
                    if (!zone.group.visible) continue;
                    const inside = isPlayerInsideZonePosition(zone.position);
                    if (zone.requiresReentry) {
                        if (!inside) zone.requiresReentry = false;
                        else continue;
                    }
                    if (zone.complete) continue;
                    // 走开就把提示解锁。原先只在「这一帧能付款」时才重置，于是钱不够的地贴
                    // 一辈子只说一次话——而这一版恰恰要它反复说：玩家踩上锄头地贴、发现买不起、
                    // 去打了一只怪、钱还是不够，回来时最需要的就是再听一遍「还差几颗」。
                    if (!inside) zone.hintShown = false;

                    const currency = tileCurrency(zone.id);
                    const grade = tileShardGrade(zone.id);
                    const wallet = walletOf(currency, grade);
                    const payable = isZonePayable(zone);
                    const remaining = Math.max(0, zone.cost - zone.paid);
                    const ready = payable && wallet > 0;
                    zone.pulse += dt;
                    const pulse = ready ? 0.9 + Math.sin(zone.pulse * CONFIG.zonePulseSpeed) * 0.1 : 0.72;
                    zone.tile.material.opacity = pulse;
                    zone.base.material.opacity = ready ? 0.62 : 0.45;
                    if (zone.lastReady !== ready) {
                        zone.lastReady = ready;
                        drawTile(zone, ready);
                    }

                    // 钻石、宝石都和金币一样，有多少付多少，不用攒够一次升级才能捐。
                    //
                    // 这里曾经是「要么一次付清、要么一颗都不收」，理由是怕玩家把钻石压死在一张
                    // 永远付不完的地贴里。那个担心站不住：捐进去的每一颗都是在给同一笔消费攒钱，
                    // 和揣在兜里是同一个局面，压不住任何东西。真正保证供给的是数量本身
                    // 和缺钱时改指来源的箭头，不是这条规则。
                    const short = wallet < remaining ? remaining - wallet : 0;
                    const scarce = short > 0 && (currency === "gem" || currency === "shard");
                    if (!inside || !payable || wallet <= 0 || ctaOpen || cinematic.active) {
                        zone.paymentTimer = 0;
                        // 先收下他带来的，掏空了地贴还没满，这时才说「还差几颗」。
                        if (inside && !zone.hintShown && (!payable || scarce)) {
                            zone.hintShown = true;
                            if (!scarce) toast(zoneBlockedCopy(zone.id));
                            else toast(currency === "shard" ? shardShortCopy(short, grade) : gemShortCopy(short));
                        }
                        continue;
                    }
                    zone.hintShown = false;

                    zone.paymentTimer -= dt;
                    if (zone.paymentTimer > 0) continue;
                    zone.paymentTimer = CONFIG.zonePaymentInterval;
                    // 每次扣的枚数跟着剩余金额走，贵的地贴也能在一秒多付完，不然后期光付款就要等七八秒。
                    const step = Math.max(1, Math.ceil(remaining / CONFIG.zonePaymentTicks));
                    const amount = Math.min(step, wallet, remaining);
                    if (currency === "gem") {
                        gems -= amount;
                    } else if (currency === "shard") {
                        shards[grade] -= amount;
                    } else {
                        coins -= amount;
                        syncBackCoins();
                    }
                    zone.paid += amount;
                    flyCoinTo(zone.position, currency, grade);
                    updateUI();
                    zone.paymentTick = (zone.paymentTick || 0) + 1;
                    if (zone.paymentTick % 2 === 0) playSound("coin");
                    drawTile(zone, walletOf(currency, grade) > 0);

                    if (zone.paid >= zone.cost) {
                        zone.complete = true;
                        buildPopEffect(zone.position.clone().add(new THREE.Vector3(0, 0.5, 0)), 22, 0xffda4c);
                        const callback = zone.onComplete;
                        defer(0.14, callback);
                    }
                }
            }

            // 钻石不够时说的那句话。这是整个钻石版唯一交代「钻石从哪来」的地方——
            // 守卫堵路撤掉之后，玩家不会再被一堵凿不动的墙逼到怪面前，全靠这句话和箭头。
            // 所以要分两种说法：怪已经跳出来了就报「箭头指着它」，把提示和箭头绑成一件事；
            // 还冻在矿里就得先说凿墙，否则玩家会满地找一只根本还没出现的怪。
            function gemShortCopy(short) {
                return nearestLivingGuard()
                    ? `还差 ${short} 颗钻石，打倒守卫就能拿到，箭头指着它`
                    : `还差 ${short} 颗钻石，凿开矿墙叫醒里面的守卫`;
            }

            // 宝石不够时说的那句话。要说清两件事：缺的是哪一档，以及那一档从哪儿来。
            // 只说「还差 3 颗宝石」不行——玩家手上多半正揣着一把上一档的作废宝石，
            // 他会以为自己已经有了，然后站在地贴上反复踩。
            //
            // 那一层还有货就报层名（箭头同时指过去）；已经榨干了就得直说，
            // 否则玩家会回头去挖一堵早就没宝石的墙。
            function shardShortCopy(short, grade) {
                const name = SHARD_GRADES[grade] ? SHARD_GRADES[grade].name : "宝石";
                const tier = ORE_TIERS[grade];
                if (!tier) return `还差 ${short} 颗${name}`;
                return nearestShardNode(grade)
                    ? `还差 ${short} 颗${name}，${tier.name}里还埋着，箭头指着它`
                    : `${tier.name}已经挖空了，${name}不够就升不了这把锄头`;
            }

            function zoneBlockedCopy(id) {
                if (id === "hatchery") return "先去野外找到龙蛋，抱回来孵化";
                if (id === "evolve") return "先孵化出宠物才能进化";
                if (id === "pickaxe") return "先扩建主城，才能解锁下一级锄头";
                if (id === "city-upgrade") return "先升级锄头凿开下一层矿，再扩建主城";
                return "";
            }

            function createOreField() {
                shared.oreMaterials = {};
                shared.chunkMaterials = {};
                for (const tierId of TIER_ORDER) {
                    const tier = ORE_TIERS[tierId];
                    // 半透明矿体：能直接看见冻在里面的金币和野怪。
                    // depthWrite 保留，否则几十个体素会互相叠加成一团发光的糊状物。
                    shared.oreMaterials[tierId] = new THREE.MeshStandardMaterial({
                        color: tier.color,
                        emissive: tier.emissive,
                        emissiveIntensity: tier.sealed ? 0.4 : 0.55,
                        roughness: tier.sealed ? 0.72 : 0.42,
                        metalness: 0.12,
                        transparent: true,
                        // 封印矿压到接近实心。半透明是为了透出冻在里面的金币和守卫，而这一层
                        // 两样都没有，照搬 0.46 只会让它读成「又一层能看穿的矿脉」——玩家凭什么
                        // 觉得这道墙和前三道不一样。压实之后它才是堵死的岩壁。
                        // 终局那几段不受影响：巨龙的封印剪影走自己的渲染顺序压在墙上，不靠矿体透光。
                        opacity: tier.sealed ? 0.94 : 0.46
                    });
                    shared.chunkMaterials[tierId] = new THREE.MeshStandardMaterial({
                        color: tier.chunkColor,
                        emissive: tier.emissive,
                        emissiveIntensity: 0.35,
                        roughness: 0.6
                    });
                }

                for (const tierId of TIER_ORDER) createOreRing(tierId);
                createDeepVeins();
                spawnRovers();
            }

            // 封印矿之外那四层「只给看」的矿脉。和 createOreRing 是两套东西：
            // 这里不建格子、不建柱、不注册碰撞、不产出、不进 oreRings/oreNodes，
            // 整层就是一个 InstancedMesh 加几只冻在里面的剪影。
            function createDeepVeins() {
                const rand = seededRandom(4801);
                for (const vein of DEEP_VEINS) {
                    const span = SECTOR.span + vein.flare * 2;
                    const spanStart = SECTOR.center - SECTOR.half - vein.flare;
                    const arcCells = Math.max(6, Math.round(span * vein.ringRadius / vein.cellArc));
                    const cellAngle = span / arcCells;
                    const cellHeight = vein.ringHeight / vein.rows;
                    // 不透明。近处矿墙半透明是为了透出里面的金币、宝石和守卫，远景没有
                    // 这个需求，而半透明在这里只有坏处：一层墙有三排格子、顶排还错开，
                    // 半透明会让它们互相叠加，颜色一路加到发白——第一版四层远景全糊成
                    // 糖果色的横条，比不加还糟。剪影改成半嵌在墙面上，不靠透光。
                    const material = new THREE.MeshStandardMaterial({
                        color: vein.color,
                        emissive: vein.emissive,
                        emissiveIntensity: vein.emissiveIntensity,
                        roughness: 0.68,
                        metalness: 0.08
                    });
                    // 顶排单独一份更亮的材质。整层一个亮度时，这么远看过去每层就是一条
                    // 均匀的色带，四条并排读成彩条而不是矿脉。把参差的那道脊线提亮之后，
                    // 每层才有「上缘在发光、下面压在暗处」的厚度。
                    const crestMaterial = material.clone();
                    crestMaterial.emissiveIntensity = vein.emissiveIntensity * 1.75;

                    const matrices = [];
                    const crestMatrices = [];
                    const matrix = new THREE.Matrix4();
                    const quaternion = new THREE.Quaternion();
                    const axis = new THREE.Vector3(0, 1, 0);
                    const scaleVector = new THREE.Vector3();
                    const offset = new THREE.Vector3();
                    for (let ai = 0; ai < arcCells; ai++) {
                        const angle = spanStart + (ai + 0.5) * cellAngle;
                        const cosA = Math.cos(angle);
                        const sinA = Math.sin(angle);
                        // 顶排按起伏概率留空，凿出一道参差的山脊线。整齐的平顶会读成
                        // 人造围墙，而这批矿要读成「山体深处还有的东西」。
                        const crest = 0.42 + Math.sin(ai * 0.5 + vein.ringRadius) * 0.3;
                        for (let y = 0; y < vein.rows; y++) {
                            if (y === vein.rows - 1 && rand() > crest) continue;
                            const worldY = cellHeight * (y + 0.5);
                            quaternion.setFromAxisAngle(axis, Math.PI / 2 - angle + (rand() - 0.5) * 0.05);
                            scaleVector.set(
                                vein.ringRadius * cellAngle * 1.04,
                                cellHeight * 1.04,
                                vein.ringThickness * 1.04
                            );
                            offset.set(cosA * vein.ringRadius, worldY, sinA * vein.ringRadius);
                            const composed = matrix.compose(offset, quaternion, scaleVector).clone();
                            (y === vein.rows - 1 ? crestMatrices : matrices).push(composed);
                        }
                    }

                    for (const [list, mat] of [[matrices, material], [crestMatrices, crestMaterial]]) {
                        if (!list.length) continue;
                        const instanced = new THREE.InstancedMesh(shared.box, mat, list.length);
                        // 阴影相机只有 ±40、far 90，这几层全在外面，开 castShadow 是纯浪费。
                        instanced.castShadow = false;
                        instanced.receiveShadow = false;
                        // 和近处矿墙同样的理由：包围球按共享的单位立方体算，
                        // 不关剔除的话整层会在中心一出画面时凭空消失。
                        instanced.frustumCulled = false;
                        list.forEach((m, i) => instanced.setMatrixAt(i, m));
                        instanced.instanceMatrix.needsUpdate = true;
                        scene.add(instanced);
                    }

                    // 地表色带。近处三层矿有同样的处理，远景跟着做，凿穿的层次感才连得上。
                    const band = new THREE.Mesh(
                        new THREE.RingGeometry(
                            vein.ringRadius - vein.ringThickness / 2,
                            vein.ringRadius + vein.ringThickness / 2,
                            40,
                            1,
                            -(spanStart + span),
                            span
                        ),
                        new THREE.MeshBasicMaterial({
                            color: vein.glow,
                            transparent: true,
                            opacity: 0.1,
                            side: THREE.DoubleSide,
                            depthWrite: false
                        })
                    );
                    band.rotation.x = -Math.PI / 2;
                    band.position.y = 0.02;
                    scene.add(band);

                    const bodies = [];
                    const eyes = [];
                    for (let i = 0; i < vein.guards; i++) {
                        const spread = (i + 1) / (vein.guards + 1);
                        collectDeepGuard(vein, spanStart + span * spread, bodies, eyes);
                    }
                    buildDeepGuards(vein, bodies, eyes, rand);
                }
            }

            // 半嵌在远景矿脉墙面上的大型剪影。造型沿用矿内守卫（方块拼的人形），
            // 但只保留隔这么远还看得出来的那几块：躯干、头、双臂、背刺、眼睛。
            //
            // 站位压在矿墙的内侧面上，身体一半埋进墙、一半探在外面——读成「正在从矿里
            // 挣出来」。不整只埋进去是因为远景矿墙是不透明的（半透明会把四层颜色叠白）；
            // 也不整只站在外面，那就成了空地上的散兵，和「这层矿里封着东西」是两句话。
            //
            // 眼睛不能照抄近处守卫那套 depthTest: false 的 X 光画法：那是为了让身体被
            // 四五层矿石叠没时还剩个东西能读，代价是眼睛会脱开墙体浮在半空。上次
            // 「像光斑」栽的就是这个，而这里身体本来就露在外面，不需要透视。
            // 把一只剪影拆成世界矩阵推进数组，不直接建 mesh。一只由九个方块加两只眼睛
            // 拼成，六只就是六十六个 Mesh、六十六次 draw call——为一块背景板付这个价
            // 在手机上不合算。同一层的几只共用材质，攒齐之后整层合成两个 InstancedMesh。
            function collectDeepGuard(vein, angle, bodies, eyes) {
                const radius = vein.ringRadius - vein.ringThickness / 2;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const parent = new THREE.Matrix4().compose(
                    new THREE.Vector3(x, 0, z),
                    new THREE.Quaternion().setFromAxisAngle(
                        new THREE.Vector3(0, 1, 0),
                        Math.atan2(-x, -z)
                    ),
                    new THREE.Vector3(vein.guardScale, vein.guardScale, vein.guardScale)
                );
                const part = (list, sx, sy, sz, px, py, pz, roll = 0) => {
                    const local = new THREE.Matrix4().compose(
                        new THREE.Vector3(px, py, pz),
                        new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), roll),
                        new THREE.Vector3(sx, sy, sz)
                    );
                    list.push(local.premultiply(parent));
                };
                part(bodies, 2.05, 2.2, 1.6, 0, 1.95, 0);
                part(bodies, 1.2, 1, 1.1, 0, 3.45, 0);
                for (const side of [-1, 1]) {
                    part(bodies, 0.66, 1.95, 0.7, side * 1.55, 2, 0);
                    part(bodies, 0.72, 1.1, 0.76, side * 0.64, 0.55, 0);
                }
                for (let i = 0; i < 3; i++) {
                    const scale = 0.36 + i * 0.16;
                    part(bodies, scale, scale * 1.9, scale, (i - 1) * 0.7, 3.1, -0.78, (i - 1) * 0.35);
                }
                for (const side of [-1, 1]) part(eyes, 0.3, 0.3, 0.3, side * 0.36, 3.5, 0.6);
            }

            function buildDeepGuards(vein, bodies, eyes, rand) {
                // 躯干压暗到接近剪影：矿墙本身是发光的，亮色身体会和墙的辉光糊在一起，
                // 暗块压在亮墙上才有轮廓。留一点同色自发光只是为了不在暗处塌成纯黑。
                const bodyMat = new THREE.MeshStandardMaterial({
                    color: 0x0b0a12,
                    emissive: vein.emissive,
                    emissiveIntensity: 0.18,
                    roughness: 0.9
                });
                const eyeMat = new THREE.MeshBasicMaterial({ color: vein.glow });
                for (const [list, geometry, mat] of [
                    [bodies, shared.box, bodyMat],
                    [eyes, shared.sphere, eyeMat]
                ]) {
                    const instanced = new THREE.InstancedMesh(geometry, mat, list.length);
                    instanced.castShadow = false;
                    instanced.receiveShadow = false;
                    instanced.frustumCulled = false;
                    list.forEach((m, i) => instanced.setMatrixAt(i, m));
                    instanced.instanceMatrix.needsUpdate = true;
                    scene.add(instanced);
                }
                // 静止的远景会被当成贴图。眼睛慢速一呼一吸就够了——画面上方有东西在动，
                // 视线自然会往那边走一次，而这正是这批矿唯一要争取的东西。
                //
                // 呼吸走颜色的明暗，不走 opacity：透明材质要进透明队列排序，
                // 逐帧的排序抖动会让眼睛一闪一闪地穿墙。
                deepGuards.push({
                    material: eyeMat,
                    base: new THREE.Color(vein.glow),
                    phase: rand() * Math.PI * 2
                });
            }

            function updateDeepGuards(elapsed) {
                for (const guard of deepGuards) {
                    guard.material.color.copy(guard.base)
                        .multiplyScalar(0.45 + Math.sin(elapsed * 1.3 + guard.phase) * 0.35 + 0.35);
                }
            }

            // 整个扇形共用一套极坐标格网：切向格数 = 扇形弧长 / 目标格宽，再取整到段数的整数倍。
            // 段边界因此正好落在格边界上，几段拼起来就是一道没有缝的扇形矿墙。
            function createOreRing(tierId) {
                const tier = ORE_TIERS[tierId];
                const { radial, rows } = tier.grid;
                const arcLength = SECTOR.span * tier.ringRadius;
                const perSegment = Math.max(4, Math.round(arcLength / tier.segmentCount / tier.cellArc));
                const arcCells = perSegment * tier.segmentCount;

                const ring = {
                    tierId,
                    tier,
                    arcCells,
                    perSegment,
                    radialCells: radial,
                    rows,
                    // 只有底下这几层挡人。上面的挖空后留在原地当洞顶，通道才有「凿出来」的样子。
                    groundLayers: Math.max(1, Math.ceil(rows / 2)),
                    cellAngle: SECTOR.span / arcCells,
                    cellDepth: tier.ringThickness / radial,
                    cellHeight: tier.ringHeight / rows,
                    innerRadius: tier.ringRadius - tier.ringThickness / 2,
                    outerRadius: tier.ringRadius + tier.ringThickness / 2,
                    centerRadius: tier.ringRadius,
                    columns: [],
                    total: 0,
                    remaining: 0
                };
                ring.columns.length = arcCells * radial;
                ring.maxCellSpan = Math.max(ring.outerRadius * ring.cellAngle, ring.cellDepth);
                oreRings.push(ring);

                for (let index = 0; index < tier.segmentCount; index++) createOreNode(ring, index);
                return ring;
            }

            function createOreNode(ring, index) {
                const tier = ring.tier;
                const tierId = ring.tierId;
                const rand = seededRandom(1013 + index * 137 + TIER_ORDER.indexOf(tierId) * 911);
                const arcStart = index * ring.perSegment;
                const angleStart = SECTOR.start + arcStart * ring.cellAngle;
                const angleCenter = angleStart + (ring.perSegment * ring.cellAngle) / 2;
                const cosCenter = Math.cos(angleCenter);
                const sinCenter = Math.sin(angleCenter);
                const position = new THREE.Vector3(cosCenter * ring.centerRadius, 0, sinCenter * ring.centerRadius);

                const group = new THREE.Group();
                group.position.copy(position);
                group.rotation.y = -angleCenter + Math.PI / 2;
                scene.add(group);

                // group 局部系：+X 沿切向、+Z 沿径向向外。手算比等 matrixWorld 刷新更可靠。
                const toLocalX = (wx, wz) => (wx - position.x) * sinCenter - (wz - position.z) * cosCenter;
                const toLocalZ = (wx, wz) => (wx - position.x) * cosCenter + (wz - position.z) * sinCenter;

                const cells = [];
                const columns = [];
                for (let a = 0; a < ring.perSegment; a++) {
                    const ai = arcStart + a;
                    const angle = SECTOR.start + (ai + 0.5) * ring.cellAngle;
                    const cosA = Math.cos(angle);
                    const sinA = Math.sin(angle);
                    // 顶面沿扇形连绵起伏、且外圈比内圈高，站在城里看就是一道向外抬升的矿脊。
                    const crest = Math.sin(ai * 0.62 + index) * 0.55 + Math.sin(ai * 0.19 + 1.7) * 0.45;
                    for (let ri = 0; ri < ring.radialCells; ri++) {
                        const radius = ring.innerRadius + (ri + 0.5) * ring.cellDepth;
                        const arcWidth = radius * ring.cellAngle;
                        const column = {
                            ai,
                            ri,
                            x: cosA * radius,
                            z: sinA * radius,
                            cosA,
                            sinA,
                            halfArc: arcWidth / 2,
                            halfDepth: ring.cellDepth / 2,
                            count: 0,
                            blockCount: 0,
                            cells: [],
                            node: null,
                            ring
                        };
                        const topChance = 0.18 + ((ri + 0.5) / ring.radialCells) * 0.72 + crest * 0.26;
                        for (let y = 0; y < ring.rows; y++) {
                            if (y === ring.rows - 1 && rand() > topChance) continue;
                            const worldY = ring.cellHeight * (y + 0.5);
                            const cell = {
                                x: toLocalX(column.x, column.z),
                                y: worldY,
                                z: toLocalZ(column.x, column.z),
                                wx: column.x,
                                wy: worldY,
                                wz: column.z,
                                width: arcWidth,
                                yaw: angleCenter - angle,
                                blocking: y < ring.groundLayers,
                                column,
                                removed: false
                            };
                            column.cells.push(cells.length);
                            column.count += 1;
                            if (cell.blocking) column.blockCount += 1;
                            cells.push(cell);
                        }
                        columns.push(column);
                        ring.columns[ai * ring.radialCells + ri] = column;
                        ring.total += column.count;
                        ring.remaining += column.count;
                    }
                }

                const instanced = new THREE.InstancedMesh(shared.box, shared.oreMaterials[tierId], cells.length);
                instanced.castShadow = true;
                instanced.receiveShadow = false;
                // InstancedMesh 的包围球只按共享的单位立方体算，而一段矿墙横跨十几米。
                // 不关掉视锥剔除，段中心一出画面整段墙就会整体消失，圆环看着就是断的。
                instanced.frustumCulled = false;
                // 矿体和内部野怪都是透明材质，原点又几乎重合，排序会逐帧抖动。
                // 显式指定绘制顺序，保证矿体永远叠在内容物之上。
                instanced.renderOrder = 2;
                instanced.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                const matrix = new THREE.Matrix4();
                const quaternion = new THREE.Quaternion();
                const axis = new THREE.Vector3(0, 1, 0);
                const scaleVector = new THREE.Vector3();
                const offset = new THREE.Vector3();
                cells.forEach((cell, cellIndex) => {
                    // 抖动压到很小、格子放大一点补偿，才不会在墙面上抖出能看穿的缝。
                    quaternion.setFromAxisAngle(axis, cell.yaw + (rand() - 0.5) * 0.06);
                    scaleVector.set(cell.width * 1.04, ring.cellHeight * 1.04, ring.cellDepth * 1.04);
                    matrix.compose(offset.set(cell.x, cell.y, cell.z), quaternion, scaleVector);
                    instanced.setMatrixAt(cellIndex, matrix);
                });
                instanced.instanceMatrix.needsUpdate = true;
                group.add(instanced);

                const node = {
                    id: `${tierId}-${index}`,
                    tierId,
                    tier,
                    ring,
                    group,
                    instanced,
                    cells,
                    columns,
                    arcStart,
                    arcEnd: arcStart + ring.perSegment,
                    angleStart,
                    angleCenter,
                    angleEnd: angleStart + ring.perSegment * ring.cellAngle,
                    total: cells.length,
                    remaining: cells.length,
                    position: position.clone(),
                    cellSize: new THREE.Vector3(ring.centerRadius * ring.cellAngle, ring.cellHeight, ring.cellDepth),
                    coinsReleased: 0,
                    penetration: 0,
                    breached: false,
                    cleared: false,
                    monsterRevealed: false,
                    surfaceCoins: [],
                    shards: [],
                    zeroMatrix: new THREE.Matrix4().makeScale(0, 0, 0)
                };
                for (const column of columns) column.node = node;
                group.userData = { type: "ore", node, alive: true };

                // 金币埋进矿体内部，靠半透明矿石透出来，形成「这里有货」的直观信号。
                // 挂在 group 下随矿体一起转，位置直接取真实体素，保证一定嵌在石头里而不是浮在空中。
                // 封印矿里一枚都不埋：凿不开的墙里还闪着金币，等于挂一份领不到的赏金，
                // 玩家会一直砸下去，而每一下的回应都只是弹开。
                const coinCount = tier.sealed ? 0 : Math.max(4, Math.round(cells.length / 26));
                for (let i = 0; i < coinCount; i++) {
                    const cell = cells[Math.floor(rand() * cells.length)];
                    if (!cell) break;
                    const coin = new THREE.Mesh(shared.coin, shared.oreCoinMat);
                    coin.scale.setScalar(1.25);
                    coin.position.set(cell.x, Math.max(ring.cellHeight * 0.6, cell.y), cell.z);
                    coin.rotation.set(Math.PI / 2, 0, rand() * Math.PI);
                    coin.renderOrder = 1;
                    group.add(coin);
                    // 记在所属体素上：凿掉这一格时这枚金币就地掉出来，而不是按整段进度凭空消失。
                    (cell.coins || (cell.coins = [])).push(coin);
                    node.surfaceCoins.push(coin);
                }

                embedShards(node, cells, group, rand, index);

                // 守卫冻在矿墙正中：半透明矿石会透出剪影，凿穿通道的瞬间它正好堵在路口。
                // 封印矿这一层空着——它封的是巨龙，那道剪影由终局演出自己放进去，
                // 而且这层永远不会被凿穿，守卫立在里面也没有出场的那一刻。
                if (!tier.sealed) {
                    node.monster = createOreMonster(tierId, position.clone(), node);
                    node.monster.traverse(child => { if (child.isMesh) child.renderOrder = 1; });
                    setMonsterSilhouette(node.monster, 0);
                }
                oreNodes.push(node);
                return node;
            }

            // 场上所有还埋着的宝石，只为了每帧转一下。转是必要的：矿体是半透明的，
            // 静止的宝石隔着墙看只是一小块偏色，转起来棱面才会一闪一闪地扫过去，
            // 「那儿有货」这个信号靠的是这个闪，不是颜色本身。
            const oreShards = [];

            // 把该段应得的宝石埋进矿体。
            //
            // shardYield 是**整环**的产量，这里按段均分；均分用累计差分而不是四舍五入，
            // 段数除不尽时（高级矿 16 颗切 3 段）总数仍然精确等于 shardYield，
            // 而「一环产多少」正是「正好够买一次锄头」这条设计的唯一抓手，不能被舍入吃掉。
            function embedShards(node, cells, group, rand, index) {
                const tier = node.tier;
                const total = tier.shardYield || 0;
                if (!total || tier.sealed || !ECON.shards) return;
                const segments = Math.max(1, tier.segmentCount);
                const count = Math.floor((index + 1) * total / segments) - Math.floor(index * total / segments);
                if (count <= 0) return;

                // 只埋在挡人的格子里。上面那几层挖空后要留在原地当洞顶，埋在洞顶上的宝石
                // 玩家看得见、挖不到，是纯粹的挑衅。
                const pool = cells.filter(cell => cell.blocking);
                if (!pool.length) return;

                // 沿切向均匀铺开：候选格按弧向排序后切成 count 份，每份里随机抽一格。
                // 纯随机撒不行——「挖了七成却一颗没碰到」和「挖了两成全捡了」都可能发生，
                // 产量就不再和开采量挂钩，按开采比例倒推出来的那张产量表当场失效。
                pool.sort((a, b) => (a.column.ai - b.column.ai) || (a.column.ri - b.column.ri));

                for (let i = 0; i < count; i++) {
                    const lo = Math.floor(i * pool.length / count);
                    const hi = Math.max(lo + 1, Math.floor((i + 1) * pool.length / count));
                    const cell = pool[lo + Math.floor(rand() * (hi - lo))];
                    if (!cell || cell.shard) continue;

                    // 品质阶梯靠体积读：一档比一档大一圈。颜色只负责「认得出、看得见」，
                    // 「更高级」这层意思由它在墙里占多大地方来说。
                    const size = SHARD_GRADES[tier.id].scale;
                    const crystal = new THREE.Group();
                    crystal.position.set(cell.x, cell.y, cell.z);
                    crystal.rotation.y = rand() * Math.PI;
                    const core = new THREE.Mesh(shared.shard, shared.oreShardMats[tier.id]);
                    core.scale.set(size, size * 1.5, size);
                    core.renderOrder = 1;
                    crystal.add(core);
                    const halo = new THREE.Mesh(shared.shard, shared.shardHaloMats[tier.id]);
                    halo.scale.set(size * 1.9, size * 2.6, size * 1.9);
                    halo.renderOrder = 1;
                    crystal.add(halo);
                    group.add(crystal);

                    // 记在体素上，凿掉这一格时就地掉出来；同时挂进段的清单，整段被清时一起收尾。
                    cell.shard = { mesh: crystal, grade: tier.id, taken: false };
                    node.shards.push(cell.shard);
                    oreShards.push(cell.shard);
                }
            }

            function updateOreShards(dt) {
                for (const shard of oreShards) {
                    if (shard.taken) continue;
                    shard.mesh.rotation.y += dt * 1.5;
                }
            }

            // 凿到埋着宝石的那一格：原地掉出来，之后走金币那条抛-停-飞的自动回收，玩家不用去捡。
            // 抛得比金币散、比金币慢一拍，一颗宝石要能从同时崩出来的一堆金币里被认出来。
            function takeShard(shard) {
                if (shard.taken) return;
                shard.taken = true;
                const at = shard.mesh.getWorldPosition(new THREE.Vector3());
                shard.mesh.visible = false;
                dropCoins(at, 1, { kind: "shard", grade: shard.grade, burst: 1.35, spread: 1.5, dwell: 0.12 });
            }

            // 整段被清空（挖光或被横扫炸掉）时，段里还没被凿到的宝石一并结算。
            // 不结算的话它们会随矿体一起消失——玩家看着一段带宝石的墙塌了、手上什么都没多，
            // 而这一档宝石的供给正好是「够不够买下一把锄头」的唯一来源，凭空少几颗就是死局。
            function harvestSegmentShards(node) {
                if (!node.shards) return;
                for (const shard of node.shards) takeShard(shard);
            }

            // 扇形有两个真实的端头，切向索引不能再取模环绕：绕过去会把左端的矿柱
            // 当成右端的邻居，玩家在扇形一侧挖矿会掏空另一侧的墙。
            function columnAt(ring, ai, ri) {
                if (ai < 0 || ai >= ring.arcCells) return undefined;
                return ring.columns[ai * ring.radialCells + ri];
            }

            // 极坐标格网让「玩家附近有哪些矿柱」变成常数级查询：定位所在切向列，再扫左右几列。
            function scanNearbyColumns(point, reach, visit) {
                for (const ring of oreRings) {
                    if (ring.remaining <= 0) continue;
                    const distance = Math.hypot(point.x, point.z);
                    const margin = reach + ring.maxCellSpan;
                    if (distance < ring.innerRadius - margin || distance > ring.outerRadius + margin) continue;
                    const center = Math.floor((Math.atan2(point.z, point.x) - SECTOR.start) / ring.cellAngle);
                    const spread = Math.ceil(margin / (ring.innerRadius * ring.cellAngle)) + 1;
                    for (let da = -spread; da <= spread; da++) {
                        for (let ri = 0; ri < ring.radialCells; ri++) {
                            const column = columnAt(ring, center + da, ri);
                            if (column && column.count > 0) visit(column, ring);
                        }
                    }
                }
            }

            function ringRemaining(tierId) {
                const ring = oreRings.find(item => item.tierId === tierId);
                return ring ? ring.remaining : 0;
            }

            // 挖掘点永远贴在玩家面前那格矿上，所以站着不动挖就会顺着朝向往外掏出一条隧道。
            function getOreImpactPoint(node) {
                const cell = findNearestLiveCell(node, player.position);
                if (cell) return new THREE.Vector3(cell.wx, cell.wy, cell.wz);
                return node.position.clone().setY(node.tier.ringHeight * 0.45);
            }

            function findNearestLiveCell(node, point) {
                let best = null;
                let bestDistance = Infinity;
                for (const cell of node.cells) {
                    if (cell.removed) continue;
                    const dx = cell.wx - point.x;
                    const dz = cell.wz - point.z;
                    const distance = dx * dx + dz * dz + cell.wy * cell.wy * 0.35;
                    if (distance < bestDistance) {
                        bestDistance = distance;
                        best = cell;
                    }
                }
                return best;
            }

            // 整段缩放会把弧形矿墙甩出去，弹开反馈改成沿径向（局部 +Z）轻推一下。
            function updateOreRecoil(dt) {
                for (const node of oreNodes) {
                    if (node.rejectShake) {
                        node.rejectShake = Math.max(0, node.rejectShake - dt);
                        node.instanced.position.z = Math.sin(node.rejectShake * 58) * node.rejectShake * 0.5;
                    }
                    if (!node.monster || node.monsterRevealed) continue;
                    const near = segmentDistance(node, player.position) < CONFIG.guardXrayRange;
                    if (node.monster.userData.xray === near) continue;
                    node.monster.userData.xray = near;
                    setGuardXray(node.monster, near);
                }
            }

            // 守卫堵路：出土后只要还活着，它那一段就凿不动。守卫本来就冻在矿墙正中、凿穿的
            // 瞬间正好堵在隧道口——它在画面上早就是个路障了，只是以前可以绕开。
            //
            // 判据必须是「已出土 且 存活」而不是「存在」：冻着的时候得能挖，否则根本没法凿穿
            // 去唤醒它。也不会死锁，守卫不回血，玩家伤害必然打得死，横扫也能清。
            function guardBlocking(node) {
                return ECON.guardBlocksSegment && node.monsterRevealed &&
                    Boolean(node.monster) && node.monster.userData.alive;
            }

            function canMine(node) {
                return pickaxeLevel >= node.tier.requiredPickaxe && !guardBlocking(node);
            }

            // 凿不动时给一次弹开反馈，不掉任何体素。
            function rejectMine(node) {
                const impact = getOreImpactPoint(node);
                buildPopEffect(impact, 7, 0xffe27a);
                cameraShake = Math.max(cameraShake, 0.16);
                playSound("clang");
                node.rejectShake = 0.32;
                // 献祭收款期间玩家就站在墙根底下砸墙，这句话此刻是错的——墙马上就开了。
                // clang 和弹开留着（他确实在砸），只把提示压掉。
                if (node.tier.sealed && zones.some(zone => zone.id === "seal" && !zone.complete)) return;
                if (blockedMineHint > 0) return;
                blockedMineHint = 3.2;
                // 三种凿不动的处置完全不同——回城升级、就地打一架、根本挖不开——话必须分开说，
                // 否则玩家会跑回城里对着一把买不起或压根不存在的锄头发呆。
                if (guardBlocking(node)) toast(`先干掉守卫，才能继续凿这段${node.tier.name}`);
                else if (node.tier.sealed) toast(`${node.tier.name}凿不开，里面封着的东西还在动`);
                else toast(`锄头等级不足，凿不动${node.tier.name}，回主城升级锄头`);
            }

            function mineOre(node) {
                if (node.cleared) return;
                // 破封那一下，排在 canMine 之前。封印矿的 requiredPickaxe 是 5、锄头封顶 4，
                // 它永远过不了 canMine——「凿不开」这件事是数值上闭死的，不能为了破封去松动它，
                // 否则 minableRemaining、pendingSweepTiers、引导箭头会一起把封印矿当成可挖的矿。
                if (sealArmed && node.tier.sealed) {
                    breakSeal(node);
                    return;
                }
                if (!canMine(node)) {
                    rejectMine(node);
                    return;
                }
                const ring = node.ring;
                const minePower = PICKAXE_LEVELS[pickaxeLevel - 1].power;
                const perHit = Math.max(1, Math.round(minePower / node.tier.hardness));
                const impact = getOreImpactPoint(node);

                const candidates = [];
                for (let i = 0; i < node.cells.length; i++) {
                    const cell = node.cells[i];
                    if (cell.removed) continue;
                    const dx = cell.wx - impact.x;
                    const dy = cell.wy - impact.y;
                    const dz = cell.wz - impact.z;
                    candidates.push({ index: i, distance: dx * dx + dy * dy * 0.6 + dz * dz });
                }
                candidates.sort((a, b) => a.distance - b.distance);

                const removeCount = Math.min(perHit, candidates.length);
                const touchedArcs = [];
                for (let i = 0; i < removeCount; i++) {
                    const cellIndex = candidates[i].index;
                    const cell = node.cells[cellIndex];
                    cell.removed = true;
                    node.remaining -= 1;
                    ring.remaining -= 1;
                    cell.column.count -= 1;
                    if (cell.blocking) cell.column.blockCount -= 1;
                    if (!touchedArcs.includes(cell.column.ai)) touchedArcs.push(cell.column.ai);
                    node.instanced.setMatrixAt(cellIndex, node.zeroMatrix);
                    // 埋在这一格里的金币被凿出来，直接掉在挖开的位置上。
                    if (cell.coins) {
                        for (const coin of cell.coins) {
                            if (!coin.visible) continue;
                            coin.visible = false;
                            dropCoins(coin.getWorldPosition(new THREE.Vector3()), 1);
                        }
                    }
                    if (cell.shard) takeShard(cell.shard);
                    if (i < 4) launchOreChunk(node, cell);
                }
                node.instanced.instanceMatrix.needsUpdate = true;

                buildDust(impact, 5, 0.7, node.tier.chunkColor);
                buildPopEffect(impact, 5, node.tier.glow);
                cameraShake = Math.max(cameraShake, 0.1);
                playSound("crack");

                // 一整段矿墙玩家不可能挖光，收益必须按凿掉的格数结算，挖多少拿多少。
                const mined = node.total - node.remaining;
                const targetCoins = Math.floor(mined / node.tier.cellsPerCoin);
                if (targetCoins > node.coinsReleased) {
                    const amount = targetCoins - node.coinsReleased;
                    node.coinsReleased = targetCoins;
                    dropCoins(impact, amount);
                }

                // 剪影清晰度跟着隧道深度走：越往里凿，冻在墙心的守卫越显形。
                node.penetration = segmentPenetration(node, touchedArcs);
                if (node.monster && !node.monsterRevealed) {
                    setMonsterSilhouette(node.monster, THREE.MathUtils.clamp((node.penetration - 0.1) / 0.75, 0, 1));
                }
                if (node.penetration >= 1) breachOreSegment(node);

                if (node.remaining <= 0) clearOreNode(node);
            }

            // 从内壁往外数连续被凿空（不再挡人）的径向层，凑满整个厚度就是打通了一条通道。
            function segmentPenetration(node, arcs) {
                const ring = node.ring;
                let deepest = node.penetration;
                for (const ai of arcs) {
                    let depth = 0;
                    for (let ri = 0; ri < ring.radialCells; ri++) {
                        const column = columnAt(ring, ai, ri);
                        if (column && column.blockCount > 0) break;
                        depth += 1;
                    }
                    deepest = Math.max(deepest, depth / ring.radialCells);
                }
                return deepest;
            }

            function breachOreSegment(node) {
                if (node.breached) return;
                node.breached = true;
                breachedByTier[node.tierId] += 1;

                buildDust(node.position.clone().setY(1.2), 16, 2.2, node.tier.chunkColor);
                buildPopEffect(node.position.clone().setY(1.4), 20, node.tier.glow);
                cameraShake = Math.max(cameraShake, 0.45);
                playSound("break");

                revealOreMonster(node);
                onTierProgress(node.tierId);
                checkFinaleTrigger();
            }

            function launchOreChunk(node, cell) {
                const mesh = new THREE.Mesh(shared.box, shared.chunkMaterials[node.tierId]);
                mesh.scale.set(cell.width, node.ring.cellHeight, node.ring.cellDepth).multiplyScalar(0.72);
                mesh.position.set(cell.wx, cell.wy, cell.wz);
                mesh.castShadow = true;
                scene.add(mesh);
                // 弧形矿墙上「远离段中心」多半是沿着墙飞，改成朝玩家崩，打击感才落在正确方向。
                const away = player.position.clone().sub(mesh.position).setY(0);
                if (away.lengthSq() < 0.01) away.set(0, 0, 1);
                away.normalize();
                effects.push({
                    type: "chunk",
                    mesh,
                    velocity: away.multiplyScalar(2.6 + Math.random() * 3.4)
                        .add(new THREE.Vector3((Math.random() - 0.5) * 2, 4.2 + Math.random() * 2.6, (Math.random() - 0.5) * 2)),
                    spin: new THREE.Vector3(
                        (Math.random() - 0.5) * 6,
                        (Math.random() - 0.5) * 5,
                        (Math.random() - 0.5) * 6
                    ),
                    life: 1 + Math.random() * 0.4,
                    groundY: node.ring.cellHeight * 0.36
                });
            }

            function clearOreNode(node) {
                const ring = node.ring;
                node.cleared = true;
                node.instanced.visible = false;
                node.group.userData.alive = false;
                node.surfaceCoins.forEach(coin => { coin.visible = false; });
                harvestSegmentShards(node);

                // 整段被啃光时铺一段弧形焦痕。RingGeometry 在 XY 平面，躺平后角度会反向。
                const pit = new THREE.Mesh(
                    new THREE.RingGeometry(
                        ring.innerRadius,
                        ring.outerRadius,
                        Math.max(8, ring.perSegment),
                        1,
                        -node.angleEnd,
                        node.angleEnd - node.angleStart
                    ),
                    new THREE.MeshBasicMaterial({
                        color: node.tier.emissive,
                        transparent: true,
                        opacity: 0.55,
                        side: THREE.DoubleSide,
                        depthWrite: false
                    })
                );
                pit.rotation.x = -Math.PI / 2;
                pit.position.y = 0.05;
                scene.add(pit);

                buildDust(node.position.clone().setY(1.2), 16, 2.2, node.tier.chunkColor);
                buildPopEffect(node.position.clone().setY(1.4), 20, node.tier.glow);
                cameraShake = Math.max(cameraShake, 0.5);
                playSound("break");

                breachOreSegment(node);
            }

            function onTierProgress(tierId) {
                if (tierId === "low" && breachedByTier.low === 1) {
                    revealTierRing("mid");
                }
                if (tierId === "mid" && breachedByTier.mid === 1) {
                    revealTierRing("high");
                }
                // 凿穿高级矿的那一刻，隧道尽头露出来的是封印矿。这条提示要赶在终局演出
                // 之前落地——checkFinaleTrigger 延后 0.45 秒起，正好够这句话先说完。
                if (tierId === "high" && breachedByTier.high === 1) {
                    revealTierRing(SEALED_TIER);
                }
            }

            function revealTierRing(tierId) {
                if (shared[`revealed_${tierId}`]) return;
                shared[`revealed_${tierId}`] = true;
                if (tierId === "low") {
                    toast("金币在矿床里，靠近自动开采");
                    return;
                }
                const tier = ORE_TIERS[tierId];
                // 封印矿不能沿用「收益更高」这句：它一枚金币都不给，也凿不开。
                // 这条提示要立的是疑问，不是下一个目标——玩家接下来会去砸它，砸不动才有戏。
                if (tier.sealed) {
                    toast(`走廊尽头是${tier.name}，凿不开，里面封着东西`);
                    return;
                }
                toast(`发现${tier.name}，收益更高但野怪更强`);
            }

            function signedAngleDelta(angle, reference) {
                let delta = angle - reference;
                while (delta > Math.PI) delta -= Math.PI * 2;
                while (delta < -Math.PI) delta += Math.PI * 2;
                return delta;
            }

            // 可行走区域 = 主城那圈自由圆 ∪ 朝屏幕上方的扇形。这个约束是「必须凿穿才能过」
            // 的前提：矿墙从整圈收成扇形之后，不堵住两侧的话玩家一绕就直接走到高级矿外面去了。
            //
            // 可行走的半角比岩壁中心线（±half）收窄一米七，也就是比岩壁的碰撞圈（1.35 + 人 0.5）
            // 略松一点。两套约束因此不会在边界上互相顶：有岩壁的半径上石头先挡住人，
            // 没岩壁的那一段（自由圆到 18.2）由这里兜住。
            function clampToSector(point) {
                const radius = Math.hypot(point.x, point.z);
                if (radius <= SECTOR.freeRadius) return point;
                const angle = Math.atan2(point.z, point.x);
                const delta = signedAngleDelta(angle, SECTOR.center);
                const limit = Math.max(SECTOR.half * 0.35, SECTOR.half - 1.7 / radius);
                if (Math.abs(delta) <= limit) return point;

                // 两个候选落点：贴着岩壁滑（保半径、夹角度）和退回主城那圈圆（保角度、夹半径）。
                // 取离原位置近的那个——从扇形里横着走出来时会贴墙滑，
                // 从城里朝没开口的方向走出圆时被圆挡住，而不是被瞬间甩到扇形另一头。
                const slideAngle = SECTOR.center + Math.sign(delta) * limit;
                const slideX = Math.cos(slideAngle) * radius;
                const slideZ = Math.sin(slideAngle) * radius;
                const backX = Math.cos(angle) * SECTOR.freeRadius;
                const backZ = Math.sin(angle) * SECTOR.freeRadius;
                const slideGap = (slideX - point.x) ** 2 + (slideZ - point.z) ** 2;
                const backGap = (backX - point.x) ** 2 + (backZ - point.z) ** 2;
                if (slideGap <= backGap) {
                    point.x = slideX;
                    point.z = slideZ;
                } else {
                    point.x = backX;
                    point.z = backZ;
                }
                return point;
            }

            // 一段矿墙是条弧，测距要先看角度落在弧内还是弧外，再算径向差。
            function segmentDistance(node, point) {
                const ring = node.ring;
                const half = (node.angleEnd - node.angleStart) / 2;
                const delta = Math.abs(signedAngleDelta(Math.atan2(point.z, point.x), node.angleCenter));
                const alongGap = Math.max(0, delta - half) * ring.centerRadius;
                const radial = Math.hypot(point.x, point.z);
                const radialGap = Math.max(0, Math.max(ring.innerRadius - radial, radial - ring.outerRadius));
                return Math.hypot(alongGap, radialGap);
            }

            // 不点名矿层时排除封印矿。调用方要的都是「玩家能走到、能动手的那段矿」——
            // 龙蛋落点走的就是这里，掉到一道凿不开的墙上会被挤去墙外侧的死角，玩家永远捡不着。
            function getNearestOre(preferredTier = null) {
                let best = null;
                let bestDistance = Infinity;
                for (const node of oreNodes) {
                    if (node.cleared) continue;
                    if (preferredTier ? node.tierId !== preferredTier : node.tier.sealed) continue;
                    const distance = segmentDistance(node, player.position);
                    if (distance < bestDistance) {
                        bestDistance = distance;
                        best = node;
                    }
                }
                return best;
            }

            // 矿都在扇形走廊里，而主城是一整圈自由活动区，人很容易站在城墙背后。
            // 这时直接指矿，箭头就是一条穿墙而过的直线，照着走只会撞在城墙上。
            // 先把他领到走廊口，进了走廊再指矿。
            function guideThroughGate(target) {
                const radius = Math.hypot(player.position.x, player.position.z);
                if (radius > SECTOR.freeRadius + 1) return target;
                const delta = signedAngleDelta(Math.atan2(player.position.z, player.position.x), SECTOR.center);
                if (Math.abs(delta) <= SECTOR.half * 0.75) return target;
                const gate = SECTOR.center + THREE.MathUtils.clamp(delta, -SECTOR.half * 0.5, SECTOR.half * 0.5);
                // 走廊口收在自由圆里侧：再往外就落进低级矿墙（内边 16.3）里，那是个走不到的点。
                const gateRadius = SECTOR.freeRadius - 0.8;
                return new THREE.Vector3(Math.cos(gate) * gateRadius, 0, Math.sin(gate) * gateRadius);
            }

            // 箭头指向这段墙上离玩家最近的那块还没被凿掉的矿，而不是墙面或段中心。
            // 矿墙比挖掘距离厚，玩家必须一路钻进隧道才能凿穿最后一层；指着墙面会让他停在洞口挖空气。
            function oreGuidePoint(node) {
                const cell = findNearestLiveCell(node, player.position);
                if (cell) return new THREE.Vector3(cell.wx, 0, cell.wz);
                return node.position.clone().setY(0);
            }

            // 矿层跟着锄头等级走：每级锄头对应一层矿，保证三层内容都被走到。
            // 绝不指向锄头等级凿不动的矿层，否则玩家会被引到一块砸不开的石头前面。
            function minableRemaining(tierId) {
                return pickaxeLevel >= ORE_TIERS[tierId].requiredPickaxe && ringRemaining(tierId) > 0;
            }

            // 三道矿墙由外往里查：锄头凿得动的最外层就是玩家该去的地方，收益也最高。
            function getGuideOreTarget() {
                for (let i = TIER_ORDER.length - 1; i >= 0; i--) {
                    if (minableRemaining(TIER_ORDER[i])) return getNearestOre(TIER_ORDER[i]);
                }
                return null;
            }

            // 还埋着指定品质宝石、且现在的锄头凿得动的最近一段矿。
            // 「还埋着」按段里未取走的宝石数算，不按矿层剩余格数——一段矿可能还剩大半墙，
            // 但宝石早被凿出来了，指过去只是让玩家白挖。
            function nearestShardNode(grade) {
                let best = null;
                let bestDistance = Infinity;
                for (const node of oreNodes) {
                    if (node.cleared || node.tierId !== grade || !canMine(node)) continue;
                    if (!node.shards.some(shard => !shard.taken)) continue;
                    const distance = flatDistance(node.position, player.position);
                    if (distance < bestDistance) {
                        bestDistance = distance;
                        best = node;
                    }
                }
                return best;
            }

            function createOreMonster(tierId, position, node) {
                const tier = ORE_TIERS[tierId];
                const config = tier.monster;
                const group = new THREE.Group();
                group.position.copy(position).setY(0);
                group.scale.setScalar(config.scale);
                // 守卫一律面朝主城，也就是玩家凿进来的方向。
                // 不转的话守卫全朝世界 +Z，玩家隔着矿墙看到的是一排后脑勺，那对眼睛根本不朝外。
                group.rotation.y = Math.atan2(-position.x, -position.z);
                scene.add(group);

                const bodyMat = new THREE.MeshStandardMaterial({ color: config.color, roughness: 0.82 });
                const rockMat = new THREE.MeshStandardMaterial({ color: tier.emissive, roughness: 0.9 });
                const meshes = [];

                const torso = new THREE.Mesh(shared.box, bodyMat);
                torso.scale.set(1.9, 2.1, 1.5);
                torso.position.y = 1.9;
                torso.castShadow = true;
                group.add(torso);
                meshes.push(torso);

                const head = new THREE.Mesh(shared.box, rockMat);
                head.scale.set(1.15, 0.95, 1.05);
                head.position.y = 3.35;
                head.castShadow = true;
                group.add(head);
                meshes.push(head);

                const arms = [];
                for (const side of [-1, 1]) {
                    const arm = new THREE.Mesh(shared.box, bodyMat);
                    arm.scale.set(0.62, 1.85, 0.66);
                    arm.position.set(side * 1.42, 1.95, 0);
                    arm.castShadow = true;
                    group.add(arm);
                    meshes.push(arm);
                    arms.push(arm);
                }
                for (const side of [-1, 1]) {
                    const leg = new THREE.Mesh(shared.box, rockMat);
                    leg.scale.set(0.68, 1.05, 0.72);
                    leg.position.set(side * 0.6, 0.52, 0);
                    leg.castShadow = true;
                    group.add(leg);
                    meshes.push(leg);
                }
                for (let i = 0; i < 3; i++) {
                    const shard = new THREE.Mesh(shared.box, rockMat);
                    const scale = 0.34 + i * 0.14;
                    shard.scale.set(scale, scale * 1.7, scale);
                    shard.position.set((i - 1) * 0.66, 3, -0.72);
                    shard.rotation.z = (i - 1) * 0.35;
                    group.add(shard);
                    meshes.push(shard);
                }

                // 怪物埋在矿体中心，前面隔着四五层半透明矿石，身体轮廓怎么调都会被叠没。
                // 眼睛改成关闭深度测试的 X 光画法，永远压在矿石之上，一眼就能看出石头里冻着东西。
                const eyeMat = new THREE.MeshBasicMaterial({ color: tier.glow, depthTest: false });
                const eyes = [];
                for (const side of [-1, 1]) {
                    const eye = new THREE.Mesh(shared.sphere, eyeMat);
                    eye.scale.setScalar(EYE_BASE_SCALE);
                    eye.position.set(side * EYE_BASE_OFFSET, 3.4, 0.56);
                    eye.renderOrder = 3;
                    eye.userData.side = side;
                    group.add(eye);
                    eyes.push(eye);
                }

                const silhouetteMaterial = shared.silhouetteMat.clone();
                group.userData = {
                    type: "monster",
                    tierId,
                    config,
                    tier,
                    node,
                    hp: config.hp,
                    maxHp: config.hp,
                    alive: false,
                    attackable: false,
                    meshes,
                    arms,
                    eyes,
                    realMaterials: meshes.map(mesh => mesh.material),
                    silhouetteMaterial,
                    eyeMaterial: eyeMat,
                    attackState: "chasing",
                    attackTimer: 0,
                    stagger: 0,
                    knockback: null,
                    leashState: "active",
                    emerging: 0
                };
                group.visible = false;
                return group;
            }

            // 两道矿墙之间那条空走廊的内外边界和中线。从 ORE_TIERS 现算而不是写死：
            // 矿层的半径和厚度被终局构图反复调过（高级矿就为了给封印矿让位内移过一次），
            // 写死的话下次一调，游荡怪就会站进墙里。
            function laneGeometry(lane) {
                const inner = ORE_TIERS[lane.inner];
                const outer = ORE_TIERS[lane.outer];
                const innerEdge = inner.ringRadius + inner.ringThickness / 2;
                const outerEdge = outer.ringRadius - outer.ringThickness / 2;
                return { innerEdge, outerEdge, mid: (innerEdge + outerEdge) / 2 };
            }

            // 四足的小家伙，和守卫那种人形石巨人在剪影上就分得开。
            // 这件事很要紧：守卫意味着「打了有钻石、这段矿归它管」，游荡怪什么都不意味着，
            // 两者要是长一个样，玩家会以为自己漏打了某段矿的守卫。
            function createRover(lane, patrol) {
                const tier = ORE_TIERS[lane.inner];
                const geo = laneGeometry(lane);
                const angle = SECTOR.center + patrol.offset;
                const group = new THREE.Group();
                group.position.set(Math.cos(angle) * geo.mid, 0, Math.sin(angle) * geo.mid);
                group.scale.setScalar(lane.scale);
                scene.add(group);

                // 身体色不跟着所在矿层走，三条走廊统一一个「杂兵灰」。试错试出来的两条边界：
                // 用 tier.chunkColor 会和凿穿后满地的同色碎石糊在一起；用深色（0x39323f 那一版）
                // 又忘了这些怪是站在地面上、而地面是 0x151221 的近黑紫——暗身体贴暗地面，
                // 俯视角度下整只怪只剩背上三根发光的刺能看见。
                // 骨灰白是唯一同时避开这两头的：地面极暗所以它是清楚的亮剪影，
                // 低饱和所以又不会被认成守卫（守卫穿的是饱和的绿 / 紫 / 橙红）。
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x9a93a8, roughness: 0.86 });
                const limbMat = new THREE.MeshStandardMaterial({ color: 0x6f6878, roughness: 0.92 });
                const spikeMat = new THREE.MeshStandardMaterial({
                    color: tier.chunkColor,
                    emissive: tier.glow,
                    emissiveIntensity: 0.75,
                    roughness: 0.5
                });
                const meshes = [];

                // 躯干横着长，四条腿撑在下面——低矮的兽形，和守卫的直立轮廓正好相反。
                // 宽度压到 1.2：相机是固定俯视的，从上往下看这只怪就是躯干的俯视投影，
                // 1.5 宽配 2.5 长读出来是个方箱子，收窄之后长宽比才够明显。
                const torso = new THREE.Mesh(shared.box, bodyMat);
                torso.scale.set(1.2, 1.1, 2.5);
                torso.position.y = 1.5;
                torso.castShadow = true;
                group.add(torso);
                meshes.push(torso);

                const head = new THREE.Mesh(shared.box, bodyMat);
                head.scale.set(1.05, 0.9, 1.1);
                head.position.set(0, 1.68, 1.72);
                head.castShadow = true;
                group.add(head);
                meshes.push(head);

                // 尾巴。三节递减、向后上翘——固定俯视下这是最省事的「哪头是头」的线索，
                // 没有它躯干加四条腿从上面看只是个带亮点的长方块，认不出是活物。
                for (let i = 0; i < 3; i++) {
                    const seg = new THREE.Mesh(shared.box, limbMat);
                    const s = 0.62 - i * 0.16;
                    seg.scale.set(s, s, 0.72);
                    seg.position.set(0, 1.52 + i * 0.2, -1.55 - i * 0.62);
                    seg.rotation.x = -0.26;
                    seg.castShadow = true;
                    group.add(seg);
                    meshes.push(seg);
                }

                const legs = [];
                for (const sx of [-1, 1]) {
                    for (const sz of [-1, 1]) {
                        const leg = new THREE.Mesh(shared.box, limbMat);
                        leg.scale.set(0.42, 1.9, 0.44);
                        leg.position.set(sx * 0.62, 0.95, sz * 0.85);
                        leg.castShadow = true;
                        group.add(leg);
                        meshes.push(leg);
                        // 对角腿同相，才走得出四足的步子；四条腿同相会读成蹦跳。
                        legs.push({ mesh: leg, phase: sx * sz > 0 ? 0 : Math.PI, restY: 0.95 });
                    }
                }

                // 背上的晶簇跟着内侧那层矿走，读起来像是从那道墙里爬出来的东西。
                // 它同时是这只怪唯一的亮部：暗身体在远处会缩成一个小黑点，靠这三根发光的刺
                // 才能在两道矿墙之间被认出来「那儿有个活的」。
                for (let i = 0; i < 3; i++) {
                    const spike = new THREE.Mesh(shared.box, spikeMat);
                    const s = 0.3 + (1 - Math.abs(i - 1)) * 0.16;
                    spike.scale.set(s, s * 2.1, s);
                    spike.position.set(0, 2.25, (i - 1) * 0.78);
                    spike.rotation.x = (i - 1) * 0.22;
                    group.add(spike);
                    meshes.push(spike);
                }

                // 眼睛照常发光，但不关深度测试——守卫那套 X 光是为了「隔着矿墙看得见」，
                // 游荡怪本来就站在空地上，再穿透就会连主城的房子一起穿过去。
                const eyeMat = new THREE.MeshBasicMaterial({ color: tier.glow });
                for (const side of [-1, 1]) {
                    const eye = new THREE.Mesh(shared.sphere, eyeMat);
                    eye.scale.setScalar(0.22);
                    eye.position.set(side * 0.3, 1.85, 2.05);
                    group.add(eye);
                }

                group.userData = {
                    type: "rover",
                    tierId: lane.inner,
                    tier,
                    lane,
                    // 把 lane 挂成原型，而不是把字段拷过来。守卫那边 config 就是 tier.monster 本身，
                    // 所以调参面板拖「伤害」「掉金币」是当场生效的；拷值的话这两根滑块会变成
                    // 必须重载才见效，和面板上写的说明不符。血量另算——它在下面被读成 maxHp
                    // 烘进对象，改了确实要重载（字段表里标了 reload）。
                    config: Object.assign(Object.create(lane), {
                        attackRange: 2.6,
                        windup: 0.5,
                        warningRadius: 1.9,
                        recovery: 0.65,
                        kind: "swipe",
                        chaseRadius: ROVER_LEASH,
                        reengageRadius: ROVER_AGGRO
                    }),
                    hp: lane.hp,
                    maxHp: lane.hp,
                    alive: true,
                    attackable: true,
                    meshes,
                    arms: [],
                    legs,
                    eyes: [],
                    attackState: "chasing",
                    attackTimer: 0,
                    stagger: 0,
                    knockback: null,
                    emerging: 0,
                    engaged: false,
                    // 错开步态相位，六只怪不至于像仪仗队一样同步迈腿。
                    walkPhase: Math.random() * Math.PI * 2,
                    patrol: {
                        radius: geo.mid,
                        center: angle,
                        span: patrol.span,
                        angle,
                        dir: Math.random() < 0.5 ? -1 : 1
                    }
                };
                createHealthBar(group);
                enemies.push(group);
                return group;
            }

            function spawnRovers() {
                for (const lane of ROVER_LANES) {
                    for (const patrol of ROVER_PATROLS) createRover(lane, patrol);
                }
            }

            // 玩家现在能不能走到这只游荡怪跟前——取决于它那条走廊的内侧矿墙凿穿了没有。
            // 这个判断是给兜底救济用的，它要回答「还有没有赚钱的路子」。高级矿还没破的时候，
            // 最外那条走廊里的两只怪隔着一整堵实心墙，它们活着不构成任何收入。
            //
            // 少了这一条就会死锁，实测过：金币版玩家在锄头地贴上差 3 金币，低中两层的怪
            // 都打完了，兜底却因为「场上还有两只怪」不肯补——而那两只站在他进不去的走廊里，
            // 引导又把他按在地贴上等一笔永远不会来的钱。跑满 500 秒都没结束。
            function roverReachable(enemy) {
                const lane = enemy.userData.lane;
                return !lane || breachedByTier[lane.inner] > 0;
            }

            // 巡逻：沿走廊中线的圆弧来回踱步，走到区间端点掉头。
            // 角速度要除以半径，否则外圈那条走廊上的怪会明显比内圈跑得快——
            // 三条走廊半径差了将近一倍。
            function updateRoverPatrol(enemy, dt) {
                const data = enemy.userData;
                const p = data.patrol;
                p.angle += p.dir * (data.config.speed * 0.45 / p.radius) * dt;
                if (p.angle > p.center + p.span) { p.angle = p.center + p.span; p.dir = -1; }
                if (p.angle < p.center - p.span) { p.angle = p.center - p.span; p.dir = 1; }
                enemy.position.set(Math.cos(p.angle) * p.radius, 0, Math.sin(p.angle) * p.radius);
                const heading = Math.atan2(-Math.sin(p.angle) * p.dir, Math.cos(p.angle) * p.dir);
                enemy.rotation.y = lerpAngle(enemy.rotation.y, heading, 1 - Math.exp(-6 * dt));
            }

            // 迈腿。纯装饰，但没有它这些怪就是贴着地面平移的方块，
            // 「在走动」这件事全靠位置变化去猜。
            function animateRoverGait(enemy, dt, moving) {
                const data = enemy.userData;
                data.walkPhase += dt * (moving ? 7 : 1.6);
                for (const leg of data.legs) {
                    const swing = Math.sin(data.walkPhase + leg.phase);
                    leg.mesh.position.y = leg.restY + (moving ? Math.max(0, swing) * 0.3 : 0);
                    leg.mesh.rotation.x = moving ? swing * 0.5 : swing * 0.06;
                }
            }

            function updateRover(enemy, dt) {
                const data = enemy.userData;
                const distance = flatDistance(enemy.position, player.position);
                // 一旦被激怒就交给守卫那套追击/挥击逻辑，直到玩家跑远。追远了不原地站着，
                // 而是回到自己那段弧上接着走——它本来就是「在这条走廊上活动的东西」。
                if (data.engaged) {
                    if (distance > ROVER_LEASH) {
                        data.engaged = false;
                        data.attackState = "chasing";
                        data.attackTimer = 0;
                        cancelHazardsFrom(enemy);
                        // 回到离当前位置最近的那个巡逻角，省掉一段横穿走廊的直线折返。
                        const back = Math.atan2(enemy.position.z, enemy.position.x);
                        data.patrol.angle = THREE.MathUtils.clamp(
                            back, data.patrol.center - data.patrol.span, data.patrol.center + data.patrol.span
                        );
                    } else {
                        updateMonsterCombat(enemy, dt);
                        animateRoverGait(enemy, dt, data.attackState === "chasing" && distance > data.config.attackRange);
                        return;
                    }
                } else if (distance <= ROVER_AGGRO) {
                    data.engaged = true;
                }
                updateRoverPatrol(enemy, dt);
                animateRoverGait(enemy, dt, true);
            }

            // 矿体半透明后野怪一开始就该看得见，amount 只控制清晰度，不再控制显隐。
            function setMonsterSilhouette(monster, amount) {
                const data = monster.userData;
                monster.visible = true;
                data.silhouetteMaterial.opacity = 0.34 + amount * 0.4;
                for (const mesh of data.meshes) mesh.material = data.silhouetteMaterial;
                // 冻结时不能用矿层自己的辉光色：青矿配薄荷绿眼睛等于隐身。
                // 暖白在青、紫、橙三种矿色上都压得住，落在深色头部剪影里更跳。
                data.eyeMaterial.color.setHex(0xffe9b0);
                // 发光的眼睛是「石头里有东西」最快被读懂的信号，隔着矿墙要放大才看得见。
                // 但放大必须同步拉开间距：眼球半径一旦超过间距，两颗就会糊成一个光斑。
                const scale = 0.46 + amount * 0.14;
                for (const eye of data.eyes) {
                    eye.scale.setScalar(scale);
                    eye.position.x = eye.userData.side * scale * EYE_SPREAD_RATIO;
                }
            }

            // 近处的守卫压在矿墙之上透出来，远处恢复深度测试。
            // 不按距离收住的话，外圈守卫会直接画在内圈矿墙和主城前面。
            function setGuardXray(monster, on) {
                const data = monster.userData;
                data.silhouetteMaterial.depthTest = !on;
                data.eyeMaterial.depthTest = !on;
                for (const mesh of data.meshes) mesh.renderOrder = on ? 4 : 1;
                for (const eye of data.eyes) eye.renderOrder = on ? 5 : 1;
            }

            function revealOreMonster(node) {
                if (node.monsterRevealed) return;
                node.monsterRevealed = true;
                const monster = node.monster;
                const data = monster.userData;
                monster.visible = true;
                data.meshes.forEach((mesh, index) => { mesh.material = data.realMaterials[index]; });
                // 出土后恢复正常深度测试，否则战斗时会穿过建筑和地形显示。
                // 眼睛也要收回原始大小和间距，透视用的放大只在冻在墙里时成立。
                data.xray = false;
                data.silhouetteMaterial.depthTest = true;
                data.eyeMaterial.depthTest = true;
                data.eyeMaterial.color.setHex(data.tier.glow);
                data.meshes.forEach(mesh => { mesh.renderOrder = 0; });
                data.eyes.forEach(eye => {
                    eye.renderOrder = 0;
                    eye.scale.setScalar(EYE_BASE_SCALE);
                    eye.position.x = eye.userData.side * EYE_BASE_OFFSET;
                });
                data.alive = true;
                data.attackable = true;
                data.homePosition = monster.position.clone().setY(0);
                data.emerging = 0.36;
                data.emergeDepth = 1.4;
                monster.position.y = -data.emergeDepth;
                createHealthBar(monster);
                enemies.push(monster);
                buildDust(monster.position.clone().setY(1.5), 14, 2, node.tier.chunkColor);
                cameraShake = Math.max(cameraShake, 0.45);
                playSound("warn");
                if (!shared[`monsterSeen_${node.tierId}`]) {
                    shared[`monsterSeen_${node.tierId}`] = true;
                    if (node.tierId === "low") toast("矿里冻着野怪，打倒它继续挖");
                    else toast(`${node.tier.name}的野怪更强，小心红圈`);
                }
            }

            function createHealthBar(entity) {
                const group = new THREE.Group();
                const background = new THREE.Mesh(
                    new THREE.PlaneGeometry(2.4, 0.28),
                    new THREE.MeshBasicMaterial({ color: 0x160f18, transparent: true, opacity: 0.85, depthTest: false })
                );
                group.add(background);
                const fill = new THREE.Mesh(
                    new THREE.PlaneGeometry(2.3, 0.2),
                    new THREE.MeshBasicMaterial({ color: 0xe0322f, depthTest: false })
                );
                fill.position.z = 0.01;
                group.add(fill);
                group.position.y = 4.4;
                group.renderOrder = 20;
                entity.add(group);
                entity.userData.healthBar = group;
                entity.userData.healthFill = fill;
                return group;
            }

            function updateEnemies(dt) {
                for (const enemy of enemies) {
                    const data = enemy.userData;
                    if (!data.alive) continue;

                    if (data.emerging > 0) {
                        data.emerging = Math.max(0, data.emerging - dt);
                        enemy.position.y = -data.emergeDepth * (data.emerging / 0.36);
                        continue;
                    }
                    enemy.position.y = 0;

                    if (data.stagger > 0) {
                        data.stagger = Math.max(0, data.stagger - dt);
                        if (data.knockback) {
                            enemy.position.addScaledVector(data.knockback, dt);
                            data.knockback.multiplyScalar(Math.exp(-10 * dt));
                            constrainEnemy(enemy);
                        }
                        continue;
                    }

                    if (data.type === "rover") {
                        updateRover(enemy, dt);
                        continue;
                    }
                    if (updateEnemyLeash(enemy, dt)) continue;
                    updateMonsterCombat(enemy, dt);
                }
            }

            function constrainEnemy(enemy) {
                const limit = CONFIG.arenaRadius - 2;
                const distance = Math.hypot(enemy.position.x, enemy.position.z);
                if (distance > limit) {
                    const scale = limit / distance;
                    enemy.position.x *= scale;
                    enemy.position.z *= scale;
                }
                // 守卫被击退时会飞出扇形，落到玩家根本走不过去的地方——那一只就再也打不到了。
                clampToSector(enemy.position);
            }

            function updateEnemyLeash(enemy, dt) {
                const data = enemy.userData;
                const config = data.config;
                const home = data.homePosition;
                if (!home) return false;

                if (data.leashState === "returning") {
                    const direction = home.clone().sub(enemy.position).setY(0);
                    if (direction.length() < 0.25) {
                        enemy.position.set(home.x, 0, home.z);
                        data.leashState = "leashed";
                        return true;
                    }
                    direction.normalize();
                    enemy.position.addScaledVector(direction, config.returnSpeed * dt);
                    enemy.rotation.y = lerpAngle(enemy.rotation.y, Math.atan2(direction.x, direction.z), 0.2);
                    return true;
                }

                if (data.leashState === "leashed") {
                    if (flatDistance(player.position, home) <= config.reengageRadius) {
                        data.leashState = "active";
                        return false;
                    }
                    return true;
                }

                const playerOutside = flatDistance(player.position, home) > config.chaseRadius;
                const selfOutside = flatDistance(enemy.position, home) > config.chaseRadius;
                if (playerOutside || selfOutside) {
                    data.leashState = "returning";
                    data.attackState = "chasing";
                    data.attackTimer = 0;
                    cancelHazardsFrom(enemy);
                    resetMonsterPose(enemy);
                    return true;
                }
                return false;
            }

            function resetMonsterPose(enemy) {
                for (const arm of enemy.userData.arms) arm.rotation.x = 0;
                enemy.rotation.x = 0;
            }

            // 守卫的蓄力是举起双臂，靠 arms 里那两个方块转出来。四足的游荡怪没有手臂，
            // arms 是空数组，这个循环在它身上一圈都不跑——不补一手的话它挥击时整只怪
            // 一动不动，玩家只看到脚下亮起一个红圈，猜不出是谁要打他。
            // 改成整只身体前倾压低，读作低头猛扑。不能用 position.y 做下压，
            // updateEnemies 每帧会把 y 拍回 0。
            function setMonsterPose(enemy, amount) {
                for (const arm of enemy.userData.arms) arm.rotation.x = -amount * 1.35;
                if (enemy.userData.type === "rover") enemy.rotation.x = amount * 0.34;
            }

            function updateMonsterCombat(enemy, dt) {
                const data = enemy.userData;
                const config = data.config;

                if (data.attackState === "windup") {
                    data.attackTimer -= dt;
                    const progress = 1 - Math.max(0, data.attackTimer) / config.windup;
                    setMonsterPose(enemy, progress * progress);
                    if (data.attackTimer <= 0) {
                        data.attackState = "recovery";
                        data.attackTimer = config.recovery;
                    }
                    return;
                }
                if (data.attackState === "recovery") {
                    data.attackTimer -= dt;
                    setMonsterPose(enemy, Math.max(0, data.attackTimer / config.recovery));
                    if (data.attackTimer <= 0) data.attackState = "chasing";
                    return;
                }

                setMonsterPose(enemy, 0);
                const distance = flatDistance(enemy.position, player.position);
                const range = config.attackRange !== undefined ? config.attackRange : 3.2;
                if (distance > range) {
                    const direction = player.position.clone().sub(enemy.position).setY(0);
                    if (direction.lengthSq() > 0.01) {
                        direction.normalize();
                        enemy.position.addScaledVector(direction, config.speed * dt);
                        constrainEnemy(enemy);
                        enemy.rotation.y = lerpAngle(enemy.rotation.y, Math.atan2(direction.x, direction.z), 1 - Math.exp(-8 * dt));
                    }
                    return;
                }

                const facing = player.position.clone().sub(enemy.position).setY(0);
                if (facing.lengthSq() > 0.01) {
                    enemy.rotation.y = lerpAngle(enemy.rotation.y, Math.atan2(facing.x, facing.z), 0.4);
                }
                data.attackState = "windup";
                data.attackTimer = config.windup;
                createMonsterHazard(enemy);
                playSound("warn");
            }

            function createMonsterHazard(enemy) {
                const data = enemy.userData;
                const config = data.config;
                const kind = config.kind;

                if (kind === "fan") {

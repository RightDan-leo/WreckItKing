            function seededRandom(seed) {
                let value = seed % 2147483647;
                if (value <= 0) value += 2147483646;
                return () => (value = (value * 16807) % 2147483647) / 2147483647;
            }

            function createSharedAssets() {
                shared.box = new THREE.BoxGeometry(1, 1, 1);
                shared.sphere = new THREE.SphereGeometry(0.5, 10, 8);
                shared.coin = new THREE.CylinderGeometry(0.26, 0.26, 0.07, 18);
                shared.coinMat = new THREE.MeshStandardMaterial({
                    color: 0xffd23c,
                    emissive: 0x8a5b00,
                    emissiveIntensity: 0.5,
                    roughness: 0.32,
                    metalness: 0.6
                });
                // 钻石用八面体：金币是扁圆片，俯视下两者的剪影必须一眼分得开，光靠颜色不够。
                shared.gem = new THREE.OctahedronGeometry(0.28);
                shared.gemMat = new THREE.MeshStandardMaterial({
                    color: 0x5fe6ff,
                    emissive: 0x0f7fa8,
                    emissiveIntensity: 0.9,
                    roughness: 0.18,
                    metalness: 0.35
                });
                // 埋在矿里的金币要透过半透明石头看清，比普通金币更亮。
                shared.oreCoinMat = new THREE.MeshStandardMaterial({
                    color: 0xffd94f,
                    emissive: 0xffa412,
                    emissiveIntensity: 1.15,
                    roughness: 0.28,
                    metalness: 0.55
                });

                // 宝石：比钻石那颗八面体大一圈、再纵向拉长，俯视下是个立着的棱形而不是一颗珠子。
                // 它和钻石的区分主要不靠形状——两者永远不在同一个位置出现（宝石在矿里，钻石在守卫尸体上），
                // 真正要分开的是**三档品质之间**，那由颜色承担。
                shared.shard = new THREE.OctahedronGeometry(0.32);
                shared.shardMats = {};
                shared.shardHaloMats = {};
                shared.oreShardMats = {};
                for (const id of Object.keys(SHARD_GRADES)) {
                    const grade = SHARD_GRADES[id];
                    shared.shardMats[id] = new THREE.MeshStandardMaterial({
                        color: grade.color,
                        emissive: grade.emissive,
                        emissiveIntensity: 1.1,
                        roughness: 0.16,
                        metalness: 0.4
                    });
                    // 埋在矿里的那颗要压过半透明矿石的底色，否则隔着墙看只是一小块偏色。
                    // 自发光用 emissive 那个压深的色而不是本体色：本体色本来就亮，
                    // 再拿它当自发光会把三档一起烧成白的（第一版就是这么白的）。
                    shared.oreShardMats[id] = new THREE.MeshStandardMaterial({
                        color: grade.color,
                        emissive: grade.emissive,
                        emissiveIntensity: 1.35,
                        roughness: 0.14,
                        metalness: 0.45
                    });
                    // 加色光晕。矿石是半透明的，实心的宝石本体透过去会被石头的颜色洗淡；
                    // 外面套一层加色的壳，亮度就叠在矿石之上而不是被它乘下去——
                    // 「隔着墙也一眼看得见有货」全靠这一层。
                    shared.shardHaloMats[id] = new THREE.MeshBasicMaterial({
                        color: grade.halo,
                        transparent: true,
                        opacity: 0.34,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });
                }
                shared.rockMat = new THREE.MeshStandardMaterial({ color: 0x2b2735, roughness: 0.92 });
                shared.rimMat = new THREE.MeshStandardMaterial({ color: 0x1d1a28, roughness: 0.95 });
                shared.groundMat = new THREE.MeshStandardMaterial({ color: 0x151221, roughness: 0.97 });
                shared.cityFloorMat = new THREE.MeshStandardMaterial({ color: 0x453247, roughness: 0.85 });
                shared.cityTrimMat = new THREE.MeshStandardMaterial({ color: 0x6d4a35, roughness: 0.78 });
                shared.cityStoneMat = new THREE.MeshStandardMaterial({ color: 0x5a4a58, roughness: 0.82 });
                shared.cityRoofMat = new THREE.MeshStandardMaterial({ color: 0xb4553a, roughness: 0.7 });
                // 冻在墙心的守卫剪影。四层半透明矿石叠下来只剩不到一成透光率，
                // 藏在矿墙之后怎么调都看不见，所以改成压在矿墙之上画。
                // 压上去之后底色是高饱和的矿石，深色剪影反而比浅色更能勾出轮廓。
                shared.silhouetteMat = new THREE.MeshBasicMaterial({
                    color: 0x120c1f,
                    transparent: true,
                    opacity: 0,
                    depthWrite: false
                });
                shared.warningMat = new THREE.MeshBasicMaterial({
                    color: 0xff4444,
                    transparent: true,
                    opacity: 0.32,
                    side: THREE.DoubleSide,
                    depthWrite: false
                });
                shared.dustTexture = createDustTexture();
                shared.sparkMaterials = new Map();
                shared.sparkPool = [];
                const sparkGeometry = new THREE.TetrahedronGeometry(0.15);
                for (let i = 0; i < 240; i++) {
                    const mesh = new THREE.Mesh(sparkGeometry, shared.coinMat);
                    mesh.visible = false;
                    scene.add(mesh);
                    shared.sparkPool.push(mesh);
                }
            }

            function createDustTexture() {
                const canvas = document.createElement("canvas");
                canvas.width = canvas.height = 64;
                const context = canvas.getContext("2d");
                const gradient = context.createRadialGradient(32, 32, 2, 32, 32, 31);
                gradient.addColorStop(0, "rgba(255,255,255,0.9)");
                gradient.addColorStop(0.5, "rgba(255,255,255,0.32)");
                gradient.addColorStop(1, "rgba(255,255,255,0)");
                context.fillStyle = gradient;
                context.fillRect(0, 0, 64, 64);
                return new THREE.CanvasTexture(canvas);
            }

            function createArena() {
                // 圆盘要兜住封印矿之外那几层远景，否则地面在半径 52 处齐口切断，
                // 远景矿脉底下是一片虚空。远处会被雾吃掉八成，不会看出是块大圆盘。
                const ground = new THREE.Mesh(
                    new THREE.CircleGeometry(DEEP_FIELD_RADIUS + 4, 96),
                    shared.groundMat
                );
                ground.rotation.x = -Math.PI / 2;
                ground.receiveShadow = true;
                scene.add(ground);

                const rand = seededRandom(9173);
                const rim = new THREE.Group();
                const rimCount = 84;
                for (let i = 0; i < rimCount; i++) {
                    const angle = (i / rimCount) * Math.PI * 2;
                    // 扇形方向让开。这圈石头高 4~9、就摆在封印矿和第一层远景之间，
                    // 俯视角下一块 9 米高的石头会把身后到半径 67 的地面全挡死——
                    // 前两层远景会被自己家的场地边缘挡没。
                    // 让开之后场地在矿脉方向不再闭合，而这正是要的读法：峡谷朝深处continues，
                    // 城和两侧照旧被山围着（那 270° 一块没动）。
                    if (Math.abs(signedAngleDelta(angle, SECTOR.center)) < SECTOR.half + 0.12) continue;
                    const radius = CONFIG.arenaRadius + rand() * 1.6;
                    const rock = new THREE.Mesh(shared.box, shared.rimMat);
                    const height = 4 + rand() * 5;
                    rock.scale.set(3 + rand() * 2.6, height, 3 + rand() * 2.4);
                    rock.position.set(Math.cos(angle) * radius, height * 0.42, Math.sin(angle) * radius);
                    rock.rotation.y = rand() * Math.PI;
                    rock.castShadow = true;
                    rim.add(rock);
                }
                scene.add(rim);

                // 装饰石头只能长在层与层之间的走廊里，否则会从矿墙里穿出来。
                const walls = TIER_ORDER.map(id => {
                    const config = ORE_TIERS[id];
                    return [
                        config.ringRadius - config.ringThickness / 2 - 0.9,
                        config.ringRadius + config.ringThickness / 2 + 0.9
                    ];
                });
                const inWall = value => walls.some(([near, far]) => value > near && value < far);

                const decor = new THREE.Group();
                for (let i = 0; i < 60; i++) {
                    // 只撒在扇形里：扇形外玩家走不到，石头摆过去纯属浪费draw call，
                    // 还会让远景看起来「那边也能过去」。
                    const angle = SECTOR.start + rand() * SECTOR.span;
                    let radius = 16 + rand() * (CONFIG.arenaRadius - 19);
                    for (let retry = 0; retry < 8 && inWall(radius); retry++) {
                        radius = 16 + rand() * (CONFIG.arenaRadius - 19);
                    }
                    if (inWall(radius)) continue;
                    const rock = new THREE.Mesh(shared.box, shared.rockMat);
                    const scale = 0.4 + rand() * 0.9;
                    rock.scale.set(scale * (1 + rand()), scale, scale * (1 + rand()));
                    rock.position.set(Math.cos(angle) * radius, scale * 0.4, Math.sin(angle) * radius);
                    rock.rotation.y = rand() * Math.PI;
                    rock.castShadow = true;
                    decor.add(rock);
                }
                scene.add(decor);

                createSectorWalls(rand);

                // 地表把整条矿脉的宽度染出来：挖穿之后依然看得见自己刚穿过的是哪一层。
                // RingGeometry 躺平后角度会反向，起始角要取负。
                for (const tier of TIER_ORDER) {
                    const config = ORE_TIERS[tier];
                    const ring = new THREE.Mesh(
                        new THREE.RingGeometry(
                            config.ringRadius - config.ringThickness / 2,
                            config.ringRadius + config.ringThickness / 2,
                            48,
                            1,
                            -SECTOR.end,
                            SECTOR.span
                        ),
                        new THREE.MeshBasicMaterial({
                            color: config.glow,
                            transparent: true,
                            opacity: 0.1,
                            side: THREE.DoubleSide,
                            depthWrite: false
                        })
                    );
                    ring.rotation.x = -Math.PI / 2;
                    ring.position.y = 0.02;
                    scene.add(ring);
                }
            }

            // 扇形两侧的岩壁。矿墙收成扇形之后这两道墙是规则的一部分：没有它们，
            // 玩家从扇形侧面一绕就走到高级矿外圈，「凿穿一层才能进下一层」直接失效。
            // 沿用场地边缘那圈岩石的材质和体量，读起来就是一条从城里挖出去的峡谷。
            //
            // 把可行走范围收成「主城 + 一条朝屏幕上方的扇形走廊」的那两道墙。
            // 矿墙从整圈收成扇形之后这是规则的一部分：不堵住的话玩家从侧面一绕就走到
            // 高级矿外圈，「凿穿一层才能进下一层」直接失效。
            //
            // 挡人靠的是每块石头自己的圆形碰撞体，不是纯几何的角度裁剪。裁剪会把位移整个抹掉，
            // 人贴着边界走时等于被钉住；圆形碰撞只沿径向推开，切向的输入照样生效，
            // 顺着墙就能滑到开口。裁剪（clampToSector）只留着兜底。
            // 步长 2.3 配碰撞半径 1.35，相邻石头的碰撞圈有重叠，不会漏出能钻过去的缝。
            function createSectorWalls(rand) {
                const walls = new THREE.Group();
                const place = (x, z, height, spread, collide) => {
                    const rock = new THREE.Mesh(shared.box, shared.rimMat);
                    rock.scale.set(spread, height, spread);
                    rock.position.set(x, height * 0.4, z);
                    rock.rotation.y = rand() * Math.PI;
                    rock.castShadow = collide > 0;
                    walls.add(rock);
                    if (collide > 0) addSolidCollider(x, z, collide);
                };

                // 主城的围墙：沿自由圆绕过扇形之外的那 270°，只在朝屏幕上方留一个口子。
                // 这道墙同时解决了两件事——玩家一眼看出只能从这儿出城，
                // 以及不会在城边撞上一圈看不见的边界。
                // 石头中心排在 18.7：碰撞圈（1.5）加人（0.62）之后内缘 16.58，
                // 刚好落在自由圆（16.3）外面，不会去挤环城道。
                const cityRadius = 18.7;
                const gapCount = Math.round((Math.PI * 2 - SECTOR.span) * cityRadius / 2.3);
                for (let i = 0; i < gapCount; i++) {
                    const angle = SECTOR.end + (i + 0.5) / gapCount * (Math.PI * 2 - SECTOR.span);
                    const radius = cityRadius + rand() * 1.1;
                    place(
                        Math.cos(angle) * radius,
                        Math.sin(angle) * radius,
                        2.8 + rand() * 2.4,
                        2.3 + rand() * 1.4,
                        1.5
                    );
                }

                // 扇形两侧：一路排到场地边缘那圈岩石。穿过三层矿墙两端正好是「矿脉嵌在岩壁里」。
                // 起点接着主城围墙，往里再排会把在城边绕圈的玩家推进「圆外又在扇形外」的夹缝，
                // 那儿既挖不到矿也走不回来。
                for (const side of [-1, 1]) {
                    const angle = SECTOR.center + side * SECTOR.half;
                    const cos = Math.cos(angle);
                    const sin = Math.sin(angle);
                    for (let radius = 18.4; radius < CONFIG.arenaRadius + 1.5; radius += 2.3) {
                        place(cos * radius, sin * radius, 3.4 + rand() * 3.2, 2.4 + rand() * 1.5, 1.35);
                    }
                    // 深谷段：接着往外排到最深那层之外，逐段抬高。它替掉了刚让开的那段
                    // 边缘岩石——远景需要的是身后没有遮挡，不是四面漏风，两侧仍然得有山把
                    // 这条谷框住，顺带遮住地面圆盘的边。
                    // 不注册碰撞体也不投影：玩家被封印矿内缘卡在半径 43，永远走不到这一段，
                    // 而阴影相机只有 ±40，这里投的影一个像素都落不到画面上。
                    // 步长放宽到 3.4——挡人的职责没了，剩下的只是天际线，密排纯属浪费。
                    for (let radius = CONFIG.arenaRadius + 1.5; radius < DEEP_FIELD_RADIUS; radius += 3.4) {
                        const t = (radius - CONFIG.arenaRadius) / (DEEP_FIELD_RADIUS - CONFIG.arenaRadius);
                        // 越往外越张开。不张开的话这道墙就是一条从相机脚下笔直伸向深处的
                        // 长堤，而终局机位正好架在扇形边线外侧、斜着往里看——那条堤会横在
                        // 画面一侧，把它本来要衬托的远景挡掉大半。
                        // 张开之后它退到画框边缘，同时读成「这条谷往深处越走越宽」。
                        const flare = SECTOR.half + t * 0.42;
                        place(
                            Math.cos(SECTOR.center + side * flare) * radius,
                            Math.sin(SECTOR.center + side * flare) * radius,
                            5 + t * 7 + rand() * 2.4,
                            3.2 + t * 3.4 + rand() * 1.6,
                            0
                        );
                    }
                }
                scene.add(walls);
            }

            function addSolidCollider(x, z, radius) {
                const collider = { x, z, radius };
                solidColliders.push(collider);
                return collider;
            }

            // 查有没有碰撞圈伸进了玩家该走的那块 T 形地（CITY_CLEAR）。
            // 城里的位置全是手填的坐标，挪一栋房子很容易不小心压到路上一点点，而这种问题
            // 在自动演示里只表现成「人卡在城里不动」，从现场看不出是哪一栋伸过来的。
            // 通过 __wik.clear() 取，返回空数组才算布局合法。
            function cityClearViolations() {
                const hits = [];
                for (const collider of solidColliders) {
                    if (collider.radius <= 0) continue;
                    // 岩壁在自由圆之外，不参与城内布局校验。
                    if (Math.hypot(collider.x, collider.z) > 15) continue;
                    const reach = collider.radius + CONFIG.playerRadius;
                    const nearX = Math.abs(collider.x) - reach;
                    const inTile = nearX < CITY_CLEAR.tileHalfX
                        && collider.z - reach < CITY_CLEAR.tileMaxZ
                        && collider.z + reach > CITY_CLEAR.tileMinZ;
                    const inAxis = nearX < CITY_CLEAR.axisHalfX
                        && collider.z - reach < CITY_CLEAR.axisMaxZ;
                    if (!inTile && !inAxis) continue;
                    hits.push({
                        x: Number(collider.x.toFixed(2)),
                        z: Number(collider.z.toFixed(2)),
                        r: collider.radius,
                        zone: inTile ? "地贴区" : "中轴"
                    });
                }
                return hits;
            }

            function createLimb(radius, length, material) {
                const limb = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius * 1.08, length, 8), material);
                limb.position.y = -length * 0.25;
                limb.castShadow = true;
                return limb;
            }

            function createPlayer() {
                player = new THREE.Group();
                playerVisual = new THREE.Group();
                player.add(playerVisual);

                const blueCloth = new THREE.MeshStandardMaterial({ color: 0x176eab, roughness: 0.72 });
                const lightCloth = new THREE.MeshStandardMaterial({ color: 0x269bd0, roughness: 0.66 });
                const darkCloth = new THREE.MeshStandardMaterial({ color: 0x0d3f72, roughness: 0.76 });
                const skin = new THREE.MeshStandardMaterial({ color: 0x9bdcf2, roughness: 0.65 });

                const robe = new THREE.Mesh(new THREE.ConeGeometry(0.78, 1.65, 8), blueCloth);
                robe.position.y = 1.05;
                robe.castShadow = true;
                playerVisual.add(robe);

                const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.65, 1, 8), lightCloth);
                torso.position.y = 1.62;
                torso.castShadow = true;
                playerVisual.add(torso);

                playerCape = new THREE.Mesh(
                    new THREE.PlaneGeometry(1.25, 1.75),
                    new THREE.MeshStandardMaterial({ color: 0x0b477b, roughness: 0.8, side: THREE.DoubleSide })
                );
                playerCape.position.set(0, 1.42, -0.46);
                playerCape.rotation.x = -0.16;
                playerVisual.add(playerCape);

                const hood = new THREE.Mesh(new THREE.SphereGeometry(0.55, 12, 8), darkCloth);
                hood.position.set(0, 2.25, 0);
                hood.scale.set(1.06, 1.2, 1.02);
                hood.castShadow = true;
                playerVisual.add(hood);

                const face = new THREE.Mesh(new THREE.SphereGeometry(0.31, 10, 8), skin);
                face.position.set(0, 2.18, 0.39);
                playerVisual.add(face);

                playerLeftLeg = createLimb(0.16, 0.62, darkCloth);
                playerLeftLeg.position.set(-0.28, 0.38, 0.02);
                playerRightLeg = createLimb(0.16, 0.62, darkCloth);
                playerRightLeg.position.set(0.28, 0.38, 0.02);
                playerVisual.add(playerLeftLeg, playerRightLeg);

                playerLeftArm = createLimb(0.14, 0.78, lightCloth);
                playerLeftArm.position.set(-0.63, 1.65, 0.03);
                playerLeftArm.rotation.z = -0.15;
                playerRightArm = createLimb(0.14, 0.78, lightCloth);
                playerRightArm.position.set(0.63, 1.65, 0.03);
                playerRightArm.rotation.z = 0.15;
                playerVisual.add(playerLeftArm, playerRightArm);

                playerWeapon = new THREE.Group();
                const handle = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.06, 0.06, 1.75, 8),
                    new THREE.MeshStandardMaterial({ color: 0x6d4127 })
                );
                handle.rotation.z = -0.2;
                playerWeapon.add(handle);
                const head = new THREE.Mesh(shared.box, new THREE.MeshStandardMaterial({
                    emissiveIntensity: 0.85,
                    metalness: 0.7,
                    roughness: 0.28
                }));
                head.position.set(0.15, 0.86, 0);
                head.rotation.z = -0.2;
                playerWeapon.add(head);
                playerWeapon.userData.handle = handle;
                playerWeapon.userData.head = head;
                applyPickaxeAppearance();
                playerWeapon.position.set(0.75, 1.25, 0.15);
                playerWeapon.rotation.z = -0.15;
                playerWeapon.userData.baseRotationZ = -0.15;
                playerWeapon.userData.swing = 0;
                playerVisual.add(playerWeapon);

                backCoinStack = new THREE.Group();
                backCoinStack.position.set(0, 1.28, -0.52);
                playerVisual.add(backCoinStack);

                playerRing = new THREE.Mesh(
                    new THREE.RingGeometry(0.92, 1.13, 40),
                    new THREE.MeshBasicMaterial({
                        color: 0x58d8ff,
                        transparent: true,
                        opacity: 0.82,
                        side: THREE.DoubleSide
                    })
                );
                playerRing.rotation.x = -Math.PI / 2;
                playerRing.position.y = 0.04;
                player.add(playerRing);

                // 出生在广场里，不在城南。地贴搬到城北之后，原来那个 (0,10.5) 的出生点
                // 会变成「先穿过整座城才能点第一张地贴」，正是这次要消掉的东西。
                player.position.set(0, 0, -1.5);
                // 一出生就面朝第一个要走的地贴：背对目标的话玩家第一反应是往反方向走。
                // 地贴在正北，所以这一朝同时也朝着矿区。
                player.rotation.y = facingAngleTo(TILE_SLOTS["city-build"]);
                scene.add(player);
                cameraFocus.copy(player.position);
            }

            function facingAngleTo(target) {
                return Math.atan2(target.x - player.position.x, target.z - player.position.z);
            }

            function syncBackCoins() {
                if (!backCoinStack) return;
                const visible = Math.min(CONFIG.backCoinMaxVisible, Math.max(0, coins));
                while (backCoinStack.children.length > visible) {
                    backCoinStack.remove(backCoinStack.children[backCoinStack.children.length - 1]);
                }
                while (backCoinStack.children.length < visible) {
                    const index = backCoinStack.children.length;
                    const coin = new THREE.Mesh(shared.coin, shared.coinMat);
                    coin.scale.setScalar(1.08);
                    // 圆柱轴本来就是 Y 轴，保持默认即为平放；绕 X 轴转 90° 会把金币立起来。
                    coin.rotation.y = index * 0.55;
                    coin.rotation.z = Math.sin(index * 1.7) * 0.05;
                    coin.rotation.x = Math.cos(index * 2.3) * 0.04;
                    coin.position.set(
                        Math.sin(index * 0.7) * 0.035,
                        index * CONFIG.backCoinStep,
                        Math.cos(index * 0.9) * 0.035
                    );
                    // 高塔上每枚都投影会明显掉帧，隔几枚投一次已经够看出体积。
                    coin.castShadow = index % 6 === 0;
                    backCoinStack.add(coin);
                }
            }

            function getBackCoinTop(offsetX = 0, offsetZ = 0) {
                if (!backCoinStack) return player.position.clone().add(new THREE.Vector3(0, 1.4, 0));
                const visible = Math.min(CONFIG.backCoinMaxVisible, Math.max(0, coins));
                return backCoinStack.localToWorld(new THREE.Vector3(
                    offsetX,
                    visible * CONFIG.backCoinStep + 0.12,
                    offsetZ
                ));
            }

            function updatePlayer(dt, elapsed) {
                const input = new THREE.Vector3();
                if (stick.magnitude > 0.05) {
                    input.set(stick.x, 0, stick.z).multiplyScalar(stick.magnitude);
                } else {
                    if (keys.w) input.z -= 1;
                    if (keys.s) input.z += 1;
                    if (keys.a) input.x -= 1;
                    if (keys.d) input.x += 1;
                    if (input.lengthSq() > 1) input.normalize();
                }

                const desired = input.multiplyScalar(CONFIG.playerSpeed * (carryingEgg ? 0.88 : 1));
                const response = desired.lengthSq() > 0.01 ? CONFIG.playerAcceleration : CONFIG.playerDeceleration;
                moveVelocity.lerp(desired, 1 - Math.exp(-response * dt));
                if (moveVelocity.lengthSq() < 0.0004) moveVelocity.set(0, 0, 0);

                resolvePlayerMove(dt);

                const speedRatio = Math.min(1, moveVelocity.length() / CONFIG.playerSpeed);
                if (speedRatio > 0.03) {
                    const moveAngle = Math.atan2(moveVelocity.x, moveVelocity.z);
                    player.rotation.y = lerpAngle(player.rotation.y, moveAngle, 1 - Math.exp(-14 * dt));
                }

                const walk = Math.sin(elapsed * 11) * speedRatio;
                playerVisual.position.y = Math.abs(Math.sin(elapsed * 11)) * 0.075 * speedRatio;
                playerVisual.rotation.z = -moveVelocity.x / CONFIG.playerSpeed * 0.055;
                playerLeftLeg.rotation.x = walk * 0.65;
                playerRightLeg.rotation.x = -walk * 0.65;
                if (carryingEgg) {
                    playerLeftArm.rotation.x = -0.85;
                    playerLeftArm.rotation.z = 0.3;
                } else {
                    playerLeftArm.rotation.x = -walk * 0.35;
                    playerLeftArm.rotation.z = -0.15;
                }
                playerRightArm.rotation.x = walk * 0.35;
                playerRightArm.rotation.z = 0.15;
                playerWeapon.visible = true;
                playerCape.rotation.x = -0.16 - speedRatio * 0.22 + Math.sin(elapsed * 7) * 0.025;

                if (playerWeapon.userData.swing > 0) {
                    playerWeapon.userData.swing = Math.max(0, playerWeapon.userData.swing - dt * 4.8);
                    const swing = Math.sin((1 - playerWeapon.userData.swing) * Math.PI);
                    playerWeapon.rotation.z = playerWeapon.userData.baseRotationZ - swing * 1.15;
                    playerRightArm.rotation.x -= swing * 0.85;
                } else {
                    playerWeapon.rotation.z = playerWeapon.userData.baseRotationZ;
                }
                if (attackLunge > 0) {
                    attackLunge = Math.max(0, attackLunge - dt * 5.5);
                    playerVisual.position.z = Math.sin((1 - attackLunge) * Math.PI) * 0.26;
                } else {
                    playerVisual.position.z = 0;
                }
                playerRing.material.opacity = 0.68 + Math.sin(elapsed * 5) * 0.16;

                if (backCoinStack) {
                    // 越高越晃，让金币塔看起来是背上去的而不是贴上去的。
                    const stackHeight = backCoinStack.children.length * CONFIG.backCoinStep;
                    const wobble = (0.02 + Math.min(0.075, stackHeight * 0.022)) * (0.3 + speedRatio);
                    backCoinStack.rotation.z = Math.sin(elapsed * 8) * wobble;
                    backCoinStack.rotation.x = Math.cos(elapsed * 6.2) * wobble * 0.55;
                }

                attackTimer -= dt;
                const target = nearestTarget();
                if (target && attackTimer <= 0) {
                    const mining = target.userData.type === "ore";
                    // 凿不动的矿放慢挥击间隔，否则每 0.3 秒一次弹开音效会变成噪音。
                    const blocked = mining && !canMine(target.userData.node);
                    attackTimer = blocked ? 0.75 : (mining ? CONFIG.mineCooldown : CONFIG.attackCooldown);
                    const facing = target.position.clone().sub(player.position).setY(0);
                    if (facing.lengthSq() > 0.01) {
                        player.rotation.y = lerpAngle(player.rotation.y, Math.atan2(facing.x, facing.z), 0.55);
                    }
                    playerAttack(target);
                }
            }

            function resolvePlayerMove(dt) {
                const next = player.position.clone().addScaledVector(moveVelocity, dt);
                // 正常帧走不到 0.16 米，一步就够；掉帧时 dt 变大，分步保证不会一帧穿过矿墙。
                const resolved = sweepCirclePosition(player.position, next, CONFIG.playerRadius);
                player.position.copy(resolved);

                const limit = playerOuterLimit();
                const distance = Math.hypot(player.position.x, player.position.z);
                if (distance > limit) {
                    const scale = limit / distance;
                    player.position.x *= scale;
                    player.position.z *= scale;
                }
                clampToSector(player.position);
            }

            // 玩家能走到的最外圈。边界不能按场地半径算：封印矿是凿不开的，它的墙体
            // （43.4~47.0）本来就伸进了场地边缘，而 arenaRadius - 2.4 = 45.6 正好落在这道墙中间。
            // 那个钳制在所有碰撞解算之后执行，于是被守卫击退推出墙外的人会被它按回实心矿里，
            // 再也出不来——碰撞不让他动，钳制不让他走。边界改取封印矿内缘。
            function playerOuterLimit() {
                let limit = CONFIG.arenaRadius - 2.4;
                for (const ring of oreRings) {
                    const tier = ORE_TIERS[ring.tierId];
                    if (!tier || !tier.sealed) continue;
                    limit = Math.min(limit, ring.innerRadius - CONFIG.playerRadius - 0.02);
                }
                return limit;
            }

            function resolveCirclePosition(from, to, radius) {
                const result = to.clone();
                // 挨得近的两栋房子，碰撞圈本来就是重叠的（主城北面祭坛和民房之间就有 0.69 的重叠）。
                // 只推一轮的话后一个圆会把人按回前一个圆里，收敛成一个哪个方向都动不了的死点。
                // 多推几轮先解掉大部分，剩下的交给 escapeSolidPinch。
                for (let pass = 0; pass < 3; pass++) {
                    let pushed = false;
                    for (const collider of solidColliders) {
                        if (collider.radius <= 0) continue;
                        const dx = result.x - collider.x;
                        const dz = result.z - collider.z;
                        const minDistance = collider.radius + radius;
                        const distance = Math.hypot(dx, dz);
                        if (distance >= minDistance || distance < 0.0001) continue;
                        const scale = minDistance / distance;
                        result.x = collider.x + dx * scale;
                        result.z = collider.z + dz * scale;
                        pushed = true;
                    }
                    if (!pushed) break;
                }
                escapeSolidPinch(result, radius);
                resolveOreWallPosition(result, radius);
                escapeOreBand(result, radius);
                result.y = from.y;
                return result;
            }

            // 沿路径分步走，而不是把终点直接交给 resolveCirclePosition。
            //
            // 终点解算会先把人放进墙体里，再由「从哪一面出去」决定落点。矿墙在径向上是好几层柱子，
            // 人一旦越过某根柱子的中心，那根柱子就把他往外推，推进下一根柱子里，下一根接着往外推——
            // 一路挤到墙的另一面。守卫击退 3.4 米、高级矿到封印矿的走廊只有 3.2 米宽，在走廊里
            // 挨一下就能这么被推穿整道封印矿墙，落在墙和场地边缘之间那条一米宽的缝里出不来。
            //
            // 分步之后每一步都短于最薄那层柱子的半深，撞上墙就停在墙的这一侧。
            function sweepCirclePosition(from, to, radius) {
                const delta = to.clone().sub(from).setY(0);
                const distance = delta.length();
                if (distance < 0.0001) return from.clone();

                let thinnest = Infinity;
                for (const ring of oreRings) thinnest = Math.min(thinnest, ring.cellDepth);
                const step = Number.isFinite(thinnest) ? Math.max(0.15, Math.min(0.5, thinnest * 0.4)) : 0.4;

                const steps = Math.max(1, Math.ceil(distance / step));
                let current = from.clone();
                for (let i = 1; i <= steps; i++) {
                    const probe = from.clone().addScaledVector(delta, i / steps);
                    const resolved = resolveCirclePosition(current, probe, radius);
                    // 解算把这一步挪开了，说明撞上东西了。停在解算结果上——它已经贴着墙面，
                    // 顺带保留了沿墙滑行的手感。
                    if (resolved.distanceTo(probe) > 0.001) return resolved;
                    current = resolved;
                }
                return current;
            }

            // 逐个推完还嵌在圆里，说明人正卡在两个重叠圆的夹缝中间。
            // 把所有还压着他的圆的推出方向按嵌入深度叠起来，沿合力顶出去：
            // 合力大致垂直于两个圆心的连线，也就是夹缝敞开的那一侧。
            function escapeSolidPinch(result, radius) {
                let pushX = 0;
                let pushZ = 0;
                let deepest = 0;
                for (const collider of solidColliders) {
                    if (collider.radius <= 0) continue;
                    const dx = result.x - collider.x;
                    const dz = result.z - collider.z;
                    const minDistance = collider.radius + radius;
                    const distance = Math.hypot(dx, dz);
                    if (distance >= minDistance || distance < 0.0001) continue;
                    const depth = minDistance - distance;
                    pushX += (dx / distance) * depth;
                    pushZ += (dz / distance) * depth;
                    deepest = Math.max(deepest, depth);
                }
                if (deepest <= 0) return;
                const length = Math.hypot(pushX, pushZ);
                if (length < 0.0001) return;
                result.x += (pushX / length) * deepest;
                result.z += (pushZ / length) * deepest;
            }

            // 逐柱推完还嵌在矿里，说明人被夹在环带内部。每根柱子只把他推向自己最近的那个面，
            // 径向上几层柱子首尾相接时这些推力互相抵消，收敛成一个哪个方向都动不了的死点。
            //
            // 这里不按柱子算，按整条环带算：矿墙是同心环带，内外缘半径都是现成的，直接把人
            // 送到带外去。一律往内送，不送最近的那一侧——最外层是封印矿，它外面只有场地边缘
            // 那圈岩石，往外送等于从一个死点换到另一个死点；而往内一定是走廊或城区，永远是通的。
            //
            // 只在真的压着「挡人的柱子」时才触发，所以站在自己凿出来的隧道里不会被弹走。
            function escapeOreBand(result, radius) {
                const distance = Math.hypot(result.x, result.z);
                if (distance < 0.0001) return;
                for (const ring of oreRings) {
                    if (ring.remaining <= 0) continue;
                    if (distance <= ring.innerRadius || distance >= ring.outerRadius) continue;
                    // 判据是「人所在的那格是不是实心」，不是嵌得多深。死点上每根柱子都认为人
                    // 正好贴在自己的面上、穿透为零，按深度判会一次都不触发，可他还是动不了。
                    const ai = Math.floor((Math.atan2(result.z, result.x) - SECTOR.start) / ring.cellAngle);
                    const ri = Math.floor((distance - ring.innerRadius) / ring.cellDepth);
                    const column = columnAt(ring, ai, ri);
                    // 凿开的通道里 blockCount 是 0，所以站在自己挖出来的隧道里不会被弹走。
                    if (!column || column.blockCount <= 0) continue;
                    const scale = (ring.innerRadius - radius) / distance;
                    result.x *= scale;
                    result.z *= scale;
                    return;
                }
            }

            // 矿墙按体素柱逐个挡人：凿穿一条通道后，通道正好就是能走过去的缺口。
            // 体素在「切向 × 径向」上是规整的矩形，所以用 OBB 而不是外接圆，隧道宽度才等于挖出来的宽度。
            function resolveOreWallPosition(result, radius) {
                for (let pass = 0; pass < 2; pass++) {
                    let pushed = false;
                    scanNearbyColumns(result, radius, column => {
                        if (column.blockCount <= 0) return;
                        const ox = result.x - column.x;
                        const oz = result.z - column.z;
                        const along = ox * -column.sinA + oz * column.cosA;
                        const out = ox * column.cosA + oz * column.sinA;
                        const limitAlong = column.halfArc + radius;
                        const limitOut = column.halfDepth + radius;
                        const penAlong = limitAlong - Math.abs(along);
                        const penOut = limitOut - Math.abs(out);
                        if (penAlong <= 0 || penOut <= 0) return;
                        let nextAlong = along;
                        let nextOut = out;
                        // 隧道是径向的，窄通道里两侧夹住时优先顺着通道方向挤出去，别把玩家横着卡在墙缝里。
                        if (penAlong * 1.4 < penOut) {
                            nextAlong = (along >= 0 ? 1 : -1) * limitAlong;
                        } else {
                            // 正好压在柱心时没有方向可推，一律往外侧顶，免得把玩家塞进墙里。
                            nextOut = (out === 0 ? 1 : Math.sign(out)) * limitOut;
                        }
                        result.x = column.x + nextAlong * -column.sinA + nextOut * column.cosA;
                        result.z = column.z + nextAlong * column.cosA + nextOut * column.sinA;
                        pushed = true;
                    });
                    if (!pushed) break;
                }
                return result;
            }

            // 只找已出土的：冻在矿里的守卫不在 enemies 里，那种情况下引导该指矿而不是指人。
            function nearestLivingGuard() {
                let best = null;
                let bestDistance = Infinity;
                for (const enemy of enemies) {
                    if (!enemy.userData.alive || enemy.userData.type !== "monster") continue;
                    const distance = flatDistance(enemy.position, player.position);
                    if (distance < bestDistance) {
                        bestDistance = distance;
                        best = enemy;
                    }
                }
                return best;
            }

            function nearestTarget() {
                let bestEnemy = null;
                let bestEnemyDistance = Infinity;
                for (const enemy of enemies) {
                    if (!enemy.userData.alive || !enemy.userData.attackable) continue;
                    const distance = flatDistance(enemy.position, player.position);
                    if (distance < bestEnemyDistance) {
                        bestEnemyDistance = distance;
                        bestEnemy = enemy;
                    }
                }
                if (bestEnemy && bestEnemyDistance <= CONFIG.attackRange + 1.4) return bestEnemy;

                // 挖得动的矿优先；范围内只有凿不动的矿时仍然瞄准它，好让玩家收到「等级不足」的反馈。
                // 一段矿墙能横跨十几米，按段中心测距会挖不到脚边的墙，只能按最近的那根体素柱算。
                let bestOre = null;
                let bestOreDistance = Infinity;
                let blockedOre = null;
                let blockedDistance = Infinity;
                scanNearbyColumns(player.position, CONFIG.mineRange, column => {
                    const node = column.node;
                    if (!node || node.cleared) return;
                    const distance = columnSurfaceDistance(column, player.position);
                    if (canMine(node)) {
                        if (distance < bestOreDistance) {
                            bestOreDistance = distance;
                            bestOre = node;
                        }
                    } else if (distance < blockedDistance) {
                        blockedDistance = distance;
                        blockedOre = node;
                    }
                });
                if (bestOre && bestOreDistance <= CONFIG.mineRange) return bestOre.group;
                if (blockedOre && blockedDistance <= CONFIG.mineRange) return blockedOre.group;
                return null;
            }

            function columnSurfaceDistance(column, point) {
                const ox = point.x - column.x;
                const oz = point.z - column.z;
                const along = Math.abs(ox * -column.sinA + oz * column.cosA) - column.halfArc;
                const out = Math.abs(ox * column.cosA + oz * column.sinA) - column.halfDepth;
                return Math.hypot(Math.max(0, along), Math.max(0, out));
            }

            function playerAttack(target) {
                const mining = target.userData.type === "ore";
                attackSequence = mining ? 3 : (attackSequence % 3) + 1;
                playerWeapon.userData.swing = 1;
                attackLunge = 1;
                const color = mining ? target.userData.node.tier.glow : 0x8fd6ff;
                createAttackArc(color, attackSequence);
                playSound("attack");

                defer(attackSequence === 3 ? 0.14 : 0.1, () => {
                    if (mining) {
                        if (target.userData.node.cleared) return;
                        mineOre(target.userData.node);
                        return;
                    }
                    if (!target.userData.alive) return;
                    const dmgCfg = BALANCE.playerDamage;
                    const damage = dmgCfg.base + (pickaxeLevel - 1) * dmgCfg.perPickaxe + (petEvolved ? dmgCfg.evolvedBonus : 0);
                    const finisher = attackSequence === 3;
                    const dealt = finisher ? Math.round(damage * dmgCfg.comboMultiplier) : damage;
                    const knockback = target.position.clone().sub(player.position).setY(0).normalize();
                    target.userData.knockback = knockback.multiplyScalar(finisher ? 2.2 : 0.9);
                    target.userData.stagger = finisher ? 0.18 : 0.08;
                    cameraShake = Math.max(cameraShake, finisher ? 0.18 : 0.07);
                    buildPopEffect(
                        target.position.clone().add(new THREE.Vector3(0, 1.4, 0)),
                        finisher ? 12 : 6,
                        color
                    );
                    damageEnemy(target, dealt, dealt, finisher);
                    playSound(finisher ? "hit" : "attack");
                });
            }

            function createAttackArc(color, sequence) {
                const radius = sequence === 3 ? 1.65 : 1.25;
                const arc = new THREE.Mesh(
                    new THREE.TorusGeometry(radius, sequence === 3 ? 0.13 : 0.08, 6, 26, Math.PI * 1.35),
                    new THREE.MeshBasicMaterial({
                        color,
                        transparent: true,
                        opacity: sequence === 3 ? 0.95 : 0.7,
                        side: THREE.DoubleSide
                    })
                );
                const forward = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
                arc.position.copy(player.position).add(forward.multiplyScalar(1.05));
                arc.position.y = 1.35;
                arc.rotation.y = player.rotation.y;
                arc.rotation.z = sequence === 2 ? 0.45 : -0.65;
                scene.add(arc);
                effects.push({ type: "slash", mesh: arc, life: 0.24, maxLife: 0.24 });
            }

            function damagePlayer(amount, sourcePosition, knockback = 0) {
                if (ctaOpen || cinematic.active) return;
                playerHp = Math.max(CONFIG.playerMinHp, playerHp - amount);
                updateUI();
                showDamage(player.position, `-${amount}`, false);
                cameraShake = Math.max(cameraShake, 0.35);
                playSound("hurt");
                if (knockback > 0 && sourcePosition) {
                    const direction = player.position.clone().sub(sourcePosition).setY(0);
                    if (direction.lengthSq() < 0.01) direction.set(0, 0, 1);
                    direction.normalize();
                    const target = player.position.clone().addScaledVector(direction, knockback);
                    player.position.copy(sweepCirclePosition(player.position, target, CONFIG.playerRadius));
                }
            }

            function updateCamera(dt) {
                if (cinematic.active) {
                    camera.position.lerp(cinematic.cameraTarget, 1 - Math.exp(-cinematic.response * dt));
                    cameraFocus.lerp(cinematic.lookTarget, 1 - Math.exp(-cinematic.response * dt));
                    applyCameraShake(dt);
                    camera.lookAt(cameraFocus);
                    return;
                }
                const lead = moveVelocity.clone().multiplyScalar(0.15);
                const desiredFocus = player.position.clone().add(lead).add(new THREE.Vector3(0, 0.85, -2.6));
                cameraFocus.lerp(desiredFocus, 1 - Math.exp(-6.5 * dt));
                // 横扫时柔性拉远。炸药桶就在矿墙脚下，玩家站在爆点旁边，不像早先那样整道墙
                // 都在画框外，所以只需要小幅抬起来把塌陷的两端收进来。
                const lift = sweep.lift * 6;
                const desired = cameraFocus.clone().add(new THREE.Vector3(0, 26 + lift, 19.5 + lift * 0.7));
                camera.position.lerp(desired, 1 - Math.exp(-7.5 * dt));
                applyCameraShake(dt);
                camera.lookAt(cameraFocus);
            }

            function applyCameraShake(dt) {
                if (cameraShake <= 0) return;
                cameraShake = Math.max(0, cameraShake - dt * 1.7);
                camera.position.x += (Math.random() - 0.5) * cameraShake;
                camera.position.y += (Math.random() - 0.5) * cameraShake * 0.5;
            }

            // 终局运镜会贴着地面从城里拍向巨龙，中途要穿过矿墙。半透明矿石糊在镜头上
            // 就是一层洗白整个画面的雾，所以镜头钻进哪一段墙，就把那一段临时藏起来。
            const lensClipped = new Set();
            function updateOreLensClip() {
                if (!cinematic.active && !ctaOpen) {
                    for (const node of lensClipped) node.group.visible = true;
                    lensClipped.clear();
                    return;
                }
                for (const node of oreNodes) {
                    const inside = camera.position.y < node.tier.ringHeight + 2.5 &&
                        segmentDistance(node, camera.position) < 3;
                    if (inside === lensClipped.has(node)) continue;
                    node.group.visible = !inside;
                    if (inside) lensClipped.add(node);
                    else lensClipped.delete(node);
                }
            }

            function createCity() {
                city.group = new THREE.Group();
                scene.add(city.group);

                const ghost = new THREE.Mesh(
                    new THREE.CircleGeometry(CITY_STAGES[0].radius, 48),
                    new THREE.MeshBasicMaterial({
                        color: 0x77d4ff,
                        transparent: true,
                        opacity: 0.09,
                        side: THREE.DoubleSide
                    })
                );
                ghost.rotation.x = -Math.PI / 2;
                ghost.position.y = 0.03;
                city.group.add(ghost);
                city.ghost = ghost;

                let previousRadius = 0;
                for (const definition of CITY_STAGES) {
                    city.stages.push(createCityStage(definition, previousRadius));
                    previousRadius = definition.radius;
                }

                city.buildings.keep = createKeep();
                city.buildings.workshop = createWorkshop();
                city.buildings.nest = createNest();
                city.buildings.altar = createAltar();
            }

            function createCityStage(definition, innerRadius) {
                const stage = { definition, props: [], walls: [], houses: [] };

                const floor = new THREE.Mesh(
                    innerRadius > 0
                        ? new THREE.RingGeometry(innerRadius - 0.05, definition.radius, 64)
                        : new THREE.CircleGeometry(definition.radius, 64),
                    shared.cityFloorMat
                );
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = 0.04;
                floor.receiveShadow = true;
                floor.visible = false;
                city.group.add(floor);
                stage.floor = floor;

                const wallGroup = new THREE.Group();
                wallGroup.visible = false;
                city.group.add(wallGroup);
                const blockWidth = 1.45;
                const segments = Math.ceil((Math.PI * 2 * definition.radius) / blockWidth);
                for (let i = 0; i < segments; i++) {
                    const angle = (i / segments) * Math.PI * 2;
                    if (Math.abs(Math.sin(angle * 2)) < 0.3) continue;
                    const merlon = i % 2 === 0;
                    const height = merlon ? 1.72 : 1.24;
                    const block = new THREE.Mesh(shared.box, shared.cityStoneMat);
                    block.scale.set(blockWidth * 1.08, height, 0.78);
                    block.position.set(
                        Math.cos(angle) * definition.radius,
                        height * 0.5,
                        Math.sin(angle) * definition.radius
                    );
                    block.rotation.y = -angle - Math.PI / 2;
                    block.castShadow = true;
                    block.receiveShadow = true;
                    wallGroup.add(block);
                    stage.walls.push(block);
                }
                stage.wallGroup = wallGroup;

                // 角楼原来是 45°/135°/225°/315° 四等分。后两个落在城北，Lv1 时正好是
                // (±4.7,-4.7)，离锄头和孵化台那两张地贴只有一米半——角楼不进碰撞表，
                // 玩家会直接从塔里穿过去。所以把城北那两座沿墙挪到接近正东、正西的位置，
                // 那里已经在广场的横向范围之外（Lv1 时 z=-1.6，刚好在地贴区北界外面）。
                for (const angle of [Math.PI / 4, Math.PI * 0.75, 3.386, 6.039]) {
                    const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.86, 1, 2.5, 8), shared.cityStoneMat);
                    tower.position.set(
                        Math.cos(angle) * definition.radius,
                        1.25,
                        Math.sin(angle) * definition.radius
                    );
                    tower.castShadow = true;
                    wallGroup.add(tower);
                    stage.walls.push(tower);
                    const cap = new THREE.Mesh(new THREE.ConeGeometry(1.1, 1, 8), shared.cityRoofMat);
                    cap.position.copy(tower.position).setY(3);
                    cap.castShadow = true;
                    wallGroup.add(cap);
                    stage.walls.push(cap);
                }

                // 火炬从「沿城墙圆周撒一圈」改成定死在广场里。广场是唯一不许放碰撞体的地方，
                // 填充只能靠竖着占空间、地面几乎不占的东西；火炬本来就不进碰撞表，正好合用。
                // 城南反正堆满了房子，不需要火炬去撑。
                for (const slot of PLAZA_TORCHES[definition.level] || []) {
                    const torch = createTorch();
                    torch.position.set(slot.x, 0, slot.z);
                    torch.visible = false;
                    city.group.add(torch);
                    stage.props.push(torch);
                }

                for (const slot of PLAZA_FLAGS[definition.level] || []) {
                    const flag = createFlagpole(slot.seed);
                    flag.position.set(slot.x, 0, slot.z);
                    flag.visible = false;
                    city.group.add(flag);
                    stage.props.push(flag);
                }

                for (const slot of HOUSE_SLOTS[definition.level] || []) {
                    const house = createHouse(slot.seed);
                    house.position.set(slot.x, 0, slot.z);
                    house.rotation.y = slot.rotation;
                    house.visible = false;
                    city.group.add(house);
                    stage.props.push(house);
                    stage.houses.push(slot);
                }

                return stage;
            }

            function createHouse(seed) {
                const rand = seededRandom(seed);
                const group = new THREE.Group();
                const width = 2 + rand() * 0.9;
                const depth = 1.9 + rand() * 0.8;
                const height = 1.5 + rand() * 0.6;

                const walls = new THREE.Mesh(shared.box, shared.cityTrimMat);
                walls.scale.set(width, height, depth);
                walls.position.y = height * 0.5;
                walls.castShadow = true;
                walls.receiveShadow = true;
                group.add(walls);

                const roof = new THREE.Mesh(new THREE.ConeGeometry(width * 0.82, height * 0.86, 4), shared.cityRoofMat);
                roof.position.y = height + height * 0.4;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                group.add(roof);

                const door = new THREE.Mesh(shared.box, shared.cityStoneMat);
                door.scale.set(width * 0.28, height * 0.6, 0.12);
                door.position.set(0, height * 0.3, depth * 0.52);
                group.add(door);

                const window = new THREE.Mesh(shared.box, new THREE.MeshStandardMaterial({
                    color: 0xffd08a,
                    emissive: 0xd9821f,
                    emissiveIntensity: 0.9
                }));
                window.scale.set(width * 0.2, height * 0.24, 0.1);
                window.position.set(width * 0.28, height * 0.62, depth * 0.52);
                group.add(window);

                return group;
            }

            function createTorch() {
                const group = new THREE.Group();
                const post = new THREE.Mesh(shared.box, shared.cityTrimMat);
                post.scale.set(0.18, 1.5, 0.18);
                post.position.y = 0.75;
                post.castShadow = true;
                group.add(post);
                const flame = new THREE.Mesh(
                    new THREE.ConeGeometry(0.24, 0.62, 8),
                    new THREE.MeshBasicMaterial({ color: 0xffab3c, transparent: true, opacity: 0.92 })
                );
                flame.position.y = 1.75;
                group.add(flame);
                group.userData.flame = flame;
                return group;
            }

            // 广场只能靠不带碰撞的东西填。而且竖屏下水平视野只有玩家左右九米上下，
            // 清空区又要求房子退到 |x|≥9.5 之外——两侧那排民房在竖屏里其实进不了画面。
            // 所以真正撑住画面中心的是这个：四米六高的旗杆，地面只占一个点，
            // 俯视下却是画面里唯一有高度的东西（火炬只有两米，太矮了看不出来）。
            function createFlagpole(seed) {
                const rand = seededRandom(seed);
                const group = new THREE.Group();
                const height = 4.2 + rand() * 0.9;

                const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, height, 6), shared.cityTrimMat);
                pole.position.y = height * 0.5;
                pole.castShadow = true;
                group.add(pole);

                const flag = new THREE.Mesh(
                    new THREE.PlaneGeometry(1.2, 0.74),
                    new THREE.MeshStandardMaterial({ color: 0xd0473a, side: THREE.DoubleSide, roughness: 0.82 })
                );
                flag.position.set(0.64, height - 0.66, 0);
                flag.castShadow = true;
                group.add(flag);

                const finial = new THREE.Mesh(new THREE.SphereGeometry(0.14, 8, 6), shared.cityRoofMat);
                finial.position.y = height + 0.08;
                group.add(finial);

                group.rotation.y = rand() * Math.PI * 2;
                return group;
            }

            function createKeep() {
                const slot = BUILDING_SLOTS.keep;
                const group = new THREE.Group();
                group.position.set(slot.x, 0, slot.z);
                group.visible = false;
                city.group.add(group);

                const base = new THREE.Mesh(shared.box, shared.cityStoneMat);
                base.scale.set(3.6, 2.4, 3.6);
                base.position.y = 1.2;
                base.castShadow = true;
                group.add(base);

                const tower = new THREE.Mesh(new THREE.CylinderGeometry(1.15, 1.35, 3.2, 10), shared.cityStoneMat);
                tower.position.y = 3.7;
                tower.castShadow = true;
                tower.visible = false;
                group.add(tower);

                const roof = new THREE.Mesh(new THREE.ConeGeometry(1.7, 1.7, 10), shared.cityRoofMat);
                roof.position.y = 6.1;
                roof.castShadow = true;
                roof.visible = false;
                group.add(roof);

                const banner = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.9, 1.3),
                    new THREE.MeshStandardMaterial({ color: 0xd0473a, side: THREE.DoubleSide, roughness: 0.8 })
                );
                banner.position.set(0, 3.6, 1.42);
                banner.visible = false;
                group.add(banner);
                group.userData.banner = banner;

                // 主堡分三段随等级长上去。原先 Lv1 就把六米九的完整塔一次立完，
                // 之后三次升级主城，玩家看到的变化只剩地板往外扩一圈——那是最弱的成长表达。
                // 拆成逐级出现之后不用改建模、不占额外地面，动线也不受影响。
                group.userData.parts = [base];
                group.userData.growth = { 2: [tower], 3: [roof] };
                return group;
            }

            function createWorkshop() {
                const slot = BUILDING_SLOTS.workshop;
                const group = new THREE.Group();
                group.position.set(slot.x, 0, slot.z);
                group.visible = false;
                city.group.add(group);

                const hut = new THREE.Mesh(shared.box, shared.cityTrimMat);
                hut.scale.set(2.4, 1.7, 2.2);
                hut.position.y = 0.85;
                hut.castShadow = true;
                group.add(hut);

                const roof = new THREE.Mesh(new THREE.ConeGeometry(1.9, 1.2, 4), shared.cityRoofMat);
                roof.position.y = 2.3;
                roof.rotation.y = Math.PI / 4;
                roof.castShadow = true;
                group.add(roof);

                const anvil = new THREE.Mesh(shared.box, new THREE.MeshStandardMaterial({
                    color: 0x3a3a46,
                    metalness: 0.6,
                    roughness: 0.4
                }));
                anvil.scale.set(0.9, 0.5, 0.5);
                anvil.position.set(-1.7, 0.35, 0.9);
                anvil.castShadow = true;
                group.add(anvil);

                group.userData.parts = [hut, roof, anvil];
                return group;
            }

            function createNest() {
                const slot = BUILDING_SLOTS.nest;
                const group = new THREE.Group();
                group.position.set(slot.x, 0, slot.z);
                group.visible = false;
                city.group.add(group);

                const platform = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.85, 0.5, 14), shared.cityStoneMat);
                platform.position.y = 0.25;
                platform.receiveShadow = true;
                group.add(platform);

                const bowl = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.32, 8, 18), shared.cityTrimMat);
                bowl.rotation.x = Math.PI / 2;
                bowl.position.y = 0.62;
                bowl.castShadow = true;
                group.add(bowl);

                const glow = new THREE.Mesh(
                    new THREE.CircleGeometry(1.05, 20),
                    new THREE.MeshBasicMaterial({ color: 0xc08bff, transparent: true, opacity: 0.28 })
                );
                glow.rotation.x = -Math.PI / 2;
                glow.position.y = 0.53;
                group.add(glow);

                group.userData.parts = [platform, bowl];
                group.userData.glow = glow;
                city.nestPos.set(slot.x, 0.9, slot.z);
                return group;
            }

            function createAltar() {
                const slot = BUILDING_SLOTS.altar;
                const group = new THREE.Group();
                group.position.set(slot.x, 0, slot.z);
                group.visible = false;
                city.group.add(group);

                const base = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.95, 0.6, 16), shared.cityStoneMat);
                base.position.y = 0.3;
                base.receiveShadow = true;
                group.add(base);

                const pillars = [];
                for (let i = 0; i < 4; i++) {
                    const angle = (i / 4) * Math.PI * 2 + 0.4;
                    const pillar = new THREE.Mesh(shared.box, shared.cityStoneMat);
                    pillar.scale.set(0.3, 2.1, 0.3);
                    pillar.position.set(Math.cos(angle) * 1.35, 1.35, Math.sin(angle) * 1.35);
                    pillar.castShadow = true;
                    group.add(pillar);
                    group.userData[`pillar${i}`] = pillar;
                    pillars.push(pillar);
                }

                const core = new THREE.Mesh(
                    new THREE.OctahedronGeometry(0.62),
                    new THREE.MeshStandardMaterial({ color: 0x66f0d0, emissive: 0x0f7f6a, emissiveIntensity: 1.1 })
                );
                core.position.y = 1.85;
                group.add(core);
                group.userData.core = core;
                group.userData.parts = [base, ...pillars, core];
                city.altarPos.set(slot.x, 1.2, slot.z);
                return group;
            }

            function buildCityStage(level) {
                const stage = city.stages[level - 1];
                if (!stage || stage.built) return;
                stage.built = true;

                stage.floor.visible = true;
                animateFloorReveal(stage.floor);

                if (level > 1) {
                    const previous = city.stages[level - 2];
                    if (previous && previous.wallGroup.visible) {
                        previous.walls.forEach((wall, index) => animateChunkSink(wall, index * 0.012));
                        setTimeout(() => { previous.wallGroup.visible = false; }, 420);
                    }
                }

                stage.wallGroup.visible = true;
                stage.walls.forEach((wall, index) => animateChunkRise(wall, index * CONFIG.citySideStagger * 0.35));
                stage.props.forEach((prop, index) => {
                    prop.visible = true;
                    animateChunkRise(prop, 0.12 + index * 0.06);
                });
                for (const slot of stage.houses) addSolidCollider(slot.x, slot.z, 1.35);

                if (level === 1) {
                    city.buildings.keep.visible = true;
                    city.buildings.keep.userData.parts.forEach((part, index) => animateChunkRise(part, 0.1 + index * 0.09));
                    addSolidCollider(BUILDING_SLOTS.keep.x, BUILDING_SLOTS.keep.z, BUILDING_SLOTS.keep.radius);
                }
                const grown = city.buildings.keep.userData.growth[level];
                if (grown) {
                    grown.forEach((part, index) => {
                        part.visible = true;
                        animateChunkRise(part, 0.16 + index * 0.09);
                    });
                }
                if (level === 2) {
                    city.buildings.workshop.visible = true;
                    city.buildings.workshop.userData.parts.forEach((part, index) => animateChunkRise(part, 0.14 + index * 0.08));
                    addSolidCollider(BUILDING_SLOTS.workshop.x, BUILDING_SLOTS.workshop.z, BUILDING_SLOTS.workshop.radius);
                }
                if (level === 3) {
                    city.buildings.nest.visible = true;
                    city.buildings.nest.userData.parts.forEach((part, index) => animateChunkRise(part, 0.14 + index * 0.08));
                    addSolidCollider(BUILDING_SLOTS.nest.x, BUILDING_SLOTS.nest.z, BUILDING_SLOTS.nest.radius);
                }
                if (level === 4) {
                    city.buildings.altar.visible = true;
                    city.buildings.altar.userData.parts.forEach((part, index) => animateChunkRise(part, 0.14 + index * 0.08));
                    city.buildings.keep.userData.banner.visible = true;
                    addSolidCollider(BUILDING_SLOTS.altar.x, BUILDING_SLOTS.altar.z, BUILDING_SLOTS.altar.radius);
                }

                shared.cityLight.intensity = 0.6 + level * 0.42;
                shared.cityLight.distance = 16 + level * 5;
                nudgePlayerOutOfCollision();
            }

            function nudgePlayerOutOfCollision() {
                const safe = resolveCirclePosition(player.position, player.position.clone(), CONFIG.playerRadius);
                if (flatDistance(safe, player.position) > 0.001) {
                    player.position.copy(safe);
                    moveVelocity.set(0, 0, 0);
                }
            }

            function animateFloorReveal(floor) {
                floor.scale.set(0.2, 0.2, 0.2);
                effects.push({ type: "floorReveal", mesh: floor, life: 0.5, maxLife: 0.5 });
            }

            function animateChunkRise(object, delay = 0) {
                object.userData.riseBaseY = object.userData.riseBaseY ?? object.position.y;
                object.position.y = object.userData.riseBaseY - CONFIG.cityRiseDepth;
                effects.push({
                    type: "rise",
                    mesh: object,
                    delay,
                    life: CONFIG.cityRiseDuration,
                    maxLife: CONFIG.cityRiseDuration,
                    baseY: object.userData.riseBaseY
                });
            }

            function animateChunkSink(object, delay = 0) {
                effects.push({
                    type: "sink",
                    mesh: object,
                    delay,
                    life: 0.28,
                    maxLife: 0.28,
                    baseY: object.position.y
                });
            }

            function createTileTexture() {
                const canvas = document.createElement("canvas");
                canvas.width = canvas.height = 192;
                const texture = new THREE.CanvasTexture(canvas);
                texture.anisotropy = 4;
                return { canvas, context: canvas.getContext("2d"), texture };
            }

            function drawTile(zone, ready) {
                const context = zone.tileContext;
                const size = 192;
                context.clearRect(0, 0, size, size);
                const definition = TILE_DEFS[zone.id];
                const accent = ready ? "#7bf0a8" : "#ffffff";

                context.fillStyle = "rgba(10, 8, 20, 0.62)";
                roundRectPath(context, 10, 10, size - 20, size - 20, 18);
                context.fill();

                context.strokeStyle = accent;
                context.lineWidth = 5;
                context.setLineDash([16, 11]);
                roundRectPath(context, 10, 10, size - 20, size - 20, 18);
                context.stroke();
                context.setLineDash([]);

                // 升级锄头的地贴用「升级后能开采的那层矿」的颜色，和手里的锄头共用同一套颜色语义。
                const iconColor = zone.id === "pickaxe" ? pickaxeTier(pickaxeLevel + 1).glow : definition.color;
                drawTileIcon(context, definition.icon, `#${iconColor.toString(16).padStart(6, "0")}`);

                // 价格前面的货币标记：圆形金币 / 方形钻石 / 尖角菱形宝石。地贴是玩家判断
                // 「该攒哪种钱」的唯一入口，光换数字不换形状会让人一路攒错。
                const currency = tileCurrency(zone.id);
                const grade = tileShardGrade(zone.id);
                if (currency === "shard" && grade) {
                    // 宝石还要再读出品质，所以形状之外颜色也跟着换——地贴上这颗的颜色
                    // 必须和矿墙里埋着的那颗、以及 HUD 上那颗完全一致，三处对不上就白做了。
                    context.fillStyle = SHARD_GRADES[grade].css;
                    context.beginPath();
                    context.moveTo(66, 133);
                    context.lineTo(79, 145);
                    context.lineTo(66, 164);
                    context.lineTo(53, 145);
                    context.closePath();
                    context.fill();
                } else if (currency === "gem") {
                    context.fillStyle = "#5fe6ff";
                    context.save();
                    context.translate(66, 148);
                    context.rotate(Math.PI / 4);
                    context.fillRect(-10, -10, 20, 20);
                    context.restore();
                } else {
                    context.fillStyle = "#ffd23c";
                    context.beginPath();
                    context.arc(66, 148, 13, 0, Math.PI * 2);
                    context.fill();
                    context.fillStyle = "#8a5b00";
                    context.font = "bold 16px Arial";
                    context.textAlign = "center";
                    context.textBaseline = "middle";
                    context.fillText("$", 66, 149);
                }

                context.fillStyle = "#ffffff";
                context.font = "bold 30px Arial";
                context.textAlign = "left";
                context.fillText(`${zone.paid}/${zone.cost}`, 86, 149);

                zone.tileTexture.needsUpdate = true;
            }

            function roundRectPath(context, x, y, width, height, radius) {
                context.beginPath();
                context.moveTo(x + radius, y);
                context.lineTo(x + width - radius, y);
                context.quadraticCurveTo(x + width, y, x + width, y + radius);
                context.lineTo(x + width, y + height - radius);
                context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                context.lineTo(x + radius, y + height);
                context.quadraticCurveTo(x, y + height, x, y + height - radius);
                context.lineTo(x, y + radius);
                context.quadraticCurveTo(x, y, x + radius, y);
                context.closePath();
            }

            function drawTileIcon(context, icon, color) {
                context.save();
                context.translate(96, 78);
                context.strokeStyle = color;
                context.fillStyle = color;
                context.lineWidth = 7;
                context.lineJoin = "round";
                context.lineCap = "round";

                if (icon === "city") {
                    context.beginPath();
                    context.moveTo(-34, 18);
                    context.lineTo(-34, -6);
                    context.lineTo(-14, -6);
                    context.lineTo(-14, -22);
                    context.lineTo(14, -22);
                    context.lineTo(14, -6);
                    context.lineTo(34, -6);
                    context.lineTo(34, 18);
                    context.closePath();
                    context.stroke();
                    context.fillRect(-6, 0, 12, 18);
                } else if (icon === "pickaxe") {
                    context.beginPath();
                    context.moveTo(-30, -18);
                    context.quadraticCurveTo(0, -34, 30, -18);
                    context.stroke();
                    context.beginPath();
                    context.moveTo(-14, -10);
                    context.lineTo(16, 22);
                    context.stroke();
                } else if (icon === "egg") {
                    context.beginPath();
                    context.ellipse(0, -2, 19, 25, 0, 0, Math.PI * 2);
                    context.stroke();
                    context.beginPath();
                    context.moveTo(-26, 22);
                    context.quadraticCurveTo(0, 34, 26, 22);
                    context.stroke();
                } else if (icon === "evolve") {
                    context.beginPath();
                    context.moveTo(0, -30);
                    context.lineTo(20, 4);
                    context.lineTo(8, 4);
                    context.lineTo(8, 26);
                    context.lineTo(-8, 26);
                    context.lineTo(-8, 4);
                    context.lineTo(-20, 4);
                    context.closePath();
                    context.stroke();
                } else if (icon === "seal") {
                    // 一道竖着的裂缝。画成折线而不是闭合形状：地贴上其余四个图标都是
                    // 「一件东西」，这一个是「一道口子」，轮廓封起来就读成石头而不是裂开。
                    context.beginPath();
                    context.moveTo(-6, -30);
                    context.lineTo(7, -12);
                    context.lineTo(-5, 2);
                    context.lineTo(9, 16);
                    context.lineTo(-2, 30);
                    context.stroke();
                    context.lineWidth = 4;
                    context.beginPath();
                    context.moveTo(-24, -16);
                    context.lineTo(-11, -6);
                    context.stroke();
                    context.beginPath();
                    context.moveTo(24, 6);
                    context.lineTo(11, 14);
                    context.stroke();
                }
                context.restore();
            }

            function createZone(id, cost, onComplete) {
                const slot = TILE_SLOTS[id];
                const { canvas, context, texture } = createTileTexture();
                const group = new THREE.Group();
                group.position.set(slot.x, 0, slot.z);
                scene.add(group);

                const base = new THREE.Mesh(
                    new THREE.PlaneGeometry(CONFIG.zoneTileSize * 1.06, CONFIG.zoneTileSize * 1.06),
                    new THREE.MeshBasicMaterial({
                        color: 0x0a0814,
                        transparent: true,
                        opacity: 0.55,
                        depthWrite: false
                    })
                );
                base.rotation.x = -Math.PI / 2;
                base.position.y = 0.06;
                group.add(base);

                const tile = new THREE.Mesh(
                    new THREE.PlaneGeometry(CONFIG.zoneTileSize, CONFIG.zoneTileSize),
                    new THREE.MeshBasicMaterial({
                        map: texture,
                        transparent: true,
                        depthWrite: false
                    })
                );
                tile.rotation.x = -Math.PI / 2;
                tile.position.y = 0.08;
                group.add(tile);

                const zone = {
                    id,
                    cost,
                    paid: 0,
                    group,
                    base,
                    tile,
                    tileCanvas: canvas,
                    tileContext: context,
                    tileTexture: texture,
                    position: group.position.clone(),
                    paymentTimer: 0,
                    pulse: 0,
                    requiresReentry: isPlayerInsideZonePosition(group.position),
                    locked: false,
                    complete: false,
                    onComplete
                };
                drawTile(zone, false);
                zones.push(zone);
                return zone;
            }

            function showTile(id) {
                let zone = zones.find(item => item.id === id);
                if (zone) {
                    zone.group.visible = true;
                    return zone;
                }
                zone = createZone(id, resolveTileCost(id), () => completeTile(id));
                return zone;
            }

            function resolveTileCost(id) {
                if (id === "city-build") return CITY_STAGES[0].cost;
                if (id === "city-upgrade") {
                    const next = CITY_STAGES[cityLevel];
                    return next ? next.cost : 0;
                }
                if (id === "pickaxe") return ECON.pickaxeCost[pickaxeLevel - 1] || 0;
                if (id === "hatchery") return ECON.hatcheryCost;
                if (id === "evolve") return ECON.evolveCost;
                if (id === "seal") return ECON.sealOffering ? ECON.sealOffering.cost : 0;
                return 0;
            }

            // 货币不存在 zone 上：它由地贴种类唯一决定，存一份就多一份要同步的状态。
            function tileCurrency(id) {
                if (id === "pickaxe") return ECON.pickaxeCurrency;
                if (id === "hatchery") return ECON.hatcheryCurrency || "coin";
                if (id === "evolve") return ECON.evolveCurrency;
                return "coin";
            }

            // 当前这次锄头升级要收哪一档宝石：Lv1→Lv2 收 TIER_ORDER[0]（低级矿产的那档），
            // 也就是「手上这把锄头能挖的那层矿，产的正好是买下一把要用的宝石」。
            //
            // 满级后返回空。这个判断必须走 pickaxeCost 的长度而不是 PICKAXE_LEVELS：
            // 表里有四级，但能买到第几级是按版本定的，A 版只到三级。按表长判的话
            // TIER_ORDER[3] 会落到封印矿，而那一层没有对应品质，SHARD_GRADES 查出来是 undefined。
            function requiredShardGrade() {
                const levels = ECON.pickaxeCost ? ECON.pickaxeCost.length : 0;
                if (pickaxeLevel > levels) return null;
                const id = TIER_ORDER[pickaxeLevel - 1];
                return id && SHARD_GRADES[id] ? id : null;
            }

            // grade 只在 currency === "shard" 时有意义；省略时取当前锄头要收的那一档。
            function walletOf(currency, grade) {
                if (currency === "gem") return gems;
                if (currency !== "shard") return coins;
                const id = grade || requiredShardGrade();
                return id ? (shards[id] || 0) : 0;
            }

            function tileShardGrade(id) {
                return id === "pickaxe" ? requiredShardGrade() : null;
            }

            function removeZone(zone) {
                scene.remove(zone.group);
                const index = zones.indexOf(zone);
                if (index >= 0) zones.splice(index, 1);
            }

            function resetZone(zone, cost) {
                zone.paid = 0;
                zone.cost = cost;
                zone.complete = false;
                zone.paymentTimer = 0;
                zone.requiresReentry = true;
                drawTile(zone, false);
            }

            function completeTile(id) {
                markRun(id === "city-upgrade" ? `city-${cityLevel + 1}` : id);
                if (id === "city-build") {
                    completeCityBuild();
                } else if (id === "city-upgrade") {
                    completeCityUpgrade();
                } else if (id === "pickaxe") {
                    completePickaxe();
                } else if (id === "hatchery") {
                    completeHatchery();
                } else if (id === "evolve") {
                    completeEvolve();
                } else if (id === "seal") {
                    completeSeal();
                }
            }

            function completeCityBuild() {
                cityLevel = 1;
                if (city.ghost) city.ghost.visible = false;
                buildCityStage(1);
                playSound("upgrade");
                const zone = zones.find(item => item.id === "city-build");
                if (zone) removeZone(zone);
                showTile("city-upgrade");
                updateUI();
                toast("主城建成，去矿区赚取金币");
                setTutorial(false);
                tutorialDone = true;
                revealTierRing("low");
            }

            function completeCityUpgrade() {
                const stage = CITY_STAGES[cityLevel];
                cityLevel += 1;
                buildCityStage(cityLevel);
                playSound("upgrade");
                if (stage && stage.unlock) {
                    showTile(stage.unlock);
                    toast(unlockCopy(stage.unlock));
                    if (stage.unlock === "hatchery") ensureEggAvailability();
                } else {
                    toast(`主城升级到 Lv.${cityLevel}`);
                }
                const zone = zones.find(item => item.id === "city-upgrade");
                if (zone) {
                    if (cityLevel >= CITY_STAGES.length) removeZone(zone);
                    else resetZone(zone, resolveTileCost("city-upgrade"));
                }
                updateUI();
            }

            function unlockCopy(id) {
                if (id === "pickaxe") return "主城扩张，解锁升级锄头";
                if (id === "hatchery") return "主城扩张，解锁孵化台";
                if (id === "evolve") return "主城扩张，解锁宠物进化";
                return "主城扩张";
            }

            // 锄头等级对应它能凿开的最高矿等级，颜色也直接沿用那一层矿：绿=低级矿、紫=中级矿、橙=高级矿。
            // 封印矿要排除掉：地贴图标问的是 pickaxeTier(pickaxeLevel + 1)，满级时那就是第四级，
            // 照着表往下找会摸到封印矿，等于用它的金色向玩家预告一把根本不存在的锄头。
            function pickaxeTier(level) {
                for (let i = TIER_ORDER.length - 1; i >= 0; i--) {
                    const tier = ORE_TIERS[TIER_ORDER[i]];
                    if (tier.sealed) continue;
                    if (level >= tier.requiredPickaxe) return tier;
                }
                return ORE_TIERS[TIER_ORDER[0]];
            }

            function applyPickaxeAppearance() {
                const tier = pickaxeTier(pickaxeLevel);
                const head = playerWeapon.userData.head;
                // Lv1 保持初始体积，升级后才随等级变大。
                const grow = pickaxeLevel > 1 ? pickaxeLevel : 0;
                head.scale.set(0.72 + grow * 0.13, 0.2 + grow * 0.04, 0.24 + grow * 0.05);
                head.material.color.setHex(tier.color);
                head.material.emissive.setHex(tier.emissive);
                return tier;
            }

            function completePickaxe() {
                pickaxeLevel = Math.min(PICKAXE_LEVELS.length, pickaxeLevel + 1);

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Wreck It King - 火焰巨龙</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #090712;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; }
        .nipple .back { opacity: 0.22 !important; }
        .nipple .front { opacity: 0.58 !important; }
        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 12000;
        }
        #player-hud {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: 14px;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 12px 7px 7px;
            color: white;
            background: rgba(8, 7, 18, 0.72);
            border: 1px solid rgba(115, 210, 255, 0.55);
            border-radius: 34px 12px 12px 34px;
            backdrop-filter: blur(5px);
        }
        #portrait {
            position: relative;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 3px solid #63d7ff;
            background: radial-gradient(circle at 50% 35%, #65c9ff 0 20%, #152e72 22% 52%, #07122f 54%);
            box-shadow: 0 0 14px rgba(64, 201, 255, 0.7);
        }
        #portrait::after {
            content: "";
            position: absolute;
            left: 11px;
            right: 11px;
            bottom: 5px;
            height: 19px;
            border-radius: 50% 50% 35% 35%;
            background: #1e6fa0;
        }
        #hud-info { min-width: 92px; }
        #power {
            font-size: 23px;
            line-height: 25px;
            font-weight: 900;
            text-shadow: 0 0 10px #7bdfff;
        }
        #power-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #98cbe1;
        }
        #hp-track {
            width: 96px;
            height: 6px;
            margin-top: 4px;
            border-radius: 5px;
            overflow: hidden;
            background: rgba(255,255,255,0.18);
        }
        #hp-fill {
            width: 100%;
            height: 100%;
            background: #58e486;
            transition: width 0.2s;
        }
        #coin-hud {
            position: fixed;
            top: max(19px, env(safe-area-inset-top));
            right: 14px;
            min-width: 112px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 0 14px;
            color: white;
            font-size: 25px;
            font-weight: 900;
            background: rgba(8, 7, 18, 0.78);
            border: 1px solid rgba(255, 197, 50, 0.4);
            border-radius: 22px 8px 8px 22px;
        }
        .coin-icon {
            width: 27px;
            height: 27px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #a35d00;
            font-size: 17px;
            background: #ffd339;
            border: 3px solid #ffed8a;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 196, 0, 0.7);
        }
        #city-hud {
            position: fixed;
            top: max(68px, calc(env(safe-area-inset-top) + 54px));
            right: 14px;
            padding: 5px 13px;
            color: #ffd9a8;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            background: rgba(8, 7, 18, 0.6);
            border: 1px solid rgba(255, 170, 80, 0.35);
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.25s;
        }
        #city-hud.show { opacity: 1; }
        #boss-hud {
            position: absolute;
            top: max(calc(11vh + 18px), calc(env(safe-area-inset-top) + 92px));
            left: 50%;
            width: min(82vw, 520px);
            transform: translateX(-50%);
            display: none;
            text-align: center;
            color: white;
            text-shadow: 0 2px 4px black;
        }
        #boss-name { font-family: Georgia, serif; font-size: 24px; font-weight: 900; }
        #boss-title { margin: 2px 0 5px; font-size: 11px; color: #f0c9b4; }
        #boss-level { position: absolute; left: 0; bottom: 10px; font-weight: 900; }
        #boss-bar {
            position: relative;
            height: 17px;
            margin-left: 52px;
            overflow: hidden;
            background: #1a111c;
            border: 2px solid rgba(255,255,255,0.65);
            border-radius: 10px;
        }
        #boss-fill {
            width: 100%;
            height: 100%;
            background: #d91d35;
            transition: width 0.15s;
        }
        #boss-hp-text {
            position: absolute;
            inset: 0;
            font-size: 12px;
            font-weight: 700;
            line-height: 17px;
        }
        #tutorial {
            position: fixed;
            left: 50%;
            bottom: 17vh;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.35s;
        }
        #tutorial-ring {
            position: relative;
            width: 86px;
            height: 86px;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.55);
        }
        #tutorial-hand {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 26px;
            height: 26px;
            margin: -13px 0 0 -13px;
            border-radius: 50% 50% 50% 12%;
            background: rgba(255,255,255,0.92);
            box-shadow: 0 0 14px rgba(255,255,255,0.6);
            animation: handHint 1.7s ease-in-out infinite;
        }
        @keyframes handHint {
            0% { transform: translate(0, 22px) scale(0.92); opacity: 0.35; }
            45% { transform: translate(0, -20px) scale(1); opacity: 1; }
            100% { transform: translate(0, 22px) scale(0.92); opacity: 0.35; }
        }
        #tutorial-copy {
            padding: 7px 16px;
            color: white;
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            background: rgba(8, 7, 18, 0.72);
            border-radius: 18px;
        }
        #toast {
            position: fixed;
            left: 50%;
            top: max(28vh, 190px);
            padding: 9px 20px;
            color: white;
            font-size: 15px;
            font-weight: 700;
            white-space: nowrap;
            background: rgba(8, 7, 18, 0.8);
            border: 1px solid rgba(255,255,255,0.16);
            border-radius: 20px;
            transform: translate(-50%, -8px);
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
        }
        #toast.show { opacity: 1; transform: translate(-50%, 0); }
        #tile-hint {
            position: fixed; left: 50%; bottom: max(82px, 10vh);
            transform: translateX(-50%); width: max-content; max-width: min(82vw, 380px);
            box-sizing: border-box; padding: 10px 15px; border-radius: 12px;
            background: rgba(17, 15, 30, 0.92); border: 1px solid #b29b62;
            color: #ffe3a3; font-size: 14px; font-weight: 700; line-height: 1.5;
            text-align: center; pointer-events: none;
        }
        #block-donate { position:fixed; right:16px; bottom:90px; max-width:270px; padding:12px 18px;
            border:1px solid #ffe09a; border-radius:14px; background:#594026; color:#ffe9b2;
            font:700 15px/1.5 sans-serif; white-space:pre-line; pointer-events:auto; cursor:pointer; }
        #block-donate:disabled { opacity:.7; cursor:default; }
        #guide-arrow {
            position: fixed;
            left: 50%;
            top: 50%;
            display: none;
            color: #ffd54a;
            font-size: 30px;
            text-shadow: 0 0 12px rgba(255, 190, 40, 0.9);
            transform: translate(-50%, -50%);
        }
        #labels, #damage-layer {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .damage {
            position: absolute;
            color: white;
            font-size: 19px;
            font-weight: 900;
            text-shadow: 0 2px 5px rgba(0,0,0,0.85);
            transform: translate(-50%, -50%);
            animation: floatUp 0.75s ease-out forwards;
        }
        .damage.big { font-size: 29px; color: #ffe14d; }
        .damage.gold {
            font-size: 34px;
            color: #ffd23c;
            text-shadow: 0 0 14px rgba(255, 176, 40, 0.9), 0 3px 6px rgba(0,0,0,0.9);
            animation: goldPop 1.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        /* 闪避不是伤害数字，是一句表扬。用玩家攻击弧光的青白色，和黄色的伤害、
           金色的结算分开；弹一下就走，不能压住紧接着的输出画面。 */
        .damage.perfect {
            font-size: 22px;
            color: #bdf3ff;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(125, 220, 255, 0.9), 0 2px 5px rgba(0,0,0,0.9);
            animation: perfectPop 0.62s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        /* 换档提示。橙红配眼睛烧起来的颜色，和青白的「闪避」分处冷暖两端——
           这两条字会在同一场战斗里交替出现，一个是奖励一个是警告，不能看混。 */
        .damage.frenzy {
            font-size: 21px;
            color: #ff7a3c;
            letter-spacing: 2px;
            text-shadow: 0 0 13px rgba(255, 90, 42, 0.95), 0 2px 5px rgba(0,0,0,0.9);
            animation: perfectPop 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes perfectPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.55); }
            22% { opacity: 1; transform: translate(-50%, -88%) scale(1.28); }
            48% { transform: translate(-50%, -104%) scale(1.02); }
            100% { opacity: 0; transform: translate(-50%, -168%) scale(1); }
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.7); }
            30% { transform: translate(-50%, -95%) scale(1.15); }
            100% { opacity: 0; transform: translate(-50%, -190%) scale(1); }
        }
        /* 金币总额比伤害数字停得久、弹得狠：它是一次横扫的结算，不是一次挥锄的反馈。 */
        @keyframes goldPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            18% { opacity: 1; transform: translate(-50%, -80%) scale(1.45); }
            34% { transform: translate(-50%, -92%) scale(1.1); }
            72% { opacity: 1; transform: translate(-50%, -128%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -190%) scale(0.95); }
        }
        /* 数字每跳一次就顶一下。连着进账时这一下会不停被打断重放，读起来就是「还在涨」。 */
        #coin-hud.pop { animation: coinPop 0.22s ease-out; }
        @keyframes coinPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.16); border-color: rgba(255, 226, 130, 0.95); }
            100% { transform: scale(1); }
        }
        #gem-hud {
            position: fixed;
            top: max(68px, calc(env(safe-area-inset-top) + 49px));
            right: 14px;
            min-width: 112px;
            height: 36px;
            display: none;
            align-items: center;
            justify-content: flex-end;
            gap: 9px;
            padding: 0 14px;
            color: white;
            font-size: 21px;
            font-weight: 900;
            background: rgba(8, 7, 18, 0.78);
            border: 1px solid rgba(95, 230, 255, 0.45);
            border-radius: 22px 8px 8px 22px;
        }
        /* 这两条原先挂在 body.econ-gem 下（纯金币版整条不存在），版本删掉之后改成常开。
           特意留在这个位置而不是并进上面的块：靠源码顺序压过前面的 display:none
           和 #city-hud 的默认 top，挪到前面去就全都不生效了。 */
        #gem-hud.revealed { display: flex; }
        #city-hud { top: max(156px, calc(env(safe-area-inset-top) + 147px)); }
        /* 宝石。只显示当前锄头要收的那一档，颜色跟着品质走（内联样式，见 updateUI），
           所以这里不写死颜色；锄头满级后整条隐藏（.spent）。 */
        #shard-hud {
            position: fixed;
            top: max(112px, calc(env(safe-area-inset-top) + 98px));
            right: 14px;
            min-width: 112px;
            height: 36px;
            display: none;
            align-items: center;
            justify-content: flex-end;
            gap: 9px;
            padding: 0 14px;
            color: white;
            font-size: 21px;
            font-weight: 900;
            background: rgba(8, 7, 18, 0.78);
            border: 1px solid rgba(120, 220, 180, 0.45);
            border-radius: 22px 8px 8px 22px;
        }
        #shard-hud.revealed { display: flex; }
        #shard-hud.spent { display: none; }
        /* 满级后这条收起来，主城行跟着回到钻石行下面，免得中间空一格。 */
        #shard-hud.spent ~ #city-hud { top: max(112px, calc(env(safe-area-inset-top) + 98px)); }
        .shard-icon {
            width: 19px;
            height: 19px;
            /* 菱形。金币是圆的、钻石是转 45 度的方块（带圆角），宝石这颗用尖角切出来的
               细长菱形——三种货币的剪影必须在俯视小图标下也分得开，颜色只是第二道保险。 */
            clip-path: polygon(50% 0%, 100% 38%, 50% 100%, 0% 38%);
            background: #4ff0bb;
        }
        #shard-hud.pop { animation: gemPop 0.26s ease-out; }
        .gem-icon {
            width: 21px;
            height: 21px;
            /* 转 45 度的方块。金币是圆的，两者的剪影得一眼分得开，不能只靠颜色 */
            clip-path: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
            background: #5fe6ff;
            border: 3px solid #b6f4ff;
            border-radius: 5px;
            box-shadow: 0 0 11px rgba(95, 230, 255, 0.75);
        }
        #gem-hud.pop { animation: gemPop 0.26s ease-out; }
        @keyframes gemPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.2); border-color: rgba(180, 245, 255, 0.98); }
            100% { transform: scale(1); }
        }
        #egg-lock {
            position: fixed;
            left: 0;
            top: 0;
            width: 72px;
            height: 72px;
            margin: -36px 0 0 -36px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #egg-lock.show { opacity: 1; }
        #egg-lock svg { width: 100%; height: 100%; transform: rotate(-90deg); }
        .egg-lock-track { fill: rgba(8,7,18,0.55); stroke: rgba(255,255,255,0.28); stroke-width: 5; }
        .egg-lock-bar {
            fill: none;
            stroke: #ffd54a;
            stroke-width: 5;
            stroke-linecap: round;
            stroke-dasharray: 175.93;
            stroke-dashoffset: 175.93;
            transition: stroke-dashoffset 0.08s linear;
        }
        .egg-lock-core { fill: rgba(255, 213, 74, 0.16); }
        #egg-lock.charging .egg-lock-core { fill: rgba(255, 213, 74, 0.3); }
        /* 蛋头上的名牌。做成 #egg-lock 的子元素而不是另一个 fixed 层，是为了白拿
           那枚锁形环已经验过的两件事：屏幕投影定位，和出画/拾取时的隐藏——
           父元素的内联 opacity 会一起盖住它，不用再写一份同步逻辑。
           bottom:100% 把它顶到环的上方，也就是「蛋头上」。 */
        #egg-tip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            margin-bottom: 7px;
            padding: 5px 12px;
            /* 竖屏窄，两行叠起来比一行长句更好读 */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            white-space: nowrap;
            background: rgba(8, 7, 18, 0.78);
            border: 1px solid rgba(200, 139, 255, 0.5);
            border-radius: 13px;
            transform: translateX(-50%);
        }
        /* 紫色和蛋壳、和拾取时的爆点（0xc08bff）对上；环是黄的，管的是进度，两件事分开 */
        #egg-tip b { color: #d8b4ff; font-size: 13px; font-weight: 900; letter-spacing: 1px; }
        #egg-tip span { color: rgba(255,255,255,0.82); font-size: 11px; font-weight: 700; }
        #restart {
            position: fixed;
            right: 12px;
            bottom: 12px;
            padding: 8px 14px;
            color: white;
            font-size: 12px;
            background: rgba(78, 42, 120, 0.85);
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 10px;
            pointer-events: auto;
            cursor: pointer;
        }
        /* 调参面板，上线时随调试钩子一起摘掉 */
        #tuner-toggle {
            position: fixed;
            left: 12px;
            bottom: max(12px, env(safe-area-inset-bottom));
            padding: 8px 14px;
            color: #cfeaff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            background: rgba(8, 7, 18, 0.82);
            border: 1px solid rgba(115, 210, 255, 0.5);
            border-radius: 10px;
            pointer-events: auto;
            cursor: pointer;
            z-index: 30;
        }
        #tuner {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            width: min(360px, 94vw);
            display: flex;
            flex-direction: column;
            color: #eaf6ff;
            font-size: 12px;
            background: rgba(8, 7, 18, 0.94);
            border-left: 1px solid rgba(115, 210, 255, 0.4);
            backdrop-filter: blur(6px);
            pointer-events: auto;
            z-index: 12000;
        }
        #tuner.hidden, #tuner-reload.hidden, #tuner-out.hidden { display: none; }
        #tuner-top {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px;
            border-bottom: 1px solid rgba(115, 210, 255, 0.25);
        }
        #tuner-title { font-size: 14px; font-weight: 900; letter-spacing: 1px; }
        #tuner-count {
            margin-left: auto;
            font-size: 11px;
            font-weight: 700;
            color: #ffd339;
        }
        #tuner-count.dim { color: rgba(190, 215, 240, 0.5); font-weight: 600; }
        #tuner-close {
            padding: 2px 8px;
            color: #cfeaff;
            font-size: 13px;
            background: transparent;
            border: 1px solid rgba(150, 210, 255, 0.35);
            border-radius: 8px;
            cursor: pointer;
        }
        #tuner-reload {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            font-size: 11px;
            color: #2a1a05;
            background: linear-gradient(180deg, #ffd06a, #ffb347);
        }
        #tuner-reload button {
            margin-left: auto;
            padding: 4px 12px;
            font-size: 11px;
            font-weight: 900;
            color: #2a1a05;
            background: rgba(255, 255, 255, 0.55);
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        #tuner-body { flex: 1; overflow-y: auto; padding: 6px 0 10px; }
        .tune-group { border-bottom: 1px solid rgba(115, 210, 255, 0.14); }
        .tune-group > summary {
            padding: 10px 14px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #9ddcff;
            cursor: pointer;
        }
        .tune-note {
            padding: 0 14px 8px;
            font-size: 10px;
            line-height: 1.6;
            color: rgba(190, 215, 240, 0.6);
        }
        .tune-row { padding: 5px 14px 9px; }
        .tune-row.changed { background: rgba(255, 211, 57, 0.08); }
        .tune-head { display: flex; align-items: center; gap: 8px; }
        .tune-label { flex: 1; font-size: 11px; color: rgba(226, 240, 255, 0.92); }
        .tune-row.changed .tune-label { color: #ffd339; }
        .tune-reload-flag {
            margin-left: 6px;
            padding: 1px 5px;
            font-size: 9px;
            font-style: normal;
            color: #ffb347;
            border: 1px solid rgba(255, 179, 71, 0.5);
            border-radius: 5px;
        }
        .tune-num {
            width: 74px;
            padding: 3px 6px;
            color: #eaf6ff;
            font-size: 11px;
            text-align: right;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(150, 210, 255, 0.3);
            border-radius: 6px;
        }
        .tune-slider { width: 100%; margin-top: 5px; accent-color: #63d7ff; cursor: pointer; }
        .tune-row.changed .tune-slider { accent-color: #ffd339; }
        #tuner-foot {
            display: flex;
            gap: 8px;
            padding: 10px 14px;
            border-top: 1px solid rgba(115, 210, 255, 0.25);
        }
        #tuner-foot button {
            flex: 1;
            padding: 8px 4px;
            color: #cfeaff;
            font-size: 11px;
            font-weight: 800;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(150, 210, 255, 0.35);
            border-radius: 9px;
            cursor: pointer;
        }
        #tuner-foot button.primary {
            color: #2a1a05;
            background: linear-gradient(180deg, #ffd06a, #ffb347);
            border-color: transparent;
        }
        #tuner-foot button:disabled { opacity: 0.5; cursor: default; }
        #tuner-out {
            margin: 0 14px 14px;
            padding: 8px;
            color: #cfeaff;
            font-size: 11px;
            font-family: Consolas, monospace;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(150, 210, 255, 0.3);
            border-radius: 8px;
            resize: vertical;
        }
        #cinematic-bars {
            position: fixed;
            inset: 0;
            opacity: 0;
            transition: opacity 0.5s;
        }
        #cinematic-bars.show { opacity: 1; }

                    "{ore} seals off the corridor — it won't break, something is locked inside",
                "先干掉守卫，才能继续凿这段{ore}": "Drop the guard before digging deeper into this {ore}",
                "{ore}凿不开，里面封着的东西还在动": "{ore} won't break — whatever is sealed inside still stirs",

                "发现龙蛋，靠近拾取后带回孵化台": "Dragon egg found — pick it up and bring it to the hatchery",

            function t(text, params) {
                let out = LANG === "en" && EN[text] !== undefined ? EN[text] : text;
                if (params) for (const key in params) out = out.split(`{${key}}`).join(params[key]);

            const CONFIG = {
                playerSpeed: 9.4,

                playerDeceleration: 16,
                playerRadius: 0.62,
                // 弓的攻击距离。注意**真正生效的交战距离比这个数大 1.4 米**：
                // `nearestTarget()` 用的是 `playerAttackRange() + 1.4`，那 1.4 是瞄准容差。
                // 所以这里 4.8 读出来是 3.2（Lv1 reach -3）~ 6.8（Lv2 起 +reach 0.6），

            // 角度一律用 atan2(z, x) 这套（0 = +X），-π/2 正对屏幕上方；扇形跨 [-3π/4, -π/4]，
            // 不跨越 ±π 的接缝，所以角度比较不用处理环绕。
            const SECTOR = {
                center: -Math.PI / 2,
                half: Math.PI / 4,
                // 主城那圈自由圆：玩家在里面不受角度限制，正好取到低级矿的内边。
                // 这圈半径同时是唯一一条环城道的外边——Lv4 主城内部被房子塞满，
                // 从矿区（屏幕上方）走到城前地贴（屏幕下方）穿不过建筑群，只能贴着围墙绕。
                // 建筑最外缘 14.7，收窄到 15.6 时那条道只剩 0.9 宽，人（直径 1.24）过不去。
                freeRadius: 16.3
            };
            SECTOR.start = SECTOR.center - SECTOR.half;
            SECTOR.end = SECTOR.center + SECTOR.half;
            SECTOR.span = SECTOR.half * 2;

            // 终局演出（破封点在哪、只崩哪一层）三处都要点名它，散落的字符串对不上就是静默出错。

            // 再对着下一堵墙开凿，中间那段路上什么都不发生，整个矿区看起来像一组静物。
            // 放几只来回踱步的杂兵之后，隔着半透明的矿墙就能看见远处有东西在动，
            // 「外面还有一层」这件事不用箭头也读得出来。
            //
            // 它们和冻在矿里的守卫是两种东西，代码上也必须分开（`type: "rover"`）：
            // 守卫是承重结构，钻石版的锄头钱全靠它们，`nearestLivingGuard()` 按 type 取人。
            // 游荡怪要是也算「守卫」，钻石不够时箭头就会指向一只根本不掉钻石的怪。
            //
            // 强度按「几下就能打死的杂兵」给，大约是同层守卫的三分之一血：它们是让世界动起来的，
            // 不是拦路的。掉落只有金币，理由同上。
            const ROVER_LANES = [
                // scale 是按「站在走廊里能看出是只怪」定的，不是按强度。0.5 那一版本体只有 1.3 米高，
                // 比玩家矮一头，混在碎石堆里像块会动的石头。0.62 起玩家一眼能认出轮廓，
                // 同时还明显小于同层守卫（守卫是 0.72 / 0.95 / 1.18，本体高出一米多）。
                //
                // drop 压到守卫的三分之一上下（守卫 6 / 12 / 22）。第一版给的 4 / 8 / 14 合计 52 金币，
                // 相当于把守卫那 102 的击杀收入加厚一半，实测钻石版从 142.5 秒掉到 102.8 秒——
                // 这些怪是氛围，不该动经济。压到合计 20 之后它只剩「打死了有响」这一份作用，
                // 不足以让玩家改主意专门去刷。
                { id: "lane-low", inner: "low", outer: "mid", hp: 150, damage: 1, drop: 2, speed: 2.2, chase: 1.6, scale: 0.62 },
                { id: "lane-mid", inner: "mid", outer: "high", hp: 900, damage: 4, drop: 3, speed: 2.5, scale: 0.72 },
                { id: "lane-high", inner: "high", outer: SEALED_TIER, hp: 2200, damage: 7, drop: 5, speed: 2.8, scale: 0.85 }
            ];

            // 每条走廊放两只。gap / spanArc 都是「米」而不是弧度：偏移量除以走廊半径才换成角度。
            //
            // 第一版直接写的弧度（offset ±0.35、span 0.22），三条走廊共用一组数。这是错的——
            // 弧长等于半径乘角度，同样的 0.35 弧度在最内圈是 8 米、在最外圈是 14.6 米，
            // 于是「两只怪离主路多远」这件事在三条走廊里差了将近一倍，外圈那条的怪永远碰不到人。
            // 改按米定之后三条走廊的布局才真的一致，也就只需要一个 aggro 值。
            //
            // 两只不再左右对称。对称的后果是「要么都够得着、要么都够不着」，没有中间状态：
            // 玩家沿扇区中轴走，两只怪与他等距，任何一个 aggro 值都是同时扑上来或者同时不理人。
            // 现在一只（gap +2.6，区间横跨中轴）站在主路上，一只（gap -9.5）守侧翼。
            // 近侧那只离中轴最远也只有 7.1 米，所以过路必定惊动它；侧翼那只的区间是 -14 ~ -5 米，
            // 只有走到内侧那 4 米（约四成时间）才够得着中轴，或者玩家自己拐去侧翼才会被两只一起盯上。
            // 遭遇强度于是跟着巡逻相位和走位变，而不是「进走廊」这一件事就把它定死。
            //
            // 敢把一只放在主路上，是因为玩家速度 9.4 而它们只有 2.2 ~ 2.8（CONFIG.playerSpeed
            // 与 ROVER_LANES.speed）。快三四倍意味着它拦不住人，只能擦一下——想打就停下打，
            // 不想打直接跑过去，不会变成每层一道必须清掉的关卡。
            //
            // spanArc 要给扇区边界留余量，贴着边走会半个身子插进侧面岩壁里。最紧的是最内圈
            // （半宽只有 17.9 米）：侧翼那只走到外端是 14 米，留 3.9 米。
            const ROVER_PATROLS = [
                { gap: 2.6, spanArc: 4.5 },
                { gap: -9.5, spanArc: 4.5 }
            ];

            // 玩家走到多近才扑上来（aggro）、追多远放弃（leash）。
            //
            // 第一版是 5 / 9，当时的理由是「游荡怪的本职是在那儿动，贴脸了才还手」，
            // 怕玩家一进走廊就被两只怪同时黏上、过路变成清场。实测下来这个顾虑是错的方向：
            // 沿扇区中轴径向穿过三条走廊，一只怪都不会理他——engagedPeak 全是 0。
            // 它们退回成了纯布景，而放它们进来的全部理由就是「让世界看着在动」。
            //
            // 但这不是感知半径的问题，是分布的问题（见 ROVER_PATROLS）：怪按弧度对称摆在
            // 扇区两侧，越外圈离主路越远。先试过纯加大 aggro，12 才够到最外那条的 13.5 米，
            // 而 12 又让内两条变成「进走廊必被两只同时黏上」——单一数值兼顾不了。
            // 把巡逻改成按米布置、并让近的那只横跨中轴之后，最远也就 7.1 米，9 就够了。
            //
            // leash 取 aggro 的一倍半：追击要有纵深，否则玩家往外退两步怪就转身回去踱步，
            // 刚打起来又断掉。
            //
            // chase 是被激怒之后的速度倍率（乘在 ROVER_LANES[].speed 上，巡逻时不乘）。
            // 见 chaseSpeedOf：原速追击追不上任何东西，这一条才是「有没有威胁」的开关。
            //
            // 用对象而不是几个 const，是为了能在调参面板里当场拖——「多远算太远」
            // 这种事看数字定不了，得边走边试。
            //
            // tether 只管外侧，throughReach 管内侧——两侧不对称，理由见 roverStrayed。
            const ROVER_RANGE = { aggro: 11, leash: 18, chase: 2.4, tether: 3, throughReach: 4 };

            // 游荡怪的碰撞半径，只用于挡矿墙。取值理由见 constrainEnemy 里那段。
            const ROVER_BODY_RADIUS = 0.5;

            // 守卫的追击。和游荡怪分开，因为两者的拴绳锚点根本不同：游荡怪拴在自己那条走廊上，
            // 守卫拴在出生点（`homePosition`，见 `updateEnemyLeash`）。
            //
            // speed 是激怒后的速度倍率，理由和 ROVER_RANGE.chase 一样：原速 2.4 ~ 2.8 对玩家 9.4，
            // 追不上任何东西。
            //
            // 但守卫这边还压着一个更硬的毛病，实测才看出来：**它的挥击动作比拴绳窗口还长**。
            // 高级守卫前摇 0.8 + 后摇 1.1 = 1.9 秒，而玩家从攻击距离 3.7 米跑到当时的
            // chaseRadius 11 米只要 (11 − 3.7) / 9.4 = 0.78 秒。于是它整个逃跑窗口都锁在后摇里
            // ——实测追了 10 秒，离家最远 0.06 米，**一步都没追出去过**。等后摇结束，
            // 玩家已经在 12.6 米外，拴绳直接把它拽回家。光提速没用，光「后摇里不判拴绳」也没用
            // （等它能动时玩家已经在二十米外），必须把 chaseRadius 本身放大到玩家一个攻击循环
            // 跑不出去的量级：见 ORE_TIERS[].monster.chaseRadius。
            //
            // keepOutMargin：守卫不得进入主城。主城是安全区，也是踩地贴做交互的地方。
            // 低级守卫出生在半径 18.5，主城满级 14.6，两者只隔 3.9 米——放大 chaseRadius 之后
            // 它能一路挤进城里挡住地贴，所以要一道硬地板（见 `constrainEnemy`）。
            //
            // patience：连续这么多秒贴不上玩家，就改用够得着的远程招（见 pickReachSkill）。
            // 这是弓箭化之后风筝打法的解药。给太小它会隔着老远一直冲，读作「怪在抽搐」；
            // 给太大风筝就有稳定的免伤窗口。
            const GUARD_CHASE = { speed: 2.4, keepOutMargin: 0.8, patience: 0.8 };

            // 出土后的眼睛尺寸；冻在矿里时会放大，间距按 EYE_SPREAD_RATIO 同步拉开。
            const EYE_BASE_SCALE = 0.28;
            const EYE_BASE_OFFSET = 0.32;
            const EYE_SPREAD_RATIO = 1.45;

            // Lv1 半径从 7.4 收到 6.6：广场要占掉城北那一大块，原来那个圈扣掉广场和主堡
            // 之后放不下房子，开局会比改之前更空。收到 6.0 更紧凑，但那样连两栋房子都塞不进
            // 「避开中轴、又不和城墙角楼穿模」的夹缝里，6.6 是还能站住房子的下限。
            // 地贴不用跟着外移——除了「升级主城」那张，其余三张都是 Lv2 之后才解锁的。
            const CITY_STAGES = [
                { level: 1, radius: 6.6, cost: 10, unlock: null, label: "主城" },
                // 30 降到 20。实测第一次扩建要等到 19.0 秒——建成主城在 0.7 秒（起始金币
                // 正好够，不用挖），然后是全场第二长的一段空窗，而它偏偏排在最前面。
                // 广告的前十五秒是留存生死线，这段里玩家只是在挖第一片矿、走回城。
                // 30 枚要凿 123 格低级矿，20 枚 82 格，加上两趟各 1.3 秒的路，
                // 第二个进度点从 19 秒挪到 13 秒上下，落回中位间隔那一档。
                // 解锁顺序改过一次（2026-09-07）：原先是 Lv2→锄头、Lv3→孵化台、Lv4→进化。
                // 现在每一级城解锁一件设施，那件设施升完才放行下一级城（见 releaseCityGate），
                // 于是「城 → 设施 → 城 → 设施」严格交替，玩家任何时刻只有一个下一步。
                // 进化台不再挂在城上，改由武器台满级放出——它和孵化、进化抢同一个钻石池，
                // 三张并排亮着时实测进化会被拖后 36.5 秒。整条钻石单轨见 forgeWindowOpen。
                { level: 2, radius: 9.8, cost: 15, unlock: "forge", label: "主城" },
                // 65 降到 38。锄头推迟到 Lv3 之后，意味着拿到二级锄头前只能挖低级矿，
                // 而低级矿整层清空只有 89 金币——按 65 算，城 Lv2 + Lv3 要 85，等于逼玩家
                // 把第一道矿墙铲平（96%）。这个游戏的前提是凿隧道不是清场：矿被挖光之后
                // 锄头升级的横扫桶没东西可清，分层凿穿的观感也塌了。38 把占比压回 65%。
                { level: 3, radius: 12.2, cost: 20, unlock: "pickaxe", label: "主城" },
                { level: 4, radius: 14.6, cost: 100, unlock: "hatchery", label: "主城" }
            ];

            const PICKAXE_LEVELS = [
                // power 是每次挥镐凿掉的格子数（配 ORE_TIERS.hardness 用），power_score 只进 HUD 战力。
                // 升级价格不在这儿，它按版本分别列在 ECONOMY_PRESETS.*.pickaxeCost。
                //
                // 表里有四级，但**能买到第几级由预设的 pickaxeCost 有几项决定**：A 版只列两项，
                // 买完 Lv3 时 resolveTileCost 返回 0，completePickaxe 顺手把地贴撤掉，于是 A 版
                // 照旧封顶三级。第四级是宝石版专用的——它是高级宝石唯一的出口。
                { level: 1, power: 6, power_score: 1241 },
                { level: 2, power: 10, power_score: 2056 },
                { level: 3, power: 20, power_score: 3480 },
                // 第四级不解锁新矿层（封印矿凿不开），它买的是速度：高级矿硬度 5，
                // 三级锄头一下凿四格、四级一下凿六格，剩下那大半环高级矿会明显开始融化。
                { level: 4, power: 30, power_score: 5240 }
            ];

            // ── 钻石武器线（宝石版专属）──────────────────────────────────────
            //
            // 锄头原先一手管两头：挖矿效率（上面那张表的 power）和战斗伤害
            // （BALANCE.playerDamage.perPickaxe）。钻石武器要管战斗伤害，就必然和它撞在
            // 同一个数上——玩家花宝石升锄头顺便变强，再花钻石升武器又变强一次，
            // 两条线在同一个数上打架，谁都说不清自己刚才买的到底是什么。
            //
            // 所以切开：**锄头（宝石）只管挖，武器（钻石）只管打**。主题上也顺，镐头凿矿、附魔杀怪。
            //
            // 伤害数列刻意照抄原先锄头那一串，于是七只守卫的血量一个都不用动：
            // 切分改的是「谁驱动这个数」，不是数本身。（后来砍成三级，端点仍然保留，
            // 见 WEAPON_LEVELS 里那段。）
            //
            // 早先这条线不新增手持物，各级都是给手上那把镐附魔（省掉模型和挥击动画）。
            // 代价是「升武器」和「升锄头」在玩家眼里都是升镐子，只能靠地贴的名字和图标
            // （火苗对镐头）去区分——这个代价后来被判定太贵，弓因此变成了独立手持物，
            // 地贴图标也跟着从火苗换成弓（见 TILE_DEFS.forge 和 drawTileIcon 的 "bow"）。
            const WEAPON_LEVELS = [
                // reach 是相对 CONFIG.attackRange 的**增减**（Lv1 是负的，见下面那段）；
                // splash 是三连击第三下的溅射半径
                // （0 = 不溅开），splashRatio 是溅到旁边那些怪身上的伤害比例。
                //
                // 最高档的附加在规划里写的是「闪避后的反击变成范围扇击」，落地时换成了
                // 溅射加强：那条描述预设了一个「反击」动作，而这一版闪避给的是破绽
                // （怪物踉跄、玩家自己找输出窗口），没有反击这个动作可以改。溅射能一路加宽，
                // 成长感是连续的，而且和上一档共用同一段代码。
                //
                // ── 2026-09-07：四级砍成三级，伤害改成按级写死 ──────────────────
                // 武器台和孵化、进化抢同一个钻石池，排成单轨之后第四级只能落在进化后面、
                // 离终局只剩十几秒，是一条栽过的坑。所以去掉中间那档。
                //
                // 伤害原先是 `base + (等级-1) × perWeapon` 算出来的线性数列
                // 235 / 425 / 615 / 805。直接删一级会让上限掉到 615，高级守卫 9000 血
                // 从 11 刀变 15 刀——那是一次没人要求过的战斗节奏改动。所以改成查表，
                // **两个端点原样保留**：235 / 425 / 805，递进反而更陡，配「越来越炫」更顺。
                // 七只守卫的血量因此仍然一格都不用动。
                // ── 2026-09-08：Lv1 的 reach 从 0 改成 -3.0 ────────────────────
                // 这是「弓箭之前打怪一点都不困难」的病根，而且它一直伪装成一个数值问题。
                //
                // reach 是加在 CONFIG.attackRange（4.8）上的，Lv1 写 0 意味着**镐头的
                // 有效交战距离和弓差不多**：4.8 + 1.4 瞄准容差 = 6.2 米。而低级守卫的
                // attackRange 只有 2.4 米。也就是说玩家在解锁弓之前就已经在无伤放风筝了——
                // 实测第一场仗 1.8 秒、掉 3 点血，整套预警/前摇/破绽一个都没用上。
                //
                // 改成 -3.0 之后 Lv1 是 1.8 + 1.4 = 3.2 米，真近战：低级守卫（2.4）够得着，
                // 中级（3.0）持平，高级（3.7）反过来压着玩家打。于是弓在 Lv2 给的那 6.8 米
                // 才成为一次**能当场感觉到的**变化——不是「伤害数字变大了」，
                // 是「我不用再站在它爪子底下了」。
                //
                // 这个数放在武器表里而不是改 CONFIG.attackRange，是为了不碰 ?arpg=0：
                // reach 整个挂在 weaponEnabled() 下面，回滚路径照旧读 4.8。
                { level: 1, damage: 235, reach: -3, splash: 0, splashRatio: 0, power_score: 0 },
                { level: 2, damage: 425, reach: 0.6, splash: 0, splashRatio: 0, power_score: 980 },
                // 顶格取原第四级那组溅射（3.4 / 0.55），不是原第三级的 2.6 / 0.3——
                // 端点保留是这次改动的原则，特效和伤害都照这条办。
                { level: 3, damage: 805, reach: 0.6, splash: 3.4, splashRatio: 0.55, power_score: 3860 }
            ];

            // 宝石的品质档位。id 直接复用矿层 id——「哪一层矿产哪一档宝石」是一一对应的，
            // 再单开一套映射只会多一处能对不上的地方。
            //
            // 需要哪一档由锄头当前等级决定：Lv1 升 Lv2 收 TIER_ORDER[0]（低级矿那档），
            // 也就是「上一级矿层产的宝石正好够买下一级锄头」。升完一级，要收的档位跟着进一格，
            // 手上那些低档宝石当场作废——想再升级只能往更深的矿里走。
            // ── 配色是按「压过宿主矿的颜色」定的，不是按矿层色抄的 ──────────────
            //
            // 第一版让宝石跟着矿层走（绿矿绿宝石、紫矿紫宝石），在实机上两个毛病一起犯：
            // 同色宝石埋进同色矿里等于隐身；而外面那层加色光晕把三档一起顶到过曝，
            // 三种颜色在屏幕上全是白的，品质根本读不出来。
            //
            // 所以改成每一档取宿主矿的对比色，再避开已经被占掉的两个色位——金币是金的、
            // 钻石是青的，宝石不能碰这两个，否则同一堆掉落物里分不清哪个进哪个账：
            //   初级 埋在青绿矿里 → 冰白，绿底上最跳的是不带绿的高亮
            //   中级 埋在紫矿里   → 青柠，紫的补色
            //   高级 埋在橙矿里   → 品红，橙底上唯一还留着的强对比位
            // 白→青柠→品红本身不构成「越来越贵」的直觉，所以品质阶梯另外由 scale 承担：
            // 一档比一档大一圈，颜色只管认得出、看得见。
            //
            // halo 是加色光晕专用的深色版本。加色是往画面上「加」，直接用本体那个亮色会把
            // 三个通道一起顶到 1.0，结果就是第一版那样——全白。压深之后加上去才保得住色相。
            const SHARD_GRADES = {
                low: { id: "low", name: t("初级宝石"), color: 0xffe4f4, emissive: 0xa06f98, halo: 0x703960, css: "#ffe4f4", scale: 1 },
                // 中级这档偏绿而不是偏黄：黄绿在紫矿上和同时埋着的金币是同一个暖色区，
                // 远看两种掉落物混成一片，而它们进的是完全不同的账。
                mid: { id: "mid", name: t("中级宝石"), color: 0x7cff46, emissive: 0x2f9e0c, halo: 0x2f8c00, css: "#7cff46", scale: 1.18 },
                high: { id: "high", name: t("高级宝石"), color: 0xff4ab8, emissive: 0xb00060, halo: 0xa8005c, css: "#ff4ab8", scale: 1.4 }
            };

            // 经济数值表。这里原先并排放着两版（纯金币 / 金币+宝石+钻石）用来对比手感，
            // 对比做完了：三货币版明显更好，纯金币版已废弃删除。表的形状留着没拍平——
            // 调参面板的字段路径、/__save 的写回定位全都写成 ECONOMY_PRESETS.gem.xxx，
            // 拍平要连着改三处，收益只是少一层键。
            //
            // ── 命名坑，读到这儿必须先看清 ──────────────────────────────────
            // 代码里的 gem 一直指**钻石**（它比宝石早存在），宝石是 shard。中文文案以中文为准，
            // 不要按英文名对号入座。没有做重命名，是因为 ?econ=gem 这条链接已经分享出去了，
            // 而改名对玩家零收益、对这个六千行单文件却有实打实的破坏风险。
            //
            // 三种货币各走各的路，互不流通：
            //   coin  金币  挖矿按格连续产出        → 主城 Lv1–4、封印献祭
            //   shard 宝石  预埋在矿体里，分三档品质 → 锄头 Lv2/3/4，每级收的品质进一档
            //   gem   钻石  守卫掉落                → 孵化台、宠物进化、武器
            // 三条线互不流通，所以推进顺序由收入来源天然决定，orderInterlock 那把人工锁不需要。
            const ECONOMY_PRESETS = {
                gem: {
                    id: "gem",
                    label: "金币+宝石+钻石",
                    gems: true,
                    shards: true,
                    // 三级升级，收的分别是初级/中级/高级宝石（品质由锄头当前等级推出，
                    // 见 requiredShardGrade）。数字压在个位数：宝石要读起来「贵重」，
                    // 一做到几百就和金币没区别了。
                    //
                    // Lv4 先从 6 降到 4，再降到 3：它一直是全场最长的一段投入。决定这段有多长的
                    // 不是颗数，是「要凿掉这一层的百分之几」——高级矿整环埋 16 颗，收 6 颗得挖
                    // 37%、4 颗要 25%、3 颗只要 19%。
                    //
                    // 降到 4 之后还剩 29 秒（中位间隔 8.6 的 3.4 倍，两局复现）。这一段没法靠
                    // 插事件填满：玩家整段人都在矿区，而所有地贴在城里。实测把锻造台最后一级
                    // 引到这个窗口里，坑是劈成两半了，但来回跑掉 14 秒，后半段无事件总时长
                    // 反而从 29 涨到 42，还把金币余量顶回 74~85（献祭价固定，多挖的全是废币）。
                    // 所以两件事要一起做：引导照指，同时把 grind 本身砍掉四分之一。
                    //
                    // 余量继续看不见——锄头满级后宝石 HUD 整条隐藏（见 updateShardHud 的
                    // spent 分支），剩下的 13 颗是横扫在满级之后收进来的。
                    pickaxeCost: [4, 5, 3],
                    pickaxeCurrency: "shard",
                    // 武器三级，收钻石。定在个位数是跟着钻石的读法来的（同孵化和进化），
                    // 而且三笔加起来 18 必须明显小于「守卫掉落总量减掉宠物线」——钻石是
                    // 离散且有限的，差一颗就是死锁，所以这条线宁可留余量也不做成刚好花完。
                    // 供给侧的增量挂在 ARPG.guardGemBonus，那儿有整笔账。
                    // 两级升级（三档武器）。原先三级、共 18 颗，砍掉最后一级的缘由见
                    // WEAPON_LEVELS 那段：钻石单轨之后它只能落在进化后面，买完没仗打。
                    //
                    // ── 2026-09-08：Lv3 从 6 抬到 12 ────────────────────────────
                    // 上面那条「余 12 颗要想办法吸收」的待办，和「小龙那一档要能被单独
                    // 感觉到」是同一件事，一起解决。
                    //
                    // 6 的时候实测破壳在 92.0 秒、Lv3 在 94.7 秒——中间隔 2.7 秒，
                    // 而且**没有任何一场仗**：玩家手上的钻石在孵化那一刻就够买 Lv3 了，
                    // 于是这两次变强在体感上糊成一次。抬到 12 之后他得先用「只带小龙、
                    // 武器还是 Lv2」的状态打赢一只高级守卫，小龙那份贡献才有地方被看见。
                    //
                    // 钻石总开销随之变成 4+12+8+14 = 38，供给 44，余 6。
                    weaponCost: [4, 12],
                    // 钻石接手宠物线。守卫数按每层的段数来：低 2、中 2、高 3，一共七只。
                    // 供给 2×3 + 2×4 + 3×4 = 26，花 8 + 14 = 22，余 4。
                    // 只打低中两档拿 14 颗，付完孵化台剩 6，够不着 14 的进化——
                    // 高级守卫因此是承重结构，而不是顺路。
                    hatcheryCost: 0,
                    evolveCost: 10,
                    hatcheryCurrency: "gem",
                    evolveCurrency: "gem",
                    // 高级档从 6 降到 4。原先按「高级只有两只守卫」算供给，实际是三只，
                    // 于是整局多发了 6 颗——实测通关时手上还剩 10 颗，而钻石 HUD 不像宝石
                    // 那样会在没处花时隐藏，那一串数字会一直挂在屏幕上。
                    guardGems: { low: 3, mid: 4, high: 4 },
                    // 有钻石可掉的守卫就不掉金币了。翻成 true 是「金币钻石双掉」，调节奏时的杠杆。
                    guardKeepsCoins: false,
                    // 关掉。这条规则（守卫活着那段矿就凿不动）本来是「把钻石供给从刚好够变成
                    // 必然够」的结构性保证，但它在手上读成一堵没道理的墙：玩家想挖矿，游戏拦住他，
                    // 理由是十几米外站着一只他还没注意到的怪。强制是达到了，动机没有——
                    // 他不是「想去打怪」，是「被拦下来只好去打怪」。
                    //
                    // 换成软引导：钻石门槛本身（锄头只收钻石）已经是硬约束，玩家不打怪就升不了锄头、
                    // 升不了锄头就凿不开下一层。缺的只是「钻石从哪来」这个信息，那是提示和箭头的活儿——
                    // 站上锄头地贴时告诉他还差几颗、去哪拿，箭头同时改指守卫。
                    // 供给的确定性改由引导保证（见 getGuideGoal 里钻石不足的分支）。
                    guardBlocksSegment: false,
                    // 封印献祭：金币在这一版的终点站，也是锄头 Lv4 唯一的解锁物。
                    // 主城 Lv4 在 82.6 秒买完之后金币就没有出口了，之后五十多秒挖出来的
                    // 一百六十多枚全是废的——而挖矿是这个游戏的核心动词，金币是它唯一的
                    // 即时反馈。150 这个数是按「几乎清空」定的：走到墙前时手上大约 160~165
                    // （Lv4 那一刻 118 + 横扫赏金 46，进化只花钻石），留个零头比刚好归零可信。
                    // 详见 specs/tasks/sealed-vein-offering.spec.md。
                    sealOffering: { cost: 120 },
                    // 四项消费抢一个池子时，得靠人工锁强行交替城和锄头，否则路过漏进地贴的金币
                    // 会先把远期扩建喂饱。货币一拆，推进顺序由收入来源天然决定，锁就不需要了。
                    orderInterlock: false
                }
            };
            const ECON = ECONOMY_PRESETS.gem;

            // 手感与战斗数值。原先这些是散在函数体里的字面量，改一个数要先翻出它藏在哪一行；
            // 集中到这里是为了能在控制台上直接调（`__wik.tune()` 返回的就是这些表的引用，
            // 改完立刻生效，不用改文件重载）。
            //
            // 经济数值不在这儿，它们各有各的表：
            //   ECONOMY_PRESETS  两版的价格、货币归属、守卫钻石掉落
            //   CITY_STAGES      主城四级的价格与解锁
            //   ORE_TIERS        每层矿的硬度、cellsPerCoin、守卫血量与金币掉落、环半径
            //   CONFIG           移动、攻击间隔、金币飞行等基础参数
            const BALANCE = {
                // 玩家伤害 = base + (等级-1) × 每级加成 + (已进化 ? evolvedBonus : 0)，
                // 三连击的第三下再乘 comboMultiplier。
                //
                // base 和 perPickaxe **只在 ?arpg=0（武器线关掉）时才起作用**。武器线开着时
                // 伤害查 WEAPON_LEVELS[].damage——它砍成三级之后数列不再等距，公式表达不了。
                // perWeapon 已经删掉：留着就是一个拖了不生效、还不报错的旋钮。
                playerDamage: { base: 235, perPickaxe: 190, evolvedBonus: 220, comboMultiplier: 3.35 },
                // ── 2026-09-08：小龙的输出整体抬起来 ────────────────────────────
                // 破壳原先在数值上几乎不存在：180 / 0.85 秒 = 212 DPS，而那一刻玩家自己
                // 是 1957 DPS，小龙占 11%。实测高级守卫带不带它是 4.6 秒对 3.9 秒——
                // 「多了个帮手」这件事玩家只能从画面上看出来，从手感上看不出来。
                //
                // 抬到 520 / 0.45 秒 = 1156 DPS（约玩家 Lv3 的一半），进化后 1150 / 0.3 秒 = 3833。
                //
                // 优先压间隔而不是加单发，是实测逼出来的：先试过 460 / 0.62（同样 742 DPS），
                // 高级守卫那场只快了 15%，中级那场**一点没快**。原因是火球有飞行时间，
                // 而一场两三秒的仗里小龙只来得及打两三发，单发再大也有一发落在怪已经死了之后。
                // 打得密才吃得满，顺带也更像「有个东西在替你打」——单发大只是偶尔闪一下。
                pet: {
                    hatched: { damage: 520, fireInterval: 0.45, range: 10 },
                    evolved: { chainRange: 7, chainTargets: 20, damage: 1150, fireInterval: 0.3, range: 14, powerGain: 3200 }
                },
                // 固定赏金，不按剩余格数结算。按格算的话低级矿值 94、中级矿值 187 金币，
                // 而整局全部开销才 315——两次横扫白送 89% 的经济，Lv3 到手游戏就结束了。
                // 按残矿比例折算同样不行：挖得越勤给得越少，最优解会变成故意少挖等白嫖。
                // high 只在宝石版用得上：那一档要四级锄头才进得了横扫的名单，而 A 版封顶三级。
                sweepBounty: { low: 18, mid: 30, high: 46 },
                // 金币抛射手感。ghostRatio 加的是只有视觉、不进账的金币，用来在不动经济数值的
                // 前提下把爆炸的密度撑起来。
                coinToss: {
                    mine: { ghostRatio: 4, dwell: 0.12 },
                    sweep: { burst: 1.1, spread: 1.3, dwell: 0.02, stagger: 0.05, ghostRatio: 2.5 },
                    // 横扫收尾补的尾数不铺开也不错峰：它是在玩家脚下一次性补齐的，
                    // 错峰会让最后几枚拖在爆炸结束之后飞回来。
                    sweepTail: { burst: 1.1, dwell: 0.02, ghostRatio: 2.5 },
                    // 守卫掉的钻石。这一组的调法和金币不一样：金币讲的是「一大笔冲回背上」，
                    // 钻石一次只有四到八颗、每一颗都对着一次具体升级，讲的是「打完了，
                    // 地上散着几颗，然后被收走」——中间那一拍必须看得见。
                    //
                    // 原先是 burst 1.3 / 无 dwell（吃 CONFIG.coinDwell 的 0.16）/ stagger 0.06。
                    // 量出来的病根不是「躺得不够久」——「至少有一颗在地上」的窗口有 0.85 秒，
                    // 不算短。病根是**三拍互相重叠**：滞空 0.97 + 躺地 0.85 + 飞回 0.95 = 2.77 秒
                    // 的分段总和挤在 1.98 秒里，任一时刻总有几颗在空中、几颗在地上、几颗已经
                    // 在飞回去了。「八颗全都躺在地上」那一拍实测只有 0.05 秒——等于从没出现过，
                    // 所以整段读成一条连续的喷泉接吸走，而不是「掉了一地，然后被收走」。
                    //
                    // 三个数一起动才拆得开这个重叠：
                    //   burst 1.3 → 0.85   抛得低，滞空从 0.97 缩到 0.77，落地时间也更集中
                    //   dwell 无 → 0.8     躺地够久，久到最后一颗落地时第一颗还没起飞
                    //   stagger 0.06 → 0.02  起飞几乎同步（错峰上限 = stagger×颗数），
                    //                        八颗一起被吸走，而不是拖成一条尾巴
                    // spread 1.6 → 2.6 是补偿：burst 同时管纵向和横向，抛低了横向甩距也跟着缩，
                    // 散开改由出生点的偏移承担，实测落点包围盒不变（5.6 米上下）。
                    //
                    // 结果：全都在地上 0.05 → 0.73 秒，而总时长 1.98 → 2.10 秒，几乎没变。
                    // 扫过 dwell 1.0 那一档（全在地 0.83 秒），总时长要涨到 2.37，不值。
                    guardGem: { burst: 0.85, spread: 2.6, stagger: 0.02, dwell: 0.8 }
                }
            };

            // ── ARPG 战斗改造 ────────────────────────────────────────────────
            //
            // 整套改造挂在这一个开关下面，`?arpg=0` 逐帧退回改造前的手感。这不是洁癖，
            // 是这次改造的验收方式：「更 ARPG 了」和「更好玩了」是两件事，后者只能靠
            // 当场来回切着比，靠回忆比不出来。所以每一处新行为都必须判 enabled，
            // 漏一处，回滚就不干净，对比也就不算数了。
            //
            // 题眼不是「加躲避机制」——预警、前摇、够宽的窗口本来就都有（推导与实测见
            // specs/tasks/arpg-combat-overhaul.spec.md）。缺的是动机：玩家打不死
            // （playerMinHp 保底），挨打只掉几点没用的血，而攻击是自动的，跑开等于自断输出。
            // 于是躲避在数值上是亏的，站桩硬吃才是最优解——全自动流程就是这么打赢的，
            // 跑完还剩 54 血。
            //
            // 所以代价和收益都换成秒数：挨打丢输出，躲开赚输出。血量继续只降不升、
            // 继续打不死人，硬吃全程也能通关，只是明显更慢。这是 playable 的底线——
            // 不能让人失败，但可以让人变慢。
            const ARPG = {
                enabled: true,
                // 挨打清空三连击计数。第三下乘 comboMultiplier（3.35），三下平均 1.78 倍
                // 基础伤害，断掉只剩 1.0 倍——硬吃的人 DPS 掉 44%。整套改造里性价比最高的
                // 一条：几行代码就把「躲不躲」变成一道 DPS 决策题，不用加任何美术或 UI。
                comboBreak: true,
                // 受击后封锁攻击的秒数。**只锁攻击，不锁移动**：躲避是纯走位解的（这一版
                // 不新增任何输入），锁住移动就等于挨一下就交出躲开下一下的能力。单只守卫
                // 后摇 0.65~1.1 秒不至于连锁，但走廊里两只巡游怪交替出手时会叠成「被按住打」，
                // 那是 playable 里最容易让人放手机的体感。位移仍然吃 knockback——
                // 被击退是被动的，不剥夺控制权。
                hitStun: 0.25,

                // ── 闪避与破绽 ──
                // 结算瞬间人在区外、而这个窗口之内还在区内 → 闪避。
                // 只判「结算时在区外」不行：站得远的人什么都没做也天天闪避，奖励会变成噪音。
                // 要求玩家确实在危险区里待到最后一刻，「贴着红圈边缘走掉」这一下
                // 才是整套改造想让人做出来的动作。
                perfectWindow: 0.45,
                // 破绽：闪避后攻击方的硬直秒数，期间受伤翻倍、不能起手下一招。
                // 这是躲避的全部收益来源——躲开换来的是一段能安全输出的时间，
                // 也就是把「躲避」从纯避害翻成了正收益。
                stunDuration: 0.8,
                stunDamage: 2,
                // 闪避那一下的时间微顿。只在闪避时给，普通躲开不给：
                // 它会打断挖矿的连续手感，而挖矿是这个游戏每秒都在做的事。
                hitStop: 0.08,
                hitStopScale: 0.25,

                // ── 狂暴 ──
                // 守卫血量掉到这个比例以下就换档：前摇变短、伤害变高。
                // 只给守卫，不给走廊里的游荡怪——那六只是布景，让它们残血反扑会把
                // 「过路」变成「清场」，而那条走廊本来只是去下一堵墙的路。
                //
                // 意义在于给每场守卫战一个后半段。原先一只守卫从满血到死，行为完全一样，
                // 战斗只是「血条往下走」；换档之后玩家会感到它急了，而这一下正好落在
                // 玩家快要打赢、注意力开始松掉的时候。
                frenzyThreshold: 0.3,
                frenzyWindup: 0.85,
                frenzyDamage: 1.3,

                // ── 冲锋的长条盖多远 ──
                // 长条的长度不写死，取「玩家现在站的距离 + 他在前摇里能后退的那一段 × 这个系数」
                // 和配置里 lineLength 的较大值（见 createMonsterHazard 的 line 分支）。
                //
                // 弓箭化之后这条是必需的。写死 9.5 / 11 时，从 reach 上限起手的那一记必然打空：
                // 高级守卫从 9 米发难，玩家在 0.58 秒前摇里能后退 5.5 米，落点 14.5 米，
                // 而长条只有 11 米——「冲锋」于是成了一个不用躲的动作，实测风筝打法
                // 七秒里只挨到 4 下（站桩挨 9 下），代价不到站桩的一半。
                //
                // 盖住后退**不等于**躲不掉：这一招的解法从来是侧移。长条只有 2.4 ~ 2.6 米宽，
                // 同样那 0.58 秒玩家能横移 5.5 米，绰绰有余。冲锋要教的正是这个不对称——
                // 往后退没用，往旁边走管用。
                //
                // 系数不取 1：那是「全程贴着最大速度沿长条正方向直线后撤」的理论上限，
                // 真跑起来总有斜向分量。给满会让长条长出一截没人到得了的尾巴。
                chargeRetreatCover: 0.9,

                // ── 武器线的钻石从哪来 ──
                // 加在 ECON.guardGems 之上的增量，而不是把那张表本身改大。
                //
                // 理由是这条线整个挂在 ARPG.enabled 下面：arpg=0 时锻造台不存在，多发的
                // 钻石就没有出口，会变成 HUD 上一串永远花不掉的数字（钻石不像宝石那样
                // 在没处花时会自己隐藏）。挂成增量，开关一关，供给自动跟着退回去——
                // 「回滚要干净」这条要求管的不只是手感，也管账。
                //
                // 整笔账（守卫数 低 2 / 中 2 / 高 3，一共七只）：
                //   基础  2×3 + 2×4 + 3×4 = 26
                //   增量  2×1 + 2×2 + 3×4 = 18
                //   供给  44
                //   支出  孵化 8 + 进化 14 + 武器 4+6+8 = 40
                //   余量  4
                // 余量是刻意留的，不做成刚好花完：钻石是离散的，差一颗就是硬卡死。
                //
                // 高级档的增量给到 4（最厚的一档），是因为武器最贵的那一级（8）排在最后，
                // 而玩家手上有钻石可花的时候，高级守卫往往是唯一还没打的收入来源。
                guardGemBonus: { low: 1, mid: 2, high: 4 }
            };

            // ?arpg=0 / ?arpg=off 关掉整套改造。默认开：要开发的就是这一版。
            function setupCombatMode() {
                const wanted = new URLSearchParams(location.search).get("arpg");
                if (wanted === "0" || wanted === "off") ARPG.enabled = false;
                document.body.classList.toggle("arpg-on", ARPG.enabled);

                            const ai = Math.floor((angle - ring.angleStart) / ring.cellAngle);
                            const ri = Math.floor((distance - ring.innerRadius) / ring.cellDepth);

                            return {
                                tier: ring.tierId,
                                remaining: ring.remaining,
                                band: `${ring.innerRadius.toFixed(2)}~${ring.outerRadius.toFixed(2)}`,

                    px: (x, y, z) => {

                    })
                );
                shockwave.rotation.x = -Math.PI / 2;
                shockwave.position.copy(finale.landing).setY(0.12);
                scene.add(shockwave);
                effects.push({ type: "shockwave", mesh: shockwave, life: 0.95, maxLife: 0.95, maxScale: 13 });

                const fireRing = new THREE.Mesh(
                    new THREE.TorusGeometry(4.2, 0.5, 8, 34),
                    new THREE.MeshBasicMaterial({ color: 0xff5a12, transparent: true, opacity: 0.85 })
                );
                fireRing.rotation.x = Math.PI / 2;
                fireRing.position.copy(finale.landing).setY(0.5);
                scene.add(fireRing);
                effects.push({ type: "shockwave", mesh: fireRing, life: 1.3, maxLife: 1.3, maxScale: 3.4 });

                const scorch = new THREE.Mesh(
                    new THREE.CircleGeometry(8.5, 40),
                    new THREE.MeshBasicMaterial({ color: 0x2a0d05, transparent: true, opacity: 0.72, depthWrite: false })
                );
                scorch.rotation.x = -Math.PI / 2;
                scorch.position.copy(finale.landing).setY(0.06);
                scene.add(scorch);

                buildDust(finale.landing.clone().setY(1.5), 40, 7, 0xffb066);
                buildDust(finale.landing.clone().setY(2.4), 26, 13, ORE_TIERS[SEALED_TIER].chunkColor);
                buildPopEffect(finale.landing.clone().setY(2), 46, 0xff8a2e);
                buildPopEffect(finale.landing.clone().setY(1.2), 26, ORE_TIERS[SEALED_TIER].glow);
                // 缺口只要够巨龙站进去。开到十五米的话画面里全是空地，
                // 两侧看不到残留的矿墙，也就读不出它是从矿脉里挣出来的。
                pulverizeOreAround(finale.landing, 10, SEALED_TIER);
            }

            // 破封那一下要看见矿石本身崩开：从范围内还立着的体素里抓一批，朝外上方甩出去。
            // tierId 限定只崩哪一层。破封点在封印矿上，而它离身后的高级矿墙只有三米多，
            // 不限层的话一炮下去连高级矿一起崩，读成「整片矿区塌了」而不是「它从封印里挣出来」。
            function eruptOreChunks(center, radius, count, tierId) {
                const picks = [];
                scanNearbyColumns(center, radius, column => {
                    if (tierId && column.node.tierId !== tierId) return;
                    if (column.blockCount <= 0) return;
                    if (Math.hypot(column.x - center.x, column.z - center.z) > radius) return;
                    for (const cellIndex of column.cells) {
                        if (!column.node.cells[cellIndex].removed) picks.push({ node: column.node, cellIndex });
                    }
                });
                if (!picks.length) return;
                for (let i = 0; i < count; i++) {
                    const { node, cellIndex } = picks[Math.floor(random() * picks.length)];
                    const cell = node.cells[cellIndex];
                    const mesh = new THREE.Mesh(shared.box, shared.chunkMaterials[node.tierId]);
                    mesh.scale.set(cell.width, node.ring.cellHeight, node.ring.cellDepth).multiplyScalar(0.85);
                    mesh.position.set(cell.wx, cell.wy, cell.wz);
                    mesh.castShadow = true;
                    scene.add(mesh);
                    const out = new THREE.Vector3(cell.wx - center.x, 0, cell.wz - center.z);
                    if (out.lengthSq() < 0.01) out.set(1, 0, 0);
                    effects.push({
                        type: "chunk",
                        mesh,
                        velocity: out.normalize().multiplyScalar(5 + random() * 8)
                            .add(new THREE.Vector3(0, 9 + random() * 8, 0)),
                        spin: new THREE.Vector3(
                            (random() - 0.5) * 9,
                            (random() - 0.5) * 8,
                            (random() - 0.5) * 9
                        ),
                        life: 1.3 + random() * 0.5,
                        groundY: node.ring.cellHeight * 0.4
                    });
                }
            }

            function damageOreFromHazard(hazard) {
                const center = hazard.kind === "fan" ? hazard.source.position : hazard.kind === "line" ? hazard.origin : hazard.mesh.position;
                const reach = hazard.kind === "line" ? hazard.length : hazard.radius;
                const touched = new Map();
                // 先按攻击范围收集，再统一结算；不能因遍历顺序决定哪些矿柱算暴露面。
                scanNearbyColumns(center, reach, column => {
                    const node = column.node;
                    if (node.tier.sealed || node.cleared || column.count <= 0 ||
                        (C_BLOCKS && blockNodeLevel(node) > cityLevel)) return;
                    if (!hazardContainsPlayer(hazard, new THREE.Vector3(column.x, 0, column.z))) return;
                    if (!touched.has(node)) touched.set(node, []);
                    touched.get(node).push(column);
                });
                for (const [node, columns] of touched) {
                    let fragments = 0;
                    for (const column of columns) {
                        for (const index of column.cells) {
                            const cell = node.cells[index];
                            if (cell.removed || fragments >= 24) continue;
                            launchOreChunk(node, cell);
                            fragments++;
                        }
                        pulverizeColumn(column, true);
                    }
                    const nearest = columns.reduce((a,b) => Math.hypot(a.x-center.x,a.z-center.z) < Math.hypot(b.x-center.x,b.z-center.z) ? a : b);
                    oreBreakFeedback(node, new THREE.Vector3(nearest.x, 1.2, nearest.z));
                    node.instanced.instanceMatrix.needsUpdate = true;
                    node.penetration = segmentPenetration(node, columns.map(c => c.ai));
                    if (node.penetration >= 1) breachOreSegment(node);
                    if (node.remaining <= 0 && !node.cleared) clearOreNode(node);
                }
            }

            function pulverizeColumn(column, monsterDamage = false, construction = false) {
                const node = column.node;
                for (const cellIndex of column.cells) {
                    const cell = node.cells[cellIndex];
                    if (cell.removed) continue;
                    cell.removed = true;
                    node.remaining -= 1;
                    node.ring.remaining -= 1;
                    column.count -= 1;
                    if (cell.blocking) column.blockCount -= 1;
                    node.instanced.setMatrixAt(cellIndex, node.zeroMatrix);
                    releaseOreCellLoot(cell, monsterDamage || construction, monsterDamage);
                    if (monsterDamage) enemyMining.cells += 1;
                }
                if (monsterDamage || construction) {
                    const earned = Math.floor((node.total - node.remaining) / node.tier.cellsPerCoin);
                    const amount = Math.max(0, earned - node.coinsReleased);
                    node.coinsReleased = Math.max(node.coinsReleased, earned);
                    if (amount) {
                        dropCoins(new THREE.Vector3(column.x, 1, column.z), amount, BALANCE.coinToss.mine);
                        if(monsterDamage)enemyMining.coins += amount;
                    }
                }
            }

            // 巨龙砸下来是在整圈矿墙上开一个大洞，按体素柱清而不是整段清，缺口才对得上落点。
            // tierId 同 eruptOreChunks：缺口只开在封印矿上。
            // 底下清守卫那一段不跟着过滤——缺口范围内不管哪层的杂兵都要清场，
            // 接下来是一对一，留一只冻在旁边矿墙里的守卫只会在对峙镜头里添乱。
            function pulverizeOreAround(center, radius, tierId) {
                const touched = new Set();
                scanNearbyColumns(center, radius, column => {
                    if (tierId && column.node.tierId !== tierId) return;
                    if (Math.hypot(column.x - center.x, column.z - center.z) > radius) return;
                    pulverizeColumn(column);
                    touched.add(column.node);
                });
                for (const node of touched) {
                    node.instanced.instanceMatrix.needsUpdate = true;
                    buildDust(node.position.clone().setY(1.4), 8, 3, node.tier.chunkColor);
                    buildPopEffect(node.position.clone().setY(1.6), 8, node.tier.glow);
                    if (node.remaining > 0 || node.cleared) continue;
                    node.cleared = true;
                    node.instanced.visible = false;
                    node.group.userData.alive = false;
                }
                for (const node of oreNodes) {
                    const monster = node.monster;
                    if (!monster || flatDistance(monster.position, center) > radius) continue;
                    monster.visible = false;
                    monster.userData.alive = false;
                    monster.userData.attackable = false;
                    const index = enemies.indexOf(monster);
                    if (index >= 0) enemies.splice(index, 1);
                }
            }

            function roarFlameDragon() {
                const dragon = finale.dragon;
                if (!dragon) return;
                dragon.userData.roar = 1;
                cameraShake = Math.max(cameraShake, 0.9);
                playSound("roar");
                buildPopEffect(getDragonMouth().add(new THREE.Vector3(0, 0, 0)), 30, 0xffc45c);
            }

            function getDragonMouth() {
                const point = new THREE.Vector3();
                if (finale.dragon) finale.dragon.userData.mouth.getWorldPosition(point);
                return point;
            }

            function breatheFlameDragon() {
                const dragon = finale.dragon;
                if (!dragon) return;
                dragon.userData.breathTimer = 1.15;
                const origin = getDragonMouth();
                const facing = new THREE.Vector3(0, 0, 1).applyQuaternion(dragon.quaternion).setY(0).normalize();
                // 朝斜上方喷：平喷会正对演出镜头，锥体内壁会糊成一个圆盘盖住巨龙。
                const direction = facing.clone().setY(0.78).normalize();
                // 加色混合而不是普通半透明：双面锥体的前后壁叠在一起时，
                // 普通混合会把它糊成一块不透明的平板三角形，只有加色才读得出「火」。
                // 外焰罩住整条火舌、内焰是短一截的白热芯：只铺一层的话，
                // 加色锥在夜色背景上只会亮成一片灰褐，看着像烟不像火。
                const flame = (radius, height, color, opacity) => {
                    const cone = new THREE.Mesh(
                        new THREE.ConeGeometry(radius, height, 16, 1, true),
                        new THREE.MeshBasicMaterial({
                            color,
                            transparent: true,
                            opacity,
                            side: THREE.DoubleSide,
                            blending: THREE.AdditiveBlending,
                            depthWrite: false,
                            // 巨龙在四五十米外，雾会把加色的火舌一起冲淡成灰烟。
                            fog: false
                        })
                    );
                    cone.position.copy(origin).addScaledVector(direction, height / 2 - 0.5);
                    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
                    scene.add(cone);
                    effects.push({ type: "breath", mesh: cone, life: 1.1, maxLife: 1.1, opacity });
                };
                // 两层锥体各有前后壁，重叠处一共四层加色，控制的是绿蓝两个通道而不是总不透明度。
                // 红通道叠到饱和正是火该有的亮度；但只要底色带上高绿高蓝（比如浅橙 0xffcc7a），
                // 四层叠完三个通道一起顶到 1.0，整条火舌就在夜色里读成一片灰白的布。
                flame(2.05, 8.5, 0xff2a00, 0.44);
                flame(1.05, 5.6, 0xff8c1a, 0.3);
                cameraShake = Math.max(cameraShake, 0.7);
                playSound("fire");
                for (let i = 0; i < 26; i++) {
                    const spark = getSpark(0xffa445);
                    if (!spark) break;
                    spark.position.copy(origin).addScaledVector(direction, random() * 12);
                    spark.position.x += (random() - 0.5) * 3;
                    spark.position.y += (random() - 0.5) * 2.4;
                    spark.position.z += (random() - 0.5) * 3;
                    effects.push({
                        type: "spark",
                        mesh: spark,
                        velocity: direction.clone().multiplyScalar(4 + random() * 8)
                            .add(new THREE.Vector3((random() - 0.5) * 3, random() * 4, (random() - 0.5) * 3)),
                        life: 0.7 + random() * 0.4,
                        maxLife: 1.1
                    });
                }
            }

            function updateFlameDragon(dt, elapsed) {
                const dragon = finale.dragon;
                // 开场预建的龙只保留封印姿态，不提前启动终局状态机。
                if (!dragon || !finaleStarted) return;

                // 破封前：封在墙里的剪影一下一下往外顶，矿脉跟着躁动、烧红、崩渣。
                if (finale.charge >= 0) {
                    finale.charge += dt;
                    const heat = Math.min(1, finale.charge / 1.7);
                    dragon.userData.glow.intensity = 1.5 + heat * heat * 11;
                    cameraShake = Math.max(cameraShake, heat * 0.6);
                    const pulse = 0.7 + 0.3 * Math.sin(finale.charge * 13);
                    for (const node of finale.sealedNodes) {
                        node.rejectShake = 0.2 + heat * 0.3;
                        const material = node.instanced.material;
                        material.emissive.setHex(0xe82600);
                        material.emissiveIntensity = 0.55 + heat * heat * pulse * 2.4;
                    }

                    // 两个不成倍数的频率叠出没有节拍的挣动，单一正弦会读成机械摆动。
                    const struggle = Math.sin(finale.charge * 7) + Math.sin(finale.charge * 11.3);
                    dragon.position.copy(finale.sealAnchor)
                        .setY(finale.sealAnchor.y + heat * 0.5)
                        .addScaledVector(finale.approach, struggle * heat * -0.45);
                    dragon.rotation.y = finale.sealYaw + struggle * heat * 0.09;
                    dragon.userData.head.rotation.x = struggle * heat * 0.16;
                    for (const eye of dragon.userData.eyes) {
                        eye.material.color.setRGB(1, 0.18 + heat * pulse * 0.5, 0.06);
                    }

                    finale.sparkTimer -= dt;
                    if (finale.sparkTimer <= 0) {
                        finale.sparkTimer = 0.16 - heat * 0.1;
                        const angle = random() * Math.PI * 2;
                        const spread = 2 + random() * 4;
                        // 从墙顶往外崩。贴地生成的话火星整个埋在三米多厚的矿墙里，一颗都看不见。
                        buildPopEffect(finale.landing.clone().add(new THREE.Vector3(
                            Math.cos(angle) * spread,
                            ORE_TIERS[SEALED_TIER].ringHeight + 0.6,
                            Math.sin(angle) * spread
                        )), 2 + Math.round(heat * 3), 0xff8a2e);
                    }
                    // 顶到后半段开始掉渣。eruptOreChunks 只抛副本、不动原体素，
                    // 所以墙还是完整的——这时候要读到的是「快撑不住了」，不是已经破了。
                    finale.crumbleTimer -= dt;
                    if (heat > 0.4 && finale.crumbleTimer <= 0) {
                        finale.crumbleTimer = 0.42 - heat * 0.24;
                        eruptOreChunks(finale.landing, 7, 2 + Math.round(heat * 2), SEALED_TIER);
                    }
                    return;
                }

                // 破封：从矿墙里顶出地面，翅膀由收拢甩到展开。
                if (finale.emerge >= 0) {
                    finale.emerge = Math.min(1, finale.emerge + dt / 1.2);
                    const t = 1 - Math.pow(1 - finale.emerge, 3);
                    // 从封印锚点挣回破封点并升出地面：只升不挪的话，
                    // 它会在偏离缺口四米的实心矿墙里直接立起来。
                    dragon.position.lerpVectors(finale.sealAnchor, finale.landing, t);
                    // 从侧躺的封印姿态转过来正对玩家。走最短一侧，不然会绕大半圈。
                    let turn = finale.faceYaw - finale.sealYaw;
                    while (turn > Math.PI) turn -= Math.PI * 2;
                    while (turn < -Math.PI) turn += Math.PI * 2;
                    dragon.rotation.y = finale.sealYaw + turn * t;
                    dragon.userData.head.rotation.x = THREE.MathUtils.lerp(0.2, 0, t);
                    dragon.userData.glow.intensity = 6 - t * 2.6;
                    for (const wing of dragon.userData.wings) {
                        wing.pivot.rotation.z = THREE.MathUtils.lerp(wing.side * 1.35, wing.restZ, t);
                        wing.pivot.rotation.x = THREE.MathUtils.lerp(-0.8, -0.26, t);
                    }
                    if (finale.emerge >= 1) finale.emerge = -1;
                    return;
                }

                for (const wing of dragon.userData.wings) {
                    wing.pivot.rotation.z = wing.restZ + wing.side * Math.sin(elapsed * 2.4) * 0.12;
                    wing.pivot.rotation.x = -0.26;
                }
                dragon.userData.jawTarget = 0;
                if (dragon.userData.roar > 0) {
                    dragon.userData.roar = Math.max(0, dragon.userData.roar - dt * 1.4);
                    const amount = Math.sin((1 - dragon.userData.roar) * Math.PI);
                    dragon.userData.head.rotation.x = -0.32 * amount;
                    dragon.userData.jawTarget = 0.62 * amount;
                    for (const wing of dragon.userData.wings) {
                        wing.pivot.rotation.z = wing.restZ + wing.side * amount * 0.42;
                        wing.pivot.rotation.x = -0.26 - amount * 0.22;
                    }
                }
                if (dragon.userData.breathTimer > 0) {
                    dragon.userData.breathTimer = Math.max(0, dragon.userData.breathTimer - dt);
                    dragon.userData.jawTarget = 0.72;
                }
                const jaw = dragon.userData.jawPivot;
                jaw.rotation.x += (dragon.userData.jawTarget - jaw.rotation.x) * Math.min(1, dt * 14);
                dragon.userData.glow.intensity = 3 + Math.sin(elapsed * 5) * 0.7;
                dragon.position.y = Math.sin(elapsed * 1.6) * 0.12;
            }

            function braceForBattle() {
                // 破封点在最外圈矿脉上，玩家这时多半还站在城里，隔着三道环。
                // 趁镜头正对巨龙特写、玩家不在画面里的这一拍把他挪到阵前，
                // 否则对峙镜头要框进四十米纵深，双方都会缩成两个小点。
                // 落点是破封炸开的那个缺口里、巨龙的侧前方，跟巨龙同在最外圈。
                // 早先让他站在中层与高层之间那条走廊上，从内圈看过去人整个埋在
                // 中层矿墙后面；要抬到能翻过墙顶，镜头得退到六十多米，
                // 而场地半径只有四十八米——相机会跑到对面去，视线横穿三道环。
                player.position.copy(clampToSector(finale.standPoint.clone()));
                moveVelocity.set(0, 0, 0);
                cameraFocus.copy(player.position);

                const facing = finale.landing.clone().sub(player.position).setY(0);
                if (facing.lengthSq() > 0.01) player.rotation.y = Math.atan2(facing.x, facing.z);
                buildPopEffect(player.position.clone().setY(1.7), 20, 0xffd166);
                buildDust(player.position.clone().setY(0.4), 14, 3, 0xffe6a6);
                if (pet) {
                    pet.position.copy(player.position).add(new THREE.Vector3(2.4, 3.4, -0.6));
                    buildPopEffect(pet.position.clone(), 24, 0x8ce9ff);
                }
                cameraShake = Math.max(cameraShake, 0.5);
                playSound("upgrade");
            }

            function showBossUI() {
                finale.hp = finale.maxHp;
                ui.boss.style.display = "block";
                updateBossUI();
            }

            function updateBossUI() {
                const ratio = Math.max(0, finale.hp / finale.maxHp);
                ui.bossFill.style.width = `${ratio * 100}%`;
                ui.bossText.textContent = `${Math.max(0, Math.round(finale.hp)).toLocaleString()} / ${finale.maxHp.toLocaleString()}`;
            }

            function showCta() {
                markRun("cta");
                ctaOpen = true;
                ui.end.classList.add("show");
                playSound("upgrade");
            }

            function openStore() {
                try {
                    window.open(STORE_URL, "_blank");
                } catch (error) {
                    location.href = STORE_URL;
                }
            }

            function flatDistance(a, b) {
                return Math.hypot(a.x - b.x, a.z - b.z);
            }

            function lerpAngle(from, to, amount) {
                let delta = (to - from) % (Math.PI * 2);
                if (delta > Math.PI) delta -= Math.PI * 2;
                if (delta < -Math.PI) delta += Math.PI * 2;
                return from + delta * amount;
            }

            let coinChain = 0;
            let coinChainAt = -9;
            let coinSoundAt = -9;

            // 金币从哪儿产出都走这里：挖矿、打怪、爆炸。三条路径共用同一套「崩出来 → 停一拍 →
            // 飞回背上」，玩家永远不需要走过去捡。
            //
            // burst 放大抛射初速，stagger 拉开每枚的起飞间隔。爆炸传大值，于是同一套代码
            // 在近处是一小簇金币跳一下就回来，在矿墙上是一道喷泉炸开再连成一条金币流。
            function dropCoins(position, count, options = {}) {
                // 钻石和宝石走同一条产出流水线：抛出来、停一拍、按距离飞回玩家。
                // 差别只有外观、落点和进的是哪个账，没有理由为它们各写一套生命周期。
                const gem = options.kind === "gem";
                const shard = options.kind === "shard";
                const grade = shard ? (options.grade || "low") : null;
                // 场上金币过多会拖帧，超出部分直接入账。
                const spare = Math.max(0, CONFIG.maxCoinDrops - coinDrops.length);
                if (count > spare) {
                    if (gem) {
                        gainGems(count - spare);
                    } else if (shard) {
                        shards[grade] += count - spare;
                        ui.shardHud.classList.add("revealed");
                    } else {
                        coins += count - spare;
                        syncBackCoins();
                    }
                    updateUI();
                    count = spare;
                }
                // ghostRatio 加的是只有视觉、不进账的金币。横扫的赏金固定 18 / 30 枚，按真实
                // 枚数抛出来在这个俯视镜头下只是十几个零星光点；「赚了一大笔」靠的是金币流的
                // 密度，而密度不该被经济数值绑死。进账仍然只按 count 算，经济一分不变。
                const room = Math.max(0, CONFIG.maxCoinDrops - coinDrops.length - count);
                const ghosts = Math.min(Math.round(count * (options.ghostRatio || 0)), room);
                const total = count + ghosts;
                const burst = options.burst || 1;
                const stagger = options.stagger || 0;
                const spread = options.spread || 1;
                const dwell = options.dwell === undefined ? CONFIG.coinDwell : options.dwell;
                for (let i = 0; i < total; i++) {
                    const ghost = i >= count;
                    const geometry = shard ? shared.shard : gem ? shared.gem : shared.coin;
                    const material = shard ? shared.shardMats[grade] : gem ? shared.gemMat : shared.coinMat;
                    const mesh = new THREE.Mesh(geometry, material);
                    // 矿石碎片抛得比金币大一号：它一次只掉一颗，混在同时崩出来的一堆金币里
                    // 按同样尺寸抛就认不出来了，而「这一下挖到宝石了」是必须读到的信息。
                    //
                    // 钻石同理，但它撞的不是金币而是尸体碎块：守卫一死，buildDeathDebris 会喷
                    // 十四块 tier.chunkColor 的碎石，寿命 1.1~1.6 秒——正好完整盖住钻石躺在
                    // 地上的那 0.73 秒。低级档尤其糟：碎块 0x37d7a1 和钻石 0x5fe6ff 同属青色系
                    // （中级紫、高级橙都不冲突），而低级档正是玩家第一次见到钻石的地方。
                    // 颜色不能动（钻石的青要和 HUD 的货币图标对上），所以靠体积拉开：
                    // 碎块是 0.22~0.46 的小方块，钻石给到 1.15 就能从那一堆里挑出来。
                    mesh.scale.setScalar(shard ? 1.2 : gem ? 1.15 : 0.85);
                    mesh.position.copy(position).add(new THREE.Vector3(
                        (random() - 0.5) * 1.2 * spread,
                        0.4 + random() * 0.8,
                        (random() - 0.5) * 1.2 * spread
                    ));
                    // 影子金币不投影。横扫时场上会顶到 maxCoinDrops 上限，一百多个投影体
                    // 在移动端是实打实的开销，而这一枚本来就只是用来充数的。
                    mesh.castShadow = !ghost;
                    if (!C_BLOCKS || gem || shard) scene.add(mesh);
                    coinDrops.push({
                        mesh,
                        state: "toss",
                        velocity: new THREE.Vector3(
                            (random() - 0.5) * 4.6 * burst,
                            (4.2 + random() * 2.8) * burst,
                            (random() - 0.5) * 4.6 * burst
                        ),
                        spin: 4 + random() * 6,
                        // 起飞间隔随机而不是按下标递增：按下标的话真金币（下标在前）会整批
                        // 先飞、影子金币再飞，两拨分明；随机打散才混成一条连续的流。
                        dwell: dwell + random() * stagger * total,
                        ghost,
                        gem,
                        shard,
                        grade,
                        t: 0
                    });
                }
            }

            // 起飞参数按距离算，不能给一个定值：0.3 秒在 20 米外糊成一道残影，
            // 0.8 秒在脚边则是一枚慢吞吞飘过来的金币。抛物线高度同理。
            function launchCoinToBack(coin) {
                coin.state = "toBack";
                coin.t = 0;
                coin.start = coin.mesh.position.clone();
                const distance = coin.start.distanceTo(getBackCoinTop());
                coin.duration = THREE.MathUtils.clamp(0.26 + distance * 0.026, 0.26, 0.8);
                coin.arc = Math.min(1.1 + distance * 0.1, 3.6);
            }

            function updateCoins(dt, elapsed) {
                for (let i = coinDrops.length - 1; i >= 0; i--) {
                    const coin = coinDrops[i];
                    if (coin.state === "toss") {
                        coin.velocity.y -= 21 * dt;
                        coin.mesh.position.addScaledVector(coin.velocity, dt);
                        coin.mesh.rotation.z += coin.spin * dt;
                        if (coin.mesh.position.y <= 0.28) {
                            coin.mesh.position.y = 0.28;
                            coin.state = "idle";
                            coin.mesh.rotation.set(Math.PI / 2, 0, random() * Math.PI);
                        }
                        continue;
                    }

                    // 落地后停一拍再起飞。没有这一拍，金币在抛物线顶点就被吸走，
                    // 「东西是从这儿崩出来的」这个信息还没传达完就没了。
                    if (coin.state === "idle") {
                        coin.mesh.position.y = 0.28 + Math.sin(elapsed * 4 + coin.mesh.position.x) * 0.06;
                        coin.mesh.rotation.y += dt * 2.4;
                        coin.dwell -= dt;
                        // 不再判距离。以前 8.5 米外的金币会永远躺在地上等玩家走过去，
                        // 而爆炸和被宠物打死的怪掉的金币基本都落在那个范围之外。
                        if (coin.dwell <= 0) launchCoinToBack(coin);
                        continue;
                    }

                    coin.t = Math.min(1, coin.t + dt / (coin.duration || CONFIG.coinFlyToBackDuration));
                    const target = getBackCoinTop();
                    // 缓入而不是匀速：起步慢、末段猛地窜进背上，读起来才像被吸走的，
                    // 匀速直线只是「移动」。
                    const ease = coin.t * coin.t;
                    coin.mesh.position.lerpVectors(coin.start, target, ease);
                    coin.mesh.position.y += Math.sin(Math.PI * coin.t) * (coin.arc || 1.1);
                    coin.mesh.rotation.y += dt * 12;
                    if (coin.t >= 1) {
                        scene.remove(coin.mesh);
                        coinDrops.splice(i, 1);
                        // 影子金币只负责好看，不进账也不发声：计数器和音阶必须和真实收入对齐，
                        // 否则玩家听着涨了三十级、数字只跳了十下。
                        if (coin.ghost) continue;
                        if (coin.gem) {
                            gainGems(1);
                        } else if (coin.shard) {
                            shards[coin.grade] += 1;
                        } else {
                            coins += 1;
                            syncBackCoins();
                        }
                        updateUI();
                        registerCoinPickup(elapsed, coin);
                    }
                }
            }

            // 连击音阶。同一个「叮」重复二十遍是噪音，音高一级级往上爬才读得出「越拿越多」；
            // 断了 0.35 秒就归零，于是零散挖矿永远停在最低音，只有成批进账才爬得上去。
            function registerCoinPickup(elapsed, coin = {}) {
                // 钻石一局二十几颗、宝石一档不到十颗，每一颗都该被听见，
                // 不参与连击音阶也不被节流——它们的稀有正是要靠「单独响一声」传达的。
                if (coin.gem) {
                    playSound("upgrade", 1.35);
                    popHud(ui.gemHud);
                    return;
                }
                if (coin.shard) {
                    ui.shardHud.classList.add("revealed");
                    playSound("upgrade", 1.62);
                    popHud(ui.shardHud);
                    return;
                }
                if (elapsed - coinChainAt > 0.35) coinChain = 0;
                else coinChain += 1;
                coinChainAt = elapsed;
                // 一次横扫可能同时到账十几枚，逐枚发声会叠成一团糊音，也会堆出几十个振荡器。
                if (elapsed - coinSoundAt >= 0.045) {
                    coinSoundAt = elapsed;
                    playSound("coin", 1 + Math.min(coinChain, 16) * 0.052);
                }
                popHud(ui.coinHud);
            }

            function popHud(element) {
                if (!element) return;
                element.classList.remove("pop");
                // 强制回流，否则同一帧内摘掉再加上 class，浏览器合并成「没变过」，动画不重放。
                void element.offsetWidth;
                element.classList.add("pop");
            }

            function flyCoinTo(position, currency = "coin", grade) {
                const gem = currency === "gem";
                const shard = currency === "shard";
                const geometry = shard ? shared.shard : gem ? shared.gem : shared.coin;
                const material = shard ? shared.shardMats[grade || "low"] : gem ? shared.gemMat : shared.coinMat;
                const mesh = new THREE.Mesh(geometry, material);
                mesh.scale.setScalar(shard ? 1.05 : 0.8);
                // 钻石和宝石都不是背上扛的货，从胸口掏出来，起点不该是金币柱顶。
                mesh.position.copy(gem || shard ? player.position.clone().setY(1.5) : getBackCoinTop());
                scene.add(mesh);
                effects.push({
                    type: "payCoin",
                    mesh,
                    start: mesh.position.clone(),
                    end: position.clone().setY(0.4),
                    life: CONFIG.coinFlyToZoneDuration,
                    maxLife: CONFIG.coinFlyToZoneDuration
                });
            }

            function getSpark(color) {
                for (const mesh of shared.sparkPool) {
                    if (mesh.visible) continue;
                    let material = shared.sparkMaterials.get(color);
                    if (!material) {
                        material = new THREE.MeshBasicMaterial({ color });
                        shared.sparkMaterials.set(color, material);
                    }
                    mesh.material = material;
                    mesh.visible = true;
                    mesh.scale.setScalar(1);
                    return mesh;
                }
                return null;
            }

            function buildPopEffect(position, count, color) {
                for (let i = 0; i < count; i++) {
                    const spark = getSpark(color);
                    if (!spark) return;
                    spark.position.copy(position);
                    effects.push({
                        type: "spark",
                        mesh: spark,
                        velocity: new THREE.Vector3(
                            (random() - 0.5) * 9,
                            2 + random() * 7,
                            (random() - 0.5) * 9
                        ),
                        life: 0.42 + random() * 0.34,
                        maxLife: 0.76
                    });
                }
            }

            function buildDust(position, count, spread, color = 0xb9a9c7) {
                let material = shared.dustMaterials && shared.dustMaterials.get(color);
                if (!material) {
                    material = new THREE.SpriteMaterial({
                        map: shared.dustTexture,
                        color,
                        transparent: true,
                        opacity: 0.5,
                        depthWrite: false
                    });
                    if (!shared.dustMaterials) shared.dustMaterials = new Map();
                    shared.dustMaterials.set(color, material);
                }
                for (let i = 0; i < count; i++) {
                    const sprite = new THREE.Sprite(material.clone());
                    const scale = 0.9 + random() * 1.6;
                    sprite.scale.setScalar(scale);
                    sprite.position.copy(position).add(new THREE.Vector3(
                        (random() - 0.5) * spread,
                        random() * spread * 0.5,
                        (random() - 0.5) * spread
                    ));
                    scene.add(sprite);
                    effects.push({
                        type: "dust",
                        mesh: sprite,
                        velocity: new THREE.Vector3(
                            (random() - 0.5) * 1.6,
                            0.7 + random() * 1.4,
                            (random() - 0.5) * 1.6
                        ),
                        life: 0.6 + random() * 0.6,
                        maxLife: 1.2,
                        growth: 1.6 + random()
                    });
                }
            }

            function createProjectile(origin, target, color, speed, onHit) {
                const mesh = new THREE.Mesh(shared.sphere, new THREE.MeshBasicMaterial({ color }));
                mesh.scale.setScalar(0.62);
                mesh.position.copy(origin);
                scene.add(mesh);
                const trail = new THREE.Mesh(
                    new THREE.ConeGeometry(0.22, 1.1, 8),
                    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.55 })
                );
                mesh.add(trail);
                projectiles.push({ mesh, target, speed, onHit, life: 2.4 });
            }

            function updateProjectiles(dt) {
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const projectile = projectiles[i];
                    projectile.life -= dt;
                    const target = projectile.target;
                    const aim = target.position.clone().add(new THREE.Vector3(0, 2.1, 0));
                    const direction = aim.clone().sub(projectile.mesh.position);
                    const distance = direction.length();
                    if (distance < 0.8 || projectile.life <= 0 || !target.parent) {
                        scene.remove(projectile.mesh);
                        projectiles.splice(i, 1);
                        if (distance < 1.4 && projectile.onHit) projectile.onHit(target);
                        continue;
                    }
                    direction.normalize();
                    projectile.mesh.position.addScaledVector(direction, projectile.speed * dt);
                    projectile.mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
                }
            }

            function updateEffects(dt, elapsed) {
                for (let i = effects.length - 1; i >= 0; i--) {
                    const effect = effects[i];

                    if (effect.delay > 0) {
                        effect.delay -= dt;
                        continue;
                    }

                    effect.life -= dt;
                    const ratio = effect.maxLife ? Math.max(0, effect.life / effect.maxLife) : 0;

                    if (effect.type === "equipmentReveal") {
                        effect.mesh.position.y+=dt*.6;
                        const size=1.5*(.9+.1*Math.sin((1-ratio)*Math.PI));effect.mesh.scale.setScalar(size);
                        if(effect.life<=0){scene.remove(effect.mesh);disposeEquipment(effect.mesh);effects.splice(i,1);}
                        continue;
                    }
                    if (effect.type === "chainBolt") {
                        for (const mesh of effect.mesh.children) mesh.material.opacity = mesh.userData.opacity * ratio;
                        if (effect.life <= 0) {
                            scene.remove(effect.mesh);
                            for (const mesh of effect.mesh.children) { mesh.geometry.dispose(); mesh.material.dispose(); }
                            effects.splice(i, 1);
                        }
                        continue;
                    }

                    if (effect.type === "spark") {
                        effect.velocity.y -= 17 * dt;
                        effect.mesh.position.addScaledVector(effect.velocity, dt);
                        effect.mesh.scale.setScalar(Math.max(0.02, ratio));
                        if (effect.life <= 0) {
                            effect.mesh.visible = false;
                            effects.splice(i, 1);
                        }
                        continue;
                    }

                    if (effect.type === "dust") {
                        effect.mesh.position.addScaledVector(effect.velocity, dt);
                        effect.mesh.scale.setScalar(effect.mesh.scale.x + effect.growth * dt);
                        effect.mesh.material.opacity = 0.5 * ratio;
                        if (effect.life <= 0) {
                            scene.remove(effect.mesh);
                            effect.mesh.material.dispose();
                            effects.splice(i, 1);
                        }
                        continue;
                    }

                    if (effect.type === "chunk") {
                        effect.velocity.y -= 22 * dt;
                        effect.mesh.position.addScaledVector(effect.velocity, dt);
                        effect.mesh.rotation.x += effect.spin.x * dt;
                        effect.mesh.rotation.y += effect.spin.y * dt;
                        effect.mesh.rotation.z += effect.spin.z * dt;
                        if (effect.mesh.position.y < effect.groundY) {
                            effect.mesh.position.y = effect.groundY;
                            effect.velocity.multiplyScalar(0.36);
                            effect.velocity.y = Math.abs(effect.velocity.y) * 0.42;
                        }
                        if (effect.life <= 0) {
                            scene.remove(effect.mesh);
                            effects.splice(i, 1);
                        }
                        continue;
                    }

                    if (effect.type === "arrow") {
                        // 终点每帧跟着目标走。飞行只有 0.09 ~ 0.2 秒，但守卫追击时能跑到
                        // 6.7 m/s，锁死出手那一刻的落点会让箭明显插在怪身后的空地上。
                        if (effect.target.userData.alive) {
                            effect.end.copy(effect.target.position).add(ARROW_AIM_OFFSET);
                        }
                        const t = 1 - ratio;
                        effect.mesh.position.lerpVectors(effect.start, effect.end, t);
                        effect.mesh.lookAt(effect.end);
                        if (effect.life <= 0) {
                            scene.remove(effect.mesh);
                            effect.materials.forEach(mat => mat.dispose());
                            effects.splice(i, 1);
                        }
                        continue;
                    }

                    if (effect.type === "arrowBurst") {
                        // 从给定体积再涨一倍多，而不是从 1 开始涨——初始体积就是等级差。
                        effect.mesh.scale.setScalar(effect.baseScale * (1 + (1 - ratio) * 1.35));
                        effect.material.opacity = 0.85 * ratio;
                        if (effect.life <= 0) {
                            scene.remove(effect.mesh);
                            effect.material.dispose();
                            effects.splice(i, 1);
                        }
                        continue;
                    }

                    if (effect.type === "slash" || effect.type === "flash") {
                        effect.mesh.material.opacity = ratio * (effect.type === "flash" ? 0.7 : 0.9);
                        effect.mesh.scale.setScalar(1 + (1 - ratio) * (effect.type === "flash" ? 3.2 : 0.5));
                        if (effect.life <= 0) {
                            scene.remove(effect.mesh);
                            effects.splice(i, 1);
                        }
                        continue;
                    }

                    if (effect.type === "shockwave") {
                        const grow = 1 + (1 - ratio) * (effect.maxScale - 1);
                        effect.mesh.scale.set(grow, grow, grow);
                        effect.mesh.material.opacity = 0.9 * ratio;
                        if (effect.life <= 0) {
                            scene.remove(effect.mesh);
                            // 原先只是移出场景。破封那几发一局各放一次，漏了也看不出来；
                            // 闪避的光环一局要放几十次，几何和材质都得回收。
                            effect.mesh.geometry.dispose();
                            effect.mesh.material.dispose();
                            effects.splice(i, 1);
                        }
                        continue;
                    }

                    if (effect.type === "breath") {
                        effect.mesh.material.opacity = effect.opacity * ratio;
                        effect.mesh.scale.set(1 + (1 - ratio) * 0.6, 1, 1 + (1 - ratio) * 0.6);
                        if (effect.life <= 0) {
                            scene.remove(effect.mesh);
                            effects.splice(i, 1);
                        }
                        continue;
                    }

                    if (effect.type === "evolvePillar") {
                        effect.mesh.material.opacity = 0.5 * ratio;
                        effect.mesh.rotation.y += dt * 3;
                        if (pet) effect.mesh.position.set(pet.position.x, 7, pet.position.z);
                        if (effect.life <= 0) {
                            scene.remove(effect.mesh);
                            effects.splice(i, 1);
                        }
                        continue;
                    }

                    if (effect.type === "payCoin") {
                        const t = 1 - ratio;
                        effect.mesh.position.lerpVectors(effect.start, effect.end, t);
                        effect.mesh.position.y += Math.sin(Math.PI * t) * 1.6;
                        effect.mesh.rotation.y += dt * 16;
                        if (effect.life <= 0) {
                            scene.remove(effect.mesh);
                            effects.splice(i, 1);
                        }
                        continue;
                    }

                    if (effect.type === "rise") {
                        const t = 1 - ratio;
                        const eased = 1 - Math.pow(1 - t, 3);
                        effect.mesh.position.y = effect.baseY - CONFIG.cityRiseDepth * (1 - eased);
                        if (effect.life <= 0) {
                            effect.mesh.position.y = effect.baseY;
                            effects.splice(i, 1);
                        }
                        continue;
                    }

                    if (effect.type === "sink") {
                        const t = 1 - ratio;
                        effect.mesh.position.y = effect.baseY - CONFIG.cityRiseDepth * t;
                        if (effect.life <= 0) effects.splice(i, 1);
                        continue;
                    }

                    if (effect.type === "floorReveal") {
                        const t = 1 - ratio;
                        const eased = 1 - Math.pow(1 - t, 3);
                        const scale = 0.2 + eased * 0.8;
                        effect.mesh.scale.set(scale, scale, scale);
                        if (effect.life <= 0) {
                            effect.mesh.scale.set(1, 1, 1);
                            effects.splice(i, 1);
                        }
                        continue;
                    }

                    if (effect.life <= 0) effects.splice(i, 1);
                }
            }

            function showDamage(worldPosition, text, big, variant) {
                const point = worldPosition.clone().add(new THREE.Vector3(0, 2.4, 0)).project(camera);
                if (point.z > 1) return;
                const element = document.createElement("div");
                element.className = `damage${big ? " big" : ""}${variant ? ` ${variant}` : ""}`;
                // 绝大多数飘字是伤害数字，查表查不到、原样通过；只有「狂暴」「闪避」会命中。
                element.textContent = t(text);
                element.style.left = `${(point.x * 0.5 + 0.5) * innerWidth}px`;
                element.style.top = `${(-point.y * 0.5 + 0.5) * innerHeight}px`;
                ui.damage.appendChild(element);
                // gold 的 keyframes 跑 1.15 秒，按 760 摘掉会把它拦腰截断。
                setTimeout(() => element.remove(), variant === "gold" ? 1200 : 760);
            }

            function toast(text) {
                if (!text) return;
                // 在出口统一查表，绝大多数 call site 因此一个字都不用改。
                // 带插值的那些句子已经在 call site 用 t(key, params) 拼好了，
                // 到这儿查不到、原样通过——重复查一次是无害的。
                ui.toast.textContent = t(text);
                ui.toast.classList.add("show");
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => ui.toast.classList.remove("show"), 2400);
            }

            function updateUI() {
                ui.power.textContent = power.toLocaleString();
                ui.coin.textContent = coins;
                ui.gem.textContent = gems;
                updateShardHud();
                ui.hpFill.style.width = `${(playerHp / CONFIG.playerMaxHp) * 100}%`;
                ui.hpFill.style.background = playerHp > 55 ? "#58e486" : playerHp > 30 ? "#ffcc4d" : "#ff5c5c";
                if (cityLevel > 0) {
                    ui.cityHud.textContent = t("主城 Lv.{city}　锄头 Lv.{pickaxe}", { city: cityLevel, pickaxe: pickaxeLevel });
                    ui.cityHud.classList.add("show");
                }
            }

            // 宝石只占一个计数器，显示的永远是**当前锄头要收的那一档**，图标跟着换色。
            //
            // 三档各摆一个数字试过，读不了：屏幕右上角已经有金币和钻石，再加三行就是六个数字，
            // 而其中至少两行是作废的存货——玩家会把它们当成还能花的钱。写成 have/need 是同一个
            // 理由的延伸：这个数唯一的用途是「还差几颗」，直接把答案摆出来，不让人做减法。
            function updateShardHud() {
                if (!ui.shardHud) return;
                const grade = ECON.shards ? requiredShardGrade() : null;
                if (!grade) {
                    ui.shardHud.classList.add("spent");
                    return;
                }
                ui.shardHud.classList.remove("spent");
                const need = ECON.pickaxeCost[pickaxeLevel - 1] || 0;
                ui.shard.textContent = `${shards[grade]}/${need}`;
                const css = SHARD_GRADES[grade].css;
                ui.shardIcon.style.background = css;
                ui.shardIcon.style.boxShadow = `0 0 11px ${css}`;
                ui.shardHud.style.borderColor = css;
            }

            function setTutorial(visible, copy) {
                tutorialVisible = visible;
                if (copy) ui.tutorialCopy.textContent = t(copy);
                ui.tutorial.style.display = visible ? "flex" : "none";
                requestAnimationFrame(() => {
                    ui.tutorial.style.opacity = visible ? "1" : "0";
                });
            }

            function getGuideTarget() {
                const goal = getGuideGoal();
                if (!goal) return goal;
                return steerAroundSolids(goal);
            }

            // 直线上有挡路的碰撞圈时，把箭头挪到能绕过去的落点上。
            //
            // 城里已经不需要绕了：玩家能走到的那块 T 形地（CITY_CLEAR）里一个碰撞体都没有，
            // 从出生点到地贴、地贴到出城口全是直线。这个函数现在只服务矿区——扇形两侧的岩壁、
            // 散落的装饰石头、还有堵在路上的怪。原先那套按 CITY_LANES 走的绕城侧道
            // （routeThroughCity）连同它的滞后状态一起删了，地贴北移之后它永远不会触发。
            function steerAroundSolids(target) {
                const blocker = findPathBlocker(target);
                // 挡路的还在七米开外就先直着走，走近了再绕：远远地就开始横移看着莫名其妙，
                // 而且那么远的落点多半在走到之前就已经不挡路了。
                if (!blocker || blocker.along > 7) {
                    guideLeanAnchor = null;
                    return target;
                }
                const { ux, uz } = blocker;

                // 绕行方向必须有记忆，而且一旦开始绕就沿同一侧绕到底。正对圆心时两侧代价完全一样，
                // 每帧重挑会让箭头左右跳，两个方向的推杆互相抵消，人贴着主堡原地发抖；
                // 按「当前挡路那栋」重挑也不行，主堡和旁边民房会轮流当挡路的那栋，人在两栋之间打转。
                // 走出建筑群（前方再没有挡路的圆）时才把方向交还给下一次重选。
                if (!guideLeanAnchor) guideLean = blocker.side > 0 ? -1 : 1;
                guideLeanAnchor = blocker.collider;

                // 房子是连成排的，绕开一栋常常正好撞上隔壁那栋。所以从挡路那栋的边上起，
                // 沿侧向一米一米往外探，指到第一个真正空出来的落点上；这一步走完下一帧自然重新指目标。
                // 落点只往侧面挪，不往前推。推到障碍另一侧的话，走过去的那条直线照样穿过它，
                // 人会一路擦着墙被推回来（实测就是在主堡和民房之间来回弹）。
                // 先纯横向让开这栋的横截面，等它不挡路了下一帧自然指回目标。
                const spot = new THREE.Vector3();
                for (let reach = 0; reach <= 12; reach += 1) {
                    for (const lean of [guideLean, -guideLean]) {
                        // 让开的距离带个下限：几何上挪一米就够躲开横截面了，但那么近的落点
                        // 会被自动走位当成「已经到了」，人直接停在障碍边上不动。
                        const clear = Math.max(blocker.clearance + 0.6 + reach, 2.8 + Math.abs(blocker.side));
                        const shift = blocker.side + lean * clear;
                        spot.set(
                            player.position.x - uz * shift,
                            0,
                            player.position.z + ux * shift
                        );
                        if (!isWalkableSpot(spot) || insideSolids(spot)) continue;
                        guideLean = lean;
                        return spot.clone();
                    }
                }
                return target;
            }

            // 从人到目标的直线上第一个挡路的圆。
            function findPathBlocker(target) {
                const toX = target.x - player.position.x;
                const toZ = target.z - player.position.z;
                const span = Math.hypot(toX, toZ);
                if (span < 1.2) return null;
                const ux = toX / span;
                const uz = toZ / span;
                let blocker = null;
                for (const collider of solidColliders) {
                    if (collider.radius <= 0) continue;
                    const clearance = collider.radius + CONFIG.playerRadius + 0.25;
                    const relX = collider.x - player.position.x;
                    const relZ = collider.z - player.position.z;
                    const along = relX * ux + relZ * uz;
                    if (along <= 0.2 || along >= span) continue;
                    // 到路径的横向距离，带符号：正是路径的左手侧。
                    const side = relZ * ux - relX * uz;
                    if (Math.abs(side) >= clearance) continue;
                    // 目标本来就贴在这块石头边上，绕不开也不用绕，否则箭头会绕着它打转。
                    if (Math.hypot(target.x - collider.x, target.z - collider.z) < clearance) continue;
                    if (!blocker || along < blocker.along) {
                        blocker = { collider, along, side, clearance, ux, uz };
                    }
                }
                return blocker;
            }

            function insideSolids(point) {
                for (const collider of solidColliders) {
                    if (collider.radius <= 0) continue;
                    const gap = collider.radius + CONFIG.playerRadius + 0.15;
                    if ((point.x - collider.x) ** 2 + (point.z - collider.z) ** 2 < gap * gap) return true;
                }
                return false;
            }

            function isWalkableSpot(point) {
                const radius = Math.hypot(point.x, point.z);
                if (radius > CONFIG.arenaRadius - 2.4) return false;
                if (radius <= SECTOR.freeRadius) return true;
                return Math.abs(signedAngleDelta(Math.atan2(point.z, point.x), SECTOR.center)) <= SECTOR.half;
            }

            // 目标途中若存在当前锄头凿不动的矿层，就先完成前置升级。
            // 已清空的矿层不再阻挡；C 则以尚未开放的区块边界为准。
            function canGuideToPosition(target) {
                if (C_BLOCKS) return target.z >= blockFront();
                const from = Math.hypot(player.position.x, player.position.z);
                const to = Math.hypot(target.x, target.z);
                const near = Math.min(from, to), far = Math.max(from, to);
                return !oreRings.some(ring => ring.remaining > 0 &&
                    ORE_TIERS[ring.tierId].requiredPickaxe > pickaxeLevel &&
                    near < ring.outerRadius && far > ring.innerRadius);
            }

            function getGuideGoal() {
                if (C_BLOCKS) return blockGuideGoal();
                if (cityLevel === 0) {
                    const build = zones.find(z => z.id === "city-build");
                    if (build && coins < build.cost - build.paid) {
                        const mine = getNearestOre("low");
                        if (mine) return guideThroughGate(oreGuidePoint(mine));
                    }
                    return new THREE.Vector3(TILE_SLOTS["city-build"].x, 0, TILE_SLOTS["city-build"].z);
                }
                if (finaleStarted) return null;
                if (ultimateCharge && !ultimateCharge.locked) return guideThroughGate(ultimateCharge.home.clone());

                const hatcheryZone = zones.find(zone => zone.id === "hatchery" && !zone.complete);

                // 蛋改成固定点之后，它从开局第一帧就摆在半径 32.45 上了（见 spawnFixedEgg），
                // 所以这条不能再是「场上有蛋就指过去」——那会在开局就把玩家带向三十米外，
                // 而通往那儿的中级矿墙要二级锄头才凿得开。实测的表现是整局卡死在墙前：
                // 城停在 Lv1、低级矿只挖了 11.8%，因为箭头从没指过城里任何一张地贴。
                //
                // 门槛挂在孵化台上：孵化台亮着，「去把蛋捡回来」才是一件玩家做得完的事。
                // 免费孵化常驻后，先处理城内可付的地贴，再引导捡蛋。

                // 箭头只认「现在就付得起、而且轮得到」的地贴，否则玩家会被指着一个收不了钱的格子干站着。
                //
                // group.visible 是必须判的：被反向门和钻石单轨收起来的地贴仍然留在 zones 里
                // （撤掉的话付款进度会丢），isZonePayable 看不见这一层，光靠它箭头会指向
                // 一张玩家眼前根本不存在的贴。updateZones 和 ensureProgressAffordable 都判了这个。
                const ready = zone => Boolean(zone) && zone.group.visible && !zone.complete &&
                    !zone.requiresReentry && isZonePayable(zone) && canGuideToPosition(zone.position) &&
                    walletOf(tileCurrency(zone.id)) >= zone.cost - zone.paid;

                const hatchery = hatcheryZone;
                if (carryingEgg && ready(hatchery)) return hatchery.position.clone();

                // 进化台在封印走廊里（见 TILE_SLOTS.evolve），所以和矿点、献祭点一样要走
                // guideThroughGate：玩家此刻很可能还在城里，直接指过去就是一条穿城墙的直线。
                const evolve = zones.find(zone => zone.id === "evolve" && !zone.complete);
                if (ready(evolve)) return guideThroughGate(evolve.position.clone());

                // 锻造台排在宠物线之后、其余一切之前。
                //
                // 这儿原先有一整套「买完这一级、宠物线还买不买得起」的预算判断
                // （连带 pendingGuardGems 的前瞻）。钻石单轨落地之后那套整个作废了：
                // 锻造台和孵化、进化现在任何时刻只有一张亮着（见 forgeWindowOpen），
                // 「挤掉宠物线」这件事在结构上就不可能发生，不必再靠余额去防。
                // 留着的话它是一段永远为真的判断，读起来却像还在保护什么。
                //
                // requiresReentry 期间不指：刚买完那一级时玩家正站在贴上，此时指着它
                // 会让他在原地卡住（那个标志要走出去才会解除）。指开一帧，他自然会离开。
                const forge = zones.find(zone => zone.id === "forge" && !zone.complete);
                if (ready(forge) && !forge.requiresReentry) return forge.position.clone();

                // 献祭点和封印墙排在所有地贴和矿点之前——它一出现就是整局唯一该去的地方，
                // 剩下的矿这时已经被 Lv4 的横扫清空了。
                //
                // 已激活时指墙本身而不是那张已经撤掉的地贴：这两个点只差 1.6 米，指哪儿
                // 玩家都走得到，但箭头落在墙上才说得清「要砸的是它」。
                if (sealArmed) {
                    const sealNode = oreNodes
                        .filter(node => node.tierId === SEALED_TIER && !node.cleared)
                        .sort((a, b) => flatDistance(a.position, player.position) -
                            flatDistance(b.position, player.position))[0];
                    if (sealNode) return guideThroughGate(oreGuidePoint(sealNode));
                }
                const waveTarget = enemies.find(e => e.userData.wave && e.userData.alive);
                if (waveTarget) return guideThroughGate(waveTarget.position.clone());
                const seal = zones.find(zone => zone.id === "seal" && !zone.complete);
                if (ready(seal)) return guideThroughGate(seal.position.clone());

                // 交替顺序由 isZonePayable 保证，这里只需要按「先锄头后扩城」挑当前那一步。
                // 仍然走 guideThroughGate：锄头贴留着「最后一级换槽位」的接缝（见 tileSlot），
                // 换出去就可能落在城外。目标在自由圆里时它直接原样返回，城内这条不受影响。
                const pickaxe = zones.find(zone => zone.id === "pickaxe" && !zone.complete);
                if (ready(pickaxe)) return guideThroughGate(pickaxe.position.clone());

                const upgrade = zones.find(zone => zone.id === "city-upgrade" && !zone.complete);
                if (ready(upgrade)) return upgrade.position.clone();

                // 炸药桶排在矿点之前。它就摆在出城进矿区的必经点上，绕路为零，而箭头
                // 不指的话玩家很可能从旁边走过去——那就退回了「奖励发生了但没人看见」。
                //
                // 点着之后箭头也得继续钉在桶上，直到炸开为止。早先只判 !lit，结果引线一着
                // 箭头就改指下一处矿点，玩家转身就走，一秒后整道墙在他背后塌掉——正是这个
                // 改动本来要解决的毛病，只是从「没走到」换成了「已经走开」。
                if (sweepCharge) return guideThroughGate(sweepCharge.home.clone());

                // 钻石不够就先指守卫，排在矿之前。钻石只从守卫身上掉，而挖矿一颗也挖不出来——
                // 这时候指矿是在把玩家往一条走不通的路上带：他会一直挖到整层矿见底，
                // 才在「没矿可挖了」的兜底分支里被指去打怪。
                //
                // 这条分支同时替掉了原来那道「守卫活着就凿不动」的硬墙。硬墙保证的是供给的
                // 确定性（不打完就别想往下挖），代价是玩家读不出理由；改成引导之后保证换成了
                // 「想升级锄头的那一刻，箭头就指着能拿到钻石的那只怪」，配合地贴上的提示，
                // 因果链是他自己看明白的，而不是被拦出来的。
                //
                // 找不到活守卫时自然落到下面的矿分支：守卫都还冻在矿里，得先凿穿把它唤醒。
                // 这正好是这一版想要的节奏——挖矿、凿穿、怪跳出来、打它拿钻石、回城升锄头。
                if (ECON.gems) {
                    // 锻造台要在这张名单里。它现在是钻石的第一个出口（主城 Lv2 就亮），
                    // 而且卡着下一级城——漏掉的话玩家会被指去挖矿攒一笔挖不出来的钱。
                    // 判可见性是因为单轨会把它收起来，收起来的时候不该替它指路。
                    const short = [forge, pickaxe, hatchery, evolve].some(zone => zone &&
                        zone.group.visible && tileCurrency(zone.id) === "gem" &&
                        isZonePayable(zone) && gems < zone.cost - zone.paid);
                    if (short) {
                        const guard = enemies.filter(e => e.userData.alive && e.userData.attackable &&
                            e.userData.type === "monster" && canGuideToPosition(e.position))
                            .sort((a, b) => flatDistance(a.position, player.position) - flatDistance(b.position, player.position))[0];
                        if (guard) return guideThroughGate(guard.position.clone());
                    }
                }

                // 缺宝石时指向**还埋着这一档宝石的**矿段，排在普通矿分支之前。
                //
                // 不能退回「指最近的矿」：getGuideOreTarget() 挑的是锄头能挖的最高一层，
                // 而缺的那一档来自更低的层——玩家会被一路指着往深处走，越走离要找的宝石越远。
                // 也不能只按层指：同一层里有的段早被掏空了，指过去是一堵没货的墙。
                if (ECON.shards && pickaxe && pickaxe.group.visible && isZonePayable(pickaxe) && tileCurrency("pickaxe") === "shard") {
                    const grade = requiredShardGrade();
                    if (grade && shards[grade] < pickaxe.cost - pickaxe.paid) {
                        const node = nearestShardNode(grade);
                        if (node) return guideThroughGate(oreGuidePoint(node));
                    }
                }

                // 收集升级材料优先于可选的龙蛋；孵化台出现不代表通往蛋的矿层已能凿开。
                if (cityLevel >= 3 && !pet && !carryingEgg && eggPickup &&
                    hatcheryZone && hatcheryZone.group.visible && canGuideToPosition(eggPickup.mesh.position)) {
                    return guideThroughGate(eggPickup.mesh.position.clone());
                }

                const ore = getGuideOreTarget();
                if (ore) {
                    // 守卫堵着这一段时必须指人，不能指矿。一段矿墙横跨十几米、守卫站在段中心，
                    // 玩家从段的一端靠过去时它常常在自动索敌范围（5.8 米）之外——引导指矿就把人
                    // 按在一堵凿不动的墙前面无限弹开，而堵路的那个东西在十米开外站着。
                    // （`guardBlocksSegment` 现在默认关着，这条只在把它翻回来时才生效。）
                    if (guardBlocking(ore)) return guideThroughGate(ore.monster.position.clone());
                    return guideThroughGate(oreGuidePoint(ore));
                }

                // 刚付款后需要离开地贴再进入，给一个可走的离场点，不能继续指地贴中心。
                for (const zone of [pickaxe, forge, upgrade, hatchery, evolve, seal]) {
                    if (!zone || !zone.group.visible || zone.complete || !isZonePayable(zone) ||
                        !zone.requiresReentry || !canGuideToPosition(zone.position) ||
                        walletOf(tileCurrency(zone.id)) < zone.cost - zone.paid) continue;
                    for (const dx of [3.2, -3.2]) {
                        const exit = zone.position.clone().add(new THREE.Vector3(dx, 0, 0));
                        if (isWalkableSpot(exit) && !insideSolids(exit) &&
                            !pathCrossesOre(player.position, exit, CONFIG.playerRadius)) return exit;
                    }
                }
                // 资源暂未到账或不存在可执行步骤时不指向隐藏、锁定、缺材料的设施。
                return null;
            }

            // 屏幕边缘的小箭头容易被忽略，地面上再铺一串朝目标推进的光箭头。
            // 尖端在 shape 的 -Y：躺平后正好指向 +Z，方向就能直接用 atan2(x, z)，和角色朝向同一套约定。
            function createGroundGuide() {
                const shape = new THREE.Shape();
                shape.moveTo(0, -0.62);
                shape.lineTo(0.75, 0.25);
                shape.lineTo(0.42, 0.56);
                shape.lineTo(0, -0.06);
                shape.lineTo(-0.42, 0.56);
                shape.lineTo(-0.75, 0.25);
                shape.closePath();
                const geometry = new THREE.ShapeGeometry(shape);

                groundGuide = new THREE.Group();
                groundGuide.visible = false;
                groundGuide.userData.arrows = [];
                for (let i = 0; i < 3; i++) {
                    const arrow = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({
                        color: 0x9ff0ff,
                        transparent: true,
                        opacity: 0,
                        depthWrite: false,
                        side: THREE.DoubleSide
                    }));
                    arrow.rotation.x = -Math.PI / 2;
                    arrow.position.y = 0.07;
                    arrow.renderOrder = 3;
                    groundGuide.add(arrow);
                    groundGuide.userData.arrows.push(arrow);
                }
                scene.add(groundGuide);
            }

            function updateGroundGuide(target) {
                if (!groundGuide) return;
                const direction = target ? target.clone().sub(player.position).setY(0) : null;
                const distance = direction ? direction.length() : 0;
                if (!direction || distance < 2.8) {
                    groundGuide.visible = false;
                    return;
                }
                groundGuide.visible = true;
                groundGuide.position.copy(player.position).setY(0);
                groundGuide.rotation.y = Math.atan2(direction.x / distance, direction.z / distance);

                // 行程和数量都跟着距离走：开局到第一个地贴只有六米，铺满三个会挤成一坨；
                // 起点也得离玩家远一点，俯视视角下贴着脚边的箭头会被角色自己挡住。
                const arrows = groundGuide.userData.arrows;
                const first = 2.2;
                const travel = Math.min(Math.max(distance - 1.6, first + 1.2) - first, 5.4);
                const count = Math.max(1, Math.min(arrows.length, 1 + Math.floor(travel / 2)));
                for (const [index, arrow] of arrows.entries()) {
                    arrow.visible = index < count;
                    if (!arrow.visible) continue;
                    // 箭头顺着路径往前淌，两端淡出接上循环：静止的箭头不如流动的有牵引力，
                    // 末端淡出也顺带避开目标身上的「0/10」这类读数。
                    const phase = ((guideFlow * 2 + (index * travel) / count) % travel) / travel;
                    arrow.position.z = first + phase * travel;
                    arrow.material.opacity = 0.14 + Math.min(1, phase * 5, (1 - phase) * 4.5) * 0.68;
                }
            }

            function updateGuide(dt) {
                guideFlow += dt;
                if (ctaOpen || cinematic.active) {
                    ui.guide.style.display = "none";
                    updateGroundGuide(null);
                    return;
                }
                const target = getGuideTarget();
                // 地面箭头在开局画面就要亮着：它的作用就是让玩家迈出第一步。
                updateGroundGuide(target);
                if (!started || !target) {
                    ui.guide.style.display = "none";
                    return;
                }
                const distance = flatDistance(target, player.position);
                if (distance < 4) {
                    ui.guide.style.display = "none";
                    return;
                }
                const direction = target.clone().sub(player.position).setY(0).normalize();
                const anchor = player.position.clone().addScaledVector(direction, 3.4).setY(1.4);
                const point = anchor.project(camera);
                const ahead = player.position.clone().addScaledVector(direction, 4.6).setY(1.4).project(camera);
                ui.guide.style.display = "block";
                ui.guide.style.left = `${(point.x * 0.5 + 0.5) * innerWidth}px`;
                ui.guide.style.top = `${(-point.y * 0.5 + 0.5) * innerHeight}px`;
                const angle = Math.atan2(-(ahead.y - point.y), ahead.x - point.x) + Math.PI / 2;
                ui.guide.style.transform = `translate(-50%, -50%) rotate(${angle}rad)`;
                ui.guide.style.opacity = `${0.72 + Math.sin(performance.now() * 0.005) * 0.22}`;
            }

            function updateTorches(elapsed) {
                for (const stage of city.stages) {
                    if (!stage.built) continue;
                    for (const prop of stage.props) {
                        const flame = prop.userData.flame;
                        if (!flame) continue;
                        flame.scale.setScalar(0.9 + Math.sin(elapsed * 9 + prop.position.x) * 0.14);
                    }
                }
            }

            function setupInput() {
                addEventListener("resize", onResize);
                addEventListener("keydown", event => {
                    const key = event.key.toLowerCase();
                    // 面板热键要抢在 startGame() 之前返回，否则开局前按一下就把游戏开起来了。
                    // 在数字框里敲值时也不能被当成热键或移动键。
                    const typing = event.target && /^(input|textarea)$/i.test(event.target.tagName);
                    if (!typing && (key === "`" || key === "~")) {
                        event.preventDefault();
                        toggleTuner();
                        return;
                    }
                    if (typing) return;
                    if (key === "w" || key === "arrowup") keys.w = true;
                    if (key === "s" || key === "arrowdown") keys.s = true;
                    if (key === "a" || key === "arrowleft") keys.a = true;
                    if (key === "d" || key === "arrowright") keys.d = true;
                    startGame();
                });
                addEventListener("keyup", event => {
                    const key = event.key.toLowerCase();
                    if (key === "w" || key === "arrowup") keys.w = false;
                    if (key === "s" || key === "arrowdown") keys.s = false;
                    if (key === "a" || key === "arrowleft") keys.a = false;
                    if (key === "d" || key === "arrowright") keys.d = false;
                });

                if (window.nipplejs) {
                    joystick = nipplejs.create({
                        zone: document.body,
                        mode: "dynamic",
                        color: "#7fd8ff",
                        size: 118,
                        restJoystick: true
                    });
                    joystick.on("start", () => startGame());
                    joystick.on("move", (event, data) => {
                        if (!data || !data.vector) return;
                        stick.x = data.vector.x;
                        stick.z = -data.vector.y;
                        stick.magnitude = Math.min(1, data.force / 1.6);
                    });
                    joystick.on("end", () => {
                        stick.x = stick.z = stick.magnitude = 0;
                    });
                }

                document.getElementById("restart").addEventListener("click", event => {
                    event.stopPropagation();
                    location.reload();
                });
                const download = document.getElementById("download");
                download.addEventListener("pointerdown", event => event.stopPropagation());
                download.addEventListener("click", event => {
                    event.stopPropagation();
                    openStore();
                });
                const replay = document.getElementById("replay");
                replay.addEventListener("pointerdown", event => event.stopPropagation());
                replay.addEventListener("click", event => {
                    event.stopPropagation();
                    location.reload();
                });

                // 面板整层都要拦住 pointerdown：全局那个监听器会把落在面板上的点击当成
                // 「开始游戏」，拖个滑块就把开局给触发了。同理摇杆也会跟着面板上的拖动跑。
                [ui.tuner, ui.tunerToggle].forEach(node => {
                    if (!node) return;
                    // nipplejs 挂在 body 上，且不一定用 pointer 事件；三种都拦掉，
                    // 否则在面板上拖滑块会在背后甩出一个摇杆，人跟着跑。
                    ["pointerdown", "mousedown", "touchstart"].forEach(type => {
                        node.addEventListener(type, event => event.stopPropagation());
                    });
                });
                ui.tunerToggle.addEventListener("click", event => {
                    event.stopPropagation();
                    toggleTuner();
                });
                document.getElementById("tuner-close").addEventListener("click", () => toggleTuner(false));
                document.getElementById("tuner-reload-go").addEventListener("click", () => location.reload());
                document.getElementById("tuner-save").addEventListener("click", saveTuningToFile);
                document.getElementById("tuner-export").addEventListener("click", exportTuning);
                document.getElementById("tuner-reset").addEventListener("click", resetTuning);

                addEventListener("pointerdown", () => startGame(), { passive: true });
                setTutorial(true, "拖动摇杆移动，走进光圈建设主城");
            }

            // 仅用于节奏测量：按引导箭头的目标自动走位，攻击与拾取仍走正常逻辑。
            function autoPilot() {
                if (!autoRun) return;
                const target = getGuideTarget();
                if (!target) {
                    stick.x = 0;
                    stick.z = 0;
                    stick.magnitude = 0;
                    return;
                }
                const delta = target.clone().sub(player.position).setY(0);
                const distance = delta.length();
                const tileTarget=C_BLOCKS && zones.some(z=>z.group.visible && !z.complete && flatDistance(z.position,target)<.05);
                if (distance <= (tileTarget ? Math.min(.8,CONFIG.zoneTileSize*.25) : 1.6)) {
                    stick.x = 0;
                    stick.z = 0;
                    stick.magnitude = 0;
                    return;
                }
                delta.normalize();
                stick.x = delta.x;
                stick.z = delta.z;
                stick.magnitude = 1;
            }

            // 用累计 dt 而不是墙钟：失焦节流时墙钟照走，会把停滞算进节奏数据。
            // 影响流程的延时回调走游戏时间，不走 setTimeout：
            // 墙钟计时在暂停/演出/步进模拟下都会跑偏，挖矿命中和地贴完成必须跟着 dt 走。
            function defer(delay, fn) {
                deferredCalls.push({ left: delay, fn });
            }

            function updateDeferred(dt) {
                for (let i = deferredCalls.length - 1; i >= 0; i--) {
                    const item = deferredCalls[i];
                    item.left -= dt;
                    if (item.left > 0) continue;
                    deferredCalls.splice(i, 1);
                    item.fn();
                }
            }

            function markRun(label) {
                if (!runStart) return;
                runMarks.push({ label, at: Number(runClock.toFixed(1)) });
            }

            function startGame() {
                if (opening.active) finishOpeningReveal();
                if (started) return;
                started = true;
                runStart = performance.now();
                ensureAudio();
                if (!tutorialDone) setTutorial(true, "走进光圈，建设你的主城");
            }

            function ensureAudio() {
                if (audioCtx) return;
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (error) {
                    audioCtx = null;
                }
            }

            // pitch 是频率倍率。金币连着进账时靠它把音高一级级往上推——同一个「叮」重复二十遍
            // 是噪音，音阶往上爬才读得出「越拿越多」。
            function playSound(type, pitch = 1) {
                soundLog[type] = (soundLog[type] || 0) + 1;
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                const oscillator = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                oscillator.connect(gain);
                gain.connect(audioCtx.destination);

                const presets = {
                    attack: { wave: "triangle", from: 320, to: 180, gain: 0.05, duration: 0.11 },
                    crack: { wave: "square", from: 220, to: 90, gain: 0.045, duration: 0.09 },
                    hit: { wave: "sawtooth", from: 180, to: 70, gain: 0.075, duration: 0.19 },
                    break: { wave: "sawtooth", from: 140, to: 42, gain: 0.1, duration: 0.42 },
                    clang: { wave: "square", from: 1240, to: 660, gain: 0.05, duration: 0.14 },
                    // 敌人死亡。原先它和碎矿共用 break，而 break 同时还管横扫爆炸和巨龙破封——
                    // 一个音干四份活，结果「打死一只守卫」和「凿穿一根矿柱」听上去一模一样。
                    // 那不是缺音效，是有音效但不带信息，而守卫恰恰是钻石的唯一来源、
                    // 也是矿墙推进的那道门，这一下必须能单独听出来。
                    //
                    // 和 break（140→42，一开口就在低频，读作石头）拉开的办法是起点抬高、
                    // 扫得更长：300→48 是一声往下掉的叫，读作「一个活物没了」。
                    // 游荡怪走同一个音色但 pitch 抬高（见 killEnemy）——体型小的叫得高，
                    // 顺手把杂兵和守卫也分开了。
                    slay: { wave: "sawtooth", from: 300, to: 48, gain: 0.11, duration: 0.52 },
                    coin: { wave: "sine", from: 880, to: 1320, gain: 0.045, duration: 0.1 },
                    upgrade: { wave: "sine", from: 420, to: 960, gain: 0.075, duration: 0.34 },
                    hurt: { wave: "square", from: 240, to: 90, gain: 0.07, duration: 0.19 },
                    warn: { wave: "sine", from: 180, to: 260, gain: 0.05, duration: 0.22 },
                    // 闪避。频率上扬读作「成功」，而 hurt 是下降的方波——两个音
                    // 会在同一秒内先后响（躲开这一下、旁边那只怪打中你），必须一听就分得开。
                    perfect: { wave: "sine", from: 1320, to: 1980, gain: 0.062, duration: 0.16 },
                    ice: { wave: "sine", from: 1180, to: 620, gain: 0.05, duration: 0.2 },
                    fire: { wave: "sawtooth", from: 260, to: 120, gain: 0.09, duration: 0.6 },
                    roar: { wave: "sawtooth", from: 120, to: 46, gain: 0.12, duration: 0.9 }
                };
                const preset = presets[type] || presets.attack;
                oscillator.type = preset.wave;
                oscillator.frequency.setValueAtTime(preset.from * pitch, now);
                oscillator.frequency.exponentialRampToValueAtTime(Math.max(20, preset.to * pitch), now + preset.duration);
                gain.gain.setValueAtTime(preset.gain, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + preset.duration);
                oscillator.start(now);
                oscillator.stop(now + preset.duration + 0.02);
            }

            function onResize() {
                camera.aspect = innerWidth / innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
            }

            // ── 调参面板 ──────────────────────────────────────────────────────
            //
            // 面板直接读写上面那几张表本身，不维护第二份副本。副本会漂移：调完之后没人分得清
            // 究竟是表在生效还是副本在生效，而这个游戏一半的数值是每帧现读的。
            //
            // 三层数据：文件里的原值（tuningDefaults，启动时快照）、玩家改过的值
            // （tuningOverrides，进 localStorage）、当前生效值（就是表本身）。有了原值才能
            // 做「回默认」和「只导出改过的那些」——后者是为了把面板里拖出来的结果搬回源码。

            // 调参面板和 __wik.tune() 的共同根。TUNING_SCHEMA 里的 path 从这里查起，
            // 所以新增一组配置想能拖，就得挂进来。
            // ECON 是当前生效的经济预设（ECONOMY_PRESETS 里的一份引用），调试时按它读最直接。
            function tuningRoot() {
                return {
                    CONFIG, BALANCE, ORE_TIERS, CITY_STAGES,
                    PICKAXE_LEVELS, WEAPON_LEVELS, ECONOMY_PRESETS, ECON,
                    ROVER_LANES, ROVER_RANGE, ROVER_PATROLS, GUARD_CHASE, DEEP_VEINS, ARPG
                };
            }

            function tuningFields() {
                return TUNING_SCHEMA.reduce((all, group) => all.concat(group.fields), []);
            }

            function readTunePath(path) {
                return path.split(".").reduce((node, key) => (node == null ? node : node[key]), tuningRoot());
            }

            function writeTunePath(path, value) {
                const keys = path.split(".");
                const leaf = keys.pop();
                const host = keys.reduce((node, key) => (node == null ? node : node[key]), tuningRoot());
                if (host) host[leaf] = value;
            }

            function setupTuning() {
                tuningDefaults = {};
                tuningFields().forEach(field => { tuningDefaults[field.path] = readTunePath(field.path); });
                try {
                    tuningOverrides = JSON.parse(localStorage.getItem(TUNING_STORE)) || {};
                } catch (err) {
                    tuningOverrides = {};
                }
                // schema 改过之后旧存档里可能留着已经不存在的路径，留着会污染「改过几项」的计数。
                Object.keys(tuningOverrides).forEach(path => {
                    if (!(path in tuningDefaults)) delete tuningOverrides[path];
                });
                Object.entries(tuningOverrides).forEach(([path, value]) => writeTunePath(path, value));
            }

            function saveTuning() {
                try {
                    localStorage.setItem(TUNING_STORE, JSON.stringify(tuningOverrides));
                } catch (err) {
                    // 隐私模式下 localStorage 会抛异常。调参照样能用，只是重载后回默认值。
                }
            }

            function buildTuner() {
                if (!ui.tunerBody) return;
                ui.tunerBody.innerHTML = "";
                tuneRows.clear();
                TUNING_SCHEMA.forEach(group => {
                    const box = document.createElement("details");
                    box.className = "tune-group";
                    box.open = Boolean(group.open);
                    const head = document.createElement("summary");
                    head.textContent = group.label;
                    box.appendChild(head);
                    if (group.note) {
                        const note = document.createElement("div");
                        note.className = "tune-note";
                        note.textContent = group.note;
                        box.appendChild(note);

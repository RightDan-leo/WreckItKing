                        return [
                            Math.round((q.x + 1) / 2 * renderer.domElement.clientWidth),
                            Math.round((1 - q.y) / 2 * renderer.domElement.clientHeight)
                        ];
                    },
                    cfg: () => CONFIG,
                    // 所有可调表的引用，不是拷贝——在控制台上直接改字段就生效。
                    // 注意生效时机：hardness / cellsPerCoin / sweepBounty / 伤害 / coinToss
                    // 是每次用到时才读的，改完立刻算数；ORE_TIERS 的几何（ringRadius、grid）
                    // 和守卫血量在建场时就烘进去了，要重载页面；地贴价格在下一块地贴亮起时才取。
                    // 和调参面板共用一张表。这两处原先各写一份，已经飘了：这边有 ECON、
                    // 那边有 GUARD_CHASE，于是新加的配置在其中一处必然是隐形的
                    // ——面板里拖不到，或者 __wik.tune() 里读不到，而且两种都不报错。
                    tune: () => tuningRoot(),
                    marks: () => runMarks,
                    auto: (on = true) => {
                        autoRun = on;
                        // 关掉时把摇杆归零。自动流程是靠每帧写 stick 驱动玩家的，不清的话
                        // 它会拿着最后那一帧的方向一直走——调试时的表现是「明明关了自动，
                        // tp 过去又自己跑回来了」，而这个现象太容易被误读成 tp 没生效，
                        // 从而把时间花在排查一个不存在的问题上。
                        if (!on) { stick.x = 0; stick.z = 0; stick.magnitude = 0; }
                        return autoRun;
                    },
                    sweep: (on = true) => { sweepEnabled = on; return sweepEnabled; },
                    ultimate: () => ultimateCharge && ({locked: ultimateCharge.locked, lockVisible: ultimateCharge.lock.visible, lit: ultimateCharge.lit, x: ultimateCharge.home.x, z: ultimateCharge.home.z}),
                    waveEnemies: () => enemies.filter(e => e.userData.wave && e.userData.alive).map(e => ({x:e.position.x,z:e.position.z,engaged:e.userData.engaged})),
                    equipment: (opts = {}) => {
                        if(opts.pick){pickaxeLevel=opts.pick;applyPickaxeAppearance();setHeldItem("pick");}
                        if(opts.weapon){weaponLevel=opts.weapon;applyWeaponAppearance();setHeldItem("bow");}
                        if(opts.show)showEquipmentUpgrade(opts.weapon ? "bow" : "pick",opts.weapon || opts.pick || pickaxeLevel);
                        return {pick:pickaxeLevel,weapon:weaponLevel,mineInterval:equipmentCooldown(true),attackInterval:equipmentCooldown(false),power:PICKAXE_LEVELS[pickaxeLevel-1].power,damage:playerHitDamage(),pickParts:playerWeapon.userData.trim.children.length,bowParts:playerBow.userData.armor.children.length};
                    },
                    equipmentMineSample: () => {
                        const node=getNearestOre("low"),before=node.remaining;mineOre(node);
                        return {cells:before-node.remaining,seconds:equipmentCooldown(true)};
                    },
                    lightning: () => ({maxHits:pet?.userData.maxSplashHits || 0, bolts:effects.filter(e=>e.type==="chainBolt").length}),
                    petSplash: () => pet?.userData.maxSplashHits || 0,
                    charge: () => {
                        const charge = sweepCharge || (ultimateCharge && !ultimateCharge.locked ? ultimateCharge : null);
                        return charge && {x: +charge.home.x.toFixed(1), z: +charge.home.z.toFixed(1), lit: charge.lit, ultimate: Boolean(charge.ultimate), tiers: charge.tierIds.join("+")};
                    },
                    // 手动步进模拟：标签页失焦时 rAF 会被节流，实测节奏必须脱离墙钟。
                    // 先接管 rAF（hold），否则渲染循环会和步进叠加成双倍速。
                    sim: (seconds, dt = 1 / 60) => {
                        if (!window.__wik.hold) simElapsed = Math.max(simElapsed, clock.elapsedTime);
                        window.__wik.hold = true;
                        const steps = Math.round(seconds / dt);
                        for (let i = 0; i < steps; i++) {
                            simElapsed += dt;
                            update(dt, simElapsed);
                        }
                        renderer.render(scene, camera);
                        return Number(runClock.toFixed(1));
                    },
                    pick: (px, py) => {
                        const ray = new THREE.Raycaster();
                        ray.setFromCamera(
                            new THREE.Vector2((px / innerWidth) * 2 - 1, -(py / innerHeight) * 2 + 1),
                            camera
                        );
                        return ray.intersectObjects(scene.children, true).slice(0, 6).map(h => {
                            const chain = [];
                            for (let o = h.object; o && o !== scene; o = o.parent) {
                                chain.push(o.name || o.userData.type || o.type);
                            }
                            return {
                                geo: h.object.geometry && h.object.geometry.type,
                                params: h.object.geometry && h.object.geometry.parameters,
                                dist: Math.round(h.distance * 10) / 10,
                                chain
                            };
                        });
                    },
                    toEgg: () => {
                        if (!eggPickup) return null;
                        const p = eggPickup.mesh.position;
                        player.position.set(p.x, 0, p.z);
                        moveVelocity.set(0, 0, 0);
                        return [Math.round(p.x), Math.round(p.z)];
                    },
                    zoneAt: id => {
                        const zone = zones.find(z => z.id === id);
                        if (!zone) return null;
                        player.position.set(zone.position.x, 0, zone.position.z);
                        moveVelocity.set(0, 0, 0);
                        return zone.id;
                    },
                    // 自动走位一停就无从判断是「没目标」还是「走不过去」，把这两件事分开看。
                    guide: () => {
                        const target = getGuideTarget();
                        const goal = getGuideGoal();
                        return {
                            goal: goal ? goal.toArray() : null,
                            eggReachable: Boolean(eggPickup && canGuideToPosition(eggPickup.mesh.position)),
                            target: target ? target.toArray().map(v => Number(v.toFixed(2))) : null,
                            gap: target ? Number(flatDistance(target, player.position).toFixed(2)) : null,
                            stick: [Number(stick.x.toFixed(2)), Number(stick.z.toFixed(2)), stick.magnitude],
                            speed: Number(moveVelocity.length().toFixed(2))
                        };
                    },
                    // 段与段本来就严丝合缝，扇形布局要看的是层与层之间还剩多宽的走廊。
                    layout: () => oreRings.map((ring, index) => {
                        const inner = index === 0
                            ? CITY_STAGES[CITY_STAGES.length - 1].radius
                            : oreRings[index - 1].outerRadius;
                        // 最外层（封印矿）本来就该顶到场地边缘那圈岩石里，那是「这道墙是山体
                        // 的一部分」的来源。所以外边界按 arenaRadius 算，留 -2.4 的余量会让
                        // 这一项永远是负数，看着像布局错了。
                        const outer = index === oreRings.length - 1
                            ? CONFIG.arenaRadius
                            : oreRings[index + 1].innerRadius;
                        return {
                            tier: ring.tierId,
                            wall: `${ring.innerRadius.toFixed(1)}~${ring.outerRadius.toFixed(1)}`,
                            grid: `${ring.arcCells}x${ring.radialCells}x${ring.rows}`,
                            cells: ring.total,
                            gapIn: Number((ring.innerRadius - inner).toFixed(2)),
                            gapOut: Number((outer - ring.outerRadius).toFixed(2))
                        };
                    }),
                    // 矿体材质，用来在运行时直接调色。改一个数就 reload 一次的话，光是把人
                    // 挪回矿区、等画面重绘就要三四条命令，根本没法比较相邻两个值的差别——
                    // 而矿石最终的颜色是 albedo 被场景光乘、再叠自发光、最后过一遍 sRGB 编码
                    // 得来的，光看十六进制值猜不出来，只能一边改一边看。
                    mat: tierId => shared.oreMaterials[tierId],
                    // 按指定方向持续推摇杆走一段时间，用来验证矿墙是不是真的走不过去。
                    walk: (dx, dz, seconds = 2) => {
                        const length = Math.hypot(dx, dz) || 1;
                        stick.x = dx / length;
                        stick.z = dz / length;
                        stick.magnitude = 1;
                        __wik.sim(seconds);
                        stick.x = 0;
                        stick.z = 0;
                        stick.magnitude = 0;
                        return __wik.state().radius;
                    },
                    // 每层扇形是否真的封住：一条切向列上没有挡人的柱，就是能直接走过去的缺口。
                    // 这个点陷进实心矿墙多深（米）。0 表示它在空地或者玩家凿出来的通道里。
                    // 用来验「走廊里的怪只从缺口进来」：追击途中逐帧采样，这个数必须恒为 0。
                    solidDepth: (x, z, radius = ROVER_BODY_RADIUS) => {
                        const fixed = resolveOreWallPosition(new THREE.Vector3(x, 0, z), radius);
                        return Number(Math.hypot(fixed.x - x, fixed.z - z).toFixed(3));
                    },
                    // 同上，但返回被顶到哪儿去了。判「贴着墙能不能横着滑」要看落点，
                    // 只看位移长度分不出「顶回原处」和「顶回原处但沿墙挪了一点」。
                    slide: (x, z, radius = ROVER_BODY_RADIUS) => {
                        const fixed = resolveOreWallPosition(new THREE.Vector3(x, 0, z), radius);
                        return [Number(fixed.x.toFixed(3)), Number(fixed.z.toFixed(3))];
                    },
                    // 半截柱子的数量。整列挖（见 mineOre）的不变量是：一根柱子要么没动过、
                    // 要么整列没了，不存在挖掉一半剩几格挂在半空的。这个数必须恒为 0——
                    // 它同时也是「守卫出土时脚下是不是齐地的缺口」的代理指标，
                    // 而后者靠截图很难判准。
                    stubs: () => oreRings.map(ring => {
                        let stubs = 0;
                        let carved = 0;
                        for (const column of ring.columns) {
                            if (!column) continue;
                            const total = column.cells.length;
                            if (column.count === total) continue;
                            carved += 1;
                            if (column.count > 0) stubs += 1;
                        }
                        return { tier: ring.tierId, carved, stubs };
                    }),
                    sealed: () => oreRings.map(ring => {
                        const holes = [];
                        for (let ai = 0; ai < ring.arcCells; ai++) {
                            let blocked = false;
                            for (let ri = 0; ri < ring.radialCells; ri++) {
                                const column = columnAt(ring, ai, ri);
                                if (column && column.blockCount > 0) {
                                    blocked = true;
                                    break;
                                }
                            }
                            if (!blocked) holes.push(ai);
                        }
                        return { tier: ring.tierId, holes: holes.length, at: holes.slice(0, 8) };
                    }),
                    // 演出镜头总把巨龙的翼尖切掉，截图上不好判断到底差多少，直接投影包围盒。
                    // 返回的 x / y 是 NDC，超出 ±1 就是出框了。
                    framed: () => {
                        if (!finale.dragon) return null;
                        const box = new THREE.Box3().setFromObject(finale.dragon);
                        const span = { x: [Infinity, -Infinity], y: [Infinity, -Infinity] };
                        for (const x of [box.min.x, box.max.x]) {
                            for (const y of [box.min.y, box.max.y]) {
                                for (const z of [box.min.z, box.max.z]) {
                                    const p = new THREE.Vector3(x, y, z).project(camera);
                                    span.x = [Math.min(span.x[0], p.x), Math.max(span.x[1], p.x)];
                                    span.y = [Math.min(span.y[0], p.y), Math.max(span.y[1], p.y)];
                                }
                            }
                        }
                        const round = v => Number(v.toFixed(2));
                        return {
                            size: box.getSize(new THREE.Vector3()).toArray().map(round),
                            x: span.x.map(round),
                            y: span.y.map(round),
                            aspect: round(camera.aspect)
                        };
                    },
                    // 直接在最近那段墙上凿穿一条通道，用来验证贯通之后的推进和守卫现身。
                    breach: tier => {
                        const node = getNearestOre(tier || null);
                        if (!node) return null;
                        const ring = node.ring;
                        const half = (node.angleEnd - node.angleStart) / 2;
                        const delta = signedAngleDelta(
                            Math.atan2(player.position.z, player.position.x),
                            node.angleCenter
                        );
                        const target = node.angleCenter + THREE.MathUtils.clamp(delta, -half, half);
                        const ai = Math.floor((target - ring.angleStart) / ring.cellAngle);
                        for (let d = -1; d <= 1; d++) {
                            for (let ri = 0; ri < ring.radialCells; ri++) {
                                const column = columnAt(ring, ai + d, ri);
                                if (column && column.node === node) pulverizeColumn(column);
                            }
                        }
                        node.instanced.instanceMatrix.needsUpdate = true;
                        node.penetration = 1;
                        breachOreSegment(node);
                        if (node.remaining <= 0) clearOreNode(node);
                        return node.id;
                    },
                    // 封印/破封那几镜的构图诊断。framed 的包围盒会把隐藏的翅膀尾巴一起算进去，
                    // 读不出实际看得见的那块剪影落在画面哪里，所以单列一个只算可见网格的。
                    shot: () => {
                        const round = v => Number(v.toFixed(2));
                        const ndc = p => {
                            const q = p.clone().project(camera);
                            return [round(q.x), round(q.y)];
                        };
                        const out = {
                            cam: camera.position.toArray().map(round),
                            camR: round(Math.hypot(camera.position.x, camera.position.z)),
                            target: cinematic.cameraTarget ? cinematic.cameraTarget.toArray().map(round) : null,
                            aspect: round(camera.aspect)
                        };
                        if (finale.landing) out.landing = ndc(finale.landing);
                        if (finale.dragon) {
                            const box = new THREE.Box3();
                            // 整条父链都要查：翅膀网格挂在一个可见的 plane 上，
                            // 而收翅是把它上一级的 pivot 藏起来，只看一层会把翼展算进来。
                            const shown = obj => {
                                for (let o = obj; o; o = o.parent) if (!o.visible) return false;
                                return true;
                            };
                            finale.dragon.traverse(child => {
                                if (child.isMesh && shown(child)) box.expandByObject(child);
                            });
                            if (!box.isEmpty()) {
                                const span = { x: [Infinity, -Infinity], y: [Infinity, -Infinity] };
                                for (const x of [box.min.x, box.max.x]) {
                                    for (const y of [box.min.y, box.max.y]) {
                                        for (const z of [box.min.z, box.max.z]) {
                                            const p = ndc(new THREE.Vector3(x, y, z));
                                            span.x = [Math.min(span.x[0], p[0]), Math.max(span.x[1], p[0])];
                                            span.y = [Math.min(span.y[0], p[1]), Math.max(span.y[1], p[1])];
                                        }
                                    }
                                }
                                out.visible = { x: span.x.map(round), y: span.y.map(round) };
                                out.visibleSize = box.getSize(new THREE.Vector3()).toArray().map(round);
                            }
                            out.head = ndc(finale.dragon.userData.head.getWorldPosition(new THREE.Vector3()));
                        }
                        return out;
                    },
                    nodes: () => oreNodes
                        .map(n => ({
                            id: n.id,
                            cleared: n.cleared,
                            breached: n.breached,
                            pen: Number(n.penetration.toFixed(2)),
                            left: `${n.remaining}/${n.total}`,
                            revealed: n.monsterRevealed,
                            dist: Math.round(segmentDistance(n, player.position))
                        }))
                        .sort((a, b) => a.dist - b.dist)
                        .slice(0, 6),
                    // 每层矿的剩余格数。校准「买下一步得铲平多少矿」时看的是这个——
                    // nodes() 只给最近六段，读不出整层的消耗率，而消耗率正是判断
                    // 某一级定价会不会把矿掏空（横扫桶因此没东西可清）的唯一依据。
                    ore: () => TIER_ORDER.reduce((acc, id) => {
                        const nodes = oreNodes.filter(n => n.tierId === id);
                        if (!nodes.length) return acc;
                        const total = nodes.reduce((sum, n) => sum + n.total, 0);
                        const left = nodes.reduce((sum, n) => sum + n.remaining, 0);
                        acc[id] = { left, total, used: Number(((1 - left / total) * 100).toFixed(1)) };
                        return acc;
                    }, {}),
                    // 钻石供给完全由「玩家自然流程里会打死几只守卫」决定，而这个数无法靠读代码
                    // 推出来——它取决于引导把人带到哪一段、横扫替玩家杀掉几只。必须实测。
                    // 冻在矿里的守卫 alive 本来就是假（revealOreMonster 才置真），所以「死了」
                    // 必须是「出过土、且现在不活着」，不能只看 alive。
                    guards: () => oreNodes.map(n => ({
                        tier: n.tierId,
                        id: n.id,
                        dead: n.monsterRevealed && Boolean(n.monster) && !n.monster.userData.alive,
                        revealed: n.monsterRevealed,
                        // 血量是建场时烘进去的，调参面板改完必须重载才生效——这里读的是烘完的
                        // 结果，用来确认覆盖值真的落到了对象上，而不是只改了表。
                        hp: n.monster ? `${Math.max(0, Math.round(n.monster.userData.hp))}/${n.monster.userData.maxHp}` : null,
                        // 战斗状态与血量原始值。破绽（stunned）期间受伤翻倍，而这件事
                        // 在画面上只是数字大一号，靠截图核不准，只能读值对账。
                        state: n.monster ? n.monster.userData.attackState : null,
                        raw: n.monster ? Number(n.monster.userData.hp.toFixed(1)) : null,
                        pos: n.monster ? [Number(n.monster.position.x.toFixed(2)), Number(n.monster.position.z.toFixed(2))] : null
                    })),
                    // 走廊里的游荡怪。要看的主要是 radius 有没有落在 lane 的内外边界之间——
                    // 矿层半径改过好几轮，越界就意味着有怪站在矿墙里面。
                    rovers: () => enemies.filter(e => e.userData.type === "rover").map(e => {
                        const d = e.userData;
                        const lane = ROVER_LANES.find(l => l.inner === d.tierId);
                        const geo = laneGeometry(lane);
                        const radius = Math.hypot(e.position.x, e.position.z);
                        return {
                            lane: lane.id,
                            radius: Number(radius.toFixed(2)),
                            band: [Number(geo.innerEdge.toFixed(2)), Number(geo.outerEdge.toFixed(2))],
                            inBand: radius > geo.innerEdge && radius < geo.outerEdge,
                            deg: Number(THREE.MathUtils.radToDeg(Math.atan2(e.position.z, e.position.x)).toFixed(1)),
                            inSector: Math.abs(Math.atan2(e.position.z, e.position.x) - SECTOR.center) < SECTOR.half,
                            engaged: Boolean(d.engaged),
                            // 追击时的状态机档位和绕行目标。「怪站着不动」有好几种成因
                            // （被墙挡住、卡在招式后摇里、绕行目标和自己重合），
                            // 光看位置不动分不出是哪一种。
                            state: d.attackState,
                            detour: d.detour
                                ? [Number(d.detour.x.toFixed(2)), Number(d.detour.z.toFixed(2))]
                                : null,
                            hp: `${Math.max(0, Math.round(d.hp))}/${d.maxHp}`,
                            dist: Number(flatDistance(e.position, player.position).toFixed(1)),
                            // 玩家现在能不能射到它。「隔着矿墙射不到」在画面上完全看不出来：
                            // 表现就是箭没飞出去，和攻击间隔没到、目标超出射程长得一模一样。
                            sight: inPlayerSight(e),
                            // 屏幕坐标（NDC，±1 是画框）。「隔着半透明矿墙看见远处有东西在动」
                            // 是这批怪存在的全部理由，而截图上一只 1.2 米高的小东西挤在
                            // 两道矿墙之间几乎数不出来，只能靠投影确认它到底在不在画里。
                            ndc: e.position.clone().setY(1.6).project(camera).toArray().slice(0, 2).map(v => Number(v.toFixed(2)))
                        };
                    }),
                    state: () => ({
                        econ: ECON.id,
                        coins, gems,
                        shards: { ...shards },
                        need: requiredShardGrade(),
                        // 场上还埋着没被凿到的宝石，按品质分。校准 shardYield 时看的就是这个数：
                        // 它和 shards 加起来必须恒等于 ORE_TIERS.*.shardYield，对不上就是哪条路径漏结算了。
                        buried: TIER_ORDER.reduce((acc, id) => {
                            const left = oreNodes.filter(n => n.tierId === id)
                                .reduce((sum, n) => sum + n.shards.filter(s => !s.taken).length, 0);
                            if (left) acc[id] = left;
                            return acc;
                        }, {}),
                        cityLevel, pickaxeLevel, petEvolved,
                        pet: Boolean(pet), carryingEgg, eggSpawned,
                        breached: { ...breachedByTier },
                        enemies: enemies.length,
                        drops: coinDrops.length,
                        zones: zones.map(z => `${z.id}:${z.paid}/${z.cost}`),
                        pos: [Number(player.position.x.toFixed(2)), Number(player.position.z.toFixed(2))],
                        radius: Number(Math.hypot(player.position.x, player.position.z).toFixed(2)),
                        finaleStarted, ctaOpen
                    }),
                    // 战斗探针。三连击计数和攻击冷却都是闭包变量，从外面读不到，而这套改造
                    // 的效果几乎全落在这两个数上（挨打断连击、受击封锁攻击、破绽窗口），
                    // 靠截图完全看不出来——红圈亮着的那半秒里画面是静的。
                    // 武器线一眼看全：等级、这一级买到什么、当前一击打多少。
                    // damage 是算出来的而不是抄表的——切分职责之后「谁在驱动这个数」
                    // 是最容易悄悄接错的地方，让它自己报比对着表核对可靠。
                    weapon: () => ({
                        on: weaponEnabled(),
                        level: weaponLevel,
                        max: WEAPON_LEVELS.length,
                        cost: ECON.weaponCost ? (ECON.weaponCost[weaponLevel - 1] || null) : null,
                        damage: playerHitDamage(),
                        reach: Number(playerAttackRange().toFixed(2)),
                        splash: weaponTier(weaponLevel).splash,
                        gems,
                        drops: TIER_ORDER.filter(id => !ORE_TIERS[id].sealed)
                            .reduce((all, id) => Object.assign(all, { [id]: guardGemDrop(id) }), {})
                    }),
                    // 手持物的实测尺寸与朝向。弓的比例和「箭往哪飞」全靠眼睛看很容易
                    // 判错——弓身有一半时间压在半透明矿墙后面，颜色和大小都会被带偏。
                    bow: () => {
                        if (!playerBow) return null;
                        const round = v => Number(v.toFixed(2));
                        const box = new THREE.Box3().setFromObject(playerBow);
                        const forward = new THREE.Vector3(0, 0, 1)
                            .applyQuaternion(playerBow.getWorldQuaternion(new THREE.Quaternion()));
                        return {
                            held: heldItem,
                            pose: !bowUnlocked() ? "locked" : heldItem === "bow" ? "shooting" : "back",
                            display: zones.some(z => z.id==="forge" && !bowUnlocked() && z.bowDisplay?.visible && z.group.visible),
                            visible: playerBow.visible,
                            draw: round(bowDraw),
                            size: box.getSize(new THREE.Vector3()).toArray().map(round),
                            // frame 内的 +x 就是箭的飞行方向，应当和玩家朝向一致。
                            arrowDir: new THREE.Vector3(1, 0, 0)
                                .applyQuaternion(playerBow.userData.frame
                                    .getWorldQuaternion(new THREE.Quaternion()))
                                .toArray().map(round),
                            playerFacing: [round(Math.sin(player.rotation.y)), 0, round(Math.cos(player.rotation.y))],
                            bowForward: forward.toArray().map(round),
                            arrows: effects.filter(e => e.type === "arrow").length,
                            // 「visible 是 true 却在画面上找不到」这件事光看 visible 判不出来：
                            // 父链上任何一级藏起来、或者整把弓被挪到了画框外，visible 都还是 true。
                            // 所以顺着父链查一遍，再把包围盒投到 NDC 上——超出 ±1 就是出框了。
                            shown: (() => {
                                for (let o = playerBow; o; o = o.parent) if (!o.visible) return false;
                                return true;
                            })(),
                            at: playerBow.getWorldPosition(new THREE.Vector3()).toArray().map(round),
                            ndc: [box.min, box.max].map(p => {
                                const q = p.clone().project(camera);
                                return [round(q.x), round(q.y)];
                            }),
                            parts: Object.entries(playerBow.userData)
                                .filter(([, v]) => v && v.isObject3D)
                                .map(([k, v]) => `${k}:${v.visible ? "on" : "off"}`)
                        };
                    },
                    // 战斗数值台架。调武器/宠物那一版数值时加的：一次自动局里同一档的
                    // 实测 eDPS 能从 567 飘到 3725，飘的全是交战质量（有没有在躲、被击退
                    // 推出去几次、路上跑了多久），不是战力。拿那种数去调伤害等于在噪音里调。
                    //
                    // 所以把变量锁死：指定战力、把守卫复位成满血、玩家站定不动让它自己贴上来。
                    // 剩下的差异就只剩「这一档打这只怪要多久」。
                    //
                    // 站定不动是刻意的——它是那四种打法里唯一可复现的一种（见 spec 里
                    // 「一局一次页面重载」那段踩过的坑）。它测的是 DPS 上限，不是真实体感；
                    // 真实体感照旧由完整自动局给。两个数一起看才有意义。
                    duel: (tierId, opts = {}) => {
                        if (opts.weapon) {
                            weaponLevel = Math.min(WEAPON_LEVELS.length, opts.weapon);
                            applyWeaponAppearance();
                        }
                        if (opts.pet && !pet) createPet();
                        if (opts.pet === "evo" && pet && !petEvolved) evolvePet();

                        const node = oreNodes.find(n => n.tierId === tierId && n.monster);
                        if (!node) return null;
                        if (!node.monsterRevealed) revealOreMonster(node, true);
                        const foe = node.monster;
                        const d = foe.userData;
                        // 打死过的也能再用：这台架一跑几十场，而每层只有两三只守卫。
                        if (!d.alive) {
                            d.alive = true;
                            d.attackable = true;
                            scene.add(foe);
                            enemies.push(foe);
                        }
                        // 复位要连位置和位移状态一起清。只清血量的话，上一场把它冲锋出去
                        // 七米、或者钉在拴绳边界上的那个位置会带进下一场，于是同一组数值
                        // 能测出 10 秒和「90 秒打不完」两种结果（踩过）。
                        d.hp = d.maxHp;
                        d.frenzy = false;
                        d.attackState = "chasing";
                        d.attackTimer = 0;
                        d.emerging = 0;
                        d.activeSkill = null;
                        d.dash = null;
                        d.detour = null;
                        d.closeFail = 0;
                        d.knockback = null;
                        d.stagger = 0;
                        if (d.homePosition) foe.position.copy(d.homePosition);
                        foe.position.y = 0;
                        cancelHazardsFrom(foe);
                        syncHealthBar(foe);
                        playerHp = CONFIG.playerMaxHp;
                        attackSequence = 0;
                        attackTimer = 0;

                        // 站在它正内侧 gap 米处。方向取城心，保证落点在玩家凿出来的通道里
                        // 而不是实心矿墙里——被墙顶开的话这一场测的就是「走位」不是「输出」。
                        const gap = opts.gap === undefined ? 4 : opts.gap;
                        const dir = foe.position.clone().setY(0).normalize();
                        const spot = foe.position.clone().setY(0).addScaledVector(dir, -gap);
                        player.position.copy(spot);
                        moveVelocity.set(0, 0, 0);
                        stick.x = 0; stick.z = 0; stick.magnitude = 0;
                        autoRun = false;

                        const limit = opts.max || 90;
                        const dt = 1 / 60;
                        let t = 0;
                        let hits = 0;
                        let lastHp = playerHp;
                        window.__wik.hold = true;
                        while (t < limit && d.alive && d.hp > 0) {
                            // 够不着就走过去，够得着就站定。不躲、不风筝——这台架测的是
                            // 输出上限，不是走位水平。但也不能纯站着：守卫会被击退、会冲锋
                            // 出去，站着不动的话有些组合会永远打不完，那种 null 不是数值结论。
                            const away = flatDistance(foe.position, player.position) - playerAttackRange();
                            if (away > 0) {
                                const step = foe.position.clone().sub(player.position).setY(0).normalize();
                                stick.x = step.x; stick.z = step.z; stick.magnitude = 1;
                            } else {
                                stick.x = 0; stick.z = 0; stick.magnitude = 0;
                            }
                            simElapsed += dt;
                            update(dt, simElapsed);
                            t += dt;
                            if (playerHp < lastHp) { hits++; lastHp = playerHp; }
                        }
                        stick.x = 0; stick.z = 0; stick.magnitude = 0;
                        renderer.render(scene, camera);
                        return {
                            tier: tierId,
                            weapon: weaponLevel,
                            pet: pet ? (petEvolved ? "evo" : "pet") : "-",
                            dmg: playerHitDamage(),
                            maxHp: d.maxHp,
                            ttk: d.hp > 0 ? null : Number(t.toFixed(2)),
                            dps: d.hp > 0 ? null : Math.round(d.maxHp / t),
                            hpLost: Math.round(CONFIG.playerMaxHp - playerHp),
                            hits
                        };
                    },
                    combat: () => ({
                        arpg: ARPG.enabled,
                        hp: Number(playerHp.toFixed(1)),
                        combo: attackSequence,
                        cooldown: Number(Math.max(0, attackTimer).toFixed(3)),
                        perfect: perfectDodges,
                        stunned: enemies.filter(e => e.userData.attackState === "stunned").length,
                        hazards: hazards.map(h => ({
                            kind: h.kind,
                            from: h.source.userData.type === "rover" ? `rover:${h.source.userData.tierId}` : h.source.userData.tierId,
                            left: Number(Math.max(0, h.life).toFixed(3)),
                            radius: h.radius,
                            // 预警中心。测躲避时要靠它算「往哪个方向出圈」，光有距离不够。
                            at: [Number(h.mesh.position.x.toFixed(2)), Number(h.mesh.position.z.toFixed(2))],
                            // 方向性预警的朝向（度）。测「往后退躲不掉、只能侧移」这件事
                            // 需要知道线指向哪边。
                            facing: h.facing === undefined ? undefined : Number(THREE.MathUtils.radToDeg(h.facing).toFixed(1)),
                            // 玩家此刻在不在判定范围里。扇形按角度另算，这里只给圆形的距离，
                            // 够用来确认「跑出去了」这件事。
                            dist: Number(flatDistance(player.position, h.mesh.position).toFixed(2)),
                            inside: hazardContainsPlayer(h),
                            // 直线专用：预警画出来的中段，和按 facing 算出来的中段之间差多少米。
                            // 应当恒为 0。不为 0 就意味着长条铺在一边、判定在另一边，
                            // 而这种错在画面上几乎发现不了——它只表现为「明明躲开了却挨打」。
                            drift: h.facing === undefined ? undefined : (() => {
                                const reach = (h.length || h.radius) * 0.5;
                                h.mesh.updateMatrixWorld();
                                const drawn = h.mesh.localToWorld(new THREE.Vector3(reach, 0, 0));
                                const wanted = (h.origin || h.source.position).clone().addScaledVector(
                                    new THREE.Vector3(Math.sin(h.facing), 0, Math.cos(h.facing)), reach
                                );
                                return Number(flatDistance(drawn, wanted).toFixed(2));
                            })()
                        }))
                    })
                };
            }

            function seededRandom(seed) {
                let value = seed % 2147483647;
                if (value <= 0) value += 2147483646;
                return () => (value = (value * 16807) % 2147483647) / 2147483647;
            }

            function createSharedAssets() {
                shared.box = new THREE.BoxGeometry(1, 1, 1);
                shared.sphere = new THREE.SphereGeometry(0.5, 10, 8);
                shared.coin = new THREE.CylinderGeometry(0.26, 0.26, 0.07, 18);
                shared.coinMat = new THREE.MeshStandardMaterial({
                    color: 0xffd23c,
                    emissive: 0x8a5b00,
                    emissiveIntensity: 0.5,
                    roughness: 0.32,
                    metalness: 0.6
                });
                // 钻石用六棱扁晶：与圆金币、尖菱形宝石在轮廓上区分。
                shared.gem = new THREE.CylinderGeometry(0.28, 0.28, 0.22, 6);
                shared.gemMat = new THREE.MeshStandardMaterial({
                    color: 0x5fe6ff,
                    emissive: 0x0f7fa8,
                    emissiveIntensity: 0.9,
                    roughness: 0.18,
                    metalness: 0.35
                });
                // 埋在矿里的金币要透过半透明石头看清，比普通金币更亮。
                shared.oreCoinMat = new THREE.MeshStandardMaterial({
                    transparent: HIDE_GUARDS,
                    depthTest: !HIDE_GUARDS,
                    depthWrite: !HIDE_GUARDS,
                    color: 0xffd94f,
                    emissive: 0xffa412,
                    emissiveIntensity: 1.15,
                    roughness: 0.28,
                    metalness: 0.55
                });

                // 宝石：比钻石那颗八面体大一圈、再纵向拉长，俯视下是个立着的棱形而不是一颗珠子。
                // 它和钻石的区分主要不靠形状——两者永远不在同一个位置出现（宝石在矿里，钻石在守卫尸体上），
                // 真正要分开的是**三档品质之间**，那由颜色承担。
                shared.shard = new THREE.OctahedronGeometry(0.32);
                shared.shardMats = {};
                shared.shardHaloMats = {};
                shared.oreShardMats = {};
                for (const id of Object.keys(SHARD_GRADES)) {
                    const grade = SHARD_GRADES[id];
                    shared.shardMats[id] = new THREE.MeshStandardMaterial({
                        color: grade.color,
                        emissive: grade.emissive,
                        emissiveIntensity: 1.1,
                        roughness: 0.16,
                        metalness: 0.4
                    });
                    // 埋在矿里的那颗要压过半透明矿石的底色，否则隔着墙看只是一小块偏色。
                    // 自发光用 emissive 那个压深的色而不是本体色：本体色本来就亮，
                    // 再拿它当自发光会把三档一起烧成白的（第一版就是这么白的）。
                    shared.oreShardMats[id] = new THREE.MeshStandardMaterial({
                        transparent: HIDE_GUARDS,
                        depthTest: !HIDE_GUARDS,
                        depthWrite: !HIDE_GUARDS,
                        color: grade.color,
                        emissive: grade.emissive,
                        emissiveIntensity: 1.35,
                        roughness: 0.14,
                        metalness: 0.45
                    });
                    // 加色光晕。矿石是半透明的，实心的宝石本体透过去会被石头的颜色洗淡；
                    // 外面套一层加色的壳，亮度就叠在矿石之上而不是被它乘下去——
                    // 「隔着墙也一眼看得见有货」全靠这一层。
                    shared.shardHaloMats[id] = new THREE.MeshBasicMaterial({
                        depthTest: !HIDE_GUARDS,
                        color: grade.halo,
                        transparent: true,
                        opacity: 0.34,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    });
                }
                shared.rockMat = new THREE.MeshStandardMaterial({ color: 0x2b2735, roughness: 0.92 });
                shared.rimMat = new THREE.MeshStandardMaterial({ color: 0x1d1a28, roughness: 0.95 });
                shared.groundMat = new THREE.MeshStandardMaterial({ color: 0x151221, roughness: 0.97 });
                shared.cityFloorMat = new THREE.MeshStandardMaterial({ color: 0x453247, roughness: 0.85 });
                shared.cityTrimMat = new THREE.MeshStandardMaterial({ color: 0x6d4a35, roughness: 0.78 });
                shared.cityStoneMat = new THREE.MeshStandardMaterial({ color: 0x5a4a58, roughness: 0.82 });
                shared.cityRoofMat = new THREE.MeshStandardMaterial({ color: 0xb4553a, roughness: 0.7 });
                // 冻在墙心的守卫剪影。四层半透明矿石叠下来只剩不到一成透光率，
                // 藏在矿墙之后怎么调都看不见，所以改成压在矿墙之上画。
                // 压上去之后底色是高饱和的矿石，深色剪影反而比浅色更能勾出轮廓。
                shared.silhouetteMat = new THREE.MeshBasicMaterial({
                    color: 0x120c1f,
                    transparent: true,
                    opacity: 0,
                    depthWrite: false
                });
                shared.warningMat = new THREE.MeshBasicMaterial({
                    color: 0xff4444,
                    transparent: true,
                    opacity: 0.32,
                    side: THREE.DoubleSide,
                    depthWrite: false
                });
                shared.dustTexture = createDustTexture();
                shared.sparkMaterials = new Map();
                shared.sparkPool = [];
                const sparkGeometry = new THREE.TetrahedronGeometry(0.15);
                for (let i = 0; i < 240; i++) {
                    const mesh = new THREE.Mesh(sparkGeometry, shared.coinMat);
                    mesh.visible = false;
                    scene.add(mesh);
                    shared.sparkPool.push(mesh);
                }
            }

            function createDustTexture() {
                const canvas = document.createElement("canvas");
                canvas.width = canvas.height = 64;
                const context = canvas.getContext("2d");
                const gradient = context.createRadialGradient(32, 32, 2, 32, 32, 31);
                gradient.addColorStop(0, "rgba(255,255,255,0.9)");
                gradient.addColorStop(0.5, "rgba(255,255,255,0.32)");
                gradient.addColorStop(1, "rgba(255,255,255,0)");
                context.fillStyle = gradient;
                context.fillRect(0, 0, 64, 64);
                return new THREE.CanvasTexture(canvas);
            }

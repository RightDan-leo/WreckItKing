                        mesh,
                        source: enemy,
                        kind,
                        // 起手那一刻的朝向。判定和渲染此后都只读这个字段，不再回头问 source。
                        //
                        // 原先两处各问一次：渲染在追踪期结束后就不更新了，判定却一直读
                        // source.rotation.y 的实时值。现在两者恰好一致，只因为怪物在前摇里
                        // 完全不转身——所以那个 trackDuration 其实一帧都没起过作用，
                        // 每帧都在把同一个值写回去。
                        //
                        // 一旦有招式让怪边蓄力边转向追人，玩家看到的扇形和真正判定的方向
                        // 就会分叉，而这种 bug 在画面上是看不出来的（红圈明明躲开了却挨打）。
                        // 直线冲锋同样按方向判定，会踩一模一样的坑，所以先把方向锁在这儿。
                        facing: enemy.rotation.y,
                        life: config.windup,
                        maxLife: config.windup,
                        radius: config.sectorRadius,
                        angle,
                        damage: config.damage,
                        knockback: config.knockback || 0
                    });
                    return;
                }

                // 直线冲锋。矩形从怪脚下朝玩家铺出去，结算后它顺着这条线冲过来。
                // 躲法和前两种都不一样：只能横向侧移——往后退没用，线的长度会追上你。
                // 这是招式池里第一个「必须往旁边走」的东西，圆和扇形都可以靠后退解决。
                //
                // 几何先 translate 成从原点向局部 +X 延伸，这样下面那两行 rotation
                // 能和扇形共用同一套换算（扇形的 thetaStart 也是从局部 +X 起算的）。
                if (kind === "line") {
                    // 长度按「够得到玩家」算，不按配置写死的那个数。理由见
                    // ARPG.chargeRetreatCover——写死的话从远处发起的那一记必然打空。
                    const toPlayer = flatDistance(enemy.position, player.position);
                    const retreat = ARPG.enabled
                        ? CONFIG.playerSpeed * config.windup * ARPG.chargeRetreatCover
                        : 0;
                    const length = Math.max(config.lineLength || 8, toPlayer + retreat);
                    const width = config.lineWidth || 2.2;
                    const geometry = new THREE.PlaneGeometry(length, width);
                    geometry.translate(length / 2, 0, 0);
                    const mesh = new THREE.Mesh(geometry, shared.warningMat.clone());
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.position.copy(enemy.position).setY(0.08);
                    mesh.rotation.z = warningSpin(enemy.rotation.y);
                    scene.add(mesh);
                    hazards.push({
                        mesh,
                        source: enemy,
                        kind,
                        facing: enemy.rotation.y,
                        // 起点也锁住。扇形是跟着怪走的（判定读的也是 source.position，两边同源），
                        // 但冲锋的这条线是一条已经定下来的路径：怪在前摇里被玩家打退两步，
                        // 线不该跟着飘。视觉不动、判定却读实时坐标的话，又是一次看不见的分叉。
                        origin: enemy.position.clone(),
                        life: config.windup,
                        maxLife: config.windup,
                        length,
                        width,
                        // radius 在别处被当成「这个预警多大」的通用尺度（探针、出圈计算），
                        // 直线没有半径，给它长度。
                        radius: length,
                        damage: config.damage,
                        knockback: config.knockback || 0,
                        dashSpeed: config.dashSpeed || 15,
                        // 冲刺距离跟着实际长度走。取较大值而不是直接用配置值：长条被拉长了
                        // 而冲刺还是原来那 7 ~ 8 米的话，怪会停在长条中间，读作「冲了一半刹住」。
                        dashDistance: Math.max(config.dashDistance || 0, length * 0.75)
                    });
                    return;
                }

                const radius = config.warningRadius;
                const mesh = new THREE.Mesh(new THREE.CircleGeometry(radius, 28), shared.warningMat.clone());
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.copy(player.position).setY(0.08);
                scene.add(mesh);
                hazards.push({
                    mesh,
                    source: enemy,
                    kind,
                    life: config.windup,
                    maxLife: config.windup,
                    trackDuration: config.trackDuration !== undefined ? config.trackDuration : config.windup * 0.55,
                    radius,
                    damage: config.damage,
                    knockback: config.knockback || 0
                });
            }

            function cancelHazardsFrom(enemy) {
                for (let i = hazards.length - 1; i >= 0; i--) {
                    if (hazards[i].source !== enemy) continue;
                    scene.remove(hazards[i].mesh);
                    hazards.splice(i, 1);
                }
            }

            // 把世界朝向换算成「躺平的预警面片」该转多少。面片先绕 X 转 -90° 躺到地面上，
            // 这一步不动它的局部 +X（仍是世界 +X）；再绕局部 Z 转这个角度，局部 +X 就落到
            // (sin facing, 0, cos facing)——正是判定用的 forward。
            //
            // 原先三处各自写着 `-facing + π/2`，Z 分量恰好反号：预警画出来的方向和判定的方向
            // 关于世界 X 轴镜像。判定那一侧一直是对的（起手时怪已经转向玩家），所以怪照样
            // 打得中，帐面上看不出问题；但玩家看到的红色扇形指在别处，照着它躲反而会躲进
            // 判定区里。这是这次改造之前就有的 bug，之所以一直没被发现，是因为只有扇形
            // 吃朝向——圆形预警画在玩家脚下，压根不看方向。
            //
            // 收成一个函数是为了别再分叉：直线冲锋也按方向判定，一旦两处再各写一遍，
            // 同样的错会以「明明躲开了却挨打」的形式重新长出来，而这种错在画面上看不见。
            function warningSpin(facing) {
                return facing - Math.PI / 2;
            }

            // 玩家此刻是否在这个预警的判定范围里。每帧问一次（记 lastInsideAt，判闪避），
            // 结算时再问一次算命中——两处必须是同一套算法，否则会出现「看着躲开了却挨打」
            // 或者反过来，而这套改造的全部说服力就在于预警所见即判定所得。
            function hazardContainsPlayer(hazard, point = player.position) {
                if (hazard.kind === "fan") {
                    const toPlayer = point.clone().sub(hazard.source.position).setY(0);
                    if (toPlayer.length() > hazard.radius) return false;
                    const facing = new THREE.Vector3(Math.sin(hazard.facing), 0, Math.cos(hazard.facing));
                    return toPlayer.normalize().dot(facing) >= Math.cos(hazard.angle / 2);
                }
                if (hazard.kind === "line") {
                    const toPlayer = point.clone().sub(hazard.origin).setY(0);
                    const forward = new THREE.Vector3(Math.sin(hazard.facing), 0, Math.cos(hazard.facing));
                    const along = toPlayer.dot(forward);
                    if (along < 0 || along > hazard.length) return false;
                    // 到中轴线的垂直距离，二维叉积。取绝对值所以不关心玩家在哪一侧。
                    const side = toPlayer.x * forward.z - toPlayer.z * forward.x;
                    return Math.abs(side) <= hazard.width / 2;
                }
                return flatDistance(point, hazard.mesh.position) <= hazard.radius;
            }

            // 闪避的地面提示：玩家脚下一圈青白光环炸开。用玩家攻击弧光那个色系
            // （0x8fd6ff 一族），和怪物预警的橙红明确分开——这一圈要一眼读成
            // 「我做对了」，而不是又一个危险区。
            function spawnDodgeRing() {
                const ring = new THREE.Mesh(
                    new THREE.RingGeometry(0.62, 0.98, 36),
                    new THREE.MeshBasicMaterial({
                        color: 0xbdf3ff,
                        transparent: true,
                        opacity: 0.9,
                        side: THREE.DoubleSide,
                        depthWrite: false
                    })
                );
                ring.rotation.x = -Math.PI / 2;
                ring.position.copy(player.position).setY(0.14);
                scene.add(ring);
                effects.push({ type: "shockwave", mesh: ring, life: 0.36, maxLife: 0.36, maxScale: 3.6 });
            }

            // 换档。眼睛烧起来是唯一不需要文字就能读懂的「它变了」——守卫的眼睛本来是
            // 矿层辉光色（青 / 紫 / 橙），烧成橙红之后连低级那只青眼守卫也一眼看得出。
            // eyeMaterial 每只怪独立，而且出土后不再被改写（revealOreMonster 只跑一次），
            // 所以这里改完就定住了。
            function enterFrenzy(enemy) {
                const data = enemy.userData;
                data.frenzy = true;
                if (data.eyeMaterial) data.eyeMaterial.color.setHex(0xff5a2a);
                playSound("roar");
                cameraShake = Math.max(cameraShake, 0.2);
                showDamage(enemy.position, "狂暴", false, "frenzy");
            }

            // 闪避的全部回报都在这儿：怪物踉跄一段，这段时间它不能起手、受伤翻倍。
            // 躲开因此不再只是「少掉几点血」，而是换来一个能安全输出的窗口。
            function triggerPerfectDodge(enemy) {
                const data = enemy.userData;
                if (!data.alive) return;
                data.attackState = "stunned";
                data.attackTimer = ARPG.stunDuration;
                perfectDodges++;
                // 起手中的第二个预警要一起撤掉，否则玩家会在破绽期间吃到一记
                // 「已经躲开的那一下」的余波。
                cancelHazardsFrom(enemy);
                hitStop = Math.max(hitStop, ARPG.hitStop);
                cameraShake = Math.max(cameraShake, 0.22);
                playSound("perfect");
                showDamage(player.position, "闪避", false, "perfect");
                spawnDodgeRing();
            }

            function updateHazards(dt) {
                for (let i = hazards.length - 1; i >= 0; i--) {
                    const hazard = hazards[i];
                    hazard.life -= dt;
                    const elapsed = hazard.maxLife - hazard.life;

                    if (hazard.kind === "fan") {
                        // 位置跟着怪走（前摇里它不动，但会被玩家的攻击击退），方向锁死不变。
                        // 位置两边同源所以不会分叉：判定读的也是 source.position。
                        hazard.mesh.position.copy(hazard.source.position).setY(0.08);
                        hazard.mesh.rotation.z = warningSpin(hazard.facing);
                    } else if (elapsed < hazard.trackDuration) {
                        hazard.mesh.position.copy(player.position).setY(0.08);
                    }

                    const ratio = 1 - hazard.life / hazard.maxLife;
                    hazard.mesh.material.opacity = 0.2 + ratio * 0.42;

                    // 记下玩家最后一次待在圈里的时刻。闪避判的是「待到最后一刻才走掉」，
                    // 需要的是这个时间戳，而不是结算那一帧的位置。
                    if (ARPG.enabled && hazardContainsPlayer(hazard)) hazard.lastInsideAt = elapsed;

                    if (hazard.life > 0) continue;

                    scene.remove(hazard.mesh);
                    hazards.splice(i, 1);
                    if (!hazard.source.userData.alive) continue;

                    const hit = hazardContainsPlayer(hazard);

                    // 冲锋的位移从这一刻开始，实际推进在后摇里（见 updateMonsterCombat）。
                    // 判定已经按这条线做完了，冲出去是为了让玩家看懂刚才那条长条是什么。
                    if (hazard.kind === "line" && hazard.source.userData.alive) {
                        hazard.source.userData.dash = {
                            dir: new THREE.Vector3(Math.sin(hazard.facing), 0, Math.cos(hazard.facing)),
                            speed: hazard.dashSpeed,
                            left: hazard.dashDistance
                        };
                    }

                    // 直线的爆点放在冲刺路径中段。放在 mesh.position（怪的脚下）会读成怪自爆，
                    // 而这一下的重点是「它扑过来了」。
                    const burstAt = hazard.kind === "line"
                        ? hazard.origin.clone()
                            .addScaledVector(new THREE.Vector3(Math.sin(hazard.facing), 0, Math.cos(hazard.facing)), hazard.length * 0.5)
                            .setY(0.5)
                        : hazard.mesh.position.clone().setY(0.5);
                    buildPopEffect(burstAt, 14, 0xff7b52);
                    cameraShake = Math.max(cameraShake, 0.3);
                    playSound("hit");
                    damageOreFromHazard(hazard);
                    if (hit) {
                        damagePlayer(hazard.damage, hazard.source.position, hazard.knockback);
                        continue;
                    }

                    // 空挥。贴着边走掉的给破绽，站得远的什么都不给——不加这道门槛的话
                    // 站在十米外挖矿的人会一直白拿奖励，破绽就成了背景噪音。
                    if (ARPG.enabled && hazard.lastInsideAt !== undefined
                        && hazard.maxLife - hazard.lastInsideAt <= ARPG.perfectWindow) {
                        triggerPerfectDodge(hazard.source);
                    }
                }
            }

            function damageEnemy(target, amount, shown, big) {
                const data = target.userData;
                if (!data.alive) return;
                // 破绽期间受伤翻倍。放在这一层而不是 playerAttack 里，宠物的火球因此
                // 也吃这个加成——玩家躲得好，整个队伍的输出窗口一起打开。
                let heavy = big;
                if (ARPG.enabled && data.attackState === "stunned") {
                    amount *= ARPG.stunDamage;
                    shown *= ARPG.stunDamage;
                    heavy = true;
                }
                data.hp -= amount;
                // 跨过三成血就换档。只给守卫：游荡怪掉血很快，让它们也换档会把走廊里
                // 每一次照面都变成一场小 boss 战。
                if (ARPG.enabled && !data.frenzy && data.type === "monster"
                    && data.hp > 0 && data.hp / data.maxHp < ARPG.frenzyThreshold) {
                    enterFrenzy(target);
                }
                showDamage(target.position, `-${Math.round(shown)}`, heavy);
                flashEnemy(target);
                syncHealthBar(target);
                if (data.type === "dragon") {
                    updateBossUI();
                }
                if (data.hp <= 0) killEnemy(target);
            }

            function flashEnemy(target) {
                for (const mesh of target.userData.meshes || []) {
                    const material = mesh.material;
                    if (!material || !material.emissive || material.userData.flashTimer) continue;
                    const emissive = material.emissive.getHex();
                    const intensity = material.emissiveIntensity;
                    material.emissive.setHex(0xffb9a4);
                    material.emissiveIntensity = 0.6;
                    material.userData.flashTimer = setTimeout(() => {
                        material.emissive.setHex(emissive);
                        material.emissiveIntensity = intensity;
                        material.userData.flashTimer = null;
                    }, 70);
                }
            }

            function killEnemy(target) {
                const data = target.userData;
                data.alive = false;
                if (data.wave) finalWave.killed += 1;
                data.attackable = false;
                cancelHazardsFrom(target);
                buildDeathDebris(target);
                scene.remove(target);

                const enemyIndex = enemies.indexOf(target);
                if (enemyIndex >= 0) enemies.splice(enemyIndex, 1);

                // 游荡怪只掉金币。钻石是守卫的专属产出，一局就那么十几颗、每一颗都对着
                // 一次锄头升级；游荡怪有六只还会重复遭遇，掉钻石会把那套精算的供给冲垮，
                // 也会让玩家改去刷杂兵而不是打守卫——而守卫才是矿墙推进的那道门。
                if (data.type === "rover") {
                    dropCoins(target.position.clone().setY(1.4), data.config.drop);
                    // 杂兵叫得高一点。守卫是这条线的门，走廊里这六只是路过的，
                    // 同一个音色差一个音高就够把两者分开，不用再造一个音。
                    playSound("slay", 1.3);
                }

                if (data.type === "monster") {
                    const at = target.position.clone().setY(1.4);
                    const gemDrop = guardGemDrop(data.tierId);
                    // 没钻石可掉的档位一定要掉金币，否则那一档的守卫打完什么都不给。高级守卫就是
                    // 这种情况：锄头到它那儿已经满级，钻石没有去处，金币正好喂进化的开销。
                    if (ECON.guardKeepsCoins || !gemDrop) dropCoins(at, data.config.drop);
                    // 钻石抛得比金币散一点，让它在一堆金币里显出来。
                    if (gemDrop) dropCoins(at, gemDrop, Object.assign({ kind: "gem" }, BALANCE.coinToss.guardGem));
                    playSound("slay");
                }
            }

            function buildDeathDebris(target) {
                const color = target.userData.tier ? target.userData.tier.chunkColor : 0x8a7f92;
                for (let i = 0; i < 14; i++) {
                    const mesh = new THREE.Mesh(shared.box, new THREE.MeshStandardMaterial({ color, roughness: 0.85 }));
                    const scale = 0.22 + random() * 0.24;
                    mesh.scale.setScalar(scale);
                    mesh.position.copy(target.position).add(new THREE.Vector3(
                        (random() - 0.5) * 2,
                        0.8 + random() * 2.4,
                        (random() - 0.5) * 2
                    ));
                    scene.add(mesh);
                    effects.push({
                        type: "chunk",
                        mesh,
                        velocity: new THREE.Vector3(
                            (random() - 0.5) * 6,
                            4 + random() * 4,
                            (random() - 0.5) * 6
                        ),
                        spin: new THREE.Vector3(random() * 5, random() * 5, random() * 5),
                        life: 1.1 + random() * 0.5,
                        groundY: scale * 0.5
                    });
                }
            }

            // 血条要正对相机。它挂在怪身上，而 quaternion 是**局部**朝向——
            // 直接抄相机的那一版漏了宿主自己的旋转：世界朝向算出来是「怪的转身 × 相机朝向」，
            // 于是怪一转身，血条跟着转，转到侧对相机时就只剩一条竖着的暗边，
            // 红色那一截整个看不见。而怪几乎一直在转（追人时每帧 lerp 朝向玩家）。
            //
            // 所以要先把宿主的世界旋转除掉：局部 = 宿主世界旋转⁻¹ × 相机朝向。
            const billboardQuat = new THREE.Quaternion();

            function updateBillboards() {
                for (const enemy of enemies) {
                    const bar = enemy.userData.healthBar;
                    if (!bar) continue;
                    enemy.getWorldQuaternion(billboardQuat);
                    bar.quaternion.copy(billboardQuat.invert()).multiply(camera.quaternion);
                }
            }

            function createEggMesh() {
                const group = new THREE.Group();
                const shell = new THREE.Mesh(
                    new THREE.SphereGeometry(0.52, 14, 12),
                    new THREE.MeshStandardMaterial({
                        color: 0xf1e2ff,
                        emissive: 0x6b3bb8,
                        emissiveIntensity: 0.55,
                        roughness: 0.42
                    })
                );
                shell.scale.set(1, 1.32, 1);
                shell.castShadow = true;
                group.add(shell);
                for (let i = 0; i < 4; i++) {
                    const spot = new THREE.Mesh(
                        shared.sphere,
                        new THREE.MeshStandardMaterial({ color: 0x8b5cf6, emissive: 0x3b1d7a, emissiveIntensity: 0.7 })
                    );
                    const angle = (i / 4) * Math.PI * 2;
                    spot.scale.setScalar(0.22);
                    spot.position.set(Math.cos(angle) * 0.4, 0.12 + (i % 2) * 0.3, Math.sin(angle) * 0.4);
                    group.add(spot);
                }
                return group;
            }

            // 龙蛋固定在中级矿和高级矿之间那条走廊的中线上，开局就摆在那儿。
            //
            // 原先它是「凿穿一段中级以上的矿墙就掉出来」，落点取离玩家最近的那段矿。
            // 那套的毛病是玩家不知道蛋在哪、也不知道什么时候会有——每一局的位置都不一样，
            // 于是「去把蛋找出来」这件事在体感上是随机的，而它本该是这条线最明确的一个目标。
            //
            // 固定点的好处是它可以**很早就被看见**：蛋一进画面，那个锁形标记（屏幕空间的，
            // 出画自动隐藏）就亮起来，玩家凿穿低级矿站进第一条走廊时就看得到远处有东西等着。
            // 摸不到没关系——要走到 32.4 得先凿穿中级矿，也就是二级锄头之后。
            // 「早早看见、很久之后才拿到」正是想要的。
            //
            // 走廊范围 30.1~34.8，取中线（32.45）。角度取扇形中线，玩家出城一路直走就能撞上。
            //
            // 现算而不是存成常量：矿环半径是可以在调参面板里改的，而那些覆盖值要等
            // init() 里的 setupTuning() 才写进 ORE_TIERS。存成模块级常量的话它在脚本
            // 求值时就定死了，调参改完环半径，蛋会留在旧走廊的位置——而那时那儿是矿墙里。
            function eggSitePosition() {
                if (C_BLOCKS) return cityLevel>=4?new THREE.Vector3(-2.9,0,-28):new THREE.Vector3(2.9,0,-22);
                const radius = (ORE_TIERS.mid.ringRadius + ORE_TIERS.mid.ringThickness / 2 +
                    ORE_TIERS.high.ringRadius - ORE_TIERS.high.ringThickness / 2) / 2;
                return new THREE.Vector3(
                    Math.cos(SECTOR.center) * radius,
                    0,
                    Math.sin(SECTOR.center) * radius
                );
            }

            function spawnFixedEgg() {
                if (eggSpawned) return;
                if(C_BLOCKS && cityLevel<3)return;
                spawnEggAt(eggSitePosition(), true);
            }

            // 留着当兜底：蛋要是因为任何原因没摆出来，watchdog 会把它补上。
            // 位置仍然是那个固定点——「随机落点」那套已经整个撤掉了。
            function ensureEggAvailability() {
                if (pet || carryingEgg || eggPickup || eggSpawned || eggPlace) return;
                spawnFixedEgg();
            }

            function updateProgressWatchdog(dt) {
                watchdogTimer += dt;
                if (watchdogTimer < 1.5) return;
                watchdogTimer = 0;
                ensureEggAvailability();
                showEvolveWhenReachable();
                maybeShowSealOffering();
                // 单轨的窗口是事件驱动的（升完武器、破壳），但那些回调只在成功路径上跑。
                // watchdog 每 1.5 秒对一次账，免得任何一条边角分支把锻造台永久留在错误状态。
                syncForgeWindow();
                if (petEvolved && !finaleStarted && ringRemaining("high") <= 0) {
                    breachedByTier.high = Math.max(1, breachedByTier.high);
                    checkFinaleTrigger();
                }
                if (tutorialVisible && cityLevel > 0) setTutorial(false);
                ensureProgressAffordable();
            }

            // 没有任何收入来源却买不起下一步时兜底，避免流程走到死路。
            function ensureProgressAffordable() {
                // C 的下一矿区可能只是尚未建成开放，不能误判资源耗尽并发放高级宝石。
                // C 由区块资源预算和通关回归保证可负担，禁止自动补资源。
                if (C_BLOCKS || finaleStarted) return;
                // 只算挖得动的矿：锄头门槛会让玩家守着一地凿不开的矿，却没钱升级锄头。
                if (oreNodes.some(node => !node.cleared && canMine(node))) return;

                // 锻造台原先被排除在兜底之外，理由是「可选支线，买不起也卡不住任何东西」。
                // 钻石单轨之后这条不成立了：武器 Lv3 挡在进化前面，不买就没有进化台，
                // 整局停在那儿。排除它等于留一个死锁。
                //
                // 判据里的 group.visible 顺带把单轨管住了——被收起来的那半段窗口里
                // 锻造台不可见，兜底不会替一张玩家现在根本买不到的地贴发钻石。
                const unpaid = zone => zone && zone.group.visible && !zone.complete &&
                    zone.cost - zone.paid > walletOf(tileCurrency(zone.id), tileShardGrade(zone.id));
                // 优先补锄头：补别的地贴解不开「挖不动」这个死结。
                const pickaxeZone = zones.find(zone => zone.id === "pickaxe");
                const blocking = unpaid(pickaxeZone) && isZonePayable(pickaxeZone)
                    ? pickaxeZone
                    : zones.find(zone => unpaid(zone) && isZonePayable(zone));
                if (!blocking) return;

                // 「还有怪可打」这一条得按卡住的地贴收什么货币来判，不能只看还有没有敌人活着。
                // 三种货币的产地互不重叠，而这个函数是整条流程的最后一道兜底：判宽了就死锁。
                // 走廊里那六只游荡怪只掉金币，不分货币的话它们会把钻石和宝石的兜底一直顶住——
                // 玩家守着一堆凿不动的矿、和一只给不了他要的那种钱的怪。
                const currency = tileCurrency(blocking.id);
                const stillEarning = enemy => {
                    const data = enemy.userData;
                    if (!data.alive) return false;
                    // 宝石只从矿体里出，任何怪都不掉。场上还剩几只怪不构成「再等等就有了」，
                    // 顶在这儿只会让宝石缺口的兜底永远不触发。挖得动的矿在函数开头就已经排除过了。
                    if (currency === "shard") return false;
                    const gemDrop = Boolean(ECON.guardGems && ECON.guardGems[data.tierId]);
                    if (currency === "gem") return data.type === "monster" && gemDrop;
                    // 金币：游荡怪一律掉，但得是玩家走得到的那几只（见 roverReachable）。
                    // 守卫要看这一档有没有钻石可掉，有的话就不掉金币了（guardKeepsCoins）。
                    // 钻石版三档守卫全掉钻石，那一版里守卫因此完全不是金币来源——
                    // 金币缺口时它们活着也不该顶住兜底。
                    if (data.type === "rover") return roverReachable(enemy);
                    return ECON.guardKeepsCoins || !gemDrop;
                };
                if (enemies.some(stillEarning)) return;

                // 先把散落在地上的钱收回来——那是玩家已经赚到的。不能因为远处还躺着几枚
                // 捡不到的金币就让兜底永远不触发。影子金币跳过，它本来就不进账。
                if (coinDrops.length > 0) {
                    for (const coin of coinDrops) {
                        scene.remove(coin.mesh);
                        if (coin.ghost) continue;
                        if (coin.gem) gainGems(1);
                        else if (coin.shard) shards[coin.grade] += 1;
                        else coins += 1;
                    }
                    coinDrops.length = 0;
                }
                // 按地贴自己的货币补。原来一律补金币，钻石地贴卡住时补了等于没补。
                const short = blocking.cost - blocking.paid;
                if (C_BLOCKS && walletOf(currency, tileShardGrade(blocking.id)) < short) {
                    const missing = short - walletOf(currency, tileShardGrade(blocking.id));
                    blockState.fallback += missing; blockState.fallbackEvents.push({ at: runClock, tile: blocking.id, currency, missing });
                }
                const grade = tileShardGrade(blocking.id);
                if (currency === "gem") {
                    if (gems < short) gainGems(short - gems);
                } else if (currency === "shard" && grade) {
                    // 宝石只可能少，不可能多赚：它的供给被矿层储量物理封死，玩家挖空了
                    // 那一层还差几颗的话，没有任何别的途径能补上——这是三种货币里最容易
                    // 变成死路的一种，兜底必须认品质，补错档等于没补。
                    if (shards[grade] < short) shards[grade] = short;
                } else if (currency === "coin" && coins < short) {
                    coins = short;
                }
                syncBackCoins();
                updateUI();
            }

            function findClearSpot(position, clearance = 1.5) {
                const spot = position.clone().setY(0);
                const push = (cx, cz, radius) => {
                    const dx = spot.x - cx;
                    const dz = spot.z - cz;
                    const minDistance = radius + clearance;
                    const distance = Math.hypot(dx, dz);
                    if (distance >= minDistance) return false;
                    if (distance < 0.0001) {
                        spot.x = cx + minDistance;
                        return true;
                    }
                    const scale = minDistance / distance;
                    spot.x = cx + dx * scale;
                    spot.z = cz + dz * scale;
                    return true;
                };
                for (let pass = 0; pass < 8; pass++) {
                    let moved = false;
                    for (const collider of solidColliders) {
                        if (collider.radius > 0 && push(collider.x, collider.z, collider.radius)) moved = true;
                    }
                    scanNearbyColumns(spot, clearance + 1, column => {
                        if (column.blockCount <= 0) return;
                        if (push(column.x, column.z, Math.max(column.halfArc, column.halfDepth))) moved = true;
                    });
                    const limit = CONFIG.arenaRadius - 3;
                    const distance = Math.hypot(spot.x, spot.z);
                    if (distance > limit) {
                        spot.x *= limit / distance;
                        spot.z *= limit / distance;
                        moved = true;
                    }
                    // 推开碰撞体时很容易被挤出扇形，掉在玩家走不到的地方——龙蛋落在那儿就卡关了。
                    const priorX = spot.x;
                    const priorZ = spot.z;
                    clampToSector(spot);
                    if (spot.x !== priorX || spot.z !== priorZ) moved = true;
                    if (!moved) break;
                }
                return spot;
            }

            // silent：开局摆固定蛋时用。那一刻玩家还在城里、蛋在三十米外的画外，
            // 播「发现龙蛋」的提示音和爆点等于替一件他看不见的东西喊了一嗓子。
            // 锁形标记照常挂上——它自己会在出画时隐藏，等蛋进画面才亮。
            function spawnEggAt(position, silent) {
                eggSpawned = true;
                const mesh = createEggMesh();
                mesh.position.copy(findClearSpot(position)).setY(0.95);
                scene.add(mesh);
                eggPickup = { mesh, bob: random() * 6, progress: 0 };
                setEggLockProgress(0);
                ui.eggLock.classList.add("show");
                if (silent) return;
                toast("发现龙蛋，靠近拾取后带回孵化台");
                buildPopEffect(mesh.position.clone(), 20, 0xc08bff);
                playSound("upgrade");
            }

            function setEggLockProgress(progress) {
                if (!ui.eggLockBar) return;
                ui.eggLockBar.style.strokeDashoffset = `${175.93 * (1 - progress)}`;
            }

            function hideEggLock() {
                ui.eggLock.classList.remove("show", "charging");
                // 定位时写过内联 opacity，优先级高于 .show，只摘 class 是盖不住的：
                // 不清掉的话这枚指示环会一直停在拾取瞬间的屏幕位置，连终局演出都还挂着。
                ui.eggLock.style.opacity = "";
                setEggLockProgress(0);
            }

            function updateEggLockPosition() {
                if (!eggPickup) return;
                const point = eggPickup.mesh.position.clone();
                point.y += 1.1;
                point.project(camera);
                if (point.z > 1 || Math.abs(point.x) > 1.2 || Math.abs(point.y) > 1.2) {
                    ui.eggLock.style.opacity = "0";
                    return;
                }
                ui.eggLock.style.opacity = "1";
                ui.eggLock.style.left = `${(point.x * 0.5 + 0.5) * innerWidth}px`;
                ui.eggLock.style.top = `${(-point.y * 0.5 + 0.5) * innerHeight}px`;
            }

            function updateEgg(dt, elapsed) {
                if (eggPlace) {
                    updateEggPlace(dt);
                    hideEggLock();
                    return;
                }
                if (carryingEgg && heldEgg) {
                    heldEgg.rotation.y += dt * 0.9;
                    heldEgg.position.y = 1.5 + Math.sin(elapsed * 4) * 0.04;
                    hideEggLock();
                    return;
                }
                if (!eggPickup) {
                    hideEggLock();
                    return;
                }
                eggPickup.mesh.rotation.y += dt * 1.4;
                eggPickup.mesh.position.y = 0.95 + Math.sin(elapsed * 3.2 + eggPickup.bob) * 0.1;
                const inRange = flatDistance(eggPickup.mesh.position, player.position) < CONFIG.eggPickupRange;
                if (inRange) {
                    eggPickup.progress = Math.min(1, eggPickup.progress + dt / CONFIG.eggPickupDuration);
                    ui.eggLock.classList.add("charging");
                    if (eggPickup.progress >= 1) {
                        pickUpEgg();
                        return;
                    }
                } else {
                    eggPickup.progress = 0;
                    ui.eggLock.classList.remove("charging");
                }
                setEggLockProgress(eggPickup.progress);
                updateEggLockPosition();
            }

            function pickUpEgg() {
                if (!eggPickup || carryingEgg) return;
                carryingEgg = true;
                heldEgg = eggPickup.mesh;
                playerVisual.add(heldEgg);
                heldEgg.position.set(-0.62, 1.5, 0.42);
                heldEgg.scale.setScalar(0.68);
                eggPickup = null;
                hideEggLock();
                toast(cityLevel >= 3 ? "带龙蛋回主城孵化台" : "先升级主城解锁孵化台");
                playSound("coin");
            }

            function startEggPlace() {
                if (!heldEgg) return;
                const start = new THREE.Vector3();
                heldEgg.getWorldPosition(start);
                playerVisual.remove(heldEgg);
                scene.add(heldEgg);
                heldEgg.position.copy(start);
                eggPlace = {
                    mesh: heldEgg,
                    start,
                    end: city.nestPos.clone(),
                    t: 0
                };
                heldEgg = null;
                carryingEgg = false;
                toast("安放龙蛋");
                playSound("upgrade");
            }

            function updateEggPlace(dt) {
                eggPlace.t = Math.min(1, eggPlace.t + dt / CONFIG.eggPlaceDuration);
                const t = eggPlace.t * eggPlace.t * (3 - 2 * eggPlace.t);
                eggPlace.mesh.position.lerpVectors(eggPlace.start, eggPlace.end, t);
                eggPlace.mesh.position.y += Math.sin(Math.PI * t) * 2.2;
                eggPlace.mesh.rotation.y += dt * 3.2;
                const scale = 0.68 + t * 0.42;
                eggPlace.mesh.scale.setScalar(scale);
                if (eggPlace.t >= 1) finishEggPlace();
            }

            function finishEggPlace() {
                const mesh = eggPlace.mesh;
                eggPlace = null;
                city.egg = mesh;
                mesh.position.copy(city.nestPos);
                buildPopEffect(city.nestPos.clone(), 24, 0xc08bff);
                playSound("upgrade");
                defer(0.62, hatchPet);
            }

            function hatchPet() {
                markRun("hatch");
                if (city.egg) {
                    buildPopEffect(city.egg.position.clone(), 30, 0xffe27a);
                    scene.remove(city.egg);
                    city.egg = null;
                }
                createPet();
                cameraShake = Math.max(cameraShake, 0.55);
                playSound("upgrade");
                power += 1420;
                updateUI();
                toast("宠物幼龙孵化成功，它会自动帮你战斗");
                // 单轨的第三棒：破壳之后锻造台重新亮起来收 Lv3。
                // 武器线被关掉时它不存在，进化台就得在这儿直接放出，否则宠物线断在这里。
                if (weaponEnabled()) syncForgeWindow();
                else showEvolveWhenReachable();
            }

            function createPet() {
                pet = new THREE.Group();
                const bodyMat = new THREE.MeshStandardMaterial({
                    color: 0x35c6d8,
                    emissive: 0x0b4a5c,
                    emissiveIntensity: 0.6,
                    roughness: 0.5
                });
                const wingMat = new THREE.MeshStandardMaterial({
                    color: 0x8ce9ff,
                    emissive: 0x1c6f92,
                    emissiveIntensity: 0.55,
                    transparent: true,
                    opacity: 0.88,
                    side: THREE.DoubleSide,
                    roughness: 0.4
                });

                const body = new THREE.Mesh(new THREE.SphereGeometry(0.52, 14, 12), bodyMat);
                body.scale.set(1.15, 0.92, 1.5);
                body.castShadow = true;
                pet.add(body);

                const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 10), bodyMat);
                head.position.set(0, 0.28, 0.78);
                head.castShadow = true;
                pet.add(head);

                const snout = new THREE.Mesh(shared.box, bodyMat);
                snout.scale.set(0.3, 0.22, 0.4);
                snout.position.set(0, 0.2, 1.05);
                pet.add(snout);

                const wings = [];
                for (const side of [-1, 1]) {
                    const wing = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.95), wingMat);
                    wing.position.set(side * 0.72, 0.28, -0.1);
                    wing.rotation.set(-0.4, side * 0.5, side * 0.3);
                    pet.add(wing);
                    wings.push(wing);
                }

                const tail = new THREE.Mesh(new THREE.ConeGeometry(0.24, 1.1, 8), bodyMat);
                tail.rotation.x = Math.PI / 2;
                tail.position.set(0, 0.05, -1.05);
                pet.add(tail);

                for (const side of [-1, 1]) {
                    const eye = new THREE.Mesh(shared.sphere, new THREE.MeshBasicMaterial({ color: 0xfff3b0 }));
                    eye.scale.setScalar(0.12);
                    eye.position.set(side * 0.15, 0.34, 1);
                    pet.add(eye);
                }

                pet.userData = {
                    bodyMat,
                    wingMat,
                    wings,
                    body,
                    fireTimer: 0,
                    fireInterval: BALANCE.pet.hatched.fireInterval,
                    damage: BALANCE.pet.hatched.damage,
                    range: BALANCE.pet.hatched.range,
                    beamColor: 0x8ce9ff
                };
                pet.position.copy(player.position).add(new THREE.Vector3(-2, 2.6, -1.6));
                scene.add(pet);
            }

            function updatePet(dt, elapsed) {
                if (!pet) return;
                const data = pet.userData;
                const behind = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
                const side = new THREE.Vector3(-behind.z, 0, behind.x);
                const desired = player.position.clone()
                    .addScaledVector(behind, -1.9)
                    .addScaledVector(side, 1.7);
                desired.y = 2.75 + Math.sin(elapsed * 2.4) * 0.24;
                pet.position.lerp(desired, 1 - Math.exp(-4.2 * dt));

                const flap = Math.sin(elapsed * (petEvolved ? 13 : 9));
                data.wings[0].rotation.z = 0.3 + flap * 0.5;
                data.wings[1].rotation.z = -0.3 - flap * 0.5;

                let aim = null;
                let aimDistance = Infinity;
                for (const enemy of enemies) {
                    if (!enemy.userData.alive || !enemy.userData.attackable) continue;
                    // 宠物和弓箭受同一条视线约束。它是自动开火的，不挡的话玩家
                    // 什么都不用做，站在没凿开的墙前面就有人替他把走廊清空。
                    if (!inPlayerSight(enemy)) continue;
                    const distance = flatDistance(enemy.position, player.position);
                    if (distance < aimDistance) {
                        aimDistance = distance;
                        aim = enemy;
                    }
                }

                if (aim && aimDistance <= data.range) {
                    const facing = aim.position.clone().sub(pet.position).setY(0);
                    if (facing.lengthSq() > 0.01) {
                        pet.rotation.y = lerpAngle(pet.rotation.y, Math.atan2(facing.x, facing.z), 1 - Math.exp(-9 * dt));
                    }
                    data.fireTimer -= dt;
                    if (data.fireTimer <= 0) {
                        data.fireTimer = data.fireInterval;
                        petShoot(aim);
                    }
                } else {
                    pet.rotation.y = lerpAngle(pet.rotation.y, player.rotation.y, 1 - Math.exp(-5 * dt));
                }
            }

            function createChainBolt(from, to) {
                const points = [from.clone()];
                const delta = to.clone().sub(from);
                const sideways = new THREE.Vector3(-delta.z, 0, delta.x).normalize();
                for (let i = 1; i < 7; i++) {
                    points.push(from.clone().lerp(to, i / 7)
                        .addScaledVector(sideways, (i % 2 ? 1 : -1) * (0.16 + random() * .2)));
                }
                points.push(to.clone());
                const path = new THREE.CurvePath();
                for (let i = 1; i < points.length; i++) path.add(new THREE.LineCurve3(points[i - 1], points[i]));
                const group = new THREE.Group();
                for (const [radius, color, opacity] of [[.13, 0x4cbcff, .45], [.045, 0xecffff, 1]]) {
                    const mesh = new THREE.Mesh(new THREE.TubeGeometry(path, 28, radius, 4, false),
                        new THREE.MeshBasicMaterial({color, transparent:true, opacity, depthWrite:false, blending:THREE.AdditiveBlending}));
                    mesh.userData.opacity = opacity;
                    group.add(mesh);
                }
                scene.add(group);
                effects.push({type:"chainBolt",mesh:group,life:.34,maxLife:.34});
            }

            function petShoot(target) {
                if (petEvolved) {
                    const struck = new Set();
                    const damage = pet.userData.damage;
                    const jump = (enemy, from) => {
                        if (!enemy?.userData.alive || !enemy.userData.attackable || finaleStarted) return;
                        const at = enemy.position.clone().setY(1.3);
                        createChainBolt(from, at);
                        struck.add(enemy);
                        damageEnemy(enemy, damage, damage, true);
                        buildPopEffect(at, 6, 0x9eeaff);
                        pet.userData.maxSplashHits = Math.max(pet.userData.maxSplashHits || 0, struck.size);
                        if (struck.size >= BALANCE.pet.evolved.chainTargets) return;
                        defer(.045, () => {
                            let next = null, closest = BALANCE.pet.evolved.chainRange;
                            for (const candidate of enemies) {
                                if (struck.has(candidate) || !candidate.userData.alive || !candidate.userData.attackable || !inPlayerSight(candidate)) continue;
                                const distance = flatDistance(candidate.position, at);
                                if (distance > closest || pathCrossesOre(at, candidate.position, .05)) continue;
                                next = candidate; closest = distance;
                            }
                            if (next) jump(next, at);
                        });
                    };
                    jump(target, pet.position.clone());
                    playSound("ice");
                    return;
                }
                createProjectile(pet.position.clone(), target, pet.userData.beamColor, 26, hit => {
                    if (!hit.userData.alive) return;
                    buildPopEffect(hit.position.clone().setY(1.5), 8, pet.userData.beamColor);
                    damageEnemy(hit, pet.userData.damage, pet.userData.damage, false);
                });
                playSound("ice");
            }

            function evolvePet() {
                if (!pet || petEvolved) return;
                petEvolved = true;
                const data = pet.userData;

                cinematicFlash(0xffc85a);
                buildPopEffect(pet.position.clone(), 40, 0xffe27a);
                effects.push({
                    type: "evolvePillar",
                    mesh: createLightPillar(pet.position.clone(), 0xffd98a),
                    life: 1.2,
                    maxLife: 1.2
                });

                data.bodyMat.color.setHex(0xffb347);
                data.bodyMat.emissive.setHex(0x9c3b06);
                data.bodyMat.emissiveIntensity = 0.95;
                data.wingMat.color.setHex(0xffd07a);
                data.wingMat.emissive.setHex(0xa33f05);
                data.damage = BALANCE.pet.evolved.damage;
                data.fireInterval = BALANCE.pet.evolved.fireInterval;
                data.range = BALANCE.pet.evolved.range;
                data.beamColor = 0xffb347;
                pet.scale.setScalar(1.85);

                power += BALANCE.pet.evolved.powerGain;
                updateUI();
                playSound("upgrade");
                cameraShake = Math.max(cameraShake, 0.8);
                toast("宠物进化完成");
                defer(0.9, checkFinaleTrigger);
            }

            function createLightPillar(position, color) {
                const mesh = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.5, 1.9, 14, 18, 1, true),
                    new THREE.MeshBasicMaterial({
                        color,
                        transparent: true,
                        opacity: 0.5,
                        side: THREE.DoubleSide,
                        depthWrite: false
                    })
                );
                mesh.position.copy(position).setY(7);
                scene.add(mesh);
                return mesh;
            }

            function cinematicFlash(color) {
                const mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(2, 14, 10),
                    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7, depthWrite: false })
                );
                mesh.position.copy(pet ? pet.position : player.position);
                scene.add(mesh);
                effects.push({ type: "flash", mesh, life: 0.45, maxLife: 0.45 });
            }

            const STORE_URL = "https://play.google.com/store/apps/details?id=com.farlightgames.samo.gp";
            const finale = {
                dragon: null,
                landing: null,
                // 玩家砸开的那一段（宝石版）。金币版留空，走 sealedDragonSite()。
                forcedSite: null,
                charge: -1,
                emerge: -1,
                sealedNodes: [],
                sparkTimer: 0,
                crumbleTimer: 0,
                hp: CONFIG.bossDisplayHp,
                maxHp: CONFIG.bossDisplayHp
            };

            function checkFinaleTrigger() {
                // 宝石版下终局只能由 breakSeal() 触发。不让路的话，进化完成的那一刻
                // 终局就自己起来了，献祭点还没来得及出现——这套改动的全部意义都在
                // 那笔金币和玩家自己抡的那一下上。
                if (ECON.sealOffering) return;
                if (finaleStarted || !petEvolved || breachedByTier.high < 1) return;
                finaleStarted = true;
                defer(0.45, startFlameDragonIntro);
            }

            // 两项各自决定一个画幅：竖屏的横向视野只有二十来度，宽度这项说了算；
            // 横屏反过来由高度这项定。所以宽度要按「竖屏愿意框多少」给——
            // 照着巨龙二十二米的翼展给宽度，竖屏会把机位推到七十米外四十米高，
            // 整个场地连三道矿环一起收进画面，主体缩成一小块。
            function framingDistance(width, height) {
                const vFov = THREE.MathUtils.degToRad(camera.fov);
                const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
                return Math.max(
                    (height / 2) / Math.tan(vFov / 2),
                    (width / 2) / Math.tan(hFov / 2)
                );
            }

            function cinematicShot(center, offset, distance, lookHeight, snap = false) {
                const direction = offset.clone().normalize();
                cinematic.cameraTarget = center.clone().addScaledVector(direction, distance);
                cinematic.lookTarget = center.clone().add(new THREE.Vector3(0, lookHeight, 0));
                // 开场那一拍必须是切镜。相机平滑跟随要一秒才从玩家头顶飞到最外圈矿脉，
                // 而蓄力总共只有 1.7 秒——等它飞到位，矿墙都该炸了。
                if (snap) {
                    camera.position.copy(cinematic.cameraTarget);
                    cameraFocus.copy(cinematic.lookTarget);
                }
            }

            // 巨龙封在走廊尽头那道封印矿里，也就是玩家一路凿到头、砸不开的那道墙。
            // 破封点贴着矿脉中心线，并沿着矿脉转开一段，保证和玩家之间留出对峙需要的距离——
            // 在脚边破土的话镜头根本框不下双方。
            // 转开的余地被扇形卡住：矿脉只铺了这一段，转出去巨龙就变成从空地里钻出来的。
            function sealedDragonSite() {
                const radius = ORE_TIERS[SEALED_TIER].ringRadius;
                // 这里用的是角色朝向那套角度（0 = +Z），和 SECTOR 的 atan2(z, x) 差一个 π/2 的镜像。
                const yawCenter = Math.PI / 2 - SECTOR.center;
                const limit = SECTOR.half - 0.06;
                const distance = Math.hypot(player.position.x, player.position.z);
                const base = distance > 0.5 ? Math.atan2(player.position.x, player.position.z) : yawCenter;
                const cos = distance > 0.5
                    ? (radius * radius + distance * distance - 22 * 22) / (2 * radius * distance)
                    : 1;
                const spread = cos >= 1 ? 0 : (cos <= -1 ? Math.PI : Math.acos(cos));

                // 两侧都试：把理想角夹回扇形，取夹完之后离玩家更远的那一侧。
                let pick = null;
                let widest = -1;
                for (const wish of [base + spread, base - spread]) {
                    const yaw = yawCenter + THREE.MathUtils.clamp(signedAngleDelta(wish, yawCenter), -limit, limit);
                    const point = new THREE.Vector3(Math.sin(yaw) * radius, 0, Math.cos(yaw) * radius);
                    const gap = flatDistance(point, player.position);
                    if (gap > widest) {
                        widest = gap;
                        pick = point;
                    }
                }
                return pick;
            }

            function startOpeningReveal() {
                opening.active = true;
                for (const ore of oreNodes) if (ore.monster) ore.monster.visible = false;
                const node = oreNodes.filter(n => n.tierId === SEALED_TIER)[0];
                const center = node.position.clone().setY(0);
                const approach = center.clone().normalize();
                const lateral = new THREE.Vector3(-approach.z, 0, approach.x);
                finale.dragon = createFlameDragon();
                finale.dragon.position.copy(center).addScaledVector(lateral, -4).setY(-1.6);
                finale.dragon.rotation.y = Math.atan2(lateral.x, lateral.z);
                sealDragonInStone(finale.dragon, true);
                startCinematic([
                    { at: 2.1, run: () => {
                        ui.cineTitle.classList.remove("show");
                        ui.cineSub.classList.remove("show");
                        cinematic.response = 4.5;
                        cinematic.lookTarget = player.position.clone().add(new THREE.Vector3(0, 0.85, -2.6));
                        cinematic.cameraTarget = cinematic.lookTarget.clone().add(new THREE.Vector3(0, FOLLOW_CAMERA.height, FOLLOW_CAMERA.back));
                    } },
                    { at: 3.2, run: finishOpeningReveal }
                ], "opening");
                const offset = approach.clone().multiplyScalar(-1).setY(0.9);
                cinematicShot(center, offset, framingDistance(30, 22), 4.5, true);
                cinematicShot(center, offset, framingDistance(28, 20), 4.5);
                ui.cineTitle.textContent = "FLAME DRAGON";
                ui.cineSub.textContent = LANG === "en" ? "Break the seal. Defeat the dragon. Tap to skip" : "凿穿矿山，击败巨龙 · 点击跳过";
                ui.cineTitle.classList.add("show");
                ui.cineSub.classList.add("show");
                camera.lookAt(cameraFocus);
            }

            function finishOpeningReveal() {
                if (!opening.active) return;
                opening.active = false;
                opening.finished = true;
                for (const ore of oreNodes) if (ore.monster && !ore.monsterRevealed) ore.monster.visible = !HIDE_GUARDS;
                endCinematic();
                cameraFocus.copy(player.position).add(new THREE.Vector3(0, 0.85, -2.6));
                camera.position.copy(cameraFocus).add(new THREE.Vector3(0, FOLLOW_CAMERA.height, FOLLOW_CAMERA.back));
                camera.lookAt(cameraFocus);
                ui.guide.style.display = "";
                ui.cineSub.textContent = LANG === "en" ? "FLAME DRAGON UNSEALED" : "火焰巨龙 破封";
                setTutorial(true, "拖动摇杆移动，走进光圈建设主城");
            }

            function startFlameDragonIntro() {
                // 破封点优先用玩家砸开的那一段（breakSeal 写下的）。没有就退回
                // sealedDragonSite()：金币版仍然走那条路，它按「离玩家最远」挑点。
                finale.landing = finale.forcedSite ? finale.forcedSite.clone() : sealedDragonSite();
                // 破封点吸到最近那段封印矿的正中。烧红是按整段换材质做的，段与段之间有
                // 一条硬边界；破封点按「离玩家最远」挑出来，落在段内哪儿全凭玩家位置，
                // 压在接缝上时巨龙剪影会一半躺在烧红的墙里、一半躺在还青着的墙里，
                // 读起来像它卡在两堵墙中间，而不是要从这一段里挣出来。
                // 只吸角度、不动半径，径向的位置关系（墙厚、玩家站在墙前几米）全都不变。
                const nearestSealedSeg = oreNodes
                    .filter(node => node.tierId === SEALED_TIER && !node.cleared)
                    .sort((a, b) => flatDistance(a.position, finale.landing) - flatDistance(b.position, finale.landing))[0];
                if (nearestSealedSeg) {
                    const radius = Math.hypot(finale.landing.x, finale.landing.z);
                    const segAngle = Math.atan2(nearestSealedSeg.position.z, nearestSealedSeg.position.x);
                    finale.landing.x = Math.cos(segAngle) * radius;
                    finale.landing.z = Math.sin(segAngle) * radius;
                }

                // 整套机位的基准方向：从场心指向破封点的径向，也就是「从城里看向矿墙」的那个方向。
                // 这里原先取的是「从玩家指向破封点」。玩家在城里时两者差不多，但终局是可以在
                // 凿穿高级矿的那一刻触发的，那时他已经站在走廊深处，和破封点几乎在同一条弧上——
                // 两点连线于是变成切向，整套构图跟着绕到矿墙侧面去：巨龙甩出画框（实测咆哮那一拍
                // 包围盒右边界到了 NDC 3.4），前景塞满墙体。而这套镜头本来就是按「越过前两道墙顶
                // 俯视缺口」设计的，只有径向成立。玩家站哪不影响构图——对峙前 braceForBattle
                // 会把他挪到 standPoint。
                const approach = finale.landing.clone().setY(0).normalize();
                const lateral = new THREE.Vector3(-approach.z, 0, approach.x);
                // 破封点会贴到扇形的边上（它就是按「离玩家最远」挑的）。这时候站位往边界外侧
                // 横移七米会直接顶在岩壁上，玩家被边界推回来、对峙那一拍就站到了画框外面。
                // 站位、巨龙朝向、机位侧偏全都以 lateral 为基准，所以整套构图一起镜像到扇形里侧。
                const strayFrom = side => {
                    const spot = finale.landing.clone()
                        .addScaledVector(lateral, side * -7)
                        .addScaledVector(approach, -4);
                    return Math.abs(signedAngleDelta(Math.atan2(spot.z, spot.x), SECTOR.center));
                };
                if (strayFrom(1) > strayFrom(-1)) lateral.negate();
                finale.approach = approach;
                finale.lateral = lateral;
                // 对峙时玩家要站的位置：破封炸开的缺口里、巨龙的侧前方。
                // 先在这里定下来，好让巨龙破封转身时就朝着这个方向，
                // 省掉对峙那一拍再扭一次脖子。
                finale.standPoint = finale.landing.clone()
                    .addScaledVector(lateral, -7)
                    .addScaledVector(approach, -4)
                    .setY(0);
                finale.dragon = finale.dragon || createFlameDragon();
                // 封印姿态：侧身顺着矿环躺进墙里，沉到龙头落在墙高之内
                // （头在模型局部 7.15，乘 1.05 的整体缩放，封印矿墙高 6.2）。
                // 一朝玩家，八米长的头颈就会径直捅向相机、探出墙外那片深色天空，
                // 深色剪影压在深色背景上什么都读不出来。破封时再转过来。
                finale.sealYaw = Math.atan2(lateral.x, lateral.z);
                const facing = finale.standPoint.clone().sub(finale.landing);
                finale.faceYaw = Math.atan2(facing.x, facing.z);
                // 侧身之后头颈还要沿着环往前伸八米，锚点压在破封点上的话，
                // 整片剪影会整体偏出去半个画面，跟烧红的那段墙也对不上。
                // 沿环退回四米，让身体到头的这段落在破封点两侧。
                // 深度只沉一米六：身体下缘到头顶跨了五米半，正好是封印矿墙的高度，
                // 再沉下去剪影底部就会垂到地平线以下——而剪影不受地面遮挡，
                // 会直接糊在画面下方那道橙色高级矿墙上。
                finale.sealAnchor = finale.landing.clone().addScaledVector(lateral, -4).setY(-1.6);
                finale.dragon.position.copy(finale.sealAnchor);
                finale.dragon.rotation.y = finale.sealYaw;
                sealDragonInStone(finale.dragon, true);
                // 烧红的范围收在破封点所在的那段封印矿上。这里不能按固定半径筛：
                // 封印矿只切了两段，段中心相隔三十五米，而破封点是贴着扇形边缘挑的，
                // 离最近的段中心就有十五米——原先那个十米的阈值会一段都够不着，
                // 整个「墙在烧」的铺垫直接消失。改成按段取最近的那一段，外加确实挨着它的邻段。
                const sealedWall = oreNodes.filter(node => node.tierId === SEALED_TIER && !node.cleared);
                const distToLanding = node => flatDistance(node.position, finale.landing);
                sealedWall.sort((a, b) => distToLanding(a) - distToLanding(b));
                // 阈值取十米：相邻段中心相隔十七米半，所以正常只会选中破封点脚下那一段，
                // 只有破封点恰好压在两段接缝上时才会带上邻段。
                finale.sealedNodes = sealedWall.filter((node, index) => index === 0 || distToLanding(node) < 10);
                // 封印点埋在三米多厚的矿墙里，贴地光斑也好、穿出来的光柱也好，都会被墙挡掉或者
                // 变成一根戳在矿脉上的实心烟囱。真正读得出来的是矿墙自己烧红，
                // 所以给这几段单独一份材质来烧——tier 材质是整层共用的，直接改会让整道墙一起亮。
                for (const node of finale.sealedNodes) {
                    node.instanced.material = node.instanced.material.clone();
                }
                // 高级矿压暗，自发光和底色一起压。它紧贴在封印矿身后三米，在破封镜头里
                // 是整个前景，而它那身暖橙比封印矿的深青亮得多——只压自发光的话，画面读起来
                // 会是「巨龙躺在一片橙色矿脉上」，而不是「巨龙封在青色的墙里」。
                // 底色压到三成五之后前景退成暗褐，封印墙才浮得出来。
                // 玩家不会觉得突兀：这一刻镜头刚切走、屏幕上还压着一片闪光。
                // 封印矿本身不能跟着压：它本来就是近黑的底色，再压一档整道墙会黑成背景，
                // 冻在里面的巨龙剪影就成了浮在空地上的一团影子——「封在矿里」这件事本身没了。
                // 它的对比靠的是另一头：破封段的材质单独 clone 出来烧红，同层其余段保持原样。
                // 压之前留一份原色：multiplyScalar 是就地改的，不存原值破封后就调不回去，
                // 高级矿会一直暗着到片尾。
                finale.highTint = shared.oreMaterials.high.color.clone();
                shared.oreMaterials.high.emissiveIntensity = 0.1;
                shared.oreMaterials.high.color.multiplyScalar(0.35);
                finale.charge = 0;
                finale.emerge = -1;
                finale.sparkTimer = 0;
                finale.crumbleTimer = 0.5;

                moveVelocity.set(0, 0, 0);
                stick.x = stick.z = stick.magnitude = 0;

                // 清掉还活着的游荡怪。破封那几个机位都架在走廊里，最高级那条走廊正是玩家
                // 站定对峙的地方——一只杂兵在画面里踱步，或者干脆扑上来挥两下，
                // 会把这段本该只有一件事发生的戏拆成两件。它们也没法在演出里被打，
                // 玩家的输入这会儿已经交给镜头了。
                for (const enemy of enemies.slice()) {
                    if (enemy.userData.type !== "rover") continue;
                    enemy.userData.alive = false;
                    enemy.userData.attackable = false;
                    cancelHazardsFrom(enemy);
                    scene.remove(enemy);
                    enemies.splice(enemies.indexOf(enemy), 1);
                }

                startCinematic([
                    {
                        at: 0,
                        run: () => {
                            cinematic.response = 2;
                            // 蓄力和破封共用一个机位，只做推近：切镜头反而会打断「就是这段墙要裂开」的注视。
                            // 沿切线或从外侧看都会被矿环自己的弧度挡死，只有从内侧高机位才越得过前两道墙。
                            // 抬到 0.6 是硬要求：破封点在最外圈，中层矿环的墙顶会正好切在它腰上，
                            // 压到 0.34 时脚下那片地整个埋在紫色矿墙后面，
                            // 冲击波、焦痕、崩出来的矿块一个都看不见。
                            // 侧偏收到 0.18：偏得多了矿环两侧就不对称，靠相机那侧的残墙
                            // 占掉半个画面，另一侧的直接被推出画外，缺口读起来像矿脉的尽头。
                            // 抬到 0.82（原 0.6）：破封点搬到最外层的封印矿之后，前景换成了
                            // 紧贴其后的高级矿墙——高 5.4、离破封点五到十米，比原先那道又矮又远的
                            // 中层墙难越得多，0.6 的俯角下它会顶进画面下半截。
                            const sealOffset = () => approach.clone().multiplyScalar(-0.86)
                                .addScaledVector(lateral, 0.18)
                                .add(new THREE.Vector3(0, 0.82, 0));
                            // 构图中心留在破封点上：锚点虽然沿环退了四米，但剪影的头颈正好朝
                            // 反方向伸出八米，可见那片的视觉中心又落回了破封点。
                            // 先切到远景，再把目标设成蓄力机位，1.7 秒里一路缓慢推近。
                            // 高度这项在横屏决定距离，不能给小：机位高度按距离等比缩放，
                            // 一近相机就掉回墙顶后面，前面那点抬升全白费。
                            // 宽度这项要按剪影的十四米横跨给足余量，竖屏才不会切掉它的尾段。
                            cinematicShot(finale.landing, sealOffset(), framingDistance(23, 34), 4.5, true);
                            cinematicShot(finale.landing, sealOffset(), framingDistance(20, 28), 4.5);
                            playSound("roar");
                        }
                    },
                    {
                        at: 1.7,
                        run: () => {
                            burstFlameDragon();
                            cinematic.response = 3.2;
                            cinematicShot(
                                // 破封时它已经转向玩家那一侧，头颈沿这个朝向伸出七米。
                                // 中心压在破封点上的话，竖屏那十一米的画宽会把龙头整个甩到画外，
                                // 剩下一堆翅膀和背刺——顶出地面这一下最需要看见的是脸。
                                finale.landing.clone().addScaledVector(
                                    new THREE.Vector3(Math.sin(finale.faceYaw), 0, Math.cos(finale.faceYaw)), 4
                                ),
                                approach.clone().multiplyScalar(-0.86)
                                    .addScaledVector(lateral, 0.18)
                                    // 跟着蓄力镜一起抬到 0.82，两拍共用一个机位、只做推近，
                                    // 高度不一致会在破封那一瞬间读成跳切。
                                    .add(new THREE.Vector3(0, 0.82, 0)),
                                // 比蓄力镜近一成，两个画幅方向都得同步推，只推一项会变成拉远。
                                // 翼尖尾尖会冲出画框，这是破土那一下要的压迫感。
                                framingDistance(11, 25),
                                5
                            );
                        }
                    },
                    {
                        at: 2.9,
                        run: () => {
                            roarFlameDragon();
                            cinematic.response = 2.4;
                            cinematicShot(
                                // 竖屏的画宽只有十五米半，中心压在巨龙脚下的话龙头和整条火舌全在画外，
                                // 得沿朝向挪十米挪到龙嘴和火舌中段之间，只保脸和火。
                                // 这段要框的是「龙身前部到火舌尖」这十五米：龙嘴在破封点前七米，
                                // 火舌再往前十二米，中心挪到十米、画宽给十五米半之后，出框的只剩
                                // 火舌最后一米——那一截冲出画外反而是喷火该有的势头。
                                // 横屏画宽有四十四米，展开的双翼连火舌一起框得下，挪多了反而把翅膀切掉。
                                finale.landing.clone().addScaledVector(
                                    new THREE.Vector3(Math.sin(finale.faceYaw), 0, Math.cos(finale.faceYaw)),
                                    camera.aspect > 1 ? 2 : 10
                                ),
                                approach.clone().multiplyScalar(-0.78)
                                    .addScaledVector(lateral, 0.42)
                                    // 抬到 0.62。破封点移到最外层的封印矿之后，挡在视线里的不再是
                                    // 又矮又远的中层矿墙，而是紧贴在身后三米的高级矿墙——它高 5.4，
                                    // 离破封点只有五到十米，在 0.42 的俯角下会占掉画面下半截，
                                    // 巨龙的腿和缺口地面全糊在那片橙色半透明后面。
                                    .add(new THREE.Vector3(0, 0.62, 0)),
                                // 横屏由高度这项决定，给到二十六才容得下展开的双翼和斜上方那道火舌；
                                // 竖屏横向视野只有二十来度，宽度这项照翼展给会退到七十米外，
                                // 只能让翼尖出框、保住龙头和火舌。
                                framingDistance(15.5, 26),
                                6.2
                            );
                            ui.cineTitle.classList.add("show");
                            ui.cineSub.classList.add("show");
                        }
                    },
                    {
                        at: 4,
                        run: () => breatheFlameDragon()
                    },
                    {
                        at: 5.3,
                        run: () => {
                            cinematic.response = 2.2;
                            // 先把玩家挪进缺口再定机位，否则框的还是他在城里时的四十米纵深。
                            braceForBattle();
                            // 对峙定妆照，也是 CTA 的背景板。横屏中心就压在巨龙身上，
                            // 连翼展一起框得进来，玩家在八米外照样在画面里。
                            // 竖屏画宽只有十九米，装不下二十二米的翼展，索性沿朝向挪五米——
                            // 龙头和玩家都在这一侧，不挪的话龙头贴着左画框、玩家挤在边缘那一小条上，
                            // 读不出两边在对视。翼尖出框换双方对视，这一拍值。
                            cinematicShot(
                                finale.landing.clone().addScaledVector(
                                    new THREE.Vector3(Math.sin(finale.faceYaw), 0, Math.cos(finale.faceYaw)),
                                    camera.aspect > 1 ? 0 : 5
                                ),
                                // 抬到 0.62：玩家只有一米七高，又和巨龙同在最外圈，
                                // 机位低了他整个人就埋在中层矿墙的墙顶后面。抬到这个高度
                                // 视线能从墙顶上方擦过去两米多，双方都露在缺口的空地上。
                                approach.clone().multiplyScalar(-0.7)
                                    .addScaledVector(lateral, 0.25)
                                    .add(new THREE.Vector3(0, 0.62, 0)),
                                // 横屏由高度这项定在三十四米上下，双方连巨龙的翼展都框得进来。
                                // 竖屏由宽度这项定：按双方间距加翼展给（二十八米）要退到七十米外，
                                // 相机会穿过场地中心跑到对面，视线横穿内圈三道矿环，抬多高都挡得死。
                                // 压到十六米，代价是竖屏翼尖出框，玩家贴着画框边缘——但双方都在画面里。
                                framingDistance(16, 28),
                                camera.aspect > 1 ? 4 : 5
                            );
                            ui.cineTitle.classList.remove("show");
                            ui.cineSub.classList.remove("show");
                            showBossUI();
                        }
                    },
                    {
                        at: 8.6,
                        run: () => {
                            ui.bars.classList.remove("show");
                            showCta();
                        }
                    }
                ]);
            }

            function startCinematic(steps, kind = "finale") {
                if (kind === "finale") markRun("finale");
                if (tutorialVisible) setTutorial(false);
                ui.guide.style.display = "none";
                cinematic.active = true;
                cinematic.time = 0;
                cinematic.steps = steps;
                cinematic.index = 0;
                cinematic.response = 2.6;
                cinematic.cameraTarget = camera.position.clone();
                cinematic.lookTarget = cameraFocus.clone();
                ui.bars.classList.add("show");
            }

            function updateCinematic(dt) {
                if (!cinematic.active) return;
                cinematic.time += dt;
                while (cinematic.index < cinematic.steps.length &&
                    cinematic.time >= cinematic.steps[cinematic.index].at) {
                    cinematic.steps[cinematic.index].run();
                    cinematic.index += 1;
                }
            }

            function endCinematic() {
                cinematic.active = false;
                cinematic.steps = [];
                ui.bars.classList.remove("show");
                ui.cineTitle.classList.remove("show");
                ui.cineSub.classList.remove("show");
            }

            function createFlameDragon() {
                const group = new THREE.Group();
                group.scale.setScalar(1.05);
                scene.add(group);

                const scaleMat = new THREE.MeshStandardMaterial({
                    color: 0xb52d18,
                    emissive: 0x5c1000,
                    emissiveIntensity: 0.7,
                    roughness: 0.55
                });
                const bellyMat = new THREE.MeshStandardMaterial({
                    color: 0xf4a13c,
                    emissive: 0x8a3300,
                    emissiveIntensity: 0.9,
                    roughness: 0.5
                });
                const wingMat = new THREE.MeshStandardMaterial({
                    color: 0x8e1f10,
                    emissive: 0xd44a13,
                    emissiveIntensity: 0.7,
                    side: THREE.DoubleSide,
                    roughness: 0.62
                });

                const meshes = [];
                const body = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 12), scaleMat);
                body.scale.set(2.4, 2.15, 4.1);
                body.position.set(0, 3.9, -0.5);
                body.castShadow = true;
                group.add(body);
                meshes.push(body);

                const chest = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 12), scaleMat);
                chest.scale.set(2.15, 1.95, 2.1);
                chest.position.set(0, 4.1, 2.2);
                chest.castShadow = true;
                group.add(chest);
                meshes.push(chest);

                const belly = new THREE.Mesh(new THREE.SphereGeometry(1, 14, 10), bellyMat);
                belly.scale.set(1.7, 1.35, 3.4);
                belly.position.set(0, 2.9, 0.3);
                group.add(belly);
                meshes.push(belly);

                for (let i = 0; i < 8; i++) {
                    const spike = new THREE.Mesh(new THREE.ConeGeometry(0.36, 1.15, 5), bellyMat);
                    spike.position.set(0, 5.95 - i * 0.09, 2.2 - i * 0.95);
                    spike.rotation.x = -0.3;
                    spike.castShadow = true;
                    group.add(spike);
                    meshes.push(spike);
                }

                const neck = new THREE.Group();
                neck.position.set(0, 5.1, 3);
                group.add(neck);
                for (let i = 0; i < 5; i++) {
                    const segment = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 10), scaleMat);
                    const shrink = 1 - i * 0.1;
                    segment.scale.set(0.92 * shrink, 0.88 * shrink, 1.05 * shrink);
                    segment.position.set(0, 0.3 + i * 0.34, i * 0.94);
                    segment.castShadow = true;
                    neck.add(segment);
                    meshes.push(segment);
                }

                const head = new THREE.Group();
                head.position.set(0, 2.05, 4.5);
                neck.add(head);
                const skull = new THREE.Mesh(shared.box, scaleMat);
                skull.scale.set(1.34, 1.06, 2.05);
                skull.castShadow = true;
                head.add(skull);
                meshes.push(skull);
                const brow = new THREE.Mesh(shared.box, scaleMat);
                brow.scale.set(1.44, 0.28, 0.9);
                brow.position.set(0, 0.56, 0.3);
                head.add(brow);
                meshes.push(brow);
                const gullet = new THREE.Mesh(shared.box, new THREE.MeshBasicMaterial({ color: 0x2b0700 }));
                gullet.scale.set(1, 0.72, 1.5);
                gullet.position.set(0, -0.4, 0.42);
                head.add(gullet);

                const jawPivot = new THREE.Group();
                jawPivot.position.set(0, -0.4, -0.5);
                head.add(jawPivot);
                const jaw = new THREE.Mesh(shared.box, bellyMat);
                jaw.scale.set(1.16, 0.38, 1.72);
                jaw.position.set(0, -0.26, 0.84);
                jaw.castShadow = true;
                jawPivot.add(jaw);
                meshes.push(jaw);
                for (const side of [-1, 1]) {
                    const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.36, 5), new THREE.MeshBasicMaterial({ color: 0xfff2cf }));
                    tooth.position.set(side * 0.38, 0.06, 1.4);
                    jawPivot.add(tooth);
                }
                for (const side of [-1, 1]) {
                    const horn = new THREE.Mesh(new THREE.ConeGeometry(0.24, 1.85, 6), bellyMat);
                    horn.position.set(side * 0.55, 0.86, -0.6);
                    horn.rotation.set(-0.85, 0, side * 0.34);
                    horn.castShadow = true;
                    head.add(horn);
                    meshes.push(horn);
                }
                for (const side of [-1, 1]) {
                    const fang = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.42, 5), new THREE.MeshBasicMaterial({ color: 0xfff2cf }));
                    fang.position.set(side * 0.4, -0.4, 0.95);
                    fang.rotation.x = Math.PI;
                    head.add(fang);
                }
                const eyes = [];
                for (const side of [-1, 1]) {
                    const eye = new THREE.Mesh(shared.sphere, new THREE.MeshBasicMaterial({ color: 0xffe066 }));
                    eye.scale.set(0.34, 0.24, 0.24);
                    eye.position.set(side * 0.58, 0.26, 0.5);
                    head.add(eye);
                    eyes.push(eye);
                }
                const mouth = new THREE.Object3D();
                mouth.position.set(0, -0.4, 1.4);
                head.add(mouth);

                const wings = [];
                for (const side of [-1, 1]) {
                    const pivot = new THREE.Group();
                    pivot.position.set(side * 1.9, 5.15, 0.7);
                    group.add(pivot);
                    const plane = new THREE.Group();
                    plane.rotation.y = side * 0.42;
                    pivot.add(plane);

                    const px = x => side * x;
                    const shape = new THREE.Shape();
                    shape.moveTo(px(0), 1.2);
                    shape.quadraticCurveTo(px(3.6), 3, px(8), 2.2);
                    shape.quadraticCurveTo(px(6.6), 0, px(5.8), -1.4);
                    shape.quadraticCurveTo(px(4.9), -0.2, px(4), -2.8);
                    shape.quadraticCurveTo(px(3), -1.2, px(2.2), -4);
                    shape.quadraticCurveTo(px(1.1), -2.4, px(0), -2.2);
                    shape.closePath();
                    const membrane = new THREE.Mesh(new THREE.ShapeGeometry(shape, 14), wingMat);
                    membrane.castShadow = true;
                    plane.add(membrane);
                    meshes.push(membrane);

                    const addBone = (x1, y1, x2, y2, thick) => {
                        const dx = side * (x2 - x1);
                        const dy = y2 - y1;
                        const bone = new THREE.Mesh(shared.box, scaleMat);
                        bone.scale.set(Math.hypot(dx, dy), thick, thick);
                        bone.position.set(side * (x1 + x2) / 2, (y1 + y2) / 2, 0.07);
                        bone.rotation.z = Math.atan2(dy, dx);
                        plane.add(bone);
                        meshes.push(bone);
                    };
                    addBone(0, 0.6, 8, 2.2, 0.36);
                    addBone(3.6, 1.4, 5.8, -1.4, 0.22);
                    addBone(2.4, 0.8, 4, -2.8, 0.22);
                    addBone(1.2, 0.2, 2.2, -4, 0.22);

                    pivot.rotation.set(-0.26, 0, side * 0.5);
                    wings.push({ pivot, side, restZ: side * 0.5 });
                }

                const limbs = [];
                for (const side of [-1, 1]) {
                    for (const forward of [2.1, -2.4]) {
                        const thigh = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), scaleMat);
                        thigh.scale.set(0.85, 1.05, 1.15);
                        thigh.position.set(side * 1.75, 2.5, forward);
                        thigh.castShadow = true;
                        group.add(thigh);
                        meshes.push(thigh);
                        limbs.push(thigh);
                        const leg = new THREE.Mesh(shared.box, scaleMat);
                        leg.scale.set(0.95, 2.6, 1.05);
                        leg.position.set(side * 1.75, 1.3, forward);
                        leg.castShadow = true;
                        group.add(leg);
                        meshes.push(leg);
                        limbs.push(leg);
                        const claw = new THREE.Mesh(shared.box, bellyMat);
                        claw.scale.set(1.15, 0.36, 1.55);
                        claw.position.set(side * 1.75, 0.18, forward + 0.42);
                        group.add(claw);
                        meshes.push(claw);
                        limbs.push(claw);
                    }
                }

                const tail = new THREE.Group();
                tail.position.set(0, 3.7, -3.6);
                group.add(tail);
                for (let i = 0; i < 10; i++) {
                    const shrink = Math.pow(0.86, i);
                    const segment = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 8), scaleMat);
                    segment.scale.set(1.15 * shrink, 1.05 * shrink, 1.25 * shrink);
                    segment.position.set(0, -i * 0.3, -i * 1.05);
                    segment.castShadow = true;
                    tail.add(segment);
                    meshes.push(segment);
                    if (i > 1 && i < 8) {
                        const fin = new THREE.Mesh(new THREE.ConeGeometry(0.22 * shrink * 1.6, 0.8 * shrink * 1.6, 4), bellyMat);
                        fin.position.set(0, 0.85 * shrink + segment.position.y, segment.position.z);
                        fin.rotation.x = -0.28;
                        tail.add(fin);
                        meshes.push(fin);
                    }
                }
                const tailTip = new THREE.Mesh(new THREE.ConeGeometry(0.62, 1.9, 6), bellyMat);
                tailTip.position.set(0, -9 * 0.3, -9 * 1.05 - 0.9);
                tailTip.rotation.x = -Math.PI / 2;
                tailTip.castShadow = true;
                tail.add(tailTip);
                meshes.push(tailTip);

                const glow = new THREE.PointLight(0xff6a1e, 0, 40);
                glow.position.set(0, 6, 5);
                group.add(glow);

                group.userData = {
                    type: "dragon",
                    alive: true,
                    attackable: false,
                    meshes,
                    wings,
                    eyes,
                    limbs,
                    tail,
                    mouth,
                    glow,
                    head,
                    jawPivot,
                    jawTarget: 0,
                    breathTimer: 0,
                    hp: CONFIG.bossDisplayHp,
                    maxHp: CONFIG.bossDisplayHp
                };
                return group;
            }

            // 封印显形。四层半透明矿石叠下来透光率不到一成，把巨龙摆进矿墙里是全黑的，
            // 所以沿用守卫剪影那套：关掉深度测试、把绘制顺序抬到矿体（renderOrder 2）之上，
            // 深色轮廓压在高饱和的矿石上，读出来就是「这段矿墙里嵌着一条龙」。
            // 翅膀、四肢和尾巴收掉——它们伸出去的部分会落在矿墙轮廓外，
            // 而剪影不受地面遮挡，垂到地下的那截会直接糊在内圈空地上。
            function sealDragonInStone(dragon, on) {
                const data = dragon.userData;
                if (!data.sealMaterial) {
                    data.sealMaterial = new THREE.MeshBasicMaterial({
                        color: 0x1c0a12,
                        transparent: true,
                        opacity: 0.78,
                        depthTest: false,
                        depthWrite: false
                    });
                    data.realMaterials = data.meshes.map(mesh => mesh.material);
                    data.realShadows = data.meshes.map(mesh => mesh.castShadow);
                }
                const hidden = [...data.limbs, data.tail, ...data.wings.map(w => w.pivot)];
                for (const part of hidden) part.visible = !on;
                data.meshes.forEach((mesh, i) => {
                    mesh.material = on ? data.sealMaterial : data.realMaterials[i];
                    mesh.renderOrder = on ? 4 : 0;
                    mesh.castShadow = on ? false : data.realShadows[i];
                });
                for (const eye of data.eyes) {
                    eye.material.depthTest = !on;
                    eye.renderOrder = on ? 5 : 0;
                    eye.material.color.setHex(on ? 0xff5a1e : 0xffe066);
                    // 隔着矿墙看，一双眼睛是「石头里有东西」最快被读懂的信号，得放大才认得出。
                    eye.scale.set(on ? 0.72 : 0.34, on ? 0.5 : 0.24, on ? 0.5 : 0.24);
                }
            }

            function burstFlameDragon() {
                const dragon = finale.dragon;
                if (!dragon) return;
                finale.charge = -1;
                finale.emerge = 0;
                sealDragonInStone(dragon, false);
                for (const node of finale.sealedNodes) {
                    node.rejectShake = 0;
                    node.instanced.material.emissive.setHex(node.tier.emissive);
                    node.instanced.material.emissiveIntensity = 0.55;
                }
                // 蓄力时压暗整圈是为了让烧红那一段跳出来，破封之后要反过来：
                // 缺口两侧的残墙是「它从这道矿脉里挣出来」的唯一证据，得让它们重新看得见。
                shared.oreMaterials.high.emissiveIntensity = 0.55;
                if (finale.highTint) shared.oreMaterials.high.color.copy(finale.highTint);
                dragon.userData.glow.intensity = 6;
                cameraShake = Math.max(cameraShake, 1.8);
                playSound("break");

                // 先从还立着的体素里抓一批抛出去，再把矿墙抹掉：
                // 直接 pulverize 的话矿石是凭空消失的，看不出是被龙顶碎的。
                // 只抓封印矿的体素，混进高级矿的橙色碎块就读不出是哪道墙裂了。
                eruptOreChunks(finale.landing, 9, 30, SEALED_TIER);

                const shockwave = new THREE.Mesh(
                    new THREE.RingGeometry(1.2, 2.4, 40),
                    new THREE.MeshBasicMaterial({
                        color: 0xffa03c,
                        transparent: true,
                        opacity: 0.9,
                        side: THREE.DoubleSide,
                        depthWrite: false

            // 「那儿有货」这个信号靠的是这个闪，不是颜色本身。
            const oreShards = [];

            // 把该段应得的宝石埋进矿体。
            //
            // shardYield 是**整环**的产量，这里按段均分；均分用累计差分而不是四舍五入，
            // 段数除不尽时（高级矿 16 颗切 3 段）总数仍然精确等于 shardYield，
            // 而「一环产多少」正是「正好够买一次锄头」这条设计的唯一抓手，不能被舍入吃掉。
            function embedShards(node, cells, group, rand, index) {
                const tier = node.tier;
                if (tier.id === "low" && cityLevel < 2) { node.shardsPending = index; return; }
                const total = tier.shardYield || 0;
                if (!total || tier.sealed || !ECON.shards) return;
                const segments = Math.max(1, tier.segmentCount);
                const count = Math.floor((index + 1) * total / segments) - Math.floor(index * total / segments);
                if (count <= 0) return;

                // 只埋在挡人的格子里。上面那几层挖空后要留在原地当洞顶，埋在洞顶上的宝石
                // 玩家看得见、挖不到，是纯粹的挑衅。
                const pool = cells.filter(cell => cell.blocking && !cell.removed &&
                    (!C_BLOCKS || blockNodeLevel(node) >= 4 || blockColumnRequired(cell.column)));
                if (!pool.length) {
                    // 玩家可在建城前清空整段；延迟产量不能因此被吞掉。
                    dropCoins(node.position, count, { kind: "shard", grade: tier.id });
                    return;
                }

                // 沿切向均匀铺开：候选格按弧向排序后切成 count 份，每份里随机抽一格。
                // 纯随机撒不行——「挖了七成却一颗没碰到」和「挖了两成全捡了」都可能发生，
                // 产量就不再和开采量挂钩，按开采比例倒推出来的那张产量表当场失效。
                pool.sort((a, b) => (a.column.ai - b.column.ai) || (a.column.ri - b.column.ri));

                for (let i = 0; i < count; i++) {
                    const lo = Math.floor(i * pool.length / count);
                    const hi = Math.max(lo + 1, Math.floor((i + 1) * pool.length / count));
                    const cell = pool[lo + Math.floor(rand() * (hi - lo))];
                    if (!cell || cell.shard) continue;

                    // 品质阶梯靠体积读：一档比一档大一圈。颜色只负责「认得出、看得见」，
                    // 「更高级」这层意思由它在墙里占多大地方来说。
                    const size = SHARD_GRADES[tier.id].scale;
                    const crystal = new THREE.Group();
                    crystal.position.set(cell.x, cell.y, cell.z);
                    crystal.rotation.y = rand() * Math.PI;
                    const core = new THREE.Mesh(shared.shard, shared.oreShardMats[tier.id]);
                    core.scale.set(size, size * 1.5, size);
                    core.renderOrder = HIDE_GUARDS ? 4 : 1;
                    crystal.add(core);
                    const halo = new THREE.Mesh(shared.shard, shared.shardHaloMats[tier.id]);
                    halo.scale.set(size * 1.9, size * 2.6, size * 1.9);
                    halo.renderOrder = HIDE_GUARDS ? 5 : 1;
                    crystal.add(halo);
                    group.add(crystal);

                    // 记在体素上，凿掉这一格时就地掉出来；同时挂进段的清单，整段被清时一起收尾。
                    cell.shard = { mesh: crystal, grade: tier.id, taken: false };
                    node.shards.push(cell.shard);
                    oreShards.push(cell.shard);
                }
            }

            function unlockLowShards() {
                for (const node of oreNodes.filter(n => n.shardsPending !== undefined)) {
                    embedShards(node, node.cells, node.group, seededRandom(9200 + node.shardsPending), node.shardsPending);
                    delete node.shardsPending;
                }
            }

            function updateOreShards(dt) {
                for (const shard of oreShards) {
                    if (shard.taken) continue;
                    shard.mesh.rotation.y += dt * 1.5;
                }
            }

            // 凿到埋着宝石的那一格：原地掉出来，之后走金币那条抛-停-飞的自动回收，玩家不用去捡。
            // 抛得比金币散、比金币慢一拍，一颗宝石要能从同时崩出来的一堆金币里被认出来。
            function takeShard(shard) {
                if (shard.taken) return;
                shard.taken = true;
                const at = shard.mesh.getWorldPosition(new THREE.Vector3());
                shard.mesh.visible = false;
                dropCoins(at, 1, { kind: "shard", grade: shard.grade, burst: 1.35, spread: 1.5, dwell: 0.12 });
            }

            // 整段被清空（挖光或被横扫炸掉）时，段里还没被凿到的宝石一并结算。
            // 不结算的话它们会随矿体一起消失——玩家看着一段带宝石的墙塌了、手上什么都没多，
            // 而这一档宝石的供给正好是「够不够买下一把锄头」的唯一来源，凭空少几颗就是死局。
            function harvestSegmentShards(node) {
                if (!node.shards) return;
                for (const shard of node.shards) takeShard(shard);
            }

            // 扇形有两个真实的端头，切向索引不能再取模环绕：绕过去会把左端的矿柱
            // 当成右端的邻居，玩家在扇形一侧挖矿会掏空另一侧的墙。
            function columnAt(ring, ai, ri) {
                if (ai < 0 || ai >= ring.arcCells) return undefined;
                return ring.columns[ai * ring.radialCells + ri];
            }

            // 极坐标格网让「玩家附近有哪些矿柱」变成常数级查询：定位所在切向列，再扫左右几列。
            function scanNearbyColumns(point, reach, visit) {
                for (const ring of oreRings) {
                    if (ring.remaining <= 0) continue;
                    const distance = Math.hypot(point.x, point.z);
                    const margin = reach + ring.maxCellSpan;
                    if (distance < ring.innerRadius - margin || distance > ring.outerRadius + margin) continue;
                    const center = Math.floor((Math.atan2(point.z, point.x) - ring.angleStart) / ring.cellAngle);
                    const spread = Math.ceil(margin / (ring.innerRadius * ring.cellAngle)) + 1;
                    for (let da = -spread; da <= spread; da++) {
                        for (let ri = 0; ri < ring.radialCells; ri++) {
                            const column = columnAt(ring, center + da, ri);
                            if (column && column.count > 0) visit(column, ring);
                        }
                    }
                }
            }

            function ringRemaining(tierId) {
                return oreRings.filter(item => item.tierId === tierId).reduce((sum, ring) => sum + ring.remaining, 0);
            }

            // 挖掘点永远贴在玩家面前那格矿上，所以站着不动挖就会顺着朝向往外掏出一条隧道。
            function getOreImpactPoint(node) {
                const cell = findNearestLiveCell(node, player.position);
                if (cell) return new THREE.Vector3(cell.wx, cell.wy, cell.wz);
                return node.position.clone().setY(node.tier.ringHeight * 0.45);
            }

            function findNearestLiveCell(node, point) {
                let best = null;
                let bestDistance = Infinity;
                for (const cell of node.cells) {
                    if (cell.removed) continue;
                    const dx = cell.wx - point.x;
                    const dz = cell.wz - point.z;
                    const distance = dx * dx + dz * dz + cell.wy * cell.wy * 0.35;
                    if (distance < bestDistance) {
                        bestDistance = distance;
                        best = cell;
                    }
                }
                return best;
            }

            // 整段缩放会把弧形矿墙甩出去，弹开反馈改成沿径向（局部 +Z）轻推一下。
            function updateOreRecoil(dt) {
                for (const node of oreNodes) {
                    if (node.rejectShake) {
                        node.rejectShake = Math.max(0, node.rejectShake - dt);
                        node.instanced.position.z = Math.sin(node.rejectShake * 58) * node.rejectShake * 0.5;
                    }
                    if (!node.monster || node.monsterRevealed) continue;
                    if (!C_BLOCKS) revealOreMonster(node);
                    if (node.monsterRevealed) continue;
                    const near = !opening.active && segmentDistance(node, player.position) < CONFIG.guardXrayRange;
                    if (node.monster.userData.xray === near) continue;
                    node.monster.userData.xray = near;
                    setGuardXray(node.monster, near && !opening.active);
                }
            }

            // 守卫堵路：出土后只要还活着，它那一段就凿不动。守卫本来就冻在矿墙正中、凿穿的
            // 瞬间正好堵在隧道口——它在画面上早就是个路障了，只是以前可以绕开。
            //
            // 判据必须是「已出土 且 存活」而不是「存在」：冻着的时候得能挖，否则根本没法凿穿
            // 去唤醒它。也不会死锁，守卫不回血，玩家伤害必然打得死，横扫也能清。
            function guardBlocking(node) {
                return ECON.guardBlocksSegment && node.monsterRevealed &&
                    Boolean(node.monster) && node.monster.userData.alive;
            }

            function canMine(node) {
                if (C_BLOCKS && blockNodeLevel(node) > cityLevel) return false;
                return pickaxeLevel >= node.tier.requiredPickaxe && !guardBlocking(node);
            }

            // 凿不动时给一次弹开反馈，不掉任何体素。
            function rejectMine(node) {
                const impact = getOreImpactPoint(node);
                buildPopEffect(impact, 7, 0xffe27a);
                cameraShake = Math.max(cameraShake, 0.16);
                playSound("clang");
                node.rejectShake = 0.32;
                if (blockedMineHint > 0) return;
                // 封印墙的提示有两条额外的闸。clang 和弹开都不受影响——玩家确实在砸墙。
                if (node.tier.sealed) {
                    // 献祭收款期间这句话是错的：墙马上就开了。
                    if (zones.some(zone => zone.id === "seal" && !zone.complete)) return;
                    // 说过一次就够。「里面封着的东西还在动」是一次性信息，而玩家现在会在
                    // 这堵墙底下待上二十来秒——锄头 Lv4 和进化台都摆在这条走廊上
                    // （见 TILE_SLOTS），付款期间自动索敌一直咬着封印墙，
                    // 按 3.2 秒一次能刷出七八条重复的。
                    if (sealedHintShown) return;
                    sealedHintShown = true;
                }
                blockedMineHint = 3.2;
                // 三种凿不动的处置完全不同——回城升级、就地打一架、根本挖不开——话必须分开说，
                // 否则玩家会跑回城里对着一把买不起或压根不存在的锄头发呆。
                const ore = node.tier.name;
                if (guardBlocking(node)) toast(t("先干掉守卫，才能继续凿这段{ore}", { ore }));
                else if (node.tier.sealed) toast(t("{ore}凿不开，里面封着的东西还在动", { ore }));
                else toast(t("锄头等级不足，凿不动{ore}，回主城升级锄头", { ore }));
            }

            function mineOre(node) {
                if (node.cleared) return;
                // 破封那一下，排在 canMine 之前。封印矿的 requiredPickaxe 是 5、锄头封顶 4，
                // 它永远过不了 canMine——「凿不开」这件事是数值上闭死的，不能为了破封去松动它，
                // 否则 minableRemaining、pendingSweepTiers、引导箭头会一起把封印矿当成可挖的矿。
                if (sealArmed && node.tier.sealed) {
                    breakSeal(node);
                    return;
                }
                if (!canMine(node)) {
                    rejectMine(node);
                    return;
                }
                const ring = node.ring;
                const minePower = PICKAXE_LEVELS[pickaxeLevel - 1].power;
                const impact = getOreImpactPoint(node);

                // 挖掘的单位是「一根体素柱」：从地面到洞顶整列一起消失，而不是离撞击点
                // 最近的 N 格。
                //
                // 按格挖的老写法凿出来的是个球形的坑（竖直方向还乘了 0.6 权重，摊得更开），
                // 于是同一根柱子经常只掉中间那一格，上下各剩一格挂在原处。两个后果，
                // 指向的是同一件事——玩家读不出自己到底凿开了什么：
                //   1. 剩下的半截柱子底下是空的，一格矿悬在半空。
                //   2. 冻在墙里的守卫是从这些参差的窟窿里露出来的，而被挡掉的恰好是腿脚，
                //      于是它出土之前看着是浮在墙里的一颗头——「悬空」就是这么来的，
                //      守卫本身一直是 setY(0) 站在地面上的。
                // 整列挖之后缺口是齐地齐顶的一道竖缝，守卫从缝里露出来时脚踩在地上。
                //
                // 格数预算没变（还是 power / hardness），只是改成按柱消耗、并且不留半截：
                // 跨过预算的那一根也要挖完。低级矿 Lv1 预算 3 格，正好一整根柱子（rows 3）；
                // Lv3 预算 8 格，挖到第三根跨过预算就停，合计 7~9 格。整局的挖掘节奏
                // 因此和改之前基本一致，锄头等级依旧决定一次能挖开几列。
                const budget = Math.max(1, Math.round(minePower / node.tier.hardness));

                // 同一根柱子的格子归到一处。柱间只按水平距离排序——整列是一起走的，
                // 掺进高度差只会让「先挖哪一列」莫名其妙地取决于撞击点落在哪一层。
                const columns = new Map();
                for (let i = 0; i < node.cells.length; i++) {
                    const cell = node.cells[i];
                    if (cell.removed) continue;
                    let entry = columns.get(cell.column);
                    if (!entry) {
                        const dx = cell.column.x - impact.x;
                        const dz = cell.column.z - impact.z;
                        entry = { distance: dx * dx + dz * dz, indices: [] };
                        columns.set(cell.column, entry);
                    }
                    entry.indices.push(i);
                }

                const removal = [];
                for (const entry of [...columns.values()].sort((a, b) => a.distance - b.distance)) {
                    if (removal.length >= budget) break;
                    for (const index of entry.indices) removal.push(index);
                }

                const touchedArcs = [];
                for (let i = 0; i < removal.length; i++) {
                    const cellIndex = removal[i];
                    const cell = node.cells[cellIndex];
                    cell.removed = true;
                    node.remaining -= 1;
                    ring.remaining -= 1;
                    cell.column.count -= 1;
                    if (cell.blocking) cell.column.blockCount -= 1;
                    if (!touchedArcs.includes(cell.column.ai)) touchedArcs.push(cell.column.ai);
                    node.instanced.setMatrixAt(cellIndex, node.zeroMatrix);
                    releaseOreCellLoot(cell);
                    if (i < 3 + pickaxeLevel * 2) launchOreChunk(node, cell);
                }
                node.instanced.instanceMatrix.needsUpdate = true;

                oreBreakFeedback(node, impact);
                const pickStyle = PICK_STYLES[pickaxeLevel-1];
                if (pickaxeLevel>=2) buildPopEffect(impact,3+pickaxeLevel*2,pickStyle.glow);
                if (pickaxeLevel>=3) pickFractureLines(impact,pickStyle.glow,pickaxeLevel);
                if (pickaxeLevel>=3 || firstUpgradeStrike.pick) spawnSplashRing(impact, pickaxeLevel===4 ? 2.5 : 1.6, pickStyle.glow);
                if (firstUpgradeStrike.pick) {
                    buildPopEffect(impact,18,pickStyle.color);
                    cameraShake=Math.max(cameraShake,.18);
                    firstUpgradeStrike.pick=false;
                }

                // 一整段矿墙玩家不可能挖光，收益必须按凿掉的格数结算，挖多少拿多少。
                const mined = node.total - node.remaining;
                const targetCoins = Math.floor(mined / node.tier.cellsPerCoin);
                if (targetCoins > node.coinsReleased) {
                    const amount = targetCoins - node.coinsReleased;
                    node.coinsReleased = targetCoins;
                    dropCoins(impact, amount, BALANCE.coinToss.mine);
                }

                // 剪影清晰度跟着隧道深度走：越往里凿，冻在墙心的守卫越显形。
                node.penetration = segmentPenetration(node, touchedArcs);
                if (node.monster && !node.monsterRevealed) {
                    setMonsterSilhouette(node.monster, THREE.MathUtils.clamp((node.penetration - 0.1) / 0.75, 0, 1));
                }
                if (node.penetration >= 1) breachOreSegment(node);

                if (node.remaining <= 0) clearOreNode(node);
            }

            // 从内壁往外数连续被凿空（不再挡人）的径向层，凑满整个厚度就是打通了一条通道。
            function segmentPenetration(node, arcs) {
                const ring = node.ring;
                let deepest = node.penetration;
                for (const ai of arcs) {
                    let depth = 0;
                    for (let ri = 0; ri < ring.radialCells; ri++) {
                        const column = columnAt(ring, ai, ri);
                        if (column && column.blockCount > 0) break;
                        depth += 1;
                    }
                    deepest = Math.max(deepest, depth / ring.radialCells);
                }
                return deepest;
            }

            function breachOreSegment(node) {
                if (node.breached) return;
                node.breached = true;
                breachedByTier[node.tierId] += 1;

                buildDust(node.position.clone().setY(1.2), 16, 2.2, node.tier.chunkColor);
                buildPopEffect(node.position.clone().setY(1.4), 20, node.tier.glow);
                cameraShake = Math.max(cameraShake, 0.45);
                playSound("break");

                revealOreMonster(node);
                onTierProgress(node.tierId);
                checkFinaleTrigger();
            }

            // 锄头与野怪技能共用破矿反馈和原地资源掉落。
            function oreBreakFeedback(node, impact) {
                buildDust(impact, 5, 0.7, node.tier.chunkColor);
                buildPopEffect(impact, 5, node.tier.glow);
                cameraShake = Math.max(cameraShake, 0.1);
                playSound("crack");
            }

            function releaseOreCellLoot(cell, releaseCoins = true, monsterDamage = false) {
                for (const coin of cell.coins || []) {
                    if (releaseCoins && coin.visible) {
                        dropCoins(coin.getWorldPosition(new THREE.Vector3()), 1, BALANCE.coinToss.mine);
                        if (monsterDamage) enemyMining.coins++;
                    }
                    coin.visible = false;
                }
                if (cell.shard) {
                    if (monsterDamage && !cell.shard.taken) enemyMining.shards++;
                    takeShard(cell.shard);
                }
            }

            function launchOreChunk(node, cell) {
                const mesh = new THREE.Mesh(shared.box, shared.chunkMaterials[node.tierId]);
                mesh.scale.set(cell.width, node.ring.cellHeight, node.ring.cellDepth).multiplyScalar(0.72);
                mesh.position.set(cell.wx, cell.wy, cell.wz);
                mesh.castShadow = true;
                scene.add(mesh);
                // 弧形矿墙上「远离段中心」多半是沿着墙飞，改成朝玩家崩，打击感才落在正确方向。
                const away = player.position.clone().sub(mesh.position).setY(0);
                if (away.lengthSq() < 0.01) away.set(0, 0, 1);
                away.normalize();
                effects.push({
                    type: "chunk",
                    mesh,
                    velocity: away.multiplyScalar(2.6 + random() * 3.4)
                        .add(new THREE.Vector3((random() - 0.5) * 2, 4.2 + random() * 2.6, (random() - 0.5) * 2)),
                    spin: new THREE.Vector3(
                        (random() - 0.5) * 6,
                        (random() - 0.5) * 5,
                        (random() - 0.5) * 6
                    ),
                    life: 1 + random() * 0.4,
                    groundY: node.ring.cellHeight * 0.36
                });
            }

            function clearOreNode(node) {
                const ring = node.ring;
                node.cleared = true;
                node.instanced.visible = false;
                node.group.userData.alive = false;
                node.surfaceCoins.forEach(coin => { coin.visible = false; });
                harvestSegmentShards(node);

                // 整段被啃光时铺一段弧形焦痕。RingGeometry 在 XY 平面，躺平后角度会反向。
                const pit = new THREE.Mesh(
                    new THREE.RingGeometry(
                        ring.innerRadius,
                        ring.outerRadius,
                        Math.max(8, ring.perSegment),
                        1,
                        -node.angleEnd,
                        node.angleEnd - node.angleStart
                    ),
                    new THREE.MeshBasicMaterial({
                        color: node.tier.emissive,
                        transparent: true,
                        opacity: 0.55,
                        side: THREE.DoubleSide,
                        depthWrite: false
                    })
                );
                pit.rotation.x = -Math.PI / 2;
                pit.position.y = 0.05;
                if (C_BLOCKS) { pit.geometry.dispose(); pit.material.dispose(); }
                else scene.add(pit);

                buildDust(node.position.clone().setY(1.2), 16, 2.2, node.tier.chunkColor);
                buildPopEffect(node.position.clone().setY(1.4), 20, node.tier.glow);
                cameraShake = Math.max(cameraShake, 0.5);
                playSound("break");

                breachOreSegment(node);
            }

            function onTierProgress(tierId) {
                if (tierId === "low" && breachedByTier.low === 1) {
                    revealTierRing("mid");
                }
                if (tierId === "mid" && breachedByTier.mid === 1) {
                    revealTierRing("high");
                }
                // 凿穿高级矿的那一刻，隧道尽头露出来的是封印矿。这条提示要赶在终局演出
                // 之前落地——checkFinaleTrigger 延后 0.45 秒起，正好够这句话先说完。
                if (tierId === "high" && breachedByTier.high === 1) {
                    revealTierRing(SEALED_TIER);
                    showEvolveWhenReachable();
                }
            }

            function revealTierRing(tierId) {
                if (shared[`revealed_${tierId}`]) return;
                shared[`revealed_${tierId}`] = true;
                if (tierId === "low") {
                    toast("金币在矿床里，靠近自动开采");
                    return;
                }
                const tier = ORE_TIERS[tierId];
                // 封印矿不能沿用「收益更高」这句：它一枚金币都不给，也凿不开。
                // 这条提示要立的是疑问，不是下一个目标——玩家接下来会去砸它，砸不动才有戏。
                if (tier.sealed) {
                    toast(t("走廊尽头是{ore}，凿不开，里面封着东西", { ore: tier.name }));
                    return;
                }
                toast(t("发现{ore}，收益更高但野怪更强", { ore: tier.name }));
            }

            function signedAngleDelta(angle, reference) {
                let delta = angle - reference;
                while (delta > Math.PI) delta -= Math.PI * 2;
                while (delta < -Math.PI) delta += Math.PI * 2;
                return delta;
            }

            // 可行走区域 = 主城那圈自由圆 ∪ 朝屏幕上方的扇形。这个约束是「必须凿穿才能过」
            // 的前提：矿墙从整圈收成扇形之后，不堵住两侧的话玩家一绕就直接走到高级矿外面去了。
            //
            // 可行走的半角比岩壁中心线（±half）收窄一米七，也就是比岩壁的碰撞圈（1.35 + 人 0.5）
            // 略松一点。两套约束因此不会在边界上互相顶：有岩壁的半径上石头先挡住人，
            // 没岩壁的那一段（自由圆到 18.2）由这里兜住。
            function clampToSector(point) {
                if (C_BLOCKS) { point.x = THREE.MathUtils.clamp(point.x, -5.9, 5.9); point.z = Math.min(-3.1, point.z); return point; }
                const radius = Math.hypot(point.x, point.z);
                if (radius <= SECTOR.freeRadius) return point;
                const angle = Math.atan2(point.z, point.x);
                const delta = signedAngleDelta(angle, SECTOR.center);
                const limit = Math.max(SECTOR.half * 0.35, SECTOR.half - 1.7 / radius);
                if (Math.abs(delta) <= limit) return point;

                // 两个候选落点：贴着岩壁滑（保半径、夹角度）和退回主城那圈圆（保角度、夹半径）。
                // 取离原位置近的那个——从扇形里横着走出来时会贴墙滑，
                // 从城里朝没开口的方向走出圆时被圆挡住，而不是被瞬间甩到扇形另一头。
                const slideAngle = SECTOR.center + Math.sign(delta) * limit;
                const slideX = Math.cos(slideAngle) * radius;
                const slideZ = Math.sin(slideAngle) * radius;
                const backX = Math.cos(angle) * SECTOR.freeRadius;
                const backZ = Math.sin(angle) * SECTOR.freeRadius;
                const slideGap = (slideX - point.x) ** 2 + (slideZ - point.z) ** 2;
                const backGap = (backX - point.x) ** 2 + (backZ - point.z) ** 2;
                if (slideGap <= backGap) {
                    point.x = slideX;
                    point.z = slideZ;
                } else {
                    point.x = backX;
                    point.z = backZ;
                }
                return point;
            }

            // 一段矿墙是条弧，测距要先看角度落在弧内还是弧外，再算径向差。
            function segmentDistance(node, point) {
                const ring = node.ring;
                const half = (node.angleEnd - node.angleStart) / 2;
                const delta = Math.abs(signedAngleDelta(Math.atan2(point.z, point.x), node.angleCenter));
                const alongGap = Math.max(0, delta - half) * ring.centerRadius;
                const radial = Math.hypot(point.x, point.z);
                const radialGap = Math.max(0, Math.max(ring.innerRadius - radial, radial - ring.outerRadius));
                return Math.hypot(alongGap, radialGap);
            }

            // 不点名矿层时排除封印矿。调用方要的都是「玩家能走到、能动手的那段矿」——
            // 龙蛋落点走的就是这里，掉到一道凿不开的墙上会被挤去墙外侧的死角，玩家永远捡不着。
            function getNearestOre(preferredTier = null) {
                let best = null;
                let bestDistance = Infinity;
                for (const node of oreNodes) {
                    if (node.cleared) continue;
                    if (preferredTier ? node.tierId !== preferredTier : node.tier.sealed) continue;
                    const distance = segmentDistance(node, player.position);
                    if (distance < bestDistance) {
                        bestDistance = distance;
                        best = node;
                    }
                }
                return best;
            }

            // 矿都在扇形走廊里，而主城是一整圈自由活动区，人很容易站在城墙背后。
            // 这时直接指矿，箭头就是一条穿墙而过的直线，照着走只会撞在城墙上。
            // 先把他领到走廊口，进了走廊再指矿。
            function guideThroughGate(target) {
                if (C_BLOCKS) return target;
                // 目标本来就在自由圆里就不用绕。走廊口是为「目标在矿区、玩家在城里」
                // 那一种情形准备的；对城内目标它会把玩家一路拽向 15.5 米外的谷口，
                // 离目标越来越远，而走开之后偏角更大、绕行更不肯松手——实测锄头 Lv2
                // 那张城内贴付到 2/4 就再也回不去，整局卡死在城里。
                //
                // 锄头贴有两个槽位（城里 / 封印走廊，见 tileSlot），是它把这条判断
                // 变成必需的：同一个调用点两种情形都要走对。
                if (Math.hypot(target.x, target.z) <= SECTOR.freeRadius) return target;
                const radius = Math.hypot(player.position.x, player.position.z);
                if (radius > SECTOR.freeRadius + 1) return target;
                const delta = signedAngleDelta(Math.atan2(player.position.z, player.position.x), SECTOR.center);
                if (Math.abs(delta) <= SECTOR.half * 0.75) return target;
                const gate = SECTOR.center + THREE.MathUtils.clamp(delta, -SECTOR.half * 0.5, SECTOR.half * 0.5);
                // 走廊口收在自由圆里侧：再往外就落进低级矿墙（内边 16.3）里，那是个走不到的点。
                const gateRadius = SECTOR.freeRadius - 0.8;
                return new THREE.Vector3(Math.cos(gate) * gateRadius, 0, Math.sin(gate) * gateRadius);
            }

            // 箭头指向这段墙上离玩家最近的那块还没被凿掉的矿，而不是墙面或段中心。
            // 矿墙比挖掘距离厚，玩家必须一路钻进隧道才能凿穿最后一层；指着墙面会让他停在洞口挖空气。
            function oreGuidePoint(node) {
                const cell = findNearestLiveCell(node, player.position);
                if (cell) return new THREE.Vector3(cell.wx, 0, cell.wz);
                return node.position.clone().setY(0);
            }

            // 矿层跟着锄头等级走：每级锄头对应一层矿，保证三层内容都被走到。
            // 绝不指向锄头等级凿不动的矿层，否则玩家会被引到一块砸不开的石头前面。
            function minableRemaining(tierId) {
                return pickaxeLevel >= ORE_TIERS[tierId].requiredPickaxe && ringRemaining(tierId) > 0;
            }

            // 三道矿墙由外往里查：锄头凿得动的最外层就是玩家该去的地方，收益也最高。
            function getGuideOreTarget() {
                for (let i = TIER_ORDER.length - 1; i >= 0; i--) {
                    if (minableRemaining(TIER_ORDER[i])) return getNearestOre(TIER_ORDER[i]);
                }
                return null;
            }

            // 还埋着指定品质宝石、且现在的锄头凿得动的最近一段矿。
            // 「还埋着」按段里未取走的宝石数算，不按矿层剩余格数——一段矿可能还剩大半墙，
            // 但宝石早被凿出来了，指过去只是让玩家白挖。
            function nearestShardNode(grade) {
                let best = null;
                let bestDistance = Infinity;
                for (const node of oreNodes) {
                    if (node.cleared || node.tierId !== grade || !canMine(node)) continue;
                    if (!node.shards.some(shard => !shard.taken)) continue;
                    const distance = flatDistance(node.position, player.position);
                    if (distance < bestDistance) {
                        bestDistance = distance;
                        best = node;
                    }
                }
                return best;
            }

            function createOreMonster(tierId, position, node) {
                const tier = ORE_TIERS[tierId];
                const config = tier.monster;
                const group = new THREE.Group();
                group.position.copy(position).setY(0);
                group.scale.setScalar(config.scale);
                // 守卫一律面朝主城，也就是玩家凿进来的方向。
                // 不转的话守卫全朝世界 +Z，玩家隔着矿墙看到的是一排后脑勺，那对眼睛根本不朝外。
                group.rotation.y = Math.atan2(-position.x, -position.z);
                scene.add(group);

                const bodyMat = new THREE.MeshStandardMaterial({ color: config.color, roughness: 0.82 });
                const rockMat = new THREE.MeshStandardMaterial({ color: tier.emissive, roughness: 0.9 });
                const meshes = [];

                const torso = new THREE.Mesh(shared.box, bodyMat);
                torso.scale.set(1.9, 2.1, 1.5);
                torso.position.y = 1.9;
                torso.castShadow = true;
                group.add(torso);
                meshes.push(torso);

                const head = new THREE.Mesh(shared.box, rockMat);
                head.scale.set(1.15, 0.95, 1.05);
                head.position.y = 3.35;
                head.castShadow = true;
                group.add(head);
                meshes.push(head);

                const arms = [];
                for (const side of [-1, 1]) {
                    const arm = new THREE.Mesh(shared.box, bodyMat);
                    arm.scale.set(0.62, 1.85, 0.66);
                    arm.position.set(side * 1.42, 1.95, 0);
                    arm.castShadow = true;
                    group.add(arm);
                    meshes.push(arm);
                    arms.push(arm);
                }
                for (const side of [-1, 1]) {
                    const leg = new THREE.Mesh(shared.box, rockMat);
                    leg.scale.set(0.68, 1.05, 0.72);
                    leg.position.set(side * 0.6, 0.52, 0);
                    leg.castShadow = true;
                    group.add(leg);
                    meshes.push(leg);
                }
                for (let i = 0; i < 3; i++) {
                    const shard = new THREE.Mesh(shared.box, rockMat);
                    const scale = 0.34 + i * 0.14;
                    shard.scale.set(scale, scale * 1.7, scale);
                    shard.position.set((i - 1) * 0.66, 3, -0.72);
                    shard.rotation.z = (i - 1) * 0.35;
                    group.add(shard);
                    meshes.push(shard);
                }

                // 怪物埋在矿体中心，前面隔着四五层半透明矿石，身体轮廓怎么调都会被叠没。
                // 眼睛改成关闭深度测试的 X 光画法，永远压在矿石之上，一眼就能看出石头里冻着东西。
                const eyeMat = new THREE.MeshBasicMaterial({ color: tier.glow, depthTest: false });
                const eyes = [];
                for (const side of [-1, 1]) {
                    const eye = new THREE.Mesh(shared.sphere, eyeMat);
                    eye.scale.setScalar(EYE_BASE_SCALE);
                    eye.position.set(side * EYE_BASE_OFFSET, 3.4, 0.56);
                    eye.renderOrder = 3;
                    eye.userData.side = side;
                    group.add(eye);
                    eyes.push(eye);
                }

                // 脚下的接地环。守卫本来就是站在地上的（腿的底面在 y≈0，见上面 leg 的
                // scale/position），但剪影只有三成多的不透明度，压在一整面青矿上时，
                // 两条又短又细的腿会被矿石的格纹吃掉，剩下躯干那一大块从离地半米处起画——
                // 读出来就是「怪浮在石头里」。所以问题不在高度，在接地点没有画出来。
                // 用和眼睛同一套画法（关深度测试压在矿墙之上），把落脚点明确标出来；
                // 顺带也告诉玩家凿穿之后它会从哪儿站起来。
                // 出土后交给真实模型和影子，这一圈收掉（见 revealOreMonster）。
                const rootMark = new THREE.Mesh(
                    new THREE.RingGeometry(1.05, 1.45, 28),
                    new THREE.MeshBasicMaterial({
                        color: 0xffe9b0,
                        transparent: true,
                        opacity: 0,
                        depthTest: false,
                        depthWrite: false
                    })
                );
                rootMark.rotation.x = -Math.PI / 2;
                rootMark.position.y = 0.08;
                rootMark.renderOrder = 3;
                group.add(rootMark);

                const silhouetteMaterial = shared.silhouetteMat.clone();
                group.userData = {
                    type: "monster",
                    tierId,
                    config,
                    tier,
                    node,
                    hp: config.hp,
                    maxHp: config.hp,
                    alive: false,
                    attackable: false,
                    meshes,
                    arms,
                    eyes,
                    realMaterials: meshes.map(mesh => mesh.material),
                    silhouetteMaterial,
                    eyeMaterial: eyeMat,
                    // 不进 meshes：那个数组会被整体换成剪影材质、出土时再换回来，
                    // 接地环两头都不参与。
                    rootMark,
                    attackState: "chasing",
                    attackTimer: 0,
                    stagger: 0,
                    knockback: null,
                    leashState: "active",
                    emerging: 0
                };
                group.visible = false;
                return group;
            }

            // 两道矿墙之间那条空走廊的内外边界和中线。从 ORE_TIERS 现算而不是写死：
            // 矿层的半径和厚度被终局构图反复调过（高级矿就为了给封印矿让位内移过一次），
            // 写死的话下次一调，游荡怪就会站进墙里。
            function laneGeometry(lane) {
                const inner = ORE_TIERS[lane.inner];
                const outer = ORE_TIERS[lane.outer];
                const innerEdge = inner.ringRadius + inner.ringThickness / 2;
                const outerEdge = outer.ringRadius - outer.ringThickness / 2;
                return { innerEdge, outerEdge, mid: (innerEdge + outerEdge) / 2 };
            }

            // 四足的小家伙，和守卫那种人形石巨人在剪影上就分得开。
            // 这件事很要紧：守卫意味着「打了有钻石、这段矿归它管」，游荡怪什么都不意味着，
            // 两者要是长一个样，玩家会以为自己漏打了某段矿的守卫。
            function createRover(lane, patrol) {
                const tier = ORE_TIERS[lane.inner];
                const geo = laneGeometry(lane);
                const angle = SECTOR.center + (C_BLOCKS ? THREE.MathUtils.clamp(patrol.gap, -3.5, 3.5) : patrol.gap) / geo.mid;
                const group = new THREE.Group();
                group.position.set(Math.cos(angle) * geo.mid, 0, Math.sin(angle) * geo.mid);
                group.scale.setScalar(lane.scale);
                scene.add(group);

                // 身体色不跟着所在矿层走，三条走廊统一一个「杂兵灰」。试错试出来的两条边界：
                // 用 tier.chunkColor 会和凿穿后满地的同色碎石糊在一起；用深色（0x39323f 那一版）
                // 又忘了这些怪是站在地面上、而地面是 0x151221 的近黑紫——暗身体贴暗地面，
                // 俯视角度下整只怪只剩背上三根发光的刺能看见。
                // 骨灰白是唯一同时避开这两头的：地面极暗所以它是清楚的亮剪影，
                // 低饱和所以又不会被认成守卫（守卫穿的是饱和的绿 / 紫 / 橙红）。
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0x9a93a8, roughness: 0.86 });
                const limbMat = new THREE.MeshStandardMaterial({ color: 0x6f6878, roughness: 0.92 });
                const spikeMat = new THREE.MeshStandardMaterial({
                    color: tier.chunkColor,
                    emissive: tier.glow,
                    emissiveIntensity: 0.75,
                    roughness: 0.5
                });
                const meshes = [];

                // 躯干横着长，四条腿撑在下面——低矮的兽形，和守卫的直立轮廓正好相反。
                // 宽度压到 1.2：相机是固定俯视的，从上往下看这只怪就是躯干的俯视投影，
                // 1.5 宽配 2.5 长读出来是个方箱子，收窄之后长宽比才够明显。
                const torso = new THREE.Mesh(shared.box, bodyMat);
                torso.scale.set(1.2, 1.1, 2.5);
                torso.position.y = 1.5;
                torso.castShadow = true;
                group.add(torso);
                meshes.push(torso);

                const head = new THREE.Mesh(shared.box, bodyMat);
                head.scale.set(1.05, 0.9, 1.1);
                head.position.set(0, 1.68, 1.72);
                head.castShadow = true;
                group.add(head);
                meshes.push(head);

                // 尾巴。三节递减、向后上翘——固定俯视下这是最省事的「哪头是头」的线索，
                // 没有它躯干加四条腿从上面看只是个带亮点的长方块，认不出是活物。
                for (let i = 0; i < 3; i++) {
                    const seg = new THREE.Mesh(shared.box, limbMat);
                    const s = 0.62 - i * 0.16;
                    seg.scale.set(s, s, 0.72);
                    seg.position.set(0, 1.52 + i * 0.2, -1.55 - i * 0.62);
                    seg.rotation.x = -0.26;
                    seg.castShadow = true;
                    group.add(seg);
                    meshes.push(seg);
                }

                const legs = [];
                for (const sx of [-1, 1]) {
                    for (const sz of [-1, 1]) {
                        const leg = new THREE.Mesh(shared.box, limbMat);
                        leg.scale.set(0.42, 1.9, 0.44);
                        leg.position.set(sx * 0.62, 0.95, sz * 0.85);
                        leg.castShadow = true;
                        group.add(leg);
                        meshes.push(leg);
                        // 对角腿同相，才走得出四足的步子；四条腿同相会读成蹦跳。
                        legs.push({ mesh: leg, phase: sx * sz > 0 ? 0 : Math.PI, restY: 0.95 });
                    }
                }

                // 背上的晶簇跟着内侧那层矿走，读起来像是从那道墙里爬出来的东西。
                // 它同时是这只怪唯一的亮部：暗身体在远处会缩成一个小黑点，靠这三根发光的刺
                // 才能在两道矿墙之间被认出来「那儿有个活的」。
                for (let i = 0; i < 3; i++) {
                    const spike = new THREE.Mesh(shared.box, spikeMat);
                    const s = 0.3 + (1 - Math.abs(i - 1)) * 0.16;
                    spike.scale.set(s, s * 2.1, s);
                    spike.position.set(0, 2.25, (i - 1) * 0.78);
                    spike.rotation.x = (i - 1) * 0.22;
                    group.add(spike);
                    meshes.push(spike);
                }

                // 眼睛照常发光，但不关深度测试——守卫那套 X 光是为了「隔着矿墙看得见」，
                // 游荡怪本来就站在空地上，再穿透就会连主城的房子一起穿过去。
                const eyeMat = new THREE.MeshBasicMaterial({ color: tier.glow });
                for (const side of [-1, 1]) {
                    const eye = new THREE.Mesh(shared.sphere, eyeMat);
                    eye.scale.setScalar(0.22);
                    eye.position.set(side * 0.3, 1.85, 2.05);
                    group.add(eye);
                }

                group.userData = {
                    type: "rover",
                    tierId: lane.inner,
                    tier,
                    lane,
                    // 把 lane 挂成原型，而不是把字段拷过来。守卫那边 config 就是 tier.monster 本身，
                    // 所以调参面板拖「伤害」「掉金币」是当场生效的；拷值的话这两根滑块会变成
                    // 必须重载才见效，和面板上写的说明不符。血量另算——它在下面被读成 maxHp
                    // 烘进对象，改了确实要重载（字段表里标了 reload）。
                    config: Object.assign(Object.create(lane), {
                        attackRange: 2.6,
                        windup: 0.5,
                        warningRadius: 1.9,
                        recovery: 0.65,
                        kind: "swipe"
                        // 不写 chaseRadius / reengageRadius。守卫那套 updateEnemyLeash 是绕着出生点
                        // 拴绳的，没有 homePosition 就直接 return false，而 homePosition 只有守卫出土时
                        // 才挂——游荡怪的脱战判定在 updateRover 里自己算（读 ROVER_RANGE）。
                        // 曾经在这儿拷了一份 ROVER_RANGE，是个永远不会被读到、又会在拖滑块后变陈旧的值。
                    }),
                    hp: lane.hp,
                    maxHp: lane.hp,
                    alive: true,
                    attackable: true,
                    meshes,
                    arms: [],
                    legs,
                    eyes: [],
                    attackState: "chasing",
                    attackTimer: 0,
                    stagger: 0,
                    knockback: null,
                    emerging: 0,
                    engaged: false,
                    // 错开步态相位，六只怪不至于像仪仗队一样同步迈腿。
                    walkPhase: random() * Math.PI * 2,
                    patrol: {
                        radius: geo.mid,
                        center: angle,
                        span: (C_BLOCKS ? Math.min(patrol.spanArc, 1) : patrol.spanArc) / geo.mid,
                        angle,
                        dir: random() < 0.5 ? -1 : 1
                    }
                };
                createHealthBar(group);
                enemies.push(group);
                return group;
            }

            function spawnFinalWave() {
                if (finalWave.spawned) return;
                finalWave.spawned = true;
                markRun("final-wave");
                const lane = { ...ROVER_LANES[2], hp: 120, damage: 1, drop: 0, scale: 0.55, speed: 2.2 };
                const geo = laneGeometry(lane);
                finalWave.left = 0;
                finalWave.right = 0;
                for (let i = 0; i < 60; i++) {
                    const side = i < 30 ? -1 : 1;
                    const column = i % 10;
                    const gap = side * (C_BLOCKS ? 0.6 + column * 0.28 : 3 + column * 0.75);
                    const enemy = createRover(lane, { gap, spanArc: 0.5 });
                    enemy.userData.wave = true;
                    enemy.userData.engaged = true;
                    enemy.position.addScaledVector(enemy.position.clone().normalize(), (Math.floor((i % 30) / 10) - 1) * 0.85);
                    constrainEnemy(enemy);
                    finalWave.count += 1;
                    finalWave[enemy.position.x < 0 ? "left" : "right"]++;
                }
            }

            function spawnRovers() {
                for (const lane of ROVER_LANES) {
                    for (const patrol of ROVER_PATROLS) createRover(lane, patrol);
                }
            }

            // 玩家和这只游荡怪之间通没通——取决于它那条走廊的内侧矿墙凿穿了没有。
            //
            // 两个调用方，问的是同一件事的两面：
            //
            // 一是仇恨。感知半径 aggro 是 11 米，而玩家贴着低级矿内壁（半径 16.3）时，
            // 离走廊中线上的怪只有 6.5 米——于是矿墙还是实心的，走廊里的怪就已经越过
            // 整堵墙扑过来了。实测确认过：一格没挖，两只 lane-low 的怪 engaged 全是 true，
            // 半径掉到 20.3 / 20.5，双双挤进了 16.3~20.7 那段实心墙体里。
            // 玩家在城里被隔着墙打，而且打他的东西看着是嵌在墙里的。
            //
            // 二是兜底救济，它要回答「还有没有赚钱的路子」。高级矿还没破的时候，最外那条
            // 走廊里的两只怪隔着一整堵实心墙，它们活着不构成任何收入。少了这一条会死锁，
            // 实测过：金币版玩家在锄头地贴上差 3 金币，低中两层的怪都打完了，兜底却因为
            // 「场上还有两只怪」不肯补——而那两只站在他进不去的走廊里，引导又把他按在
            // 地贴上等一笔永远不会来的钱。跑满 500 秒都没结束。
            //
            // 判据用「这一层有没有被凿穿过一段」而不是「缺口离这只怪多远」：段数本来就少
            // （低级矿两段），凿穿一段就意味着走廊和内侧连通了，怪从哪个缺口绕进来是
            // 它自己走位的事——而它确实走不了直线，实心墙由 constrainEnemy 挡着。
            function roverReachable(enemy) {
                if (C_BLOCKS && enemy.position.z < blockFront()) return false;
                const lane = enemy.userData.lane;
                return !lane || breachedByTier[lane.inner] > 0;
            }

            // 巡逻：沿走廊中线的圆弧来回踱步，走到区间端点掉头。
            // 角速度要除以半径，否则外圈那条走廊上的怪会明显比内圈跑得快——
            // 三条走廊半径差了将近一倍。
            function updateRoverPatrol(enemy, dt) {
                const data = enemy.userData;
                const p = data.patrol;
                p.angle += p.dir * (data.config.speed * ROVER_PATROL_PACE / p.radius) * dt;
                if (p.angle > p.center + p.span) { p.angle = p.center + p.span; p.dir = -1; }
                if (p.angle < p.center - p.span) { p.angle = p.center - p.span; p.dir = 1; }
                enemy.position.set(Math.cos(p.angle) * p.radius, 0, Math.sin(p.angle) * p.radius);
                constrainEnemy(enemy);
                const heading = Math.atan2(-Math.sin(p.angle) * p.dir, Math.cos(p.angle) * p.dir);
                enemy.rotation.y = lerpAngle(enemy.rotation.y, heading, 1 - Math.exp(-6 * dt));
            }

            // 巡逻速度是配置速度的这个比例——踱步，明显慢于追击。
            const ROVER_PATROL_PACE = 0.45;
            // 巡逻时的迈腿频率，其余速度按平方根从这里推。
            const PATROL_GAIT = 7;

            // 迈腿。纯装饰，但没有它这些怪就是贴着地面平移的方块，
            // 「在走动」这件事全靠位置变化去猜。
            function animateRoverGait(enemy, dt, speed) {
                const data = enemy.userData;
                const moving = speed > 0;
                // 迈腿频率跟着实际速度走。巡逻是 1.0 ~ 1.26 m/s 的踱步，追击乘了
                // ROVER_RANGE.chase 之后能到六七米每秒——两档共用一个写死的频率，
                // 追人时整只怪就会贴着地面平移过来、腿在原地小摆，读作滑行而不是奔跑。
                //
                // 参照速度取它自己的巡逻速度，所以三条走廊各自的快慢会互相抵掉，
                // 巡逻时的观感和写死 PATROL_GAIT 的那一版完全一致。
                // 用平方根而不是正比：真实四足提速靠频率和步幅一起长，按速度正比的话
                // 追击时频率要翻五倍以上，腿糊成一片，看不出是在跑。
                const pace = moving
                    ? PATROL_GAIT * Math.sqrt(speed / (data.config.speed * ROVER_PATROL_PACE))
                    : 1.6;
                data.walkPhase += dt * pace;
                for (const leg of data.legs) {
                    const swing = Math.sin(data.walkPhase + leg.phase);
                    leg.mesh.position.y = leg.restY + (moving ? Math.max(0, swing) * 0.3 : 0);
                    leg.mesh.rotation.x = moving ? swing * 0.5 : swing * 0.06;
                }
            }

            // 追击的空间上限：跑出自己那条走廊太远就放弃。
            //
            // 只靠「离玩家多远」这一个条件是不够的。追击速度一旦调到有威胁的档位，
            // 玩家和怪的速度差就只剩两三米每秒，于是甩掉它需要跑二三十米——
            // 而矿区径向总共才四十米出头，实测里怪一路跟到了主城正中（半径 1.5）。
            // 主城是安全区，也是玩家踩地贴做交互的地方，不能让走廊里的怪跟进去。
            //
            // 换成空间条件之后，两件事同时成立：走廊里可以追得很凶，而每条走廊的
            // 危险范围又是明确的、玩家能学会的——退回自己凿开的隧道就安全。
            // 读作「追到地盘边上就不追了」，比「跑够远它会忘记你」更容易看懂。
            // 内外两侧不对称，因为两侧根本不是一回事。
            //
            // 外侧就是下一堵墙，没有玩家会去的地方，tether 那点余量够了。
            //
            // 内侧原先也是 tether（3 米），于是内侧边界落在 17.7——**还在低级矿的墙体里**
            // （16.3~20.7）。后果是它永远走不完自己那堵墙：从缺口钻进去，走到隧道中段
            // 就判定越界、转身回去踱步。那一版的说法是「退回自己凿开的隧道就安全」，
            // 而现在要的恰恰相反：矿脉打通之后它就该从缺口进来打人。
            //
            // 所以内侧按「穿过自己那堵墙、再进去几米」给，从矿层几何现算：它要能在墙内侧
            // 那片空地上把架打完。低级矿算出来是 12.3，而主城的硬地板（constrainEnemy 里的
            // cityKeepOutRadius）满级是 15.4——两条一起读出来的规则很干净：
            // 它会从缺口追进内侧空地，但你退进主城它就放弃。
            function roverStrayed(enemy) {
                const lane = enemy.userData.lane;
                if (!lane) return false;
                const geo = laneGeometry(lane);
                const inner = ORE_TIERS[lane.inner];
                const innerFloor = inner.ringRadius - inner.ringThickness / 2 - ROVER_RANGE.throughReach;
                const radius = Math.hypot(enemy.position.x, enemy.position.z);
                return radius < innerFloor || radius > geo.outerEdge + ROVER_RANGE.tether;
            }

            // 这一层矿环上离 fromAngle 最近的那个缺口的角度，没有缺口返回 null。
            // 「缺口」的判据和 __wik.sealed() 一致：某个弧格的整条径向都不挡人，
            // 也就是玩家从这儿凿穿过去了。
            function nearestGapAngle(ring, fromAngle) {
                let best = null;
                let bestDelta = Infinity;
                for (let ai = 0; ai < ring.arcCells; ai++) {
                    let open = true;
                    for (let ri = 0; ri < ring.radialCells; ri++) {
                        const column = columnAt(ring, ai, ri);
                        if (column && column.blockCount > 0) { open = false; break; }
                    }
                    if (!open) continue;
                    const angle = ring.angleStart + (ai + 0.5) * ring.cellAngle;
                    const delta = Math.abs(signedAngleDelta(angle, fromAngle));
                    if (delta < bestDelta) {
                        bestDelta = delta;
                        best = angle;
                    }
                }
                return best;
            }

            // 两点之间的直线有没有被实心矿墙切到。沿线取点，各自问一次
            // resolveOreWallPosition 会不会把它顶开——顶得开就说明那一段在墙体里。
            // 采样而不是解析求交：矿墙是一格格的体素柱，解析式要对每根柱子做 OBB 求交，
            // 而这个判断每帧只跑几次，采样便宜得多。
            //
            // 步长按 oreProbeStep 走，不是取固定几个点。原先是固定六点：游荡怪的仇恨
            // 半径 11 米、绳长 18 米，六点等于每 2 到 3 米采一次，而最薄的矿层一柱只有
            // 0.75 米深——一整道墙可以整个躺在两个采样点中间不被发现。
            function pathCrossesOre(from, to, radius) {
                const dx = to.x - from.x;
                const dz = to.z - from.z;
                const distance = Math.hypot(dx, dz);
                if (distance < 0.0001) return false;
                const steps = Math.max(1, Math.ceil(distance / oreProbeStep()));
                for (let i = 1; i < steps; i++) {
                    const t = i / steps;
                    const x = from.x + dx * t;
                    const z = from.z + dz * t;
                    const fixed = resolveOreWallPosition(new THREE.Vector3(x, 0, z), radius);
                    if (Math.hypot(fixed.x - x, fixed.z - z) > 0.01) return true;
                }
                return false;
            }

            // 追人时该先去哪个缺口，直线能走就返回 null。
            //
            // 光有碰撞（constrainEnemy）是不够的。碰撞只保证它不穿墙，不保证它找得到路：
            // 实测里玩家凿穿低级矿之后退回内侧空地，走廊里那只怪一直贴着矿墙外沿站着，
            // 半径卡在 21.2 二十秒没动过——缺口在弧格 5，它压根没往那边去。
            // 不穿墙了，可也读不出「它在想办法进来」，只剩一只对着墙走路的怪。
            //
            // 不需要真正的寻路。矿环是极坐标格网，缺口的角度是已知的，所以「先横着跑到
            // 缺口正对面、再径向穿进去」这两步就够了，而且它跑出来的正是玩家能看懂的
            // 那条路线：沿墙跑到洞口，钻进来。对齐之后直线自然就通了，detour 随即清掉。
            function roverDetour(enemy) {
                const lane = enemy.userData.lane;
                if (!lane) return null;
                if (!pathCrossesOre(enemy.position, player.position, ROVER_BODY_RADIUS)) return null;
                const ring = oreRings.find(item => item.tierId === lane.inner);
                if (!ring) return null;
                const here = Math.atan2(enemy.position.z, enemy.position.x);
                const gap = nearestGapAngle(ring, here);
                if (gap === null) return null;

                const radius = Math.hypot(enemy.position.x, enemy.position.z);
                // 已经钻进墙体里了就一路往里，不再回头对准：通道两侧是径向的墙，
                // 会自己夹着它走。不加这一条，径向上一点点漂移就会让它判定「没对准」、
                // 退回走廊重新排队，来回抽搐。
                const committed = radius < ring.outerRadius;
                // 对没对准按弧长算，不按角度：缺口只有一格宽（外缘处半宽 0.70 米），
                // 它自己 0.5 米宽，所以真能塞进去的窗口只有离格心 ±0.20 米。
                const slack = Math.max(0.05, ring.outerRadius * ring.cellAngle / 2 - ROVER_BODY_RADIUS);
                const offset = Math.abs(signedAngleDelta(gap, here)) * radius;

                if (committed || offset <= slack) {
                    // 对准了：径向穿过去，目标取墙的另一侧。
                    const through = ring.innerRadius - ROVER_RANGE.throughReach;
                    return new THREE.Vector3(Math.cos(gap) * through, 0, Math.sin(gap) * through);
                }

                // 还没对准：先沿**走廊中线**跑到缺口正对面，而不是贴着墙横着滑过去。
                //
                // 「瞄墙另一侧、让碰撞把径向分量吃掉、自己贴墙滑到洞口」这个写法很漂亮，
                // 但它不成立：resolveOreWallPosition 在墙面上有一串卡死角。那个函数里
                // 「penAlong * 1.4 < penOut 就沿切向顶出去」的分支是给径向隧道里的玩家
                // 写的（免得横着卡在墙缝里），而一个沿墙面横向滑动的东西走到格子边界上时，
                // 恰好会被这一支把刚挪的那点切向位移原样顶回来，净位移零。
                // 实测这些点在低级矿外缘是 -96.2°、-99.95°、-107.45°，而且和步长无关
                // （0.264 / 0.088 / 0.03 米三档都停在同一个角度上，差不到 0.05°）——
                // 不是采样精度问题，是几何上的陷阱。那一版的怪就死在 -96.2° 上四十三秒。
                //
                // 走廊中线是空的，跑在那儿压根不碰矿墙，也就没有这一串陷阱可踩。
                // 观感也更对：它先退回走廊、沿着走廊跑到缺口正对面，然后一头扎进来。
                const geo = laneGeometry(lane);
                return new THREE.Vector3(Math.cos(gap) * geo.mid, 0, Math.sin(gap) * geo.mid);
            }

            function updateRover(enemy, dt) {
                const data = enemy.userData;
                // 末波持续主动追击；碰撞与缺口绕行仍由原战斗逻辑处理。
                if (data.wave && roverReachable(enemy)) data.engaged = true;
                const distance = flatDistance(enemy.position, player.position);
                // 一旦被激怒就交给守卫那套追击/挥击逻辑，直到玩家跑远。追远了不原地站着，
                // 而是回到自己那段弧上接着走——它本来就是「在这条走廊上活动的东西」。
                if (data.engaged) {
                    if (!data.wave && (distance > ROVER_RANGE.leash || roverStrayed(enemy))) {
                        data.engaged = false;
                        data.attackState = "chasing";
                        data.attackTimer = 0;
                        data.detour = null;
                        cancelHazardsFrom(enemy);
                        // 回到离当前位置最近的那个巡逻角，省掉一段横穿走廊的直线折返。
                        const back = Math.atan2(enemy.position.z, enemy.position.x);
                        data.patrol.angle = THREE.MathUtils.clamp(
                            back, data.patrol.center - data.patrol.span, data.patrol.center + data.patrol.span
                        );
                    } else {
                        // 只在「正在跑向玩家」这一档算绕行点。起手、后摇、冲锋都不该被
                        // 改向——那几段的位移是招式自己的演出，插一个绕行目标进去，
                        // 红圈和实际冲出去的方向就对不上了。
                        data.detour = data.attackState === "chasing" ? roverDetour(enemy) : null;
                        updateMonsterCombat(enemy, dt);
                        const running = data.attackState === "chasing" && distance > data.config.attackRange;
                        animateRoverGait(enemy, dt, running ? chaseSpeedOf(enemy, data.config) : 0);
                        return;
                    }
                } else if (distance <= ROVER_RANGE.aggro && roverReachable(enemy)) {
                    data.engaged = true;
                }
                updateRoverPatrol(enemy, dt);
                animateRoverGait(enemy, dt, data.config.speed * ROVER_PATROL_PACE);
            }

            // 矿体半透明后野怪一开始就该看得见，amount 只控制清晰度，不再控制显隐。
            function setMonsterSilhouette(monster, amount) {
                const data = monster.userData;
                // B 在真正挖穿、revealOreMonster 之前不泄露守卫及其眼睛/接地环。
                monster.visible = !HIDE_GUARDS;
                data.silhouetteMaterial.opacity = 0.34 + amount * 0.4;
                for (const mesh of data.meshes) mesh.material = data.silhouetteMaterial;
                // 冻结时不能用矿层自己的辉光色：青矿配薄荷绿眼睛等于隐身。
                // 暖白在青、紫、橙三种矿色上都压得住，落在深色头部剪影里更跳。
                data.eyeMaterial.color.setHex(0xffe9b0);
                // 发光的眼睛是「石头里有东西」最快被读懂的信号，隔着矿墙要放大才看得见。
                // 但放大必须同步拉开间距：眼球半径一旦超过间距，两颗就会糊成一个光斑。
                const scale = 0.46 + amount * 0.14;
                for (const eye of data.eyes) {
                    eye.scale.setScalar(scale);
                    eye.position.x = eye.userData.side * scale * EYE_SPREAD_RATIO;
                }
                // 接地环比眼睛淡一档：它是辅助读数，抢过那对眼睛就变成地面预警了。
                data.rootMark.material.opacity = 0.34 + amount * 0.3;
            }

            // 近处的守卫压在矿墙之上透出来，远处恢复深度测试。
            // 不按距离收住的话，外圈守卫会直接画在内圈矿墙和主城前面。
            function setGuardXray(monster, on) {
                on = on && !HIDE_GUARDS;
                const data = monster.userData;
                data.silhouetteMaterial.depthTest = !on;
                data.eyeMaterial.depthTest = !on;
                data.rootMark.material.depthTest = !on;
                for (const mesh of data.meshes) mesh.renderOrder = on ? 4 : 1;
                for (const eye of data.eyes) eye.renderOrder = on ? 5 : 1;
                data.rootMark.renderOrder = on ? 5 : 1;
            }

            function guardExitColumn(node) {
                if (!node.monster || !node.columns.length) return null;
                if (C_BLOCKS) {
                    return node.columns.filter(c => c.ri === 0 &&
                        Array.from({length:node.ring.radialCells},(_,ri)=>columnAt(node.ring,c.ai,ri)).every(c=>c && c.blockCount===0))
                        .sort((a,b)=>Math.hypot(a.x-player.position.x,a.z-player.position.z)-Math.hypot(b.x-player.position.x,b.z-player.position.z))[0] || null;
                }
                const ai = Math.min(node.arcEnd - 1, Math.max(node.arcStart,
                    Math.floor((node.angleCenter - node.ring.angleStart) / node.ring.cellAngle)));
                for (let ri = 0; ri < node.ring.radialCells; ri++) {
                    const column = columnAt(node.ring, ai, ri);
                    if (!column || column.blockCount > 0) return null;
                }
                return columnAt(node.ring, ai, 0);
            }

            function revealOreMonster(node, force = false) {
                if (node.monsterRevealed || !node.monster) return;
                const exposedExit = guardExitColumn(node);
                if (!force && !exposedExit) return;
                node.monsterRevealed = true;
                const monster = node.monster;
                const data = monster.userData;
                monster.visible = true;
                data.meshes.forEach((mesh, index) => { mesh.material = data.realMaterials[index]; });
                // 出土后恢复正常深度测试，否则战斗时会穿过建筑和地形显示。
                // 眼睛也要收回原始大小和间距，透视用的放大只在冻在墙里时成立。
                data.xray = false;
                data.silhouetteMaterial.depthTest = true;
                data.eyeMaterial.depthTest = true;
                data.eyeMaterial.color.setHex(data.tier.glow);
                data.meshes.forEach(mesh => { mesh.renderOrder = 0; });
                data.eyes.forEach(eye => {
                    eye.renderOrder = 0;
                    eye.scale.setScalar(EYE_BASE_SCALE);
                    eye.position.x = eye.userData.side * EYE_BASE_OFFSET;
                });
                data.rootMark.visible = false;
                data.alive = true;
                data.attackable = true;
                // 从实际凿穿的通道内口出土；段中心可能仍是实心墙，不能把它当出生点。
                if (exposedExit) {
                    const exit = exposedExit;
                    const radius = node.ring.innerRadius - ROVER_BODY_RADIUS - 0.1;
                    monster.position.set(exit.cosA * radius, 0, exit.sinA * radius);
                }
                data.homePosition = monster.position.clone().setY(0);
                data.birthColumn = node.columns.reduce((best, c) => !best ||
                    Math.hypot(c.x - monster.position.x, c.z - monster.position.z) <
                    Math.hypot(best.x - monster.position.x, best.z - monster.position.z) ? c : best, null);
                data.emerging = 0.36;
                data.emergeDepth = 1.4;
                monster.position.y = -data.emergeDepth;
                createHealthBar(monster);
                enemies.push(monster);
                buildDust(monster.position.clone().setY(1.5), 14, 2, node.tier.chunkColor);
                cameraShake = Math.max(cameraShake, 0.45);
                playSound("warn");
                if (!shared[`monsterSeen_${node.tierId}`]) {
                    shared[`monsterSeen_${node.tierId}`] = true;
                    if (node.tierId === "low") toast("矿里冻着野怪，打倒它继续挖");
                    else toast(t("{ore}的野怪更强，小心红圈", { ore: node.tier.name }));
                }
            }

            // 血条分三层：外框、空槽、血量。
            //
            // 第一版只有两层（近黑的底板 + 红色血量），读不出剩多少——底板是 0x160f18，
            // 而地面是 0x151221，两个色差不到一档。掉了血的那一截等于直接消失在地面里，
            // 玩家看到的是一根孤立的红条，没有参照物就没有比例：半血和残血长得一样，
            // 只是短一点，而「短」相对于什么并不可见。
            //
            // 所以空槽要单独一层，用明显亮于地面的板岩色——它的职责是把「满血有多长」
            // 一直摆在那儿当标尺。外框那层近黑，是为了另一头：矿墙是半透明的亮紫和亮青，
            // 血条经常压在矿墙上（depthTest 关了），板岩色贴亮矿墙又会糊掉。
            // 一亮一暗两层夹着，深底和亮底就都兜住了。
            //
            // 三层之间不留 z 偏移，改用 renderOrder 排序——理由见 createHealthBar 里那段。
            const HEALTH_BAR = { width: 2.34, height: 0.3, frame: 0.09 };

            function createHealthBar(entity) {
                const group = new THREE.Group();
                // 三层的叠放顺序**只能**靠 renderOrder，而且必须逐个 mesh 设。踩过的三个坑：
                //
                //   1. renderOrder 挂在 Group 上不会传给子节点，子节点各自默认 0。
                //   2. 半透明材质走 transparent 队列，整个队列排在不透明队列之后。前一版
                //      底板 opacity 0.85（于是 transparent）、血量层不透明，于是血量先画、
                //      底板后画又盖在上面——血条永远是一整块暗色，剩多少血从来没显示过。
                //   3. depthTest 关了只是不做深度测试，不改变队列顺序。三层都设成不透明那一版，
                //      它们落进不透明队列，而矿体是半透明的（renderOrder 2），于是矿墙又画在
                //      血条之上，把颜色冲得发灰。
                //
                // 所以：三层一律进 transparent 队列（transparent + opacity 1，不真的透），
                // renderOrder 20/21/22 既保证彼此的层次，也保证整根条子压在矿体那 2 之上。
                // depthWrite 关掉——UI 不该往深度缓冲里写东西，否则会扰乱它后面那些半透明物件的排序。
                const flat = (w, h, color, order) => {
                    const mesh = new THREE.Mesh(
                        new THREE.PlaneGeometry(w, h),
                        new THREE.MeshBasicMaterial({
                            color,
                            depthTest: false,
                            depthWrite: false,
                            transparent: true
                        })
                    );
                    mesh.renderOrder = order;
                    return mesh;
                };

                group.add(flat(
                    HEALTH_BAR.width + HEALTH_BAR.frame * 2,
                    HEALTH_BAR.height + HEALTH_BAR.frame * 2,
                    0x0b0812,
                    20
                ));
                group.add(flat(HEALTH_BAR.width, HEALTH_BAR.height, 0x4a4166, 21));

                const fill = flat(HEALTH_BAR.width, HEALTH_BAR.height, 0xe0322f, 22);
                group.add(fill);

                group.position.y = 4.4;
                // 抵掉宿主的缩放。血条是给玩家读的 UI，不是怪的一部分——跟着体型缩放的话，
                // 低级走廊那只（scale 0.62）的血条只有高级守卫（1.18）的一半宽，
                // 而它恰恰是玩家最早遇到、最需要看懂血条的那一只。
                // position.y 仍然吃宿主缩放，所以条子照旧浮在各自头顶上方。
                const host = entity.scale.x || 1;
                group.scale.setScalar(1 / host);
                entity.add(group);
                entity.userData.healthBar = group;
                entity.userData.healthFill = fill;
                syncHealthBar(entity);
                return group;
            }

            // 血量条从左端往右缩。PlaneGeometry 的原点在正中，所以缩完还要往左挪回半个缺口，
            // 否则条子会从两头一起往中间收——那读起来不像掉血，像条子自己在变短。
            function syncHealthBar(entity) {
                const data = entity.userData;
                if (!data.healthFill) return;
                const ratio = Math.max(0, Math.min(1, data.hp / data.maxHp));
                data.healthFill.scale.x = ratio;
                data.healthFill.position.x = -(1 - ratio) * HEALTH_BAR.width / 2;
            }

            function updateEnemies(dt) {
                for (const enemy of enemies) {
                    const data = enemy.userData;
                    if (!data.alive) continue;

                    if (data.emerging > 0) {
                        data.emerging = Math.max(0, data.emerging - dt);
                        enemy.position.y = -data.emergeDepth * (data.emerging / 0.36);
                        if (data.emerging === 0) constrainEnemy(enemy);
                        continue;
                    }
                    enemy.position.y = 0;

                    if (data.stagger > 0) {
                        data.stagger = Math.max(0, data.stagger - dt);
                        if (data.knockback) {
                            enemy.position.addScaledVector(data.knockback, dt);
                            data.knockback.multiplyScalar(Math.exp(-10 * dt));
                            constrainEnemy(enemy);
                        }
                        continue;
                    }

                    if (data.type === "rover") {
                        updateRover(enemy, dt);
                        continue;
                    }
                    if (updateEnemyLeash(enemy, dt)) continue;
                    updateMonsterCombat(enemy, dt);
                }
            }

            // 主城当前的外沿。主城是逐级长大的（6.6 → 14.6），所以安全区也跟着长，
            // 不能写死成满级半径——开局那会儿城只有 6.6 米，按 14.6 划禁区会把低级守卫
            // 挡在它自己那圈矿的门口。
            function cityKeepOutRadius() {
                if (C_BLOCKS) return 0;
                if (cityLevel <= 0) return 0;
                const stage = CITY_STAGES[Math.min(cityLevel, CITY_STAGES.length) - 1];
                return stage.radius + GUARD_CHASE.keepOutMargin;
            }

            function constrainEnemy(enemy) {
                const limit = CONFIG.arenaRadius - 2;
                const distance = Math.hypot(enemy.position.x, enemy.position.z);
                if (distance > limit) {
                    const scale = limit / distance;
                    enemy.position.x *= scale;
                    enemy.position.z *= scale;
                }
                // 怪一律不得进主城。放大 chaseRadius 之后这道地板是必需的：低级守卫出生在
                // 半径 18.5，追击时能一路挤进城里站在地贴上——而「不能有建筑或怪挡住玩家
                // 进出主城、和地贴交互」是城市布局那条定死的约束。
                //
                // 这里是位置钳制而不是脱战：怪贴着城沿等着，玩家一出城战斗立刻接上，
                // 读作「追到地盘边上」。真正的放弃交给 updateEnemyLeash 的距离判断。
                const floor = cityKeepOutRadius();
                if (floor > 0) {
                    const radius = Math.hypot(enemy.position.x, enemy.position.z - CITY_OFFSET_Z);
                    if (radius > 0.001 && radius < floor) {
                        const scale = floor / radius;
                        enemy.position.x *= scale;
                        enemy.position.z = CITY_OFFSET_Z + (enemy.position.z - CITY_OFFSET_Z) * scale;
                    }
                }
                // 前沿广场与老城一样禁止敌人占住升级入口；中级矿前仍保留战斗空地。
                if (frontierCity.active && Math.abs(enemy.position.x) < 7.4 &&
                    enemy.position.z > -22 && enemy.position.z < -11.8) {
                    const p = enemy.position;
                    const exits = [
                        { gap: p.x + 7.4, x: -7.4, z: p.z },
                        { gap: 7.4 - p.x, x: 7.4, z: p.z },
                        { gap: p.z + 22, x: p.x, z: -22 },
                        { gap: -11.8 - p.z, x: p.x, z: -11.8 }
                    ];
                    const exit = exits.reduce((a, b) => a.gap < b.gap ? a : b);
                    p.x = exit.x; p.z = exit.z;
                }
                // 游荡怪不得穿墙。矿墙原先只挡玩家（见 resolveOreWallPosition 的调用方
                // resolveCirclePosition），怪一律是直接穿过去的——走廊里的怪追人时会径直
                // 插进实心矿墙，玩家看到的是一只嵌在墙里往自己走的东西。
                //
                // 这一条同时把「只能从缺口进来」这件事交给了几何而不是判定：玩家凿出来的
                // 通道里 blockCount 是 0，所以墙还实心时它挤不进来，凿穿之后那条通道
                // 正好就是它的入口。仇恨门（roverReachable）管的是「什么时候开始追」，
                // 这里管的是「追的时候只能走哪儿」，两条缺一不可——光有仇恨门的话，
                // 凿穿一段之后它照旧会从没挖的那一段墙里直接穿出来。
                //
                // 守卫与游荡怪一起受矿墙约束；守卫仅暂时豁免出生柱，走出后永久撤销。
                //
                // 半径取 0.5 而不是玩家的 0.62：它必须能跟着玩家钻进玩家自己挖的隧道，
                // 比玩家胖就进不来，追击到洞口就断，等于白改。0.5 也确实是它的体宽
                // （躯干 1.2 宽 × lane.scale 0.62~0.85，半宽 0.37~0.51）。
                const data = enemy.userData;
                const birth = data.birthColumn;
                if (birth && Math.hypot(enemy.position.x - birth.x, enemy.position.z - birth.z) >
                    Math.hypot(birth.halfArc, birth.halfDepth) + ROVER_BODY_RADIUS) data.birthColumn = null;
                resolveOreWallPosition(enemy.position, ROVER_BODY_RADIUS, data.birthColumn);
                // 守卫被击退时会飞出扇形，落到玩家根本走不过去的地方——那一只就再也打不到了。
                const boundaryX = enemy.position.x, boundaryZ = enemy.position.z;
                clampToSector(enemy.position);
                if (C_BLOCKS) {
                    // 只有边界真的移动了敌人时才重算，普通巡逻不重复扫描矿柱。
                    if (boundaryX !== enemy.position.x || boundaryZ !== enemy.position.z)
                        resolveOreWallPosition(enemy.position,ROVER_BODY_RADIUS,data.birthColumn);
                    const closed = blockFront();
                    if (enemy.position.z < closed && player.position.z > closed) enemy.userData.engaged = false;
                }
            }

            function updateEnemyLeash(enemy, dt) {
                const data = enemy.userData;
                const config = data.config;
                const home = data.homePosition;
                if (!home) return false;

                if (data.leashState === "returning") {
                    const direction = home.clone().sub(enemy.position).setY(0);
                    if (direction.length() < 0.25) {
                        enemy.position.set(home.x, 0, home.z);
                        constrainEnemy(enemy);
                        data.leashState = "leashed";
                        return true;
                    }
                    direction.normalize();
                    enemy.position.addScaledVector(direction, config.returnSpeed * dt);
                    constrainEnemy(enemy);
                    enemy.rotation.y = lerpAngle(enemy.rotation.y, Math.atan2(direction.x, direction.z), 0.2);
                    return true;
                }

                if (data.leashState === "leashed") {
                    if (flatDistance(player.position, home) <= config.reengageRadius) {
                        data.leashState = "active";
                        return false;
                    }
                    return true;
                }

                const playerOutside = flatDistance(player.position, home) > config.chaseRadius;
                const selfOutside = flatDistance(enemy.position, home) > config.chaseRadius;
                if (playerOutside || selfOutside) {
                    data.leashState = "returning";
                    data.attackState = "chasing";
                    data.attackTimer = 0;
                    cancelHazardsFrom(enemy);
                    resetMonsterPose(enemy);
                    return true;
                }
                return false;
            }

            function resetMonsterPose(enemy) {
                for (const arm of enemy.userData.arms) arm.rotation.x = 0;
                enemy.rotation.x = 0;
            }

            // 守卫的蓄力是举起双臂，靠 arms 里那两个方块转出来。四足的游荡怪没有手臂，
            // arms 是空数组，这个循环在它身上一圈都不跑——不补一手的话它挥击时整只怪
            // 一动不动，玩家只看到脚下亮起一个红圈，猜不出是谁要打他。
            // 改成整只身体前倾压低，读作低头猛扑。不能用 position.y 做下压，
            // updateEnemies 每帧会把 y 拍回 0。
            function setMonsterPose(enemy, amount) {
                for (const arm of enemy.userData.arms) arm.rotation.x = -amount * 1.35;
                if (enemy.userData.type === "rover") enemy.rotation.x = amount * 0.34;
            }

            // 起手时挑一招。招式表是「在基础 config 之上覆盖几个字段」，用原型链挂上去，
            // 没写的字段（速度、追击半径、掉落）自动继承——所以加一招不用把二十个字段抄一遍。
            //
            // 不重复上一招是硬要求：两次同样的预警连着出现，玩家会当成一次没躲好，
            // 而不是「这怪有两招」。招式池的意义全在「下一下不知道是哪个」。
            function pickMonsterSkill(enemy) {
                const base = enemy.userData.config;
                const skills = ARPG.enabled && base.skills;
                if (!skills || skills.length === 0) return null;
                const last = enemy.userData.lastSkill;
                let pool = skills.filter(s => s.kind !== last);
                if (pool.length === 0) pool = skills;
                let roll = random() * pool.reduce((sum, s) => sum + (s.weight || 1), 0);
                let chosen = pool[pool.length - 1];
                for (const skill of pool) {
                    roll -= skill.weight || 1;
                    if (roll <= 0) { chosen = skill; break; }
                }
                enemy.userData.lastSkill = chosen.kind;
                return Object.assign(Object.create(base), chosen);
            }

            // 这一招能从多远起手。不写 reach 的按 attackRange 算，也就是「得先贴上」——
            // 近战招本来就该这样，只有冲锋这类位移招才配拿一个更大的数。
            function skillReach(skill, config) {
                if (skill && skill.reach !== undefined) return skill.reach;
                return config.attackRange !== undefined ? config.attackRange : 3.2;
            }

            // 贴不上时挑一招够得着的。挑不到就返回 null，调用方接着追。
            //
            // 这里**不**沿用 pickMonsterSkill 的「不重复上一招」规则：够得着的招通常只有
            // 一个（冲锋），带上不重复的限制它就一次也放不出来，那个洞等于没补。
            // 连着冲两次在这个场景里也不算坏读数——玩家一直在往后跑，它就一直扑。
            function pickReachSkill(enemy, distance) {
                const base = enemy.userData.config;
                const skills = ARPG.enabled && base.skills;
                if (!skills || skills.length === 0) return null;
                const pool = skills.filter(skill => skillReach(skill, base) >= distance);
                if (pool.length === 0) return null;
                let roll = random() * pool.reduce((sum, s) => sum + (s.weight || 1), 0);
                let chosen = pool[pool.length - 1];
                for (const skill of pool) {
                    roll -= skill.weight || 1;
                    if (roll <= 0) { chosen = skill; break; }
                }
                enemy.userData.lastSkill = chosen.kind;
                return Object.assign(Object.create(base), chosen);
            }

            // 追击速度。原速追击在数字上根本不成立：
            //
            //   玩家 9.4 m/s，游荡怪 2.2 ~ 2.8、守卫 2.4 ~ 2.8（CONFIG.playerSpeed 对
            //   ROVER_LANES[].speed / ORE_TIERS[].monster.speed）。慢三四倍意味着一旦拉开
            //   就永远追不回来，脱战完全由玩家单方面决定。
            //   游荡怪还多一层：走廊宽 3.2 ~ 4.7 米，径向穿过去只要 0.45 秒，比它 0.5 秒的
            //   前摇还短——跑着过路的玩家连一次挥击都不会挨到。
            //
            // 所以「没有威胁」不是感知范围的问题，是它追不上。乘上倍率之后仍然明显慢于玩家
            // （见 ROVER_RANGE.chase / GUARD_CHASE.speed 那儿的账），想跑总是跑得掉，
            // 只是要付出距离和时间。
            //
            // 两种怪用两个倍率而不是一个：它们的拴绳锚点不同（走廊 / 出生点），
            // 所以「追多凶」的合理值也不同，得能分开拖。巨龙不乘——终局演出不结算移动。
            function chaseSpeedOf(enemy, config) {
                const type = enemy.userData.type;
                if (type === "rover") return config.speed * (config.chase || ROVER_RANGE.chase);
                if (type === "monster") return config.speed * GUARD_CHASE.speed;
                return config.speed;
            }

            function updateMonsterCombat(enemy, dt) {
                const data = enemy.userData;
                // 起手时挑定的那一招，字段覆盖在基础 config 之上。前摇、后摇、伤害、预警形状
                // 都可能被招式改写，所以整个状态机都读它；回到 chasing 时清掉，
                // 免得用上一招的攻击距离去决定下一次起手。
                const config = data.activeSkill || data.config;

                // 破绽。玩家闪避换来的窗口：不追、不起手、踉跄着挨打。
                // 姿态借 setMonsterPose 的负值——守卫读作双臂垂落，四足的游荡怪读作身体后仰。
                if (data.attackState === "stunned") {
                    data.attackTimer -= dt;
                    setMonsterPose(enemy, -0.45 * Math.min(1, Math.max(0, data.attackTimer) / ARPG.stunDuration));
                    if (data.attackTimer <= 0) {
                        data.attackState = "chasing";
                        data.activeSkill = null;
                        data.dash = null;
                        resetMonsterPose(enemy);
                    }
                    return;
                }
                if (data.attackState === "windup") {
                    data.attackTimer -= dt;
                    const progress = 1 - Math.max(0, data.attackTimer) / config.windup;
                    setMonsterPose(enemy, progress * progress);
                    if (data.attackTimer <= 0) {
                        data.attackState = "recovery";
                        data.attackTimer = config.recovery;
                    }
                    return;
                }
                if (data.attackState === "recovery") {
                    data.attackTimer -= dt;
                    setMonsterPose(enemy, Math.max(0, data.attackTimer / config.recovery));
                    // 冲锋的位移在后摇里跑完。判定已经在结算那一帧做过了，这一段纯粹是让
                    // 那条长条读得出意思——怪不真的冲出去的话，玩家只看到地上亮了一条，
                    // 猜不到刚才发生了什么。
                    if (data.dash && data.dash.left > 0) {
                        const step = Math.min(data.dash.left, data.dash.speed * dt);
                        enemy.position.addScaledVector(data.dash.dir, step);
                        constrainEnemy(enemy);
                        data.dash.left -= step;
                    }
                    if (data.attackTimer <= 0) {
                        data.attackState = "chasing";
                        data.activeSkill = null;
                        data.dash = null;
                    }
                    return;
                }

                setMonsterPose(enemy, 0);
                const distance = flatDistance(enemy.position, player.position);
                const range = config.attackRange !== undefined ? config.attackRange : 3.2;
                if (distance > range) {
                    // 贴不上的时候攒「急了」。攒够就改用够得着的那一招（冲锋），
                    // 这是风筝打法唯一的解药——原先所有招式共用一个 config.attackRange 当闸门，
                    // 于是冲锋只能在**已经贴脸**时放出来，而冲锋的全部意义是从远处扑过来。
                    //
                    // 实测过这个洞有多大：玩家一直吊在 4.6 米（守卫攻击距离 3.7 + 0.9），
                    // 打死一只高级守卫 35.1 秒、掉血 **0**；站桩硬吃 32.6 秒、掉血 85。
                    // 也就是说风筝只贵 2.5 秒，却完全免伤——那是当时的最优解，
                    // 而它让闪避、破绽、狂暴整套 ARPG 设计一起失效。
                    data.closeFail = (data.closeFail || 0) + dt;
                    const reachSkill = data.closeFail >= GUARD_CHASE.patience
                        ? pickReachSkill(enemy, distance)
                        : null;
                    if (!reachSkill) {
                        // 绕行点。只有走廊里的游荡怪会设它（见 roverDetour）：矿墙挡住直线时
                        // 先跑到缺口口子上，对齐之后这一项就自动清掉，接着直线追人。
                        // 攻击距离判定仍然按到玩家的真实距离算，绕路期间自然够不着。
                        const steering = data.detour || player.position;
                        const direction = steering.clone().sub(enemy.position).setY(0);
                        if (direction.lengthSq() > 0.01) {
                            direction.normalize();
                            enemy.position.addScaledVector(direction, chaseSpeedOf(enemy, config) * dt);
                            constrainEnemy(enemy);
                            enemy.rotation.y = lerpAngle(enemy.rotation.y, Math.atan2(direction.x, direction.z), 1 - Math.exp(-8 * dt));
                        }
                        return;
                    }
                    data.closeFail = 0;
                    data.activeSkill = reachSkill;
                } else {
                    data.closeFail = 0;
                    // 先挑招，再按招式决定转多准——方向性招式吃朝向精度，圆形的不吃。
                    data.activeSkill = pickMonsterSkill(enemy);
                }
                // 狂暴的倍率烘进这一招的字段，而不是等各处读的时候再乘。前摇一旦被改，
                // 预警的存活时长必须跟着变：两边各算一遍的话，红圈会在判定之前就消失，
                // 或者判定完了还赖在地上。
                //
                // Object.create 让赋值落在自有属性上、读取仍走原型链，所以这里不必先
                // 把十几个字段抄一遍，也不会污染 ORE_TIERS 里的原表。
                if (ARPG.enabled && data.frenzy) {
                    const boosted = data.activeSkill || Object.create(config);
                    boosted.windup *= ARPG.frenzyWindup;
                    boosted.damage = Math.round(boosted.damage * ARPG.frenzyDamage);
                    data.activeSkill = boosted;
                }
                const skill = data.activeSkill || config;
                const facing = player.position.clone().sub(enemy.position).setY(0);
                if (facing.lengthSq() > 0.01) {
                    const want = Math.atan2(facing.x, facing.z);
                    // 冲锋只有 2.4 米宽，按原来那个 0.4 的渐进转向会从玩家身侧擦过去，
                    // 而一个打不中的冲锋等于没有威胁，玩家也就没理由学着侧移。
                    // 扇形有 100° 容错，本来就够，跟着一起对准只是让它更实在。
                    // arpg=0 时保持原样：那一版只有扇形，转向精度是它原本的手感之一。
                    const directional = ARPG.enabled && (skill.kind === "fan" || skill.kind === "line");
                    enemy.rotation.y = directional ? want : lerpAngle(enemy.rotation.y, want, 0.4);
                }
                data.attackState = "windup";
                data.attackTimer = skill.windup;
                createMonsterHazard(enemy);
                playSound("warn");
            }

            function createMonsterHazard(enemy) {
                const data = enemy.userData;
                const config = data.activeSkill || data.config;
                const kind = config.kind;

                if (kind === "fan") {
                    const angle = THREE.MathUtils.degToRad(config.sectorAngle);
                    const geometry = new THREE.CircleGeometry(config.sectorRadius, 26, -angle / 2, angle);
                    const mesh = new THREE.Mesh(geometry, shared.warningMat.clone());
                    mesh.rotation.x = -Math.PI / 2;
                    mesh.position.copy(enemy.position).setY(0.08);
                    mesh.rotation.z = warningSpin(enemy.rotation.y);
                    scene.add(mesh);
                    hazards.push({

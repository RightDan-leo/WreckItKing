                    context.lineTo(53, 145);
                    context.closePath();
                    context.fill();
                } else if (currency === "gem") {
                    context.fillStyle = "#5fe6ff";
                    context.save();
                    context.translate(66, 148);
                    context.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const a = i * Math.PI / 3;
                        if (i === 0) context.moveTo(Math.cos(a) * 13, Math.sin(a) * 13);
                        else context.lineTo(Math.cos(a) * 13, Math.sin(a) * 13);
                    }
                    context.closePath();
                    context.fill();
                    context.restore();
                } else {
                    context.fillStyle = "#ffd23c";
                    context.beginPath();
                    context.arc(66, 148, 13, 0, Math.PI * 2);
                    context.fill();
                    context.fillStyle = "#8a5b00";
                    context.font = "bold 16px Arial";
                    context.textAlign = "center";
                    context.textBaseline = "middle";
                    context.fillText("$", 66, 149);
                }

                context.fillStyle = "#ffffff";
                context.font = "bold 30px Arial";
                context.textAlign = "left";
                context.fillText(zone.cost === 0 ? (LANG === "en" ? "FREE" : "免费") : `${zone.paid}/${zone.cost}`, 86, 149);

                zone.tileTexture.needsUpdate = true;
            }

            function roundRectPath(context, x, y, width, height, radius) {
                context.beginPath();
                context.moveTo(x + radius, y);
                context.lineTo(x + width - radius, y);
                context.quadraticCurveTo(x + width, y, x + width, y + radius);
                context.lineTo(x + width, y + height - radius);
                context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                context.lineTo(x + radius, y + height);
                context.quadraticCurveTo(x, y + height, x, y + height - radius);
                context.lineTo(x, y + radius);
                context.quadraticCurveTo(x, y, x + radius, y);
                context.closePath();
            }

            // variant：同一个图标要按等级分档时用，语义统一是「这次付款会买到的那一级」。
            // 目前只有弓在用。
            function drawTileIcon(context, icon, color, variant) {
                context.save();
                context.translate(96, 78);
                context.strokeStyle = color;
                context.fillStyle = color;
                context.lineWidth = 7;
                context.lineJoin = "round";
                context.lineCap = "round";

                if (icon === "city") {
                    context.beginPath();
                    context.moveTo(-34, 18);
                    context.lineTo(-34, -6);
                    context.lineTo(-14, -6);
                    context.lineTo(-14, -22);
                    context.lineTo(14, -22);
                    context.lineTo(14, -6);
                    context.lineTo(34, -6);
                    context.lineTo(34, 18);
                    context.closePath();
                    context.stroke();
                    context.fillRect(-6, 0, 12, 18);
                } else if (icon === "pickaxe") {
                    context.beginPath();
                    context.moveTo(-30, -18);
                    context.quadraticCurveTo(0, -34, 30, -18);
                    context.stroke();
                    context.beginPath();
                    context.moveTo(-14, -10);
                    context.lineTo(16, 22);
                    context.stroke();
                } else if (icon === "egg") {
                    context.beginPath();
                    context.ellipse(0, -2, 19, 25, 0, 0, Math.PI * 2);
                    context.stroke();
                    context.beginPath();
                    context.moveTo(-26, 22);
                    context.quadraticCurveTo(0, 34, 26, 22);
                    context.stroke();
                } else if (icon === "evolve") {
                    context.beginPath();
                    context.moveTo(0, -30);
                    context.lineTo(20, 4);
                    context.lineTo(8, 4);
                    context.lineTo(8, 26);
                    context.lineTo(-8, 26);
                    context.lineTo(-8, 4);
                    context.lineTo(-20, 4);
                    context.closePath();
                    context.stroke();
                } else if (icon === "bow") {
                    // 一把搭着箭的弓，箭头朝右。variant 是**这次付款会买到的那一级**，
                    // 不是当前等级——地贴回答的是「花这笔钱得到什么」。
                    //
                    // 弓臂朝左鼓、弦向右拉成 V、箭杆穿过弦：这三笔缺一不可。只画弓臂加弦
                    // 会读成括号或月牙，箭杆是让它变成「弓」的那一笔。
                    context.beginPath();
                    context.moveTo(-8, -30);
                    context.quadraticCurveTo(-38, 0, -8, 30);
                    context.stroke();

                    context.lineWidth = 4;
                    context.beginPath();
                    context.moveTo(-8, -30);
                    context.lineTo(2, 0);
                    context.lineTo(-8, 30);
                    context.stroke();

                    context.lineWidth = 7;
                    context.beginPath();
                    context.moveTo(-20, 0);
                    context.lineTo(24, 0);
                    context.stroke();

                    if (variant >= WEAPON_LEVELS.length) {
                        // 顶格那一级买的是「第三箭命中会炸开」。箭头填实、再加两道迸线，
                        // 和上一级的空心箭头在余光里就分得开——这张贴一共只出现两次，
                        // 两次之间隔着七十秒，光靠颜色变化玩家记不住上一次长什么样。
                        context.beginPath();
                        context.moveTo(28, 0);
                        context.lineTo(12, -11);
                        context.lineTo(12, 11);
                        context.closePath();
                        context.fill();
                        context.lineWidth = 4;
                        for (const dy of [-1, 1]) {
                            context.beginPath();
                            context.moveTo(30, dy * 9);
                            context.lineTo(38, dy * 17);
                            context.stroke();
                        }
                    } else {
                        context.beginPath();
                        context.moveTo(14, -10);
                        context.lineTo(26, 0);
                        context.lineTo(14, 10);
                        context.stroke();
                    }
                } else if (icon === "seal") {
                    // 一道竖着的裂缝。画成折线而不是闭合形状：地贴上其余四个图标都是
                    // 「一件东西」，这一个是「一道口子」，轮廓封起来就读成石头而不是裂开。
                    context.beginPath();
                    context.moveTo(-6, -30);
                    context.lineTo(7, -12);
                    context.lineTo(-5, 2);
                    context.lineTo(9, 16);
                    context.lineTo(-2, 30);
                    context.stroke();
                    context.lineWidth = 4;
                    context.beginPath();
                    context.moveTo(-24, -16);
                    context.lineTo(-11, -6);
                    context.stroke();
                    context.beginPath();
                    context.moveTo(24, 6);
                    context.lineTo(11, 14);
                    context.stroke();
                }
                context.restore();
            }

            // 地贴该摆哪个槽位。只有锄头有两个槽，最后一级用另一个；两个槽眼下指的是
            // 城里同一处，所以这张贴实际不动（理由见 TILE_SLOTS["pickaxe-last"]）。
            // 创建和重新布防两条路都走这里，免得换槽位的规则各写一份。
            function tileSlot(id) {
                if (C_BLOCKS) return blockTileSlot(id);
                if (frontierCity.active && FRONTIER_SLOTS[id]) return FRONTIER_SLOTS[id];
                if (VERSION === "a" && id === "evolve") return { x: 0, z: -10.9 };
                if (id === "pickaxe" && ECON.pickaxeCost &&
                    pickaxeLevel >= ECON.pickaxeCost.length) return TILE_SLOTS["pickaxe-last"];
                return TILE_SLOTS[id];
            }

            function moveZone(zone, slot, preserveEntry = false) {
                if (zone.position.x === slot.x && zone.position.z === slot.z) return;
                zone.group.position.set(slot.x, 0, slot.z);
                zone.position.copy(zone.group.position);
                // 挪完重新判一次：玩家不可能站在刚出现在三十米外的那张贴上，
                // 沿用上一处的 requiresReentry 会让他走到新位置后还得先走出去一趟。
                if (!preserveEntry) zone.requiresReentry = isPlayerInsideZonePosition(zone.group.position);
            }

            function createZone(id, cost, onComplete) {
                const slot = tileSlot(id);
                const { canvas, context, texture } = createTileTexture();
                const group = new THREE.Group();
                group.position.set(slot.x, 0, slot.z);
                scene.add(group);

                const base = new THREE.Mesh(
                    new THREE.PlaneGeometry(CONFIG.zoneTileSize * 1.06, CONFIG.zoneTileSize * 1.06),
                    new THREE.MeshBasicMaterial({
                        color: 0x0a0814,
                        transparent: true,
                        opacity: 0.55,
                        depthWrite: false
                    })
                );
                base.rotation.x = -Math.PI / 2;
                // 新区地面最高为 0.08；底板和图案都必须高于它，避免共面闪烁及遮挡。
                base.position.y = 0.12;
                group.add(base);

                const tile = new THREE.Mesh(
                    new THREE.PlaneGeometry(CONFIG.zoneTileSize, CONFIG.zoneTileSize),
                    new THREE.MeshBasicMaterial({
                        map: texture,
                        transparent: true,
                        depthWrite: false
                    })
                );
                tile.rotation.x = -Math.PI / 2;
                tile.position.y = 0.14;
                group.add(tile);
                // 首次打造展示实际获得的模型，随地贴迁移和隐藏。
                let bowDisplay = null;
                if (id === "forge") {
                    bowDisplay = createBowModel();
                    styleBowModel(bowDisplay,Math.min(3,weaponLevel+1));
                    bowDisplay.position.set(0, 1.55, -0.45);
                    bowDisplay.rotation.set(-0.35, Math.PI / 2, -0.35);
                    bowDisplay.scale.setScalar(1.8);
                    group.add(bowDisplay);
                }

                const zone = {
                    id,
                    cost,
                    paid: 0,
                    group,
                    base,
                    tile,
                    bowDisplay,
                    equipmentLevel: id === "forge" ? weaponLevel+1 : 0,
                    tileCanvas: canvas,
                    tileContext: context,
                    tileTexture: texture,
                    position: group.position.clone(),
                    paymentTimer: 0,
                    pulse: 0,
                    requiresReentry: isPlayerInsideZonePosition(group.position),
                    locked: false,
                    complete: false,
                    onComplete
                };
                drawTile(zone, false);
                zones.push(zone);
                return zone;
            }

            function showTile(id) {
                let zone = zones.find(item => item.id === id);
                if (zone) {
                    zone.group.visible = true;
                    return zone;
                }
                zone = createZone(id, resolveTileCost(id), () => completeTile(id));
                return zone;
            }

            function resolveTileCost(id) {
                if (id === "city-build") return CITY_STAGES[0].cost;
                if (id === "city-upgrade") {
                    const next = CITY_STAGES[cityLevel];
                    return next ? next.cost : 0;
                }
                if (id === "pickaxe") return ECON.pickaxeCost[pickaxeLevel - 1] || 0;
                if (id === "hatchery") return ECON.hatcheryCost;
                if (id === "evolve") return ECON.evolveCost;
                if (id === "forge") return weaponEnabled() ? (ECON.weaponCost[weaponLevel - 1] || 0) : 0;
                if (id === "seal") return ECON.sealOffering ? ECON.sealOffering.cost : 0;
                return 0;
            }

            // 货币不存在 zone 上：它由地贴种类唯一决定，存一份就多一份要同步的状态。
            function tileCurrency(id) {
                if (id === "pickaxe") return ECON.pickaxeCurrency;
                if (id === "hatchery") return ECON.hatcheryCurrency || "coin";
                if (id === "evolve") return ECON.evolveCurrency;
                if (id === "forge") return "gem";
                return "coin";
            }

            // 武器线这一局到底存不存在。两个条件都得满足：
            //   ECON.weaponCost  A 版没有钻石，这条线在那一版无从谈起
            //   ARPG.enabled     整套改造的回滚开关，关掉时武器线连地贴一起消失
            //
            // 收成一个函数是因为它被问到的地方分散在伤害公式、战力、地贴、引导、
            // 兜底五处，而这五处必须给出同一个答案：只要有一处漏判，就会出现
            // 「地贴还在但伤害不吃武器等级」这类对不上账的状态。
            function weaponEnabled() {
                return ARPG.enabled && Boolean(ECON.weaponCost);
            }

            function weaponTier(level) {
                return WEAPON_LEVELS[Math.min(WEAPON_LEVELS.length, Math.max(1, level)) - 1];
            }

            // 这一档守卫死了掉几颗钻石。基础值在 ECON.guardGems，武器线要的那部分是
            // 加在它上面的增量（ARPG.guardGemBonus，那儿记着整笔收支）——武器线一关，
            // 增量跟着消失，多发的钻石不会变成 HUD 上花不掉的余额。
            function guardGemDrop(tierId) {
                const base = (ECON.guardGems && ECON.guardGems[tierId]) || 0;
                if (!base || !weaponEnabled()) return base;
                return base + (ARPG.guardGemBonus[tierId] || 0);
            }

            // 玩家一次普通攻击的伤害（不含三连击第三下的倍率）。
            //
            // 武器线开着时查 WEAPON_LEVELS[].damage，关掉时（?arpg=0）退回锄头驱动的
            // 线性公式。两条路原先共用同一个线性式，武器线砍成三级之后它的数列不再等距
            // （235 / 425 / 805），公式表达不了，只能查表——而锄头那条仍是四级等距，
            // 硬凑成一套反而要给锄头也加一列查不到的 damage。
            function playerHitDamage() {
                const cfg = BALANCE.playerDamage;
                const bonus = petEvolved ? cfg.evolvedBonus : 0;
                if (weaponEnabled()) return weaponTier(weaponLevel).damage + bonus;
                return cfg.base + (pickaxeLevel - 1) * cfg.perPickaxe + bonus;
            }

            // 攻击距离。武器 Lv2 起加 reach——这是四级里唯一一个不靠数字、靠手感就能
            // 感觉到的附加：够得着的位置变多，贴脸的必要性下降，而贴脸正是挨打的主因。
            function playerAttackRange() {
                return CONFIG.attackRange + (weaponEnabled() ? weaponTier(weaponLevel).reach : 0);
            }

            // 当前这次锄头升级要收哪一档宝石：Lv1→Lv2 收 TIER_ORDER[0]（低级矿产的那档），
            // 也就是「手上这把锄头能挖的那层矿，产的正好是买下一把要用的宝石」。
            //
            // 满级后返回空。这个判断必须走 pickaxeCost 的长度而不是 PICKAXE_LEVELS：
            // 表里有四级，但能买到第几级是按版本定的，A 版只到三级。按表长判的话
            // TIER_ORDER[3] 会落到封印矿，而那一层没有对应品质，SHARD_GRADES 查出来是 undefined。
            function requiredShardGrade() {
                const levels = ECON.pickaxeCost ? ECON.pickaxeCost.length : 0;
                if (pickaxeLevel > levels) return null;
                const id = TIER_ORDER[pickaxeLevel - 1];
                return id && SHARD_GRADES[id] ? id : null;
            }

            // grade 只在 currency === "shard" 时有意义；省略时取当前锄头要收的那一档。
            function walletOf(currency, grade) {
                if (currency === "gem") return gems;
                if (currency !== "shard") return coins;
                const id = grade || requiredShardGrade();
                return id ? (shards[id] || 0) : 0;
            }

            function tileShardGrade(id) {
                return id === "pickaxe" ? requiredShardGrade() : null;
            }

            function removeZone(zone) {
                scene.remove(zone.group);
                const index = zones.indexOf(zone);
                if (index >= 0) zones.splice(index, 1);
            }

            function resetZone(zone, cost) {
                zone.remoteBudget = 0;
                zone.paid = 0;
                zone.cost = cost;
                zone.complete = false;
                zone.paymentTimer = 0;
                zone.requiresReentry = isPlayerInsideZonePosition(zone.position);
                zone.hintShown = false;
                zone.lastHint = null;
                drawTile(zone, false);
            }

            function completeTile(id) {
                markRun(id === "city-upgrade" ? `city-${cityLevel + 1}` : id);
                if (id === "city-build") {
                    completeCityBuild();
                } else if (id === "city-upgrade") {
                    completeCityUpgrade();
                } else if (id === "pickaxe") {
                    completePickaxe();
                } else if (id === "hatchery") {
                    completeHatchery();
                } else if (id === "evolve") {
                    completeEvolve();
                } else if (id === "forge") {
                    completeWeapon();
                } else if (id === "seal") {
                    completeSeal();
                }
            }

            function completeCityBuild() {
                cityLevel = 1;
                if (city.ghost) city.ghost.visible = false;
                buildCityStage(1);
                playSound("upgrade");
                const zone = zones.find(item => item.id === "city-build");
                if (zone) removeZone(zone);
                showTile("city-upgrade");
                updateUI();
                toast("主城建成，去矿区赚取金币");
                setTutorial(false);
                tutorialDone = true;
                revealTierRing("low");
            }

            function completeCityUpgrade() {
                const stage = CITY_STAGES[cityLevel];
                cityLevel += 1;
                if (cityLevel === 2) unlockLowShards();
                if (cityLevel === 3 && !pet) { showTile("hatchery"); ensureEggAvailability(); }
                buildCityStage(cityLevel);
                playSound("upgrade");
                // 这一级城解锁的设施，同时也是下一级城的门。武器线被 ?arpg=0 关掉时
                // 锻造台根本不存在，那道门要当场作废——否则扩建贴会永远等一件不会出现的设施。
                const unlock = stage && stage.unlock;
                const gated = unlock && (unlock !== "forge" || weaponEnabled());
                if (gated) {
                    if (unlock !== "hatchery" || !pet) showTile(unlock);
                    toast(C_BLOCKS ? (LANG === "en" ? `${C_DISTRICTS[cityLevel-1].en} BUILT` : `${C_DISTRICTS[cityLevel-1].name}建成`) : unlockCopy(unlock));
                    if (unlock === "hatchery") ensureEggAvailability();
                } else {
                    toast(t("主城升级到 Lv.{n}", { n: cityLevel }));
                }
                const zone = zones.find(item => item.id === "city-upgrade");
                if (zone) {
                    if (cityLevel >= CITY_STAGES.length) removeZone(zone);
                    else {
                        resetZone(zone, resolveTileCost("city-upgrade"));
                        // 免费孵化从城 Lv3 常驻，不占用扩城的付款门。
                        cityGate = gated && unlock !== "hatchery" ? unlock : null;
                        if (cityGate) zone.group.visible = false;
                    }
                }
                // 城级解锁当帧刷新工坊；不能等 watchdog 再出现，误把已经走进入口的玩家锁住。
                if (C_BLOCKS) syncForgeWindow();
                updateUI();
            }

            function unlockCopy(id) {
                if (id === "pickaxe") return "主城扩张，解锁升级锄头";
                if (id === "hatchery") return "主城扩张，解锁孵化台";
                if (id === "evolve") return "主城扩张，解锁宠物进化";
                // 把钻石的来源和去向写进同一句话。地贴上是青色菱形、HUD 上也是青色菱形，
                // 但玩家手上同时还有一个白色菱形的宝石计数——实测这两个图标会被读混，
                // 「打怪掉的」四个字比任何图标都管用。
                if (id === "forge") return "主城扩张，解锁武器建造台——打怪掉的钻石在这儿换武器";
                return "主城扩张";
            }

            // 锄头等级对应它能凿开的最高矿等级，颜色也直接沿用那一层矿：绿=低级矿、紫=中级矿、橙=高级矿。
            // 封印矿要排除掉：地贴图标问的是 pickaxeTier(pickaxeLevel + 1)，满级时那就是第四级，
            // 照着表往下找会摸到封印矿，等于用它的金色向玩家预告一把根本不存在的锄头。
            function pickaxeTier(level) {
                for (let i = TIER_ORDER.length - 1; i >= 0; i--) {
                    const tier = ORE_TIERS[TIER_ORDER[i]];
                    if (tier.sealed) continue;
                    if (level >= tier.requiredPickaxe) return tier;
                }
                return ORE_TIERS[TIER_ORDER[0]];
            }

            // 弓。和镐并存，按打的是矿还是怪来回切（见 setHeldItem）——两条升级线花的是两种
            // 货币、买的是两种东西，原先却都表现成「手上那把镐亮了一下」，玩家分不出自己刚买了什么。
            //
            // 朝向这块容易搞反，记一下：真弓的弓身平面要**包含**箭的飞行方向。玩家瞄的是自身
            // 局部 +z，弓臂立在竖直的 y 上，所以弓身平面是 y-z 平面、法线朝 x。而 TorusGeometry
            // 默认躺在 x-y 平面（法线朝 z），直接用会让箭从弓的侧面飞出去。
            // 所以套一层 bowFrame 转 -90°：它把 frame 内的 +x 映射到世界 +z。
            // frame 里一律按「+x 是前方」写，弓背鼓向 +x，弓弦落在 -x 那侧（靠着射手）。
            function createBowModel() {
                const model = new THREE.Group();
                const frame = new THREE.Group();
                frame.rotation.y = -Math.PI / 2;
                model.add(frame);

                const arc = Math.PI * 1.06;
                // 弓臂用暖木色而不是写实的深棕。俯视镜头下玩家本体只有八十来像素，弓横过来
                // 也就三四十像素宽——深棕 0x7a4a2a 压在深紫地面（0x151221）上是一条看不见的
                // 细线，实测截图里只读得出「手里有个东西」。参照物是镐头：它认得出靠的是
                // 那颗亮色矿头，不是靠形状。
                const limb = new THREE.Mesh(
                    new THREE.TorusGeometry(BOW_RADIUS, BOW_RADIUS * 0.086, 5, 20, arc),
                    new THREE.MeshStandardMaterial({ color: 0xd39a56, roughness: 0.55, metalness: 0.2 })
                );
                // TorusGeometry 从角度 0 开始铺，要让弓背正对 +x 得把整段往回转半个弧长。
                limb.rotation.z = -arc / 2;
                frame.add(limb);

                // 弓弦拉在两个弓臂尖之间。弦长按弦所在的角度算出来，别写死——
                // 弧长一改（调弓的胖瘦）写死的数就会露出弦头戳在弓臂外面。
                const tipAngle = arc / 2;
                const stringX = Math.cos(tipAngle) * BOW_RADIUS;
                const stringHalf = Math.sin(tipAngle) * BOW_RADIUS;
                const string = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.018, 0.018, stringHalf * 2, 4),
                    new THREE.MeshBasicMaterial({ color: 0xd9d2c4 })
                );
                string.position.x = stringX;
                frame.add(string);

                const shaft = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.026, 0.026, BOW_RADIUS * 1.28, 5),
                    new THREE.MeshStandardMaterial({ color: 0xe8dfc8, roughness: 0.5 })
                );
                // 圆柱默认立在 y 上，转 -90° 放平成朝 +x（也就是世界的正前方）。
                shaft.rotation.z = -Math.PI / 2;
                const nock = new THREE.Group();
                nock.add(shaft);
                const tip = new THREE.Mesh(shared.box, new THREE.MeshStandardMaterial({
                    color: 0xbfe9ff,
                    emissive: 0x2f6f9f,
                    emissiveIntensity: 0.8,
                    metalness: 0.6,
                    roughness: 0.3
                }));
                tip.scale.set(0.17, 0.09, 0.09);
                tip.position.x = BOW_RADIUS * 0.72;
                nock.add(tip);
                nock.position.x = stringX;
                frame.add(nock);

                model.position.set(BOW_REST.x, BOW_REST.y, BOW_REST.z);
                // 把弓面从竖直压向水平。真人射箭是竖着端弓的，但这是俯视镜头：竖着端时
                // 弓臂几乎正对相机，那道弧被压成一条竖线，实测截图里只看得出「手里有个东西」，
                // 读不出是弓。压到 63° 之后整道弧摊开朝着相机，弓形一眼就认得出。
                //
                // 绕的是 model 的局部 z 轴，也就是箭的飞行方向——所以只改弓面的倾角，
                // 不动瞄准方向（arrowDir 仍然等于 playerFacing，见 __wik.bow()）。
                //
                // 取 72° 而不是压到 90° 全平：全平时弓面法线朝正上，相机俯角 52.6°，
                // 弓形按 cos(52.6°) ≈ 0.61 收缩；留 18° 让法线偏向相机那侧，
                // 玩家转身时最好能到接近正对，最差也不比全平差多少。
                model.rotation.z = -1.25;
                model.userData = {
                    frame, limb, string, nock, tip,
                    stringX,
                    // 分级特效挂上去的那些件，按需创建（见 applyWeaponAppearance）。
                    glow: null
                };
                return model;
            }

            function createPlayerBow() {
                playerBow = createBowModel();
                playerBow.visible = false;
                playerVisual.add(playerBow);
                // 弓永远压在玩家自己身上画。走的是这个工程里既有的那套办法（守卫的剪影和
                // 眼睛、血条、封印里的巨龙都是这么处理的）：该看见的东西关掉深度测试、
                // 把绘制顺序抬到遮挡物之上。
                //
                // 为什么非得这样：手持物挂在玩家局部坐标上，会跟着玩家转。俯视镜头下，
                // 无论把弓摆在哪个固定偏移上，总存在一个朝向让那个偏移正好指向视线深度方向，
                // 那一刻弓就整个躲到兜帽后面（兜帽是球心 y=2.25、半径 0.58 的球，比弓高一米）。
                // 试过往左推、往前推、抬高，都只是把「哪些朝向会被挡」换一批而已，挡不住的
                // 朝向一个都不少。这不是数值没调好，是固定偏移解决不了的事。
                //
                // 代价是弓从兜帽后面转过去时会穿头画出来。40 像素宽的东西上，这读作
                // 「弓横在身前」，比「弓时有时无」好得多。
                bowMeshes(playerBow).forEach(mesh => {
                    mesh.material.depthTest = false;
                    // 6：压过玩家（0）和守卫的透视剪影（4/5），仍在血条（20+）之下。
                    // 矿体是半透明队列、整队排在不透明之后，所以矿墙照旧盖得住弓——
                    // 这一点要的就是和玩家本体一致，玩家被矿墙挡住时弓不该还浮着。
                    mesh.renderOrder = 6;
                });
                // Lv1 的外观就走同一个函数，别在这儿再写一份初始色——两份迟早会不一致。
                applyWeaponAppearance();
            }

            // 弓上所有实际画出来的网格。分级特效会往弓上挂新件（见 applyWeaponAppearance），
            // 那些也得跟着关深度测试，否则升到 Lv2 之后光环会被兜帽切掉一半。
            function bowMeshes(root) {
                const list = [];
                root.traverse(child => { if (child.isMesh) list.push(child); });
                return list;
            }

            // 放箭之后的回位动画。bowDraw 从 1 数到 0：1 是弦刚弹回去的那一瞬（箭已经飞走，
            // 所以搭在弦上那支要藏起来），0 是重新搭好箭、拉到待发。
            //
            // 顺序是「先放后拉」而不是「先拉后放」，因为攻击是自动触发的——
            // 判定发生在按下的那一帧，没有前摇可以用来演拉弓。所以拉弦这一段放在射后，
            // 读作「上箭准备下一发」，同时也把攻击间隔填满了，弓不会在两发之间僵在那儿。
            function updateBowPose(dt, holdingEgg) {
                if (bowDraw > 0) bowDraw = Math.max(0, bowDraw - dt * 3.6);
                if (!playerBow || !playerBow.visible) return;
                const data = playerBow.userData;
                if (heldItem !== "bow") {
                    data.string.position.x = data.stringX;
                    data.nock.visible = false;
                    return;
                }
                const pull = (1 - bowDraw) * 0.19;
                data.string.position.x = data.stringX - pull;
                data.nock.position.x = data.stringX - pull;
                data.nock.visible = bowDraw < 0.5;
                // 放箭那一下让弓身往后一顿，箭出去才有反作用力。绕 BOW_REST.z 抖，
                // 别在这儿写死一个数——那样构造里的静止位置就永远不生效。
                playerBow.position.z = BOW_REST.z - bowDraw * 0.12;

                // 左手托弓、右手拉弦。背着龙蛋时左臂的抱蛋姿势优先——那是「我正在运一件
                // 关键道具」的读数，比举弓重要。
                if (!holdingEgg) {
                    playerLeftArm.rotation.x = -1.02;
                    playerLeftArm.rotation.z = -0.42;
                }
                playerRightArm.rotation.x = -0.62 - pull * 1.6;
                playerRightArm.rotation.z = 0.34;
            }

            // 手上拿什么。打矿举镐、打怪举弓——这一下本身就把两条升级线分开了，
            // 比靠地贴的图标区分强得多，而且不动任何数值。
            //
            // 武器线关掉时（?arpg=0）永远举镐：那一版的伤害是锄头驱动的，
            // 举着弓却按锄头等级结算伤害是自相矛盾的读数。
            // 弓是买来的，不是自带的。用户要的是「升级了武器建造台后，获得弓箭」——
            // 弓从第一帧就挂在手上的话，那次升级就没有「拿到一件新东西」这个瞬间，
            // 而那正是这条线要卖的东西。
            //
            // 举弓和射箭是两处独立判断（setHeldItem 管手持物、playerAttack 里的 shooting
            // 管投射物），必须共用这一个判据，否则会出现「举着镐却在射箭」。
            function bowUnlocked() {
                return weaponEnabled() && weaponLevel >= 2;
            }

            function setHeldItem(kind) {
                const bow = kind === "bow" && bowUnlocked() && playerBow;
                heldItem = bow ? "bow" : "pick";
                if (playerWeapon) playerWeapon.visible = !bow;
                if (playerBow) {
                    playerBow.visible = bowUnlocked();
                    if (bow) {
                        playerBow.position.set(BOW_REST.x, BOW_REST.y, BOW_REST.z - bowDraw * 0.12);
                        playerBow.rotation.set(0, 0, -1.25, "XYZ");
                        playerBow.scale.setScalar(1);
                    } else {
                        playerBow.position.set(-0.48, 1.55, -0.62);
                        playerBow.rotation.set(0, Math.PI / 2, -0.55, "ZYX");
                        playerBow.scale.setScalar(1.2);
                    }
                }
            }

            function disposeEquipment(model) {
                model.traverse(o=>{if(o.isMesh){
                    if(o.geometry!==shared.box && o.geometry!==shared.sphere)o.geometry.dispose();
                    o.material.dispose();
                }});
            }

            function stylePickaxe(model, level) {
                const style=PICK_STYLES[level-1],head=model.userData.head;
                head.scale.set(.78+(level-1)*.25,.22+(level-1)*.06,.26+(level-1)*.04);
                head.material.color.setHex(style.color);head.material.emissive.setHex(style.glow);
                head.material.emissiveIntensity=level===1 ? .12 : .6;
                if(model.userData.trim){model.remove(model.userData.trim);disposeEquipment(model.userData.trim);}
                const trim=new THREE.Group();model.add(trim);model.userData.trim=trim;
                const add=(geometry,color,x,y,z)=>{
                    const m=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color,emissive:style.glow,emissiveIntensity:.25,metalness:.5,roughness:.35}));
                    m.position.set(x,y,z);trim.add(m);return m;
                };
                if(level>=2){
                    add(new THREE.OctahedronGeometry(.19+(level-2)*.045),style.color,.15,.88,.22);
                    for(const y of [.1,.48])add(new THREE.CylinderGeometry(.1,.1,.1,6),0xd4ad64,0,y,0);
                }
                if(level>=3)for(const side of [-1,1]){
                    const blade=add(new THREE.ConeGeometry(.22, .52,4),style.color,.15+side*.66,.87,0);
                    blade.rotation.z=-side*Math.PI/2;
                }
                if(level===4){
                    const crest=add(new THREE.BoxGeometry(.23,.25,.38),0xffd276,.15,1.12,0);crest.rotation.z=.2;
                    for(const side of [-1,1])add(new THREE.OctahedronGeometry(.16),0xfff0b0,.15+side*.45,1.09,0);
                }
            }

            function createPickModel(level) {
                const model=new THREE.Group();
                const handle=new THREE.Mesh(new THREE.CylinderGeometry(.065,.08,1.35,8),new THREE.MeshStandardMaterial({color:0x77503b}));
                handle.position.y=.24;model.add(handle);
                const head=new THREE.Mesh(shared.box,new THREE.MeshStandardMaterial({color:0xffffff}));
                head.position.set(.15,.86,0);head.rotation.z=-.2;model.add(head);
                model.userData={head,handle};stylePickaxe(model,level);return model;
            }

            function styleBowModel(model, level) {
                const data=model.userData;
                if(data.styleLevel===level)return;data.styleLevel=level;
                data.limb.scale.setScalar(level>=3 ? 1.18 : 1);
                data.limb.material.color.setHex(level>=3 ? 0xe3b767 : 0xd39a56);
                if(data.armor){data.frame.remove(data.armor);disposeEquipment(data.armor);}
                const armor=new THREE.Group();data.frame.add(armor);data.armor=armor;
                if(level>=3){
                    for(const side of [-1,1]){
                        const wing=new THREE.Mesh(new THREE.ConeGeometry(.16,.48,4),new THREE.MeshStandardMaterial({color:0xffc35b,emissive:0xb94c17,emissiveIntensity:.5,metalness:.65}));
                        wing.position.set(.08,side*.57,0);wing.rotation.z=side>0 ? -.5 : Math.PI+.5;armor.add(wing);
                    }
                    const core=new THREE.Mesh(new THREE.OctahedronGeometry(.14),new THREE.MeshBasicMaterial({color:0xffde93}));
                    core.position.set(BOW_RADIUS,0,0);armor.add(core);
                }
                data.string.material.color.setHex(level>=3 ? 0xffba55 : 0xd9d2c4);
                data.tip.material.color.setHex(level>=3 ? 0xffa23c : 0xbfe9ff);
            }

            function pickFractureLines(at, color, level) {
                const group=new THREE.Group();group.position.copy(at).setY(.16);
                for(const offset of [-.6,0,.6]) {
                    const angle=player.rotation.y+offset,length=level===4 ? 2.5 : 1.7;
                    const mesh=new THREE.Mesh(new THREE.BoxGeometry(.055,.02,length),new THREE.MeshBasicMaterial({color,transparent:true,depthWrite:false}));
                    mesh.rotation.y=angle;mesh.position.set(Math.sin(angle)*length/2,0,Math.cos(angle)*length/2);
                    mesh.userData.opacity=.7;group.add(mesh);
                }
                scene.add(group);effects.push({type:"chainBolt",mesh:group,life:.25,maxLife:.25});
            }

            function showEquipmentUpgrade(kind, level) {
                firstUpgradeStrike[kind]=true;equipmentShowTimer=.55;
                const model=kind==="pick" ? createPickModel(level) : createBowModel();
                if(kind==="bow"){styleBowModel(model,level);model.rotation.set(-.35,Math.PI/2,-.35);}
                else model.rotation.z=-.55;
                model.position.copy(player.position).add(new THREE.Vector3(0,3.4,0));model.scale.setScalar(1.5);
                scene.add(model);effects.push({type:"equipmentReveal",mesh:model,life:.65,maxLife:.65});
            }

            function applyPickaxeAppearance() {
                stylePickaxe(playerWeapon,pickaxeLevel);
                return pickaxeTier(pickaxeLevel);
            }

            function completePickaxe() {
                pickaxeLevel = Math.min(PICKAXE_LEVELS.length, pickaxeLevel + 1);
                const level = PICKAXE_LEVELS[pickaxeLevel - 1];
                // 加增量，不是赋值。原先这儿是 `power = level.power_score`，而孵化和进化
                // 是 `power += ...`——两种写法混在一个变量上，于是「先孵化、再升锄头」
                // 会把宠物加的那 1420 分当场抹掉。战力只进 HUD、不影响任何玩法，
                // 所以这个 bug 一直没人发现；武器线是第四个来源，再往上叠就该修了。
                const prevLevel = PICKAXE_LEVELS[pickaxeLevel - 2];
                power += level.power_score - (prevLevel ? prevLevel.power_score : 0);
                const tier = applyPickaxeAppearance();
                showEquipmentUpgrade("pick",pickaxeLevel);
                buildPopEffect(player.position.clone().add(new THREE.Vector3(0.7, 1.4, 0)), 22, tier.glow);
                playSound("upgrade");
                const zone = zones.find(item => item.id === "pickaxe");
                if (zone) {
                    const nextCost = resolveTileCost("pickaxe");
                    if (!nextCost) removeZone(zone);
                    else {
                        resetZone(zone, nextCost);
                        // 买到倒数第二级时这一步会把贴挪到封印走廊——最后一级不解锁矿层，
                        // 没有理由再把玩家从矿脉深处叫回城里一趟。
                        if (!C_BLOCKS || cityLevel < 4) moveZone(zone, tileSlot("pickaxe"));
                    }
                }
                releaseCityGate("pickaxe");
                updateUI();
                // 满级按预设能买到第几级判，不能写死 3：A 版封顶三级、宝石版四级，
                // 写死的话宝石版买到 Lv3 就会报「已满级」，而地贴上明明还挂着下一档。
                toast(["", "翠晶强化镐：解锁中级矿，挥镐更快", "紫晶重型镐：解锁高级矿，一次砸开更多矿柱", "熔金能量镐：高级矿开采提速，重击大片碎裂"][pickaxeLevel-1]);
                defer(1.5, spawnSweepCharge);
            }

            function completeHatchery() {
                const zone = zones.find(item => item.id === "hatchery");
                if (zone) removeZone(zone);
                startEggPlace();
            }

            // ── 钻石单轨 ──────────────────────────────────────────────────────
            //
            // 吃钻石的有三张地贴：锻造台、孵化台、进化台。它们抢同一个钻石池，而龙是这个
            // 广告的卖点。并排放出去实测的结果是：进化台在 84.5 秒就能付钱了，却拖到 121 秒
            // 才被买下——中间 36.5 秒玩家手上的钻石全流去了锻造台，一局才 137 秒。
            //
            // 所以不靠引导排序，直接一次只放一张，顺序写死：
            //     武器 Lv2  →  孵化台  →  武器 Lv3  →  进化
            // 锻造台因此有两个窗口，中间那段收起来。它不是删掉、是隐藏——removeZone 之后
            // showTile 会重建一个新的，付款进度会丢。
            //
            // 武器 Lv3 卡在进化前面，等于它不再是可选支线，必须进 ensureProgressAffordable
            // 的兜底，否则钻石不够时整局锁死。那儿有对应的一条。
            function forgeWindowOpen() {
                if (!weaponEnabled()) return false;
                if (weaponLevel >= WEAPON_LEVELS.length) return false;
                // Lv1→Lv2 是第一个窗口，城 Lv2 一亮就开着。
                // Lv2→Lv3 只看城 Lv4，免费孵化提前也不会提前放出武器升级。
                return weaponLevel === 1 || cityLevel >= 4;
            }

            function syncForgeWindow() {
                const zone = zones.find(item => item.id === "forge");
                if (!zone) return;
                const open = forgeWindowOpen();
                if (zone.group.visible === open) return;
                zone.group.visible = open;
                // 重新亮起时如果玩家正踩在上面，要求他走开再回来。否则地贴一出现就开始
                // 扣钱，玩家根本没看见自己买了什么。createZone 里是同一条规则。
                if (open) zone.requiresReentry = isPlayerInsideZonePosition(zone.position);
            }

            // 扩建贴的放行。城解锁的那件设施升完一级，下一级城才买得到。
            function releaseCityGate(id) {
                if (cityGate !== id) return;
                cityGate = null;
                const zone = zones.find(item => item.id === "city-upgrade");
                if (!zone) return;
                zone.group.visible = true;
                zone.requiresReentry = isPlayerInsideZonePosition(zone.position);
                toast("主城可以继续扩建了");
            }

            // 钻石进账的唯一入口。原先五处各自 `gems += n`，要加任何「拿到钻石时」的
            // 触发点就得改五处，漏一处就是一条玩家永远看不到的成长线。
            function gainGems(amount) {
                if (!(amount > 0)) return;
                gems += amount;
                ui.gemHud.classList.add("revealed");
            }

            function completeWeapon() {
                weaponLevel = Math.min(WEAPON_LEVELS.length, weaponLevel + 1);
                const tier = weaponTier(weaponLevel);
                const prevTier = WEAPON_LEVELS[weaponLevel - 2];
                power += tier.power_score - (prevTier ? prevTier.power_score : 0);
                applyWeaponAppearance();
                showEquipmentUpgrade("bow",weaponLevel);
                buildPopEffect(player.position.clone().add(new THREE.Vector3(0.7, 1.4, 0)), 22, 0xff7a2a);
                playSound("upgrade");
                const zone = zones.find(item => item.id === "forge");
                if (zone) {
                    const nextCost = resolveTileCost("forge");
                    if (!nextCost) removeZone(zone);
                    else {
                        resetZone(zone, nextCost);
                        // 单轨：买完这一级就收起来，下一个窗口由 syncForgeWindow 放行。
                        zone.group.visible = false;
                    }
                }
                releaseCityGate("forge");
                // 武器满级 = 宠物线的最后一步可以开始了。进化台原先挂在主城 Lv4 上，
                // 那个位置让给孵化台之后，改由这儿放出——单轨的最后一棒。
                showEvolveWhenReachable();
                updateUI();
                // 报出这一级买到的附加，不报伤害数字。伤害只在打中时闪一下就没了，
                // 玩家记不住 425 和 805 的区别；「够得更远」「一下打两只」是他能在
                // 下一次遭遇里亲自验证的东西。
                //
                // Lv2 单独说一句：那一级给的不是加成，是**弓本身**（见 bowUnlocked）。
                // 它是这条线唯一一次「手上多了一件东西」，混在「附魔完成」里就读没了。
                if (weaponLevel === 2) {
                    setHeldItem("pick");
                    toast("获得弓箭！已背在背上，遇到野怪自动举弓射击");
                    return;
                }
                const gained = weaponLevel === 3 ? t("射速提升，第三箭爆炸，清理成群野怪")
                    : t("威力再上一档");
                const maxed = weaponLevel >= WEAPON_LEVELS.length;
                toast(maxed ? t("弓箭强化满级，{gained}", { gained }) : t("弓箭强化完成，{gained}", { gained }));
            }

            // 弓的分级外观。原先这儿是「给手上那把镐套一层附魔壳」，代价当初就明写下来
            // 接受了：不新增手持物，省掉模型和挥击动画。实机验证下来这个代价太贵——
            // 两条线花两种货币、买两种东西，玩家看到的却是同一把镐亮了一下。
            // 现在弓是独立手持物（见 createPlayerBow），这里改成给弓分级。
            //
            // 镐头本身一行都不碰：它的绿/紫/橙是「这把能凿开哪一层矿」的读数
            // （见 applyPickaxeAppearance），归挖矿线，不该被战斗线的成长盖掉。
            function applyWeaponAppearance() {
                if (!playerBow) return;
                styleBowModel(playerBow,weaponLevel);
                bowMeshes(playerBow).forEach(m=>{m.material.depthTest=false;m.renderOrder=6;});
                const data = playerBow.userData;
                const level = weaponEnabled() ? weaponLevel : 1;
                const color = weaponArcColor();

                // 箭头和弓弦跟着走。这两处是弓上唯一逐级变色的地方——弓臂保持木色，
                // 否则整把弓一起变亮，反而看不出是「箭」变强了。
                data.tip.material.color.setHex(level >= 2 ? color : 0xbfe9ff);
                data.tip.material.emissive.setHex(level >= 3 ? color : 0x2f6f9f);
                data.string.material.color.setHex(level >= 3 ? color : 0xd9d2c4);

                if (level <= 1) {
                    if (data.glow) data.glow.visible = false;
                    return;
                }
                let glow = data.glow;
                if (!glow) {
                    glow = new THREE.Mesh(shared.box, new THREE.MeshBasicMaterial({
                        transparent: true,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false
                    }));
                    // 挂成 nock（搭在弦上那支箭）的子物体，于是自动跟着拉弦动画走，
                    // 一行同步代码都不用写。
                    data.nock.add(glow);
                    data.glow = glow;
                    // 和弓身同一套：见 createPlayerBow 里那段。这件是后挂的，
                    // 那儿的一次性遍历跑不到它。
                    glow.material.depthTest = false;
                    glow.renderOrder = 6;
                }
                glow.visible = true;
                // 起亮 → 烧透。除了透明度还得一起拉尺寸和颜色——加色混合在亮地面上
                // 很容易糊成一片白，光靠 opacity 分不出档位。
                //
                // 乘 2 是因为武器线从四级砍成了三级：原先 heat 走 0/1/2 三档，现在只剩
                // 两档，直接用 level-2 的话顶格停在原来的中间档，最亮那一档没人看得到了。
                // 端点保留是这次砍级的原则，这里跟着跳一档。
                const heat = (level - 2) * 2;
                glow.material.opacity = 0.4 + heat * 0.16;
                glow.material.color.setHex(color);
                glow.scale.set(0.9 + heat * 0.16, 0.16 + heat * 0.05, 0.16 + heat * 0.05);
                glow.position.x = 0.16;
            }

            // 攻击弧光的颜色。顶格从青白转亮橙：打怪时玩家的视线在怪身上，不在自己手里
            // 那把弓上，所以这道每次挥击都划过屏幕的弧光比弓上那层辉光显眼得多。
            //
            // 顶格取 0xffa23c（原四级时代最高那一档），不是 0xff6a2a。武器线砍成三级之后
            // 「>= 4」那条分支永远走不到，照抄的话最亮的颜色整局都不会出现。
            // 不传等级就是「当前这一级」。地贴要传「下一级」——它画的是买完会得到什么。
            function weaponArcColor(level = weaponLevel) {
                if (!weaponEnabled() || level < WEAPON_LEVELS.length) return 0x8fd6ff;
                return 0xffa23c;
            }

            function showEvolveWhenReachable() {
                // 地贴位于封印前走廊：高级矿凿穿后再解锁，避免把尚未到达的区域当成当前任务。
                if (pet && !petEvolved && breachedByTier.high > 0 &&
                    (!weaponEnabled() || weaponLevel >= WEAPON_LEVELS.length)) {
                    if(C_BLOCKS && !blockState.evolveSlot) {
                        const spot=findClearSpot(player.position.clone().add(new THREE.Vector3(0,0,-1.5)),2.1);
                        blockState.evolveSlot={x:spot.x,z:spot.z};
                    }
                    showTile("evolve");
                }
            }

            function completeEvolve() {
                const zone = zones.find(item => item.id === "evolve");
                if (zone) removeZone(zone);
                evolvePet();
                maybeShowSealOffering();
            }

            // 献祭点只有一个前置：宠物已进化。对峙的构图里站着玩家和他的龙，CTA 文案也
            // 写死了「你的巨龙已经进化完成」——不卡这条，两边会一起对不上。
            //
            // 原先还要「锄头满级」，理由是给 Lv4 一个解锁物。这条 2026-09-08 去掉了：
            // 高级矿只要 Lv3（requiredPickaxe: 3），所以玩家凿穿高级矿时手里是 Lv3，
            // 这道前置的唯一效果就是把他赶回城里买一次 Lv4 再走回来。Lv4 仍然值得买
            // ——提速，外加那一次横扫直接清空三层矿——只是不再拦着终局。
            //
            // 现在只有 completeEvolve 和看门狗两处调它，仍然幂等。
            function maybeShowSealOffering() {
                if (!ECON.sealOffering || finaleStarted) return;
                if (!petEvolved) return;
                // 先让末波战斗读清楚，再亮出献祭目标；金币不足时引导仍会返回矿区。
                if (!finalWave.spawned || finalWave.killed < finalWave.count) return;
                if (sealOffered) return;
                sealOffered = true;
                if (VERSION === "a") {
                    ensureUltimateCharge();
                    ultimateCharge.locked = false;
                    ultimateCharge.lock.visible = false;
                    ultimateCharge.body.material.color.setHex(0x972d35);
                    ultimateCharge.track.material.color.setHex(0xffb03c);
                    markRun("ultimate-unlocked");
                    toast("终极炸药桶已就绪，踩入光圈引爆封印");
                    playSound("warn");
                    return;
                }
                showTile("seal");
                toast("巨龙已进化，把金币砸进封印");
                playSound("warn");
            }

            function completeSeal() {
                sealArmed = true;
                const zone = zones.find(item => item.id === "seal");
                if (zone) removeZone(zone);
                cameraShake = Math.max(cameraShake, 0.5);
                playSound("crack");
                toast("封印松动了，凿开它");
            }

            // 玩家自己抡的那一下。走到这儿时他已经站在墙根底下砸了好几秒
            // （献祭点在 mineRange 之内，自动索敌一直咬着封印墙），所以这一下
            // 不需要任何额外输入——付满之后的下一次挥镐就是它。
            function breakSeal(node) {
                if (finaleStarted) return;
                finaleStarted = true;
                sealArmed = false;
                markRun("seal-break");
                // 破封点钉在玩家砸的这一段上。sealedDragonSite() 挑的是「离玩家最远」的
                // 那一段，那条规则的前提是终局可能在玩家还在城里时触发；现在触发点就是
                // 他脚下，照那条挑会让龙从他背后的另一头钻出来，因果链当场断掉。
                const radius = ORE_TIERS[SEALED_TIER].ringRadius;
                const angle = Math.atan2(node.position.z, node.position.x);
                finale.forcedSite = new THREE.Vector3(
                    Math.cos(angle) * radius, 0, Math.sin(angle) * radius
                );
                buildPopEffect(getOreImpactPoint(node), 34, 0xff8a3c);
                cameraShake = Math.max(cameraShake, 0.9);
                playSound("crack");
                // 收掉所有还亮着的地贴。锄头 Lv4 已经搬回城里了（见 TILE_SLOTS），
                // 剩下的贴又全在城里、离破封点四十米，这一步眼下收不到什么；留着是因为
                // 进化台仍然摆在这条走廊上，离破封点只有 4.4 米——万一它还亮着，
                // 一张地贴会横在巨龙挣出来那一拍的画面里。
                for (const zone of zones) zone.group.visible = false;
                defer(0.5, startFlameDragonIntro);
            }

            function isPlayerInsideZonePosition(position) {
                if (!player) return false;
                const half = CONFIG.zoneTileSize * 0.5;
                return Math.abs(player.position.x - position.x) < half &&
                    Math.abs(player.position.z - position.z) < half;
            }

            function isZonePayable(zone) {
                if (zone.complete) return false;
                if (C_BLOCKS && zone.id === "city-upgrade") return cityLevel>0 && cityLevel<4 && !cityGate;
                if (zone.id === "hatchery") return carryingEgg;
                if (zone.id === "evolve") return Boolean(pet) && !petEvolved;
                // 献祭点的两个前置在 maybeShowSealOffering 里已经判过了——它只在条件齐了
                // 之后才摆出来，摆出来就一定收钱。这里不重复判，免得两处规则各写一份。
                if (zone.id === "seal") return true;
                // 主城和锄头必须交替推进：扩建解锁下一级锄头，锄头凿开下一层矿再供养下一次扩建。
                // 不互锁的话，路过时漏进地贴的金币会先把远期的扩建喂饱，玩家会带着二级锄头站在高级矿墙前面。
                //
                // 钻石版不需要这把锁：锄头只收钻石、扩建只收金币，两条收入互不流通，顺序自己就成立了。
                if (!ECON.orderInterlock) return true;
                if (zone.id === "pickaxe") return cityLevel >= pickaxeLevel + 1;
                if (zone.id === "city-upgrade") return pickaxeLevel >= cityLevel;
                return true;
            }

            function updateZones(dt) {
                for (const zone of zones) {
                    if (zone.id === "forge" || zone.id === "pickaxe") {
                        const next=zone.id==="forge" ? Math.min(3,weaponLevel+1) : Math.min(4,pickaxeLevel+1);
                        if(zone.equipmentLevel!==next){
                            if(zone.bowDisplay){zone.group.remove(zone.bowDisplay);disposeEquipment(zone.bowDisplay);}
                            const model=zone.id==="forge" ? createBowModel() : createPickModel(next);
                            if(zone.id==="forge")styleBowModel(model,next);
                            model.rotation.set(-.35,zone.id==="forge" ? Math.PI/2 : 0,-.35);
                            model.scale.setScalar(1.4);zone.bowDisplay=model;zone.group.add(model);zone.equipmentLevel=next;
                        }
                        zone.bowDisplay.visible=!zone.complete;
                        zone.bowDisplay.position.set(0,1.6+Math.sin(zone.pulse*2)*.1,-.65);
                    }
                    if (!zone.group.visible) continue;
                    const remote=C_BLOCKS && zone.id==="city-upgrade" && zone.remoteBudget>0;
                    const inside = isPlayerInsideZonePosition(zone.position) || remote;
                    if (zone.requiresReentry && !inside) zone.requiresReentry = false;
                    if (zone.complete) continue;
                    // 走开就把提示解锁。原先只在「这一帧能付款」时才重置，于是钱不够的地贴
                    // 一辈子只说一次话——而这一版恰恰要它反复说：玩家踩上锄头地贴、发现买不起、
                    // 去打了一只怪、钱还是不够，回来时最需要的就是再听一遍「还差几颗」。
                    if (!inside) { zone.hintShown = false; zone.lastHint = null; }

                    const currency = tileCurrency(zone.id);
                    const grade = tileShardGrade(zone.id);
                    const wallet = walletOf(currency, grade);
                    const payable = isZonePayable(zone);
                    const remaining = Math.max(0, zone.cost - zone.paid);
                    const ready = payable && !zone.requiresReentry && (remaining === 0 || wallet > 0);
                    const status = zoneStatus(zone);
                    zone.pulse += dt;
                    const pulse = ready ? 0.9 + Math.sin(zone.pulse * CONFIG.zonePulseSpeed) * 0.1 : 0.72;
                    zone.tile.material.opacity = pulse;
                    zone.base.material.opacity = ready ? 0.62 : 0.45;
                    if (zone.lastReady !== ready || zone.lastStatus !== status) {
                        zone.lastReady = ready;
                        zone.lastStatus = status;
                        drawTile(zone, ready);
                    }

                    // 钻石、宝石都和金币一样，有多少付多少，不用攒够一次升级才能捐。
                    //
                    // 这里曾经是「要么一次付清、要么一颗都不收」，理由是怕玩家把钻石压死在一张
                    // 永远付不完的地贴里。那个担心站不住：捐进去的每一颗都是在给同一笔消费攒钱，
                    // 和揣在兜里是同一个局面，压不住任何东西。真正保证供给的是数量本身
                    // 和缺钱时改指来源的箭头，不是这条规则。
                    if (!inside || !payable || zone.requiresReentry || (remaining > 0 && wallet <= 0) || ctaOpen || cinematic.active) {
                        zone.paymentTimer = 0;
                        // 先收下他带来的，掏空了地贴还没满，这时才说「还差几颗」。
                        const hint = zonePaymentHint(zone);
                        if (inside && !ctaOpen && !cinematic.active && zone.lastHint !== hint) {
                            zone.hintShown = true;
                            zone.lastHint = hint;
                            toast(hint);
                        }
                        continue;
                    }
                    zone.hintShown = false;
                    zone.lastHint = null;

                    zone.paymentTimer -= dt;
                    if (zone.paymentTimer > 0) continue;
                    zone.paymentTimer = CONFIG.zonePaymentInterval;
                    // 每次扣的枚数跟着剩余金额走，贵的地贴也能在一秒多付完，不然后期光付款就要等七八秒。
                    const step = Math.max(1, Math.ceil(remaining / CONFIG.zonePaymentTicks));
                    const amount = Math.min(step, wallet, remaining,remote?zone.remoteBudget:Infinity);
                    if(remote)zone.remoteBudget-=amount;
                    if (currency === "gem") {
                        gems -= amount;
                    } else if (currency === "shard") {
                        shards[grade] -= amount;
                    } else {
                        coins -= amount;
                        syncBackCoins();
                    }
                    zone.paid += amount;
                    if (amount > 0) flyCoinTo(zone.position, currency, grade);
                    updateUI();
                    zone.paymentTick = (zone.paymentTick || 0) + 1;
                    if (zone.paymentTick % 2 === 0) playSound("coin");
                    drawTile(zone, walletOf(currency, grade) > 0);

                    if (zone.paid >= zone.cost) {
                        zone.complete = true;
                        if(C_BLOCKS && zone.id==="city-upgrade")blastBlockPlot(cityLevel);
                        buildPopEffect(zone.position.clone().add(new THREE.Vector3(0, 0.5, 0)), 22, 0xffda4c);
                        const callback = zone.onComplete;
                        defer(0.14, callback);
                    }
                }
            }

            // 钻石不够时说的那句话。这是整个钻石版唯一交代「钻石从哪来」的地方——
            // 守卫堵路撤掉之后，玩家不会再被一堵凿不动的墙逼到怪面前，全靠这句话和箭头。
            // 所以要分两种说法：怪已经跳出来了就报「箭头指着它」，把提示和箭头绑成一件事；
            // 还冻在矿里就得先说凿墙，否则玩家会满地找一只根本还没出现的怪。
            // 武器台曾经有一句不承诺箭头的特例说法，因为它当时是可选支线、引导不为它指路。
            // 钻石单轨之后它卡着下一级城和进化，`getGuideGoal` 的钻石缺口分支已经带上了它，
            // 箭头是真会指过去的——特例撤掉，否则这句话反过来在少说一句真话。
            function gemShortCopy(short) {
                if (!nearestLivingGuard()) return t("还差 {n} 颗钻石，凿开矿墙叫醒里面的守卫", { n: short });
                return t("还差 {n} 颗钻石，打倒守卫就能拿到，箭头指着它", { n: short });
            }

            // 宝石不够时说的那句话。要说清两件事：缺的是哪一档，以及那一档从哪儿来。
            // 只说「还差 3 颗宝石」不行——玩家手上多半正揣着一把上一档的作废宝石，
            // 他会以为自己已经有了，然后站在地贴上反复踩。
            //
            // 那一层还有货就报层名（箭头同时指过去）；已经榨干了就得直说，
            // 否则玩家会回头去挖一堵早就没宝石的墙。
            function shardShortCopy(short, grade) {
                const name = SHARD_GRADES[grade] ? SHARD_GRADES[grade].name : t("宝石");
                const tier = ORE_TIERS[grade];
                if (!tier) return t("还差 {n} 颗{name}", { n: short, name });
                return nearestShardNode(grade)
                    ? t("还差 {n} 颗{name}，{ore}里还埋着，箭头指着它", { n: short, name, ore: tier.name })
                    : t("{ore}已经挖空了，{name}不够就升不了这把锄头", { name, ore: tier.name });
            }

            function zoneBlockedCopy(id) {
                if (C_BLOCKS && id === "city-upgrade") {
                    if (cityGate) return LANG === "en" ? "Complete the highlighted workshop upgrade first" : "先完成箭头指向的工坊升级";
                }
                if (id === "hatchery") return "先去野外找到龙蛋，抱回来孵化";
                if (id === "evolve") return "先孵化出宠物才能进化";
                if (id === "pickaxe") return "先扩建主城，才能解锁下一级锄头";
                if (id === "city-upgrade") return "先升级锄头凿开下一层矿，再扩建主城";
                return "";
            }

            function zoneStatus(zone) {
                if (zone.complete) return LANG === "en" ? "COMPLETE" : "已完成";
                if (zone.requiresReentry) return LANG === "en" ? "STEP OFF & RETURN" : "离开后再进入";
                if (C_BLOCKS && zone.id === "city-upgrade") {
                    return "可提前捐献 · 付满爆破";
                }
                if (!isZonePayable(zone)) return zone.id === "hatchery" ? (LANG === "en" ? "BRING THE EGG" : "先带回龙蛋") : (LANG === "en" ? "UPGRADE REQUIRED" : "先完成前置升级");
                const left = zone.cost - zone.paid;
                if (left && !walletOf(tileCurrency(zone.id), tileShardGrade(zone.id))) return LANG === "en" ? "COLLECT TO CONTINUE" : "收集资源后继续支付";
                return zone.cost === 0 ? (LANG === "en" ? "STAND HERE TO HATCH" : "站上即可免费孵化") : (LANG === "en" ? "STAND HERE TO PAY" : "站上即可支付");
            }

            function zonePaymentHint(zone) {
                if (zone.requiresReentry) return LANG === "en" ? "Step off, then return for the next upgrade" : "离开地贴后重新进入，即可进行下一次升级";
                if (!isZonePayable(zone)) return t(zoneBlockedCopy(zone.id));
                const currency=tileCurrency(zone.id), grade=tileShardGrade(zone.id);
                const short=Math.max(0,zone.cost-zone.paid-walletOf(currency,grade));
                if (short && !walletOf(currency,grade)) {
                    if(currency === "shard") return shardShortCopy(short,grade);
                    if(currency === "gem") return gemShortCopy(short);
                    return LANG === "en" ? `Need ${short} more coins — mine to collect` : `还差 ${short} 金币，采矿后回来继续支付`;
                }
                return `${zoneStatus(zone)} · ${zone.paid}/${zone.cost}`;
            }
            function updateTileHint() {
                const zone=C_BLOCKS && !cinematic.active && !ctaOpen && zones.find(z=>z.group.visible && !z.complete && isPlayerInsideZonePosition(z.position));
                ui.tileHint.hidden=!zone;
                if(zone) { const hint=zonePaymentHint(zone);if(ui.tileHint.textContent!==hint)ui.tileHint.textContent=hint; }
            }

            function createOreField() {
                shared.oreMaterials = {};
                shared.chunkMaterials = {};
                for (const tierId of TIER_ORDER) {
                    const tier = ORE_TIERS[tierId];
                    // 半透明矿体：能直接看见冻在里面的金币和野怪。
                    // depthWrite 保留，否则几十个体素会互相叠加成一团发光的糊状物。
                    shared.oreMaterials[tierId] = new THREE.MeshStandardMaterial({
                        color: tier.color,
                        emissive: tier.emissive,
                        emissiveIntensity: tier.sealed ? 0.4 : 0.55,
                        roughness: tier.sealed ? 0.72 : 0.42,
                        metalness: 0.12,
                        transparent: true,
                        // 封印矿压到接近实心。半透明是为了透出冻在里面的金币和守卫，而这一层
                        // 两样都没有，照搬 0.46 只会让它读成「又一层能看穿的矿脉」——玩家凭什么
                        // 觉得这道墙和前三道不一样。压实之后它才是堵死的岩壁。
                        // 终局那几段不受影响：巨龙的封印剪影走自己的渲染顺序压在墙上，不靠矿体透光。
                        opacity: tier.sealed ? 0.94 : HIDE_GUARDS ? 1 : 0.46
                    });
                    shared.chunkMaterials[tierId] = new THREE.MeshStandardMaterial({
                        color: tier.chunkColor,
                        emissive: tier.emissive,
                        emissiveIntensity: 0.35,
                        roughness: 0.6
                    });
                }

                if (C_BLOCKS) {
                    createOreRing("low", { radius: 15, count: 1, offset: 0 });
                    createOreRing("low", { radius: 23, count: 1, offset: 1 });
                    for (const id of ["mid", "high", SEALED_TIER]) createOreRing(id);
                } else for (const tierId of TIER_ORDER) createOreRing(tierId);
                createDeepVeins();
                spawnRovers();
            }

            // 封印矿之外那四层「只给看」的矿脉。和 createOreRing 是两套东西：
            // 这里不建格子、不建柱、不注册碰撞、不产出、不进 oreRings/oreNodes，
            // 整层就是一个 InstancedMesh 加几只冻在里面的剪影。
            function createDeepVeins() {
                const rand = seededRandom(4801);
                for (const vein of DEEP_VEINS) {
                    const span = SECTOR.span + vein.flare * 2;
                    const spanStart = SECTOR.center - SECTOR.half - vein.flare;
                    const arcCells = Math.max(6, Math.round(span * vein.ringRadius / vein.cellArc));
                    const cellAngle = span / arcCells;
                    const cellHeight = vein.ringHeight / vein.rows;
                    // 不透明。近处矿墙半透明是为了透出里面的金币、宝石和守卫，远景没有
                    // 这个需求，而半透明在这里只有坏处：一层墙有三排格子、顶排还错开，
                    // 半透明会让它们互相叠加，颜色一路加到发白——第一版四层远景全糊成
                    // 糖果色的横条，比不加还糟。剪影改成半嵌在墙面上，不靠透光。
                    const material = new THREE.MeshStandardMaterial({
                        color: vein.color,
                        emissive: vein.emissive,
                        emissiveIntensity: vein.emissiveIntensity,
                        roughness: 0.68,
                        metalness: 0.08
                    });
                    // 顶排单独一份更亮的材质。整层一个亮度时，这么远看过去每层就是一条
                    // 均匀的色带，四条并排读成彩条而不是矿脉。把参差的那道脊线提亮之后，
                    // 每层才有「上缘在发光、下面压在暗处」的厚度。
                    const crestMaterial = material.clone();
                    crestMaterial.emissiveIntensity = vein.emissiveIntensity * 1.75;

                    const matrices = [];
                    const crestMatrices = [];
                    const matrix = new THREE.Matrix4();
                    const quaternion = new THREE.Quaternion();
                    const axis = new THREE.Vector3(0, 1, 0);
                    const scaleVector = new THREE.Vector3();
                    const offset = new THREE.Vector3();
                    for (let ai = 0; ai < arcCells; ai++) {
                        const angle = spanStart + (ai + 0.5) * cellAngle;
                        const cosA = Math.cos(angle);
                        const sinA = Math.sin(angle);
                        // 顶排按起伏概率留空，凿出一道参差的山脊线。整齐的平顶会读成
                        // 人造围墙，而这批矿要读成「山体深处还有的东西」。
                        const crest = 0.42 + Math.sin(ai * 0.5 + vein.ringRadius) * 0.3;
                        for (let y = 0; y < vein.rows; y++) {
                            if (y === vein.rows - 1 && rand() > crest) continue;
                            const worldY = cellHeight * (y + 0.5);
                            quaternion.setFromAxisAngle(axis, Math.PI / 2 - angle + (rand() - 0.5) * 0.05);
                            scaleVector.set(
                                vein.ringRadius * cellAngle * 1.04,
                                cellHeight * 1.04,
                                vein.ringThickness * 1.04
                            );
                            offset.set(cosA * vein.ringRadius, worldY, sinA * vein.ringRadius);
                            const composed = matrix.compose(offset, quaternion, scaleVector).clone();
                            (y === vein.rows - 1 ? crestMatrices : matrices).push(composed);
                        }
                    }

                    for (const [list, mat] of [[matrices, material], [crestMatrices, crestMaterial]]) {
                        if (!list.length) continue;
                        const instanced = new THREE.InstancedMesh(shared.box, mat, list.length);
                        // 阴影相机只有 ±40、far 90，这几层全在外面，开 castShadow 是纯浪费。
                        instanced.castShadow = false;
                        instanced.receiveShadow = false;
                        // 和近处矿墙同样的理由：包围球按共享的单位立方体算，
                        // 不关剔除的话整层会在中心一出画面时凭空消失。
                        instanced.frustumCulled = false;
                        list.forEach((m, i) => instanced.setMatrixAt(i, m));
                        instanced.instanceMatrix.needsUpdate = true;
                        scene.add(instanced);
                    }

                    // 地表色带。近处三层矿有同样的处理，远景跟着做，凿穿的层次感才连得上。
                    const band = new THREE.Mesh(
                        new THREE.RingGeometry(
                            vein.ringRadius - vein.ringThickness / 2,
                            vein.ringRadius + vein.ringThickness / 2,
                            40,
                            1,
                            -(spanStart + span),
                            span
                        ),
                        new THREE.MeshBasicMaterial({
                            color: vein.glow,
                            transparent: true,
                            opacity: 0.1,
                            side: THREE.DoubleSide,
                            depthWrite: false
                        })
                    );
                    band.rotation.x = -Math.PI / 2;
                    band.position.y = 0.02;
                    scene.add(band);

                    const bodies = [];
                    const eyes = [];
                    for (let i = 0; i < vein.guards; i++) {
                        const spread = (i + 1) / (vein.guards + 1);
                        collectDeepGuard(vein, spanStart + span * spread, bodies, eyes);
                    }
                    buildDeepGuards(vein, bodies, eyes, rand);
                }
            }

            // 半嵌在远景矿脉墙面上的大型剪影。造型沿用矿内守卫（方块拼的人形），
            // 但只保留隔这么远还看得出来的那几块：躯干、头、双臂、背刺、眼睛。
            //
            // 站位压在矿墙的内侧面上，身体一半埋进墙、一半探在外面——读成「正在从矿里
            // 挣出来」。不整只埋进去是因为远景矿墙是不透明的（半透明会把四层颜色叠白）；
            // 也不整只站在外面，那就成了空地上的散兵，和「这层矿里封着东西」是两句话。
            //
            // 眼睛不能照抄近处守卫那套 depthTest: false 的 X 光画法：那是为了让身体被
            // 四五层矿石叠没时还剩个东西能读，代价是眼睛会脱开墙体浮在半空。上次
            // 「像光斑」栽的就是这个，而这里身体本来就露在外面，不需要透视。
            // 把一只剪影拆成世界矩阵推进数组，不直接建 mesh。一只由九个方块加两只眼睛
            // 拼成，六只就是六十六个 Mesh、六十六次 draw call——为一块背景板付这个价
            // 在手机上不合算。同一层的几只共用材质，攒齐之后整层合成两个 InstancedMesh。
            function collectDeepGuard(vein, angle, bodies, eyes) {
                const radius = vein.ringRadius - vein.ringThickness / 2;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const parent = new THREE.Matrix4().compose(
                    new THREE.Vector3(x, 0, z),
                    new THREE.Quaternion().setFromAxisAngle(
                        new THREE.Vector3(0, 1, 0),
                        Math.atan2(-x, -z)
                    ),
                    new THREE.Vector3(vein.guardScale, vein.guardScale, vein.guardScale)
                );
                const part = (list, sx, sy, sz, px, py, pz, roll = 0) => {
                    const local = new THREE.Matrix4().compose(
                        new THREE.Vector3(px, py, pz),
                        new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), roll),
                        new THREE.Vector3(sx, sy, sz)
                    );
                    list.push(local.premultiply(parent));
                };
                part(bodies, 2.05, 2.2, 1.6, 0, 1.95, 0);
                part(bodies, 1.2, 1, 1.1, 0, 3.45, 0);
                for (const side of [-1, 1]) {
                    part(bodies, 0.66, 1.95, 0.7, side * 1.55, 2, 0);
                    part(bodies, 0.72, 1.1, 0.76, side * 0.64, 0.55, 0);
                }
                for (let i = 0; i < 3; i++) {
                    const scale = 0.36 + i * 0.16;
                    part(bodies, scale, scale * 1.9, scale, (i - 1) * 0.7, 3.1, -0.78, (i - 1) * 0.35);
                }
                for (const side of [-1, 1]) part(eyes, 0.3, 0.3, 0.3, side * 0.36, 3.5, 0.6);
            }

            function buildDeepGuards(vein, bodies, eyes, rand) {
                // 躯干压暗到接近剪影：矿墙本身是发光的，亮色身体会和墙的辉光糊在一起，
                // 暗块压在亮墙上才有轮廓。留一点同色自发光只是为了不在暗处塌成纯黑。
                const bodyMat = new THREE.MeshStandardMaterial({
                    color: 0x0b0a12,
                    emissive: vein.emissive,
                    emissiveIntensity: 0.18,
                    roughness: 0.9
                });
                const eyeMat = new THREE.MeshBasicMaterial({ color: vein.glow });
                for (const [list, geometry, mat] of [
                    [bodies, shared.box, bodyMat],
                    [eyes, shared.sphere, eyeMat]
                ]) {
                    const instanced = new THREE.InstancedMesh(geometry, mat, list.length);
                    instanced.castShadow = false;
                    instanced.receiveShadow = false;
                    instanced.frustumCulled = false;
                    list.forEach((m, i) => instanced.setMatrixAt(i, m));
                    instanced.instanceMatrix.needsUpdate = true;
                    scene.add(instanced);
                }
                // 静止的远景会被当成贴图。眼睛慢速一呼一吸就够了——画面上方有东西在动，
                // 视线自然会往那边走一次，而这正是这批矿唯一要争取的东西。
                //
                // 呼吸走颜色的明暗，不走 opacity：透明材质要进透明队列排序，
                // 逐帧的排序抖动会让眼睛一闪一闪地穿墙。
                deepGuards.push({
                    material: eyeMat,
                    base: new THREE.Color(vein.glow),
                    phase: rand() * Math.PI * 2
                });
            }

            function updateDeepGuards(elapsed) {
                for (const guard of deepGuards) {
                    guard.material.color.copy(guard.base)
                        .multiplyScalar(0.45 + Math.sin(elapsed * 1.3 + guard.phase) * 0.35 + 0.35);
                }
            }

            // 整个扇形共用一套极坐标格网：切向格数 = 扇形弧长 / 目标格宽，再取整到段数的整数倍。
            // 段边界因此正好落在格边界上，几段拼起来就是一道没有缝的扇形矿墙。
            function createOreRing(tierId, block = null) {
                const tier = ORE_TIERS[tierId];
                const { radial, rows } = tier.grid;
                const centerRadius = block ? block.radius : tier.ringRadius;
                const count = block ? block.count : tier.segmentCount;
                const span = C_BLOCKS ? 2 * Math.asin(6.8 / (centerRadius - tier.ringThickness / 2)) : SECTOR.span;
                const originalRadius = { low: 18.5, mid: 27.5, high: 37.5, sealed: 45.2 };
                // 保留 A/B 的每段矿格数与资源总量，只压缩空间宽度；不靠 watchdog 补钱。
                const arcLength = C_BLOCKS ? (Math.PI / 2 * originalRadius[tierId] / tier.segmentCount * count) : SECTOR.span * tier.ringRadius;
                const perSegment = Math.max(4, Math.round(arcLength / count / tier.cellArc)) + (C_BLOCKS && tierId === "mid" ? 4 : 0);
                const arcCells = perSegment * count;

                const ring = {
                    tierId,
                    tier,
                    arcCells,
                    perSegment,
                    radialCells: radial,
                    rows,
                    // 只有底下这几层挡人，上面那几层是纯造型。
                    //
                    // 原来还兼着「洞顶」：按格挖的年代通道顶上会剩一排没挖到的矿。改成整列挖
                    // 之后不会了——一根柱子是从地面到顶一起消失的，缺口齐地齐顶（见 mineOre）。
                    // 这一项现在只剩碰撞这一个作用：巨龙那套按格崩塌（eruptOreChunks）
                    // 打掉上层时，墙不该因此就能走过去。
                    groundLayers: Math.max(1, Math.ceil(rows / 2)),
                    angleStart: C_BLOCKS ? SECTOR.center - span / 2 : SECTOR.start,
                    nodeOffset: block ? block.offset : 0,
                    cellAngle: span / arcCells,
                    cellDepth: tier.ringThickness / radial,
                    cellHeight: tier.ringHeight / rows,
                    innerRadius: centerRadius - tier.ringThickness / 2,
                    outerRadius: centerRadius + tier.ringThickness / 2,
                    centerRadius,
                    columns: [],
                    total: 0,
                    remaining: 0
                };
                ring.columns.length = arcCells * radial;
                ring.maxCellSpan = Math.max(ring.outerRadius * ring.cellAngle, ring.cellDepth);
                oreRings.push(ring);

                for (let index = 0; index < count; index++) createOreNode(ring, index + ring.nodeOffset);
                return ring;
            }

            function createOreNode(ring, index) {
                const tier = ring.tier;
                const tierId = ring.tierId;
                const rand = seededRandom(1013 + index * 137 + TIER_ORDER.indexOf(tierId) * 911);
                const arcStart = (index - ring.nodeOffset) * ring.perSegment;
                const angleStart = ring.angleStart + arcStart * ring.cellAngle;
                const angleCenter = angleStart + (ring.perSegment * ring.cellAngle) / 2;
                const cosCenter = Math.cos(angleCenter);
                const sinCenter = Math.sin(angleCenter);
                const position = new THREE.Vector3(cosCenter * ring.centerRadius, 0, sinCenter * ring.centerRadius);

                const group = new THREE.Group();
                group.position.copy(position);
                group.rotation.y = -angleCenter + Math.PI / 2;
                scene.add(group);

                // group 局部系：+X 沿切向、+Z 沿径向向外。手算比等 matrixWorld 刷新更可靠。
                const toLocalX = (wx, wz) => (wx - position.x) * sinCenter - (wz - position.z) * cosCenter;
                const toLocalZ = (wx, wz) => (wx - position.x) * cosCenter + (wz - position.z) * sinCenter;

                const cells = [];
                const columns = [];
                for (let a = 0; a < ring.perSegment; a++) {
                    const ai = arcStart + a;
                    const angle = ring.angleStart + (ai + 0.5) * ring.cellAngle;
                    const cosA = Math.cos(angle);
                    const sinA = Math.sin(angle);
                    // 顶面沿扇形连绵起伏、且外圈比内圈高，站在城里看就是一道向外抬升的矿脊。
                    const crest = Math.sin(ai * 0.62 + index) * 0.55 + Math.sin(ai * 0.19 + 1.7) * 0.45;
                    for (let ri = 0; ri < ring.radialCells; ri++) {
                        const radius = ring.innerRadius + (ri + 0.5) * ring.cellDepth;
                        const arcWidth = radius * ring.cellAngle;
                        const column = {
                            ai,
                            ri,
                            x: cosA * radius,
                            z: sinA * radius,
                            cosA,
                            sinA,
                            halfArc: arcWidth / 2,
                            halfDepth: ring.cellDepth / 2,
                            count: 0,
                            blockCount: 0,
                            cells: [],
                            node: null,
                            ring
                        };
                        const topChance = 0.18 + ((ri + 0.5) / ring.radialCells) * 0.72 + crest * 0.26;
                        for (let y = 0; y < ring.rows; y++) {
                            if (y === ring.rows - 1 && rand() > topChance) continue;
                            const worldY = ring.cellHeight * (y + 0.5);
                            const cell = {
                                x: toLocalX(column.x, column.z),
                                y: worldY,
                                z: toLocalZ(column.x, column.z),
                                wx: column.x,
                                wy: worldY,
                                wz: column.z,
                                width: arcWidth,
                                yaw: angleCenter - angle,
                                blocking: y < ring.groundLayers,
                                column,
                                removed: false
                            };
                            column.cells.push(cells.length);
                            column.count += 1;
                            if (cell.blocking) column.blockCount += 1;
                            cells.push(cell);
                        }
                        columns.push(column);
                        ring.columns[ai * ring.radialCells + ri] = column;
                        ring.total += column.count;
                        ring.remaining += column.count;
                    }
                }

                const instanced = new THREE.InstancedMesh(shared.box, shared.oreMaterials[tierId], cells.length);
                instanced.castShadow = true;
                instanced.receiveShadow = false;
                // InstancedMesh 的包围球只按共享的单位立方体算，而一段矿墙横跨十几米。
                // 不关掉视锥剔除，段中心一出画面整段墙就会整体消失，圆环看着就是断的。
                instanced.frustumCulled = false;
                // 矿体和内部野怪都是透明材质，原点又几乎重合，排序会逐帧抖动。
                // 显式指定绘制顺序，保证矿体永远叠在内容物之上。
                instanced.renderOrder = 2;
                instanced.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
                const matrix = new THREE.Matrix4();
                const quaternion = new THREE.Quaternion();
                const axis = new THREE.Vector3(0, 1, 0);
                const scaleVector = new THREE.Vector3();
                const offset = new THREE.Vector3();
                cells.forEach((cell, cellIndex) => {
                    // 抖动压到很小、格子放大一点补偿，才不会在墙面上抖出能看穿的缝。
                    quaternion.setFromAxisAngle(axis, cell.yaw + (rand() - 0.5) * 0.06);
                    scaleVector.set(cell.width * 1.04, ring.cellHeight * 1.04, ring.cellDepth * 1.04);
                    matrix.compose(offset.set(cell.x, cell.y, cell.z), quaternion, scaleVector);
                    instanced.setMatrixAt(cellIndex, matrix);
                });
                instanced.instanceMatrix.needsUpdate = true;
                group.add(instanced);

                const node = {
                    id: `${tierId}-${index}`,
                    tierId,
                    tier,
                    ring,
                    group,
                    instanced,
                    cells,
                    columns,
                    arcStart,
                    arcEnd: arcStart + ring.perSegment,
                    angleStart,
                    angleCenter,
                    angleEnd: angleStart + ring.perSegment * ring.cellAngle,
                    total: cells.length,
                    remaining: cells.length,
                    position: position.clone(),
                    cellSize: new THREE.Vector3(ring.centerRadius * ring.cellAngle, ring.cellHeight, ring.cellDepth),
                    coinsReleased: 0,
                    penetration: 0,
                    breached: false,
                    cleared: false,
                    monsterRevealed: false,
                    surfaceCoins: [],
                    shards: [],
                    zeroMatrix: new THREE.Matrix4().makeScale(0, 0, 0)
                };
                for (const column of columns) column.node = node;
                group.userData = { type: "ore", node, alive: true };

                // 金币埋进矿体内部，靠半透明矿石透出来，形成「这里有货」的直观信号。
                // 挂在 group 下随矿体一起转，位置直接取真实体素，保证一定嵌在石头里而不是浮在空中。
                // 封印矿里一枚都不埋：凿不开的墙里还闪着金币，等于挂一份领不到的赏金，
                // 玩家会一直砸下去，而每一下的回应都只是弹开。
                const coinCount = tier.sealed ? 0 : Math.max(4, Math.round(cells.length / 26));
                for (let i = 0; i < coinCount; i++) {
                    const cell = cells[Math.floor(rand() * cells.length)];
                    if (!cell) break;
                    const coin = new THREE.Mesh(shared.coin, shared.oreCoinMat);
                    coin.scale.setScalar(1.25);
                    coin.position.set(cell.x, Math.max(ring.cellHeight * 0.6, cell.y), cell.z);
                    coin.rotation.set(Math.PI / 2, 0, rand() * Math.PI);
                    coin.renderOrder = HIDE_GUARDS ? 4 : 1;
                    group.add(coin);
                    // 记在所属体素上：凿掉这一格时这枚金币就地掉出来，而不是按整段进度凭空消失。
                    (cell.coins || (cell.coins = [])).push(coin);
                    node.surfaceCoins.push(coin);
                }

                embedShards(node, cells, group, rand, index);

                // 守卫冻在矿墙正中：半透明矿石会透出剪影，凿穿通道的瞬间它正好堵在路口。
                // 封印矿这一层空着——它封的是巨龙，那道剪影由终局演出自己放进去，
                // 而且这层永远不会被凿穿，守卫立在里面也没有出场的那一刻。
                if (!tier.sealed) {
                    node.monster = createOreMonster(tierId, position.clone(), node);
                    node.monster.traverse(child => { if (child.isMesh) child.renderOrder = 1; });
                    setMonsterSilhouette(node.monster, 0);
                }
                oreNodes.push(node);
                return node;
            }

            // 场上所有还埋着的宝石，只为了每帧转一下。转是必要的：矿体是半透明的，
            // 静止的宝石隔着墙看只是一小块偏色，转起来棱面才会一闪一闪地扫过去，

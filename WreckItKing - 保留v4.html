<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Wreck It King - 冰龙觉醒</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #090712;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; }
        .nipple .back { opacity: 0.22 !important; }
        .nipple .front { opacity: 0.58 !important; }
        #ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 12000;
        }
        #player-hud {
            position: absolute;
            top: max(14px, env(safe-area-inset-top));
            left: 14px;
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 7px 12px 7px 7px;
            color: white;
            background: rgba(8, 7, 18, 0.72);
            border: 1px solid rgba(115, 210, 255, 0.55);
            border-radius: 34px 12px 12px 34px;
            backdrop-filter: blur(5px);
        }
        #portrait {
            position: relative;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 3px solid #63d7ff;
            background: radial-gradient(circle at 50% 35%, #65c9ff 0 20%, #152e72 22% 52%, #07122f 54%);
            box-shadow: 0 0 14px rgba(64, 201, 255, 0.7);
        }
        #portrait::after {
            content: "";
            position: absolute;
            left: 11px;
            right: 11px;
            bottom: 5px;
            height: 19px;
            border-radius: 50% 50% 35% 35%;
            background: #1e6fa0;
        }
        #hud-info { min-width: 92px; }
        #power {
            font-size: 23px;
            line-height: 25px;
            font-weight: 900;
            text-shadow: 0 0 10px #7bdfff;
        }
        #power-label {
            font-size: 10px;
            letter-spacing: 2px;
            color: #98cbe1;
        }
        #hp-track {
            width: 96px;
            height: 6px;
            margin-top: 4px;
            border-radius: 5px;
            overflow: hidden;
            background: rgba(255,255,255,0.18);
        }
        #hp-fill {
            width: 100%;
            height: 100%;
            background: #58e486;
            transition: width 0.2s;
        }
        #coin-hud {
            position: fixed;
            top: max(19px, env(safe-area-inset-top));
            right: 14px;
            width: 112px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
            padding: 0 14px;
            color: white;
            font-size: 25px;
            font-weight: 900;
            background: rgba(8, 7, 18, 0.78);
            border: 1px solid rgba(255, 197, 50, 0.4);
            border-radius: 22px 8px 8px 22px;
        }
        .coin-icon {
            width: 27px;
            height: 27px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #a35d00;
            font-size: 17px;
            background: #ffd339;
            border: 3px solid #ffed8a;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 196, 0, 0.7);
        }
        #boss-hud {
            position: absolute;
            top: max(84px, calc(env(safe-area-inset-top) + 84px));
            left: 50%;
            width: min(82vw, 520px);
            transform: translateX(-50%);
            display: none;
            text-align: center;
            color: white;
            text-shadow: 0 2px 4px black;
        }
        #boss-name { font-family: Georgia, serif; font-size: 24px; font-weight: 900; }
        #boss-title { margin: 2px 0 5px; font-size: 11px; color: #d6c9e4; }
        #boss-level { position: absolute; left: 0; bottom: 10px; font-weight: 900; }
        #boss-bar {
            position: relative;
            height: 17px;
            margin-left: 52px;
            overflow: hidden;
            background: #1a111c;
            border: 2px solid rgba(255,255,255,0.65);
            border-radius: 10px;
        }
        #boss-fill {
            width: 100%;
            height: 100%;
            background: #d91d35;
            transition: width 0.15s;
        }
        #boss-hp-text {
            position: absolute;
            inset: -1px 0 0 52px;
            font-size: 11px;
            line-height: 17px;
            font-weight: 900;
        }
        #tutorial {
            position: absolute;
            left: 50%;
            bottom: max(28px, calc(env(safe-area-inset-bottom) + 28px));
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: white;
            font-weight: 800;
            text-shadow: 0 2px 6px black;
            transition: opacity 0.35s;
        }
        #tutorial-ring {
            position: relative;
            width: 104px;
            height: 104px;
            border: 2px dashed rgba(255,255,255,0.7);
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
        }
        #tutorial-hand {
            position: absolute;
            left: 38px;
            top: 32px;
            width: 28px;
            height: 38px;
            border-radius: 15px 15px 8px 8px;
            background: white;
            transform-origin: center bottom;
            animation: drag-forward 1.45s ease-in-out infinite;
        }
        #tutorial-hand::before {
            content: "";
            position: absolute;
            left: 9px;
            top: -19px;
            width: 11px;
            height: 27px;
            border-radius: 8px;
            background: white;
        }
        #tutorial-copy {
            white-space: nowrap;
            font-size: 16px;
        }
        @keyframes drag-forward {
            0% { transform: translate(0, 20px) rotate(-5deg); opacity: 0.45; }
            22% { opacity: 1; }
            68% { transform: translate(0, -25px) rotate(2deg); opacity: 1; }
            86%, 100% { transform: translate(0, -31px) rotate(2deg); opacity: 0; }
        }
        #restart {
            position: absolute;
            right: 14px;
            bottom: max(14px, calc(env(safe-area-inset-bottom) + 14px));
            z-index: 12001;
            pointer-events: auto;
            padding: 8px 11px;
            color: rgba(255,255,255,0.82);
            background: rgba(8,7,18,0.62);
            border: 1px solid rgba(255,255,255,0.24);
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }
        #toast {
            position: absolute;
            left: 50%;
            top: 24%;
            transform: translate(-50%, -50%) scale(0.85);
            padding: 11px 20px;
            color: white;
            font-size: 21px;
            font-weight: 900;
            text-align: center;
            text-shadow: 0 2px 5px #000;
            background: rgba(16, 9, 35, 0.82);
            border: 2px solid #9a69ff;
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
        }
        #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        #labels {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }
        #guide-arrow {
            position: absolute;
            width: 42px;
            height: 42px;
            display: none;
            align-items: center;
            justify-content: center;
            color: #ffe36c;
            font-size: 31px;
            font-weight: 900;
            text-shadow: 0 0 9px #ff9d00, 0 2px 4px #000;
            transform: translate(-50%, -50%);
            transition: left 0.1s linear, top 0.1s linear;
        }
        .world-label {
            position: absolute;
            transform: translate(-50%, -100%);
            min-width: 116px;
            padding: 7px 10px;
            color: white;
            font-weight: 900;
            text-align: center;
            text-shadow: 0 2px 3px #000;
            background: rgba(9, 8, 20, 0.82);
            border: 2px solid #ffd749;
            border-radius: 10px;
            transition: border-color 0.2s, background 0.2s;
        }
        .world-label.ready {
            background: rgba(24, 104, 50, 0.88);
            border-color: #65ff91;
            box-shadow: 0 0 16px rgba(82,255,125,0.55);
        }
        .world-label .zone-name { font-size: 13px; }
        .world-label .zone-cost { margin-top: 3px; color: #ffe56e; font-size: 19px; }
        #damage-layer {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }
        .damage {
            position: absolute;
            color: white;
            font-size: 23px;
            font-weight: 900;
            text-shadow: -2px -2px 0 #221526, 2px -2px 0 #221526, -2px 2px 0 #221526, 2px 2px 0 #221526;
            animation: floatDamage 0.8s ease-out forwards;
        }
        .damage.big { color: #86eaff; font-size: 29px; }
        @keyframes floatDamage {
            from { opacity: 1; transform: translate(-50%, -50%) scale(0.75); }
            25% { transform: translate(-50%, -80%) scale(1.16); }
            to { opacity: 0; transform: translate(-50%, -165%) scale(0.92); }
        }
        #end-screen {
            position: fixed;
            inset: 0;
            z-index: 20000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px;
            color: white;
            text-align: center;
            background: rgba(9, 5, 20, 0.94);
            pointer-events: none;
        }
        #end-screen.show {
            display: flex;
            pointer-events: auto;
            animation: fadeIn 0.45s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        #brand {
            color: #ffd56a;
            font-family: Georgia, serif;
            font-size: clamp(38px, 10vw, 64px);
            line-height: 0.95;
            font-weight: 900;
            text-shadow: 0 0 22px rgba(255, 166, 36, 0.65);
        }
        #end-title { margin: 22px 0 8px; font-size: 27px; font-weight: 900; }
        #end-copy { max-width: 420px; margin: 0 0 24px; color: #d8cced; line-height: 1.6; }
        .end-button {
            width: min(82vw, 330px);
            margin: 6px;
            padding: 15px;
            color: #211400;
            font-size: 19px;
            font-weight: 900;
            background: #ffd351;
            border: 0;
            border-radius: 9px;
            cursor: pointer;
            pointer-events: auto;
            position: relative;
            z-index: 20001;
            touch-action: manipulation;
        }
        .end-button.secondary {
            color: white;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.4);
        }
        #egg-lock {
            position: absolute;
            width: 74px;
            height: 74px;
            display: none;
            transform: translate(-50%, -118%);
            pointer-events: none;
            z-index: 12;
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.72));
        }
        #egg-lock.show { display: block; }
        #egg-lock.charging { transform: translate(-50%, -118%) scale(1.06); }
        #egg-lock svg { display: block; width: 100%; height: 100%; }
        #egg-lock .egg-lock-track {
            fill: none;
            stroke: rgba(255, 255, 255, 0.28);
            stroke-width: 5;
        }
        #egg-lock .egg-lock-bar {
            fill: none;
            stroke: #ffe36c;
            stroke-width: 5;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 36px 36px;
            stroke-dasharray: 175.93;
            stroke-dashoffset: 175.93;
        }
        #egg-lock .egg-lock-core {
            fill: rgba(16, 10, 28, 0.88);
            stroke: #f2d36a;
            stroke-width: 2;
        }
        #egg-lock .egg-lock-icon { fill: #ffe9a0; }
        @media (max-width: 440px) {
            #player-hud { transform: scale(0.88); transform-origin: left top; }
            #coin-hud { width: 100px; }
            #boss-hud { top: 76px; }
            #boss-name { font-size: 20px; }
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.9.0/nipplejs.min.js"></script>
</head>
<body>
    <div id="ui">
        <div id="player-hud">
            <div id="portrait"></div>
            <div id="hud-info">
                <div id="power">1,241</div>
                <div id="power-label">POWER</div>
                <div id="hp-track"><div id="hp-fill"></div></div>
            </div>
        </div>
        <div id="coin-hud"><span class="coin-icon">$</span><span id="coin-count">0</span></div>
        <div id="boss-hud">
            <div id="boss-name">Cyclopean Beast</div>
            <div id="boss-title">Imprisoned Lord of Fire</div>

        </div>
        <div id="toast"></div>

                <circle class="egg-lock-core" cx="36" cy="36" r="18"></circle>
                <path class="egg-lock-icon" transform="translate(20.5 20) scale(1.3)" d="M23 5.5V20c0 2.2-1.8 4-4 4h-7.3c-1.08 0-2.1-.44-2.83-1.2L1 14.83s1.26-1.23 1.3-1.25c.22-.19.49-.29.79-.29.22 0 .42.06.6.16.04.01 4.31 2.46 4.31 2.46V4c0-.83.67-1.5 1.5-1.5S11 3.17 11 4v7h1V1.5C12 .67 12.67 0 13.5 0S15 .67 15 1.5V11h1V2.5c0-.83.67-1.5 1.5-1.5S19 1.67 19 2.5V11h1V5.5c0-.83.67-1.5 1.5-1.5S23 4.67 23 5.5z"></path>

        <button id="restart">重新开始</button>

    <div id="end-screen">
        <div id="brand">CALL OF<br>DRAGONS</div>
        <div id="end-title">冰龙已经觉醒</div>
        <p id="end-copy">统领魔幻生物，建设你的领地，征服更强大的敌人。</p>
        <button id="download" class="end-button">立即下载</button>
        <button id="replay" class="end-button secondary">再玩一次</button>
    </div>

    <script>
        (() => {
            "use strict";

            const CONFIG = {
                playerSpeed: 8.8,
                playerAcceleration: 10.5,
                playerDeceleration: 15,
                playerRadius: 0.62,
                playerClearance: 3.15,
                attackRange: 4.2,
                mineRange: 1.35,
                attackCooldown: 0.62,
                upgradedCooldown: 0.5,
                campCost: 10,
                weaponCost: 10,
                expandCost: 10,
                dragonCost: 25,
                endUpgradeCost: 25,
                endTeaseCoins: 2,
                ctaCampFallback: 8,
                eggPickupDuration: 1,
                eggPlaceDuration: 1.35,
                eggPickupRange: 1.7,
                openingGuideForwardDistance: 1.05,
                openingGuideIdleDelay: 2,
                openingGuideMoveEpsilon: 0.018,
                openingGuidePulseSpeed: 3.2,
                openingGuidePulseAmount: 0.16,
                zoneTileSize: 3.2,
                zonePulseSpeed: 3.4,
                zonePaymentInterval: 0.07,
                campRiseDuration: 0.46,
                campSinkDuration: 0.24,
                campSideStagger: 0.045,
                campRiseDepth: 1.1,
                campGridDuration: 0.62,
                campPulseDuration: 0.48,
                bossDisplayHp: 300300,
                bossInternalHp: 12000,
                bossShieldHits: 4,
                bossHitCoinDrop: 3,
                worldMinX: -12,
                worldMaxX: 12,
                worldMinZ: -31,
                worldMaxZ: 20
            };

            const PHASE = {
                WAITING: "waiting",
                START_COINS: "start_coins",
                BUILD_CAMP: "build_camp",
                MINE_GOLEM: "mine_golem",
                FIRST_GOLEM: "first_golem",
                WEAPON: "weapon",
                MINE_STRONG: "mine_strong",
                STRONG_GOLEM: "strong_golem",
                EXPAND: "expand",
                MINE_BOSS: "mine_boss",
                BOSS_PRESSURE: "boss_pressure",
                HATCH: "hatch",
                BOSS_FINAL: "boss_final",
                REWARD: "reward",
                COMPLETE: "complete"
            };

            let scene, camera, renderer, clock;
            let player, playerVisual, playerWeapon, playerRing, playerCape, dragon, boss;
            let playerLeftLeg, playerRightLeg, playerLeftArm, playerRightArm;
            let coinBack, eggPickup, eggPlace;
            let phase = PHASE.WAITING;
            let coins = 0;
            let playerHp = 100;
            let power = 1241;
            let weaponLevel = 1;
            let attackTimer = 0;
            let dragonAttackTimer = 0;
            let bossAttackTimer = 1.8;
            let bossThresholdTriggered = false;
            let carryingEgg = false;
            let firstInput = false;
            let endScheduled = false;
            let futureZonesShown = false;
            let ctaOpen = false;
            let campReturnTimer = 0;
            let joystick = null;
            let cameraShake = 0;
            let cameraMinePunch = 0;
            let audioCtx = null;
            let attackSequence = 0;
            let attackLunge = 0;
            const moveVelocity = new THREE.Vector3();
            const cameraFocus = new THREE.Vector3();
            const openingGuide = {
                complete: false,
                visible: true,
                started: false,
                idle: 0,
                startZ: 16,
                lastPosition: new THREE.Vector3(),
                baseEmissiveIntensity: 0.78
            };

            const keys = { w: false, a: false, s: false, d: false };
            const stick = { x: 0, z: 0, magnitude: 0 };
            const enemies = [];
            const targets = [];
            const coinDrops = [];
            const lockedCoins = [];
            const projectiles = [];
            const hazards = [];
            const effects = [];
            const zones = [];
            const campColliders = [];
            const mineColliders = [];
            const mineGates = {};
            const camp = {
                stage: 0,
                group: null,
                ghost: null,
                egg: null,
                platform: null,
                heldEgg: null,
                nestPos: null,
                prepared: false,
                sizes: {},
                floors: {},
                grids: {},
                perimeters: {},
                props: {},
                pulse: null,
                weaponDisplay: null,
                nestGuide: null,
                nestGuideRing: null,
                nestGuideEgg: null
            };

            const ui = {
                coin: document.getElementById("coin-count"),
                power: document.getElementById("power"),
                hp: document.getElementById("hp-fill"),
                boss: document.getElementById("boss-hud"),
                bossFill: document.getElementById("boss-fill"),
                bossText: document.getElementById("boss-hp-text"),
                tutorial: document.getElementById("tutorial"),
                toast: document.getElementById("toast"),
                labels: document.getElementById("labels"),
                guide: document.getElementById("guide-arrow"),
                eggLock: document.getElementById("egg-lock"),
                eggLockBar: document.querySelector("#egg-lock .egg-lock-bar"),
                end: document.getElementById("end-screen")
            };

            const shared = {};

            function init() {
                scene = new THREE.Scene();
                scene.background = new THREE.Color(0x0d0918);
                scene.fog = new THREE.FogExp2(0x0d0918, 0.021);

                camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 300);
                camera.position.set(0, 25.5, 34.5);

                renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
                renderer.setSize(innerWidth, innerHeight);
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                renderer.outputEncoding = THREE.sRGBEncoding;
                document.body.insertBefore(renderer.domElement, document.body.firstChild);

                clock = new THREE.Clock();
                createSharedAssets();
                createLights();
                createDungeon();
                createPlayer();
                createCampGhost();
                createLinearMineGates();
                prewarmMineGates();
                setupInput();
                updateUI();
                animate();
            }

            function createSharedAssets() {
                shared.box = new THREE.BoxGeometry(1, 1, 1);
                shared.sphere = new THREE.SphereGeometry(1, 10, 8);
                shared.rock = new THREE.DodecahedronGeometry(1, 0);
                shared.spark = new THREE.SphereGeometry(0.1, 6, 4);
                shared.sparkMaterials = new Map();
                for (const color of [0xc95cff, 0x71ddff, 0xffda4c, 0x8c5b9e, 0x9b5eac, 0xffdc65, 0xff3b2e, 0xc975ee]) {
                    shared.sparkMaterials.set(color, new THREE.MeshBasicMaterial({ color }));
                }
                shared.sparkPool = [];
                for (let i = 0; i < 96; i++) {
                    const spark = new THREE.Mesh(shared.spark, shared.sparkMaterials.get(0xffda4c));
                    spark.visible = false;
                    scene.add(spark);
                    shared.sparkPool.push(spark);
                }
                shared.coin = new THREE.CylinderGeometry(0.34, 0.34, 0.1, 16);
                shared.coinProjection = new THREE.CircleGeometry(0.34, 18);
                shared.coinMat = new THREE.MeshStandardMaterial({
                    color: 0xffc928, metalness: 0.72, roughness: 0.24, emissive: 0x5c2a00
                });
                shared.lockedCoinMat = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    map: createCoinProjectionTexture(),
                    transparent: true,
                    opacity: 0.96,
                    depthTest: false,
                    depthWrite: false
                });
                shared.mineDustTexture = createMineDustTexture();
                shared.stoneMat = new THREE.MeshStandardMaterial({ color: 0x39343e, roughness: 0.92 });
                shared.wallMat = new THREE.MeshStandardMaterial({ color: 0x625b68, roughness: 0.9 });
                shared.campFloorMat = new THREE.MeshStandardMaterial({ color: 0x716d72, roughness: 0.9 });
                shared.upgradedWeaponMat = new THREE.MeshStandardMaterial({
                    color: 0xbef7ff, emissive: 0x2a93c7, metalness: 0.2
                });
                shared.crystalMat = new THREE.MeshStandardMaterial({
                    color: 0x672694, emissive: 0x24053e, roughness: 0.28, metalness: 0.08
                });
                shared.crystalGlowMat = new THREE.MeshStandardMaterial({
                    color: 0xbd54e8, emissive: 0x5c0b83, roughness: 0.2
                });
                shared.mineMassMat = new THREE.MeshPhysicalMaterial({
                    color: 0x61268b,
                    emissive: 0x200532,
                    emissiveIntensity: 0.85,
                    roughness: 0.24,
                    metalness: 0.05,
                    clearcoat: 0.82,
                    clearcoatRoughness: 0.2,
                    transparent: true,
                    opacity: 0.96,
                    depthWrite: true,
                    side: THREE.DoubleSide
                });
                shared.mineSilhouetteMat = new THREE.MeshBasicMaterial({
                    color: 0x211326,
                    transparent: true,
                    opacity: 0.46,
                    depthTest: false,
                    depthWrite: false
                });
                shared.redMat = new THREE.MeshBasicMaterial({
                    color: 0xff2b30, transparent: true, opacity: 0.33, side: THREE.DoubleSide
                });

            function createCoinProjectionTexture() {

            function seededRandom(seed) {

            function createMineBlobMesh(scale, material, seed) {
                const geometry = new THREE.SphereGeometry(1, 24, 16);
                const positions = geometry.attributes.position;
                for (let i = 0; i < positions.count; i++) {
                    const x = positions.getX(i);
                    const y = positions.getY(i);
                    const z = positions.getZ(i);
                    const phase = seed * 0.017;
                    const broad = Math.sin(x * 2.7 + phase) * Math.cos(y * 2.1 - phase * 0.7);
                    const detail = Math.sin((x + z) * 5.2 + phase * 1.3) * 0.35;
                    const variation = 1 + (broad + detail) * 0.045;
                    positions.setXYZ(i, x * variation, y * variation, z * variation);
                }
                positions.needsUpdate = true;
                geometry.computeVertexNormals();
                const mesh = new THREE.Mesh(geometry, material);
                mesh.scale.copy(scale);
                mesh.castShadow = false;
                mesh.receiveShadow = true;
                return mesh;
            }

            function createRoundedRectShape(width, height, radius) {
                const x = -width / 2;
                const y = -height / 2;
                const r = Math.min(radius, width * 0.24, height * 0.24);
                const shape = new THREE.Shape();
                shape.moveTo(x + r, y);
                shape.lineTo(x + width - r, y);
                shape.quadraticCurveTo(x + width, y, x + width, y + r);
                shape.lineTo(x + width, y + height - r);
                shape.quadraticCurveTo(x + width, y + height, x + width - r, y + height);
                shape.lineTo(x + r, y + height);
                shape.quadraticCurveTo(x, y + height, x, y + height - r);
                shape.lineTo(x, y + r);
                shape.quadraticCurveTo(x, y, x + r, y);
                return shape;
            }

            function createBeveledSlabMesh(width, height, depth, radius, material) {
                const geometry = new THREE.ExtrudeGeometry(

                        bevelEnabled: true,
                        bevelSegments: 3,
                        bevelSize: Math.min(0.28, radius * 0.38),
                        bevelThickness: Math.min(0.24, depth * 0.16),
                        curveSegments: 5

            function createOreMassMesh(width, height, depth, radius, material, seed, detail = 1) {
                const geometry = new THREE.BoxGeometry(
                    width,
                    height,
                    depth,
                    detail > 1 ? 10 : 3,
                    detail > 1 ? 7 : 2,
                    detail > 1 ? 5 : 2
                );
                const positions = geometry.attributes.position;
                const halfX = width * 0.5;
                const halfY = height * 0.5;
                const halfZ = depth * 0.5;
                const r = Math.min(radius, halfX * 0.45, halfY * 0.45, halfZ * 0.45);
                const phase = seed * 0.071;
                for (let i = 0; i < positions.count; i++) {
                    const x = positions.getX(i);
                    const y = positions.getY(i);
                    const z = positions.getZ(i);
                    const innerX = THREE.MathUtils.clamp(x, -halfX + r, halfX - r);
                    const innerY = THREE.MathUtils.clamp(y, -halfY + r, halfY - r);
                    const innerZ = THREE.MathUtils.clamp(z, -halfZ + r, halfZ - r);
                    const delta = new THREE.Vector3(x - innerX, y - innerY, z - innerZ);
                    if (delta.lengthSq() > 0.00001) delta.normalize().multiplyScalar(r);
                    let px = innerX + delta.x;
                    let py = innerY + delta.y;
                    let pz = innerZ + delta.z;
                    const broad = Math.sin(px * 0.72 + phase) * Math.cos(py * 0.86 - phase * 0.6);
                    const shoulder = Math.sin((px + py) * 1.18 + phase * 1.4);
                    const amount = detail > 1 ? 0.055 : 0.035;
                    px += broad * width * amount * 0.28;
                    py += shoulder * height * amount * 0.22;
                    pz += (broad + shoulder * 0.35) * depth * amount;
                    positions.setXYZ(i, px, py, pz);
                }
                positions.needsUpdate = true;
                geometry.computeVertexNormals();
                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            function createOreCurtainSurface(width, height, depth, material, seed) {
                const geometry = new THREE.PlaneGeometry(width, height, 18, 12);
                const positions = geometry.attributes.position;
                const phase = seed * 0.031;
                for (let i = 0; i < positions.count; i++) {
                    const x = positions.getX(i);
                    const y = positions.getY(i);
                    const nx = x / width;
                    const ny = y / height;
                    const broad = Math.sin(nx * 10.5 + phase) * 0.5 +
                        Math.cos(ny * 9.2 - phase * 0.7) * 0.28;
                    const ridge = Math.sin((nx + ny * 0.42) * 18 + phase * 1.8) * 0.16;
                    const edgeSoftening = Math.max(0.22, 1 - Math.pow(Math.abs(nx) * 1.7, 4));
                    positions.setZ(i, depth * (0.5 + (broad + ridge) * 0.11 * edgeSoftening));
                }
                positions.needsUpdate = true;
                geometry.computeVertexNormals();
                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            function createMineFragmentMesh(width, height, depth, material, seed) {
                const geometry = new THREE.DodecahedronGeometry(0.72, 0);
                const positions = geometry.attributes.position;
                const rand = seededRandom(seed);
                for (let i = 0; i < positions.count; i++) {
                    const variation = 0.82 + rand() * 0.34;
                    positions.setXYZ(
                        i,
                        positions.getX(i) * variation,
                        positions.getY(i) * (0.86 + rand() * 0.28),
                        positions.getZ(i) * (0.78 + rand() * 0.38)
                    );
                }
                positions.needsUpdate = true;
                geometry.computeVertexNormals();
                const mesh = new THREE.Mesh(geometry, material);
                mesh.scale.set(width * 0.63, height * 0.63, depth * 0.63);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                return mesh;
            }

            function paintMineSilhouette(context, canvas, seed) {
                const rand = seededRandom(seed + 193);
                context.fillStyle = "#000000";
                context.fillRect(0, 0, canvas.width, canvas.height);
                const top = [];
                const bottom = [];
                const samples = 12;
                for (let i = 0; i <= samples; i++) {
                    const x = i / samples * canvas.width;
                    const edge = Math.min(i, samples - i);
                    top.push({
                        x,
                        y: 16 + rand() * 24 + Math.sin(i * 1.71 + seed) * 9 + (edge < 2 ? 27 - edge * 12 : 0)
                    });
                    bottom.push({
                        x,
                        y: canvas.height - 10 - rand() * 13 - Math.sin(i * 1.19 + seed * 0.7) * 5 +
                            (edge < 2 ? -18 + edge * 8 : 0)
                    });
                }
                context.fillStyle = "#ffffff";
                context.beginPath();
                context.moveTo(top[0].x, top[0].y);
                for (let i = 1; i < top.length; i++) context.lineTo(top[i].x, top[i].y);
                for (let i = bottom.length - 1; i >= 0; i--) context.lineTo(bottom[i].x, bottom[i].y);
                context.closePath();
                context.fill();
            }

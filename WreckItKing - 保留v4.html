            function createMineGate(id, z, drop, active, onDeath) {
                const group = new THREE.Group();
                const isFirstMine = id === "mine-start";
                const width = isFirstMine ? corridorHalfWidth(z) * 2 + 1.0 : 20;
                const height = isFirstMine ? 6.2 : 11.5;
                const depth = isFirstMine
                    ? 3.6
                    : id === "mine-golem"
                        ? 8
                        : id === "mine-strong"
                            ? 10
                            : 10.5;
                const centerZ = isFirstMine
                    ? z
                    : id === "mine-golem"
                        ? -4.8
                        : id === "mine-strong"
                            ? -13.8
                            : -24.05;
                const gateMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0x582078,
                    emissive: 0x21052f,
                    emissiveIntensity: 0.78,
                    roughness: 0.3,
                    metalness: 0.04,
                    clearcoat: 0.72,
                    clearcoatRoughness: 0.24,
                    transparent: false,
                    opacity: 1,
                    depthWrite: true,
                    side: THREE.FrontSide
                });
                const seed = Math.floor((z + 40) * 173);
                const gateGlow = new THREE.PointLight(0x9d3bc4, active ? 0.68 : 0, 10);
                gateGlow.position.set(0, height * 0.56, depth * 1.15);
                group.add(gateGlow);

                const chunkMaterial = gateMaterial.clone();
                const shellParts = [];
                const columns = isFirstMine ? 8 : 10;
                const rows = isFirstMine ? 5 : 6;
                const layers = isFirstMine ? 3 : 4;
                const cellWidth = width / columns;
                const cellHeight = height / rows;
                const cellDepth = depth / layers;
                for (let layer = 0; layer < layers; layer++) {
                    for (let row = 0; row < rows; row++) {
                        for (let column = 0; column < columns; column++) {
                            const part = new THREE.Mesh(shared.box, gateMaterial);
                            part.scale.set(cellWidth * 1.003, cellHeight * 1.003, cellDepth * 1.003);
                            part.position.set(
                                -width * 0.5 + (column + 0.5) * cellWidth,
                                (row + 0.5) * cellHeight,
                                depth * 0.5 - (layer + 0.5) * cellDepth
                            );
                            part.castShadow = layer === 0;
                            part.receiveShadow = true;
                            part.userData.column = column;
                            part.userData.row = row;
                            part.userData.layer = layer;
                            part.userData.removed = false;
                            part.userData.seed = seed + layer * 101 + row * 31 + column * 13;
                            group.add(part);
                            shellParts.push(part);
                        }
                    }
                }
                group.position.set(0, 0, centerZ);
                group.visible = true;
                group.userData = {
                    id,
                    type: "mine",
                    alive: true,
                    stationary: true,
                    attackable: true,
                    locked: !active,
                    lockedHits: 0,
                    drop,
                    gateMaterial,
                    chunkMaterial,
                    gateGlow,
                    slabWidth: width,
                    slabHeight: height,
                    slabDepth: depth,
                    impactY: Math.min(height * 0.32, 1.8),
                    columns,
                    rows,
                    layers,
                    cellWidth,
                    cellHeight,
                    cellDepth,
                    shellParts,
                    totalCells: shellParts.length,
                    remainingCells: shellParts.length,
                    mineHits: 0,
                    activeLayer: 0,
                    collapsing: false,
                    onDeath
                };
                const collider = {
                    id,
                    minX: -width / 2,
                    maxX: width / 2,
                    minZ: centerZ - depth * 0.5,
                    maxZ: centerZ + depth * 0.5
                };
                collider.gate = group;
                group.userData.collider = collider;
                mineColliders.push(collider);
                mineGates[id] = group;
                targets.push(group);
                scene.add(group);
                return group;
            }

            function activateMineGate(id) {
                const gate = mineGates[id];
                if (!gate || !gate.userData.alive) return;
                gate.visible = true;
                gate.userData.attackable = true;
                gate.userData.locked = false;
                if (!mineColliders.includes(gate.userData.collider)) {
                    mineColliders.push(gate.userData.collider);
                }
                gate.userData.gateMaterial.color.setHex(0x582078);
                gate.userData.gateMaterial.emissive.setHex(0x21052f);
                gate.userData.gateMaterial.emissiveIntensity = 0.78;
                gate.userData.chunkMaterial.color.setHex(0x642388);
                gate.userData.chunkMaterial.emissive.setHex(0x260638);
                gate.userData.gateGlow.color.setHex(0xa23cca);
                gate.userData.gateGlow.intensity = 0.68;
                buildPopEffect(gate.position.clone().add(new THREE.Vector3(0, gate.userData.impactY, 0)), 16, 0xc95cff);
            }

            function createCoinBundleMesh(visualCount = 2) {
                const bundle = new THREE.Group();
                for (let i = 0; i < visualCount; i++) {
                    const coin = new THREE.Mesh(shared.coin, shared.coinMat);
                    coin.scale.setScalar(0.78);
                    coin.position.set(
                        (i - (visualCount - 1) * 0.5) * 0.22,
                        i * 0.11,
                        (i % 2) * 0.055
                    );
                    coin.rotation.set(Math.PI / 2, 0, (i - 1) * 0.22);
                    coin.castShadow = true;
                    bundle.add(coin);
                }
                return bundle;
            }

            function addLockedCoinsToGate(gate, count, rewardBundles) {
                const rand = seededRandom(4100 + count * 37);
                const bundleCount = Math.max(1, rewardBundles);
                const hostCandidates = gate.userData.shellParts.filter(part => {
                    const worldZ = gate.position.z + part.position.z;
                    const safeHalfWidth = corridorHalfWidth(worldZ) - 0.85;
                    return (
                    part.userData.column > 0 &&
                    part.userData.column < gate.userData.columns - 1 &&
                    part.userData.row > 0 &&
                    part.userData.row < gate.userData.rows - 1 &&
                    Math.abs(gate.position.x + part.position.x) <= safeHalfWidth
                    );
                });
                const candidatesByLayer = Array.from({ length: gate.userData.layers }, (_, layer) =>
                    hostCandidates.filter(part => part.userData.layer === layer)
                );
                for (const candidates of candidatesByLayer) {
                    for (let i = candidates.length - 1; i > 0; i--) {
                        const swapIndex = Math.floor(rand() * (i + 1));
                        [candidates[i], candidates[swapIndex]] = [candidates[swapIndex], candidates[i]];
                    }
                }
                gate.userData.payloadCoins = [];
                for (let i = 0; i < bundleCount; i++) {
                    const layer = i % gate.userData.layers;
                    const layerCandidates = candidatesByLayer[layer];
                    const hostCell =
                        layerCandidates[Math.floor(i / gate.userData.layers) % layerCandidates.length] ||
                        hostCandidates[i % hostCandidates.length] ||
                        gate.userData.shellParts[i % gate.userData.shellParts.length];
                    const mesh = createCoinBundleMesh(2 + (i % 3 === 0 ? 1 : 0));
                    mesh.scale.setScalar(0.86 + rand() * 0.12);
                    mesh.position.set(
                        gate.position.x + hostCell.position.x + (rand() - 0.5) * gate.userData.cellWidth * 0.28,
                        hostCell.position.y + (rand() - 0.5) * gate.userData.cellHeight * 0.24,
                        gate.position.z + hostCell.position.z + gate.userData.cellDepth * 0.5 + 0.08
                    );
                    mesh.visible = hostCell.userData.layer === 0;
                    const locked = {
                        mesh,
                        gate,
                        hostCell,
                        value: 1,
                        released: false,
                        baseY: mesh.position.y,
                        baseRotation: (rand() - 0.5) * 0.32,
                        bob: rand() * 10,
                        jolt: 0,
                        joltSpeed: 0
                    };
                    mesh.rotation.z = locked.baseRotation;
                    scene.add(mesh);
                    gate.userData.payloadCoins.push(locked);
                    lockedCoins.push(locked);
                }
            }

            function updateLockedCoinExposure(gate) {
                if (!gate.userData.payloadCoins) return;
                for (const locked of gate.userData.payloadCoins) {
                    if (locked.released || locked.mesh.visible) continue;
                    const host = locked.hostCell;
                    const covered = gate.userData.shellParts.some(part =>
                        !part.userData.removed &&
                        part.userData.column === host.userData.column &&
                        part.userData.row === host.userData.row &&
                        part.userData.layer < host.userData.layer
                    );
                    if (!covered) locked.mesh.visible = true;
                }
            }

            function launchLockedCoin(locked) {
                if (!locked || locked.released) return;
                locked.released = true;
                const index = lockedCoins.indexOf(locked);
                if (index >= 0) lockedCoins.splice(index, 1);
                locked.mesh.visible = true;
                const inwardX = THREE.MathUtils.clamp(
                    player.position.x - locked.mesh.position.x,
                    -2.8,
                    2.8
                );
                coinDrops.push({
                    mesh: locked.mesh,
                    value: locked.value,
                    velocity: new THREE.Vector3(
                        inwardX * 0.72 + (Math.random() - 0.5) * 1.1,
                        3.2 + Math.random() * 2.3,
                        1.4 + Math.random() * 2.6
                    ),
                    grounded: false,
                    bob: Math.random() * 10
                });
            }

            function releaseCoinsForRemovedParts(gate, removedParts) {
                if (!gate.userData.payloadCoins || !removedParts.length) return;
                const removed = new Set(removedParts);
                for (const locked of gate.userData.payloadCoins) {
                    if (!locked.released && removed.has(locked.hostCell)) launchLockedCoin(locked);
                }
            }

            function releaseLockedCoins(gate) {
                if (!gate.userData.payloadCoins) return;
                for (const locked of gate.userData.payloadCoins) launchLockedCoin(locked);
            }

            function joltLockedCoins(gate) {
                if (!gate.userData.payloadCoins) return;
                for (const locked of gate.userData.payloadCoins) {
                    if (locked.released) continue;
                    locked.jolt = 0.12 + Math.random() * 0.14;
                    locked.joltSpeed = 2.2 + Math.random() * 1.4;
                }
            }

            function updateLockedCoins(dt, elapsed) {
                for (const locked of lockedCoins) {
                    if (locked.jolt > 0) {
                        locked.joltSpeed -= 8 * dt;
                        locked.jolt = Math.max(0, locked.jolt + locked.joltSpeed * dt);
                    }
                    locked.mesh.rotation.z = locked.baseRotation + Math.sin(elapsed * 1.7 + locked.bob) * 0.035;
                    locked.mesh.position.y = locked.baseY + locked.jolt;
                }
            }

            function createCampGhost() {
                const pad = new THREE.Mesh(
                    new THREE.PlaneGeometry(8.5, 8),
                    new THREE.MeshBasicMaterial({ color: 0x77d4ff, transparent: true, opacity: 0.08, side: THREE.DoubleSide })
                );
                pad.rotation.x = -Math.PI / 2;
                pad.position.set(0, 0.025, 4);
                pad.visible = false;
                scene.add(pad);
                camp.ghost = pad;
                showZonePreview(
                    "camp",
                    "建设营地",
                    CONFIG.campCost,
                    new THREE.Vector3(0, 0, 4),
                    completeCamp
                );
                prepareCampStages();
            }

            function prepareCampStages() {
                if (camp.prepared) return;
                camp.group = new THREE.Group();
                scene.add(camp.group);
                camp.sizes = {
                    1: { width: 8.5, depth: 8 },
                    2: { width: 10.2, depth: 9 },
                    3: { width: 12, depth: 10 }
                };

                for (let stage = 1; stage <= 3; stage++) {
                    const outer = camp.sizes[stage];
                    const inner = stage > 1 ? camp.sizes[stage - 1] : null;
                    camp.floors[stage] = createCampFloorLayer(outer, inner);
                    camp.grids[stage] = createCampGridFlash(outer, inner);
                    camp.perimeters[stage] = createCampPerimeter(outer.width, outer.depth);
                }

                camp.props[1] = new THREE.Group();
                createWorkbench(camp.props[1], new THREE.Vector3(2.7, 0, 6.1));
                createTorch(camp.props[1], new THREE.Vector3(-3.1, 1.5, 6.6));
                camp.props[1].visible = false;
                camp.group.add(camp.props[1]);

                camp.props[2] = new THREE.Group();
                createFireplace(camp.props[2], new THREE.Vector3(-3.6, 0, 1.1));
                createTorch(camp.props[2], new THREE.Vector3(4.7, 1.5, 7.5));
                camp.props[2].visible = false;
                camp.group.add(camp.props[2]);

                camp.props[3] = new THREE.Group();
                createTorch(camp.props[3], new THREE.Vector3(-4.2, 1.5, 2.4));
                createHatchPlatform(camp.props[3], new THREE.Vector3(3.3, 0, 3.1));
                camp.props[3].visible = false;
                camp.group.add(camp.props[3]);

                camp.weaponDisplay = new THREE.Mesh(
                    new THREE.BoxGeometry(0.18, 1.8, 0.26),
                    new THREE.MeshStandardMaterial({ color: 0xc4f4ff, emissive: 0x216b8e, metalness: 0.55 })
                );
                camp.weaponDisplay.position.set(2.7, 1.5, 6.1);
                camp.weaponDisplay.rotation.z = -0.65;
                camp.weaponDisplay.visible = false;
                camp.group.add(camp.weaponDisplay);

                createCampPulse();
                camp.prepared = true;
                prewarmCampVisuals();
            }

            function createCampFloorLayer(outer, inner) {
                const layer = new THREE.Group();
                const addFloor = (width, depth, x, z) => {
                    if (width <= 0 || depth <= 0) return;
                    const floor = new THREE.Mesh(
                        new THREE.PlaneGeometry(width, depth),
                        shared.campFloorMat
                    );
                    floor.rotation.x = -Math.PI / 2;
                    floor.position.set(x, 0.045, z);
                    floor.receiveShadow = true;
                    layer.add(floor);
                };
                if (!inner) {
                    addFloor(outer.width, outer.depth, 0, 4);
                } else {
                    const sideWidth = (outer.width - inner.width) / 2;
                    const endDepth = (outer.depth - inner.depth) / 2;
                    addFloor(sideWidth, outer.depth, -(inner.width + sideWidth) / 2, 4);
                    addFloor(sideWidth, outer.depth, (inner.width + sideWidth) / 2, 4);
                    addFloor(inner.width, endDepth, 0, 4 - (inner.depth + endDepth) / 2);
                    addFloor(inner.width, endDepth, 0, 4 + (inner.depth + endDepth) / 2);
                }
                layer.visible = false;
                camp.group.add(layer);
                return layer;
            }

            function createCampGridTexture(outer, inner) {
                const canvas = document.createElement("canvas");
                canvas.width = 512;
                canvas.height = 512;
                const context = canvas.getContext("2d");
                context.clearRect(0, 0, 512, 512);
                context.strokeStyle = "rgba(255,247,210,0.96)";
                context.lineWidth = 6;
                context.shadowColor = "#ffffff";
                context.shadowBlur = 16;
                const stepX = 512 / Math.max(4, Math.round(outer.width / 1.7));
                const stepY = 512 / Math.max(4, Math.round(outer.depth / 1.7));
                for (let x = 0; x <= 512; x += stepX) {
                    context.beginPath();
                    context.moveTo(x, 0);
                    context.lineTo(x, 512);
                    context.stroke();
                }
                for (let y = 0; y <= 512; y += stepY) {
                    context.beginPath();
                    context.moveTo(0, y);
                    context.lineTo(512, y);
                    context.stroke();
                }
                context.shadowBlur = 0;
                context.strokeStyle = "rgba(255,255,255,1)";
                context.lineWidth = 10;
                context.strokeRect(5, 5, 502, 502);
                if (inner) {
                    const innerWidth = 512 * inner.width / outer.width;
                    const innerHeight = 512 * inner.depth / outer.depth;
                    const x = (512 - innerWidth) / 2;
                    const y = (512 - innerHeight) / 2;
                    context.globalCompositeOperation = "destination-out";
                    context.fillRect(x + 5, y + 5, innerWidth - 10, innerHeight - 10);
                    context.globalCompositeOperation = "source-over";
                    context.strokeStyle = "rgba(255,243,188,0.98)";
                    context.lineWidth = 8;
                    context.strokeRect(x, y, innerWidth, innerHeight);
                }
                const texture = new THREE.CanvasTexture(canvas);
                texture.minFilter = THREE.LinearFilter;
                return texture;
            }

            function createCampGridFlash(outer, inner) {
                const material = new THREE.MeshBasicMaterial({
                    map: createCampGridTexture(outer, inner),
                    color: 0xfff1b0,
                    transparent: true,
                    opacity: 0,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    side: THREE.DoubleSide
                });
                const grid = new THREE.Mesh(
                    new THREE.PlaneGeometry(outer.width, outer.depth),
                    material
                );
                grid.rotation.x = -Math.PI / 2;
                grid.position.set(0, 0.078, 4);
                grid.visible = false;
                grid.renderOrder = 4;
                camp.group.add(grid);
                return grid;
            }

            function createCampPerimeter(width, depth) {
                const perimeter = { root: new THREE.Group(), sides: [] };
                const wallHeight = 1.65;
                const wallSize = 1.05;
                const left = -width / 2;
                const right = width / 2;
                const top = 4 - depth / 2;
                const bottom = 4 + depth / 2;
                const topPositions = [];
                const bottomPositions = [];
                const leftPositions = [];
                const rightPositions = [];
                for (let x = left; x <= right + 0.1; x += wallSize) {
                    if (!(x > -1.35 && x < 1.35)) {
                        topPositions.push([x, top]);
                        bottomPositions.push([x, bottom]);
                    }
                }
                for (let z = top + wallSize; z < bottom; z += wallSize) {
                    leftPositions.push([left, z]);
                    rightPositions.push([right, z]);
                }
                perimeter.sides.push(createCampWallSide(topPositions, wallSize, wallHeight));
                perimeter.sides.push(createCampWallSide(rightPositions, wallSize, wallHeight));
                perimeter.sides.push(createCampWallSide(bottomPositions, wallSize, wallHeight));
                perimeter.sides.push(createCampWallSide(leftPositions, wallSize, wallHeight));
                for (const side of perimeter.sides) perimeter.root.add(side);
                camp.group.add(perimeter.root);
                return perimeter;
            }

            function createCampWallSide(positions, wallSize, wallHeight) {
                const side = new THREE.Group();
                const wall = new THREE.InstancedMesh(shared.box, shared.wallMat, positions.length);
                const overlayMaterial = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                const overlay = new THREE.InstancedMesh(shared.box, overlayMaterial, positions.length);
                const matrix = new THREE.Matrix4();
                const position = new THREE.Vector3();
                const scale = new THREE.Vector3(wallSize, wallHeight, wallSize);
                const rotation = new THREE.Quaternion();
                positions.forEach(([x, z], index) => {
                    position.set(x, wallHeight / 2, z);
                    matrix.compose(position, rotation, scale);
                    wall.setMatrixAt(index, matrix);
                    overlay.setMatrixAt(index, matrix);
                });
                wall.instanceMatrix.needsUpdate = true;
                overlay.instanceMatrix.needsUpdate = true;
                wall.castShadow = true;
                wall.receiveShadow = true;
                overlay.visible = false;
                overlay.renderOrder = 3;
                side.add(wall, overlay);
                side.userData.wall = wall;
                side.userData.overlay = overlay;
                side.visible = false;
                return side;
            }

            function createCampPulse() {
                const group = new THREE.Group();
                const ring = new THREE.Mesh(
                    new THREE.RingGeometry(0.55, 2.4, 32),
                    new THREE.MeshBasicMaterial({
                        color: 0xffe89a,
                        transparent: true,
                        opacity: 0,
                        blending: THREE.AdditiveBlending,
                        depthWrite: false,
                        side: THREE.DoubleSide
                    })
                );
                ring.rotation.x = -Math.PI / 2;
                const light = new THREE.PointLight(0xffdb83, 0.001, 9);
                light.position.set(0, 1.2, 4);
                group.add(ring);
                group.visible = false;
                group.userData.ring = ring;
                group.userData.light = light;
                group.userData.baseIntensity = 0.001;
                camp.group.add(group, light);
                camp.pulse = group;
            }

            function prewarmCampVisuals() {
                const visibility = [];
                camp.group.traverse(object => {
                    visibility.push([object, object.visible]);
                    object.visible = true;
                });
                const spark = shared.sparkPool[shared.sparkPool.length - 1];
                spark.material = shared.sparkMaterials.get(0xffda4c);
                spark.position.set(0, 0.5, 4);
                spark.visible = true;
                renderer.compile(scene, camera);
                renderer.render(scene, camera);
                spark.visible = false;
                for (const [object, visible] of visibility) object.visible = visible;
            }

            function rebuildCampColliders(width, depth) {
                campColliders.length = 0;
                const wallSize = 1.05;
                const left = -width / 2;
                const right = width / 2;
                const top = 4 - depth / 2;
                const bottom = 4 + depth / 2;
                const addCollider = (x, z) => {
                    campColliders.push({
                        minX: x - wallSize * 0.52,
                        maxX: x + wallSize * 0.52,
                        minZ: z - wallSize * 0.52,
                        maxZ: z + wallSize * 0.52
                    });
                };
                for (let x = left; x <= right + 0.1; x += wallSize) {
                    if (!(x > -1.35 && x < 1.35)) {
                        addCollider(x, top);
                        addCollider(x, bottom);
                    }
                }
                for (let z = top + wallSize; z < bottom; z += wallSize) {
                    addCollider(left, z);
                    addCollider(right, z);
                }
            }

            function easeOutBack(t) {
                const c1 = 1.70158;
                const c3 = c1 + 1;
                return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
            }

            function animateCampChunkRise(object, delay = 0) {
                const finalScale = object.userData.finalScale
                    ? object.userData.finalScale.clone()
                    : object.scale.clone();
                const finalY = object.userData.finalY !== undefined
                    ? object.userData.finalY
                    : object.position.y;
                object.userData.finalScale = finalScale.clone();
                object.userData.finalY = finalY;
                object.visible = true;
                object.position.y = finalY - CONFIG.campRiseDepth;
                object.scale.set(finalScale.x * 0.96, finalScale.y * 0.16, finalScale.z * 0.96);
                const overlay = object.userData.overlay;
                if (overlay) {
                    overlay.visible = true;
                    overlay.material.opacity = 0.72;
                }
                if (object.userData.wall) object.userData.wall.castShadow = false;
                effects.push({
                    type: "campChunkRise",
                    mesh: object,
                    overlay,
                    delay,
                    life: CONFIG.campRiseDuration,
                    maxLife: CONFIG.campRiseDuration,
                    finalScale,
                    finalY
                });
            }

            function animateCampChunkSink(object, delay = 0) {
                const finalScale = object.userData.finalScale
                    ? object.userData.finalScale.clone()
                    : object.scale.clone();
                const finalY = object.userData.finalY !== undefined
                    ? object.userData.finalY
                    : object.position.y;
                effects.push({
                    type: "campChunkSink",
                    mesh: object,
                    delay,
                    life: CONFIG.campSinkDuration,
                    maxLife: CONFIG.campSinkDuration,
                    finalScale,
                    finalY
                });
            }

            function animateCampFloor(layer) {
                layer.visible = true;
                layer.scale.set(0.94, 1, 0.94);
                effects.push({
                    type: "campFloorReveal",
                    mesh: layer,
                    life: 0.36,
                    maxLife: 0.36
                });
            }

            function flashCampGrid(stage) {
                const grid = camp.grids[stage];
                grid.visible = true;
                grid.material.opacity = 0;
                effects.push({
                    type: "campGridFlash",
                    mesh: grid,
                    life: CONFIG.campGridDuration,
                    maxLife: CONFIG.campGridDuration
                });
            }

            function playCampPulse(position) {
                for (let i = effects.length - 1; i >= 0; i--) {
                    if (effects[i].type === "campPulse") effects.splice(i, 1);
                }
                const pulse = camp.pulse;
                pulse.position.copy(position);
                pulse.userData.light.position.copy(position).add(new THREE.Vector3(0, 1.2, 0));
                pulse.visible = true;
                pulse.scale.setScalar(0.45);
                pulse.userData.ring.material.opacity = 0.8;
                pulse.userData.light.intensity = pulse.userData.baseIntensity + 1.4;
                effects.push({
                    type: "campPulse",
                    mesh: pulse,
                    life: CONFIG.campPulseDuration,
                    maxLife: CONFIG.campPulseDuration
                });
            }

            function buildCamp(stage) {
                prepareCampStages();
                if (stage <= camp.stage || !camp.sizes[stage]) return;
                const previousStage = camp.stage;
                const target = camp.sizes[stage];
                animateCampFloor(camp.floors[stage]);
                flashCampGrid(stage);

                if (previousStage > 0) {
                    camp.perimeters[previousStage].sides.forEach((side, index) => {
                        animateCampChunkSink(side, index * 0.018);
                    });
                }
                camp.perimeters[stage].sides.forEach((side, index) => {
                    animateCampChunkRise(side, 0.08 + index * CONFIG.campSideStagger);
                });
                animateCampChunkRise(camp.props[stage], 0.15);
                rebuildCampColliders(target.width, target.depth);
                camp.stage = stage;
                camp.pulse.userData.baseIntensity = stage === 1 ? 1.15 : stage === 2 ? 1.45 : 1.7;
                playCampPulse(new THREE.Vector3(0, 0.1, 4));
            }

            function createWorkbench(group, position) {
                const table = new THREE.Mesh(
                    shared.box,
                    new THREE.MeshStandardMaterial({ color: 0x60402e, roughness: 0.85 })
                );
                table.scale.set(2.4, 0.28, 1.25);
                table.position.copy(position).add(new THREE.Vector3(0, 0.75, 0));
                table.castShadow = true;
                group.add(table);
                for (const x of [-0.92, 0.92]) {
                    for (const z of [-0.42, 0.42]) {
                        const leg = new THREE.Mesh(shared.box, table.material);
                        leg.scale.set(0.18, 0.72, 0.18);
                        leg.position.copy(position).add(new THREE.Vector3(x, 0.36, z));
                        group.add(leg);
                    }
                }
                const cloth = new THREE.Mesh(
                    new THREE.PlaneGeometry(1.3, 1.2),
                    new THREE.MeshStandardMaterial({ color: 0xa72036, side: THREE.DoubleSide })
                );
                cloth.rotation.x = -Math.PI / 2;
                cloth.position.copy(position).add(new THREE.Vector3(0, 0.91, 0));
                group.add(cloth);
                camp.workbench = table;
            }

            function createTorch(group, position) {
                const pole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.07, 0.08, 1.4, 8),
                    new THREE.MeshStandardMaterial({ color: 0x4d2f20 })
                );
                pole.position.copy(position);
                group.add(pole);
                const fire = new THREE.Mesh(
                    new THREE.SphereGeometry(0.22, 8, 6),
                    new THREE.MeshBasicMaterial({ color: 0xff9c2b })
                );
                fire.scale.y = 1.5;
                fire.position.copy(position).add(new THREE.Vector3(0, 0.82, 0));
                fire.userData.skipBuildReveal = true;
                group.add(fire);
                effects.push({ type: "fire", mesh: fire, baseY: fire.position.y, t: Math.random() * 10 });
            }

            function createFireplace(group, position) {
                const hearth = new THREE.Mesh(shared.box, shared.stoneMat);
                hearth.scale.set(2.4, 1.35, 0.65);
                hearth.position.copy(position).add(new THREE.Vector3(0, 0.68, 0));
                group.add(hearth);
                const glow = new THREE.Mesh(
                    new THREE.PlaneGeometry(1.2, 0.65),
                    new THREE.MeshBasicMaterial({ color: 0xff6825 })
                );
                glow.position.copy(position).add(new THREE.Vector3(0, 0.55, 0.34));
                group.add(glow);
            }

            function createHatchPlatform(group, position) {
                const base = new THREE.Mesh(
                    new THREE.CylinderGeometry(1.75, 1.9, 0.35, 18),
                    new THREE.MeshStandardMaterial({ color: 0x827a72, metalness: 0.15, roughness: 0.75 })
                );
                base.position.copy(position).add(new THREE.Vector3(0, 0.18, 0));
                base.castShadow = true;
                group.add(base);
                const ring = new THREE.Mesh(
                    new THREE.TorusGeometry(1.45, 0.11, 8, 24),
                    new THREE.MeshStandardMaterial({ color: 0xd7a83e, metalness: 0.68, roughness: 0.3 })
                );
                ring.rotation.x = Math.PI / 2;
                ring.position.copy(position).add(new THREE.Vector3(0, 0.4, 0));
                group.add(ring);

                const guide = new THREE.Group();
                guide.position.copy(position);
                guide.visible = false;
                const guideRing = new THREE.Mesh(
                    new THREE.TorusGeometry(1.82, 0.14, 8, 32),
                    new THREE.MeshBasicMaterial({
                        color: 0x66e8ff,
                        transparent: true,
                        opacity: 0.72,
                        depthWrite: false
                    })
                );
                guideRing.rotation.x = Math.PI / 2;
                guideRing.position.y = 0.46;
                guide.add(guideRing);
                const guideEgg = new THREE.Mesh(
                    new THREE.SphereGeometry(0.62, 14, 12),
                    new THREE.MeshBasicMaterial({
                        color: 0x79edff,
                        transparent: true,
                        opacity: 0.28,
                        depthWrite: false
                    })
                );
                guideEgg.scale.y = 1.28;
                guideEgg.position.y = 1.15;
                guide.add(guideEgg);
                const guideLight = new THREE.PointLight(0x52dcff, 1.45, 7);
                guideLight.position.y = 1.3;
                guide.add(guideLight);
                group.add(guide);
                camp.platform = base;
                camp.nestRing = ring;
                camp.nestGuide = guide;
                camp.nestGuideRing = guideRing;
                camp.nestGuideEgg = guideEgg;
                camp.nestPos = position.clone().add(new THREE.Vector3(0, 1.1, 0));
                camp.egg = null;
            }

            function createEggMesh() {
                const egg = new THREE.Mesh(
                    new THREE.SphereGeometry(0.72, 14, 12),
                    new THREE.MeshStandardMaterial({ color: 0x20b7c7, emissive: 0x073845, roughness: 0.42 })
                );
                egg.scale.y = 1.28;
                egg.castShadow = true;
                return egg;
            }

            function spawnDragonEgg(position) {
                if (eggPickup || carryingEgg) return;
                const mesh = createEggMesh();
                mesh.position.copy(position).add(new THREE.Vector3(0, 0.95, 0));
                scene.add(mesh);
                eggPickup = { mesh, bob: Math.random() * 6, progress: 0 };
                setEggLockProgress(0);
                ui.eggLock.classList.add("show");
                ui.eggLock.classList.remove("charging");
            }

            function updateEggPickup(dt, elapsed) {
                updateNestGuide(elapsed);
                if (eggPlace) {
                    updateEggPlace(dt);
                    hideEggLock();
                    return;
                }
                if (carryingEgg && camp.heldEgg) {
                    camp.heldEgg.rotation.y += dt * 0.8;
                    camp.heldEgg.position.y = 1.52 + Math.sin(elapsed * 4) * 0.03;
                    hideEggLock();
                    if (camp.stage >= 3 && camp.nestPos &&
                        flatDistance(player.position, camp.nestPos) < 3.2) {
                        startEggPlace();
                    }
                    return;
                }
                if (!eggPickup) {
                    hideEggLock();
                    return;
                }
                eggPickup.mesh.rotation.y += dt * 1.4;
                eggPickup.mesh.position.y = 0.95 + Math.sin(elapsed * 3.2 + eggPickup.bob) * 0.1;
                const inRange = flatDistance(eggPickup.mesh.position, player.position) < CONFIG.eggPickupRange;
                if (inRange) {
                    eggPickup.progress = Math.min(1, eggPickup.progress + dt / CONFIG.eggPickupDuration);
                    ui.eggLock.classList.add("charging");
                    if (eggPickup.progress >= 1) {
                        pickUpEgg();
                        return;
                    }
                } else {
                    eggPickup.progress = 0;
                    ui.eggLock.classList.remove("charging");
                }
                setEggLockProgress(eggPickup.progress);
                updateEggLockPosition();
            }

            function updateNestGuide(elapsed) {
                if (!camp.nestGuide) return;
                const visible = carryingEgg && !!camp.heldEgg && camp.stage >= 3 && !eggPlace && !camp.egg;
                camp.nestGuide.visible = visible;
                if (!visible) return;
                const pulse = 1 + Math.sin(elapsed * 4.2) * 0.12;
                camp.nestGuideRing.scale.setScalar(pulse);
                camp.nestGuideRing.material.opacity = 0.58 + Math.sin(elapsed * 4.2) * 0.18;
                camp.nestGuideEgg.position.y = 1.15 + Math.sin(elapsed * 3.2) * 0.14;
                camp.nestGuideEgg.rotation.y = elapsed * 0.9;
                camp.nestGuideEgg.material.opacity = 0.24 + Math.sin(elapsed * 4.2) * 0.08;
            }

            function setEggLockProgress(progress) {
                if (!ui.eggLockBar) return;
                ui.eggLockBar.style.strokeDashoffset = `${175.93 * (1 - progress)}`;
            }

            function updateEggLockPosition() {
                if (!eggPickup || !ui.eggLock) return;
                const p = eggPickup.mesh.position.clone();
                p.y += 1.15;
                p.project(camera);
                if (p.z > 1 || Math.abs(p.x) > 1.2 || Math.abs(p.y) > 1.2) {
                    ui.eggLock.style.opacity = "0";
                    return;
                }
                ui.eggLock.classList.add("show");
                ui.eggLock.style.opacity = "1";
                ui.eggLock.style.left = `${(p.x * 0.5 + 0.5) * innerWidth}px`;
                ui.eggLock.style.top = `${(-p.y * 0.5 + 0.5) * innerHeight}px`;
            }

            function hideEggLock() {
                if (!ui.eggLock) return;
                ui.eggLock.classList.remove("show", "charging");
                setEggLockProgress(0);
            }

            function pickUpEgg() {
                if (!eggPickup || carryingEgg) return;
                carryingEgg = true;
                camp.heldEgg = eggPickup.mesh;
                playerVisual.add(camp.heldEgg);
                camp.heldEgg.position.set(0.08, 1.52, 0.58);
                camp.heldEgg.scale.set(0.62, 0.8, 0.62);
                eggPickup = null;
                hideEggLock();
                if (playerWeapon) playerWeapon.visible = false;
                toast("将龙蛋带回发光龙巢");
                checkProgressFromCoins();
            }

            function placeHeldEgg() {
                if (camp.heldEgg) {
                    playerVisual.remove(camp.heldEgg);
                    camp.heldEgg = null;
                }
                carryingEgg = false;
                if (playerWeapon) playerWeapon.visible = true;
            }

            function startEggPlace() {
                if (eggPlace || !camp.heldEgg) {
                    finishEggPlace();
                    return;
                }
                if (camp.nestGuide) camp.nestGuide.visible = false;
                const start = new THREE.Vector3();
                camp.heldEgg.getWorldPosition(start);
                playerVisual.remove(camp.heldEgg);
                scene.add(camp.heldEgg);
                camp.heldEgg.position.copy(start);
                const end = camp.nestPos
                    ? camp.nestPos.clone()
                    : new THREE.Vector3(3.3, 1.1, 3.1);
                eggPlace = {
                    mesh: camp.heldEgg,
                    start,
                    end,
                    t: 0,
                    duration: CONFIG.eggPlaceDuration
                };
                camp.heldEgg = null;
                toast("安放龙蛋");
                playSound("upgrade");
            }

            function updateEggPlace(dt) {
                if (!eggPlace) return;
                eggPlace.t = Math.min(1, eggPlace.t + dt / eggPlace.duration);
                const t = eggPlace.t * eggPlace.t * (3 - 2 * eggPlace.t);
                eggPlace.mesh.position.lerpVectors(eggPlace.start, eggPlace.end, t);
                eggPlace.mesh.position.y += Math.sin(Math.PI * t) * 1.55;
                const grow = 0.62 + t * 0.38;
                eggPlace.mesh.scale.set(grow, grow * 1.28, grow);
                eggPlace.mesh.rotation.y += dt * 2.4;
                if (eggPlace.t >= 1) finishEggPlace();
            }

            function finishEggPlace() {
                const mesh = eggPlace ? eggPlace.mesh : null;
                eggPlace = null;
                if (mesh) {
                    scene.remove(mesh);
                    if (camp.group) camp.group.add(mesh);
                    else scene.add(mesh);
                    mesh.position.copy(camp.nestPos || new THREE.Vector3(3.3, 1.1, 3.1));
                    mesh.scale.set(1, 1.28, 1);
                    mesh.rotation.set(0, 0, 0);
                    camp.egg = mesh;
                    buildPopEffect(mesh.position, 20, 0x71ddff);
                }
                carryingEgg = false;
                if (camp.nestGuide) camp.nestGuide.visible = false;
                if (playerWeapon) playerWeapon.visible = true;
                toast("龙蛋已安放");
                phase = PHASE.MINE_BOSS;
                showZonePreview(
                    "dragon",
                    "孵化冰龙",
                    CONFIG.dragonCost,
                    new THREE.Vector3(-2.1, 0, 5.4),
                    completeDragon
                );
                setTimeout(() => activateMineGate("mine-boss"), 400);
            }

            function completeCamp() {
                if (camp.ghost) camp.ghost.visible = false;
                buildCamp(1);
                showZonePreview(
                    "weapon",
                    "强化营地",
                    CONFIG.weaponCost,
                    new THREE.Vector3(-2.1, 0, 5.4),
                    completeWeapon
                );
                phase = PHASE.MINE_GOLEM;
                toast("营地建成");
                setTimeout(() => activateMineGate("mine-golem"), 450);
            }

            function completeWeapon() {
                weaponLevel = 2;
                power = 2056;
                ui.power.textContent = power.toLocaleString();
                const oldGem = playerWeapon.children[1];
                oldGem.material = shared.upgradedWeaponMat;
                oldGem.scale.setScalar(1.45);
                buildCamp(2);
                buildWeaponDisplay();
                showZonePreview(
                    "expand",
                    "安放龙蛋",
                    CONFIG.expandCost,
                    new THREE.Vector3(-2.1, 0, 5.4),
                    completeExpand
                );
                phase = PHASE.MINE_STRONG;
                toast("营地强化，装备升级");
                setTimeout(() => activateMineGate("mine-strong"), 450);
            }

            function buildWeaponDisplay() {
                if (!camp.weaponDisplay || camp.weaponDisplay.visible) return;
                animateCampChunkRise(camp.weaponDisplay, 0.05);
                playCampPulse(new THREE.Vector3(2.7, 0.9, 6.1));
            }

            function completeExpand() {
                buildCamp(3);
                if (weaponLevel >= 2) buildWeaponDisplay();
                if (carryingEgg && camp.heldEgg) {
                    startEggPlace();
                } else {
                    toast("营地扩建完成");
                }
            }

            function completeDragon() {
                if (camp.egg) camp.egg.visible = false;
                createDragon();
                if (boss) {
                    boss.userData.shielded = false;
                    if (boss.userData.shield) boss.userData.shield.visible = false;
                }
                phase = PHASE.BOSS_FINAL;
                toast("冰龙觉醒");
                playSound("upgrade");
            }

            function createZone(id, name, cost, position, active, onComplete) {
                const tile = createGroundActionTile(id, cost);
                const group = tile.group;
                group.position.copy(position);
                scene.add(group);

                const zone = {
                    id, name, cost, paid: 0, active, complete: false, group,
                    base: tile.base, tile: tile.mesh, tileTexture: tile.texture,
                    tileContext: tile.context, tileReady: false, tilePaid: -1, pulse: 0,
                    position: position.clone(), paymentTimer: 0, onComplete
                };
                group.visible = active;
                zones.push(zone);
                return zone;
            }

            function createGroundActionTile(id, cost) {
                const group = new THREE.Group();
                const size = CONFIG.zoneTileSize;
                const base = new THREE.Mesh(
                    new THREE.PlaneGeometry(size, size),
                    new THREE.MeshBasicMaterial({
                        color: 0x17141f,
                        transparent: true,
                        opacity: 0.72,
                        depthWrite: false,
                        side: THREE.DoubleSide
                    })
                );
                base.rotation.x = -Math.PI / 2;
                base.position.y = 0.055;
                group.add(base);

                const canvas = document.createElement("canvas");
                canvas.width = 512;
                canvas.height = 512;
                const context = canvas.getContext("2d");
                drawGroundActionTile(context, id, 0, cost, false);
                const texture = new THREE.CanvasTexture(canvas);
                texture.minFilter = THREE.LinearFilter;
                texture.magFilter = THREE.LinearFilter;
                texture.encoding = THREE.sRGBEncoding;
                const mesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(size, size),
                    new THREE.MeshBasicMaterial({
                        map: texture,
                        transparent: true,
                        opacity: 0.9,
                        depthWrite: false,
                        side: THREE.DoubleSide
                    })
                );
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.y = 0.075;
                group.add(mesh);
                return { group, base, mesh, texture, context };
            }

            function drawGroundActionTile(context, id, paid, cost, ready) {
                const color = ready ? "#79ff9c" : "#ffffff";
                context.clearRect(0, 0, 512, 512);
                context.save();
                context.lineJoin = "round";
                context.lineCap = "round";
                context.shadowColor = ready ? "rgba(74,255,126,0.9)" : "rgba(255,255,255,0.72)";
                context.shadowBlur = ready ? 22 : 12;
                context.strokeStyle = color;
                context.lineWidth = 13;
                context.setLineDash([34, 19]);
                context.strokeRect(26, 26, 460, 460);
                context.setLineDash([]);
                drawGroundActionIcon(context, id, color);

                context.shadowBlur = 14;
                context.fillStyle = "#ffd43b";
                context.beginPath();
                context.arc(158, 412, 31, 0, Math.PI * 2);
                context.fill();
                context.strokeStyle = "#fff09b";
                context.lineWidth = 7;
                context.stroke();
                context.strokeStyle = "#b76b00";
                context.lineWidth = 5;
                context.beginPath();
                context.moveTo(158, 394);
                context.lineTo(158, 430);
                context.stroke();

                context.shadowColor = "rgba(0,0,0,0.85)";
                context.shadowBlur = 8;
                context.fillStyle = "#ffffff";
                context.font = "900 64px Arial, sans-serif";
                context.textAlign = "left";
                context.textBaseline = "middle";
                context.fillText(`${paid}/${cost}`, 205, 414);
                context.restore();
            }

            function drawGroundActionIcon(context, id, color) {
                context.strokeStyle = color;
                context.fillStyle = color;
                context.lineWidth = 24;
                context.shadowBlur = 16;

                if (id === "dragon") {
                    context.beginPath();
                    context.moveTo(257, 142);
                    context.bezierCurveTo(326, 198, 337, 282, 276, 330);
                    context.bezierCurveTo(232, 350, 178, 313, 182, 256);
                    context.bezierCurveTo(184, 220, 205, 190, 232, 169);
                    context.bezierCurveTo(226, 212, 244, 234, 268, 239);
                    context.bezierCurveTo(296, 217, 292, 177, 257, 142);
                    context.stroke();
                    context.beginPath();
                    context.moveTo(268, 239);
                    context.lineTo(229, 278);
                    context.lineTo(258, 282);
                    context.lineTo(238, 317);
                    context.stroke();
                    return;
                }

                if (id === "end-hero") {
                    context.beginPath();
                    context.moveTo(198, 310);
                    context.lineTo(312, 168);
                    context.moveTo(178, 278);
                    context.lineTo(232, 322);
                    context.stroke();
                    context.beginPath();
                    context.moveTo(310, 168);
                    context.lineTo(294, 222);
                    context.lineTo(270, 202);
                    context.closePath();
                    context.fill();
                    return;
                }

                if (id === "weapon") {
                    context.beginPath();
                    context.moveTo(190, 320);
                    context.lineTo(306, 188);
                    context.moveTo(208, 178);
                    context.lineTo(320, 274);
                    context.stroke();
                    context.fillRect(274, 158, 76, 45);
                    return;
                }

                if (id === "expand") {
                    drawHouseIcon(context);
                    context.lineWidth = 20;
                    context.beginPath();
                    context.moveTo(330, 190);
                    context.lineTo(330, 270);
                    context.moveTo(290, 230);
                    context.lineTo(370, 230);
                    context.stroke();
                    return;
                }

                if (id === "end-camp") {
                    context.strokeRect(176, 208, 160, 116);
                    context.beginPath();
                    context.moveTo(176, 208);
                    context.lineTo(176, 168);
                    context.lineTo(216, 188);
                    context.lineTo(256, 168);
                    context.lineTo(296, 188);
                    context.lineTo(336, 168);
                    context.lineTo(336, 208);
                    context.stroke();
                    return;
                }

                drawHammerIcon(context);
            }

            function drawHammerIcon(context) {
                context.beginPath();
                context.moveTo(205, 318);
                context.lineTo(300, 220);
                context.stroke();
                context.save();
                context.translate(300, 210);
                context.rotate(Math.PI / 4);
                context.fillRect(-58, -31, 116, 62);
                context.restore();
            }

            function drawHouseIcon(context) {
                context.beginPath();
                context.moveTo(158, 240);
                context.lineTo(256, 158);
                context.lineTo(338, 226);
                context.stroke();
                context.strokeRect(184, 230, 144, 96);
                context.strokeRect(240, 270, 38, 56);
            }

            function updateGroundActionTile(zone, ready) {
                if (zone.tileReady === ready && zone.tilePaid === zone.paid) return;
                zone.tileReady = ready;
                zone.tilePaid = zone.paid;
                drawGroundActionTile(zone.tileContext, zone.id, zone.paid, zone.cost, ready);
                zone.tileTexture.needsUpdate = true;
                zone.base.material.color.setHex(ready ? 0x17482a : 0x17141f);
            }

            function showZonePreview(id, name, cost, position, onComplete) {
                let zone = zones.find(item => item.id === id);
                if (!zone) zone = createZone(id, name, cost, position, false, onComplete);
                zone.preview = true;
                zone.active = false;
                zone.group.visible = true;
                updateGroundActionTile(zone, false);
                return zone;
            }

            function activateZone(id) {
                const zone = zones.find(z => z.id === id);
                if (!zone || zone.complete) return;
                zone.preview = false;
                zone.active = true;
                zone.group.visible = true;
            }

            function refreshBuildZoneAvailability() {
                const campZone = zones.find(zone => zone.id === "camp" && !zone.complete);
                if (campZone && !campZone.active && coins >= campZone.cost - campZone.paid) {
                    activateZone("camp");
                    if (camp.ghost) camp.ghost.visible = true;
                    if (phase === PHASE.START_COINS) phase = PHASE.BUILD_CAMP;
                    if (!campZone.affordabilityPrompted) {
                        campZone.affordabilityPrompted = true;
                        toast("金币已足，回营建造");
                    }
                }

                const weaponZone = zones.find(zone => zone.id === "weapon" && !zone.complete);
                if (weaponZone && !weaponZone.active && coins >= weaponZone.cost - weaponZone.paid) {
                    activateZone("weapon");
                    if (!weaponZone.affordabilityPrompted) {
                        weaponZone.affordabilityPrompted = true;
                        toast("金币已足，返回营地强化");
                    }
                }

                const expandZone = zones.find(zone => zone.id === "expand" && !zone.complete);
                if (expandZone && !expandZone.active &&
                    coins >= expandZone.cost - expandZone.paid) {
                    activateZone("expand");
                }

                const dragonZone = zones.find(zone => zone.id === "dragon" && !zone.complete);
                if (dragonZone && !dragonZone.active && camp.egg && bossThresholdTriggered &&
                    coins >= dragonZone.cost - dragonZone.paid) {
                    activateZone("dragon");
                }
            }

            function updateZones(dt) {
                refreshBuildZoneAvailability();
                for (const zone of zones) {
                    if (!zone.active || zone.complete) continue;
                    const remainingCost = Math.max(0, zone.cost - zone.paid);
                    const ready = coins >= remainingCost;
                    updateGroundActionTile(zone, ready);
                    zone.pulse += dt;
                    const pulse = ready ? 0.88 + Math.sin(zone.pulse * CONFIG.zonePulseSpeed) * 0.1 : 0.78;
                    zone.tile.material.opacity = pulse;
                    zone.base.material.opacity = ready ? 0.72 + Math.sin(zone.pulse * CONFIG.zonePulseSpeed) * 0.08 : 0.6;
                    if (zone.displayOnly) continue;

                    const halfSize = CONFIG.zoneTileSize * 0.5;
                    const inRange =
                        Math.abs(player.position.x - zone.position.x) < halfSize &&
                        Math.abs(player.position.z - zone.position.z) < halfSize;
                    const keepPaying = zone.paid > 0 && coins > 0 && !zone.complete && !endScheduled;
                    if ((inRange || keepPaying) && coins > 0 && !endScheduled) {
                        zone.paymentTimer -= dt;
                        if (zone.paymentTimer <= 0) {
                            zone.paymentTimer = CONFIG.zonePaymentInterval;
                            coins -= 1;
                            zone.paid += 1;
                            updateUI();
                            playSound("coin");
                            flyCoinTo(zone.position);
                            updateGroundActionTile(zone, coins >= Math.max(0, zone.cost - zone.paid));
                            if (zone.tease && zone.paid >= CONFIG.endTeaseCoins) {
                                triggerCtaFromUpgrade();
                                break;
                            }
                            if (zone.paid >= zone.cost) {
                                zone.complete = true;
                                zone.active = false;
                                setTimeout(() => {
                                    zone.group.visible = false;
                                    if (zone.id !== "camp" && zone.id !== "weapon" && zone.id !== "expand") {
                                        buildPopEffect(zone.position, 22, 0xffda4c);
                                    }
                                    zone.onComplete();
                                }, 160);
                            }
                        }
                    }
                }
            }

            function getGuidePosition() {
                if (phase === PHASE.START_COINS) {
                    const mine = targets.find(t => t.userData.type === "mine" && t.userData.alive && t.userData.attackable && !t.userData.locked);
                    return mine ? mine.position : null;
                }
                if (phase === PHASE.BUILD_CAMP) {
                    const zone = zones.find(z => z.id === "camp" && !z.complete);
                    return zone ? zone.position : null;
                }
                if (phase === PHASE.MINE_GOLEM || phase === PHASE.MINE_STRONG || phase === PHASE.MINE_BOSS) {
                    const mine = targets.find(t => t.userData.type === "mine" && t.userData.alive && t.userData.attackable && !t.userData.locked);
                    return mine ? mine.position : null;
                }
                if (phase === PHASE.FIRST_GOLEM || phase === PHASE.STRONG_GOLEM) {
                    const golem = enemies.find(e => e.userData.type === "golem" && e.userData.alive);
                    return golem ? golem.position : null;
                }
                if (phase === PHASE.WEAPON) {
                    const zone = zones.find(z => z.id === "weapon" && !z.complete);
                    return zone ? zone.position : null;
                }
                if (phase === PHASE.EXPAND) {
                    if (eggPlace) return eggPlace.end || (camp.nestPos ? camp.nestPos.clone() : new THREE.Vector3(3.3, 1.1, 3.1));
                    if (!carryingEgg && eggPickup) return eggPickup.mesh.position;
                    if (carryingEgg && camp.stage >= 3 && camp.nestPos) return camp.nestPos.clone();
                    const zone = zones.find(z => z.id === "expand" && !z.complete);
                    return zone ? zone.position : new THREE.Vector3(-2.1, 0, 5.4);
                }
                if (phase === PHASE.HATCH) {
                    if (coins >= CONFIG.dragonCost) {
                        const zone = zones.find(z => z.id === "dragon" && !z.complete);
                        return zone ? zone.position : new THREE.Vector3(-2.1, 0, 5.4);
                    }
                    return boss && boss.userData.alive ? boss.position : null;
                }
                if (phase === PHASE.BOSS_PRESSURE || phase === PHASE.BOSS_FINAL) {
                    return boss && boss.userData.alive ? boss.position : null;
                }
                if (phase === PHASE.COMPLETE) {
                    const zone = zones.find(z => (z.id === "end-camp" || z.id === "end-hero") && !z.complete);
                    return zone ? zone.position : new THREE.Vector3(0, 0, 4);
                }
                return null;
            }

            function updateGuideArrow() {
                const target = getGuidePosition();
                if (!target || phase === PHASE.WAITING) {
                    ui.guide.style.display = "none";
                    return;
                }
                const p = target.clone().add(new THREE.Vector3(0, 1.2, 0)).project(camera);
                const onScreen = p.z < 1 && Math.abs(p.x) < 0.78 && Math.abs(p.y) < 0.72;
                if (onScreen) {
                    ui.guide.style.display = "none";
                    return;
                }
                let x = p.x;
                let y = -p.y;
                if (p.z > 1) {
                    x = -x;
                    y = -y;
                }
                const angle = Math.atan2(y, x);
                const radiusX = Math.max(60, innerWidth / 2 - 50);
                const radiusY = Math.max(100, innerHeight / 2 - 125);
                const screenX = innerWidth / 2 + Math.cos(angle) * radiusX;
                const screenY = innerHeight / 2 + Math.sin(angle) * radiusY;
                ui.guide.style.display = "flex";
                ui.guide.style.left = `${THREE.MathUtils.clamp(screenX, 48, innerWidth - 48)}px`;
                ui.guide.style.top = `${THREE.MathUtils.clamp(screenY, 115, innerHeight - 72)}px`;
                ui.guide.style.transform = `translate(-50%, -50%) rotate(${angle + Math.PI / 2}rad)`;
            }

            function updatePlayer(dt, elapsed) {
                const keyboardX = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
                const keyboardZ = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);
                let dx = stick.x * stick.magnitude + keyboardX;
                let dz = stick.z * stick.magnitude + keyboardZ;
                const len = Math.hypot(dx, dz);
                const inputStrength = Math.min(1, len);
                const targetVelocity = new THREE.Vector3();
                if (len > 0.08) {
                    dx /= len;
                    dz /= len;
                    targetVelocity.set(dx * CONFIG.playerSpeed * inputStrength, 0, dz * CONFIG.playerSpeed * inputStrength);
                }
                const response = len > 0.08 ? CONFIG.playerAcceleration : CONFIG.playerDeceleration;
                moveVelocity.lerp(targetVelocity, 1 - Math.exp(-response * dt));
                if (moveVelocity.lengthSq() < 0.0025) moveVelocity.set(0, 0, 0);

                const next = resolvePlayerMove(player.position, moveVelocity, dt);
                player.position.copy(next);
                const speedRatio = Math.min(1, moveVelocity.length() / CONFIG.playerSpeed);
                if (speedRatio > 0.03) {
                    const moveAngle = Math.atan2(moveVelocity.x, moveVelocity.z);
                    player.rotation.y = lerpAngle(player.rotation.y, moveAngle, 1 - Math.exp(-14 * dt));
                }

                const walk = Math.sin(elapsed * 11) * speedRatio;
                playerVisual.position.y = Math.abs(Math.sin(elapsed * 11)) * 0.075 * speedRatio;
                playerVisual.rotation.z = -moveVelocity.x / CONFIG.playerSpeed * 0.055;
                playerLeftLeg.rotation.x = walk * 0.65;
                playerRightLeg.rotation.x = -walk * 0.65;
                if (carryingEgg) {
                    playerLeftArm.rotation.x = -0.55;
                    playerRightArm.rotation.x = -0.55;
                    playerLeftArm.rotation.z = 0.22;
                    playerRightArm.rotation.z = -0.22;
                    if (playerWeapon) playerWeapon.visible = false;
                } else {
                    playerLeftArm.rotation.x = -walk * 0.35;
                    playerRightArm.rotation.x = walk * 0.35;
                    playerLeftArm.rotation.z = -0.15;
                    playerRightArm.rotation.z = 0.15;
                    if (playerWeapon) playerWeapon.visible = true;
                }
                playerCape.rotation.x = -0.16 - speedRatio * 0.22 + Math.sin(elapsed * 7) * 0.025;

                if (playerWeapon.userData.swing > 0) {
                    playerWeapon.userData.swing = Math.max(0, playerWeapon.userData.swing - dt * 4.8);
                    const swing = Math.sin((1 - playerWeapon.userData.swing) * Math.PI);
                    playerWeapon.rotation.z = playerWeapon.userData.baseRotationZ - swing * 1.1;
                    playerRightArm.rotation.x -= swing * 0.8;
                } else {
                    playerWeapon.rotation.z = playerWeapon.userData.baseRotationZ;
                }
                if (attackLunge > 0) {
                    attackLunge = Math.max(0, attackLunge - dt * 5.5);
                    playerVisual.position.z = Math.sin((1 - attackLunge) * Math.PI) * 0.28;
                } else {
                    playerVisual.position.z = 0;
                }
                playerRing.material.opacity = 0.68 + Math.sin(performance.now() * 0.005) * 0.17;

                attackTimer -= dt;
                if (carryingEgg) return;
                const target = nearestTarget(player.position, CONFIG.attackRange);
                if (target && attackTimer <= 0 && phase !== PHASE.WAITING) {
                    attackTimer = weaponLevel > 1 ? CONFIG.upgradedCooldown : CONFIG.attackCooldown;
                    const targetAngle = Math.atan2(target.position.x - player.position.x, target.position.z - player.position.z);
                    player.rotation.y = lerpAngle(player.rotation.y, targetAngle, 0.72);
                    playerAttack(target);
                }
            }

            function resolvePlayerMove(position, velocity, dt) {
                const result = position.clone();
                const targetX = THREE.MathUtils.clamp(
                    result.x + velocity.x * dt,
                    CONFIG.worldMinX,
                    CONFIG.worldMaxX
                );
                if (!isBlocked(targetX, result.z)) result.x = targetX;
                else moveVelocity.x = 0;

                const targetZ = THREE.MathUtils.clamp(
                    result.z + velocity.z * dt,
                    CONFIG.worldMinZ,
                    CONFIG.worldMaxZ
                );
                if (!isBlocked(result.x, targetZ)) result.z = targetZ;
                else moveVelocity.z = 0;
                return result;
            }

            function isBlocked(x, z) {
                const radius = CONFIG.playerRadius;
                if (Math.abs(x) > corridorHalfWidth(z) - radius) return true;
                const campBlocked = campColliders.some(collider =>
                    x + radius > collider.minX &&
                    x - radius < collider.maxX &&
                    z + radius > collider.minZ &&
                    z - radius < collider.maxZ
                );
                if (campBlocked) return true;
                return mineColliders.some(collider => mineCellsBlockPosition(collider, x, z, radius));
            }

            function mineCellsBlockPosition(collider, x, z, radius) {
                const gate = collider.gate;
                if (!gate || !gate.userData.alive) return false;
                for (const part of gate.userData.shellParts) {
                    if (part.userData.removed) continue;
                    const partBottom =
                        gate.position.y +
                        part.position.y -
                        gate.userData.cellHeight * 0.5;
                    if (partBottom >= CONFIG.playerClearance) continue;
                    const centerX = gate.position.x + part.position.x;
                    const centerZ = gate.position.z + part.position.z;
                    if (
                        Math.abs(x - centerX) < gate.userData.cellWidth * 0.5 + radius &&
                        Math.abs(z - centerZ) < gate.userData.cellDepth * 0.5 + radius
                    ) {
                        return true;
                    }
                }
                return false;
            }

            function lerpAngle(from, to, amount) {
                let delta = (to - from + Math.PI) % (Math.PI * 2) - Math.PI;
                if (delta < -Math.PI) delta += Math.PI * 2;
                return from + delta * amount;
            }

            function playerAttack(target) {
                const mining = target.userData.type === "mine";
                const lockedMine = mining && target.userData.locked;
                const strikeSequence = lockedMine
                    ? 1
                    : mining
                        ? (weaponLevel > 1 || ((target.userData.mineHits || 0) + 1) % 3 === 0 ? 3 : 1)
                        : attackSequence % 3 + 1;
                attackSequence = strikeSequence;
                playerWeapon.userData.swing = 1;
                attackLunge = lockedMine ? 0.45 : 1;
                const color = lockedMine ? 0x6e7a88 : weaponLevel > 1 ? 0x72e8ff : 0x78bfff;
                createAttackArc(color, strikeSequence);
                setTimeout(() => {
                    if (!target.userData.alive) return;
                    let damage = weaponLevel > 1 ? 520 : 235;
                    let shown = damage;
                    if (target.userData.type === "boss") {
                        damage = strikeSequence === 3 ? 310 : 220;
                        shown = strikeSequence === 3 ? 788 : strikeSequence === 2 ? 355 : 235;
                    } else if (strikeSequence === 3) {
                        damage = 788;
                        shown = 788;
                    }
                    const impactColor = lockedMine ? 0x6b5678 : target.userData.type === "mine" ? 0xc85cff : color;
                    const impactPosition = target.userData.type === "mine"
                        ? mineSurfacePoint(target, player.position)
                        : target.position.clone().add(new THREE.Vector3(0, 1.4, 0));
                    buildPopEffect(
                        impactPosition,
                        lockedMine ? 3 : strikeSequence === 3 ? 13 : 7,
                        impactColor
                    );
                    if (target.userData.type === "golem" || target.userData.type === "boss") {
                        const knockback = target.position.clone().sub(player.position).setY(0).normalize();
                        const strength = target.userData.type === "boss" ? 0.28 : strikeSequence === 3 ? 2.6 : 1.0;
                        target.userData.knockback = knockback.multiplyScalar(strength);
                        target.userData.stagger = target.userData.type === "boss" ? 0.06 : strikeSequence === 3 ? 0.2 : 0.09;
                    }
                    if (!lockedMine) {
                        cameraShake = Math.max(cameraShake, strikeSequence === 3 ? 0.2 : 0.08);
                    }
                    damageTarget(target, damage, shown, shown >= 700);
                    playSound(mining ? "crack" : strikeSequence === 3 ? "hit" : "attack");
                }, strikeSequence === 3 ? 150 : 105);
                playSound("attack");
            }

            function createAttackArc(color, sequence) {
                const radius = sequence === 3 ? 1.65 : 1.25;
                const arc = new THREE.Mesh(
                    new THREE.TorusGeometry(radius, sequence === 3 ? 0.13 : 0.08, 6, 28, Math.PI * 1.35),
                    new THREE.MeshBasicMaterial({
                        color,
                        transparent: true,
                        opacity: sequence === 3 ? 0.95 : 0.72,
                        side: THREE.DoubleSide
                    })
                );
                const forward = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
                arc.position.copy(player.position).add(forward.multiplyScalar(1.05));
                arc.position.y = 1.35;
                arc.rotation.y = player.rotation.y;
                arc.rotation.z = sequence === 2 ? 0.45 : -0.65;
                scene.add(arc);
                effects.push({ type: "slash", mesh: arc, life: 0.24, maxLife: 0.24 });
            }

            function createProjectile(origin, target, color, speed, onHit) {
                const mesh = new THREE.Mesh(
                    new THREE.SphereGeometry(0.14, 8, 6),
                    new THREE.MeshBasicMaterial({ color })
                );
                mesh.position.copy(origin);
                scene.add(mesh);
                projectiles.push({ mesh, target, speed, onHit, life: 1.5 });
            }

            function updateProjectiles(dt) {
                for (let i = projectiles.length - 1; i >= 0; i--) {
                    const p = projectiles[i];
                    p.life -= dt;
                    if (!p.target || !p.target.userData.alive || p.life <= 0) {
                        scene.remove(p.mesh);
                        projectiles.splice(i, 1);
                        continue;
                    }
                    const targetPos = p.target.position.clone().add(new THREE.Vector3(0, p.target.userData.type === "boss" ? 3.4 : 1.4, 0));
                    const dir = targetPos.sub(p.mesh.position);
                    const distance = dir.length();
                    if (distance < 0.45) {
                        scene.remove(p.mesh);
                        projectiles.splice(i, 1);
                        p.onHit();
                    } else {
                        p.mesh.position.add(dir.normalize().multiplyScalar(p.speed * dt));
                    }
                }
            }

            function updateEnemies(dt) {
                for (const enemy of enemies) {
                    if (!enemy.userData.alive) continue;
                    if (enemy.userData.emerging > 0) {
                        enemy.userData.emerging = Math.max(0, enemy.userData.emerging - dt);
                        const remaining = enemy.userData.emerging / enemy.userData.emergeDuration;
                        enemy.position.y = -enemy.userData.emergeDepth * remaining;
                        enemy.rotation.y += dt * 1.8;
                        continue;
                    }
                    if (enemy.userData.stagger > 0) {
                        enemy.userData.stagger = Math.max(0, enemy.userData.stagger - dt);
                        if (enemy.userData.knockback) {
                            enemy.position.addScaledVector(enemy.userData.knockback, dt);
                            enemy.userData.knockback.multiplyScalar(Math.exp(-10 * dt));
                        }
                        continue;
                    }
                    if (enemy.userData.frozenFor > 0) {
                        enemy.userData.frozenFor -= dt;
                        continue;
                    }
                    if (enemy.userData.type === "boss" && enemy.userData.shielded) {
                        enemy.rotation.y += dt * 0.25;
                        enemy.userData.shield.rotation.y += dt * 0.5;
                        continue;
                    }
                    const distance = flatDistance(enemy.position, player.position);
                    if (distance > enemy.userData.attackRange) {
                        const dir = player.position.clone().sub(enemy.position);
                        dir.y = 0;
                        if (dir.lengthSq() > 0.01) {
                            dir.normalize();
                            enemy.position.addScaledVector(dir, enemy.userData.speed * dt);
                            enemy.rotation.y = Math.atan2(dir.x, dir.z);
                        }
                    } else {
                        enemy.userData.attackCooldown -= dt;
                        if (enemy.userData.attackCooldown <= 0) {
                            enemy.userData.attackCooldown = enemy.userData.type === "boss" ? 2.25 : 1.45;
                            if (enemy.userData.type === "boss") createBossHazard();
                            else damagePlayer(enemy.userData.damage);
                        }
                    }
                }
            }

            function createBossHazard() {
                if (!boss || !boss.userData.alive) return;
                const mesh = new THREE.Mesh(new THREE.RingGeometry(0.2, 3.5, 40), shared.redMat.clone());
                mesh.rotation.x = -Math.PI / 2;
                mesh.position.copy(player.position);
                mesh.position.y = 0.08;
                mesh.scale.setScalar(0.08);
                scene.add(mesh);
                hazards.push({ mesh, time: 0, duration: 1.05, radius: 3.5, exploded: false });
                playSound("warn");
            }

            function updateHazards(dt) {
                for (let i = hazards.length - 1; i >= 0; i--) {
                    const h = hazards[i];
                    h.time += dt;
                    const progress = Math.min(1, h.time / h.duration);
                    h.mesh.scale.setScalar(progress);
                    h.mesh.material.opacity = 0.2 + progress * 0.32;
                    if (!h.exploded && h.time >= h.duration) {
                        h.exploded = true;
                        h.mesh.material.opacity = 0.75;
                        cameraShake = 0.6;
                        buildPopEffect(h.mesh.position, 20, 0xff3b2e);
                        if (flatDistance(player.position, h.mesh.position) < h.radius) damagePlayer(11);
                        playSound("hit");
                    }
                    if (h.time > h.duration + 0.28) {
                        scene.remove(h.mesh);
                        hazards.splice(i, 1);
                    }
                }
            }

            function updateDragon(dt, elapsed) {
                if (!dragon) return;
                const targetPosition = player.position.clone().add(new THREE.Vector3(2.5, 2.25 + Math.sin(elapsed * 3) * 0.18, 2.2));
                dragon.position.lerp(targetPosition, 1 - Math.pow(0.002, dt));
                dragon.rotation.y = player.rotation.y;
                dragon.children.forEach(child => {
                    if (child.userData.side) child.rotation.z = child.userData.side * Math.sin(elapsed * 8) * 0.38;
                });

                dragonAttackTimer -= dt;
                const target = nearestTarget(dragon.position, 16);
                if (target && dragonAttackTimer <= 0) {
                    dragonAttackTimer = 0.48;
                    dragonBeam(target);
                }
            }

            function dragonBeam(target) {
                const start = dragon.position.clone().add(new THREE.Vector3(0, 0.15, 0.7));
                const end = target.position.clone().add(new THREE.Vector3(0, target.userData.type === "boss" ? 3.4 : 1.4, 0));
                const dir = end.clone().sub(start);
                const length = dir.length();
                const beam = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.08, 0.16, length, 8),
                    new THREE.MeshBasicMaterial({ color: 0xa9f7ff, transparent: true, opacity: 0.88 })
                );
                beam.position.copy(start).add(end).multiplyScalar(0.5);
                beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
                scene.add(beam);
                effects.push({ type: "beam", mesh: beam, life: 0.13 });
                const damage = target.userData.type === "boss" ? 285 : 650;
                damageTarget(target, damage, Math.random() < 0.28 ? 1442 : 478, true);
                target.userData.frost = (target.userData.frost || 0) + 1;
                if (target.userData.type === "boss" && target.userData.frost >= 7) {
                    target.userData.frost = 0;
                    freezeBoss(1.45);
                }
                playSound("ice");
            }

            function freezeBoss(duration) {
                if (!boss || !boss.userData.alive) return;
                boss.userData.frozenFor = duration;
                boss.traverse(child => {
                    if (child.isMesh && child !== boss.userData.shield) {
                        child.userData.originalMaterial = child.material;
                        child.material = new THREE.MeshStandardMaterial({
                            color: 0xb9efff, emissive: 0x174c68, transparent: true, opacity: 0.82
                        });
                    }
                });
                toast("冻结");
                setTimeout(() => {
                    if (!boss || !boss.userData.alive) return;
                    boss.traverse(child => {
                        if (child.isMesh && child.userData.originalMaterial) {
                            child.material = child.userData.originalMaterial;
                            delete child.userData.originalMaterial;
                        }
                    });
                }, duration * 1000);
            }

            function strikeMine(target) {
                if (!target.userData.alive || target.userData.collapsing) return;
                if (target.userData.locked) {
                    strikeLockedMine(target);
                    return;
                }
                if (target.userData.id === "mine-start" && !openingGuide.complete) {
                    completeOpeningGuide();
                }
                chipMineLocally(target);
            }

            function strikeLockedMine(target) {
                target.userData.lockedHits = (target.userData.lockedHits || 0) + 1;
                if (target.userData.lockedHits >= 2 && !target.userData.weakHinted) {
                    target.userData.weakHinted = true;
                    toast("装备太弱，先回营强化");
                }
            }

            function sampleMinePartsSpatially(parts, count, target, impactX, impactY) {
                if (parts.length <= count) return parts.slice();
                const selected = [];
                const remaining = parts.slice();
                remaining.sort((a, b) => {
                    const distance = part => {
                        const dx = (part.position.x - impactX) / target.userData.cellWidth;
                        const dy = (part.position.y - impactY) / target.userData.cellHeight;
                        return dx * dx + dy * dy;
                    };
                    return distance(a) - distance(b);
                });
                selected.push(remaining.shift());
                while (selected.length < count && remaining.length) {
                    let bestIndex = 0;
                    let bestSpread = -Infinity;
                    for (let i = 0; i < remaining.length; i++) {
                        const candidate = remaining[i];
                        let nearestSelected = Infinity;
                        for (const chosen of selected) {
                            const dx = (candidate.position.x - chosen.position.x) / target.userData.cellWidth;
                            const dy = (candidate.position.y - chosen.position.y) / target.userData.cellHeight;
                            const dz = (candidate.position.z - chosen.position.z) / target.userData.cellDepth;
                            nearestSelected = Math.min(nearestSelected, dx * dx + dy * dy + dz * dz * 0.65);
                        }
                        const variation = ((candidate.userData.seed * 23) % 31) / 80;
                        const spread = nearestSelected + variation;
                        if (spread > bestSpread) {
                            bestSpread = spread;
                            bestIndex = i;
                        }
                    }
                    selected.push(remaining.splice(bestIndex, 1)[0]);
                }
                return selected;
            }

            function chipMineLocally(target) {
                target.userData.mineHits++;
                const impactX = THREE.MathUtils.clamp(
                    player.position.x - target.position.x,
                    -target.userData.slabWidth * 0.46,
                    target.userData.slabWidth * 0.46
                );
                const impactY = Math.min(
                    target.userData.slabHeight * 0.43,
                    CONFIG.playerClearance * 0.84
                );
                target.userData.impactX = impactX;
                target.userData.impactY = impactY;
                const available = target.userData.shellParts.filter(part => !part.userData.removed);
                const pathCandidates = available.filter(part => {
                    const bottom = part.position.y - target.userData.cellHeight * 0.5;
                    const horizontalReach =
                        target.userData.cellWidth * 0.5 +
                        CONFIG.playerRadius +
                        0.28;
                    return (
                        bottom < CONFIG.playerClearance &&
                        Math.abs(part.position.x - impactX) < horizontalReach
                    );
                });
                const currentLayer = pathCandidates.length
                    ? Math.min(...pathCandidates.map(part => part.userData.layer))
                    : Math.min(...available.map(part => part.userData.layer));
                target.userData.activeLayer = currentLayer;
                const frontPathParts = pathCandidates
                    .filter(part => part.userData.layer === currentLayer)
                    .sort((a, b) => {
                        const score = part => {
                            const dx = Math.abs(part.position.x - impactX) / target.userData.cellWidth;
                            const dy = Math.abs(part.position.y - impactY) / target.userData.cellHeight;
                            return dx * 0.7 + dy * 0.3;
                        };
                        return score(a) - score(b);
                    });
                const normalRemoved = Math.ceil(
                    target.userData.totalCells / (weaponLevel > 1 ? 4 : 6)
                );
                const finalHit = available.length <= normalRemoved;
                const selectedSet = new Set();
                if (!finalHit && frontPathParts.length) {
                    const pathTakeCount = Math.max(1, Math.ceil(frontPathParts.length * 0.55));
                    const groundPathParts = frontPathParts.filter(
                        part => part.userData.row === 0
                    );
                    for (const part of groundPathParts) selectedSet.add(part);
                    for (const part of frontPathParts) {
                        if (selectedSet.size >= pathTakeCount) break;
                        selectedSet.add(part);
                    }
                }
                const protectedPathParts = new Set(pathCandidates);
                const rankedParts = available
                    .filter(part => !selectedSet.has(part) && !protectedPathParts.has(part))
                    .sort((a, b) => {
                        const score = part => {
                            const dx = Math.abs(part.position.x - impactX) / target.userData.cellWidth;
                            const dy = Math.abs(part.position.y - impactY) / target.userData.cellHeight;
                            const depth = part.userData.layer * 2.35;
                            const variation = ((part.userData.seed * 17) % 23) / 46;
                            return dx * 0.8 + dy * 0.72 + depth + variation;
                        };
                        return score(a) - score(b);
                    });
                for (const part of rankedParts) {
                    if (selectedSet.size >= normalRemoved) break;
                    selectedSet.add(part);
                }
                const normalParts = Array.from(selectedSet);
                const removedParts = finalHit ? available : normalParts;
                const impactPosition = new THREE.Vector3(
                    target.position.x + impactX,
                    impactY,
                    target.position.z + target.userData.slabDepth * 0.5 -
                        currentLayer * target.userData.cellDepth
                );
                const heroParts = sampleMinePartsSpatially(
                    removedParts,
                    finalHit ? 18 : 8,
                    target,
                    impactX,
                    impactY
                );
                const heroPartSet = new Set(heroParts);
                const heroPartOrder = new Map(heroParts.map((part, index) => [part, index]));
                for (let i = 0; i < removedParts.length; i++) {
                    const part = removedParts[i];
                    part.userData.removed = true;
                    const heroIndex = heroPartOrder.get(part);
                    const releaseVisual = () => {
                        part.visible = false;
                        if (heroPartSet.has(part)) {
                            launchMineChunk(
                                target,
                                part,
                                (finalHit ? 0.44 : 0.32) + heroIndex * 0.012,
                                heroIndex < (finalHit ? 5 : 2)
                            );
                        }
                    };
                    if (finalHit) {
                        const dx = (part.position.x - impactX) / target.userData.cellWidth;
                        const dy = (part.position.y - impactY) / target.userData.cellHeight;
                        const delay = Math.min(
                            260,
                            Math.hypot(dx, dy) * 24 + (part.userData.seed % 41)
                        );
                        setTimeout(releaseVisual, delay);
                    } else {
                        releaseVisual();
                    }
                }
                target.userData.remainingCells -= removedParts.length;
                releaseCoinsForRemovedParts(target, removedParts);
                updateLockedCoinExposure(target);
                joltLockedCoins(target);
                cameraShake = Math.max(cameraShake, finalHit ? 0.72 : 0.24);
                cameraMinePunch = Math.max(cameraMinePunch, finalHit ? 0.68 : 0.32);
                buildMineDust(impactPosition, finalHit ? 10 : 4, finalHit ? 1.65 : 0.85);
                for (let i = 0; i < heroParts.length; i += Math.max(1, Math.floor(heroParts.length / 5))) {
                    const dustPosition = new THREE.Vector3();
                    heroParts[i].getWorldPosition(dustPosition);
                    buildMineDust(dustPosition, finalHit ? 3 : 2, finalHit ? 0.72 : 0.48);
                }
                buildPopEffect(impactPosition, finalHit ? 24 : 10, 0xc975ee);
                if (finalHit && !target.userData.finalRevealTriggered) {
                    target.userData.finalRevealTriggered = true;
                    const revealPosition = new THREE.Vector3(
                        target.position.x + impactX,
                        0,
                        THREE.MathUtils.clamp(
                            impactPosition.z,
                            target.userData.collider.minZ + 0.65,
                            target.userData.collider.maxZ - 0.65
                        )
                    );
                    if (typeof target.userData.onFinalCollapse === "function") {
                        target.userData.onFinalCollapse(revealPosition);
                    }
                }
                if (target.userData.remainingCells <= 0) {
                    target.userData.collapsing = true;
                    target.userData.attackable = false;
                    cameraShake = 0.55;
                    cameraMinePunch = 0.55;
                    setTimeout(() => {
                        if (target.userData.alive) killTarget(target);
                    }, 340);
                }
            }

            function launchMineChunk(target, part, force, central) {
                const chunk = new THREE.Mesh(part.geometry.clone(), part.material.clone());
                part.getWorldPosition(chunk.position);
                part.getWorldQuaternion(chunk.quaternion);
                part.getWorldScale(chunk.scale);
                chunk.material.transparent = true;
                chunk.material.depthWrite = true;
                chunk.castShadow = true;
                scene.add(chunk);
                chunk.geometry.computeBoundingBox();
                const chunkSize = new THREE.Vector3();
                chunk.geometry.boundingBox.getSize(chunkSize);
                chunkSize.multiply(new THREE.Vector3(
                    Math.abs(chunk.scale.x),
                    Math.abs(chunk.scale.y),
                    Math.abs(chunk.scale.z)
                ));

                const towardCamera = player.position.clone().sub(target.position).setY(0);
                if (towardCamera.lengthSq() < 0.01) towardCamera.set(0, 0, 1);
                towardCamera.normalize();
                const side = chunk.position.x < target.position.x ? -1 : 1;
                const velocity = towardCamera.multiplyScalar(central ? 6.8 : 4.2 + Math.random() * 1.6)
                    .add(new THREE.Vector3(side * (central ? 0.8 : 2.1), central ? 5.6 : 3.8 + Math.random() * 2.1, 0))
                    .multiplyScalar(force);
                effects.push({
                    type: "mineChunk",
                    mesh: chunk,
                    velocity,
                    life: 1.22 + Math.random() * 0.2,
                    grounded: false,
                    rest: 0,
                    bounces: 0,
                    rotationVelocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 5.5,
                        (Math.random() - 0.5) * 4,
                        (Math.random() - 0.5) * 5.5
                    ),
                    baseOpacity: chunk.material.opacity,
                    groundY: Math.max(0.35, chunkSize.y * 0.42)
                });
            }

            function damageTarget(target, amount, shownAmount, big) {
                if (!target.userData.alive) return;
                if (target.userData.type === "mine") {
                    strikeMine(target);
                    return;
                }
                if (target.userData.shielded) {
                    showDamage(target.position, "护盾", true);
                    return;
                }
                target.userData.hp -= amount;
                showDamage(target.position, `-${Math.round(shownAmount)}`, big);
                flashTarget(target);
                if (target.userData.healthFill) {
                    const ratio = Math.max(0, target.userData.hp / target.userData.maxHp);
                    target.userData.healthFill.scale.x = ratio;
                    target.userData.healthFill.position.x = -(1 - ratio) * 1.2;
                }
                if (target.userData.type === "boss") {
                    updateBossUI();
                    target.userData.playerHits = (target.userData.playerHits || 0) + 1;
                    if (!bossThresholdTriggered && phase === PHASE.BOSS_PRESSURE &&
                        target.userData.playerHits >= CONFIG.bossShieldHits) {
                        triggerBossPressureBreak();
                    } else if (phase === PHASE.BOSS_FINAL && !target.userData.shielded && target.userData.hp > 0) {
                        dropCoins(target.position.clone().add(new THREE.Vector3(0, 2.2, 0)), CONFIG.bossHitCoinDrop);
                    }
                }
                if (target.userData.hp <= 0) killTarget(target);
            }

            function triggerBossPressureBreak() {
                bossThresholdTriggered = true;
                phase = PHASE.HATCH;
                boss.userData.shielded = true;
                boss.userData.shield.visible = true;
                dropCoins(boss.position, 25);
                toast("护盾无法击破，收集金币回营孵龙");
            }

            function killTarget(target) {
                if (!target.userData.alive) return;
                target.userData.alive = false;
                target.userData.attackable = false;
                dropCoins(target.position, target.userData.drop || 0);
                if (target.userData.type !== "mine") buildDeathDebris(target);
                scene.remove(target);
                if (target.userData.type === "mine" && target.userData.collider) {
                    const colliderIndex = mineColliders.indexOf(target.userData.collider);
                    if (colliderIndex >= 0) mineColliders.splice(colliderIndex, 1);
                    cameraShake = 0.9;
                }
                if (target.userData.type === "boss") {
                    ui.boss.style.display = "none";
                    phase = PHASE.REWARD;
                    playSound("bossDeath");
                    cameraShake = 1.25;
                    checkProgressFromCoins();
                } else {
                    playSound("break");
                }
                if (typeof target.userData.onDeath === "function") target.userData.onDeath();
            }

            function flashTarget(target) {
                target.traverse(child => {
                    if (!child.isMesh || child === target.userData.healthFill) return;
                    if (!child.material) return;
                    if (child.material.transparent && target.userData.type !== "mine") return;
                    const original = child.material.emissive ? child.material.emissive.getHex() : null;
                    if (child.material.emissive) {
                        child.material.emissive.setHex(0xffffff);
                        setTimeout(() => {
                            if (child.material && child.material.emissive) child.material.emissive.setHex(original || 0x000000);
                        }, 65);
                    }
                });
            }

            function buildDeathDebris(target) {
                const count = target.userData.type === "boss" ? 32 : target.userData.type === "mine" ? 34 : 14;
                const color = target.userData.type === "mine" ? 0x963bd0 : 0x69616d;
                for (let i = 0; i < count; i++) {
                    const mesh = new THREE.Mesh(
                        new THREE.TetrahedronGeometry(target.userData.type === "boss" ? 0.32 : target.userData.type === "mine" ? 0.3 : 0.2),
                        new THREE.MeshStandardMaterial({ color, roughness: 0.8 })
                    );
                    mesh.position.copy(target.position).add(new THREE.Vector3(
                        (Math.random() - 0.5) * 2,
                        0.7 + Math.random() * 2.5,
                        (Math.random() - 0.5) * 2
                    ));
                    scene.add(mesh);
                    effects.push({
                        type: "debris",
                        mesh,
                        velocity: new THREE.Vector3((Math.random() - 0.5) * 6, 4 + Math.random() * 5, (Math.random() - 0.5) * 6),
                        life: 1.2 + Math.random() * 0.7
                    });
                }
            }

            function dropCoins(position, count) {
                for (let i = 0; i < count; i++) {
                    const mesh = createCoinBundleMesh(i % 4 === 0 ? 2 : 1);
                    mesh.position.copy(position).add(new THREE.Vector3(0, 1 + Math.random() * 1.3, 0));
                    scene.add(mesh);
                    const angle = Math.random() * Math.PI * 2;
                    const speed = 1.5 + Math.random() * 4.5;
                    coinDrops.push({
                        mesh,
                        value: 1,
                        velocity: new THREE.Vector3(Math.cos(angle) * speed, 3 + Math.random() * 3.5, Math.sin(angle) * speed),
                        grounded: false,
                        bob: Math.random() * 10
                    });
                }
            }

            function keepCoinInsideWalkableArea(coin) {
                const position = coin.mesh.position;
                const minZ = CONFIG.worldMinZ + 0.8;
                const maxZ = CONFIG.worldMaxZ - 0.8;
                if (position.z < minZ) {
                    position.z = minZ;
                    coin.velocity.z = Math.abs(coin.velocity.z) * 0.35;
                } else if (position.z > maxZ) {
                    position.z = maxZ;
                    coin.velocity.z = -Math.abs(coin.velocity.z) * 0.35;
                }
                const safeHalfWidth = Math.max(1.15, corridorHalfWidth(position.z) - 0.82);
                if (position.x < -safeHalfWidth) {
                    position.x = -safeHalfWidth;
                    coin.velocity.x = Math.abs(coin.velocity.x) * 0.35;
                } else if (position.x > safeHalfWidth) {
                    position.x = safeHalfWidth;
                    coin.velocity.x = -Math.abs(coin.velocity.x) * 0.35;
                }
            }

            function updateCoins(dt, elapsed) {
                for (let i = coinDrops.length - 1; i >= 0; i--) {
                    const coin = coinDrops[i];
                    coin.mesh.rotation.z += dt * 6;
                    if (!coin.grounded) {
                        coin.velocity.y -= 12 * dt;
                        coin.mesh.position.addScaledVector(coin.velocity, dt);
                        if (coin.mesh.position.y <= 0.42) {
                            coin.mesh.position.y = 0.42;
                            coin.velocity.set(0, 0, 0);
                            coin.grounded = true;
                        }
                    } else {
                        coin.mesh.position.y = 0.48 + Math.sin(elapsed * 4 + coin.bob) * 0.12;
                        const distance = flatDistance(coin.mesh.position, player.position);
                        if (distance < 5.2) {
                            const target = player.position.clone().add(new THREE.Vector3(0, 1, 0));
                            coin.mesh.position.lerp(target, 1 - Math.pow(0.0003, dt));
                        }
                    }
                    keepCoinInsideWalkableArea(coin);
                    if (coin.mesh.position.distanceTo(player.position.clone().add(new THREE.Vector3(0, 0.8, 0))) < 0.75) {
                        coins += coin.value;
                        scene.remove(coin.mesh);
                        coinDrops.splice(i, 1);
                        updateUI();
                        playSound("coin");
                        checkProgressFromCoins();
                    }
                }
            }

            function checkProgressFromCoins() {
                refreshBuildZoneAvailability();
                if (phase === PHASE.REWARD && !futureZonesShown) {
                    futureZonesShown = true;
                    showEndUpgrades();
                }
            }

            function showEndUpgrades() {
                phase = PHASE.COMPLETE;
                toast("继续强化领地");
                const campZone = createZone("end-camp", "强化营地", CONFIG.endUpgradeCost, new THREE.Vector3(-2.8, 0, 3.2), true, triggerCtaFromUpgrade);
                const heroZone = createZone("end-hero", "升级英雄", CONFIG.endUpgradeCost, new THREE.Vector3(-1.3, 0, 6.4), true, triggerCtaFromUpgrade);
                campZone.tease = true;
                heroZone.tease = true;
            }

            function triggerCtaFromUpgrade() {
                if (ctaOpen || endScheduled) return;
                endScheduled = true;
                setTimeout(showEndScreen, 280);
            }

            function flyCoinTo(position) {
                const mesh = new THREE.Mesh(shared.coin, shared.coinMat);
                mesh.position.copy(player.position).add(new THREE.Vector3(0, 1.3, 0));
                scene.add(mesh);
                effects.push({ type: "payCoin", mesh, target: position.clone().add(new THREE.Vector3(0, 0.7, 0)), life: 0.35 });
            }

            function buildPopEffect(position, count, color) {
                let material = shared.sparkMaterials.get(color);
                if (!material) {
                    material = new THREE.MeshBasicMaterial({ color });
                    shared.sparkMaterials.set(color, material);
                }
                for (let i = 0; i < count; i++) {
                    const mesh = shared.sparkPool.pop();
                    if (!mesh) break;
                    mesh.material = material;
                    mesh.visible = true;
                    mesh.scale.setScalar(0.7 + Math.random() * 0.8);
                    mesh.position.copy(position).add(new THREE.Vector3(0, 0.4, 0));
                    const angle = Math.random() * Math.PI * 2;
                    effects.push({
                        type: "pooledSpark",
                        mesh,
                        velocity: new THREE.Vector3(Math.cos(angle) * (1 + Math.random() * 4), 2 + Math.random() * 5, Math.sin(angle) * (1 + Math.random() * 4)),
                        life: 0.65 + Math.random() * 0.55
                    });
                }
            }

            function buildMineDust(position, count, spread) {
                for (let i = 0; i < count; i++) {
                    const material = new THREE.SpriteMaterial({
                        map: shared.mineDustTexture,
                        color: i % 4 === 0 ? 0xe77ad9 : 0x713195,
                        transparent: true,
                        opacity: 0.28 + Math.random() * 0.17,
                        depthWrite: false
                    });
                    const sprite = new THREE.Sprite(material);
                    sprite.position.copy(position).add(new THREE.Vector3(
                        (Math.random() - 0.5) * spread * 2.4,
                        (Math.random() - 0.5) * spread * 1.3,
                        (Math.random() - 0.5) * spread * 0.8
                    ));
                    const size = spread * (1.25 + Math.random() * 1.7);
                    sprite.scale.set(size, size, size);
                    scene.add(sprite);
                    const life = 0.72 + Math.random() * 0.55;
                    effects.push({
                        type: "mineDust",
                        mesh: sprite,
                        velocity: new THREE.Vector3(
                            (Math.random() - 0.5) * 1.8,
                            0.45 + Math.random() * 1.15,
                            0.6 + Math.random() * 1.8
                        ),
                        life,
                        maxLife: life,
                        baseOpacity: material.opacity,
                        growth: 1.4 + Math.random() * 1.6
                    });
                }
            }

            function updateEffects(dt, elapsed) {
                for (let i = effects.length - 1; i >= 0; i--) {
                    const e = effects[i];
                    if (e.type === "fire") {
                        e.mesh.position.y = e.baseY + Math.sin(elapsed * 8 + e.t) * 0.08;
                        e.mesh.scale.set(0.9 + Math.sin(elapsed * 11 + e.t) * 0.15, 1.35, 0.9);
                        continue;
                    }
                    if (e.delay > 0) {
                        e.delay -= dt;
                        continue;
                    }
                    e.life -= dt;
                    if (e.type === "campChunkRise") {
                        const progress = THREE.MathUtils.clamp(1 - e.life / e.maxLife, 0, 1);
                        const eased = easeOutBack(progress);
                        e.mesh.position.y = e.finalY - CONFIG.campRiseDepth * (1 - eased);
                        e.mesh.scale.set(
                            e.finalScale.x * (0.96 + eased * 0.04),
                            e.finalScale.y * (0.16 + eased * 0.84),
                            e.finalScale.z * (0.96 + eased * 0.04)
                        );
                        if (e.overlay) e.overlay.material.opacity = Math.pow(1 - progress, 1.35) * 0.72;
                        if (e.life <= 0) {
                            e.mesh.position.y = e.finalY;
                            e.mesh.scale.copy(e.finalScale);
                            if (e.overlay) {
                                e.overlay.visible = false;
                                e.overlay.material.opacity = 0;
                            }
                            if (e.mesh.userData.wall) e.mesh.userData.wall.castShadow = true;
                            effects.splice(i, 1);
                        }
                        continue;
                    } else if (e.type === "campChunkSink") {
                        const progress = THREE.MathUtils.clamp(1 - e.life / e.maxLife, 0, 1);
                        const eased = progress * progress * (3 - 2 * progress);
                        e.mesh.position.y = e.finalY - eased * 0.82;
                        e.mesh.scale.set(
                            e.finalScale.x,
                            e.finalScale.y * (1 - eased * 0.78),
                            e.finalScale.z
                        );
                        if (e.life <= 0) {
                            e.mesh.visible = false;
                            e.mesh.position.y = e.finalY;
                            e.mesh.scale.copy(e.finalScale);
                            effects.splice(i, 1);
                        }
                        continue;
                    } else if (e.type === "campFloorReveal") {
                        const progress = THREE.MathUtils.clamp(1 - e.life / e.maxLife, 0, 1);
                        const eased = 1 - Math.pow(1 - progress, 3);
                        e.mesh.scale.set(0.94 + eased * 0.06, 1, 0.94 + eased * 0.06);
                        if (e.life <= 0) {
                            e.mesh.scale.set(1, 1, 1);
                            effects.splice(i, 1);
                        }
                        continue;
                    } else if (e.type === "campGridFlash") {
                        const progress = THREE.MathUtils.clamp(1 - e.life / e.maxLife, 0, 1);
                        e.mesh.material.opacity = Math.sin(Math.PI * progress) * 0.9;
                        if (e.life <= 0) {
                            e.mesh.material.opacity = 0;
                            e.mesh.visible = false;
                            effects.splice(i, 1);
                        }
                        continue;
                    } else if (e.type === "campPulse") {
                        const progress = THREE.MathUtils.clamp(1 - e.life / e.maxLife, 0, 1);
                        e.mesh.scale.setScalar(0.45 + progress * 0.95);
                        e.mesh.userData.ring.material.opacity = Math.pow(1 - progress, 1.6) * 0.8;
                        e.mesh.userData.light.intensity =
                            e.mesh.userData.baseIntensity + Math.pow(1 - progress, 2) * 1.4;
                        if (e.life <= 0) {
                            e.mesh.visible = false;
                            e.mesh.userData.ring.material.opacity = 0;
                            e.mesh.userData.light.position.set(0, 1.2, 4);
                            e.mesh.userData.light.intensity = e.mesh.userData.baseIntensity;
                            effects.splice(i, 1);
                        }
                        continue;
                    } else if (e.type === "mineDust") {
                        e.mesh.position.addScaledVector(e.velocity, dt);
                        const growth = 1 + dt * e.growth;
                        e.mesh.scale.multiplyScalar(growth);
                        const progress = 1 - e.life / e.maxLife;
                        e.mesh.material.opacity = e.baseOpacity * Math.sin(Math.PI * Math.min(1, progress));
                    } else if (e.type === "mineChunk") {
                        if (!e.grounded) {
                            e.velocity.y -= 10 * dt;
                            e.mesh.position.addScaledVector(e.velocity, dt);
                            e.mesh.rotation.x += dt * e.rotationVelocity.x;
                            e.mesh.rotation.y += dt * e.rotationVelocity.y;
                            e.mesh.rotation.z += dt * e.rotationVelocity.z;
                            if (e.mesh.position.y <= e.groundY) {
                                e.mesh.position.y = e.groundY;
                                if (e.bounces < 1 && e.velocity.y < -1.3) {
                                    e.velocity.y *= -0.2;
                                    e.velocity.x *= 0.55;
                                    e.velocity.z *= 0.55;
                                    e.bounces++;
                                } else {
                                    e.velocity.set(0, 0, 0);
                                    e.grounded = true;
                                }
                            }
                        } else {
                            e.rest += dt;
                            if (e.rest > 0.25) {
                                e.mesh.position.y -= dt * 1.25;
                            }
                        }
                        if (e.life < 0.58) {
                            e.mesh.material.opacity = e.baseOpacity * Math.max(0, e.life / 0.58);
                        }
                    } else if (e.type === "beam") {
                        e.mesh.material.opacity = Math.max(0, e.life / 0.13);
                    } else if (e.type === "slash") {
                        const progress = 1 - e.life / e.maxLife;
                        e.mesh.material.opacity = Math.max(0, 1 - progress);
                        e.mesh.scale.setScalar(0.72 + progress * 0.58);
                    } else if (e.type === "payCoin") {
                        e.mesh.position.lerp(e.target, 1 - Math.pow(0.00001, dt));
                        e.mesh.rotation.z += dt * 10;
                    } else {
                        e.velocity.y -= 10 * dt;
                        e.mesh.position.addScaledVector(e.velocity, dt);
                        e.mesh.rotation.x += dt * 7;
                        e.mesh.rotation.z += dt * 5;
                        if (e.mesh.material.transparent) e.mesh.material.opacity = Math.max(0, e.life);
                    }
                    if (e.life <= 0) {
                        if (e.type === "pooledSpark") {
                            e.mesh.visible = false;
                            shared.sparkPool.push(e.mesh);
                        } else {
                            scene.remove(e.mesh);
                        }
                        effects.splice(i, 1);
                    }
                }
            }

            function damagePlayer(amount) {
                playerHp = Math.max(20, playerHp - amount);
                ui.hp.style.width = `${playerHp}%`;
                player.position.y = 0.12;
                setTimeout(() => { if (player) player.position.y = 0; }, 80);
                showDamage(player.position, `-${amount}`, false);
                cameraShake = 0.22;
                playSound("hit");
                setTimeout(() => {
                    playerHp = Math.min(100, playerHp + amount * 0.55);
                    ui.hp.style.width = `${playerHp}%`;
                }, 2400);
            }

            function nearestTarget(position, range) {
                let best = null;
                let bestDistance = range;
                for (const target of targets) {
                    if (!target.userData.alive) continue;
                    if (target.userData.attackable === false) continue;
                    if (target.userData.emerging > 0) continue;
                    const d = target.userData.type === "mine" && target.userData.collider
                        ? flatDistance(position, mineSurfacePoint(target, position))
                        : flatDistance(position, target.position);
                    if (target.userData.type === "mine" && d > CONFIG.mineRange) continue;
                    if (d < bestDistance) {
                        best = target;
                        bestDistance = d;
                    }
                }
                return best;
            }

            function mineSurfacePoint(target, position) {
                const collider = target.userData.collider;
                let bestPoint = new THREE.Vector3(
                    THREE.MathUtils.clamp(position.x, collider.minX, collider.maxX),
                    target.userData.impactY,
                    collider.maxZ
                );
                let bestDistance = Infinity;
                const remaining = target.userData.shellParts.filter(part => !part.userData.removed);
                const laneParts = remaining.filter(part => {
                    const centerX = target.position.x + part.position.x;
                    const bottom = part.position.y - target.userData.cellHeight * 0.5;
                    return (
                        bottom < CONFIG.playerClearance &&
                        Math.abs(centerX - position.x) <
                            target.userData.cellWidth * 0.5 + CONFIG.playerRadius + 0.32
                    );
                });
                const candidates = laneParts.length ? laneParts : remaining;
                for (const part of candidates) {
                    const centerX = target.position.x + part.position.x;
                    const centerZ = target.position.z + part.position.z;
                    const pointX = THREE.MathUtils.clamp(
                        position.x,
                        centerX - target.userData.cellWidth * 0.5,
                        centerX + target.userData.cellWidth * 0.5
                    );
                    const pointZ = THREE.MathUtils.clamp(
                        position.z,
                        centerZ - target.userData.cellDepth * 0.5,
                        centerZ + target.userData.cellDepth * 0.5
                    );
                    const distance = Math.hypot(position.x - pointX, position.z - pointZ);
                    if (distance < bestDistance) {
                        bestDistance = distance;
                        bestPoint.set(pointX, target.userData.impactY, pointZ);
                    }
                }
                return bestPoint;
            }

            function flatDistance(a, b) {
                return Math.hypot(a.x - b.x, a.z - b.z);
            }

            function updateBossUI() {
                if (!boss) return;
                const ratio = Math.max(0, boss.userData.hp / boss.userData.maxHp);
                const displayHp = Math.max(0, Math.ceil(ratio * CONFIG.bossDisplayHp));
                ui.bossFill.style.width = `${ratio * 100}%`;
                ui.bossText.textContent = `${displayHp.toLocaleString()} / ${CONFIG.bossDisplayHp.toLocaleString()}`;
            }

            function showDamage(worldPosition, text, big) {
                const p = worldPosition.clone().add(new THREE.Vector3((Math.random() - 0.5) * 0.8, 2.4 + Math.random(), 0));
                p.project(camera);
                const div = document.createElement("div");
                div.className = `damage${big ? " big" : ""}`;
                div.textContent = text;
                div.style.left = `${(p.x * 0.5 + 0.5) * innerWidth}px`;
                div.style.top = `${(-p.y * 0.5 + 0.5) * innerHeight}px`;
                document.getElementById("damage-layer").appendChild(div);
                setTimeout(() => div.remove(), 850);
            }

            function updateUI() {
                ui.coin.textContent = coins;
                ui.power.textContent = power.toLocaleString();
                syncCarriedCoins();
            }

            function syncCarriedCoins() {
                if (!coinBack) return;
                const shown = Math.min(12, Math.max(0, coins));
                while (coinBack.children.length > shown) {
                    coinBack.remove(coinBack.children[coinBack.children.length - 1]);
                }
                while (coinBack.children.length < shown) {
                    const index = coinBack.children.length;
                    const mesh = new THREE.Mesh(shared.coin, shared.coinMat);
                    mesh.scale.setScalar(0.92);
                    const row = Math.floor(index / 3);
                    const col = index % 3;
                    mesh.position.set((col - 1) * 0.28, row * 0.16, 0.08);
                    mesh.rotation.set(Math.PI / 2, 0, 0.12);
                    coinBack.add(mesh);
                }
                coinBack.visible = shown > 0;
            }

            let toastTimer;
            function toast(text) {
                clearTimeout(toastTimer);
                ui.toast.textContent = text;
                ui.toast.classList.add("show");
                toastTimer = setTimeout(() => ui.toast.classList.remove("show"), 1500);
            }

            function showEndScreen() {
                ctaOpen = true;
                endScheduled = true;
                stick.x = 0;
                stick.z = 0;
                stick.magnitude = 0;
                keys.w = keys.a = keys.s = keys.d = false;
                if (joystick) {
                    joystick.destroy();
                    joystick = null;
                }
                document.querySelectorAll(".nipple").forEach(node => node.remove());
                ui.end.classList.add("show");
            }

            function setupInput() {
                if (window.nipplejs) {
                    joystick = nipplejs.create({
                        zone: document.body,
                        mode: "dynamic",
                        color: "white",
                        size: 105
                    });
                    joystick.on("start", startGame);
                    joystick.on("move", (evt, data) => {
                        if (ctaOpen) return;
                        const angle = data.angle.radian;
                        stick.x = Math.cos(angle);
                        stick.z = -Math.sin(angle);
                        stick.magnitude = Math.min(1, data.distance / 42);
                    });
                    joystick.on("end", () => {
                        stick.x = 0;
                        stick.z = 0;
                        stick.magnitude = 0;
                    });
                }
                addEventListener("keydown", event => {
                    const key = event.key.toLowerCase();
                    if (key === "w" || event.key === "ArrowUp") keys.w = true;
                    if (key === "s" || event.key === "ArrowDown") keys.s = true;
                    if (key === "a" || event.key === "ArrowLeft") keys.a = true;
                    if (key === "d" || event.key === "ArrowRight") keys.d = true;
                    if (keys.w || keys.a || keys.s || keys.d) startGame();
                });
                addEventListener("keyup", event => {
                    const key = event.key.toLowerCase();
                    if (key === "w" || event.key === "ArrowUp") keys.w = false;
                    if (key === "s" || event.key === "ArrowDown") keys.s = false;
                    if (key === "a" || event.key === "ArrowLeft") keys.a = false;
                    if (key === "d" || event.key === "ArrowRight") keys.d = false;
                });
                addEventListener("pointerdown", startGame, { once: true });
                addEventListener("resize", onResize);
                const restart = document.getElementById("restart");
                const reloadGame = event => {
                    event.preventDefault();
                    event.stopPropagation();
                    location.reload();
                };
                restart.addEventListener("pointerdown", event => event.stopPropagation());
                restart.addEventListener("pointerup", reloadGame);
                restart.addEventListener("click", reloadGame);
                const replay = document.getElementById("replay");
                const download = document.getElementById("download");
                const replayGame = event => {
                    event.preventDefault();
                    event.stopPropagation();
                    location.reload();
                };
                replay.addEventListener("pointerdown", event => event.stopPropagation());
                replay.addEventListener("pointerup", replayGame);
                replay.addEventListener("click", replayGame);
                download.addEventListener("pointerdown", event => event.stopPropagation());
                download.addEventListener("click", event => {
                    event.preventDefault();
                    event.stopPropagation();
                    window.open("https://play.google.com/store/apps/details?id=com.farlightgames.samo.gp", "_blank");
                });
            }

            function startGame() {
                if (firstInput || ctaOpen) return;
                firstInput = true;
                phase = PHASE.START_COINS;
                openingGuide.started = true;
                openingGuide.idle = 0;
                openingGuide.startZ = player.position.z;
                openingGuide.lastPosition.copy(player.position);
                setOpeningTutorialVisible(true);
                ensureAudio();
            }

            function setOpeningTutorialVisible(visible) {
                if (openingGuide.complete || openingGuide.visible === visible) return;
                openingGuide.visible = visible;
                if (visible) {
                    ui.tutorial.style.display = "flex";
                    requestAnimationFrame(() => {
                        if (!openingGuide.complete && openingGuide.visible) {
                            ui.tutorial.style.opacity = "1";
                        }
                    });
                } else {
                    ui.tutorial.style.opacity = "0";
                }
            }

            function updateOpeningGuide(dt, elapsed) {
                if (openingGuide.complete) return;
                const startMine = mineGates["mine-start"];
                if (startMine && startMine.userData.alive) {
                    const pulse = Math.sin(elapsed * CONFIG.openingGuidePulseSpeed);
                    startMine.userData.gateMaterial.emissiveIntensity =
                        openingGuide.baseEmissiveIntensity + pulse * CONFIG.openingGuidePulseAmount;
                }
                if (!openingGuide.started || !firstInput || phase === PHASE.WAITING) return;

                const moved = flatDistance(player.position, openingGuide.lastPosition);
                if (moved > CONFIG.openingGuideMoveEpsilon) {
                    openingGuide.idle = 0;
                } else {
                    openingGuide.idle += dt;
                }

                const forwardDistance = openingGuide.startZ - player.position.z;
                if (openingGuide.visible && forwardDistance >= CONFIG.openingGuideForwardDistance) {
                    setOpeningTutorialVisible(false);
                } else if (!openingGuide.visible && openingGuide.idle >= CONFIG.openingGuideIdleDelay) {
                    openingGuide.startZ = player.position.z;
                    openingGuide.idle = 0;
                    setOpeningTutorialVisible(true);
                }
                openingGuide.lastPosition.copy(player.position);
            }

            function completeOpeningGuide() {
                if (openingGuide.complete) return;
                openingGuide.complete = true;
                openingGuide.visible = false;
                const startMine = mineGates["mine-start"];
                if (startMine && startMine.userData.gateMaterial) {
                    startMine.userData.gateMaterial.emissiveIntensity = openingGuide.baseEmissiveIntensity;
                }
                ui.tutorial.style.opacity = "0";
                setTimeout(() => {
                    if (openingGuide.complete) ui.tutorial.style.display = "none";
                }, 400);
            }

            function ensureAudio() {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) audioCtx = new AudioContext();
                }
                if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
            }

            function playSound(type) {
                if (!audioCtx) return;
                const now = audioCtx.currentTime;
                if (type === "break" || type === "bossDeath") {
                    const length = type === "bossDeath" ? 0.7 : 0.25;
                    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * length, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
                    const source = audioCtx.createBufferSource();
                    const gain = audioCtx.createGain();
                    source.buffer = buffer;
                    source.connect(gain);
                    gain.connect(audioCtx.destination);
                    gain.gain.setValueAtTime(type === "bossDeath" ? 0.22 : 0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + length);
                    source.start(now);
                    return;
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                let start = 300, end = 120, duration = 0.12, volume = 0.04, wave = "sine";
                if (type === "coin") { start = 850; end = 1250; duration = 0.08; volume = 0.035; }
                if (type === "attack") { start = 430; end = 170; duration = 0.1; wave = "triangle"; }
                if (type === "crack") { start = 680; end = 145; duration = 0.16; volume = 0.055; wave = "triangle"; }
                if (type === "ice") { start = 920; end = 530; duration = 0.13; volume = 0.025; wave = "sine"; }
                if (type === "warn") { start = 180; end = 100; duration = 0.22; volume = 0.06; wave = "sawtooth"; }
                if (type === "hit") { start = 120; end = 45; duration = 0.14; volume = 0.07; wave = "square"; }
                if (type === "upgrade") { start = 420; end = 980; duration = 0.42; volume = 0.07; }
                if (type === "boss") { start = 105; end = 52; duration = 0.75; volume = 0.11; wave = "sawtooth"; }
                osc.type = wave;
                osc.frequency.setValueAtTime(start, now);
                osc.frequency.exponentialRampToValueAtTime(Math.max(1, end), now + duration);
                gain.gain.setValueAtTime(volume, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
                osc.start(now);
                osc.stop(now + duration);
            }

            function updateCamera(dt) {
                const bossInFrame = boss && boss.userData.alive &&
                    (phase === PHASE.BOSS_PRESSURE || phase === PHASE.BOSS_FINAL) &&
                    flatDistance(player.position, boss.position) < 18;
                const velocityLead = moveVelocity.clone().multiplyScalar(0.16);
                const desiredFocus = player.position.clone()
                    .add(velocityLead)
                    .add(new THREE.Vector3(0, 0.85, bossInFrame ? -4.8 : -3.8));
                if (bossInFrame) {
                    const midpoint = player.position.clone().lerp(boss.position, 0.28);
                    desiredFocus.x = THREE.MathUtils.lerp(desiredFocus.x, midpoint.x, 0.42);
                    desiredFocus.z = THREE.MathUtils.lerp(desiredFocus.z, midpoint.z, 0.42);
                }
                cameraFocus.lerp(desiredFocus, 1 - Math.exp(-6.5 * dt));
                cameraMinePunch = Math.max(0, cameraMinePunch - dt * 1.6);
                const punchScale = 1 - cameraMinePunch * 0.085;
                const desired = cameraFocus.clone().add(new THREE.Vector3(
                    0,
                    (bossInFrame ? 27 : 25.5) * punchScale,
                    (bossInFrame ? 20 : 18.5) * punchScale
                ));
                camera.position.lerp(desired, 1 - Math.exp(-7.5 * dt));
                if (cameraShake > 0) {
                    cameraShake = Math.max(0, cameraShake - dt * 1.7);
                    camera.position.x += (Math.random() - 0.5) * cameraShake;
                    camera.position.y += (Math.random() - 0.5) * cameraShake * 0.5;
                }
                camera.lookAt(cameraFocus);
            }

            function updateBillboards() {
                for (const entity of targets) {
                    if (!entity.userData.alive || !entity.userData.healthFill) continue;
                    entity.children.forEach(child => {
                        if (child.geometry && child.geometry.type === "PlaneGeometry") child.quaternion.copy(camera.quaternion);
                    });
                }
            }

            function update(dt, elapsed) {
                if (ctaOpen) {
                    updateLockedCoins(dt, elapsed);
                    updateEffects(dt, elapsed);
                    return;
                }
                updateOpeningGuide(dt, elapsed);
                if (phase !== PHASE.WAITING) {
                    updatePlayer(dt, elapsed);
                    updateEnemies(dt);
                    updateProjectiles(dt);
                    updateCoins(dt, elapsed);
                    updateEggPickup(dt, elapsed);
                    updateZones(dt);
                    updateDragon(dt, elapsed);
                    updateHazards(dt);
                    if (phase === PHASE.COMPLETE && !endScheduled &&
                        flatDistance(player.position, new THREE.Vector3(0, 0, 4)) < 8) {
                        campReturnTimer += dt;
                        if (campReturnTimer >= CONFIG.ctaCampFallback) triggerCtaFromUpgrade();
                    }
                }
                updateLockedCoins(dt, elapsed);
                updateEffects(dt, elapsed);
                updateCamera(dt);
                updateBillboards();
                updateGuideArrow();
            }

            function animate() {
                requestAnimationFrame(animate);
                const dt = Math.min(clock.getDelta(), 0.033);
                update(dt, clock.elapsedTime);
                renderer.render(scene, camera);
            }

            function onResize() {
                camera.aspect = innerWidth / innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(innerWidth, innerHeight);
                renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
            }

            init();
        })();
    </script>
</body>
